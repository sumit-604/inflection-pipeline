one_line_verdict: "Fast-growing precision manufacturer whose growth, margin and cash story are still mostly one customer deep."
analyst_note: "The most important number is not FY26 revenue growth (573%) but Rs 3,706L PAT against Rs (1,076)L operating cash flow (RHP p.256/p.30). That gap, plus 93.22% receivables/revenue and 47.02% single-customer concentration where the customer is also a part-owned investee, means FY26 margin/growth should not be extrapolated without evidence the concentration is normalising. Three RHP receivables ratios disagree (93.22% closing, 48.90% average, 178-day narrative) — downstream must not silently pick the most favourable."
