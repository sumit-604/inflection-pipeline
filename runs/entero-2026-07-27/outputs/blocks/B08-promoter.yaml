verdict_basis: "No legal/regulatory red flags and zero pledge, but the audited AR itself carries an unreconciled ~2x CEO pay figure, CEO/COO pay rose ~116% against ~21.3% profit growth (opposed by ~1/3 of institutional AGM votes), a ~Rs460.5M subsidiary loan write-off has no disclosed rationale, and CFO/CS/senior-exec/board turnover clustered within a year of listing -- offset by credible new institutional entry and professional replacement hires."
analyst_note: "OrbiMed Asia III Mauritius is formally disclosed as 'Promoter' in the AR RPT note, not merely 'Equity Investor' -- Prasid Uno Family Trust carries the investor label instead. Treat Prabhat Agrawal and Prem Sethi as the operating promoters for conduct purposes; OrbiMed's board seats are institutional oversight, not founder conduct, and should not be scored against the founders. The Rs47.27M vs Rs94.50M CEO-pay discrepancy and the Curever rationale gap are both answerable questions for management that the AR does not resolve; recommend the operator raise both directly rather than treating either as resolved by this search pass."
