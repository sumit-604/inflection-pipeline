analyst_note: >
  The single most important Pass 2 result: consolidated retained earnings did
  not fall to -Rs 826.70 Cr because SSWL lost money. Profit was positive both
  years. It fell because two large, sequential, cross-referenced-nowhere
  transfers moved money out of retained earnings and into two different
  reserve buckets (General Reserve in FY25, a new Capital Reserve in FY26),
  both almost certainly tracing to the AMW NCLT transaction the FY26 AR does
  not carry the FY24 detail for. A second, separate consolidation-only
  reserve (Capital Revaluation Reserve, Rs 34.84 Cr) sits against the
  company's own "no revaluation" statement and likely shares the same root
  cause. Stage 3/5/8 should treat these as one open question, not two or
  three: what did the AMW acquisition/resolution-plan accounting actually
  do to consolidated equity across FY24-FY26, and why does no note anywhere
  connect the dots the company's own numbers otherwise draw clearly. The
  FY25 AR (not in this corpus) is the most direct way to close this.
