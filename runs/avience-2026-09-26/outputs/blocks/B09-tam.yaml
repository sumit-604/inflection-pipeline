analyst_note: "Central finding: management's FY26-FY28 guided CAGR (75.9%) outruns the evidence-based aggressive-case SOM3yr CAGR (43.4%) over a longer window, most likely because the ~Rs 47 Cr Uttarakhand order is a lumpy, largely one-off government contract, not a repeatable share gain. Stage 11 should carry the SOM-implied CAGR (43.4% yr3 / 38.7% yr5) as the cross-check and treat guidance growth as order-driven pending a second comparable win. SAM rests on two named judgment calls (32% North-India geography proxy from a diagnostics-SERVICES market share, and a 50% channel/capability discount) rather than filed percentages; both are disclosed in-line rather than smoothed into the headline numbers."
