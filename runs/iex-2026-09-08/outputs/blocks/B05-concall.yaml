credibility_grade: "C"
credibility_basis: "8 testable promises across four calls: 2 delivered, 3 partial, 3 missed. Genuine positives exist (conservative and beaten IGX Q1FY27 guidance, one unhedged admission on the TAM contract delay, granular and consistent BESS/coal disclosure), but the single most load-bearing number in the entire corpus — the market coupling DAM impact estimate — was given only once, verbally, in prepared remarks, never repeated under direct follow-up questioning in the same call, and appears in no audited filing. The REC-market excuse was recycled unresolved across two quarters against a worsening trend. The rising non-operating share of PBT (23.4% FY26 to 29.8% Q1FY27) and the IGX OFS valuation/proceeds were never raised by either analysts or management on any call."
