analyst_note: "Two corrections to carry forward: (1) B02's AOC-2/Note 34 rent-income gap is ~1.95x, not ~19.5x (a 10x Lakh/Million conversion error) - the disclosure-integrity concern stands, the magnitude does not. (2) The Spear brief's ~Rs 275 Cr net cash decline is contradicted under every year-pairing in this AR: cash rose ~Rs 9.7 Cr in FY26 and fell only ~Rs 26.5 Cr in FY25; cash-flow team should re-verify the source of the Spear figure before it anchors any valuation input. New finding beyond B01/B02 scope: the Chairman's and MD's letters repeatedly call the US entity 'our subsidiary' while Board's Report Item 13 states no subsidiary exists - resolve before Halt 1."
