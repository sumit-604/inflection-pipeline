flags:
- type: FLAG-CASH
  reason: 'DSCR fell to 0.99x FY26 from 1.28x FY25 (Schedule III mandatory ratio note,
    standalone Note 52); company gives no explanation despite the move exceeding its
    own 25% variance-disclosure trigger. DSCR is named as a lender covenant metric
    (Note 53) but the threshold level is not disclosed, so breach proximity cannot
    be determined from this document.'
- type: FLAG-RPT
  reason: 'Related-party feedstock purchases (Nirani Sugars Ltd group) are 72.6% of
    total raw-material purchases FY26 and EXCEED total disclosed purchases FY25 (Rs
    1,073.24 cr RPT vs Rs 1,036.99 cr total, standalone; same pattern consolidated
    and in the prospectus). Related-party trade payables fund 63.9-73.5% of total
    trade payables both years.'
- type: FLAG-DISCLOSURE
  reason: 'Standalone Note 8 discloses a corporate guarantee given to NABARD for subsidiary
    TruAlt Gas Pvt Ltd borrowing; standalone Note 57 (Contingent Liabilities) says
    NIL; standalone Note 38(D)(4) states no guarantees were given or received. Three-way
    internal inconsistency within the same financial statements.'
- type: FLAG-INVENTORY
  reason: 'Standalone inventory grew 155.6% (Rs 204.2cr -> Rs 521.8cr) while standalone
    revenue FELL 9.3% in the same year. Finished goods alone +136.2%. No write-down
    or composition narrative disclosed.'
