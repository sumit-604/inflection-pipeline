analyst_note: "Loop 1 fixes one factual error and adds two probes. The 22.92 pp YoY gross-margin fall splits about three-fifths goods spread (13.51 pp) and two-fifths lost tolling mix (9.42 pp). In rupees, lost tolling gross profit (28.55 Cr) is the largest single item, so 'not a mix artifact' was wrong. Spread is still the larger share, so input cost versus group transfer pricing stays open; Q3 EBITDA per MW sold separates them. The 85.42 Cr cash is not proven free: 89.94 Cr of unexplained other current liabilities sit against it (net about -4.52 Cr), whether the line is a parent advance or a third-party obligation. The scheme multiple is not computable: consideration NOT FOUND, and the earnings base spans 12.3x between the FY26 quarterly average and Q2 FY27. A board whose administration sits in Waaree's group approved the scheme inside the trough quarter, so the valuers' base year and method weights decide minority value. The 1.91x H1 CFO/PAT should not be banded. Verdict PROCEED WITH FLAGS stands; extract the scheme filing before any valuation."
