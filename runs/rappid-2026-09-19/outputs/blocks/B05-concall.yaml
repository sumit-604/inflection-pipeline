analyst_note: "Round 2 correction. The structural pattern from round 1 stands: a numeric growth target (50% CAGR, Feb-2025) was set with no stated allowance for commodity-price and PSU-execution-timing risk management itself later calls structural, and the same pattern repeats at Jun-2026 with the FY27 '50% or more' figure. This round adds texture that argues the FY26 miss is not purely an external shock: a live capex figure that did not match the audited number, a written WC explanation that conflicts with the CMD's own spoken account, and a Rs119Cr tender pipeline that vanished from disclosure. Grade C holds; promise-delivery tally revised to 1 delivered, 2 partial, 2 missed (was 1/1/3) because the Jul-2025 'acceleration' claim genuinely held for one quarter (Q2 FY26 +47.8% QoQ) before H2 reversed it. Countervailing evidence is real: the marine/naval mix shift is AR-corroborated and the Q1 FY27 FSS orders are genuine, PO-backed. Q1 FY27's +28% YoY pace sitting well under the run-rate a 50%+ full year requires remains the central monitorable, testable at the H1 FY27 print with no inference required."
