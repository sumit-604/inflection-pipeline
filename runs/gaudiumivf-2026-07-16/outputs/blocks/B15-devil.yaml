  - "Shared single-point-of-failure catalyst: Rs 0 of Rs 50 Cr hub-capex deployed at 31-Mar-2026. One execution slip unearns the +2x growth premium, prevents the receivables fix from printing (0.80x -> 0.65x), and leaves ROCE at reported ~20% (base 17.5x) simultaneously, re-rating the destination from 22x toward the ~14x RRM floor (base FV ~Rs 181 -> ~Rs 111 or below)."
  - "The WATCHLIST entry is largely self-defeating: the only realistic path for a stock up 73% from its Rs 79 IPO to fall 32% to Rs 90-93 is a thesis-broken trigger firing, which the ENTRY CONJUNCTION then withdraws. The clean entry the thesis waits for may never exist."
