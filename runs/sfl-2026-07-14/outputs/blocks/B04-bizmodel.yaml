irrelevant_ratios:
  - {ratio: "Price/Book or reported ROE/ROCE in isolation", why: "distorted by KEL-merger goodwill/brand intangibles; reported ROCE 10%/9% vs Cash ROCE 21%/18% FY26"}
  - {ratio: "Reported EPS alone", why: "reported EPS Rs14.6 vs Cash EPS Rs35.2 FY26 due to non-cash D&A/deferred tax from purchase price allocation"}
  - {ratio: "Gross margin as standalone profitability signal", why: "42-44% gross margin vs ~10-11% Core EBITDA margin gap is structural (freight, advertising, distribution), not a red flag by itself"}
  - {ratio: "Static Debt/Equity ratio", why: "FY22 standalone was debt-free; FY26 shows active net-debt post-merger, a single-point ratio is stale without the trend"}
  - {ratio: "FY22 AR 'Interest Coverage Ratio' (0.03x/0.04x)", why: "appears mislabeled/inverted; not usable as an anchor"}
must_track_metrics:
  - {metric: "Core EBITDA margin (ex-forex MTM)", healthy: "10-12%, FY26 run-rate 10.7-10.8%", red_flag: "sustained fall below ~8% (FY25 trough)"}
  - {metric: "Gross margin, quarter over quarter", healthy: "42-44% standalone range", red_flag: "sequential drop >200bps unexplained by RM/pricing"}
  - {metric: "Cash ROCE (EBIT / operating capital employed ex-goodwill/brands)", healthy: "18-21% (FY26 level)", red_flag: "converging toward reported ROCE (9-10%)"}
  - {metric: "Net debt trend", healthy: "sustained reduction (Rs156cr in FY26)", red_flag: "reduction stalling or reversing"}
  - {metric: "Working capital days (inventory + receivables - payables)", healthy: "cash conversion cycle ~20-30 days (FY22 standalone ~24 days)", red_flag: "material CCC extension"}
unit_economics:
  unit: "one mattress unit (also tracked: one tonne of foam)"
  revenue_per_unit: "~Rs4,055 per mattress unit; ~Rs2.50 lakh per tonne of foam (FY26 standalone, computed from Inv. Pres. slide 15)"
  margin_per_unit: "NOT FOUND — unit-level cost/margin not disclosed; only blended Core EBITDA margin (~10.7-10.8% FY26) available"
  key_lever: "Volume growth against a largely fixed manufacturing/opex base — Q4 FY26 revenue +24% YoY drove Core EBITDA margin +407bps, evidencing strong operating leverage"
first_deterioration_signals:
  - {risk: "E-commerce/D2C channel disintermediation of dealer network", first_signal: "dealer/EBO net additions slowing or e-commerce growth decelerating"}
  - {risk: "Polyol/TDI price spike without pass-through", first_signal: "gross margin decline quarter over quarter"}
  - {risk: "Post-KEL-merger leverage/integration cost overrun, goodwill impairment", first_signal: "net debt trend stalling/rising; Cash ROCE converging toward reported ROCE"}
  - {risk: "Sleepwell/Kurlon channel conflict or cannibalization", first_signal: "combined mattress volume growth diverging from brand-level trajectory or dealer attrition"}
  - {risk: "Unorganized-market/counterfeiting persistence and bulky-product logistics cost structure", first_signal: "distribution/freight cost as % of revenue rising instead of falling with scale"}
mgmt_questions:
