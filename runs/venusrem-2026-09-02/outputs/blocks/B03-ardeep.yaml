  - "Financial-oversight role concentration: Pawan Chaudhary signs every financial statement as 'Managing Director & CFO' and sits on the 3-person Audit Committee reviewing those statements and the RPTs above."
  - "Two same-filing self-contradictions on substance: MD&A 'robust Risk Management Committee' vs CG Report 'Risk Management Committee is not applicable'; Board's Report/MD&A 'no exceptional items in either direction' vs the audited P&L's own Rs9.91 Cr FY25 exceptional item."
