analyst_note: "2026-09-09 addendum: the most consequential correction is the Rs 421.14 lakh reclassification (Item 1). It is exactly offsetting in BOTH standalone and consolidated statements, ruling out coincidence and confirming a deliberate, undisclosed classification decision behind generic Note 47 boilerplate. It changes which cost line looks responsible for FY26's cost growth: other expenses growth reads nearly 2x faster on the restated base than the originally-printed FY25 base; employee cost growth reads 8-9pp slower. Combined with the FY25 exceptional Penta gain sitting silently in the comparative base (Item 2), any reader of AR FY26 alone works from a P&L base differing from AR FY25's own printed numbers in two material, undisclosed ways. Downstream stages using AR FY26 alone for YoY cost commentary should flag this. The Varos net-worth correction (Item 4a) is a basis issue, not a new fact: Rs 5.56 Cr (own net worth, AOC-1) and Rs 6.96 Cr (share of consolidated net assets, Note 45) are both real; pick the one matching the question asked." # <=200 words
