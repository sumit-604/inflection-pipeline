analyst_note: "Management's macro TAM citations (Rs1,917-2,320cr total wine, Rs500-600cr RTD) are accurate; independent search corroborates the total-wine figure almost exactly. The inflation sits one level down, in the SHARE claim built on top: applying management's own market-size source to its own audited revenue gives 9.4%, not '1/3.' Vision 2030 (Rs500cr FY30) requires 28.9% CAGR against a SOM-supported ~9%, a ~Rs265cr capacity ceiling, and a same-belt peer (Sula) disclosing a flat, not accelerating, 2-year category trend. mgmt_claim_ratio (1.9x) understates the gap; the required-CAGR-multiple (~3.2x) is the more decision-relevant read for Stage 11."
