one_line_verdict: "Made-to-order piping supplier with a real order book and new capacity, narrow moat, fixed-price contracts, 263-day cash cycle; margin comes from procurement and overhead leverage, not pricing."
analyst_note: "Sector cap check: this is product supply from own plants (point-in-time revenue, erection 0.14% of standalone), not site EPC. 'Power' appears twice: power SECTOR is a customer end-market (about 60-65% of orders); power SEGMENT is 4.9% biomass, loss-making. Cap row 'Cables / Industrial products' is a loose fit. FY26 EBITDA gain came from overhead leverage (employee 19.5% to 16.4% of revenue); gross margin fell 65.0% to 58.1% as material-supplied power jobs grew. Two readings of margin: (a) leverage persists and margin reaches 19%; (b) the mix shift holds gross margin lower and overheads re-grow. H2 FY27 margin and gross profit rupees separate them. Q2 power division revenue fell 75% QoQ, unexplained. inputs/other/Annual_Report_2025.txt exists though B03 logged the FY25 AR absent."
