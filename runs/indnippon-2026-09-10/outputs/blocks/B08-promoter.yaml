verdict_basis: "The dual-MD interlock (Arvind Balaji, MD of both INEL and Lucas TVS) sits atop a Rs 264.12 cr stake, 32.2% of net worth and the sole FY26 Key Audit Matter, valued on an undisclosed EBITDA input at a flat 8x multiple two years running, with INEL's ownership percentage of Lucas TVS never disclosed anywhere; this single unresolved verification gap, not any adverse finding, is what caps the verdict at CAUTION rather than TRUSTWORTHY."
analyst_note: "WebSearch was unavailable for this entire session; findings lean more heavily on WebFetch and the corpus than a normal Stage 8 run would. Two positives worth surfacing: Wikipedia's TVS Group page independently names Southern Roadways Private Ltd as one of the group's three holding companies, matching Note 42.1's related-party list exactly, which corroborates that INEL's RPT universe sits inside the real TVS Group structure rather than an invented one. And Note 47(g)'s sensitivity disclosure lets one anchored inference through: INEL's attributable share of Lucas TVS's EBITDA is roughly Rs 33 cr (Rs 16.51 cr / 0.5x), though this cannot be grossed to a company-wide figure since INEL's ownership percentage is itself undisclosed. Neither closes the central gap. A future run with working search tools should prioritise: SEBI order search directly, MCA filing pull for Lucas TVS and SB TVS Industrial Ventures, and the primary BSE/NSE shareholding-pattern filing for pledge data."
