one_line_verdict: "A spec-driven fabric maker moving into order-lumpy defence systems with a half-empty new plant, strong H1 FY27 earnings, and unproven cash conversion; revenue split by year supports a defence reading in FY24-FY25 and a mixed reading in FY26."
analyst_note: "Three points a later stage cannot rebuild. (1) Mar 2024 liabilities: customer advance 1,264.61 plus ECFPL consideration 1,118.53 unwound in FY25; they inflate FY24 CFO and depress FY25 CFO, so 3-year CFO/EBITDA is the fair read (14.6%). (2) Deck EBITDA includes other income: FY26 2,076 = 1,878.50 + 197.75; use ex-other-income 28.6% for H1 FY27. (3) The whole unexecuted balance of the 2,371.96 order (about 1,812, derived) is 36.4% of H1 FY27 revenue, so at least 63.6% came from other work. A&D share is end-use, not buyer: government-owned buyers were 15.09% of FY26. H1 FY27 segment mix is NOT FOUND, so the sector-cap row cannot be tested on current data."
