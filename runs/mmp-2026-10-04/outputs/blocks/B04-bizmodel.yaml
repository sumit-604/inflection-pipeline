  - {name: "Aluminium foils (bare, converted, printed; pharma strip and blister)", type: "B2B product sales, spread over bought-in foil stock", pct_of_revenue: 26.1, predictability: "M"}
  - {name: "Aluminium conductors and cables (AAC, AAAC, ACSR, ABC, AL59; LVPC pilot)", type: "tender and project linked B2B sales, state utilities and EPC contractors", pct_of_revenue: 12.1, predictability: "L"}
  - {name: "Polymer insulators (MMP Electricals)", type: "approval gated B2B sales, start-up", pct_of_revenue: 0.3, predictability: "L"}
