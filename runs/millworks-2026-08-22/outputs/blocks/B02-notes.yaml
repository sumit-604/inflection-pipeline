analyst_note: "The single most consequential finding across all three passes is Quick Pay: a 47% customer, funded partly by the company's own converted loan, operationally captive (company staff work at Quick Pay's site, materials ship supplier-to-customer directly), yet outside AS-18 scope. This almost certainly explains most of the FY26 receivables and cash-flow anomalies, but the notes never state the Quick Pay-specific receivable balance, so that link is inferred, not confirmed. Treat accounting_quality 3/10 as reflecting control and disclosure-structure weaknesses documented in the notes themselves, not an assertion of fraud; no auditor qualification exists on any of these items."
