analyst_note: "Neither management claim is a true market TAM: both are Divgi's own revenue targets. The dated FY29-30 target (Rs1,000cr) is used for mgmt_claim_ratio because it is comparable like-for-like to this stage's own SOM (Divgi's captured revenue), not to TAM. The dateless Rs2,050cr slide claim reads 2.90x against the same SOM base and is flagged separately as likely inflated, driven mainly by the non-contracted Rs1,000cr AT segment. Method 2 (bottom-up) and Method 4 (import substitution) could not produce headline figures - two of three inputs each are NOT FOUND, not estimated. TAM/SAM/SOM figures exclude the AT optionality entirely, consistent with not carrying an unresolved probability into core numbers. The Indonesia unit-count correction (35,000 vs context's 70,000) materially affects any capacity-linked reasoning downstream and should be re-verified live in claude.ai."
