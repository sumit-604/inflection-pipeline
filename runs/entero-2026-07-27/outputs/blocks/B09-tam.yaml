analyst_note: "TAM anchored on CRISIL's FY23 pharma-distributor figure (Rs2.70L Cr, RHP Feb-2024) plus an unattributed company MedTech slide; conservative TAM instead uses an independent peer/market-share back-solve (Rs3.72L Cr) per the conservative-bias rule, since it triangulates lower. SOM share-gain path (1.2pp/3yr, 2.0pp/5yr) is deliberately below the framework's 'aggressive' band despite >40% unorganized share, because B04's leverage/goodwill/receivables flags mean execution capacity is not yet proven. The Section 3C capacity gap (~Rs1,000-1,100cr incremental WC funding) is the single most important handoff to Stage 11: it means SOM revenue capture is financing-constrained, not market-constrained."
