credibility_grade: "C"
credibility_basis: "At the low end of the C band, one step from D. Revenue, margin, order-inflow and standalone D/E guidance were genuinely delivered or beaten across all 4 calls, arguing against D. But this run adds two load-bearing findings that tighten rather than lift the grade: (1) a repeated, valuation-relevant evasion -- whether the margin beat is a one-off, asked twice by the same analyst, answered both times with an unrelated project list, never yes or no; (2) a clean, quantifiable FALSE statement (Feb-2026: 'we were always guiding 10% to 15%, our growth is much more than that', directly contradicted by the SAME call's own 9M growth of 7.6% standalone / 8.7% consolidated, both below the claimed range). These sit alongside run 2's findings: total 4-call silence on fraud/IFC-qualification/NHAI-termination/leadership-churn/contingent-liabilities, a widening set of unreconciled figures, a disclosure-completeness trend that got WORSE across the 4 calls (zero consolidated-debt/EBITDA/PAT disclosure in the most recent call, the SAME call that discloses 100% IPO-proceeds exhaustion and royalty cessation as an aside one quarter before an Rs859cr FY27 equity ask), and a cash/FDR erratum now correctly measured at ~71% overstatement (corrected this run from run 2's 41.5%, which answered a different question). Would move to D: another quarter of zero consolidated disclosure, a second outright false statement, or the margin-sustainability question resolving into a confirmed unflagged one-off. Would move to B: full consolidated disclosure restored for 2 consecutive quarters, a direct answer to the one-off question, and reconciliation of the shifting equity/order-inflow figures onto one consistent basis across 2+ calls."
