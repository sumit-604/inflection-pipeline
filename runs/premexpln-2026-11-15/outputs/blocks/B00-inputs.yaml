load_bearing_facts:
- 'Guidance vs delivery: FY27 guide Rs 600-700 cr revenue at 15-20% margin. H1 FY27 delivered Rs 247.84 cr at 9.3% EBITDA margin. The FY26 guide of Rs 500 cr delivered Rs 388 cr. Verify the H2 run rate against the filed segment results.'
- 'Cash conversion: FY26 operating cash flow Rs -1 cr against PAT Rs 45.8 cr. H1 FY26 PAT included Rs 28.96 cr other income. Verify the receivables, contract assets and other income notes in the FY26 annual report.'
- 'Control change and related parties: the Apollo Micro Systems SPA (9 Jul 2026, 41.33%, Rs 1,550 cr) is pending close. Apollo also owns IDL Explosives. Verify SPA terms, non-compete, board changes and post-close related-party transactions.'
- 'Safety and licences: accidents hit the Katepally rocket motor plant and the Peddakandukur flares plant, with licences suspended and later restored. Katepally recommissioning was targeted for Sept-Nov 2026. A Rs 18.9 cr export order was cancelled in April 2026 on licence refusal. Verify incident disclosures, licence status and export licence cover for the export book.'
