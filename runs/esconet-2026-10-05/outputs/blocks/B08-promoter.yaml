verdict_basis: "No SEBI, court or criminal record against the promoters and no pledge; but an independent director owned 99% of an acquired company, pay doubled on flat profit, the AR omits the IPO-linked tax summons, and the promoter group sold shares."
analyst_note: "CAUTION, not CONCERN, because nothing here proves wrongdoing and no deal-breaker fires. Two readings: (A) a founder family with sloppy SME-grade disclosure and self-serving pay; (B) an IPO conduct problem that the ITD summons is testing. The observation that separates them is what the summons produces (any demand, SEBI referral, or a named pre-IPO allottee tie to promoters), plus the Fluidech valuation basis and audit committee approval. Warrant allottees walked away at Rs 345 while the stock trades near Rs 192 to 231, so lapse is explainable on price alone [INFERENCE]. Upgrade to CONCERN on any ITD demand, a second unexplained promoter sale, or an RPT approval gap on Fluidech. The 1,36,000 share fall after 30 Jun is derived from AGM voting data only. Size position as the margin of safety, not the input."
