going_concern_language: "NONE beyond boilerplate ('prepared on a going concern basis') in both directors' responsibility statements and both auditor's reports; no material-uncertainty-related-to-going-concern paragraph in either report; no subsequent-events note format exists anywhere in the AR; both auditor's reports separately state there are no Key Audit Matters. Confirmed by full-text search across the entire AR, repeated in Pass 3."
analyst_note: >
  Pass 3's one material addition: the AR's own Note 2.04(C) business-combination
  policy carries a pooling-of-interest/common-control method whose clauses on
  retained-earnings aggregation and "revenue reserves/capital reserves"
  differences read as a near-exact mechanical match to the two unexplained
  reserve transfers (Rs 674.68 Cr FY25, Rs 364.52 Cr FY26) Pass 1/2 found. No
  note confirms this method, rather than the stated default acquisition
  method, was applied to AMW, and no Ind AS 103 purchase-price-allocation note
  for AMW exists anywhere in this AR. This is the closest the document comes
  to self-explaining its largest disclosure gap, and it remains unconfirmed.
  Also new: AACL's land came via a demerger from Asia Motor Works Limited and
  is unregistered in AACL's name; a Rs 100 Cr HDFC loan funded part of the
  AMW acquisition; and both auditor's reports found zero Key Audit Matters
  despite this cluster of judgment-heavy items. Stage 3/5/8 should treat the
  AMW reserve/DTA/land/net-asset cluster as one open question, and the FY25
  AR (not in this corpus) as the most direct way to close it.
