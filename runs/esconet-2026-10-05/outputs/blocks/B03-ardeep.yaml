one_line_verdict: "Real growth and a visible margin step-up, but the proof gate (durable margin plus cash conversion plus clean governance) is unfired, and the Fluidech chain and the unmentioned IPO summons carry the weight."
analyst_note: "Quality 4.0 of 10. Stage 3 added three findings stage 2 lacked. (1) The FY25 cash flow was re-cut in the FY26 AR (CFO +5.10 became (1,751.68)); on one basis six-year CFO is negative. (2) The prospectus shows the Fluidech seller held 99% of it while an independent director, with a 235.16 Lakhs tax demand pending. (3) The Q1 FY27 margin jump is a standalone gross margin event (29.2% vs 13.7% FY26), not other income; management credits hardware price volatility and inventory in part. Two readings: structural HexaData mix, or a one-time price and stock gain. Separating observation: HexaData revenue and margin by line plus Q2 FY27 gross margin after stock replacement. Conservatism belongs in position size, not in the projection. The s.186 remark may be an over-report because s.186(11) exempts wholly owned subsidiary loans; counsel should read it."
