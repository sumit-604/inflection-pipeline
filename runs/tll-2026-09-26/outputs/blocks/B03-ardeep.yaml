strengths_top3:
  - "Genuine, broad-based, audited revenue/EBITDA/PAT growth (+48%/+89%/+84%) with expanding margins and a coherent, AOC-1-confirmed strategic model, strongest at the Trident Mediquip vertical specifically."
  - "Clean CARO on the classic hard-stop items: no fraud, no borrowing defaults, no wilful-defaulter status, no cash losses, fully spent CSR, zero whistleblower complaints, 100% board/committee attendance."
  - "Unusually specific and candid MD&A for an SME filer (quantified SWOT, segment mix shifts, explicit admission that subsidiary utilisation is 'currently modest')."
red_flags_top3:
