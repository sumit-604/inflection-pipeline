valuation_methods:
  primary: {method: "EV/EBITDA on EBITDA before other income, built from order book and H1 FY27 operating leverage, converted to normalised earnings for the Section 1B exit PE", why: "Reported earnings are negative; the operating engine is visible only after stripping other income"}
  secondary: {method: "Price to book with land and asset-sale NAV floor", why: "Net worth 35,879 Lakhs; land and investment property fair value exceed carrying value"}
  tertiary: {method: "EV/Sales against MTARTECH, ISGEC, ELECON", why: "Blunt cross-check; margins differ"}
  not_applicable:
    - "PE on trailing earnings (PAT negative, eight loss years in nine)"
    - "Dividend yield (no dividend)"
    - "P/CF and PEG (CFO negative, no earnings base)"
    - "Asset replacement value (old, depreciated plant)"
irrelevant_ratios:
  - "Trailing PE: PAT negative both years"
  - "Printed EBITDA margin 12.9%: 59.4% is other income"
  - "ROE and spot ROCE: negative or 0.6% without other income; swing on one order"
  - "Current ratio: 1.13 printed, 1.08 recomputed, 1.01 Acuite"
  - "Debt to equity 0.61: hides 17.5% cost, 84.7% current, unplaced related-party loans"
  - "Revenue growth +6.2%: India revenue fell 13.5%, export up"
must_track_metrics:
  - {metric: "Order inflow and book-to-bill on one stated order-book definition", healthy: "Above 1.0 over four quarters (Q2 FY27 1.06 derived)", red_flag: "Below 0.9 for two quarters, or not disclosed"}
  - {metric: "Strategic (DNAM) share of revenue and order inflow", healthy: "Rising above 39%", red_flag: "Metric dropped or below 30%"}
  - {metric: "EBITDA before other income, % of revenue", healthy: "Above 8% (H1 FY27 8.8%)", red_flag: "Below 5% (FY26 5.2%)"}
  - {metric: "Other income as share of EBITDA", healthy: "Under 20-30%", red_flag: "Above 40% (FY26 59.4%)"}
  - {metric: "Share of debt due within 12 months and NCD instalments paid on time", healthy: "Below 50%, paid without new bridge debt", red_flag: "Above 75% (FY26 84.7%) or a delayed instalment"}
unit_economics:
  unit: "One rupee of revenue from operations (no unit volume in the AR; order count and size NOT FOUND)"
  revenue_per_unit: "Rs 100 of revenue; Q2 FY27 inflow 99.46 Cr in the quarter (PR 2 Nov 2026)"
  margin_per_unit: "FY26: Rs 5.2 EBITDA before other income per Rs 100; H1 FY27 8.8 per Rs 100 (derived)"
  key_lever: "Operating leverage on a fixed plant: incremental EBITDA margin before other income 25.5% (H1 FY27 vs H1 FY26, derived), partly base effect from the FY26 Foundry lockout"
first_deterioration_signals:
  - {risk: "Order book burns faster than it refills", first_signal: "Quarterly order inflow and book-to-bill"}
  - {risk: "DNA mix not rising", first_signal: "Strategic share of quarterly inflow"}
  - {risk: "Margin rests on other income", first_signal: "Other income as share of EBITDA"}
  - {risk: "Refinancing and 17.5% NCD", first_signal: "Cash ex-warrant money and NCD instalment dates"}
  - {risk: "Old receivables", first_signal: "Over-3-year bucket against allowance"}
  - {risk: "Foundry labour disruption", first_signal: "Foundry and Machine Shop segment revenue"}
  - {risk: "Promoter pledge and related-party funding", first_signal: "Pledge percentage and RPT loan notes"}
mgmt_questions:
  - "Closing order book at 30 Sep 2026 by line; why 871.77 Cr (AR) against 374.56 Cr (Acuite)?"
  - "Order inflow for the last four quarters and the strategic share of each?"
  - "Why did the FY26 AR drop the DNA share, and what is it for FY26 and H1 FY27?"
  - "Nuclear End Shield tender: timeline, bid margin, probability?"
  - "How are the 1,900 Lakhs of FY27 NCD instalments being met and has the Dharwad sale closed?"
