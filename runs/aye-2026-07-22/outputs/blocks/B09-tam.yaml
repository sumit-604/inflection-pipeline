flags:
  - type: FLAG-TAM-COMPANY-COMMISSIONED-SOURCE
    reason: "CRISIL Report is exclusively commissioned and paid for by Aye (Prospectus p.223/614) and is the sole industry-data source in the Prospectus. Independently corroborated in headline scale (₹30-34 lakh crore) by SIDBI (May-2025) and Northern Arc investor material, but methodology/scope differs and was not independently verifiable in full."
  - type: FLAG-TAM-METHOD-DIVERGENCE
    reason: "Bottom-up Method 2 (₹3,17,800cr) sits below top-down Method 1 gap-only (₹4,08,000cr) despite nominally scoping to the same ticket bracket, because Method 2 stacks two unsourced assumptions (25% addressability, digest-sourced blended ticket size). Method 3 peer/unorganised gross-up (₹13,31,000cr) is a further ~3x above Method 1 because it conflates CRISIL's 'total demand' with 'addressable demand.' Neither Method 2 nor Method 3 is used as the headline conservative/realistic TAM; both are retained as bounds/corroboration only, with the divergence explained rather than averaged."
  - type: FLAG-SAM-CUSTOMER-FILTER-UNSOURCED
    reason: "The 70% 'customer' retention filter in the SAM cascade (Section 3A) rests on a labelled estimate, not a CRISIL-sourced split of micro-enterprises by target turnover band. No source found gives this split directly."
  - type: FLAG-SOM-VS-MGMT-ASPIRATION
    reason: "Management's own medium-term AUM CAGR aspiration (~28-33%, operator digest, NON-ANCHORED) runs roughly 1.5-1.8x faster than the SOM-implied 3yr CAGR (18.3%) derived from this stage's disciplined SAM/share-gain-rule framework. Stage 11 should treat management's guidance as the more aggressive case and the SOM-implied figure as the framework-disciplined floor case when setting revenue-growth assumptions for valuation."
  - type: FLAG-CAPACITY-5YR-GAP
    reason: "SOM_5yr AUM (₹14,540cr) exceeds B07's static 84%-headroom capital ceiling (₹13,476cr) by ₹1,064cr. SOM_3yr is sufficiently funded on the current capital base; the 5yr trajectory requires either organic net-worth accretion via retained earnings at the guided 17-20% RoE, or a further capital raise, to avoid breaching the rating agency's gearing sensitivity threshold."
market_definition: "Formal secured (hypothecation, mortgage/LAP) and unsecured business credit to India's informal micro-enterprises, sub-₹10 lakh average ticket, branch-based/cluster-underwritten, delivered by banks, NBFCs and SFBs across 18-21 of India's 36 states/UTs."
