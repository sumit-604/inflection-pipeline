risks_peers_raise:
  - "Geopolitical and rate-volatility risk to cost of funds, explicitly named and monitored by SBICARD and Poonawalla; not named as a qualifier on Kissht's own cost-of-borrowing guidance in either Kissht call."
  - "Explicit ALM (asset-liability mismatch) gap disclosure with a quantified remediation, disclosed by Poonawalla; no comparable ALM statement in either Kissht call despite the unexplained Rs 832 Cr raise (LBF-4)."
  - "Explicit separation of realised cash ROA from unrealised/NPV-based co-lending gain, with the latter flagged as not capital-accretive until realised, disclosed by Ugro; Kissht's own utilised-vs-unutilised FLDG income-quality question (B05 LBF-2) is not framed with comparable explicitness on either Kissht call."
net_narrative_effect: "complicates"
analyst_note: >
  Two of six handed-off claims are CONTRADICTED by peer evidence for the identical quarter
  Kissht made them (cost-of-borrowing tailwind; capital-raise precedent), which is the
  strongest actionable output of this stage. Both cut against management's framing without
  alleging any wrongdoing: peers simply report facts (rising funding costs, numerically
  justified raises at working CRAR levels) that sit uncomfortably next to Kissht's claims.
  Claim 3 (FLDG) is unverifiable for a structural reason worth carrying forward: none of the
  three chosen peers runs a directly comparable FLDG-covered off-book book, so this peer set
  may never be able to triangulate that specific claim regardless of how many future quarters
  are added. The Part 5 hypothesis (a shared "technicality/denominator" rhetorical reflex
  across three separate managements facing rising asset-quality ratios) is offered as a
  pattern to test against a fourth peer or future quarter, not a proven finding.
