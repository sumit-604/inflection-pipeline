  - "The RHP's own restated financials show the Rs 8.89 Lakh 'prior period adjustment' in AR Note 3 relates to FY25, not FY26, and that FY24/FY25 as-filed audited accounts omitted statutory gratuity, bonus and MSME-creditor interest entirely. Why were these corrections made only for the IPO restatement and not disclosed or explained in the FY26 Annual Report as filed?"
  - "Confirm the actual January 2026 GST inspection and goods-seizure event at the Sahibabad premises, its resolution status, and why AR Note 32 discloses only a 'demand notice' rather than the search-and-seizure and confiscation-threat facts stated in the RHP."
  - "Reconcile the Fixed Deposit balances in AR Note 13 (Rs 710.63 Lakhs), Note 16 (Rs 733.58 Lakhs, stated as fully reclassified to Note 13), Note 16's footnote (Rs 14.90 crore total, Rs 1.40 crore liened), and Note 4a's security schedule (Rs 322 Lakhs of FD liens) -- which figure is the correct FY26 closing Fixed Deposit balance?"
  - "The government-revenue share fell from 90.55% to 35.78% of revenue over FY24-FY26 per the RHP, concentrated in a single new Aluminium Rod trading line. Who are the counterparties behind this trading volume and the FY25 customer that alone was 35.53% of that year's revenue, and are any related parties?"
