    values: [{block: B01-gate0, value: "28.4% (inclusive reading) or 47.0% (exclusive reading)"}, {block: B02-notes, value: "41.3% to 47.0%"}, {block: B03-ardeep, value: "47.02% calc = (1,123.97 + 1,711.10) / 6,029.75 Rs Mn"}]
    source: "Annual_Report_2026.pdf Note 34 [page 242], Note 31(c) [page 237]"
    disposition: "B03 re-read the source: the 1,711.10 line excludes the top customer, so top-5 including top-1 is 47.0% (a calculation, the AR prints no percentage). 28.4% is arithmetically excluded (two customers at 10% or more). 41.3% is an equal-split assumption. Use 47.0% [calc]; Verifier A to confirm."
