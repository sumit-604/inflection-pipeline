industry_cross_read:
  demand: "Resilient in pharma/API specifically, softer in adjacent CDMO/agrochemical and domestic-ethanol segments, with geopolitically-driven finalisation delays at the margin across all three peers; not a broad-based capex race matching Fabtech's 'unprecedented opportunity' framing."
  pricing_inputs: "Sector-wide cost pressure confirmed (steel/metal cost, raw material, execution-site cost escalation from delay), explicitly called industry-wide not company-specific by SETL; no peer shows pricing power fully offsetting it; magnitude of Fabtech's stated inflation (33%/43%) unconfirmed and looks large next to PRAJIND's quantified 1-1.5% analogue."
  capex_cycle: "Mixed, not uniform: SETL and HLEGLAS are expanding via inorganic/geography diversification (C2C, Omeras, data-centre GScale, Middle East sales build-out); PRAJIND is holding capex steady and absorbing cost pressure, citing patience on long-gestation investments. Fabtech's own Saudi/Italy acquisition-led expansion pattern-matches the SETL/HLEGLAS diversification cohort more than PRAJIND's caution."
peer_mentions_of_company: []
risks_peers_raise:
  - "Customer-side inspection/acceptance postponement as a delay channel distinct from geopolitics (SETL Nov-2025, May-2026 calls) -- Fabtech's own calls attribute delay only to war/donor-funding, never to routine client-side slippage."
  - "Cost escalation as a direct function of how long a delayed order keeps a site open (PRAJIND Jun-2026 call, quantified) -- a more precise, testable mechanism than Fabtech's 'geopolitical disruption' framing, which never ties cost inflation to delay duration specifically."
  - "Explicit client-base bifurcation between resilient and deferring segments (HLEGLAS Jun-2026 call: pharma/API resilient, CDMO/agrochemical deferring) -- a segment-level clarity Fabtech has never given despite repeated analyst requests for an order-book breakdown."
net_narrative_effect: "complicates"
analyst_note: "Two of Fabtech's most consequential and most-doubted claims (delay-not-cancellation order finalisation, sector-wide cost inflation) triangulate well against the peer set, which meaningfully supports the LBF1 order-book-stagnation explanation. But the competitive-moat claim (no Indian peer) reads as overstated once set against how SETL and HLEGLAS describe their own competitive fields, and the win-rate claim sits in a total disclosure vacuum across all three peers, which is itself informative: nobody in this peer set discloses win-rate, so Fabtech's own shifting win-rate framing across three calls cannot be benchmarked, only flagged as unusually specific for a metric nobody else volunteers."
