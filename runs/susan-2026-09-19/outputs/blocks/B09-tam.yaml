flags:
  - {type: FLAG-TAM-MGMT-CLAIM, reason: "Management's only quasi-TAM reference is the RHP's verbatim reproduction of the company-commissioned Infomerics India Wires & Cables figure (USD 10.32bn/Rs 98,498 Cr 2025E), presented unfiltered and undisaggregated to Susan's actual 33kV-capped, T&D-utility-focused serviceable scope. Ratio to the conservative estimate is 2.03x -> read as INFLATED per the stage's >2x rule."}
  - {type: FLAG-TAM-GUIDANCE-INCONSISTENCY, reason: "The SOM-implied revenue CAGR handoff to stage 11 rests partly on Susan's own HT/MVCC mix-shift ramp, but the Q1 FY27 call states two different FY27-end HT/MVCC targets in the same call (~15% opening script vs ~50% Q&A, per B05). Stage 11 should discount the CAGR handoff for this credibility gap."}
  - {type: FLAG-TAM-CAPACITY-GAP, reason: "The mechanical aggressive share-gain SOM_3yr (Rs 1,290 Cr) exceeds management's own peak-capacity revenue reference (Rs 700-800 Cr, Q1 FY27 call) by Rs 490-590 Cr. Capex utilisation is thin (11.7% of the Unit-III object as of 30-Jun-2026, 8 months before the Feb-2027 commissioning target). The capex/execution plan, not market absorption, is the side to doubt in this run's central growth cross-check."}
  - {type: FLAG-TAM-TRADING-EXCLUDED, reason: "The aluminium rod/wire/ingot trading line (38.38% of FY26 revenue, RHP-stated low entry barriers) is deliberately excluded from TAM/SAM/SOM: it is commodity resale, not a served market with a penetration curve. Sized separately in the report body; SOTP candidate per B04/v3.11 Amendment 27.2/27.4."}
