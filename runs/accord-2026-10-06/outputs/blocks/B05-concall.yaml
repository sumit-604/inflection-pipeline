analyst_note: "Single-call stage; grade C rests on four months of filings, not four quarters. Read order of weight: (1) LBF-1: guidance has two conflicting forms (60-80% growth = Rs 112-126 Cr vs Rs 120-180 Cr), margin 13-15% was answered to a 2-3 year question, so FY27 margin is not strictly guided. (2) H2 FY27 needs Rs 67.3 Cr for the low end, +28% over H1 52.68; H1 doubled misses it. Book 173 gives 2.57x cover on that need. (3) Order-book bridge implies 1-Apr book 148.68 (calc); filed orders sum about 59.4 vs inflow 77, gap close to the unfiled Aditya Birla balance (37 - 20.02), inference only. (4) FY26 'Rs 31 Cr BESS business' and the Rs 31 Cr deferred order may be the same item; not confirmed. (5) Peer checks must use Danish Power and Shilchar transcripts; Voltamp has none."
