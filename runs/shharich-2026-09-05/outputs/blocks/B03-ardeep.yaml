kill_switch_notes:
  - "Phase 1: would not stop on the opinion/CARO alone (both clean on substance), but would flag that KAM selection missed the report's own most contentious numbers (FX, Fair Values note, gratuity reconciliation) and that CARO clause x(b) shows a probable drafting defect."
