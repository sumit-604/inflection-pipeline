valuation_methods:
  primary: {method: "EV/EBITDA", why: "Capital-structure- and depreciation-timing-neutral, appropriate for a capital-intensive, cyclical, multi-division manufacturer mid-way through a debt-funded capacity expansion (CWIP just converted to operating assets, rising interest cost)"}
  secondary: {method: "P/E (on normalised, consolidated earnings)", why: "Earnings quality is reasonably clean this cycle (no exceptional items, DuPont-confirmed margin-driven ROE) and is the metric most small-cap auto-ancillary peer comps use; must be normalised for the Alkop-hive-off accounting effect on RONW/EPS growth before use"}
  tertiary: {method: "Sum-of-the-parts by segment (Bearings/Alkop/Brakes)", why: "Three genuinely distinct margin/lifecycle profiles justify a directional SOTP cross-check, but no audited segment P&L exists (single-segment accounting policy) so this can only be a cross-check built on unaudited management-disclosed splits, not a primary method"}
  not_applicable: ["DCF (near-term FCF unstable given rising WC intensity and active multi-division capex, net cash flow -Rs7.40cr FY26 consolidated)", "Dividend Discount Model (flat Rs2/share dividend, ~15-20% payout, a growth-reinvestment not income story)", "Asset-based/replacement value (not a distressed, holdco, or break-up situation)"]
irrelevant_ratios:
  - {ratio: "Standalone-only trend ratios (debtors turnover, receivables growth) without noting the FY24 Alkop hive-off", why: "Consolidation basis changed materially in FY24; standalone-vs-consolidated ratio tables already contradict each other on direction for the same year (B02 Finding #6)"}
  - {ratio: "Dividend yield as a valuation anchor", why: "Flat, low-payout dividend funding growth internally; not an income story"}
  - {ratio: "Price-to-Book alone", why: "Book value structurally inflated this year by the Alkop-separation accounting effect, not pure organic retention; also misses the approval-barrier intangible that is the real moat"}
  - {ratio: "Headline Debt/Equity (0.25x) as the full leverage picture", why: "A Rs29cr corporate guarantee to Menon Alkop, 4.7x that subsidiary's own implied net worth, sits entirely outside any Contingent Liabilities table and is not captured in the reported D/E"}
  - {ratio: "Fixed-asset turnover in isolation during the current capex cycle", why: "CWIP just converted to operating assets (Rs9.10cr to Rs0.09cr FY26); one-year snapshot understates true turnover until utilisation catches up"}
  - {ratio: "Same-store/same-unit sales growth", why: "Retail-sector metric, not applicable to a B2B component manufacturer"}
must_track_metrics:
  - {metric: "Consolidated EBITDA margin", healthy: "18.65-20.39% (CRISIL two-year band); FY26 actual 21.51%", red_flag: "sustained fall below ~18%"}
  - {metric: "Standalone receivables >6-month ageing bucket / DSO", healthy: "FY25 level, 6.8% / 85 days", red_flag: "continued rise beyond FY26's 22.2% / 114 days, or ECL allowance staying static"}
  - {metric: "Consolidated CFO/PAT ratio", healthy: ">100% (FY23-25 norm)", red_flag: "a second consecutive year below 70% (FY26 already 61.0%)"}
  - {metric: "Export revenue % of total", healthy: "tracking toward guided 37% by FY27", red_flag: "stalling or reversing toward FY24's 28%"}
  - {metric: "Consolidated working capital (Receivables+Inventory-Payables) % of revenue", healthy: "~25% (FY25 level)", red_flag: "continued rise beyond FY26's ~34.7% without a matching CFO improvement"}
unit_economics:
  unit: "Metric tonne (MT) of finished/machined Alkop aluminium component (the one division with disclosed per-unit realisation)"
  revenue_per_unit: "Rs2.0-2.2 lakh/MT (concall Jan-2026, p.24); Investor Presentation slide 33 states a conflicting ~Rs750/kg (~Rs7.5 lakh/MT) not reconciled in the documents"
  margin_per_unit: "NOT FOUND — no MT-level cost breakdown disclosed"
  key_lever: "Utilisation catch-up (currently 60-65%) and product-mix shift toward higher-value/EV-adjacent parts to close the realisation gap vs 'larger players' (Rs4-4.5 lakh/MT)"
first_deterioration_signals:
  - {risk: "Auto-sector/cyclicality concentration (80-90% of revenue, CV/tractor cyclical)", first_signal: "Bi-Metal division revenue growth, OEM channel revenue %"}
  - {risk: "RM price spike with pass-through lag", first_signal: "Consolidated EBITDA margin, Cost of Materials Consumed/Revenue ratio"}
  - {risk: "Standalone receivables/cash-conversion deterioration", first_signal: "Note 31 receivables ageing schedule (standalone), standalone Cash Flow Statement CFO line"}
  - {risk: "Alkop utilisation/scale-up risk", first_signal: "Alkop segment revenue, consolidated fixed-asset turnover"}
  - {risk: "Undisclosed contingent guarantee crystallising", first_signal: "Menon Alkop AOC-1 Reserves & Surplus; any future formal Contingent Liabilities table"}
mgmt_questions:
  - "What is driving the standalone-only receivables deterioration and has the ECL matrix been recalibrated?"
  - "What is the current Alkop utilisation rate and per-MT realisation trend, and what closes the gap with larger peers?"
  - "Why is there no Ind AS 37 Contingent Liabilities table for the Rs29cr Menon Alkop guarantee, and what is the group's total guarantee/dispute quantum?"
  - "Has the Rs2,823.50L Menon Alkop investment been tested for impairment given the subsidiary's negative reserves?"
  - "What are the commercial terms of the Rs457.22L advance to Menon Brakes, and why did interest income fall 50.9% the same year the advance grew 44.9%?"
  - "What quantified revenue/margin milestone would confirm the Braking division's dynamometer/Railways investment is paying off, and by when?"
  - "Given 80-90% auto-sector revenue concentration, what specific steps diversify the end-market mix beyond exports and Alkop's EV push?"
one_line_verdict: "Approval-barrier-protected, capex-led growth across three divisions, real but working capital discipline and Alkop utilisation must prove out next."
