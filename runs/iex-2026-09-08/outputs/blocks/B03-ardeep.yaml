strengths_top3:
  - "Financially immaculate balance sheet and cash conversion: net cash about Rs2,087cr, zero conventional debt, 89.6% standalone CFO/PAT conversion, contingent liabilities 0.37% of net worth, a revenue-recognition KAM independently cross-checked against NLDC/RLDC/CERC volume data with no exceptions."
  - "Clean, well-attended, professionally structured board with no promoter-extraction channel: no director below 85.71% attendance, zero pledge, POSH clean, CSR exactly matched to obligation, related-party dealings limited to KMP compensation governance."
  - "Optionality (IGX IPO, ICX, Coal Exchange) is procedurally real and structured as low-capital equity or subsidiary bets consistent with the asset-light balance sheet, not debt-funded diversification."
red_flags_top3:
  - "The single largest business risk (market coupling, before the Supreme Court) carries zero financial quantification anywhere in the audited filing; the Chairman's letter and risk section assert 'minimal impact' with nothing in the Notes to support it (Phase 6E silent-drop finding)."
  - "Three genuine cross-document contradictions inside one board-signed annual report: whistleblower status (Board's Report 'concluded' vs Notes/CARO 'ongoing'), MSME dues (Note 23/22 rising 462% vs Note 52/48 falling 42%, same balance sheet date), and a materiality asymmetry (Rs5.04cr GST dispute fully quantified vs the far larger coupling exposure entirely unquantified)."
  - "A persistent, worsening, thinly-addressed REC volume collapse across every disclosed FY27 month (-81.4% Q1, -92.3% June, -56.3% July, -86.6% August, all YoY), layered on Certificates revenue already down 27.7% in FY26 itself."
kill_switch_notes:
  - "Informational only, never halts. The coupling case before the Supreme Court is the one external event that could reset the DAM franchise; the corpus holds no order text and the company has quantified nothing in writing."
best_fit_strategy: "GARP"
one_line_verdict: "Financially immaculate GARP compounder whose largest risk is confidently narrated but never priced in writing."
analyst_note: >
  Most consequential finding: the RTM/DAM volume-share "contradiction" B01/B02
  flagged as unreconciled is RESOLVED this stage as two correctly labelled
  statistics on different denominators, both verified by arithmetic against the
  AR's own BU figures. Do not carry it forward as a red flag. What DOES carry
  forward unmodified: the whistleblower status conflict, the MSME dues
  contradiction, the wholly unquantified market-coupling exposure, the rising
  non-operating share of PBT (23.4% to 29.8%), the persistent REC collapse across
  four straight FY27 months, and the 6E finding that the Chairman's "minimal
  impact" assurance has no counterpart anywhere in the audited Notes. None of
  this touches the audit opinion or any audited total. All of it bears directly
  on how much weight Stage 11/FTTCP should give management's own framing when
  setting the exit multiple and entry zone. The regulatory_order_text gap (HIGH)
  is this run's single highest-priority unresolved input.
