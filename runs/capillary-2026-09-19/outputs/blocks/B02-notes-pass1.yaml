receivables_trend: "improving (group/consolidated level): total trade
  receivables grew 12.2% (INR 1,611.21mn to INR 1,808.35mn) against 22.8%
  revenue growth; credit-impaired receivables fell 65.3% (INR 128.28mn to
  INR 44.52mn). Caveat: standalone-only unbilled revenue against related
  party Capillary Pte Ltd more than doubled (+126.5%), an intra-group
  timing item that reverses on consolidation (Note 8, p.146 standalone /
  p.222-223 consolidated)."
