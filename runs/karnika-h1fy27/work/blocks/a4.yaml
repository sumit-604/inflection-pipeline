analyst_note: "Pre-thesis read; no baseline, so verdict rests on filing quality. Key derivation: the deck and concall compare consolidated FY27 with standalone FY26 (pre-Kidcity), so like-for-like growth is standalone only: Q2 revenue +17.4%, core PBT +7.4%, half the PBT gain from other income. Standalone Q2 gross margin is flat YoY; the margin loss sits in other expenses and staff, consistent with job work after the PPE sale, not yarn. Guidance parts (Karnika 20-25% plus Kidcity 80-100 Cr) imply 42-49% CAGR versus the 30-35% whole, so either intercompany sales double count or targets are loose. The ROCE 32% headline is H1-annualised in a seasonal business. Cash class INDETERMINATE-WITH-DIRECTION toward structural; flags (undisclosed lending book, consolidation errors, filing-vs-call contradictions) take the verdict to PROCEED WITH FLAGS. Single question that moves the name most: related-party status of the Rs 31.41 Cr loans."
