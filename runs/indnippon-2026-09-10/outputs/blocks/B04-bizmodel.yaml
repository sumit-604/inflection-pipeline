  - {type: FLAG-MARGIN-DEFINITION, reason: "Three different 'margin' figures coexist in AR2026: Key Highlights EBITDA margin 13.97% (p.6 PDF, includes Other Income and the exceptional item), deck-basis operating EBITDA margin 11.44% (p.4/16 PDF, excludes Other Income), and MD&A 'Operating Profit Margin' 9.4% (p.125 PDF, narrowest). Downstream stages must fix one definition and hold it constant."}
  - {type: FLAG-SOTP-REQUIRED, reason: "Investment book Rs 531.53cr = 65% of net worth, half a Level-3 related-party Lucas TVS stake whose gains are permanently OCI-trapped and never reach EPS (Note 8A/47). Blending into one P/E misprices the operating business; SOTP required."}
