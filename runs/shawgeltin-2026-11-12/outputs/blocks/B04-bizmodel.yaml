one_line_verdict: "A commodity converter, price-taker on both products, whose FY26 margin gain is cost-led and sits at the top of its own history; the cost half looks company-specific, the bone half looks industry-wide."
analyst_note: "Archetype: evidence says commodity converter (R1 moving to R2), not build-to-spec; no filed evidence of spec-in or content per unit. Margin: NGL ran 8 to 10 points under Nitta for FY24 to FY25, so part of the 6.2 point FY26 gain is catch-up to the leader (Nitta moved about 3 points, rounded screener). Readings: A structural (group know-how, solar, yield), B cyclical (bone and gelatine deflation; IGCL materials fell 727 bp vs 511 bp). Nitta's Sep-2026 quarter at 28% shows the spread is still wide, so Q2 FY27 alone will not separate A from B. Volume +16.17% partly came from finished-goods stock (down 276 lakh). Export is 1.0% of sales, so the group export lever is not visible yet. Gelatine volume x price does not tie to Note 26 (1.7 points). Put conservatism in position size; Amendment 17 binds if converter-classified."
