  assets/liabilities rows carry more uncertainty. Note 21 (contract liability/deferred revenue) sub-split between
  MSME/related/other inside Note 18/43 payables tables has some column ambiguity flagged inline in the report.
  Pass 2 should re-check these against source PDF pages directly rather than the extracted .txt where precision
