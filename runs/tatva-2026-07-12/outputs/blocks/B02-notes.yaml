  - "Management's raw-material-cost narrative for the profit decline contradicts the notes' own cost-of-materials-consumed figure, which fell 2.8% YoY (Note 26; standalone Note 50(l)(vi))"
  - "Parent company's consolidated profit share collapsed from 97% to 6% while foreign trading subsidiaries captured 81%, an unverified-arm's-length transfer-pricing question (Note 50(a); Note 33(iv))"
  - "Executive KMP remuneration rose 27.9% in the year consolidated PAT fell 81.2% (Note 42B)"
  - "Deferred tax asset on unabsorbed losses jumped 6.4x in the same year operating performance deteriorated sharply (Note 23)"
  - "SDA product revenue fell 27.7% YoY coinciding with a large customer's revenue share falling from 36% to 21% (Notes 36B(i), 41B(i))"
questions_for_mgmt:
  - "Given cost of materials consumed fell 2.8% YoY, why does the standalone ratio note attribute the profit decline to rising raw material costs rather than the Rs 30.38 Cr inventory destocking swing the notes show is the actual driver?"
  - "What is the transfer-pricing methodology governing parent-to-subsidiary sales, given the parent's profit share fell from 97% to 6% while subsidiaries holding under 0.01% of Group non-current assets captured 81%?"
  - "What was the rationale for the 27.9% executive remuneration increase in a year consolidated PAT fell 81.2%, and will FY26 pay be linked more directly to performance?"
  - "What customer-level credit assessment supports zero ECL allowance on trade receivables despite 61% concentration in the top three customers?"
  - "Which Group entity generated the tax losses behind the 6.4x jump in the deferred tax asset on unabsorbed losses, and what supports management's probable-recovery judgement given FY25's profit collapse?"
receivables_trend: "deteriorating - gross trade receivables grew 18.1% (Rs 69.852 Cr to Rs 82.527 Cr, Note 15 p.240) while revenue from operations fell 2.7-4.0% (Note 24 p.249); top-3 customer concentration in receivables rose to 61% in FY25 from a comparable prior-year concentration (Note 41B(ii) p.266); zero ECL/loss-allowance provisioned in either year despite this (Note 15 p.240); receivables >6 months remain immaterial (0.06% FY25) so ageing quality itself has not degraded, but the growth-vs-revenue divergence and zero provisioning against rising concentration together support a deteriorating classification for FLAG-CASH purposes"
