analyst_note: "TAM is the IMARC India figure (579.1 M USD x 88.4 = 5,119 Cr, FX implied by ACMA FY26). MRFR gives 13,260 Cr but contradicts itself three ways on one page, so it is the L-confidence upper reading, not averaged. SAM could not be filtered (no segment shares), so SAM is a ceiling and headroom is overstated. Central SOM uses +2 pp in 3 years because H1 FY27 sales annualised show a 0.72 pp gain in about a year (top of the normal band). Year-5 SOM needs 111.8% of the 3,060 t nameplate at FY26 revenue per tonne; 3,060 t is confirmed over 1,500 t because 1,557 t dispatch is 50.9% of 3,060 (deck says 51%). SOM CAGR is a cross-check for stage 11, not a base."
