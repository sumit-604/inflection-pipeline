analyst_note: "The peer set does not support an industry-wide demand slump; EV growth data from SONACOMS directly contradicts Divgi's flat-EV framing, the most consequential finding here since it undercuts management's stated reason for the Sigma EV transmission delay. Tariff and desourcing claims are directionally corroborated but Divgi-specific magnitudes (60% duty, 14-15mn unit TAM, $500mn Indonesia tender, sole Tier-1 status) remain unverifiable because no peer operates in the transfer-case/auto-transmission niche closely enough to confirm them. Cross-peer hypothesis: all four peers are running self-funded, non-levered, multi-year bets on new verticals adjacent to their core, each framing it as unique insight though it recurs identically across all four - suggesting a sector-wide risk-tolerance shift rather than Divgi-specific ambition. Testable: track capex-to-accrual ratios and new-vertical revenue share across these four peers over the next 4 quarters."
