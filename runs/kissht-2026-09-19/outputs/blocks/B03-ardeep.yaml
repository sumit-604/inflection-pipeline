analyst_note: >
  Two Phase 6E quiet-abandonment findings are the most load-bearing output of this
  stage. First, the AR's own 'Balanced liability base' pillar claims diversification
  via 45+ lending partners and instrument mix while never naming that 99.8% of the
  NCD book sits behind one guarantee already exceeding parent net worth -- the one
  concentration dimension that actually matters is the one never disclosed in the
  section built to address concentration. Second, the CEO letter's GNPA-improvement
  causal claim (underwriting/collections effectiveness) is not fully supported by the
  Company's own notes (write-off-rate mechanic) or by the Q1 FY27 sequential reversal.
  Both findings were reached by cross-referencing front-matter narrative against
  audited notes and CARO annexures the Company itself filed -- nothing here relies on
  external inference. Four of B02's fifteen top findings were independently
  re-verified this pass against primary sources outside the notes themselves (CARO
  Annexure A, the KPI table, and the Corporate Governance Report's KMP-pay
  disclosure), all matching exactly, which raises confidence in the unverified
  eleven rather than casting doubt on them.
