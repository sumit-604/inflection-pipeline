const MANUAL = [

  ["4 wires", ["2 or more yellow wires? Cut the first yellow wire.", "Else, the serial ends in an even digit? Cut the 3rd wire.", "Else, there is a white wire? Cut the white wire.", "Else, cut the 1st wire."]],

];
// Returns the index (0 based) of the one safe wire.
function safeWire(w, serial) {
  const n = w.length, first = (c) => w.indexOf(c), count = (c) => w.filter((x) => x === c).length;
  const lastDigit = +serial.replace(/\D/g, "").slice(-1);
  if (n === 3) { if (!w.includes("red")) return 1; if (w[0] === "blue") return 2; return first("red"); }
  if (n === 4) { if (count("yellow") >= 2) return first("yellow"); if (lastDigit % 2 === 0) return 2; if (w.includes("white")) return first("white"); return 0; }
  if (w[4] === "green") return 1; if (!w.includes("blue")) return 3; if (/X/.test(serial)) return 4; return first("blue");
}

function humanMat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9 });
}

// Build a human. All options are colours except `hat` (null or a colour).
function makeHuman({
  skin = 0xe0a878,
  shirt = 0x2f7db0,
  trousers = 0x3b3f4a,
  hair = 0x2b1d14,
  shoes = 0x3a2a1c,
  hat = null,
  dress = false, // true = long dress instead of trousers (same colour as shirt)
} = {}) {
  const g = new THREE.Group();
  const skinMat = humanMat(skin);
  const shirtMat = humanMat(shirt);
  const trouserMat = humanMat(dress ? shirt : trousers);
  const hairMat = humanMat(hair);
  const shoeMat = humanMat(shoes);

  const parts = {};

  // ---- Legs (pivot at the hip so they can swing) ----
  const legLen = 0.72;
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.13, legLen, 0);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, legLen, 0.2), trouserMat);
    leg.position.y = -legLen / 2;
    leg.castShadow = true;
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.3), shoeMat);
    shoe.position.set(0, -legLen + 0.05, 0.04);
    pivot.add(leg, shoe);
    g.add(pivot);
    parts[side < 0 ? "legL" : "legR"] = pivot;
  }
  // A dress hangs as one piece over the legs.
  if (dress) {
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 0.7, 8), trouserMat);
    skirt.position.y = 0.42;
    skirt.castShadow = true;
    g.add(skirt);
  }

  // ---- Torso ----
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.62, 0.28), shirtMat);
  torso.position.y = legLen + 0.31;
  torso.castShadow = true;
  g.add(torso);
  parts.torso = torso;

  // ---- Arms (pivot at the shoulder) ----
  const armLen = 0.6;
  const shoulderY = legLen + 0.58;
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.33, shoulderY, 0);
    const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.15, armLen * 0.55, 0.15), shirtMat);
    sleeve.position.y = -armLen * 0.275;
    sleeve.castShadow = true;
    const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.13, armLen * 0.45, 0.13), skinMat);
    forearm.position.y = -armLen * 0.55 - armLen * 0.225;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 6), skinMat);
    hand.position.y = -armLen - 0.02;
    pivot.add(sleeve, forearm, hand);
    g.add(pivot);
    parts[side < 0 ? "armL" : "armR"] = pivot;
  }

  // ---- Neck + head ----
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.12, 8), skinMat);
  neck.position.y = legLen + 0.66;
  g.add(neck);

  const headY = legLen + 0.92;
  const head = new THREE.Group();
  head.position.y = headY;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.23, 14, 12), skinMat);
  skull.castShadow = true;
  head.add(skull);

  // Eyes: two little dark dots, slightly apart, on the front (+Z).
  // We keep them in `parts` so they can blink.
  // Big readable eyes: a white, a dark pupil that can look sideways, and a skin-coloured eyelid that blinks.
  const eyeMat = humanMat(0x22201c), whiteMat = humanMat(0xffffff);
  parts.pupils = []; parts.lids = [];
  for (const side of [-1, 1]) {
    const eye = new THREE.Group(); eye.position.set(side * 0.085, 0.045, 0.195);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), whiteMat); white.scale.set(1, 0.85, 0.6); eye.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), eyeMat); pupil.position.set(0, 0, 0.04); eye.add(pupil); parts.pupils.push(pupil);
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), skinMat); lid.scale.set(1.05, 1, 0.65); lid.position.y = 0.002; lid.rotation.x = -0.15; lid.scale.y = 0.05; eye.add(lid); parts.lids.push(lid);
    head.add(eye);
    parts[side < 0 ? "eyeL" : "eyeR"] = eye;
    // A thick eyebrow above each eye.
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.022, 0.014), hairMat);
    brow.position.set(side * 0.085, 0.115, 0.21);
    head.add(brow);
  }
  // A mouth with lips and a strip of teeth that shows in a smile or a laugh.
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.02), humanMat(0x9b4b3a));
  mouth.position.set(0, -0.08, 0.215);
  head.add(mouth);
  parts.mouth = mouth;
  const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.012, 0.01), whiteMat); teeth.position.set(0, 0.004, 0.011); teeth.visible = false; mouth.add(teeth); parts.teeth = teeth;
  const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 0.01), humanMat(0xe06070)); tongue.position.set(0, -0.006, 0.011); tongue.visible = false; mouth.add(tongue); parts.tongue = tongue;
  // A nose.
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.06, 6), skinMat); nose.rotation.x = Math.PI / 2; nose.position.set(0, -0.01, 0.235); head.add(nose);
  // Ears.
  for (const side of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), skinMat);
    ear.position.set(side * 0.22, 0, 0);
    head.add(ear);
  }
  // Hair: a cap over the top-back of the head.
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.245, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.55),
    hairMat
  );
  hairCap.position.set(0, 0.02, -0.03);
  head.add(hairCap);
  parts.hair = hairCap;

  // Optional hat (e.g. the engineer's yellow hard hat).
  if (hat != null) {
    const hatMat = humanMat(hat);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), hatMat);
    dome.position.y = 0.06;
    dome.castShadow = true;
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.05, 14), hatMat);
    brim.position.set(0, 0.06, 0.03);
    head.add(dome, brim);
    parts.hat = [dome, brim];
  }

  g.add(head);
  parts.head = head;

  // Cheeks that show when smiling, and a mood the animation reads.
  for (const side of [-1, 1]) { const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 5), humanMat(0xf0a0a0)); cheek.position.set(side * 0.13, -0.03, 0.19); cheek.visible = false; head.add(cheek); parts[side < 0 ? "cheekL" : "cheekR"] = cheek; }
  parts.brows = [];
  head.children.forEach((c) => { if (c.geometry && c.geometry.type === "BoxGeometry" && c.position.y > 0.09) parts.brows.push(c); });
  g.userData.mood = "calm"; g.userData.moodT = 0;
  g.userData.parts = parts;
  g.userData.walkPhase = 0;
  g.userData.blinkTimer = 1 + Math.random() * 3; // seconds until the next blink
  g.userData.blinkLeft = 0;                       // seconds the eyes stay shut
  return g;
}

// Animate a human each frame.
//   walking: true while moving. speed: 0..1 how fast.
// Swings arms and legs in opposite pairs, like a real stride, and adds a
// tiny idle breathing motion when standing still.
//   talking: true while this person is speaking (moves the lips, nods).
function animateHuman(group, dt, walking, speed = 1, talking = false) {
  const p = group.userData.parts;
  if (!p) return;
  const u = group.userData;

  // ---- Face: blink every few seconds ----
  u.blinkTimer -= dt;
  if (u.blinkTimer <= 0) {
    u.blinkTimer = 2 + Math.random() * 3.5;
    u.blinkLeft = 0.14;
  }
  if (u.blinkLeft > 0) u.blinkLeft -= dt;
  const mood0 = u.mood || "calm";
  const shut = u.blinkLeft > 0 || mood0 === "sleepy";
  if (p.lids) p.lids.forEach((lid, i) => { const wink = mood0 === "wink" && i === 1; const target = shut || wink ? 1 : mood0 === "sleepy" ? 0.7 : mood0 === "stern" || mood0 === "angry" ? 0.45 : 0.05; lid.scale.y += (target - lid.scale.y) * Math.min(1, dt * 22); });
  // Pupils look sideways while thinking, up when surprised.
  if (p.pupils) p.pupils.forEach((pu) => { const tx = mood0 === "thinking" ? 0.02 : 0, ty = mood0 === "thinking" ? 0.02 : mood0 === "surprised" ? 0.012 : 0; pu.position.x += (tx - pu.position.x) * Math.min(1, dt * 8); pu.position.y += (ty - pu.position.y) * Math.min(1, dt * 8); });

  // ---- Face: mood. happy = wide mouth, cheeks, brows up; sad = small mouth, brows down; stern = brows down, flat mouth; surprised = round mouth, brows high ----
  if (u.moodT > 0) { u.moodT -= dt; if (u.moodT <= 0) u.mood = "calm"; }
  const mood = u.mood || "calm";
  if (p.cheekL) { p.cheekL.visible = p.cheekR.visible = mood === "happy" || mood === "laugh" || mood === "shy"; }
  if (p.teeth) p.teeth.visible = mood === "happy" || mood === "laugh"; if (p.tongue) p.tongue.visible = mood === "laugh";
  if (p.brows) for (const [i, b] of p.brows.entries()) { const side = i === 0 ? -1 : 1; const ty = mood === "surprised" ? 0.145 : mood === "happy" || mood === "laugh" ? 0.125 : mood === "thinking" ? (i === 1 ? 0.14 : 0.11) : (mood === "sad" || mood === "stern" || mood === "angry") ? 0.1 : 0.115; b.position.y += (ty - b.position.y) * Math.min(1, dt * 8); b.rotation.z += (((mood === "stern" ? -0.3 : mood === "angry" ? -0.55 : mood === "sad" ? 0.35 : 0) * side) - b.rotation.z) * Math.min(1, dt * 8); }
  const mouthX = mood === "happy" ? 1.6 : mood === "laugh" ? 1.7 : mood === "surprised" ? 0.8 : mood === "sad" ? 0.7 : mood === "angry" ? 1.2 : mood === "thinking" ? 0.6 : 1, mouthY = mood === "surprised" ? 2.6 : mood === "laugh" ? 3.2 : mood === "happy" ? 1.3 : mood === "angry" ? 0.6 : 1;
  const mouthPosY = mood === "happy" || mood === "laugh" ? -0.065 : mood === "sad" ? -0.1 : -0.08;
  if (p.head && mood === "laugh" && !talking) p.head.rotation.z = Math.sin(performance.now() / 120) * 0.08; else if (p.head && mood !== "laugh" && !talking) p.head.rotation.z *= 1 - Math.min(1, dt * 6);
  // ---- Face: lips move and the head nods a little while talking ----
  if (p.mouth) {
    const now = performance.now();
    p.mouth.position.y += (mouthPosY - p.mouth.position.y) * Math.min(1, dt * 8);
    if (talking) {
      const open = 1 + Math.abs(Math.sin(now / 55)) * 3.2;
      p.mouth.scale.set(1 + Math.sin(now / 90) * 0.25, open, 1);
      if (p.head) p.head.rotation.x = Math.sin(now / 260) * 0.06;
    } else {
      const k = Math.min(1, dt * 12);
      p.mouth.scale.x += (mouthX - p.mouth.scale.x) * k;
      p.mouth.scale.y += (mouthY - p.mouth.scale.y) * k;
      if (p.head) p.head.rotation.x *= 1 - Math.min(1, dt * 8);
    }
  }

  if (walking) {
    group.userData.walkPhase += dt * 9 * Math.max(0.4, speed);
    const s = Math.sin(group.userData.walkPhase) * 0.55;
    p.legL.rotation.x = s;
    p.legR.rotation.x = -s;
    p.armL.rotation.x = -s * 0.8;
    p.armR.rotation.x = s * 0.8;
  } else {
    // Ease limbs back to rest.
    for (const k of ["legL", "legR", "armL", "armR"]) {
      p[k].rotation.x += (0 - p[k].rotation.x) * Math.min(1, dt * 10);
    }
    // Gentle breathing.
    const breathe = Math.sin(performance.now() / 600) * 0.01;
    p.torso.scale.y = 1 + breathe;
  }
}

function boxBatch(list) {

function giveGun(g) { if (g.userData.gun) return; const gun = makeGun(); gun.rotation.x = Math.PI / 2; gun.position.set(0, -0.62, 0.05); g.userData.parts.armR.add(gun); g.userData.gun = gun; }

// Poses are applied after animateHuman each frame. k = 0..1 strength.
function applyPose(g, pose, k = 1, t = 0) {
  const p = g.userData.parts; if (!p) return;
  g.rotation.x = 0; g.rotation.z = 0; p.armR.rotation.z = 0; p.armL.rotation.z = 0; if (p.torso) p.torso.rotation.y = 0;
  let dy = 0;
  switch (pose) {
    case "punch": p.armR.rotation.x = -1.65 * k; p.armL.rotation.x = -0.9; p.torso.rotation.y = 0.35 * k; break;
    case "punchL": p.armL.rotation.x = -1.65 * k; p.armR.rotation.x = -0.9; p.torso.rotation.y = -0.35 * k; break;
    case "upper": p.armR.rotation.x = -2.6 * k; p.armL.rotation.x = -0.6; dy = 0.15 * k; break;
    case "kick": p.legR.rotation.x = -1.5 * k; p.armL.rotation.x = -0.6; p.armR.rotation.x = 0.5; g.rotation.x = 0.25 * k; break;
    case "block": p.armR.rotation.x = -1.5; p.armL.rotation.x = -1.5; p.armR.rotation.z = 0.55; p.armL.rotation.z = -0.55; break;
    case "aim": p.armR.rotation.x = -1.55; p.armL.rotation.x = -1.35; p.armL.rotation.z = -0.35; break;
    case "throw": p.armR.rotation.x = -2.8 + 2.2 * k; break;
    case "windup": p.armR.rotation.x = 0.9; p.armL.rotation.x = -0.6; p.torso.rotation.y = -0.4; break;
    case "crouch": p.legL.rotation.x = -1.2; p.legR.rotation.x = -0.9; p.armL.rotation.x = -0.5; p.armR.rotation.x = -0.5; g.rotation.x = 0.35; dy = -0.38; break;
    case "slide": g.rotation.x = -1.15; p.legL.rotation.x = -0.3; p.legR.rotation.x = 0.2; p.armL.rotation.x = -2.6; p.armR.rotation.x = -2.6; dy = 0.05; break;
    case "roll": g.rotation.x = t * Math.PI * 2; p.legL.rotation.x = p.legR.rotation.x = -1.6; p.armL.rotation.x = p.armR.rotation.x = -1.6; dy = 0.35; break;
    case "jump": p.legL.rotation.x = -0.9; p.legR.rotation.x = 0.4; p.armL.rotation.x = -2.4; p.armR.rotation.x = -2.4; break;
    case "down": g.rotation.x = -Math.PI / 2 * k; dy = 0.22 * k; p.armL.rotation.x = -2.8; p.armR.rotation.x = -0.3; break;
    case "tied": p.legL.rotation.x = p.legR.rotation.x = -1.5; p.armL.rotation.x = p.armR.rotation.x = 0.55; p.armL.rotation.z = 0.25; p.armR.rotation.z = -0.25; dy = -0.62; break;
    case "sit": p.legL.rotation.x = p.legR.rotation.x = -1.5; p.armL.rotation.x = p.armR.rotation.x = -0.5; dy = -0.62; break;
    case "stun": p.head.rotation.z = Math.sin(t * 10) * 0.3; p.armL.rotation.x = 0.3; p.armR.rotation.x = 0.3; break;
    case "cheer": p.armL.rotation.x = p.armR.rotation.x = -2.9 + Math.sin(t * 12) * 0.25; dy = Math.abs(Math.sin(t * 8)) * 0.25; break;
    case "grab": p.armL.rotation.x = p.armR.rotation.x = -1.5; break;
    case "hurt": g.rotation.x = -0.35; p.armL.rotation.x = p.armR.rotation.x = -0.7; break;
    case "bike": p.legL.rotation.x = -1.0 + Math.sin(t * 9) * 0.6; p.legR.rotation.x = -1.0 - Math.sin(t * 9) * 0.6; p.armL.rotation.x = p.armR.rotation.x = -1.1; g.rotation.x = 0.25; break;
    case "sad": p.head.rotation.x = 0.35; break;

}

  if (G.mode === "dialog") { skipDialog(); return; }
  if (G.mode === "qte") { endQte(true); return; }
  if (G.mode === "puzzle") { skipPuzzle(); return; }
  if (G.mode === "chase" && G.C && !G.C.done) { G.C.done = true; toast("Chase skipped."); G.C.onWin && G.C.onWin(); return; }
  if (G.mode === "play") { const f = G.skipFn; if (f) { G.skipFn = null; toast("Skipped."); f(); } else completeChapter(); }
}

    say([["rish", "(The van is empty. Kade left a pistol on the seat. And the yard is full of his men.)", "thinking", () => giveRishGun()], ["rish", "(Red barrels. Steam pipes. A container hanging from the crane. I can use all of it.)", "thinking"]],
      () => { setObj("Reach <b>Kade</b> at the far end. Shoot barrels, steam valves and the crane chain. The first guard has a machine gun.", M(38, 7)); toast("Pistol: F or click to shoot. R reload. The red laser shows the target.", 5); });
  },

  end() {
    loadMap("school"); schoolSigns(G.L); makePlayer(20, 15, 0);
    G.flags.cones = false;
    const kids = [["sana", 16, 19], ["aarav", 18, 19], ["diya", 20, 19], ["kabir", 22, 19], ["meher", 24, 19], ["rohan", 26, 19]];
    const tch = [["khan", 12, 17], ["dsouza", 14, 17], ["iyer", 16, 17], ["verma", 24, 17], ["vikram", 27, 17], ["rao", 29, 17], ["arjun", 31, 17]];
    for (const [id, cx, cy] of kids.concat(tch)) { const n = spawnNpc(id, cx, cy, Math.PI); n.faceP = true; }
    const dad = spawnNpc("dad", 21, 20, Math.PI); dad.g.visible = false;
    const lines = ENDING.map((l) => l.slice());
    lines[12][3] = () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 16), mat(0xffd700, { metalness: 0.8, emissive: 0x332200 })); m.rotation.x = Math.PI / 2; m.position.set(0, 1.0, 0.18); G.P.g.add(m); sfx("heal"); burst(G.P.x, 2, G.P.z, 0xffd60a, 20, 3, 1.2, 0.6, 3); };
    lines[13][3] = () => { dad.g.visible = true; dad.x = M(21, 21).x; dad.z = M(21, 21).z - 0.5; dad.goto = M(21, 18); dad.speed = 3; };
    G.skipFn = () => credits();
    center("Two days later", 1.8);
    after(1.6, () => say(lines, () => {
      for (const id in G.npcs) G.npcs[id].pose = "cheer"; G.P.st = "idle"; G.flags.cheer = 1;
      center("RISH HERO", 3); sfx("heal");
      const conf = () => { if (!G.flags.cheer) return; burst(G.P.x + rr(-8, 8), 6, G.P.z + rr(-3, 5), [0xff006e, 0xffbe0b, 0x3a86ff, 0x06d6a0][Math.floor(rnd() * 4)], 10, 3, 2, 0.6, 2); after(0.3, conf); }; conf();
      setObj("🏅 Everyone's hero!"); after(4.5, () => credits());
    }));
  },
};

function onAnyKey(code, a) {
  if (a === "pause" && ["play", "chase", "pause"].includes(G.mode)) { togglePause(); return; }
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Tab") { e.preventDefault(); if (G.mode === "dialog") skipDialog(); return; }
  if (G.mode === "puzzle" && G.puz && G.puz.kind === "code") { if (/^Digit\d$/.test(e.code) || /^Numpad\d$/.test(e.code)) codeKey(e.code.slice(-1)); if (e.code === "Backspace") codeKey("⌫"); if (e.code === "Enter" || e.code === "NumpadEnter") codeKey("OK"); }
  if (G.mode === "puzzle" && G.puz && G.puz.kind === "wire" && /^Digit[1-5]$/.test(e.code)) cutWire(+e.code.slice(-1) - 1);
  if (G.mode === "fail" && e.code === "Enter") retryFail();
});

function step(dt) {
  G.t += dt;
  const live = ["play", "dialog", "qte", "chase", "puzzle"].includes(G.mode);
  if (live && G.later.length) { const due = G.later.filter((l) => l.t <= G.t); G.later = G.later.filter((l) => l.t > G.t); for (const l of due) l.f(); }
  if (G.mode === "play") {
    G.chT = (G.chT || 0) + dt; G.flags.aimT = Math.max(0, (G.flags.aimT || 0) - dt); G.flags.aiming = G.flags.aimT > 0;
    updatePlayer(dt); updateFlow(); updateEnemies(dt); updateNpcs(dt); updateItems(dt); updateProps(dt); updateTriggers(); updateCamera(dt); updateAim();
  } else if (G.mode === "dialog") {
    updateDialog(dt); clearPress();
    if (G.P) { const sv = Object.assign({}, K); for (const k in K) K[k] = false; const j = JOY.on; JOY.on = false; updatePlayer(dt); Object.assign(K, sv); JOY.on = j; }
    updateNpcs(dt); for (const e of G.enemies) if (e.active) { animateHuman(e.g, dt, false, 1, G.talker === e.id); } updateProps(dt); updateCamera(dt);
  } else if (G.mode === "qte") { updateQte(dt); updateNpcs(dt); updateProps(dt); updateCamera(dt); }
  else if (G.mode === "puzzle") { updatePuzzle(dt); }
  else if (G.mode === "chase") updateChase(dt);
  fxUpdate(dt); updateMarker(dt); updateHud(dt);
  $("mini").style.display = G.L && G.mode !== "chase" ? "block" : "none";
  if (G.mode === "play" && (G.miniT = (G.miniT || 0) - dt) <= 0) { G.miniT = 0.15; drawMini(); }
  const sk = $("skipB"); sk.style.display = ["play", "dialog", "qte", "puzzle", "chase"].includes(G.mode) ? "block" : "none";
  $("pauseB").style.display = ["play", "chase"].includes(G.mode) ? "block" : "none";
  if (G.skipArm > 0) { G.skipArm -= dt; if (G.skipArm <= 0) sk.textContent = "⏭ Skip"; }
}
// Laser sight from Rish's pistol to the auto aim target.
let laser = null, aimRing = null;
function updateAim() {
  const P = G.P;
  if (!laser) { laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, 1)]), new THREE.LineBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0.7 })); scene.add(laser); aimRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 6, 20), new THREE.MeshBasicMaterial({ color: 0xff2a2a })); aimRing.rotation.x = Math.PI / 2; scene.add(aimRing); }
  const tg = P && P.gun ? autoAim() : null; G.aimTarget = tg;
  laser.visible = aimRing.visible = !!tg;
  if (tg) { const f = faceDir(P.yaw); laser.geometry.setFromPoints([new THREE.Vector3(P.x + f.x * 0.4, P.y + 0.95, P.z + f.z * 0.4), tg.p]); aimRing.position.set(tg.p.x, tg.pr && tg.pr.type !== "barrel" ? tg.p.y : 0.06, tg.p.z); aimRing.material.color.setHex(tg.pr ? 0xffd60a : 0xff2a2a); }
}
function drawMini() {
  const c = $("mini"), g = c.getContext("2d"), L = G.L, P = G.P; if (!L || !P) { g.clearRect(0, 0, c.width, c.height); return; }
  const s = Math.min(c.width / L.W, c.height / L.H); g.clearRect(0, 0, c.width, c.height);
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) { const ch = L.grid[y][x]; g.fillStyle = ch === "#" ? "#2b2f36" : "#000"; if (ch === "#" || ch === " ") g.fillRect(x * s, y * s, s, s); else { g.fillStyle = solidFor(ch) ? "#59606b" : "#8a93a3"; g.fillRect(x * s, y * s, s, s); } }
  const dot = (x, z, col, r = 2.2) => { g.fillStyle = col; g.beginPath(); g.arc(x / CS * s, z / CS * s, r, 0, 7); g.fill(); };
  if (G.marker) dot(G.marker.x, G.marker.z, "#ffd60a", 3.2);
  for (const h of G.hostages) if (!h.freed) dot(h.x, h.z, "#4cc9f0");
  for (const b of G.bombs) if (!b.defused) dot(b.x, b.z, "#ff9f1c", 3);
  for (const e of G.enemies) if (e.active && e.st !== "down") dot(e.x, e.z, e.st === "alert" ? "#ff3b30" : "#ffd60a");
  dot(P.x, P.z, "#fff", 3);
}

 alt="Rishabh Sharma"><h2 style="text-align:center">About Rish Hero</h2>
  <p><b>Rish Hero</b> is Game 3 of the <b>RishSchoolDays</b> series, created by <b>Rishabh Sharma</b>, 9 years old. Slogan: <b>Just live it!</b></p>
  <p>Rish joins Sunrise Public School in Suryanagar, the same school, classmates and teachers as RishSchoolDays. For one year nobody likes him. Kids push him, laugh at him and ignore him. Some teachers blame him. Then, on Annual Day, the Black Viper gang attacks the school. Rish frees his school, stops the bombs, beats Bull and Viktor Kade, and stops bombs in five cities around the world.</p>
  <p class="mut">The Black Viper gang and every person in this story are made up. Defeated enemies are knocked out and arrested. No blood.</p><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("b").onclick = menu;
}
function credits() {
  resetWorld(); G.mode = "menu"; G.save.unlocked = CHAPTERS.length - 1; writeSave();
  showScr(`<h1 class="logo">THE END</h1><p class="sub">Rish Hero · RishSchoolDays Game 3</p><p>A lonely year. One brave day. A whole school of new friends.</p><p><b>Created by Rishabh Sharma</b>, age 9.</p><p class="sub"><b>Just live it!</b></p><div class="row"><button class="btn go" id="b">Menu</button></div>`);
  $("b").onclick = menu; G.stats.credits = 1;
}
function togglePause() {
  if (G.mode === "pause") { hideScr(); G.mode = G.pauseBack; return; }
  G.pauseBack = G.mode; G.mode = "pause";
  showScr(`<h2>Paused</h2><p class="mut">${CHAPTERS[G.ch].name}: ${CHAPTERS[G.ch].title}</p><div class="grid"><button class="btn go" id="pr">▶ Resume</button><button class="btn" id="prs">↺ Restart chapter</button><button class="btn" id="psk">⏭ Skip this chapter</button><button class="btn alt" id="pm">Menu</button></div>`);
  $("pr").onclick = togglePause; $("prs").onclick = () => startChapter(G.ch, true); $("psk").onclick = () => { hideScr(); G.mode = G.pauseBack; completeChapter(); }; $("pm").onclick = menu;
}

// ---- Phone controls ----
function initTouch() {
  const touch = matchMedia("(pointer: coarse)").matches || /touch=1/.test(location.search);
  document.body.classList.toggle("touch", touch);
  const stick = $("stick"), knob = $("knob"); let sid = null, cx = 0, cy = 0;
  stick.addEventListener("pointerdown", (e) => { sid = e.pointerId; const r = stick.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; try { stick.setPointerCapture(sid); } catch (er) { /* fine */ } mv(e); });
  const mv = (e) => { if (e.pointerId !== sid) return; let dx = (e.clientX - cx) / 50, dy = (e.clientY - cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } JOY.x = dx; JOY.y = dy; JOY.on = l > 0.15; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`; };
  stick.addEventListener("pointermove", mv);
  const up = (e) => { if (e.pointerId !== sid) return; sid = null; JOY.on = false; JOY.x = JOY.y = 0; knob.style.transform = ""; };
  stick.addEventListener("pointerup", up); stick.addEventListener("pointercancel", up);
  document.querySelectorAll("#pad [data-code]").forEach((b) => {
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); keyDown(b.dataset.code); b.classList.add("down"); });
    const rel = (e) => { keyUp(b.dataset.code); b.classList.remove("down"); }; b.addEventListener("pointerup", rel); b.addEventListener("pointercancel", rel); b.addEventListener("pointerleave", rel);
  });
  $("btnRun").onclick = () => { runToggle = !runToggle; $("btnRun").classList.toggle("on", runToggle); };
  $("pauseB").onclick = () => togglePause();
  $("skipB").onclick = () => { if (G.skipArm > 0) { G.skipArm = 0; $("skipB").textContent = "⏭ Skip"; skipNow(); } else { G.skipArm = 2.5; $("skipB").textContent = "⏭ Tap again to skip"; } };
  $("dlgSkip").onclick = (e) => { e.stopPropagation(); skipDialog(); };
  $("dlg").onclick = () => nextLine();
  $("failRetry").onclick = retryFail; $("failSkip").onclick = skipFail; $("failMenu").onclick = menu;
  $("puzSkip").onclick = () => skipPuzzle();
}

// ---- Start ----
let lastT = 0;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  if (!G.test && G.mode !== "pause") step(dt);
  try { renderer.render(scene, camera); } catch (e) { /* lost context */ }
  requestAnimationFrame(frame);
}
function boot() {
  G.test = /test=1/.test(location.search);
  loadSave(); initGfx(); initPointer(); initTouch();
  $("ver").textContent = VERSION;
  menu();
  requestAnimationFrame(frame);
  window.__rh = {
    G, step: (dt = 1 / 60, n = 1) => { for (let i = 0; i < n; i++) step(dt); }, startChapter, completeChapter, skipNow, skipDialog, nextLine, retryFail, skipFail,
    keyDown, keyUp, safeWire, cutWire, codeKey, openCode, knockDown, hurtEnemy, propHit, fireGun, autoAim, CHAPTERS, MEMORIES, ENDING, CAST, MAPS, RIDDLES,
    cell: (cx, cy) => cellCenter(cx, cy), cellAt, render: () => renderer.render(scene, camera), menu, togglePause, solidFor,
    tp: (cx, cy) => { const p = cellCenter(cx, cy); G.P.x = p.x; G.P.z = p.z; G.P.safe = { x: p.x, z: p.z }; },
  };
}
// GPU reset safety: keep 2D canvases readable.
(() => { const o = HTMLCanvasElement.prototype.getContext; HTMLCanvasElement.prototype.getContext = function (t, a) { if (t === "2d") a = Object.assign({ willReadFrequently: true }, a || {}); return o.call(this, t, a); }; })();
boot();
