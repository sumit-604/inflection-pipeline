verdict_basis: "No deal-breaker fired and the legal/SEBI/pledge record is clean and self-disclosed, but both audit opinions carry a Rule 11(g) qualification with CARO adverse remarks across 7 group entities plus a CFO exit and a material-subsidiary auditor change landing within weeks of sign-off, alongside a CEO total-pay increase of 111% in a widening-loss, falling-median-pay year — a genuine first-year-listed cluster of red flags, not offset enough by the credible new board/investor base to clear CAUTION."
analyst_note: "Two items a downstream stage cannot reconstruct from the fields above. First, the AR itself publishes two non-reconciled CEO-pay figures (129.31x/+0.63% fixed-pay-only in Annexure 4 vs +111%/Rs 9.27 Cr total in Note 34); the gap is plausibly a prior-year variable-pay tranche paid in FY26, per a CG-report footnote, but the AR never bridges the two numbers for the reader. Second, the Jagadish Shivaputrappa Melligeri tax matter rests on converging AR (VERIFIED, Rs 779.56 Mn demand, remanded not resolved) and web (MEDIA REPORTED, Rs 712.13 Mn underlying receipt) sources that could not be jointly confirmed against the primary RHP text (egress-blocked); treat the family-member identification as probable, not certain, until the operator can pull the RHP directly. Both items should be asked of management directly at Halt 1 rather than resolved by inference."
