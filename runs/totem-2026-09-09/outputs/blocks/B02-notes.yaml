going_concern_language: "NONE — auditor's report carries an unmodified opinion, no emphasis-of-matter paragraph, no going-concern qualification; sole Key Audit Matter is revenue recognition (Auditor's Report PDF p.58-60). Note 33.1's 'continue as going concern' language is standard capital-management boilerplate, not a disclosed uncertainty."
analyst_note: "The inventory question (LBF-2) is the single most consequential open item this stage produces: three passes confirm the build and the CFO impact to the rupee but cannot resolve quality, because the AR gives no ageing/write-down disclosure of the kind it gives for receivables and payables. Downstream stages should treat 'ramp stock vs dead stock' as genuinely unresolved, not lean on the absence of a red flag or the absent inventory KAM as reassurance either way. The promoter-pledge and Q1 FY27 margin items are explicitly out of this stage's evidence base and must be closed from the SHP filings and the scanned Q1 results respectively."
