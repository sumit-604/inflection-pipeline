flags:
  - {type: FLAG-MGMT-SHARE-INFLATED, reason: "Applying management's own AR-cited total wine market size (Rs1,917-2,320cr) to management's own audited FY26 revenue (Rs181.29cr) implies a 9.4% share, not the '1/3' claimed on two investor deck slides (Investor_Presentation_Q4FY26_May2026.pdf p.9/p.23; Investor_Presentation_Q1FY27_Aug2026.pdf p.9). The TAM-level citation itself is accurate (matches independent IMARC data); only the share claim built on top of it is inflated."}
  - {type: FLAG-DUOPOLY-UNSUPPORTED, reason: "Web search identifies a real third named organized competitor, Grover Zampa, at a reported 12-15% share, inconsistent with Fratelli's '85-90% two-player duopoly' and 'vast lead over the next in line' framing (Investor_Presentation_Q4FY26_May2026.pdf p.23); Sula never names Fratelli as a competitor across four quarters of calls (B06, carried forward)."}
  - {type: FLAG-VISION2030-GAP, reason: "Vision 2030 (Rs500cr revenue, FY30, Investor_Presentation_Q4FY26_May2026.pdf p.20; reaffirmed on concall p.14 of 14) requires a 28.9% FY26-FY30 CAGR. This stage's SOM supports ~9.1-9.2% CAGR at the matched horizon, and B07's 10% capex-embedded-growth ceiling supports only ~Rs265cr by FY30 -- a ~Rs235cr, ~90% shortfall, with no incremental winery capacity committed in the corpus."}
  - {type: FLAG-EU-FTA-LUXURY-EXPOSURE, reason: "Sula's own EU FTA math puts post-duty-cut EU wine landed MRP around Rs2,000 in Maharashtra -- exactly the boundary Fratelli uses to define its 'insulated' above-90% sub-Rs2,000 book (Concall_Q4FY26_Jun2026_Transcript.pdf internal p.7). The FTA threatens precisely the above-Rs2,000 luxury tier Fratelli claims above-50% share of and calls its fastest-growing engine, contrary to management's 'no impact anticipated' framing on the same call."}
  - {type: FLAG-CATEGORY-GROWTH-CONTESTED, reason: "AR/deck cite a ~16% forward wine-market CAGR (2024/25-2032/34), but Sula's Aug-2026 concall discloses the category has shown 'low single-digit growth' at best over the last 2 years, with Sula's own revenue 'almost flat' near Rs600cr for 3-4 years (SULA-Concall_Aug_2026_Transcript.txt p.7-9). This stage used the realized (~4%), not the projected (~16%), rate for SOM arithmetic."}
