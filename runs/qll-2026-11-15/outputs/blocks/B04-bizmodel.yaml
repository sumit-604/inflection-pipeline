one_line_verdict: "A people-heavy, lab-capital testing roll-up where the FY27 margin guide needs new labs to fill; primary value metric is forward P/E on owners' PAT, with Consulting / Engineering services 25x as the supported sector cap row."
analyst_note: "Sector cap: B00 row Consulting / Engineering services (25x) is supported. No TIC row exists. Healthcare services (35x) needs patient care, Pharma/CDMO (38x) needs drug making; pharma testing is 15-20% of mix (management range). Lab capex at 41% of revenue is heavier than consulting, but the cap is a ceiling, so no upward move is argued. Mix: AR reports one segment; vertical shares are management ranges (Deck p.23), FY26 actuals NOT FOUND. Competing readings of FY27: new labs fill and margin reaches 25-27%, or acquired labs carry structurally lower margin (consolidated 23.5% vs standalone 24-26%). Separating observation: H2 FY27 consolidated EBITDA margin at or above 27%, plus standalone vs ITCPL margin disclosure. Physics: FY26 incremental margin 24.0% shows no operating leverage yet; H2 FY26 sequential 43% was a fill effect that H1 FY27 reversed."
