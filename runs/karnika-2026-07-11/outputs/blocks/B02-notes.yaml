  - "MSMED Act Section 22 interest-on-delayed-payment disclosure absent despite a 266% rise in MSME dues (Note 8, p.80)"
  - "13.3% of revenue and 86.3% of rent expense flow to promoter-family-controlled or promoter-personal counterparties with no arm's-length benchmarking disclosed (Note 33, p.88-89)"
