one_line_verdict: "A niche, OEM-qualified pass-through metal converter riding a real India capex tailwind, whose FY26 profit has not yet turned into cash."
analyst_note: "Archetype is hybrid: build-to-spec component maker (OEM design-win/switching-cost moat) layered on a commodity-converter core (silver/copper/tungsten pass-through, 87% of revenue gross). Section 1B Amendment 17 converter-multiple treatment likely binds on the pass-through slice; do not feed spot-year ROCE or rupee WC trends for this name into Section 1B/FTTCP without adjusting for the FY26 inventory/receivable distortion, which is working-capital-driven, not operating-margin-driven. FY26 EBITDA margin (16.10%) sits at the top of a 10-year 6.95%-16.29% band - treat as near cycle-peak, not new normal, until at least one more year confirms."
