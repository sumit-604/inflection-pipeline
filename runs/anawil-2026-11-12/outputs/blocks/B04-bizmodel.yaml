  - "MARGIN_STORY_IS_PART_SEASON: H1 FY26 EBITDA margin 24.5%, H2 FY26 50.1%, FY26 42.7%, H1 FY27 23.4% (derived from H1 results filing). The brief's 42.7% to 23.4% compares a year with a half. EBITDA per tower H1 FY26 16.4, H2 FY26 34.5, H1 FY27 33.7 lakh."
  - "EBITDA_PER_TOWER_LABEL (reconciled; replaces EBITDA_PER_TOWER_UNRECONCILED): the reported Rs 32.82 lakh is the cash-flow line 'operating profit before working capital changes' (Rs 3,511.65 lakh, H1 Res. p.8) over 107 towers (3,511.65 / 107 = 32.82). It is not EBITDA. Derived EBITDA is Rs 3,608.25 lakh (33.72 per tower on 107). The Rs 96.60 lakh gap is finance costs of Rs 528.16 lakh against interest expense of Rs 409.83 lakh added back in the cash-flow line (118.33), less other income Rs 21.86 lakh in the cash-flow line, plus Rs 0.13 lakh of dividend and interest income deducted. The tower count of 107 holds; the defect is the label. Presentation also prints 108 once."
  - "ORDER_BOOK_MIXED_TAX_BASIS: Customer C Rs 58.32 Cr is inclusive of GST (Oct-29 intimation) and enters the Rs 395.58 Cr book as 58.3; Customer A Rs 133.98 Cr is excluding GST. Model 3 51.3% ties to Customers A plus C (derived); Customer A is 71% of Model 3."
  - "GUIDANCE_SHAPE: FY27 guidance needs H2 revenue Rs 296.0 to 346.0 Cr, 2.9x to 3.4x H2 FY26 and 75% to 87% of the whole Oct-31 book, against a stated execution target of Q1 FY28. Needs 206 to 280 towers in H2 against a best prior half of 148."
  - "CAPACITY_BASIS: FY26 utilisation 48.17% reproduces as 210 / 436 (420 Koppal + 16 Kutch). On 612 it is 34.3%. Tonnes capacity 207,000 t; a 474 t tower lowers tower-count capacity to about 437."
  - "CASH: FY26 OCF Rs 12.47 Cr audited (after Rs 8.51 Cr tax) vs Rs 18.44 Cr restated. Vendor advances Rs 30.63 Cr and GST receivable Rs 18.79 Cr make up Rs 50.0 Cr short-term loans and advances."
  - "CRISIL_PREMISE: August upgrade assumed operating margin around 40% over the medium term (CRISIL p.1); H1 FY27 printed 23.4% on the Model 3 mix."
  - "CYCLICALITY: classed secular-growth on filed GW data; down-cycle behaviour NOT FOUND (three-year wind history)."
