analyst_note: "No peer names QLL and none is a like-for-like TIC business, so every verdict is a base rate. Vimta alone maps to QLL lab segments. The key separating read: Lal grows 19% and expands margin 4 points on existing capacity and price-mix; Krsnaa grows 22-32% on new footprint and loses 2-3 points with receivables stretching. Cross-peer hypothesis: growth source, not pace, decides margin and cash conversion. Test: H2 FY27 margin at or above 27% with growth filling existing labs reads H1 as timing; margin below 24% with growth from labs under 12 months old and PPP billing reads the 25-27% guide as set off the H2 FY26 peak. cross_peer_hypothesis is in the report Part 5."
cross_peer_hypothesis: "Growth source decides margin and cash conversion in this lab set: new-footprint growth (Krsnaa, Vimta building) cuts EBITDA margin and ROCE for about four to eight quarters and, with government payers, stretches DSO to 139-155 days; price-mix growth on existing capacity (Lal) lifts margin about 4 points with DSO 17 days. Test for QLL: if H2 FY27 growth comes mostly from labs under 12 months old and PPP billing, expect margin below the 25-27% guide and CFO/PBT near 42%; if from existing labs, expect margin at or above 27%."
