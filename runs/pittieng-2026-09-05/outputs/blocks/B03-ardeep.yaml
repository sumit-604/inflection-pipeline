strengths_top3:
  - "Real, AR-evidenced operating momentum: revenue +12.2%, adjusted EBITDA +19.9% to Rs325.8cr, margin to 17.03%, utilisation up across all three businesses, CFO Rs204.91cr (CFO/PAT 1.74x)."
  - "Clean audit history on every substantive point: unmodified opinion, no fraud, no default, no going-concern language, no restatement, CSR overspent 2.7x mandate, dividend per share up 66.7%."
  - "Genuine receivables-quality improvement (DSO ~54.5 to ~39.4 days) and real, clean-CWIP capex execution backed by named global-OEM demand visibility (Caterpillar, Voith, Progress Rail, Siemens Mobility, Medha Servo) for the new Rs290cr programme."
red_flags_top3:
  - "Net debt rose 26.3% (Rs439.02cr to Rs554.56cr consolidated) and net-debt/equity worsened on both bases, driven by a working-capital reversal -- contradicts the guided glide path toward ~Rs300cr and the Chairman's own H1 FY27 working-capital-release claim, unsupported by this year's own numbers."
  - "Disclosure-integrity/selective-framing gap on leverage and profitability: Note 25.21's own variance formula masks a -32.5% relative ROE decline behind a sub-threshold percentage-point figure, while the Chairman's letter separately cites only the favourable average-equity D/E ratio and stays silent on the net-debt/equity ratio that worsened in the same document."
  - "Concentrated disclosure silence on the three items most load-bearing for the transition thesis: no CGU-level goodwill impairment assumptions (Rs136.09cr, 13.79% of consolidated net worth), no customer names/end-market segmentation in the financial notes, and no single cumulative capex-programme total in the notes."
best_fit_strategy: "Capex-Led Growth"
one_line_verdict: "Real capex-led momentum, tempered by rising leverage and a selectively framed leverage narrative."
analyst_note: "The Rs290cr capex figure IS disclosed in this AR -- Management Message (PDF p.4) and the Future Expansion box (PDF p.14) -- even though B02 correctly found it absent from the financial-statement NOTES specifically. This is a scope distinction (front matter vs notes), not a contradiction; carry it forward so FTTCP does not wrongly treat the figure as unsourced from this document. Similarly, LBF-3's Wabtec/Alstom/~40% claim is now doubly disconfirmed: Gate 0 found Railways=33% with Wabtec only as a past award, and this stage independently confirms Alstom never appears anywhere in the AR and Wabtec appears only as a 2019/2022 award-grantor. The Chairman's-letter D/E framing (6A/6E) should be named explicitly to whoever runs Section 1B/FTTCP leverage inputs, since the AR's own front-matter number is the favourable one, not the one the Capital Management note supports."
