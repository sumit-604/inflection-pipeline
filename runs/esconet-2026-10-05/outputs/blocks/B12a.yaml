ities, 500.00 commitment); Block F peer and Esconet inputs 25 (Netweb, Rashi, Orient PBT, interest, depreciation, other income, sales, raw material; Esconet sales, raw material, net block; four market caps); selling-proxy inputs 30 (24 line items plus 6 totals, prospectus [page 254], [page 215], AR FY25 [page 124], AR FY26 [page 144]); screener cross-check figures 13; Q1 FY27 figures 8; dates and drivers 6 (ZeaCloud incorporation 11 May 2022 on prospectus [page 199], listing 23 Feb 2024 AR FY25 [page 115], prospectus date 20 Feb 2024, guidance 370-400, FY24 receivables build 2,439.02, FY26 inventory build 3,255.66). Total 215. Every derived ratio (EBIT, capital employed, EBITDA and margin, ROCE, ROE, receivable, inventory and payable days, WC days, cumulative CFO, PAT and FCF, CAGRs, D1 to D4, peer margins and gross margins, M1 to M12 percentages) was recomputed from the checked inputs and reproduces except the WC-days rounding nit in the findings. No verdict-card or Section 1B pillar input exists in this phase (no stage 10 or 11 output), empty by construction, not skipped. Scoring bands, deal-breaker logic and classification were not assessed (judgment, Verifier C). Source-fidelity result for the 215: every value matches the PDF or the screener sheet; 4 sit under a MINOR row for an anchor gap (standalone Q1 purchases and inventory change, FY27 guidance, PAT page cite); none is a mismatch. Task-brief figures that have no source in the corpus (FY26 EBITDA 2.60%) were not counted; B01 correctly says they are not reproduced. STAGE 7 CHANGED FIGURES, about 40 checked: Section 6C table (core 60, blocks 13/5/10/17/15, moat 18, 4 moats, grand 78, run 1 values core 59, moat 12, 2 moats, 4 years, history downgrade, all match B01 run 2 and B01 run 1); Q1 FY27 standalone gross margin 29.16% (6,107.71, 4,845.14, 518.50; Q1 BM [page 4]), finance cost 7.32, FY26 standalone 13.72% and 115.10 finance cost as printed, reversion 943.10 vs PBT 935.67; Emerging Moat total 5.5 recomputed from the six adjusted rows; recount tally 12 documented (A4 2, B2 4, C1 2, C2 2, H2 2), 9 claim, 1 inference, 11 unique, 6 Weak rows, all match the Section 3 tables; supporting figures 41.35% (PROSP [page 28]), service charges 2.39% and 0.65% (847.30 and 150.38 on 35,440.48 and 23,029.80, AR FY26 [page 143]), Info Edge Rs 20.06 Cr, C-DAC Rs 25.74 Cr (7.3% of 354.4 Cr). No stage 7 finding. SAMPLE TIER: universe 1,035 = about 820 stages 2 to 9 material numbers (run 1 count, carried; material = a figure that feeds a flag, score, ratio, priority-item answer or table cell) + 215 Gate 0 mandatory figures. Checked: 251 carried from run 1 sample tier + 215 mandatory = 466 (the 40 stage 7 re-checks are not added, as most overlap the run 1 sample). Run 1 NOT CHECKED list stands (SAST 2026-05-19 scanned disclosure, web and media claims in B08 and B09, note-level B02 figures beyond the sample, Reg 30 filings beyond the sampled items). Page checks used the .txt [page N] markers; no PDF page was rendered in this run. Acceptance: 452 clean of 466 checked = 97.0% (215 mandatory: 211 clean, 4 under a MINOR anchor row; 251 carried sample: 241 clean, 10 under run 1 rows). Self-check (5b): three candidate rows struck this run as faithfully transcribed anomaly or rounding (screener PBT 4.45 vs standalone 445.60 = 4.456; prospectus cash-flow interest 72.34 vs P&L finance cost 72.35 for FY21, B01 uses the P&L figure, both printed; screener FY26 PAT 6.16 vs 615.50/100 = 6.155). Four carried from run 1. No new CRITICAL or MAJOR."
