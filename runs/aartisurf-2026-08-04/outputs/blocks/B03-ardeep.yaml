  - {metric: "Two-customer revenue concentration %", threshold: "Any increase above 71%, or any disclosed customer loss/renegotiation", where: "Next AR's Note 36/35, or customer-related exchange filings", why: "Largest unresolved structural risk identified in this stage, absent from the Company's own risk disclosure"}
  - {metric: "DSCR and short-term borrowing growth rate", threshold: "DSCR staying materially below 1.5x, or working-capital borrowing continuing to outgrow revenue", where: "Quarterly results, next AR's borrowings/ratio notes, CARE surveillance", why: "FY25 DSCR fell to 1.32x with a shift toward short-term funding; CARE flags large term-debt repayments due FY26-FY27"}
