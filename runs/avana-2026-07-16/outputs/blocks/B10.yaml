  - {type: MANIFEST-DEFECT-SECTOR, reason: "Manifest sector cap row = 'Pharma / CDMO, 38x' is a confirmed collection defect. AVANA is a power transmission & distribution equipment maker (control & relay panels, protection relays, substation automation). Correct row per FTTCP Ruling 4: 'Cables / Industrial products, 25x'. Stage 11 must use 25x cap, not 38x."}

