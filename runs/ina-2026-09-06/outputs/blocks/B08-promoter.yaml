verdict_basis: "Legal/regulatory record is clean and promoters are net open-market buyers, but four independent AR-anchored governance findings -- the Rs 32.5cr promoter-family LLP investment, the three-way factory-land title conflict, the promoter-spouse-on-NRC-with-independence-mislabeling, and the AOC-2/Note-41 RPT disclosure contradiction -- together describe a materially under-disclosed related-party and control architecture around the promoter families, which caps the verdict at CONCERN despite genuine, concurrent transition evidence (promoter buying, credible new independent directors, Main Board migration)."
analyst_note: "The land-title conflict (Note 4/CARO vs Note 18A) and the same-firm internal-to-statutory auditor transition are the two findings most worth live verification before Halt 1: both are resolvable with a direct title-deed search and a direct question to the Company Secretary respectively, and both materially change the read on this promoter set depending on the answer. The Subhash Chand Gupta / Badaya & Co name coincidence is recorded only as an unverified lead, not a finding; do not carry it forward as fact without ICAI corroboration."
