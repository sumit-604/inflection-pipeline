analyst_note: "The FY26 AR is a deliberate repositioning document (title: 'The Engine of Knowledge... AI-first knowledge company'), which produces more specific disclosed facts than a typical AR and explains the above-base-rate active-category count (8, still below the 12+ guard trigger). The two Strong categories (C1, H1) are the most load-bearing and best-anchored; I1 and I2 both score 0 because the company's own stated competitive defense is explicitly relationship/switching-cost based (an execution lead), which the framework instructs analysts not to credit as a structural asymmetry. Separately, subsidiary-level notes in the Directors' Report (AR p.38-39) disclose AJE LLC standalone FY26 revenue of INR 10,097.28 lacs (~USD 12m) and AJO (China) revenue of INR 6,747.56 lacs — figures that partially resolve the B05-flagged 'AJE never sized in absolute terms' gap at the standalone-subsidiary level, though not at the concall-disclosed AJE-segment level; downstream stages should be aware this AR-level figure exists even though management never cited it on any call in this corpus."
