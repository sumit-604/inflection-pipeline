analyst_note: "The score is low because the corpus shows capacity, a recovering cycle and one policy option, not durable advantages. The filed P&L turn is real (EBITDA margin 13.5% to 18.2% YoY, revenue +54.9%) and is operating leverage on FY24-26 capex, a Stage 11 question. Two cautions for downstream stages. First, the wheel JV is credited once, under R1; do not credit it again in synthesis through partnership or capability. Second, the AR says wheel certification is by RDSO while the Oct call says it is not needed; the first acceptance letter resolves it. Best case with every claim upgraded to documented is 12.0, so no near-term filing moves this scan above MODEST. The 15.9% capex-embedded growth uses the latest turnover of 1.22x; the larger lever is filling FY26 capacity (+48.0% at 80% utilisation on the Q2 run-rate, constant mix, generous for casting)."
