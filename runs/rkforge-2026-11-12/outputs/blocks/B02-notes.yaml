analyst_note: "Three things a downstream stage cannot rebuild from the fields. First, the cash-flow footnote (p.89) says the receivables line is net of non-recourse bills, so the 10,830.00 lakh release includes 3,015.13 of extra receivable sales, and the ECL charge of 4,499.05 explains over half of the 7,729.63 net balance-sheet fall; both flatter FY26 CFO. Second, the Dec 2025 bank gap and the 2025 mergers (ACIL, MAPL) point to one cause, the integration of acquired units, but the company does not say so: treat as [INFERENCE] until the unit is named. Third, notes-based ROCE (6.27%) uses a different basis from the 12-15% guidance; do not compare them. Net debt on the guidance basis is NOT FOUND; filed bases are 1,64,613.51 (standalone) and 2,17,760.22 (consolidated) lakh."
