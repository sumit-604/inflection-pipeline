analyst_note: "The margin contradiction (Q3) sits directly against company memory's load-bearing fact 1 and is the top verification priority for Halt 1: two independent grain-exposed peers show ethanol margins holding or improving at maize prices comparable to or above the level TruAlt cites for its own claimed Rs 15-16 to Rs 6-7/litre collapse. Either TruAlt's cost structure is genuinely worse-positioned than GULPOLY's and TRIVENI's, or the claimed compression overstates the pressure TruAlt actually faces -- this needs a live-web check of TruAlt's own DDGS yield and maize-conversion assumptions before the fact is treated as settled. Separately, the missing BPCL/Supreme Court disclosure is a transparency finding, not a fabrication finding: the underlying litigation is real, dated, and industry-wide, but TruAlt's own four calls tell that story with materially less detail than a peer facing the identical legal overhang."
