net_narrative_effect: "complicates"
analyst_note: "The two CONTRADICTED items (grape costs, RTD growth) are the highest-value findings here: both rest on the one peer (Sula) close enough to speak to Fratelli's actual inputs and category, both are anchored across multiple quarters, and both point toward Fratelli's outward claims being more optimistic than what a same-belt, same-era peer independently discloses. Treat the grape-cost contradiction as a genuine margin-durability risk for FTTCP, not just a concall-credibility footnote: it compounds Stage 5's existing reconciliation findings by suggesting the input side of the margin story, not only the reported output numbers, may be overstated. The market-share and FTA items are softer: peer evidence is compatible with Fratelli's framing but never confirms it, and the near-total silence on Fratelli's existence across Sula's calls should temper how much weight the 'named duopoly' framing carries versus how much of it is Fratelli's own characterization of its position."
