analyst_note: "The half proves order intake, not quality. Revenue +79.9% and core PBT +44.7% are non-treasury (OI 1.4% of PBT), but 22.7% of the YoY and 38.6% of the HoH CON revenue rise is the CON-minus-SA swing through Danya's consolidation, and the parent that holds Kannur grew 16.2% HoH. Margin falls on every basis despite the CMD's 'margin will not affect much', CFO is negative, net debt is up 42%, and the matched-half cash cycle lengthened 9.9 days. SA PAT equals CON attributable PAT to the lakh because the parent books 90% of Danya profit as other income; the note 4 placeholder leaves Danya's assurance level unknown. Reading 1: Danya is a genuine execution channel, working capital is growth-induced, H2 CFO turns positive. Reading 2: group sales and receivables route through a promoter-partnered firm, the inventory build is structural, and the warrant call and debt fund the gap. Separating observation: H2 FY27 CON CFO plus a Danya intra-group schedule. The 300-350 Cr guide sits on an ASR transcript only. Correction loops 1 and 2 do not move the verdict."
