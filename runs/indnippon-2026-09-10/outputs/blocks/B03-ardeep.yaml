analyst_note: "Three findings this stage adds beyond B02 that most change the read: (1) CFO/PAT at 0.36x turns B02's receivables-ageing disclosure question into a confirmed cash-flow cost. (2) The Arvind Balaji dual-MD interlock (INEL and Lucas TVS simultaneously) is the load-bearing governance fact behind B02's Lucas TVS disclosure gap -- it is not a data gap in isolation, it sits inside a structural interlock. (3) MAHLE's 2023 exit (inter-se transfer to Lucas Indian Service, no residual tech agreement) plus the FY25-to-FY26 EFI-ECU pivot from licensed technology to in-house development, landing in the same year as the unexplained technical-knowhow write-off, together suggest the Company's technology base has been in genuine flux for two straight years -- worth resolving before crediting the technology-transition thesis at full strength."
