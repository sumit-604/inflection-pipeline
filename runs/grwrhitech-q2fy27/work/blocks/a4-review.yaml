analyst_note: "Three readings changed in the A5 loop. First, the 22.70 rise in other non-current assets has no filed composition, and the cash flow carries it inside operating Other assets (C 35.80 and SA 27.47 tie exactly). The review keeps the filed classification: CFO/PAT 0.75x C / 0.36x SA, capex 27.07. If it is capital advances, the figures are 0.83x / 0.44x and capex 49.77; Q16 or the FY27 AR separates them. Second, the profit-release reading is withdrawn: consolidation took 54.59 out of H1 PAT, about 26.6 beyond the intra-group dividend. The filing does not separate a transfer-price change from an undisclosed intra-subsidiary dividend, and no lean is drawn; Q5 separates them. Third, YoY growth sits on a tariff-hit base: two-year Q2 revenue +12.0% (5.8% a year), H1 +21.2% (10.1% a year), below the 16% base; the two-year margin climb of about 300 bps holds. A3's subsidiary hypothesis for the 34% customer works only if the disclosure is standalone; Notion records consolidated Note 31. Rule B evidence stays split: reported 27.17% favours run-rate; ex-OI 24.37%, EPS 55.71 and the guidance midpoint (H2 25.12%) favour guidance."
