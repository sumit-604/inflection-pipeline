analyst_note: "No SEBI or regulator order found in the AR, RHP litigation section or nine filings. Statutory items only: GST DRC-07 demand ZD070824085120I (2024-08-24, 62.11); Ashok Kumar Sharma on ROC disqualified list 2016-2021 (RHP p.37); s.73 and s.185 breaches with compounding applications filed, outcome NOT FOUND (RHP p.31-32). Alltrak two readings: lumpy SaaS billing after the owner change, or income placed in the consolidated window; separator is Alltrak monthly revenue Apr-Sep 2026 and its SaaS policy. CARO ix(d) two readings: director loans are quasi-equity so it holds, or the OD funded the 1,152.23 investment so it fails; separator is OD and director-loan sources and uses. Implied IPO price Rs 189 is derived from H1 figures. Report correction: section 2B says committees formed one year after the 2025-04-01 approvals; correct is about nine months (formed 2025-12-22)."
