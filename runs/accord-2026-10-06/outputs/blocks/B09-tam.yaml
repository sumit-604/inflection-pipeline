analyst_note: "SOM is capacity-bound, not market-bound: Rs 150 Cr (certified 900.36 MVA x 16.69 lakh) at 3 years, Rs 200 Cr (claimed 1,200 MVA) at 5 years. Market-side ceiling is Rs 312 Cr at 3 years on +1pp share, so use the lower. Reading B (realisation 11.29 lakh) gives Rs 101.6/135.5 Cr (CAGR 13.2/14.1%); H1 FY27 Rs 52.68 Cr needs at least 11.70 lakh per MVA at 100% fill of certified half-year capacity, which strains B. Separator: H1 FY27 MVA made. 5,000 MVA facility (Rs 834 Cr ceiling) uncarried: no capex filed. LBF-1: Rs 120 Cr plausible (H2 needs 89.6% of certified), Rs 180 Cr not supported, 30-50% after FY27 needs new capacity. SAM is an upper bound (filters 2-4 unquantified)."
