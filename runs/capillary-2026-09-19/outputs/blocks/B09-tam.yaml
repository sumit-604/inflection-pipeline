analyst_note: "The single most consequential judgment call in this stage is the market-definition boundary in 1A/Method 2: management's $18.2B headline is for the whole loyalty ecosystem (software+agency+rewards), while Capillary's own concall admits software is under 10% of that. Every downstream SAM/SOM/headroom number in this report uses the narrower, ~$1.0-1.3B software-only reading, which is materially more conservative than a naive read of the investor decks would produce. If a later stage instead anchors to the $18.2B or $17B Zinnov figure directly, the headroom/runway conclusions here will look far too conservative by comparison; that difference is the market-definition choice, not a data error, and should be reconciled explicitly rather than silently overridden."
