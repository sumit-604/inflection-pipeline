valuation_methods:
  primary: {method: "Cycle-normalized P/E anchored to Section 1B destination PE", why: "Sole exit-multiple authority
      per CLAUDE.md; Amendment 17 bars the depressed spot-year (FY26/Q1FY27) grain spread from defining the base"}
  secondary: {method: "EV/EBITDA", why: "Cross-check that captures the FY26 leverage distortion (Debt/EBITDA 3.29x
      standalone, AR p.107) a pure P/E can understate"}
  tertiary: {method: "Sum-of-the-parts (SOTP)", why: "CBG, SAF and retail fuel are pre-earnings, option-like legs
      beside the mature ethanol core; a single blended multiple risks double-counting or missing this optionality"}
  not_applicable:
  - "DCF as primary (feedstock-spread volatility, maize Rs17.50 to Rs25.50/kg within one year, makes multi-year
    cash-flow forecasting unusually input-sensitive without a separately underwritten spread assumption)"
  - "Dividend discount model (no established dividend policy disclosed)"
  - "Replacement cost / asset-based NAV as primary (relevant only as an R0/floor sanity check)"
  - "Precedent transactions (no disclosed comparable pure-play ethanol-distillery transaction in this corpus)"
irrelevant_ratios:
- {ratio: "Gross margin %", why: "output price is government-fixed by feedstock type; the informative number is
    absolute spread per litre, not a percentage margin mixing manufacture, trading and scheme income"}
- {ratio: "Trailing P/E", why: "FY26 PAT was 73.2%-underwritten by government-scheme income at the PBT level (B02/B03);
    unadjusted trailing EPS overstates earnings quality"}
- {ratio: "Debt/Equity ratio (as an improvement signal)", why: "FY26 improvement to 0.61x standalone (AR p.107) is
    an IPO-dilution effect; net debt itself rose (B02 rank 3, AR Note 53)"}
- {ratio: "Revenue growth YoY (single year)", why: "the FY26 9.33% standalone decline (AR p.105) was a planned three-plant
    shutdown for multi-feed conversion, not demand loss"}
- {ratio: "Return on Equity (FY26 print)", why: "fell mechanically because the equity base roughly doubled on IPO
    proceeds mid-year, a denominator effect (AR p.107)"}
- {ratio: "Inventory turnover (FY26 print)", why: "fell 56.60% standalone (AR p.107) on a deliberate feedstock stock-build
    ahead of the multi-feed ramp, with no management composition narrative given (B02 rank 6)"}
