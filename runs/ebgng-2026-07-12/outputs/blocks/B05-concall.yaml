  - {question: "What credit/receivable terms do peer IT distributors extend to channel partners, and how do their debtor-day trends compare to GNG's stated 30-45 day range (drifted from ~30-35 to ~40-45 days over FY26)?", why: "Benchmarks whether GNG's working-capital drift is industry-standard or company-specific, and therefore a genuine execution/credibility concern", check_peers: ["Redington", "Rashi Peripherals (RPTECH)", "CNL"]}
