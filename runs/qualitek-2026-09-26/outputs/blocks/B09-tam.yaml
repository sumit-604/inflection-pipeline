analyst_note: "SOM 3yr/5yr (Rs 331 Cr / Rs 504 Cr, 38.6%/32.3% implied CAGR) converge closely with management's own, independently-arrived-at figures (Rs 500 Cr FY31 target; FY27 +35-40% guide), despite starting from market-share-gain arithmetic rather than management's internal plan. Treat this convergence as a mild positive cross-check, not proof: both paths share the same underlying assumption that continued M&A, not organic capacity, funds most of the growth (Section 3C), and TAM itself carries a 4x method-divergence that was resolved conservatively, not definitively. FTTCP should use the SOM CAGR range (32-39%) as the growth cross-check per this stage's formal handoff, and should weigh the capacity gap named in 3C alongside it."
