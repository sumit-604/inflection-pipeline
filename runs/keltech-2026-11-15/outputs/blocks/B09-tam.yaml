analyst_note: "Central SOM holds the FY26 explosives revenue growth of 11.7% (volume +8.4%, realisation +3.1%, derived from AR p.28 and p.137) against a SAM growing 7.4%. That adds only 0.4 to 0.8 points of share, below the 1-2pp rule, because the base share (3.6%) is small. The high reading (+1pp by Year 3) gives about 13% company CAGR. The one observation that separates them is H1 FY27 volume in MT, which no filing gives; H1 FY27 sales rose 31.9% but peers say much of FY27 growth is price. SAM is a ceiling: 10,507 is TAM less exports only. TNT is not in any number here. Reading B of B04 (own-use accessories) would add no external SAM at all."
