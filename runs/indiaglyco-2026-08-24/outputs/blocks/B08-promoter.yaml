verdict_basis: "Clean promoter-personal legal/regulatory record (SEBI, criminal, ED/PMLA, NCLT-oppression all clean) plus 0% pledge, disciplined and audited use of a large fresh capital raise for debt reduction, an explicit current-year 'no independent director resigned' statement, and real multi-pronged transition evidence (institutional allottees incl. QRG Investments, outside-professional COO hire, coordinated ID refresh, promoter holding company folded into listed entity) outweigh five named but non-severe cautions (RPT entity sprawl, promoter-as-landlord rent, an unresolved and inconsistently-disclosed 13-year NSEL legacy receivable, a near-max-tenure non-Big4 auditor, one promoter NED's weak attendance)."
analyst_note: "The NSEL/IGL Finance exposure and the internal AR inconsistency on its FY26 closing balance is the single item most worth a follow-up ask to management or the FY26 auditor: Rs 20.4cr carried as 'good' 13 years after a well-documented exchange default is an optimistic judgement call, and the AR's own notes do not agree on whether that balance is still open at 31 Mar 2026. It does not implicate promoter integrity directly (runs through a WOS) but is a capital-allocation and disclosure-quality signal to carry forward. Status partial: three primary-source WebFetches egress-blocked; substance recovered via WebSearch (news-tier, not filing-tier)."
