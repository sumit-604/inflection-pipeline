analyst_note: "Q2 PAT (908, -47% QoQ) is a treasury event: consol other income swung 1,067 to (76) while consol EBITDA rose 22.7% YoY to 1,592 (37.1%), and the expansion is cost-led (flat employee cost). Three points A4 must not lose. (1) The S-vs-C gap widening to -14.6% is associate drag (153 of 155). The Q2 FY26 base was flattered by a standalone-only ~160 impairment [INFERENCE], which also inflates the reported standalone YoY margin jump (+8.3pp reported, about +3.8pp adjusted). (2) Capital keeps flowing to loss-making investees: 822 in H1 vs 471, and the unallocable segment ties to the rupee (7,629+822-299-71=8,081). Seven-associate losses rose 20% QoQ, and marks are negative for a second H1. (3) Deferred-revenue build slowed (637 vs 728). The collections proxy grows below revenue (consol +8.5% vs +10.5%, SA +7.7% vs +8.3%), so Web growth is drifting to high single digits. MonotaRO's exit still has no disclosed outcome; the 200 vs 71 FV-loss gap is the candidate home. The unaudited share of 18.3% of PAT is mostly a denominator effect, but paragraph (b) drafting may put all associate info outside audit."
