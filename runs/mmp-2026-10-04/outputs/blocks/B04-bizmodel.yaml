cyclicality: cyclical
moats_present:
  - "Process know-how in aluminium atomisation and milling, 40+ years, hazardous process, AVL Belgium and Toyo Aluminium links: moderate durability, not quantified, B01 moat_class NONE stands"
  - "Customer qualification cycles (pharma foil, utility vendor approval for insulators, 1.5 to 2 years validation per Call p.17): claimed by management, unproven in margin (foil segment margin 2.00%); durability low to moderate"
  - "Anti-dumping duty on Chinese foil (AR26 p.51): regulatory tailwind, not an owned moat; sunset date NOT FOUND"
valuation_methods:
  primary: {method: "P/E on normalised consolidated earnings, built bottom-up by segment (volume x EBITDA per MT less depreciation, interest, tax, plus associate share), exit multiple from Section 1B only", why: "Entry and exit must sit on one earnings basis (v3.8 Amendment 18). Earnings are positive and lumpy. Converter slices fall under v3.7 Amendment 17, so normalised, not spot-year, inputs. Associates are 20.5% of FY26 PBT and need a stated treatment in Stage 11"}
  secondary: {method: "EV/EBITDA on consolidated EBITDA ex-associates", why: "Net debt is rising (gross debt 184.5 Cr, ND/EBITDA 2.75x) and finance cost is 13.3 Cr, so a leverage-neutral cross-check is needed. Associate profit is excluded from EBITDA, which keeps the two methods apart"}
  tertiary: {method: "Sum-of-parts for associates (Star Circlips 26.06%, Toyal 26%) and the insulator start-up at invested cost", why: "Associate profit is non-cash (dividend 9.98 L against 742.70 L share of profit) and both are unlisted; a holding-value cross-check stops double counting"}
  not_applicable:
    - "DCF as primary: FCF is negative (FY26 -2.32 Cr before borrowing, B03) and a heavy capex plan makes terminal inputs a guess"
    - "EV/Sales: aluminium price inflates revenue, and segment margins range from 2.0% to 11.9%"
    - "P/B as primary: ROE 9.3% in FY26; book value is not the earning asset in a start-up phase"
    - "PEG: growth is lumpy and partly start-up driven"
    - "Dividend yield: maiden dividend Rs 2 per share, payout 19.2% (B03)"
    - "EV per tonne of capacity or replacement cost: volumes and capex per MTPA NOT FOUND"
irrelevant_ratios:
  - "Spot-year ROCE and ROE (FY26 10.12% and 9.26%): capex-phase compression and fire year; Amendment 17 forbids spot-year ROCE into Section 1B for a converter"
  - "EBITDA margin percent read alone: aluminium price changes the denominator, so margin per MT and spread carry the signal"
  - "Revenue growth percent alone: price and volume split is NOT FOUND; part of +19.1% is metal price"
  - "Headline P/E: 20.5% of FY26 PBT and 26.5% of PAT is associate share, mostly non-cash"
  - "Current ratio (1.26) and D/E (0.53): 76.6% of debt is working-capital debt rolled yearly; use net debt to EBITDA and DSCR"
  - "Rupee working-capital trends: metal price inflates inventory and payables; use days"
must_track_metrics:
  - {metric: "Consolidated gross margin percent (revenue less COGS)", healthy: "21% or above (Q1 FY27 21.0%; FY25 22.8%); company's own history, no peer band found", red_flag: "below 19% (Q1 FY26 19.1%; FY26 20.5%)"}
  - {metric: "Powder segment result margin", healthy: "12.4% or above (FY25 12.37%)", red_flag: "below FY26 11.88% for two quarters"}
  - {metric: "Foil segment result margin", healthy: "rising above 2.00% each quarter as printed foil and lidding foil scale", red_flag: "at or below 2.00% through H1 FY27 after launches"}
  - {metric: "CFO net of short-term borrowing and payables, as percent of EBITDA", healthy: "above 50%", red_flag: "below 25.6% (FY26)"}
  - {metric: "Net debt to EBITDA, with DSCR", healthy: "at or below 3.0x and DSCR 2.5 or above", red_flag: "above 3.0x or DSCR below 2.5 (FY26 2.75x and 2.51)"}
unit_economics:
  unit: "1 MT of aluminium powder (powders are 61.2% of FY26 gross sales and 89.6% of segment result)"
  revenue_per_unit: "NOT FOUND (no tonnage volume in AR26, decks or release)"
  margin_per_unit: "Management guide EBITDA Rs 37,000 to 42,000 per MT for powders, Rs 12,000 to 15,000 for foils, Rs 15,000 to 18,000 for conductors and cables (Call p.20); FY26 actual per MT NOT FOUND"
  key_lever: "Spread over ingot cost set by grade mix (value-added and export grades against commodity grades) and by utilisation (powder about 80%, rolling mill 80 to 85%, foil conversion about 45%, Call p.16). Opex is 12.0% of revenue in both Q1 FY26 and Q1 FY27, so the whole Q1 gain came from gross margin (+190 bps)"
