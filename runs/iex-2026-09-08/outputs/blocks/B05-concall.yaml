rework_note: >
  Targeted amendment. Built a segment-by-segment volume table (new Section
  1D) from the four Power Market Update filings (day-ahead incl. HP-DAM,
  real-time, term-ahead, green, REC; FY26, Q1FY27, Jun/Jul/Aug 2026 with
  YoY) and differenced it against the nearest call's narrative, segment by
  segment, which run 2 had not done. That procedure surfaced five MAJOR
  items: (1) the REC "confusion" explanation (Jul-2026 call) names the
  demand side, but the company's own Power Market Update filed three weeks
  earlier shows sell bids -86.1% YoY with clearing prices RISING, a supply
  failure, not a demand failure; severity raised LOW-MEDIUM to HIGH. (2) The
  Apr-2026 CERC REC-amendment (captive plants barred from trading to the
  extent of self-consumption) was framed as inventory-enhancing one quarter
  before REC sell bids collapsed. (3) Green market growth decelerated +23%
  FY26 -> +6.3% Q1FY27 -> -1.2% June, filed before the 24-Jul call, which
  called green "substantial" without naming the deceleration. (4)
  Market-share disclosure precision degrades every quarter as the coupling
  threat rises: 84% full split -> 83% with TAM restated 35% to 45-50%,
  unexplained -> no figure -> bare 80-85% range. (5) Day-ahead volume is in
  outright decline in June (-6.6%) and July (-7.7%), the exact segment
  coupling threatens, previously used only as realization-gap background.
  Two evasion/falsification corrections: the fee-competition question was
  evaded twice, not once (Nov-2025 "let us talk about peace"; the pricing
  half of the identical Jul-2026 question was never answered by anyone);
  and "things will definitely go in our favour" (Q3FY26) was falsified 14
  days later by APTEL's dismissal of IEX's own appeal for want of standing
  plus CERC's subsequent draft coupling regulations — the prior promise
  table booked only the timing half as delivered and never scored the
  substantive half, flattering the tally by one row; both legs now booked.
  Three classification corrections: "market coupling by January 2026"
  removed from the MANAGEMENT promise tally (a CERC regulatory deadline, not
  a company promise); "no significant margin impact" removed from the
  missed-promise tally (a post-coupling hypothetical answer, not a forward
  promise; the realization decline stands on its own); the M-Junction/MSTC
  exclusion claim downgraded from "regulatory fact sourced to notified
  rules" to management's own characterization, since the Coal Rules text is
  not in the corpus. ROE finding kept but tempered: average-standalone-
  equity ROE computes to 39.4% (vs 36.3% on closing equity), narrowing but
  not closing the gap to the stated 42-44%. One kept promise added: the
  CFO's Apr-2026 treasury-income recovery commitment, verified delivered
  from the filed results (Rs22.11cr Q4FY26 to Rs44.92cr Q1FY27, standalone).
  Every citation re-verified by grep against the "=== PAGE n ===" marker;
  several of run 2's citations were off by one page and are corrected (the
  margin-hypothetical quote is Q4FY26 marker-page 15 not 14; Q3FY26 market
  share is marker-page 16 not 9; the other-income admission is marker-page
  10 not 9). Independent credibility grade this run: D, down from run 2's C.
