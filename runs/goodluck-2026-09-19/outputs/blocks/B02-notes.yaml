questions_for_mgmt:
  - "Who is the minority (NCI) investor in Goodluck Defence and Aerospace Ltd, what stake was acquired or issued, and at what price or valuation basis, across the FY24 (~Rs 31.19cr) and FY25 (~Rs 3.46cr) equity events, and why does the FY26 AR relabel the FY25 event 'Investment by NCI' when the FY25 AR itself called it 'Acquisition (sale) of Non-Controlling Interest'?"
  - "What is the nature, counterparty, and commercial terms of the Rs 11-33cr/year 'Others' related-party advances and the Rs 12.40cr outstanding receivable that appear only in the consolidated Note 32, not in the standalone parent-only note?"
  - "Given GDAL has generated negative operating cash flow in both FY25 and FY26, what is the funding plan for its Rs 284.70cr incremental consolidated capital commitment?"
  - "Why is the Note 8 FY25 comparative trade-receivables ageing table numerically identical, bucket for bucket, to the FY26 table, and can a corrected FY25 ageing schedule be provided?"
  - "What is the nature and counterparty of the ~Rs 10.98cr loan outstanding to a non-subsidiary 'Other' party disclosed in the CARO annexure but not separately named in the standalone Notes?"
receivables_trend: "STABLE - closing standalone balance improved Rs 519.51cr to Rs 487.98cr (-6.07%) while revenue grew +3.35%, and no single-customer concentration or new ECL issue is disclosed, BUT the Note 37 turnover-days ratio worsened 40.77 to 45.67 days (+12.0%) and the Note 8 FY25 comparative ageing table is bucket-for-bucket identical to the FY26 table, a disclosure-integrity issue that blocks independent verification of the true prior-year ageing (Note 8, p.158; Note 37, p.179)"
restatements_found:
  - "Generic unquantified boilerplate: 'previous year figures have been regrouped/reclassified/rearranged wherever necessary to confirm to the current year' (Note 40 standalone p.180; Note 44 consolidated p.224), no specific line item named"
  - "GDAL NCI equity event for FY25 relabelled between the FY25 AR ('Acquisition (sale) of Non Controlling Interest', p.204) and the FY26 AR comparative ('Investment by NCI', p.192); identical rupee figures, different transaction description, no explanatory note in either AR"
going_concern_language: "NONE - standard SA 570 audit-procedure boilerplate only, explicit clean statement in both standalone and consolidated auditor reports: 'nothing has come to our attention... that Company is not capable of meeting its liabilities... as and when they fall due within a period of one year' (CARO, p.143). Directors' Report Rule 8(5)(vii) line ('no material orders... which would impact the going concern status', p.47) is generic Companies Act boilerplate, not company-specific."
analyst_note: "The two Pass 3 pattern findings point opposite directions and both matter. P3-1 (CSR) shows the AR's drafting is better than a single-note read suggests: the apparent CARO contradiction fully resolves inside Note 36 itself, so the accounting_quality score is not further penalised for it and it is deliberately excluded from red_flags. P3-2 (GDAL NCI relabelling) shows the opposite: reading only the FY26 AR undercounts a three-year-old, still-unexplained minority-equity event by roughly 11x (Rs 3.46cr visible vs ~Rs 37.65cr cumulative), and the transaction's own description changed between AR editions with no note. Downstream stages valuing GDAL or assessing LBF2 should treat the NCI investor's identity and pricing as unresolved, not merely under-disclosed, and should not assume the FY25 AR's comparative figures were carried forward with descriptive fidelity."
