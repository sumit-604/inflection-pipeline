analyst_note: "The dominant frame is a young, first-year-listed company assembling governance infrastructure (new CFO, CS, two independent directors, new secretarial/internal auditors, all 2024-2026), not a legacy problem promoter proving a turnaround. Every caution item traces to either brand-new infrastructure or a first-year filing slip, not a repeated pattern. The one item worth the operator's own direct check beyond this run: incoming statutory auditor M.A.M and Associates has no findable public track record, taking over from an auditor whose own CARO Annexure already carries an unquantified qualification the Board's Report denies exists."
