fttcp_overrides_authoritative:
  override_1_pillar1_roce_and_surplus_cash: "Operating ROCE ~40-44% (not normalized 30% blend). Surplus cash Rs 22-27 Cr valued separately at 1x. Base PE ~26x. Surplus cash treatment: idle IPO cash not left in ROCE denominator. Strategic Premium ROCE route barred (single credit per AMAGI precedent)."
  override_1_anchor: "FTTCP Deliberation Override 1; operator's stated reasoning: 'It is a high-growth company, and you are giving it a price-to-earnings of less than 20. Have you gone mad?' and 'If it is a 40% ROCE company, your starting base multiple should be higher.'"
  
  override_2_forward_pe_method: "Destination PE applied to EXIT-YEAR FORWARD EPS (FY29 forward earnings). Growth priced in forward earnings, not stripped or double-counted. Pillar 3a = +0x (no growth score awarded; growth in forward ladder, not multiple premium)."
  override_2_anchor: "FTTCP Deliberation Override 2; operator's stated reasoning: 'You are not giving any score for the growth visibility. Either you take it to the forward price-to-earnings method. If you are not giving a score in growth visibility, then you need to take it to the forward price-to-earnings.'"
  
  cash_multiplier_disposition: "0.80x per 67.8% CFO/PAT FY26. INDETERMINATE determination caps disposition at PROCEED WITH CAVEATS. 1.0x only if receivables ageing clears it."
  cash_anchor: "FTTCP Deliberation Ruling 7, Ruling 8"
  
  sector_cap_corrected: "Cables / Industrial products, 25x (NOT Pharma/CDMO 38x manifest defect). Alternative EV charging/energy transition equipment 28x, not used absent documented AVANA energy-transition positioning."
  sector_anchor: "FTTCP Deliberation Ruling 4"
  
  ua_multiplier: "BARRED. Listed under 12 months (IPO 19-Jan-2026). Tier A, 25% hurdle applies if qualifiers met."
  ua_anchor: "FTTCP Deliberation Ruling 12"

