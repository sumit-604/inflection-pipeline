analyst_note: >
  LBF1 is well anchored: FY27 revenue guidance ~Rs6,500cr (25% growth) and
  export guidance ~Rs600cr are explicit and repeated across Q3 FY26, Q4 FY26
  and Q1 FY27 calls. Q1 FY27 actuals (revenue Rs1,509cr, ~Rs6,000cr run-rate
  per Dheeraj Garg himself; exports Rs127cr) sit one quarter into a
  four-quarter guide - not yet a miss, but the export number needs a hard H2
  FY27 check before crediting the full Rs600cr. LBF2 (EBITDA/wheel Rs314 vs
  Rs262, alloy ~35% of revenue) is directly confirmed and ahead of the FY27
  guide the company itself set six weeks earlier. LBF3 (factoring Rs400-500cr)
  is directly confirmed by Pranav Jain on the Q1 FY27 call, but management
  never volunteers the 67.6%-of-payables scale or its CFO effect that B02
  flagged - the widest gap between what the documents show and what the
  calls say. LBF4 (AMW) is discussed only as a capex/land-reuse story; its
  losses, DTA growth and adverse CARO finding never surface on any call.
