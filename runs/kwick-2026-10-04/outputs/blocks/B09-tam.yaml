analyst_note: "Central SOM is a floor, not a forecast. SAM Rs 416 Cr is the annualised SMFC pool only (2,080.5 / 5). Kwick scheme-linked revenue is Rs 78.7 Cr (gov 58.37 plus dealer-route kits 20.36 [INFERENCE]), 18.9% share; +5pp cap gives Rs 99.4 Cr; non-scheme revenue Rs 27.0 Cr held flat; SOM3 = SOM5 = Rs 126.4 Cr. Two readings. Floor: pool flat, CAGR 6.1% / 3.6%. Upside: non-scheme revenue grows at the Deloitte-DSCI 40% digital forensics rate, giving Rs 173.4 Cr yr3 (17.9%) and Rs 244.5 Cr yr5 (18.3%). Pool growth of 10% a year gives 14.6% yr3; 20% gives 23.4%. Separator: H1 FY27 non-government and cyber revenue, and any scheme approval after SMFC. tam_growth_pct 40 is digital forensics only; scheme pool growth NOT FOUND. P/E and margin for line 5E: NOT FOUND here, stage 11 owns them."
