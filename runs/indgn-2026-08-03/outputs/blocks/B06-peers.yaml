  pricing_inputs: "No raw-material commentary anywhere (services-only peer set, confirms Indegene's not-applicable classification); margin pressure in peers is wage/FX/bonus/client-cost-takeout driven, not GenAI-licensing-cost driven as Indegene frames it -- only IKS's rising R&D-as-%-of-revenue is a partial analog."
