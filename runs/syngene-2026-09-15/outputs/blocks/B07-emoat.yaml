analyst_note: "The scan's central finding is a segment mismatch, not a missing-evidence problem: the two Strong-scoring categories (B2, C1) both anchor to BMS, which lives in Research Services, the segment management admits is losing clients on price. The new capex (Bayview, Unit 3, ADC suite) sits in CDMO, the segment that lost its Zoetis anchor, and carries no named replacement customer anywhere in the corpus. I1 and I2 both score 0 by design (no named-inventor/pay-scale evidence for I1; the BMS relationship is an execution lead, not a configuration a competitor is structurally blocked from copying, for I2) - this run does not contribute to the I1/I2 threshold-crossing review list. The AR's internal BIOSECURE/China+1 contradiction (E2) is carried as a flag for Second-Order resolution, not resolved here."
