    values: [{block: B02-notes, value: "AR prints no working-capital days"}, {block: B03-ardeep, value: "244 at FY26 vs 202 at FY25, Chairman letter Annual_Report_2026.pdf [page 7]; definition NOT FOUND"}, {block: B01-gate0, value: "336 at FY26, 369 at H1 FY27 annualised (stage calculation on revenue basis)"}]
    disposition: "B03 governs on existence: the AR prints 244 vs 202 with no definition. 336 / 369 are stage calculations on a different basis, not a conflict of a printed figure. The July tripwire figure 344 has no basis in this corpus."
