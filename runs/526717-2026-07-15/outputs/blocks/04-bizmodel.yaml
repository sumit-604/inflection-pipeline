valuation_methods:
  primary: {method: "EV/EBITDA", why: "EBITDA is the stable cross-cycle metric for this capital-intensive, cyclical-margin manufacturer; PAT is distorted by rising finance costs and leverage-driven returns"}
  secondary: {method: "P/E", why: "Usable cross-check now that genuine profit has returned, but must be read against the leverage-driven ROE caveat (equity multiplier ~4.75x consolidated)"}
  tertiary: {method: "EV/Sales", why: "Useful during the current capacity-utilisation ramp (31% FY25 of 24,300 MTPA base) where revenue growth is outrunning margin normalisation"}
  not_applicable:
    - "DDM - no established multi-year dividend policy; FY25 dividend section itself carries an apparent stale copy-paste error"
    - "Sum-of-the-parts - Label Division is under 1% of consolidated revenue"
    - "Asset-based/replacement cost - operating turnaround makes earnings-based approach more relevant than liquidation-style approach"
irrelevant_ratios:
  - {ratio: "Gross margin as reported", why: "RM cost is contractually pass-through; swings reflect pass-through timing lags, not pricing power changes"}
  - {ratio: "ROE standalone/consolidated", why: "Leverage-driven (equity multiplier ~4.75x consolidated), not evidence of a self-funding operating model"}
  - {ratio: "PAT/PAT growth alone", why: "Genuine turnaround but operating cash flow was negative both years; profit has not converted to cash"}
  - {ratio: "Standalone-only revenue/margin figures", why: "Subsidiary K.P. Woven is 3.2x parent revenue; standalone alone understates scale and masks intercompany trading dominance"}
  - {ratio: "Reported MD&A Risks & Concerns section", why: "Content-free boilerplate, omits all nine material risks evidenced elsewhere in the same filing"}
must_track_metrics:
  - {metric: "CFO/PAT and CFO/EBITDA", healthy: "sustainably positive, trending toward >0.7x", red_flag: "negative for a second consecutive year"}
  - {metric: "EBITDA margin", healthy: "7-9% range per rating agency projection", red_flag: "sustained fall below 7%"}
  - {metric: "Related-party % of revenue/COGS", healthy: "declining from FY25's 46.6%/37.5% revenue, 62.6%/70.4% COGS levels", red_flag: "further increase or disclosure-granularity regression"}
  - {metric: "Capacity utilisation", healthy: "rising from FY25's 31% base", red_flag: "stalling or falling"}
  - {metric: "Operating cycle (days)", healthy: "holding at or below FY25's 96 days", red_flag: "further elongation"}
