analyst_note: "The filing's profit is treasury income. Operating segments lost 209.47 lakhs in Q2. Unallocable income, mostly ICD interest, was 93.9% of total income, and H1 operating cash before working capital was negative. The ICD book grew: standalone loans rose Rs 68 Cr to Rs 2,349.90 Cr, counterparty unnamed. HGHL UK, reviewed by another auditor and holding 26% of group assets, holds about Rs 721 Cr more in loans (derived by subtraction). Two cash calls sit against Rs 175 Cr cash: the Rs 148.72 Cr dividend paid after the quarter and Rs 282.75 Cr of income tax liabilities. Paying both needs an ICD recall, and whether one happens tests the leakage tripwire. The EoM guarantees are secured on company property, so land sales may need lender consent. Several note-text mismatches (guarantee 109,640 vs 109,610, dates, advance amount) come from an OCR text layer; verify on the page image first. A1 put the Mar-26 'Reserves' value in the H1 FY26 column at R1606/R2073. No prior-quarter fulltext was supplied, so the F5 and F15 diffs were not run verbatim."
