  - "Related-party/JV revenue concentration of approximately 50% of standalone revenue, compounded by unresolved cross-document contradictions (MD remuneration Rs 277L vs Rs 157L; Asian Indwell JV revenue Rs 315.28L gap) and an unusually large, unexplained Rs 72 Lakh professional fee to a non-executive director"
best_fit_strategy: "Turnaround (watchlist grade); GARP close second, also watchlist grade"
one_line_verdict: "Diversification turnaround is real and evidenced; cash conversion and disclosure consistency need FY26 proof before the compounding thesis holds."
