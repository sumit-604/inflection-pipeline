  - {metric: "Organic (standalone) revenue growth", healthy: "at or above 20% with subsidiary split", red_flag: "growth only from consolidation"}
  - {metric: "Top customer and top 10 share", healthy: "top 10 below 81.76%, top customer below 15.76%", red_flag: "any top 10 loss or share rising"}
  - {metric: "EBITDA margin", healthy: "13.3% or higher", red_flag: "below 12%"}
unit_economics:
