kill_switch_notes:
  - "Phase 1: would NOT stop -- clean opinions, no fraud, no going concern, no borrowing default; would flag the single small regional audit firm covering 100% of the group (parent + material subsidiary) alongside a literal 'no KAM identified' finding as a governance item to weigh, not a mechanical failure."
  - "Phase 2: WOULD have reason to pause and question management directly before sizing a position -- a material guarantee sits entirely outside the Contingent Liabilities disclosure framework, the ECL allowance did not move despite a tripling risk bucket, and two pairs of notes in the same financial statements contradict each other on receivables direction/quantum -- none of this is a mechanical audit failure."
  - "Phase 3: would NOT stop outright (no covenant breach, low absolute leverage, margin-driven ROE per DuPont) but would want the standalone cash-conversion trend addressed against Q2/Q3 FY27 data before increasing position size."
  - "Phase 4: would treat the MD&A/Chairman's letter as a low-information document for risk purposes given zero named company-specific risks anywhere in 167 pages, and would underweight the front-matter narrative relative to the Notes -- a disclosure-quality/how-to-read-this-filing observation, not a going-concern or fraud signal."
  - "Phase 5: would NOT stop on governance grounds alone -- no fraud/regulatory-action/promoter-selling signal -- but would want direct answers on the Menon Brakes advance terms and the MD+CFO transition drivers before treating governance as a non-issue."
