analyst_note: "Every financial line in this release is a ratio or a non-statutory label. Three gaps stack. Total Income (line 70) may include other income. Adjusted EBITDA (line 71) has no definition. No rupee PBT or PAT is printed. Checklist item 1 recorded Q1 FY27 operating PBT ex-OI at -4.86 Cr. So the 'fourth consecutive quarter of positive PBT' (line 80) can be true on reported PBT while the operating test fails, and this release cannot separate the two. Second, Housing.com is described as acquired and owned (lines 59, 149) in the quarter of the July-2026 swap. The 57% YoY may therefore carry inorganic income, and no organic split is given. Third, the printed 57% does not tie to 137/88 (55.7%). Unrounded figures could close the gap, so it is a question, not a charge. Silence on all nine checklist items is normal for a press release. It turns confirmatory negative only if the concall repeats it. A4 should read the results filing (other income, segment results, goodwill, share capital) before it writes these questions. Ten A1 rows carry minor line-cite drift (report section 0); R058 'YoY' sits at line 69, not 60."
