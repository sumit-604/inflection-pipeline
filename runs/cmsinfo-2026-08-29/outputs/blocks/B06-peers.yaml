analyst_note: "Peer set splits cleanly by claim type. Sector-wide cost/repricing claims (wage inflation, IBA-committee mechanism and timeline) get real, two-peer corroboration. The DSO claim gets directly contradicted by both direct peers in the same window, which matters more than a routine miss because AGSTRA's history makes DSO drift a leading indicator in this specific sector. The ATM-specific claims (currency shock magnitude, fulfilment %, transaction-fee-model death, AGS-share sum) are all unverifiable for a structural reason, not a denial: no peer in this 6-name set discloses current-period ATM-replenishment financials. Stage 11 should treat LBF-2 as resting entirely on CMS's own transcript plus third-party CATMi/RBI data, zero peer corroboration, while treating the DSO contradiction as elevating rather than lowering the priority of company memory Gap G-1."
