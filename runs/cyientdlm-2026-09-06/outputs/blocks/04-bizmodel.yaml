mgmt_questions:
  - "Which is the real B2S share of FY26 revenue: the BRSR-disclosed 25% or the infographic-disclosed 6%, and how does the FY27 double-digit target reconcile with whichever is correct?"
  - "Why did Altek Electronics Inc standalone PAT fall from about Rs39.70mn over six months in FY25 to Rs31.32mn over the full FY26?"
  - "What specifically is driving the finished-goods inventory build-up, and when does NWC peak and reverse?"
  - "Is capacity utilisation actually rising as order intake grows, and by how much?"
  - "What is standalone (India parent) revenue guidance for FY27, independent of the US subsidiary?"
  - "What is the plan to reduce customer concentration further, and which named new-logo wins convert to volume in FY27?"
  - "Given 85-90% import dependency on components, what is the realistic timeline and margin impact of PLI-supported localisation?"
one_line_verdict: "A two-entity EMS story where a US turnaround masks an India core in decline, riding a real but small and disputed design-led margin transition."
analyst_note: "The single most important finding this stage produced is Flag 1: the AR contradicts itself on B2S share (25% BRSR against 6% infographic) in ways that materially change how fast the margin-accretive transition is actually running. Downstream valuation and FTTCP work should NOT average or split the difference between 6% and 25%. Treat 6% as the working number, corroborated independently twice, and raise the discrepancy as a named question. Separately, the two-entity divergence (India parent shrinking, US subsidiary swinging to profit substantially via a one-off earn-out reversal) means any single blended growth or margin number for FY27 guidance should be sourced from management with the standalone and consolidated split explicit, never inferred from the consolidated print alone."
