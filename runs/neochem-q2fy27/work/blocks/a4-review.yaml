analyst_note: "Operating EBIT rose 42.6% YoY, in line with PAT (+43.1%). Core PBT ex-other-income rose 68.7%, but 17.4% of that gain is interest saved by the FY26 equity-funded debt paydown, and borrowings are up 85.9% since. Sequential operating leverage is absent: other expenses rose 29.5% HoH on sales +6.3%. The weak points are cash and disclosure. H1 CFO of -1.05 Cr rests on a 21-day payables stretch and nil tax paid; had the 2.63 Cr provision been paid, CFO would be about -3.68 Cr. FY26 receivables rose 23.45 Cr, 1.95x FY26 PAT, with no provision. The fraud, the 8.02 Cr unexplained rise in ST advances, the nil tax payment and the CFO change fall in one half; ask Q1, Q3 and Q5 together. A4-OBS-1: the 26-Oct call notice named Solanki CFO a day before his replacement. Role 1 must use per-share growth (+1.3%). The screener PE of 23.3 does not reconcile; filed trailing PE is about 12.4x. Verdict FLAGS, not CAVEATS, because governance items stack on an INDETERMINATE cash reading."
