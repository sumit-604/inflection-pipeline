verdict_basis: "No legal, pledge or auditor finding; CAUTION for a Rs 456 crore promoter block sale in May 2025, three unreconciled MD pay figures with Rs 585.02 lakh commission from subsidiaries, and a promoter preferential at Rs 600 against a Rs 775 QIP three weeks later; offset by an outside CEO from 3 Apr 2026, Rs 75 crore promoter subscription and institutional QIP."
analyst_note: "The 14 Nov 2026 SAST Reg 29(1) was filed by Axis Mutual Fund (5.12%), not by promoters. The brief's 26.51% promoter holding is QIP dilution: promoter shares were 85,207,322 at both 30 Sep and 12 Oct 2026 and no promoter sale appears after 31 Mar 2026. The 2025 sale was one block of 99,00,000 pre-split shares on 22 May 2025 at about Rs 461 (Rs 230.5 post-split); promoters then paid Rs 600 post-split. Weigh the Rs 21.9 crore value gap above cost on the QIP price as minority-treatment, not a breach. The Trilegal link needs FY27 fee data. MCA, court and proxy-advisor checks were not reachable, so status is partial."
