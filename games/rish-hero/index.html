function spawnGens(e) { const cx = G.mw * TS / 2, cy = G.mh * TS / 2; for (let i = 0; i < 3; i++) { const a = i * 2.094 + 0.5, g = spawnEnemy("gen", cx + Math.cos(a) * 230, cy + Math.sin(a) * 150); g.alert = true; } }

// ---------- Bullets, grenades, rockets ----------
function bulletsUpdate(dt) { const P = G.p;
  for (const b of G.bullets) { if (b.dead) continue; b.life -= dt; b.px = b.x; b.py = b.y; const steps = 3; for (let s = 0; s < steps && !b.dead; s++) { b.x += b.vx * dt / steps; b.y += b.vy * dt / steps; if (shotBlockAt(b.x, b.y)) { b.dead = true; spark(b.x, b.y, 3, "#ffd166", 90, 0.2, 2); break; }
      if (b.o === "p") { for (const e of G.ents) { if (e.k !== "enemy" || e.dead) continue; if (hyp(e.x - b.x, e.y - b.y) < e.r) { b.dead = true; S.stats.hits++; hitEnemy(e, b.dmg, b.x - b.vx * 0.01, b.y - b.vy * 0.01, 40, 0, "bullet"); break; } } }
      else if (hyp(P.x - b.x, P.y - b.y) < P.r) { if (P.roll > 0) continue; b.dead = true; hurtPlayer(b.dmg, b.x - b.vx * 0.01, b.y - b.vy * 0.01); } }

    if (n.t <= 0) { n.dead = true; explode(n.x, n.y, n.rocket ? 80 : 110, n.o === "p" ? 70 : (n.rocket ? 18 : 24), n.o); } }
  G.nades = G.nades.filter((n) => !n.dead); }

// ---------- The world: hostages, bombs, pickups, lasers, objectives ----------
function worldUpdate(dt) { const P = G.p, L = G.L;
  if (G.timer > 0 && !G.done && G.ob.defuse < G.ob.defuseN) { G.timer -= dt; if (G.timer <= 0) { G.timer = 0; for (const b of G.ents) if (b.k === "bomb" && !b.done) explode(b.x, b.y, 160, 0, "e"); showFail("The bombs went off!", "The school is evacuated in time, but you must try again. Go faster, and use Focus (F) to slow time."); return; } if (Math.floor(G.timer) !== Math.floor(G.timer + dt) && G.timer < 30) SND.beep(); }

  for (const d of G.drops) { if (d.taken) continue; d.bob = (d.bob || Math.random() * 6) + dt * 3; const near = hyp(d.x - P.x, d.y - P.y) < (d.k === "gun" ? 46 : 30);
    if (!near) continue; if (d.k === "gun") { d.taken = true; giveWeapon(d.id); }
    else if (d.k === "ammo") { if (!P.weapons.length && P.nades >= P.maxNades) continue; d.taken = true; for (const w of P.weapons) w.res = Math.min(WEAPONS[w.id].res * 2, w.res + WEAPONS[w.id].mag * 2); P.nades = Math.min(P.maxNades, P.nades + 1); SND.pickup(); say(d.x, d.y - 20, "+AMMO", "#ffd166"); }
    else if (d.k === "med") { if (P.hp >= P.maxHp) continue; d.taken = true; P.hp = Math.min(P.maxHp, P.hp + 45); SND.pickup(); say(d.x, d.y - 20, "+45 HEALTH", "#80ed99"); }
    else if (d.k === "armor") { d.taken = true; P.armor = Math.min(100, P.armor + 50); SND.pickup(); say(d.x, d.y - 20, "+50 ARMOR", "#4cc9f0"); }
    else if (d.k === "key") { d.taken = true; G.ob.keys++; addStars(15); SND.pickup(); say(d.x, d.y - 20, `KEYCARD ${G.ob.keys}/${G.ob.keysN}`, "#ffd166", 16); if (G.ob.keys >= G.ob.keysN) openDoors(); } }
  G.drops = G.drops.filter((d) => !d.taken);
  // Lasers switch on and off.
  for (const l of G.lasers) { l.on = (G.lvT + l.ph) % 3 < 1.6; if (l.on && P.roll <= 0 && Math.abs(P.x - l.x) < TS / 2 && Math.abs(P.y - l.y) < TS / 2 + 4 && (!l.cd || G.T > l.cd)) { l.cd = G.T + 0.6; hurtPlayer(18, l.x, l.y); SND.laser(); } }
  // Objectives and the exit.
  const ok = objectivesDone(); if (G.exit && ok && hyp(G.exit.x - P.x, G.exit.y - P.y) < 30 && !G.done && G.L.id !== "c3" && G.L.id !== "c6") levelDone();
  if (G.bossDown && !G.done) { const b = G.ents.find((e) => e.t && e.t.boss); if (b && b.deadT > 1.2) levelDone(); } }
function freeHost(h) { h.freed = true; h.runT = 0; G.ob.free++; S.stats.freed++; addStars(25); SND.pickup(); G.p.actT = null;
  const L = G.L, special = L.free && L.free[h.name]; if (special) { h.gone = true; startDialog(special); return; }
  const lines = h.name === "Bunty" ? "Rish?! You came back for ME?" : h.name === "Mrs. Mehta" ? "Rish! Thank you! Be careful!" : h.name === "Mr. Rao" ? "Brave boy! Go, go!" : `${h.name}: Thank you, Rish!`; say(h.x, h.y - 30, lines, "#80ed99", 14); }
function openDoors() { let n = 0; for (let y = 0; y < G.mh; y++) for (let x = 0; x < G.mw; x++) if (G.map[y][x] === "D") { G.map[y][x] = "."; n++; spark(x * TS + 20, y * TS + 20, 20, "#4cc9f0", 200); } if (n) { toast("🔓 All keycards! The big door is open.", 2500); SND.win(); G.flow = null; } }
function objectivesDone() { const o = G.ob; for (const q of G.L.obj) { if (q.t === "talk" && o.talk < q.n) return false; if (q.t === "free" && o.free < o.freeN) return false; if (q.t === "ko" && o.ko < o.koN) return false; if (q.t === "defuse" && o.defuse < o.defuseN) return false; if (q.t === "keys" && o.keys < o.keysN) return false; if (q.t === "boss" && !G.bossDown) return false; } return true; }
function objText() { const o = G.ob, parts = []; for (const q of G.L.obj) { const done = { talk: o.talk >= q.n, free: o.free >= o.freeN, ko: o.ko >= o.koN, defuse: o.defuse >= o.defuseN, keys: o.keys >= o.keysN, boss: G.bossDown }[q.t], cnt = { talk: ` ${o.talk}/${q.n}`, free: ` ${o.free}/${o.freeN}`, ko: ` ${o.ko}/${o.koN}`, defuse: ` ${o.defuse}/${o.defuseN}`, keys: ` ${o.keys}/${o.keysN}`, boss: "" }[q.t]; parts.push(`${done ? "✅" : "▫️"} ${q.label}${cnt}`); } if (objectivesDone() && G.exit && G.L.id !== "c3" && G.L.id !== "c6") parts.push(`➡️ <b>${G.L.exitLabel || "Go to the exit (green light)"}</b>`); if (G.timer > 0 && G.ob.defuse < G.ob.defuseN) parts.push(`⏱️ <b style="color:${G.timer < 30 ? "#ff4d4d" : "#ffb703"}">${Math.floor(G.timer / 60)}:${String(Math.floor(G.timer % 60)).padStart(2, "0")}</b>`); return parts.join(" · "); }
function talkTo(n) { const L = G.L, lines = L.talk && L.talk[n.who]; if (!lines) return; if (!G.ob.talked[n.who] && n.who !== "mehta") { G.ob.talked[n.who] = true; G.ob.talk++; } startDialog(lines); }
function objTargets() { const P = G.p, out = []; for (const e of G.ents) { if (e.k === "host" && !e.freed) out.push(e); if (e.k === "bomb" && !e.done) out.push(e); if (e.k === "npc" && !G.ob.talked[e.who] && e.who !== "mehta") out.push(e); } for (const d of G.drops) if (d.k === "key") out.push(d); if (!out.length) { if (G.L.obj.some((q) => q.t === "ko") && G.ob.ko < G.ob.koN) for (const e of G.ents) if (e.k === "enemy" && !e.dead && !e.t.boss) out.push(e); } if (!out.length && objectivesDone() && G.exit) out.push(G.exit); let best = null, bd = 1e9; for (const t of out) { const d = hyp(t.x - P.x, t.y - P.y); if (d < bd) { bd = d; best = t; } } return best; }

// ---------- Bomb defusing ----------
function startDefuse(b) { G.mode = "mini"; const m = G.mini = { b, hits: 0, x: 0, dir: 1, sp: 0.9, z0: rnd(0.25, 0.6), zw: 0.17 }; const el = $("#minig"); el.hidden = false; el.innerHTML = `<h2>💣 Defuse the bomb</h2><p class="mut">Press <b>E</b>, <b>Space</b> or tap when the needle is in the green zone. 3 times!</p><div id="mg-bar"><div id="mg-zone"></div><div id="mg-needle"></div></div><div id="mg-c" style="font-size:22px">◻️◻️◻️</div><div class="row" style="justify-content:center"><button class="btn go" id="mg-hit">✂️ CUT NOW</button><button class="btn alt" id="mg-x">Leave</button></div>`; el.querySelector("#mg-hit").onclick = () => miniHit(); el.querySelector("#mg-x").onclick = () => endMini(); miniDraw(); }
function miniDraw() { const m = G.mini; if (!m) return; const z = $("#mg-zone"), n = $("#mg-needle"); if (!z) return; z.style.left = m.z0 * 100 + "%"; z.style.width = m.zw * 100 + "%"; n.style.left = `calc(${m.x * 100}% - 2px)`; $("#mg-c").textContent = "✅".repeat(m.hits) + "◻️".repeat(3 - m.hits); }
function miniUpdate(dt) { const m = G.mini; if (!m || m.code) return codeUpdate(dt); m.x += m.dir * m.sp * dt; if (m.x > 1) { m.x = 1; m.dir = -1; } if (m.x < 0) { m.x = 0; m.dir = 1; } miniDraw(); if (G.timer > 0) G.timer -= dt; }
function miniHit() { const m = G.mini; if (!m) return; if (m.code) return; if (m.x >= m.z0 && m.x <= m.z0 + m.zw) { m.hits++; SND.beep(); m.z0 = rnd(0.05, 0.8); m.zw = Math.max(0.1, m.zw - 0.02); m.sp += 0.25; if (m.hits >= 3) { m.b.done = true; G.ob.defuse++; S.stats.bombs++; addStars(30); SND.win(); endMini(); say(m.b.x, m.b.y - 30, "BOMB DEFUSED!", "#80ed99", 18); if (G.ob.defuse >= G.ob.defuseN) center("ALL BOMBS DEFUSED!", 1500, "#80ed99"); } } else { SND.hurt(); m.hits = 0; G.p.hp = Math.max(1, G.p.hp - 6); shake(4); toast("⚡ Zap! Wrong moment. Start again.", 1200); } miniDraw(); }
function endMini() { G.mini = null; $("#minig").hidden = true; if (G.mode === "mini") G.mode = "play"; }
// Final code: repeat the 5 arrows to stop the launch.
function startCode(then) { G.mode = "mini"; const A = ["⬆️", "➡️", "⬇️", "⬅️"], seq = Array.from({ length: 5 }, () => Math.floor(Math.random() * 4)); const m = G.mini = { code: true, seq, i: 0, show: 0, then }; const el = $("#minig"); el.hidden = false;
  el.innerHTML = `<h2>🚀 Stop the Skyfall launch</h2><p class="mut">Watch the code, then press the same arrows (keys or buttons).</p><div id="cd-seq" style="font-size:30px;min-height:44px"></div><div>${A.map((a, i) => `<button class="arr" data-arr="${i}">${a}</button>`).join("")}</div><p id="cd-st" class="mut"></p>`; el.querySelectorAll("[data-arr]").forEach((b) => (b.onclick = () => codeKey(+b.dataset.arr))); m.showT = 0; }
function codeUpdate(dt) { const m = G.mini, A = ["⬆️", "➡️", "⬇️", "⬅️"]; if (m.show < m.seq.length + 1) { m.showT += dt; if (m.showT > 0.7) { m.showT = 0; m.show++; } $("#cd-seq").textContent = m.seq.slice(0, Math.min(m.show, m.seq.length)).map((i) => A[i]).join(" "); $("#cd-st").textContent = "Remember the code..."; } else { $("#cd-seq").textContent = m.seq.map((x, j) => (j < m.i ? A[x] : "❔")).join(" "); $("#cd-st").textContent = `Enter the code: ${m.i} of 5`; } }

// ---------- Dialogue ----------

function nextLine() { const D = G.dlg; if (!D) return; D.i++; while (D.i < D.lines.length && D.lines[D.i][0] === "!boom") { const P = G.p; explode(P.x + 200, P.y - 120, 170, 0, "x"); G.fx.push({ k: "white", t: 0.5, t0: 0.5 }); D.i++; }

function startChapter(i, skipIntro) { SND.init(); const L = LEVELS[i]; if (!L) return; G.kit = i > 1 ? (S.kit || null) : { weapons: [], nades: 2 }; if (i <= 1) G.kit = { weapons: [], nades: i === 0 ? 0 : 2 }; loadLevel(i); G.lvStars = 0; G.lvHurt = false; G.T0 = G.T; hide(); G.mode = "play"; S.lastPlayed = i; save();
  const card = `${L.name.toUpperCase()}\n${L.title}`; center(card, 2200, "#ffb703"); G.later = []; if (!skipIntro) after(0.3, () => { if (G.li === i && G.mode === "play") startDialog(L.intro); }); }

const UPS = [["hp", "❤️ Health", "+20 max health"], ["armor", "🦺 Armor", "+15 armor at the start"], ["melee", "👊 Fighting", "+20% punch and kick power"], ["guns", "🎯 Shooting", "+15% gun damage, better aim"], ["speed", "👟 Speed", "+7% running speed"], ["nades", "💣 Grenades", "+1 grenade pocket"], ["focus", "⏱️ Focus", "slow motion lasts longer"]];
const upCost = (k) => 80 + 60 * S.up[k];
function training(back) { const C = show(`<h2>💪 Training with Dad's notebook</h2><p class="mut">"A hero trains every day." Spend stars ⭐ to grow stronger. You have <b>⭐ ${S.stars}</b>.</p>${UPS.map(([k, n, d]) => `<div class="up"><div><b>${n}</b> <span class="pips">${"■".repeat(S.up[k])}${"□".repeat(5 - S.up[k])}</span><br><small class="mut">${d}</small></div><button class="btn ${S.up[k] < 5 && S.stars >= upCost(k) ? "go" : "alt"}" data-up="${k}" ${S.up[k] >= 5 || S.stars < upCost(k) ? "disabled" : ""}>${S.up[k] >= 5 ? "MAX" : "⭐ " + upCost(k)}</button></div>`).join("")}<div class="row"><button class="btn go" id="t-done">▶ Continue</button></div>`);
  C.querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => { const k = b.dataset.up, c = upCost(k); if (S.stars < c || S.up[k] >= 5) return; S.stars -= c; S.up[k]++; save(); SND.pickup(); training(back); })); C.querySelector("#t-done").onclick = () => back(); }
function settings() { const C = show(`<h2>⚙️ Settings</h2><div class="up"><div><b>Difficulty</b><br><small class="mut">Easy: enemies do half damage and the aim helps more.</small></div>${Object.entries(DIFF).map(([k, d]) => `<button class="btn ${S.diff === k ? "go" : "alt"}" data-df="${k}">${d.name}</button>`).join("")}</div><div class="up"><div><b>🔊 Sound</b></div><button class="btn ${S.sound ? "go" : "alt"}" id="s-snd">${S.sound ? "On" : "Off"}</button></div><div class="up"><div><b>🖱️ Aim with the mouse</b><br><small class="mut">Off: Rish aims at the nearest enemy by himself.</small></div><button class="btn ${S.mouse ? "go" : "alt"}" id="s-mouse">${S.mouse ? "On" : "Off"}</button></div><div class="row"><button class="btn alt" id="s-back">◀ Back</button></div>`);
  C.querySelectorAll("[data-df]").forEach((b) => (b.onclick = () => { S.diff = b.dataset.df; save(); settings(); })); C.querySelector("#s-snd").onclick = () => { S.sound = !S.sound; save(); settings(); }; C.querySelector("#s-mouse").onclick = () => { S.mouse = !S.mouse; save(); settings(); }; C.querySelector("#s-back").onclick = () => menu(); }
function howTo() { const C = show(`<h2>🎮 How to play</h2><p><b>Move:</b> W A S D or the arrows. <b>Shoot:</b> left mouse button or Space (hold it). <b>Aim:</b> the mouse, or Rish aims at the nearest enemy.</p><p><b>Guns:</b> walk near a gun and Rish picks it up. <b>R</b> reload, <b>Q</b> switch gun (or 1 to 4). Ammo boxes 📦 refill your guns.</p><p><b>Fight:</b> <b>J</b> punch (3 punches = uppercut), <b>K</b> kick (knocks shields away), <b>L</b> or <b>Shift</b> roll (bullets miss you while you roll), <b>G</b> grenade, <b>F</b> focus (slow motion).</p><p><b>E:</b> talk, free hostages (stay close), defuse bombs, and TAKEDOWN a dazed or unaware enemy.</p><p><b>Phone:</b> the stick moves, the buttons fire, punch, kick, roll, throw, act, switch and focus.</p><p class="mut">Tips: use walls and crates as cover. Riflemen show a "!" before they shoot. A sniper shows a red laser, then fires.</p><div class="row"><button class="btn alt" id="h-back">◀ Back</button></div>`); C.querySelector("#h-back").onclick = () => menu(); }
