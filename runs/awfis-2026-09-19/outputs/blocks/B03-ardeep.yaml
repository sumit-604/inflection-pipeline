analyst_note: >
  Three findings carry weight beyond their individual phase notes. First, the
  RoCE inconsistency is AR-internal, not merely a Stage-1-vs-AR mismatch: the
  document's own front matter (60%) and its own statutory Note 41 (11.87%)
  disagree by 5x with no bridge, so no RoCE number from this AR's marketing
  sections should feed Section 1B or FTTCP without first pinning which
  formula it uses. Second, the LBF1 cash-EBITDA bridge IS reconstructable
  from the AR's own cash flow statement (implied ~9.2% FY26 margin, and
  post-lease FCF near breakeven) even though the AR never states either
  figure directly -- this bridge, not the AR's own headline numbers, should
  anchor the cash-delivery thesis test. Third, the Design & Build "growth
  engine" framing in the Chairman's Letter is contradicted by the segment's
  own -7.8%/-31.9% trend and its live carve-out to a subsidiary at an
  unresolved valuation -- a hedged-retreat quiet abandonment (6E) that
  changes the transition thesis, not framework noise.
