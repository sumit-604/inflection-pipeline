cross_peer_hypothesis: "Producer margin gain is a spread, not a pass-through: the buyer saw gelatine prices fall 4-5% (NATCAPSUQ) while NGL's materials ratio fell 511 bp (B05) and Nitta's OPM rose from 18-20% to 24-28% (screening); inferred, no single source says it. If true, bone-side cost fell faster than gelatine price, so the reset rests on a bone and import-bone cost series no peer discloses. Test: NGL materials ratio holds near 50.6% while gelatine ASP is flat or down in Q2-Q3 FY27. Kill: materials ratio rebounds above 53% with gelatine ASP unchanged."
analyst_note: "Load-bearing fact 1 (industry-wide versus NGL-specific). Two readings: (a) industry cycle, bone and gelatine both deflate and margins revert; (b) NGL-specific structure, cheaper imported bone and plant savings. Peers support only the output side of (a): gelatine prices fell industry-wide (NATCAPSUQ Q2 FY26 p.11). Nitta's OPM rise (screening, Dec-25 onward) shows producer margin expansion is not NGL-only, which leans toward (a) or a shared input effect. Separating observation: a bone or crushed-bone price series, or a Nitta/IGCL gross-margin disclosure, none in the corpus. NATCAPSUQ also did not get margin relief from cheaper gelatine (capsule EBITDA about 12% to 13%), but tariffs and the Puducherry shutdown confound this. All verdicts single-peer, adjacent segment, so weight low."
