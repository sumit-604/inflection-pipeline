accounting_quality_preliminary: "not scored in Pass 1; scored in Pass 3 after pattern pass. Preliminary read: disclosure transparency is comparatively strong (detailed ECL rollforward is what surfaces finding 2 above), but provisioning volatility (finding 4), a large static management overlay (finding 5), an unquantified useful-life extension in the IPO year (finding 6), and the guarantee-to-net-worth structure (finding 1) pull the overall picture toward PROCEED WITH CAVEATS territory pending Pass 2/3."
