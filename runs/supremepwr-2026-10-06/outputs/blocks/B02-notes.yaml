  - {rank: 13, finding: "Payables 126.3 days (102.8). MSME 2,879.29 with no 45-day split and nil MSMED interest. The Danya payable (662.82) swings from at least 70.8% MSME (FY25) to at least 67.6% Others (FY26), so classes are not like for like.", note_ref: "Note 10; consol Note 11; Note 33", rating: "YELLOW", why: "MSME interest exposure cannot be ruled out; reclassification not explained."}
  - {rank: 14, finding: "Promoter group reconciles to 57.16% (AR Note 3 lists 52.07%; gap is R Sasikala 3.96% and Savita Pradeep 1.13%). No pledge. Warrants 12,47,000 at Rs.169; 1,580.57 due by about 27-Feb-2027, 63.9% from non-promoters.", note_ref: "Notes 3, 5, 30.2; SHP 31-Mar-2026", rating: "YELLOW", why: "Funding inflow depends on non-promoter exercise during a capex-heavy year."}
