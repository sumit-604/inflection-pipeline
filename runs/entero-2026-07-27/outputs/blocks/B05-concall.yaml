analyst_note: "Most decision-relevant finding: Entero's core moat pitch is network reach (customers, hospitals, SKUs, warehouses), repeated near-verbatim every call. Between Q4 FY26 and Q1 FY27 every reach metric fell sharply (28-36%) in the same quarter management reported record margins and ROCE. No analyst caught it; management's only related comment (a ~2.5% revenue drag from low-margin exits) does not obviously scale to match. Could be disciplined pruning consistent with the margin story, or a reporting-basis change / real attrition offset by wallet-share gains. Directly bears on whether the network moat is intact or eroding; first-order Halt 1 verification item."
