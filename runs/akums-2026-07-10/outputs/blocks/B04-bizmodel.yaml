  - {metric: "Adj OCF/EBITDA conversion", healthy: ">=60%", red_flag: "persistently below ~40%"}
  - {metric: "Net working capital days", healthy: "stable or declining", red_flag: "rising past ~110-115 days"}
  - {metric: "API + Trade Generics segment EBITDA", healthy: "losses narrowing toward breakeven", red_flag: "losses widening"}
