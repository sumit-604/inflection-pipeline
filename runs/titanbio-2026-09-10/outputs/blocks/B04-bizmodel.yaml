mgmt_questions:
  - "What is the arm's-length pricing benchmark for raw material bought from Phoenix Bio Sciences (26.0% of FY26 cost of materials consumed, up 73.6% YoY)?"
  - "What specific product and capacity did the Rs 7.40cr of FY26 PPE additions create, and when?"
  - "Why did 77% of the FY26 investing outflow go into a quoted-debt FVTPL portfolio when MD&A frames the whole outflow as capacity building?"
  - "What is the operating relationship with Peptech Biosciences (a bio-fertilizer/bio-pesticide associate), and why is the stake carried well below its attributable net worth?"
  - "What drove finished-goods inventory up 53.2% against 31.8% reported revenue growth, and the first-ever ECL provision?"
  - "Is a product-wise or plant-wise revenue and margin split available internally even if not publicly disclosed?"
  - "What is customer concentration (top-5/top-10 as % of revenue), given the risk is named with no supporting numbers?"
one_line_verdict: "Commodity converter with a flat cost margin, a related-party-heavy supply chain, and a FY26/FY27 rebound not yet proven to be a durable value-added climb rather than a post-trough restock."
analyst_note: "Two corpus findings from this stage materially update the prior brief. First, the company runs FOUR manufacturing plants (Bhiwadi Phase-III, two at Chopanki, one at Kaharani; AR FY26 p.12, p.119), not three as the step-1 brief stated. Second, the step-1 load-bearing question about Peptech Biosciences and Titan Media Ltd is resolved: Peptech's principal activity is bio-fertilizers, bio-pesticides and bio-insecticides, and Titan Media Ltd's principal activity is laboratory chemicals (AR FY26 p.164, consolidated Note 1.1) — neither is the same business as Titan Biotech's own 'TM Media' culture-media brand (AR FY26 p.100), so no part of the core culture-media engine appears to sit outside the consolidated P&L on this evidence, though the associate relationship's commercial logic remains unexplained (see mgmt question 4)."
