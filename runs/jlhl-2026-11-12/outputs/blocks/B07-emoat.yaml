analyst_note: "Two readings of Dombivli. A: ramp is ahead of plan (loss Rs 9.5 Cr to 0.2 Cr, occupancy 25-30% to mid-30s on about 144 census beds). B: seasonal medical admissions flatter Q2 and dilute ARPOB, and Q3 reverts. Separating observation: Dombivli Q3 FY27 EBITDA footnote against Rs 9 Cr a quarter. Embedded growth 177% uses 2,129 Cr capex x 1.245 turnover; the bed-day cross-check (census share 84.4%, 64.8% occupancy, Rs 71,800 ARPOB, 1,200 new beds) gives 115%. Census beds x 365 x 59.5% x Rs 71,800 reproduces H1 revenue annualised (1,657.5 vs 1,657.6 Cr), so the convention ties. Score is 1.6 over the 12 floor and fragile. Peers untested."
