analyst_note: "Grand total 71 of 160 (core 66 of 100, moat 5 of 60) reads weaker than the business ROCE (26.8%) and ROE suggest. Three things drive it: a FY26 cash year (Rs 93 Cr capex, Rs 50 Cr advances and GST receivable, WC days 109) that zeroes B3 and B4; a pre-IPO year-end balance sheet that scores Block D 8 (15 on Sep-26, after Rs 115 Cr debt repaid); and a four-year history that forces a one-tier downgrade. The FY23 ramp base hurts only M1 and E2 style comparisons; C4 is positive (PAT 7.07x against revenue 5.56x). FY26 CFO prints Rs 18.44 Cr restated and Rs 12.47 Cr audited; stage 2 calls the gap a classification difference. It decides whether deal-breaker 4 fires. Classification is AVERAGE in every sensitivity run. Operator should rule what 'latest' means for Block D."
