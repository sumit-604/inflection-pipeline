verdict_basis: "A 15-year MCA/RoC late-filing pattern (delays up to 5,542 days) with two still-pending compounding applications, untraceable historical records and one unverifiable intra-family share transfer, layered on a live competing-entity RPT (co-promoter's own firm SMV Enterprises) and an 11-month-old board/KMP structure that has already lost 4 of its original appointees, against an otherwise clean SEBI/criminal record and zero pledge."
analyst_note: >
  This stage's largest new finding versus B02/B03 is RHP risk factor 10 (txt
  2037-2131), which neither prior stage read: a systemic RoC/MCA compliance
  failure spanning 2010-2025, regularised only in the five months before the
  RHP was filed, with two compounding applications (PAS-3 errors, missing Cost
  Auditor FY25) still unresolved with the RoC and one intra-family share
  transfer that could not be bank-verified. None of this is criminal and all of
  it is self-disclosed, but the scale is unusual even for a first-time SME
  issuer. Separately, this stage confirms SMV Enterprises (co-promoter Mahak
  Jain's firm) as a disclosed, live, growing competing-entity RPT, and traces
  the post-listing board churn through to Charan Singh's credentialed
  replacement appointment, the strongest transition-evidence item found. No
  promoter-group entity was found to be the counterparty behind the Rs 72.10 Cr
  FY26 aluminium-rod trading line B03 flagged; those counterparties remain
  anonymised in both RHP and AR.
