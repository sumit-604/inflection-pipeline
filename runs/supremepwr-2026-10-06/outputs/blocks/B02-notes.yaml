top_findings:
  - {rank: 1, finding: "Danya Electric is a 90% profit-share partnership firm (promoter-directors hold 10%), shown as related party, consolidated as subsidiary, and filed as associate/JV in AOC-1. 61.3% of its turnover 4,174.22 is sold to SPEL. 95.6% of Danya turnover growth is sales to SPEL; 28.6% of SPEL revenue growth is sales to Danya. Intra-group elimination 5,017.91 (FY25 2,443.09). No consolidation adjustment visible: consolidated profit and reserves equal standalone.", note_ref: "Notes 14, 20, 21, 30.10, 30.21; consol Notes 2.2, 4, 20, 22; AOC-1 p.49", rating: "YELLOW", why: "Load-bearing entity. Revenue, profit share (211.51, 90.6% of other income) and cash depend on a related, sub-investment-grade (BB-/A4+, AGM Item 6) firm that trades in a loop with SPEL; no benchmarking."}
  - {rank: 2, finding: "FY26 CFO 2,773.36 (consol 2,590.47) vs capex 5,746.46 (consol 5,748.04). CFO leans on customer advances +1,445.75 and payables +2,489.23; CFO ex advance build 1,327.61. Capex is accrual additions, so capex creditors and supplier advances sit in CFO.", note_ref: "CFS p.62, p.83; Notes 10, 11, 19, 13", rating: "YELLOW", why: "Cash conversion is a load-bearing fact. Reported CFO overstates cash generation by an unknown amount."}
  - {rank: 3, finding: "Borrowings 1,633.84 to 4,572.70 (consol 1,874.56 to 4,997.30). ICICI 3,974.89 (97.2% of term debt) at 9.50%, promoter guaranteed (one guarantor is an independent director). No undrawn facilities. Current maturities 89.90 to 1,095.48.", note_ref: "Notes 6, 9, 30.25, 34; consol Notes 7, 10", rating: "YELLOW", why: "Debt-funded capex. Covenants, fixed or floating rate and the five-year schedule are NOT FOUND."}
  - {rank: 4, finding: "ICICI term-loan table does not reconcile: current principal 1,005.19 exceeds 12 months of EMI cash 713.28 by 291.91; stated balances 3,500.00 and 474.89 exceed what the EMIs amortise at 9.50% by about 701 (DERIVED).", note_ref: "Notes 6, 9", rating: "YELLOW", why: "Either a balloon, a partial drawdown or an unreliable EMI column. Next-year repayment burden is under-explained."}
  - {rank: 5, finding: "DSCR 2.44x (FY25 10.47x) is interest plus year-end current maturities; ties to two decimals in four cases. Management's 'higher repayment' reason describes the wrong thing. EBITDA on the same definition rose 15.2%, not 'marginally'.", note_ref: "Note 34(c); consol 33(c)", rating: "YELLOW", why: "A forward repayment test that has already tightened four-fold; the narrative misstates it."}
  - {rank: 6, finding: "Inventory +102.2% (standalone 4,556.25) vs revenue +31.3%; days 56.8 to 87.5 (consol 77.4 to 124.8). No NRV write-down disclosed; WIP and FG valuation basis missing from policy; KAM names 'items held against orders amended or cancelled'.", note_ref: "Notes 16, 2.7, 34(f); KAM p.56", rating: "YELLOW", why: "Largest working-capital build; quality of WIP unverifiable from Notes."}
  - {rank: 7, finding: "Corporate guarantee 1,470.00 for Danya = 13.0% of standalone net worth, 46% of Danya total assets; Danya drawn bank debt about 113. SPEL guarantee also appears on two SBI cash-credit rows in consolidated Note 10 but not in contingent liabilities. FY27 authority sought: RPT Rs.125 Cr, Section 185 Rs.75 Cr.", note_ref: "Note 30.1, 30.21; consol Note 10; AGM Items 6, 9", rating: "YELLOW", why: "Contingent exposure to a BB- entity is wider than the one line disclosed and authority sought is far above current use."}
  - {rank: 8, finding: "CWIP ageing is arithmetically impossible: 0-1 year bucket 2,471.53 exceeds FY26 additions 1,893.45 by 578.08; at least 904.53 (32.3%) of CWIP is pre-FY26 vs 326.45 disclosed. 48.0% of PPE additions bypassed CWIP. Plant capitalised in Q4 (P&M depreciation 78.06 on additions 4,550.79). Depreciation 165.26 vs run-rate about 496 (DERIVED).", note_ref: "Notes 13, 30.16", rating: "YELLOW", why: "Margin step-down from depreciation is ahead; the ageing schedule understates old projects."}
  - {rank: 9, finding: "Receivables 4,521.09, nil provision; over-one-year bucket 588.04 (FY25 344.23), already outstanding at 31-Mar-25. Q4 balance jumped 1,135.32 (+33.5%). Banks' stock statement runs about 169-171 below books every quarter. Headline days fell 109.8 to 86.8.", note_ref: "Notes 17, 30.4, 30.6, 31, 34(e)", rating: "YELLOW", why: "Headline improvement hides an ageing tail and year-end loading."}
  - {rank: 10, finding: "Capital commitments 'Nil' (and Note 29.I 'no contractual commitments') against CWIP 2,797.98, software under development 137.01, capital imports CIF 105.34, and an expansion borrowing-limit resolution. Capitalised borrowing cost amount NOT FOUND; interest 128.24 is 4.13% of average debt vs stated rates 7.50% to 11.50%.", note_ref: "Notes 30.1B, 29.I, 30.17, 26, 2.4, 2.9", rating: "YELLOW", why: "Capex run-on and finance cost are not reconcilable from the Notes."}
