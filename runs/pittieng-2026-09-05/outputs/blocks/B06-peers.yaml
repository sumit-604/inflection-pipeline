risks_peers_raise:
  - "Recurring, structural energy/gas and shipping-cost inflation tied to the West Asia conflict, requiring ongoing customer force-majeure negotiations (RKFORGE, Q4 FY26 and Q1 FY27 calls)"
  - "New Labour Code compliance cost taken as an exceptional charge (RKFORGE, Q3 FY26 call)"
  - "Industry-wide skilled-labour shortage and attrition risk as an active growth constraint (SANSERA, multiple calls)"
  - "Single/concentrated-customer dependency named openly as a managed risk by a peer, a topic Pitti's own calls never raise despite comparable concentration (SANSERA vs Pitti's 2 customers = 25.2% of revenue per B02)"
  - "A government anti-dumping duty on CRGO imports under active consideration, a dated policy risk to the same BIS-gated import channel Pitti also depends on (VILAS, FY26 call)"
  - "Dated BIS-mill-license-renewal risk (specific June/July 2026 expiry) on the same import-BIS mechanism underlying Pitti's own inventory/net-debt thesis (VILAS, FY26 call)"
net_narrative_effect: "complicates"
analyst_note: "The peer set splits cleanly by financing discipline, not by sector exposure: SANSERA and VILAS fund growth from cash and preserve margin/ROCE through their capex waves; RKFORGE funded a comparable wave partly through debt and saw ROCE compress before recovering on a multi-year schedule. Pitti's debt-funded Rs290 Cr commitment and its own flagged ROCE decline (19% to 15%) place it on the RKFORGE side of this split, which is a more useful lens for judging Pitti's medium-term ROCE trajectory than any single claim-by-claim verdict above. Weight Claim 1 and Claim 4 cautiously: VILAS (SME-listed, CRGO not CRNGO) and the SANSERA/RKFORGE capacity split both involve real product and scale mismatches with Pitti, not clean apples-to-apples tests."
