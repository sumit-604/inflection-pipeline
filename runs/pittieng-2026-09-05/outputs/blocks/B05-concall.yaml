analyst_note: "Company memory's Spear load-bearing facts #2 and #4 need correction: the Rs300 Cr figure tied to the BIS Korea/Japan steel deals is an INVENTORY target, not a net-debt target (no call ever gives net debt a Rs300 Cr target); and the Rs290 Cr castings capex commissioning date is Q1 FY30 on every call and in the AR, not Q1 FY29. Spear fact #3 (railway ~40% via Wabtec/Alstom) is not supported by any disclosed figure; actual share ran 28-33% across the three calls, on a declining trend, even as the named customer roster (Wabtec, Alstom, Progress Rail, Siemens Mobility) grew. Spear fact #1 (FY28 turnover/margin, FY27 EBITDA ~Rs370 Cr) is confirmed as a real, specific, dated guidance statement (Q1 FY27 call) but is not yet testable against a full-year print."
