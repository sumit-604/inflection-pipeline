analyst_note: >
  The two claims that most matter for Stage 11/13 both cut against Awfis relative to
  peers: occupancy (claim 4, CONTRADICTED -- all three peers run materially higher
  blended occupancy) and cash EBITDA margin (claim 5, VERIFIED peer band of 16-21% vs
  Awfis's 10.1%). Both are the same two items B05 named as the near-term confirm/kill
  triggers (priority 3 and priority 5), so this stage sharpens rather than resolves them:
  the peer set gives Stage 11 a real external benchmark to test Awfis's FY27 guided
  cash-EBITDA and occupancy-recovery paths against, not just Awfis's own prior guidance.
  The Part 5 cross-peer hypothesis (capital-structure mix vs cash margin) is a genuinely
  novel read with only three peer data points behind it; treat as a testable hypothesis
  for future quarters, not a settled finding.
