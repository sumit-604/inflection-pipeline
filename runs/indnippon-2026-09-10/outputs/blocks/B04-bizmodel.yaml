valuation_methods:
  primary: {method: "Sum-of-the-parts: operating P/E leg (Section 1B destination PE) plus investment book at fair value", why: "65% of net worth is a treasury/related-party book whose Lucas TVS gains are OCI-trapped and never reach EPS; a single blended multiple misprices one or both parts"}
  secondary: {method: "P/E on reported (blended) earnings", why: "cross-check for what the market likely already prices, and a test of whether the recognition gap is open or closed"}
  tertiary: {method: "EV/EBITDA on operating EBITDA (EV net of cash and investment book)", why: "isolates the manufacturing business's cash-generative multiple independent of the treasury book"}
  not_applicable: ["Price-to-Book (dominated by investment book, not operating assets)", "Dividend Discount Model (not a yield story, FY26 cash conversion broke to 0.36x)", "Replacement cost / asset-based (PPE only ~15% of revenue, moat is not physical capacity)", "EV/Sales as primary anchor (would mask the mix-driven margin transition)"]
irrelevant_ratios:
  - {ratio: "Reported ROE/ROCE as filed", why: "diluted by Rs531.53cr investment book in capital employed; operating ROCE runs 21.9-30.5% vs reported 11.4-15.0% (B01 LB3)"}
  - {ratio: "Price-to-Book", why: "65% of net worth is a treasury book, not operating plant or working capital"}
  - {ratio: "Debt/Equity, Interest Coverage", why: "zero borrowings across all years shown, ratio is structurally near-zero and carries no signal"}
  - {ratio: "AR's own headline EBITDA margin (13.97%)", why: "embeds Other Income (20.96% of FY26 PBT) and the exceptional item; use the 11.44% deck-basis operating figure instead"}
  - {ratio: "Debtors' Turnover Ratio (average-balance basis)", why: "shows improvement while point-in-time ageing (Note 13c) shows the worst overdue share in 3 years"}
  - {ratio: "Reported Working Capital Days summary ('42 to 40 days')", why: "contradicts the CFO/PAT collapse to 0.36x; use the Cash Flow Statement's actual WC movement instead"}
must_track_metrics:
  - {metric: "Operating ROCE net of investment book", healthy: "sustaining or improving above 20%", red_flag: "falling below 20% for two consecutive years"}
  - {metric: "CFO/PAT ratio", healthy: "above 0.6x on a multi-year basis", red_flag: "below 0.4x for a second consecutive year"}
  - {metric: "Two-customer concentration % (Note 28e)", healthy: "declining trend, below 65%", red_flag: "rise above 75% or a third customer crossing 10%"}
  - {metric: "Near-term-overdue receivables share (Note 13c)", healthy: "stable or falling from FY26's 22.3%", red_flag: "further rise, or continued zero ECL against worsening ageing"}
  - {metric: "Operating EBITDA margin (single consistent deck-basis definition)", healthy: "rising trend (9.17% to 11.44% FY24-26)", red_flag: "unexplained quarter-on-quarter reversal"}
