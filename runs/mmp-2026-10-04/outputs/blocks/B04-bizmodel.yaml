flags:
  - {type: FLAG-MIX-LABEL, reason: "B00 sector_cap_row_evidence quotes powders 62%, foils 26%, conductors 12% as the Q1 FY27 mix. That is the FY26 mix printed on a Q1 FY27 slide (Q1 deck p.11, p.16). Q1 FY27 actual is powders 66.1%, foils 26.0%, conductors 7.3%, insulators 0.2%, others 0.4% (PR p.2, derived). Sector cap row is unchanged; the conductor share has fallen"}
  - {type: FLAG-ARCHETYPE-HYBRID, reason: "No segment fits one archetype cleanly. Foils and conductors fit Commodity converter (Amendment 17). Powders are a converter with an unquantified specialty tail. Insulators fit Build-to-spec component maker on intent, not yet on evidence (revenue 231.94 L, loss 329.13 L, AR26 C p.226). Stage 11 must hold the powder specialty share as an open input"}
  - {type: FLAG-FOIL-DILUTION, reason: "Foils gave 46.0% of FY26 segment revenue growth at a 2.00% segment margin and hold 25.0% of segment assets for 6.4% of segment result (AR26 C p.226-227, derived). Segment margin fell 1.41 pts, of which mix -0.36 and within-segment rates -1.05 (derived)"}
  - {type: FLAG-GUIDANCE-DRIFT, reason: "FY27 group growth guide moved from ~20-25% (Q4 deck p.9) to ~15-18% (Q1 deck p.9, PR p.3). Solar park moved from H1 FY27 (Q4 deck p.14) to Q3 FY27 (Q1 deck p.14). Wire-rod capex moved from Rs 13-15 Cr (Q4 deck p.9) to Rs 20-25 Cr (Q1 deck p.9). Wire-rod timing: AR26 p.30 says installation from July 2027 and trials H2 FY27; PR p.5 says installation underway, trials end Q3 FY27, commercial Q4 FY27. The PR reading is consistent with H2 FY27, so July 2027 looks like a typo for July 2026 (reading, not proof)"}
  - {type: FLAG-DECK-COPY, reason: "Q1 FY27 deck p.6 credits PAT growth to a net exceptional credit of Rs 5.45 Cr post tax, but the Q1 FY27 P&L shows exceptional items 0.0 (Q1 deck p.8; PR p.8). The same sentence sits in the Q4 FY26 deck p.6. Treat Q1 FY27 PAT 13.7 Cr as free of exceptional items"}
  - {type: FLAG-CASH, reason: "Carried from B01 and B03: CFO 53.29 Cr includes 17.23 Cr short-term borrowing and 19.10 Cr payables build; CFO net of both 16.96 Cr against gross capex about 55.6 Cr (AR26 C p.173; B03). FY27 capex plan items sum to about Rs 63-70 Cr before the Rs 85-90 Cr LT cable programme (derived from Q1 deck p.9, Q4 deck p.9, Call p.15-16)"}
  - {type: FLAG-FUNDING, reason: "Carried from B03: parent cash 56.38 L, guarantees 6,688 L, 76.6% of group debt due within a year. Management says net debt to equity will not go beyond 1.0 (Call p.15); FY26 is 0.5 (Q1 deck p.27)"}
business_type: manufacturing
