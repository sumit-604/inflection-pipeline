  - "Goodwill ~44% of consolidated net worth is now an explicit Auditor's Report KAM, alongside a second KAM on impairment of ~Rs17bn standalone investments/loans to subsidiaries"
  - "Three non-reconciled leverage ratios and two non-reconciled ROCE figures for the same fiscal year, plus a ~2x gap between two disclosures of the CEO's own remuneration"
best_fit_strategy: "GARP (WATCHLIST)"
one_line_verdict: "Strong guidance-matching growth sits on a roll-up with unresolved subsidiary distress."
analyst_note: "Two findings extend beyond B02's Notes-only scope: (1) the Auditor's Report KAM on impairment of standalone investments in/loans to subsidiaries, not surfaced by the Notes as an audit-level risk; (2) the acquisition-philosophy quiet abandonment (6E) - opening narrative claims disciplined value-creating acquisitions while the same-year sections show one divestment-back-to-promoters, three struck-off non-operational subsidiaries, and the 40-entity CARO-qualified cash-loss population. Whether that population is shrinking (artifact of climb) or static/growing (structural feature) determines the transition posture more than any other number in this AR."
