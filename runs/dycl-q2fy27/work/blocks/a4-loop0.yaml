analyst_note: "Filed numbers govern; the concall adds little that is verifiable. The cleanest cash test is not day counts, which shift with H2 seasonality, but the prior-year H1 comparative: inventory built Rs 4.79 Cr in H1 FY26 against Rs 70.65 Cr in H1 FY27 (RES L480). That undercuts the seasonal explanation (CC L387) without resolving pre-build vs slow offtake. Q3 revenue separates them because Q3 has no balance sheet. Bull threshold 392.5 Cr is management's own 20% guide on the H2 FY26 quarterly average; bear is no step over Q2. Receivable days 70.3 on net revenue reconcile to the company's ~59 on gross sales at an 18% GST gross-up, so the company KPI looks fair. PR figures match the standalone filing, so the release is standalone. Verdict is FLAGS not CAVEATS because cash, margin and funding all moved adversely in the same half and the call contradicted the filing on two items. Governance fine weighted low: immaterial amount, specific cause, remedial instruction recorded."
