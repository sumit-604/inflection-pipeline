analyst_note: "The Nov-2025 call, read as a full primary transcript, surfaced 7 findings invisible to a 2-fact lookup: the intra-call Rs297cr/Rs200cr HAM equity inconsistency, the unanswered working-capital target, the Ramban-Banihal promises and their total later silence, the Southern Ludhiana 80%-by-December baseline whose regression only shows against Aug-2026, and the H1 FY26 consol-vs-standalone PAT/EBITDA anomaly that recurs in 9M FY26 and narrowly reverses at FY26 year-end. The cross-call reconciliation pass (2F) caught structurally different findings: an order-book roll-forward gap repeating every quarter in the same direction, a renewable inflow-vs-book gap of the same shape, a debt-disclosure trail thinning to nothing exactly as the consolidated P&L does, and a per-project equity list that does not sum to its own total the same call a project count contradicts the order book. None alone moves the grade off C; together they show disclosure quality moving the wrong direction across 4 quarters, named explicitly in credibility_basis so Stage 11 does not read a flat C the same way twice."
