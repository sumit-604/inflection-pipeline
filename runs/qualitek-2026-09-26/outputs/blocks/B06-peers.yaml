industry_cross_read:
  demand: "All three peers report steady-to-strong but not boom-level demand (7-15% CAGR range), driven by organized-vs-unorganized share gains and structural shifts, not sector-wide acceleration; a brief Q1 FY27 softness (geopolitical/seasonal) is common across Vimta and Metropolis. No peer corroborates an industry-wide demand boom."
  pricing_inputs: "Input-cost inflation (reagents, chemicals, manpower) described as manageable, not accelerating, across all three peers; GST rate cuts gave a modest one-off benefit (Metropolis, Krsnaa); none of the three shows gross-margin expansion anywhere near Qualitek's 78%-to-87% climb, and all three show cost relief flowing into EBITDA (not being absorbed below the line as at Qualitek)."
  capex_cycle: "INDUSTRY-WIDE CAPACITY RACE, not a lone-expander situation: Vimta (~INR100 Cr FY26 capex), Metropolis (INR55-65 Cr/yr, 750+ town network, 100 mini-hubs plan), Krsnaa (~INR5,000 million cumulative, Rajasthan PPP + MRI expansion) are all simultaneously building capacity. All three ALSO report utilisation lag and margin drag from their own recent capex, so the capacity race does not itself guarantee near-term returns for any name in the set, including by extension Qualitek."
