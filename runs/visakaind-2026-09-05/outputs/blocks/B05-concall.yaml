analyst_note: "Grade is D on hard delivery evidence, not tone: the one big promise with a near-term audited check (Vnext FY23 revenue/growth) was met, but nearly everything checked afterward (Midnapore cost/date, the FY24 Vnext growth claim contradicted within the same quarter it was made, yarn margin 15%+ claimed vs ~0.6% delivered FY25, the FY25 50:50 mix target, debt direction) missed, several badly. ATUM's complete absence of any revenue figure after 8 years, and ATUM Life/Visaka Green's quiet, unspoken capital destruction, are the most durable signal: management narrates new growth engines confidently and stops discussing them once results disappoint, rather than reporting the miss. This is a 2022-2023 read only; no transcript newer than Aug-2023 exists (37 months stale), so the grade is a prior on management style, not a live signal. FY26 AR narrative (Vnext +19%, debt down to Rs350cr, RoCE to 11.87%) is genuinely stronger than anything visible in the three calls, but FY26 PAT also carries a Rs59.70cr exceptional land-sale gain this stage cannot cross-check against live management commentary."
