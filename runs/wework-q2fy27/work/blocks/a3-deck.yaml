analyst_note: "The deck's strength is volume: members +32.5% YoY, mature occupancy 87.7%. Its headline numbers are built on choices that flatter. (1) Basis: 86% of H1 PAT is the IGAAP adjustment, and IGAAP PAT carries zero tax; at 25.17% H1 PAT is 89.1 Cr, not 119.0. (2) Audited Ind AS profit is wholly treasury, disposal and lease-exit gains. (3) Net cash 23.1 Cr does not rebuild from the deck's own balance sheet: an 18-23 Cr gap, with finance leases excluded. Treat it as about net zero. (4) FCFO benefits from about 30 Cr a quarter of rent-free cash and a 126.5 Cr H1 working-capital release, so the self-funding claim is knife-edge. Forward: H2 capacity adds slow to 4.7-9.7k desks, 81% of the committed pipeline is LOI, and the locked-in revenue/rent spread narrowed QoQ. Core revenue per member is flat, so growth is volume-only. The A4 questions with the most weight are A3-06, A3-12, A3-16 and A3-18. All prior-quarter diffs are untestable (first review)."
