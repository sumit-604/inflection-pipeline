red_flags:
  - "Undisclosed, retroactive cash-flow reclassification (Changes in Working Capital Facilities) that flatters CFO in both the current and comparative year, introduced only at the annual-audit stage, absent from the interim filing and the prior year's AR."
  - "No impairment recognised against a negative-net-worth, loss-making subsidiary (TNS Pharma) into which the company added further capital in the year losses widened."
  - "Corporate guarantees for two non-consolidated, director-interest LLPs disclosed only as a quantum with no qualitative business rationale."
  - "Three separate cross-note number mismatches in the same AR (segment receivables vs balance sheet, Shareholders Funds ratio denominator vs balance sheet, undisclosed cash-flow line) consistent with the auditor's own KAM naming a DOS-based accounting system needing strengthening."
  - "Goodwill Rs 555.15L on the consolidated balance sheet with zero supporting note, computation, or acquisition-accounting disclosure anywhere in the AR."
questions_for_mgmt:
  - "What is the accounting basis for the Changes in Working Capital Facilities line introduced in the FY26 cash flow statement and applied retroactively to the FY25 comparative, and why does it not appear in the H1 FY26 refiled results or the FY25 Annual Report?"
  - "What purchase consideration and fair-value-of-net-assets computation underlie the Rs 502.78L consolidation goodwill increase from the Trident Mediquip stake changes, and why is there no goodwill note in the AR?"
  - "What is the commercial nature, counterparty, and legal basis of the Claim Income line (Rs 541.05L FY26, Rs 522.17L FY25) inside Other Income?"
  - "Why does the Note 31 segment-assets-by-geography receivables total reconcile to the standalone book rather than the consolidated Group receivables, and why does Shareholders Funds in the Ratio Analysis Note not match the Balance-Sheet-derived net worth in FY26?"
  - "What is the business rationale and exit plan for the corporate guarantees extended to Talon Healthcare LLP and Tench Life Sciences LLP, entities the company does not consolidate or control?"
receivables_trend: "deteriorating on quantum, improving on ageing composition: consolidated trade receivables grew 166% (Rs 27.68 Cr to Rs 73.65 Cr) against 48.4% revenue growth (Note 17, Note 21), but the greater-than-6-months bucket fell from 13.1% to 6.1% of the book, and the company's own ratio-analysis note shows receivable AND payable turnover both slowed ~40% symmetrically (Ratio Analysis Note p.116-117), supporting a growth-induced rather than purely structural read pending customer-level terms evidence."
restatements_found: []
going_concern_language: "NONE. Both standalone and consolidated auditor's reports explicitly conclude no material uncertainty exists (Standalone CARO xix, p.51; auditor's responsibilities section, both reports)."
analyst_note: "Three cross-note mismatches (segment receivables, Shareholders Funds ratio denominator, undisclosed cash-flow line) are not independent glitches: all three surface at the consolidation layer, where the standalone book and Group book diverge without a bridging note. Combined with the auditor's own KAM naming a DOS-based accounting system, this points to a systems/consolidation-process weakness rather than three unrelated errors. The retroactive cash-flow reclassification is the single most material item: it changed a headline metric (CFO) for two reported years, was never disclosed as a change, and was introduced specifically between the H1 FY26 filing and FY26 audit sign-off, a timing that narrows management's window for the decision to a checkable few months."
