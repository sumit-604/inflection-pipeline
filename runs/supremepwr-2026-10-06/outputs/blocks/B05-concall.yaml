analyst_note: "File [page N] markers are the anchors; the printed transcript page is N-1. Operator-context checks: FY27 275-300 in June holds only for the first answer (250-300 and 270-300 appear later on the same 2-Jun call). PAT 20.68 is pre-minority; the 20.44 the CMD cites is attributable (results). '30% by Q3' (B03 monitorable) fails: the call says 30-50% by Q4 FY27. EBITDA 18-20% holds (17-Aug p.5). Q1 FY27 PAT growth is 9.63% (net profit) or 10.04% (attributable); the CMD says 10.4%, which is PBT growth. Capacity cross-check: Unit 1 at 100% (100-110 Cr) plus Kannur 25-30% of 500-550 Cr gives Rs 225-275 Cr, below the guide midpoint; stage 11 should not take the top of the range as evidenced."
