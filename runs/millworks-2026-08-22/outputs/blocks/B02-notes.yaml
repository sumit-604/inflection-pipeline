analyst_note: "The single most decision-relevant fact is the divergence between PAT (Rs 37.06Cr) and operating cash flow (-Rs 10.76Cr) in the listing year, driven by a receivables book that grew 20x against 6.7x revenue with zero incremental provisioning. Corroborated by the company's own ratio-variance disclosure (trade receivables turnover fell 59.7%, Annexure XLIX(xii)) and a documented history of premature revenue recognition now restated. FY26 reported profit should not be treated as fully cash-backed without customer-level and contract-level verification outside this document. The six compliance-timing gaps individually look like SME growing pains, but their number and simultaneity in the listing year argue for treating them as one pattern of financial-controls immaturity."
