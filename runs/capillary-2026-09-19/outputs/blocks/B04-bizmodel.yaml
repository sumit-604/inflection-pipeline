analyst_note: "Sector cap row (Platform/SaaS/IT services, 45x) is CONFIRMED by the decoded model: 89.3% recurring subscription revenue, single Ind AS 108 CRM-services segment, asset-light goodwill-heavy balance sheet, AI-native roadmap. No named product competitor exists in any document reviewed (AR or four presentations); Forrester/Everest/QKS rank Capillary a Leader but their comparison sets are not reproduced in the filed corpus, so Section 2B could not name real rivals. WC intensity is labelled 'low' on absolute days (52.8 FY26) but the trend (24 to 52.8, FY23-FY26, per B01) is deteriorating and should be read alongside the flat classification. Cyclicality is called secular-growth on the recurring-subscription structure; a generic enterprise-IT-budget cyclicality risk exists but is not company-specifically evidenced in this corpus."
