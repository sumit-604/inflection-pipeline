new_peer_question_verdict: "PARTIALLY ANSWERED by the peer transcripts — the phenomenon is sector-wide, the cause is not"
new_peer_question_evidence:
  - "MCX Aug 2026 p.11-12: analyst puts a 68% yield compression (bullion options premium-to-notional 1.03% to 0.35%); management decomposes it, moves the metric from ADT to ADV to strip price, attributes it predominantly to volatility normalisation and explicitly rules out contract mix and participation shift"
  - "CDSL Aug 2026 p.7: Sanketh Godha puts IEX's identical structural question to CDSL — folio count +17% YoY against annual charges revenue +12%; management's answer is a single line, so thin answers to this question are not IEX-specific"
  - "CDSL Aug 2026 p.7: CDSL's compression is a SEBI-mandated industry-wide fee cut quantified exactly on the call — KYC fetch Rs35 to Rs28 (-20%), creation Rs20 to Rs5 (-75%)"
  - "CDSL Aug 2026 p.7: asked whether the realisable rate net of volume discounts fell as far as the rack rate, management refuses outright — 'We do not discuss this in our investor calls'; opacity on net realisation is a sector norm"
  - "BSE Nov 2025 p.11: margin compression attributed to premium realisation per contract moving with volatility, 'uncontrollable and unpredictable'"
  - "BSE May 2026 p.11: asked directly about pricing strategy, management gives a generic answer ('appropriate amounts at appropriate points of time')"
new_peer_question_read: >
  Peers' compression has external, named causes (a mandated fee cut at CDSL,
  volatility at MCX and BSE). No regulator cut IEX's fees; its stated causes are
  voluntary incentives and mix, unquantified across three quarters. Downstream
  read: soften the DISCLOSURE criticism, since refusing to quantify net
  realisation has clear peer precedent, and keep the ECONOMIC finding at full
  weight — an unexplained, self-inflicted, unquantified realisation decline at a
  claimed 99%-share monopoly.
