missed_cluster_diagnosis: >
  Five of the seven full misses are one gap with one name: stage 5 read the
  monthly Power Market Updates for the two metrics it already suspected (RTM
  growth, REC headline) and never differenced the filings against the call
  narrative segment by segment. Green, DAM, the REC sell-side mechanism and the
  market-share series would all have surfaced from documents already in the
  corpus. Run 1's problem was breadth; run 2's residue is one cheap mechanical
  procedure not performed. A targeted amendment (perform the segment-level
  difference; book the REC-mechanism contradiction and upgrade that flag from
  LOW-MEDIUM to HIGH; add the green, DAM and market-share items) would close
  most of the gap. Whether that or a third full re-run is the right instrument
  is the orchestrator's call.
