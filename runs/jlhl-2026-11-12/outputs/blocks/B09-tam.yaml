analyst_note: "TAM rests on one stale regional source (CRISIL Aug 2023) pro-rated by population, so confidence is L. Central uses Pune PMR population 7.17 M (derived from the RHP's own bed density); the printed 14.97 M gives TAM 31,420 Cr. SAM is a ceiling (only the 73% private share is anchored), so the 9.4% share is a floor. MMR, Pune and Indore are not short of beds by count; only Kalyan-Dombivli is. SOM central is +2pp Y3 and +4pp Y5 of SAM, market growth 11.3% after FY27. Year 5 SOM is 101% of the constant-price physical ceiling, so it needs ARPOB growth near 6% or more and a ramp haircut of 25% or less. Separating observation: Dombivli occupancy and ex-Dombivli ARPOB growth in Q3 and Q4 FY27. Alternate readings: Y3 +3pp gives 23.3% CAGR; hold-share gives 12.4%. Stage 11 should treat the 12% to 23% range as the cross-check band for the base revenue CAGR, not the 20% point alone. Runway thresholds are stage-assumed."
