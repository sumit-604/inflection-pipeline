  - {risk: "Two-customer concentration", first_signal: "Note 28e concentration % or a Revenue from Operations miss vs guided industry growth"}
  - {risk: "EV transition outpacing INEL's own product scale-up", first_signal: "OEM revenue growth falling below SIAM 2W growth for two consecutive quarters"}
  - {risk: "Rare-earth/NdFeB magnet shortage", first_signal: "Gross margin / material cost as % of revenue"}
  - {risk: "Partial commodity indexation (silver, electronics, rare-earth not confirmed indexed)", risk_detail: "", first_signal: "Operating EBITDA margin in a high-commodity-inflation quarter"}
  - {risk: "Working-capital absorption becoming structural", first_signal: "CFO/PAT ratio and Cash Flow Statement working-capital line"}
  - {risk: "Zero-ECL receivables risk", first_signal: "Note 13c near-term-overdue bucket, or an ECL provision finally being booked"}
  - {risk: "Lucas TVS interlock / disclosure gap", first_signal: "Note 47 fair-value note, any change in disclosed ownership % or valuation multiple"}
mgmt_questions:
  - "What share of Q1FY27's 35.5% YoY growth (vs 20% 2W industry growth) came from OEM platform share gains, content-per-vehicle increase, and price/commodity pass-through, respectively?"
  - "Given FY26 SIAM 2W industry volume grew 36.1% while INEL's own standalone revenue grew 26.5%, did INEL lose relative share within its OEM base in FY26?"
  - "What is INEL's percentage ownership of Lucas TVS Limited, and what are Lucas TVS's own EBITDA and net debt/cash figures underlying the Note 47 valuation?"
  - "What share of the Rs 42.90 cr near-term-overdue receivables sits with the two >10% OEM customers, and is the deterioration payment-cycle timing or broader credit-quality shift?"
  - "Which specific inputs (rare-earth magnets, silver, electronic components) remain outside the rate-recovery/indexing mechanism, and what is the timeline to extend coverage?"
  - "What is the ferrite-substitution percentage achieved to date against total magnet requirement?"
  - "Why did FY26 CFO fall to 0.36x of PAT after a 10-year cumulative run of 70.5%, and is this a one-year growth-driven WC build or a new structural WC intensity?"
one_line_verdict: "A qualification-locked OEM ignition supplier upgrading its content mix, funded partly by a treasury book the operating multiple must not double-count."
analyst_note: "Two findings this stage adds beyond B01-B03/B07: (1) FY26 SIAM 2W volume grew 36.1% against INEL's own 26.5% revenue growth, a full-year underperformance the company never addresses even as it emphasises Q1FY27 outperformance (35.5% vs 20%) instead; downstream stages should not accept the outperformance narrative without checking which period is being compared. (2) Note 48(ii) confirms the rate-recovery pass-through mechanism covers only steel, aluminium and copper; margin gains trace to mix (ignition to electronics), not price power, and the unindexed input list (rare-earth magnets, silver, electronics) is exactly where FY26 Q4 margin pressure showed up. The WC-intensity question (crux of this run per the task brief) cannot be fully resolved from the business model alone: the rupee drag is consistent with a growth-year build, but the overdue-SHARE deterioration (not just rupee amount) argues at least a partial genuine collection-cadence shift layered on top, best resolved by next quarter's ageing data, not this stage's documents."
