going_concern_language: "NONE found in either annual report's notes to financial statements, the standalone auditor's report, or the consolidated auditor's report (re-confirmed by direct read across all three passes)"
analyst_note: "The single most important structural read from these notes is the funding chain, not any one number: the Rs 447.22 Cr guarantee, Rs 108.24 Cr loan, Rs 145.30 Cr unutilised QIP, and Rs 298.43 Cr consolidated capital commitments describe one relationship, the parent funding and guaranteeing a pre-revenue subsidiary, with the guarantee's own downside carrying no visible Ind AS 109 treatment anywhere. Pass 1's related-party misread (sale vs purchase, wrong counterparty) is fully retracted; the corrected reading turns a revenue-quality question into a cost-side, sole-source, KMP-controlled-supplier concentration question, which is a different and arguably sharper concern for position sizing. This stage's record stops at FY2025; the Dhanuka Laboratories reverse merger (Note 56) is a leading indicator in these notes of an event the run's own corrections confirm became effective 10-Jul-2026, well outside what these notes alone can evidence."
