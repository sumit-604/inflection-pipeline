stage: B04-bizmodel
company: "DPABHUSHAN"
run_date: "2026-09-19"
model: claude-sonnet-5
status: complete
input_gaps:
  - "Gold/diamond/silver revenue split by product is deck-level only (Q4/FY26 deck p.9, Q1 FY27 deck p.7); the audited FY26 AR treats the company as a single reportable segment 'Jewellery' with no product-line breakup in the financial statements (Note 33.19, AR p.104, printed p.202-203)."
  - "'Revenue from Non-Retail Operations' (12.3% of FY26 revenue, -5.96% YoY, Note 20, AR p.95 printed p.184-185) has no composition narrative anywhere in the AR or MD&A."
  - "DP Swarn Plus scheme enrolment/AUM, e-commerce revenue share, and store-level revenue (as opposed to store-level footfall) are NOT FOUND in this corpus."
  - "Per-gram or per-store COST (as opposed to revenue) is NOT FOUND; only company-wide Cost of Material Consumed (Note 23) is disclosed."
flags:
  - {type: FLAG-VOLUME-VS-PRICE, reason: "FY26 gold grams sold (Note 33.5, AR p.101 printed p.197) fell 13.3% YoY (63,80,585.86g to 55,30,535.03g) while gold segment revenue (Q4 deck p.9) rose 21% YoY, implying revenue-per-gram rose ~39% YoY. FY26 revenue/margin growth is price-led, not volume-led; directly on point for B00 LBF1."}
  - {type: FLAG-CASH, reason: "Carried from B01/B02: FY26 CFO -Rs 97.31 Cr on PAT +Rs 211.84 Cr, financed entirely by fresh bank borrowing while trade payables were paid down 35.7%; inventory is 24.7% of FY26 revenue and asset intensity is otherwise light, so this is a working-capital, not a fixed-asset, cash story."}
  - {type: FLAG-GUIDANCE-GAP, reason: "Diamond-studded jewellery is named a 'strategic growth category' / 'key revenue driver' (AR p.12, printed p.18-19; Q4 deck p.29) but FY26 diamond segment revenue fell 5% YoY (Q4 deck p.9), the opposite direction of the stated priority."}
