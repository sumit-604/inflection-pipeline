analyst_note: "Loop 1 applied: text and attribution fixes only; no verdict, verdict-card or forward figure moved. Pre-thesis read: no Notion page or prior log, so Steps 3 and 6A-6D and Role 5 credibility are ND. Q2 growth is price-led: ASR volume +13% YoY, derived realisation +34.6%. Operating EBITDA ex-other income fell 807 bps QoQ to 13.59%. Other income (29% of PBT; filed H1 interest only 6.13 Cr) and a deferred-tax credit carry PAT. The two EBITDA/kg baselines management accepted (36 and 45) reconcile on filed numbers: 35.60 ex-OI and 44.23 incl-OI, so the Rs 54/kg target is incl-OI. 'Very small portion' belongs to the Mexico JV passage; India partial recovery rests on cc L478-480 and L547-559. A3 corrections: Q1 revenue 262.46 Cr filed; contract ends Dec-2028 and its value is approximate; deck capacity 50,000+ MTPA reconciles 90% utilisation. JV funding beyond equity, with a 1.82 Cr CON-below-SA other non-current assets gap, is the governance item most likely to grow. Indicative FY27E PAT 112 Cr (104-131); FY28E 122 Cr (82-167)."
