going_concern_language: "NONE. No going-concern qualification or emphasis-of-matter paragraph in either audit report (consol p.199-201, standalone p.291-293); CARO clause (xix), standalone p.305-306, states nothing has come to the auditor's attention indicating inability to meet liabilities as they fall due over the next twelve months."
analyst_note: "Two cross-note patterns drive most of this pass's flags. Pattern A: receivables alone look fine, but unbilled revenue (+40.6%) and payables (+91%) both outrun revenue (+35.1%), which is the notes-level explanation for FY26 FCF of Rs -52 Cr (company memory) that no single note shows alone. Pattern B: the two biggest new judgment items (goodwill Rs 2,940.46 Mn, earn-out liability Rs 881.45 Mn) both lack quantified sensitivity, while smaller items (gratuity, FX) are disclosed in full detail elsewhere in the same AR, so this reads as a disclosure choice specific to the Cryptas deal, not a general transparency shortfall. Core business (ex-M&A judgment items) is clean: no fraud, no going concern issue, no bank debt at Indian entities, net debt/equity 0.03x, CSR over-spent, ECL/actuarial sound both years."
