analyst_note: "All figures Rs million as printed. Use audited lines (3,328 / 1,761 / revenue 66,462). Net debt 1,619 is borrowings-only; at 31 Mar 2026 it is net DEBT, and leases 60,205, supplier finance 1,251 and deferred consideration 2,036 sit outside. Admissions 150 Mn are flat to FY24 (151); two-year growth is price (ATP +8.5%, SPH +11.4%). Screens: 93 added vs 100-110 plan; 1,798 / 1,789 / 1,782 counts conflict. CARO vii(b) table: read the PDF page, text extract garbled (service tax 56, not 564). Pledge and promoter buyback tender come from post-AR NSE filings, not the AR."
