analyst_note: "TAM is a towers-per-year market, not a rupee market. Rupee figures use Rs 1.236 Cr per tower (order book blend); Model 3 full-value basis is 3.0x higher and conversion-only is 0.47x. SAM = 33% (second-hand Chinese-OEM share of FY26 installations) because only that channel is evidenced as buying Anawil towers; it omits unnamed customers D to H and ignores product, geography and capability filters (NOT FOUND, so no subtraction). Read SAM share (35.8%) as LOW confidence. Of the 49.3% yr3 CAGR, 22.5% is tower volume and 21.9% is price and mix to Model 3; use the tower CAGR for profit pools since Model 3 earns 14 to 16%. Rating assumption 3.4 MW comes from the company's own 42.56 GW / 12,500 arithmetic; at 4.0 MW towers fall 15%. Anawil's FY26 210 towers are 11.8% of 1,779 implied national towers, which looks high and hints at lower average ratings or lead time between tower build and commissioning. Separators to watch: Q3 FY27 towers delivered and Gujarat revenue; OEM tower-sourcing disclosure."
