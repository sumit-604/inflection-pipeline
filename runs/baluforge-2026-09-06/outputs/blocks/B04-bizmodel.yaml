analyst_note: "Archetype verdict (build-to-spec, not converter) rests on product specificity, OEM design-in cycle, and certification regime; it does NOT rest on the export pricing mechanism, which is undisclosed despite exports being 83.4% of consolidated revenue. This is a genuine evidentiary gap, not a close call on the overall archetype: five independent evidence lines (product naming, input-spec dictation, 15-20yr customer lifecycle, certification regime, margin-tracks-mix-not-steel-price) all point the same way, and no disclosed evidence points toward a converter reading. Flag the export-pricing gap as a Halt 1 verification priority regardless."
