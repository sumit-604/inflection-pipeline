flags:
  - type: FLAG-EMOAT-RD-ZERO
    reason: "AR BRSR discloses R&D expense at 0.00% of total R&D+capex investment for FY2026 (0.00083% FY2025), AR p.96-97. This falsifies any R&D-driven or innovation-driven moat claim made in the concalls or the investor presentation (e.g. 'strong focus on research and development,' Jun-2025 call)."
  - type: FLAG-EMOAT-EXPORTS-ZERO
    reason: "AR BRSR discloses exports at NIL percent of turnover, AR p.87. Directly contradicts any China+1/export-beneficiary framing used in the investor presentation (slides 20-24)."
  - type: FLAG-EMOAT-DEALER-DECLINE
    reason: "AR BRSR shows dealer/distributor count falling from 93 to 82 and dealer-channel sales share falling from 12.44% to 11.61% of total sales, FY25 to FY26, AR p.96. Contradicts the '1000+ channel partners' distribution-strength narrative repeated in the presentation and on the Jun-2026 call, and contradicts the 'diversified demand reduces customer concentration risk' claim (Inv. Pres. slide 18)."
  - type: FLAG-EMOAT-CAPACITY-CUT-UNDISCLOSED
    reason: "Aluminium frame capacity at Narmadapuram was stated as 54,000 metric tons on the Jun-2025 call and has appeared as 18,000 MTA in every subsequent call, the investor presentation, and the AR itself, a ~67% reduction never flagged as a revision anywhere in the corpus."
  - type: FLAG-EMOAT-EXECUTION-CROSSREF
    reason: "F2 (execution moat) and every forward-capex-dependent category (B1, H2, R1) inherit the B05 Grade D promise-delivery record (1 delivered/5 partial/5 missed of 11 tracked promises, all misses externally blamed) and should be read at a material discount to the company's own framing."
