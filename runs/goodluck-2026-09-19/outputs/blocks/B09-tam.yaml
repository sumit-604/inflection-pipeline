flags:
  - type: FLAG-MGMT-DEFENCE-DEMAND-INFLATED
    reason: "CMD's own claim ('India needs 48 lakh [4.8 million] 155mm shells per year', Concall_Feb_2026_Transcript.txt p.13, hedged only as 'as per my information') implies a domestic-only market of Rs1,15,200cr/year at GDAL's own realised blended shell price (~Rs24,000/shell). This is ~24.5x this stage's conservative India-centric defence TAM (Rs4,700cr, built from the KPMG Army-ammunition-budget anchor). Internally inconsistent with the company's own better-anchored context; read as inflated, most likely a multi-year stockpile figure or a global/domestic conflation, not a usable annual-flow sizing input."
  - type: FLAG-MGMT-SOLAR-SHARE-INFLATED
    reason: "CMD claims 'presently serving 30% plus market share' of the solar-support-structures sector (Concall_Aug_2026_Transcript.txt line164). Against this stage's India solar-mounting-structure TAM (US$1.8-2.2bn / Rs15,300-18,700cr, web search) and Goodluck's own guided FY27 solar-structures revenue (Rs600-700cr, Concall_Feb_2026 line231-232), the implied actual share is ~3.2-4.6%, not 30%+. Unresolved; either 'this sector' refers to a much narrower niche than the full market, or the claim is overstated."
  - type: FLAG-DEFENCE-EXPORT-SHARE-AR-INTERNAL-INCONSISTENCY
    reason: "AR2026 states private-sector share of India's domestic defence output as both 'around 30% to nearly 50%' (prose) and '24%' (summary card) on the same page (p.19/extraction); not resolved in this stage."
  - type: FLAG-GDAL-CAPACITY-TIMELINE-RISK
    reason: "This stage's defence SOM assumes GDAL Phase-2 (400,000 shells) is at least partially ramped within the 5yr window (Sept-2027/Q4-FY28 target per Reg 30 filing 06-Aug-2026). That target already reflects one confirmed slip from the original 'within one year' (Oct-2025) promise, and B07 carries a grade-D promise-delivery record (1 delivered, 2 partial, 4 missed of 7). A second slip would push the 5yr SOM (Rs610cr) toward the 3yr SOM (Rs420cr) instead."
market_definition: "Steel processing/engineering products (CR/ERW/GI pipes, precision auto/hydraulic tubes, solar/transmission structures, oil-and-gas forgings) plus a licence-scarcity 155mm defence-shell subsidiary (GDAL, 79.43% owned), India-domestic with ~29% export share."
