analyst_note: "The corrected record includes at least one instance of the same underlying fact (the plant shutdown) described in opposite causal terms to investors and to a court, and a done-deal allocation claim management never revisited when it unwound. The core-margin exchange (9-9.5% ex co-products against a 23.5% headline, Q1 FY27 call) is the single most informative data point in the corpus and should be read together with the fact that the quarter's margin rode grain stock bought before a subsequent price rise, not a repeatable structural gain. The 15 cr L court order, the CBG JV ownership/consolidation description, and the group-sourcing-vs-AR reconciliation are the three items most likely to move the thesis over the next two quarters; none was resolved inside this four-call window."
