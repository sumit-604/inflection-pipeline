analyst_note: "Two compounding assumptions carry real weight: (1) FX ~Rs85/USD for the 2025-vintage IMARC figure, an estimate not a sourced rate; (2) a GLOBAL 44% round-tools-vs-inserts split applied to India, since no India-specific split exists anywhere searched. Conservative TAM (Rs6,650cr) is Method-2-derived per rule 6; realistic (Rs11,594cr) is Method-1-derived. The listed-peer floor (Rs1,761.71cr) sits well below both, consistent with a market dominated by unlisted/import supply, which is the expected relationship for a floor, not a contradiction. SOM's 20.7-22.1% implied CAGR and the ~Rs180cr yr3 capacity gap are the two numbers stage 11 should weigh hardest against the 25% CAGR hurdle."
