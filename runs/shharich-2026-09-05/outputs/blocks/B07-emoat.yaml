analyst_note: "H3 (solar/ESG) and E2 (export shift) both straddle two category definitions in the taxonomy (H3 vs B1 for captive power; A3 vs H3 for by-product/waste framing). Each underlying fact was assigned to exactly one category to avoid crediting one improvement through two mechanisms: solar capacity to H3 only, by-product revenue to A3 only, leaving B1 at NO EVIDENCE FOUND since no raw-material backward integration exists. E2's export number is real and audited but scored at inference quality because its causal story (durable export win vs one-year trading pass-through) is unproven and contradicts the company's own FX risk note. The em_score of 8 is internally consistent with B01's Gate 0 finding of a deteriorating backward moat: this is a company where neither the existing nor the forming competitive position currently supports a transition thesis, independent of the volume-vs-spread question this run's spear gate was designed to test."
