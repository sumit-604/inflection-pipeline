analyst_note: "Pre-thesis read; no prior quarter or checklist, so F17 silence counts are 1. Three threads matter most. First, headline growth quality: derived Q1 FY27 YoY of about +121% falling to +52.3% in Q2, plus an acquired subsidiary with no stated stake or date, points to an acquisition base effect; the 140+40=180 split carries no intercompany elimination though Karnika makes 60% of Kidcity goods. Second, the earnings bridge: PAT outgrew EBITDA while EBITDA margin fell 190 bps, so the gain sits below EBITDA (tax, other income or MI), not in the operating leverage the CFO cited. Third, the B2C build: licence MG of INR6-8cr against about INR25cr revenue at 50 stores, break-even airports, a launch date that drifts within one call, and equity named as the funding route. Together these put the 17-20% margin band and EPS (not PBT) growth at risk in FY28. A1 line drifts are logged in report section 0 and change no finding."
