    reason: "Operating cash flow negative at both standalone (₹-581.08 lakh) and consolidated (₹-1,852.78 lakh) levels in FY25 despite the profit turnaround (standalone PBT ₹762.18 lakh, consolidated PBT ₹1,800.55 lakh); confirmed exactly against the primary Cash Flow Statements in this stage. CFO/PAT and CFO/EBITDA both negative (worse than the pipeline's <0.7 threshold). Growth funded by ₹3,240.40 lakh (consolidated) / ₹1,001.45 lakh (standalone) of fresh borrowings, not internal cash generation. Capex essentially stopped (capex/depreciation 0.06-0.07x FY25). ROE (12-16%) and ROCE (19-28%) are leverage-driven per DuPont decomposition (equity multiplier ~4.75x consolidated), not evidence of a self-funding operating model. (Standalone/Consolidated Cash Flow Statements, AR p.79/p.122; DuPont derived this stage from primary Balance Sheet/P&L, AR p.76-78/p.125-126)."
  - type: FLAG-RPT
    reason: "Related-party concentration is structural and extends into financing: up to 70.4% of consolidated COGS, a new ₹3,320.29 lakh 0%-interest loan from the dominant customer (Plastene India Limited, also a 4.68% promoter-group shareholder) to the subsidiary, and cross-guarantees between parent, subsidiary, and Cornucopia Tradelink exceeding 2x consolidated net worth (net-worth denominator ₹5,957.15 lakh confirmed exactly this stage against the consolidated Balance Sheet, AR p.125). Sharpened this stage by a Secretarial Auditor finding of Regulation 23(9) RPT-disclosure-timing non-compliance for the half-year ended 30 September 2024 (Directors' Report, AR p.13), and by resolving K.P. Woven's ownership as 98.45% voting rights / 51.33% capital (an unexplained split) via Form AOC-1 (AR p.15)."
