going_concern_language: "NONE - auditor's opinion unqualified and unmodified on going concern basis at both standalone and consolidated levels; standard boilerplate 'accrual and going concern basis' stated (Note 1.1(b) standalone p.126, consolidated p.202); Directors' Report residuary disclosures confirm no material orders or changes impacting going concern status between year-end and report date; this holds despite the Rs252.6cr (standalone) / Rs293.2cr (consolidated) net-debt swing and sub-1.0x DSCR at both entity levels"
analyst_note: "The most important cross-pass connection is ranks 3+4: the Rs97.68cr Limitless Contracting loan and MSSTL's own disclosed Rs97.68cr short-term-for-long-term funding gap are the same figure, found in two different documents (consolidated Note 36/15(b) vs Annexure A CARO). Neither note cross-references the other; only reading both together reveals a promoter entity likely bridged a subsidiary's delayed bank financing at undisclosed terms while that subsidiary posted cash losses and skipped RPT approval. This pattern - material facts disclosed correctly but scattered across notes with no cross-reference - recurs across ranks 5, 8, 9, and 10, and is the defining accounting-quality characteristic of this filing: not fabrication, but fragmentation that a reader must reassemble."
