analyst_note: "The single dominant pattern across all three passes is not any one accounting-quality defect but a cluster of internal contradictions recurring wherever a Note is checked against another statutory document in the same annual report: cash (Note 10 vs Spear/MD&A framing), related-party completeness (Note 5/34 vs AGM director list), KMP remuneration (Note 34 vs Annexure C vs Corp Gov), rent income (Note 34 vs AOC-2), tax disputes (Note 37 vs CARO), ratio explanation (Note 42 vs Balance Sheet), and R&D units (BRSR vs Business Driver page). No single instance is individually disqualifying, and core mechanics (revenue recognition, tax reconciliation, debt-free balance sheet, receivables ageing) are clean. But the frequency and spread of these mismatches across independent disclosure documents is itself the finding: it suggests a compilation/review control gap in how the annual report is assembled, which downstream stages should weigh when assessing management credibility on any single unverified number this report carries forward."
