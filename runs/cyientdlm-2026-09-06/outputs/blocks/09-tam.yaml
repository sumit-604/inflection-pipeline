analyst_note: "FX fixed at the AR's own year-end rate (1 USD = INR 94.3334, p.47) throughout, which slightly inflates USD-to-INR conversions against a lower average rate. Flagged, not hidden. The SAM filter multipliers (0.65, 0.70, 0.60, 0.90) are reasoned judgment anchored to disclosed certifications, footprint and capacity, not sourced third-party splits, so treat SAM and SOM as directional. The India EMS market-size literature disagrees by over 80% across named sources (Mordor $35.4bn against P&S and the AR at $65bn for 2025); the conservative-bias rule was used to select the lowest defensible top-down variant (method 5, Rs88,000cr) as the TAM anchor rather than averaging the spread away. Management's $650bn global EMS claim roughly matches independent estimates on its own terms but is the wrong denominator for this company. Using it as the opportunity for a certified, India-and-US, four-vertical niche is the TAM-washing pattern this framework exists to catch."
orchestrator_note: "LESSONS Amendment 14 fade guard is LIVE for phase 3. The SOM-implied revenue CAGR is 17.6% at 3 years and 17.1% at 5 years, materially above the automatic fade-to-10% that a MODEST emerging-moat classification (B07 em_score 21) would otherwise apply. Per the ENTERO 2026-08-30 open action, flag the fade for operator ruling at stage 11 rather than applying it silently."
