  - "What interest rate, tenure, security, and repayment schedule apply to the Rs 108.24 Cr loan to Orchid Bio-Pharma Ltd, and why does Note 7 describe it as the company's only related-party loan without fixed repayment terms?"
  - "Has the Rs 447.22 Cr corporate guarantee for Orchid Bio-Pharma's borrowings been recognised and measured under Ind AS 109, and if not, what is the accounting basis for omitting it, given the guarantee is 34.0% of standalone net worth?"
  - "What is the basis for removing the Rs 38.72 Cr pre-CIRP contingent claim from FY2025 disclosure, was an independent legal opinion obtained and on what date, and how does that reconcile with the counterparty's continuing dispute?"
  - "What is the stated per-equity-share conversion price or ratio for the Rs 143 Cr promoter OCDs, and why do Notes 22 and 41 show no dilutive EPS effect from an instrument convertible at any time over a ten-year tenor?"
