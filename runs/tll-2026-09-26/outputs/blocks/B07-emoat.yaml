combined_reasoning: "Gate 0's rework moves the backward score from core 48/moat 10/THIN/AVERAGE to core 52/moat 15/MODERATE/AVERAGE (B01 rework round 2): three moats confirmed (M1 pricing power, M3 capital efficiency, M4 customer stickiness) instead of one, but the classification band itself does not move, still capped AVERAGE by the same two binding deal-breakers (Block B cash conversion 0/20; cumulative CFO/PAT -0.478). The forward scan's own corrections (E1 tier fix, rounding fix, capex-embedded-growth computed at 28.8%) also do not move em_score out of the NO MEANINGFUL EMERGING MOAT band (8.2, <12). A stronger confirmed-moat count on the backward side does not, by itself, supply a forward re-rating engine: the forward scan still finds continuation of the one existing, now better-evidenced moat (registration/subsidiary platform, itself the source of two of the three newly-confirmed Gate 0 moats, M1 and M4) rather than a new or accelerating emerging moat, and F2/G1/G2 carry documented negative findings unchanged by either rework."
top_moat_risks:
  - "Subsidiary build-vs-delivery gap (LBF3): three of five subsidiaries pre-revenue or near-zero-revenue against materially larger deck-claimed peaks; the clearest candidate emerging moat rests on unbuilt capacity. Section 2C quantifies this capacity at Rs 17.50 Cr CWIP, implying 28.8% revenue upside if and when converted, with no disclosed conversion timeline beyond the deck's own undated peak claims."
  - "Registration-to-revenue conversion rate undisclosed; the core existing moat (registration pipeline) has no verifiable monetisation metric to show it is strengthening, not just growing in count."
  - "Deck-vs-AR evidentiary conflict on R&D/IPR: promotional claims contradicted by the AR's own statutory Technology Absorption disclosure (R&D 'Not applicable', tech absorption 'NIL')."
  - "Execution risk already documented and now reinforced by the corrected B05 record: TLL Parenterals commissioning status reclassified in the deck without matching revenue; credibility grade D (regraded down from C) on a pattern of unacknowledged inconsistency across five separate items."
  - "Working capital deterioration (Gate 0 deal-breaker) and an accelerating chairman-loan dependency could constrain funding of the capex-heavy subsidiary buildout the emerging-moat case depends on."
analyst_note: "Rework round 2 resolves items 17 and 18. Section 2C now runs the arithmetic the run-1 report wrongly said it could not (CWIP Rs 17.50 Cr x FAT 2.12x = 28.8% implied revenue upside), with the FAT-distortion caveat carried beside the figure rather than used to suppress it. Section 5's multiplier rounding and E1 tier are made internally consistent (documented throughout, not documented-in-the-recount-but-claim-in-the-scorecard), moving em_score from a reported-but-miscomputed 8 to a correctly-computed 8.2; the classification band (NONE, <12) does not change. active_categories is restricted to the one Strong/Moderate row (E1) per schema; the five Weak-tier rows removed from active_categories are either already described in Section 3 or, where they rested only on claim/inference evidence (C1, A4), newly added to the optionality register. The new B01 (core 52, moat 15, MODERATE moat class, three moats confirmed) and B05 (credibility D, 3/2/3 promise-delivery) do not change this stage's own findings or classification; they are woven into 6C/6D and the F2/top_moat_risks discussion as the injected inputs the rework instructed this stage to re-read."
