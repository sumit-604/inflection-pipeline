analyst_note: "FY26 shows a real step-down, not noise: ROCE 25.2%->16.6%, EBITDA margin 26.1%->24.1%, FCF flipped negative, and receivable/WC days extended. This same soft-tissue signal (customers taking longer to pay, weaker relative leverage) surfaces independently in four places: B4, M4, M10, M12. The GOOD classification rests on a strong 9-year base and a pristine balance sheet (Block D 20/20, net cash), which the FY26 dip does not touch. Moat score (12/60, MODERATE) is peer-data-starved: 4 of 12 tests (M2, M5, M7, M9) scored 0 solely for missing peer mcap/margin/listed-player data, not because the underlying moat is absent; true moat quality is likely understated pending peer data. No-promoter structure (PE sponsor fully exited, declassified Apr-2025) means E1-E3 use alt-path scoring; the alignment signal worth tracking going forward is the institutional mix shift (DII rising 28.4%->36.0%, FII falling 40.2%->22.7% over two years), not promoter behavior, since none exists."
