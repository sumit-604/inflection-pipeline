  - {type: FLAG-NARRATIVE, reason: "Chairman's Letter states EBITDA of Rs.4,981.53 lakh, which reconciles almost exactly to the correct audited EBITDA (Rs.4,561.29 lakh, matching the Board's Report table) plus the one-time exceptional insurance gain (Rs.420.25 lakh) -- an apparent 9.2% overstatement of the headline profitability metric in the most-read section of the AR (Chairman's Letter p.7 vs P&L p.95 and Board's Report p.32)."}
  - {type: FLAG-DISCLOSURE-CONTRADICTION, reason: "MD&A's own 'Return on Net Worth' table (p.28) states 12.28% FY25 vs 11.50% FY24 (a claimed increase) while the audited Note 43 Ratio Analysis (p.138) states Return on Equity of 6.61% FY25 vs 11.50% FY24 (a 42.5% decline) -- both share the same FY24 base and are irreconcilable with each other within the same document."}
  - {type: FLAG-PROMOTER-PRELIM, reason: "No adverse promoter pattern found in this AR alone (no pledge disclosed, no YoY selling data available from this single-snapshot document); full promoter verdict deferred to B08 as instructed. Independent Chairman (Mulesh Savla) holds directorships/chairmanships at two other Aarti-group-adjacent listed entities (Valiant Organics, Valiant Laboratories), a cross-board pattern worth carrying into B08's promoter-network review even though it is via the independent Chairman rather than the promoter director himself."}
