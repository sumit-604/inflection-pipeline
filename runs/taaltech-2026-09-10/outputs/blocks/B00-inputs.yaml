load_bearing_facts:
  - "The 30% operating margin. FY25 OPM rose 25% to 32% while revenue fell Rs187cr to Rs185cr. No listed Indian ER&D peer of any size earns this. Verify in the FY26 and FY25 AR P&L whether the margin is operating, or whether other income, forex or treasury income sits inside it."
  - "The Q1 FY27 revenue jump. Rs64.81cr against Rs45.77cr, up 41.6%, after three years at 7% CAGR. Verify whether the step is organic, one large client, a scope change, or an acquisition."
  - "Cash conversion. Consolidated CFO Rs18.74cr FY26 against PAT Rs56.72cr, 0.33x, down from 0.84x. Working capital days 77 to 120. Receivables Rs38.61cr to Rs52.04cr. Verify ageing, the Rs143.89cr investment composition, and settle the FLAG-CASH determination."
  - "Related-party exposure to the Taneja group. Taneja Aerospace and Aviation Ltd is a separately listed entity of the same promoter lineage. Verify the FY26 related-party note in full: balances, transactions, guarantees, and any receivable from group entities."
degradation_active:
  - "NO-CONCALL MODE: stage 5 runs from the AR MD&A, the Board report and the results commentary. credibility_grade defaults to C and may rise to B only on documented AR-guidance-versus-results delivery evidence, never to A. B05 carries no_concall_mode: true."
  - "Stage 6 runs: inputs/peer-concalls/ holds 11 transcripts across three peers."
  - "Stage 4 and stage 7 run without an investor presentation."
  - "Stage 8 sources the promoter and group picture from web search plus the AR governance section; no announcements folder to grade documented actions."
flags: []
analyst_note: "Two corpus facts shape every downstream stage. First, TAAL Tech is a silent filer: no calls, no presentations, no broker coverage in corpus. Everything management has said in FY26 sits inside one annual report. Second, the ten-year financial series spans a business change. The company was an aircraft-charter operator, stopped flying after an accident, and became an engineering services firm when TAAL Tech India Pvt Ltd merged into the listed parent. Standalone total assets moved Rs19cr to Rs207cr between March 2024 and March 2025 on that merger. Stages must check the segment note before reading FY16-FY21 rows as an engineering-services operating history."

