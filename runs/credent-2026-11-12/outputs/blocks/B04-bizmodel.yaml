mgmt_questions:
  - "Who is the FY26 top customer at 15.76%, is it related, and how does none above 10% on the call tie to the filing?"
  - "What is the price per collection and per pickup by line and how did it move at last renewals?"
  - "What explains other expenses falling from 23.12% to 12.87% of revenue?"
  - "When do receivable days fall from 100.3 to 60, and who owes the 240.23 aged 1-2 years?"
  - "What is organic growth in Healthcare, Team and Alltrak, and the 12-month revenue of each?"
  - "Why does the H1 deck show FY25 PAT 55 Mn when the listing deck restates it to 224.67 Lakhs?"
  - "Terms, security and purpose of the Rs 450.00 Lakhs Kartavya Healtheon loan?"
one_line_verdict: "A labour-led pre-analytics outsourcer with light assets, weak pricing power, 81.76% top-10 customer share and profit not yet turning into cash."
analyst_note: "Fit to the stage 0 row Logistics (asset-light): partial. The asset side fits (PP&E plus intangibles 11.5% of assets, LP slide 23). The revenue side does not: healthcare services (43.04%) and OSCM (24.93%) are deployed staff, 68% of FY26 revenue; logistics is 25.26% (LP slide 6). Working capital is heavy (100.3 days, B03), which is the trait of the Logistics (WC-heavy / project cargo) row. Nearest alternative on the economics is Hospitals / dialysis / healthcare services, only if collections are priced as care delivery; evidence of that pricing power is absent (RHP p.27: terminable, price cuts). Two readings: healthcare logistics platform with pricing power, or outsourced labour at cost plus. Separator: price per collection and margin by line, NOT FOUND. Operator rules the row at the pillar gate. New: the H1 deck FY25 equals the unrestated AR figures despite its restated label; use the listing deck base. Unit price, segment margin and the call claim of none above 10% are unverified."
