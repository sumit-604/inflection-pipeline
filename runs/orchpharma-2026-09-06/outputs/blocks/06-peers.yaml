industry_cross_read:
  demand: "Both current peers describe a strong-to-improving demand environment through FY26 driven by company-specific execution (CDMO ramp-ups, FDA remediation unlocks, controlled-substance and complex-generic launches), not a shared macro recovery narrative; neither frames FY26 as recovery-from-trough the way Orchid does"
  pricing_inputs: "Where visible (Granules paracetamol/metformin/DCDA, stale Kopran Penems/amoxicillin), commodity-line pricing is under continuing pressure from Chinese competition with rising raw material costs into Q1 FY27; this matches Orchid's mechanism in kind but not in scale, since group-level peer revenue still grew"
  capex_cycle: "Industry-wide capacity race, not a lone expander: Neuland (peptide facility, ~Rs 1,000cr+ extrapolated, plus new R&D campus), Granules (Genome Valley +40% capacity, Vizag peptide facility, DCDA pilot-to-commercial), and Kopran (stale: Panoli R&D, Meropenem vial-filling line) are all expanding capex through the window; no peer discloses a 7-ACA-specific capacity move"
peer_mentions_of_company: []
risks_peers_raise:
  - "FDA warning-letter and multi-quarter remediation risk at manufacturing sites (GRANULES, Gagillapur/Genome Valley, all four calls) — a risk category not surfaced in comparable detail in Orchid's own concalls per the stage 5 handoff"
  - "Working-capital/inventory-ramp scrutiny from analysts, including explicit pushback on whether reported profit growth is really an inventory-valuation artifact (NEULANDLAB-Concall_Feb_2026_Transcript.pdf, p.8-9, Aanchal Jalan exchange) — relevant lens for Orchid's own balance sheet quality given Correction 1/4 in this run"
  - "Raw-material and logistics cost inflation tied to West Asia geopolitical tensions (GRANULES-Concall_Jul_2026_Transcript.pdf, p.5) — a macro input-cost risk not raised in Orchid's own narrative per the stage 5 handoff"
net_narrative_effect: "complicates"
analyst_note: "The most load-bearing finding here is negative: both current, contemporaneous peers grew revenue through every quarter of FY26 while Orchid declined about 12% on every basis management stated. That is not proof the decline is company-specific — neither peer sells cephalosporins, so the product-level mechanism (7-ACA price, Chinese dumping in that specific molecule) is untestable against this corpus — but it removes the 'this was just a bad year for everyone in Indian API exports' reading as a default explanation. Synthesis should treat the FY26 decline as needing a company-specific or product-specific explanation until cephalosporin-specific primary evidence says otherwise, and should not lean on this peer set to either confirm or dismiss the 7-ACA/Chinese-dumping thesis, since it is structurally silent on that molecule."
