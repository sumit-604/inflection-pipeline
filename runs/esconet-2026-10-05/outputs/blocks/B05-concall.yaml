analyst_note: "Two readings of the Q1 FY27 margin. Reading A: structural HexaData and AI mix. Reading B: a one-time gain on stock bought before hardware prices rose, plus 193.21 Lakhs of other income. Separating observation: Q2 FY27 standalone gross margin after stock is replaced at current cost, with HexaData revenue and margin by line. Q1 earnings sit entirely in the parent: standalone PAT 683.80 Lakhs exceeds FY26 full-year standalone PAT 646.83 Lakhs, while subsidiaries net lost about 34 Lakhs (consolidated 649.53 vs standalone 683.80 Lakhs). Derived rest-of-group EBITDA ex other income is about 0.7% on 5,525 Lakhs revenue (Singapore trading). The MD was more candid on the call (ZeaCloud flat, price volatility helped) than the PR and deck. Grade C is the lower edge; a Q2 reversal moves it to D. The tax summons and warrant lapse went unmentioned, a silence the grade does not price."
