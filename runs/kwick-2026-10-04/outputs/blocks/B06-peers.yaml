analyst_note: "Cross-peer hypothesis: in government and BFSI hardware integration, the headline receivable-days figure is not the binding metric. Peers hold net working capital low by stretching OEM and distributor credit (DSSL net WC 14 to 17 days while receivables doubled; payables 134 days per analyst figure, uncontested), and the receivable risk surfaces as aged-debtor and unbilled-revenue audit items (ADSL). Kwick plans the opposite: creditor days 44 to 30 and debtor days 74 in FY27 (B05 guidance), so its Rs 44.42 Cr gap depends on collections, not supplier credit. Testable: Kwick H1 FY27 creditor days and top-supplier credit terms (top supplier 40.86%). Second item: peer Q4 shares are 26% to 33% (DERIVED) against Kwick 51%. Third: no verdict is CONTRADICTED; unverifiable items are structural, not evidence against Kwick. DSSL payables and receivables figures come from analyst questions; management did not dispute them."
