analyst_note: "Role 5 runs on a machine transcript with inferred speakers; the filing wins on every conflict. Three call statements conflict with the filing or the company's own deck. The chairman says gross and contribution margin rose YoY and it is not the revenue mix; the filing shows gross margin down 381 bps and the opex ratio down 245 bps. The earnout is called one-time, but the deck shows one in both Q2s, and the CFO left it out when asked whether Q2 other income recurs. The US business is called on plan at 1.17% subsidiary EBITDA. The FY27 guide does not reconcile: 9% on 30-35% growth needs H2 near 8.5%, below Q2, while investment intensity is said to fall. Only the 10% end fits. B2S revenue moves to FY29-FY30, so the proof-gate share leg cannot fire inside the window; the FY27 double-digit target is a DROPPED candidate, not scored. The testable positives: H2 growth above 30%, 600 Cr intake in Q3 and Q4, an S&M freeze until quarterly revenue doubles, and full expensing of product development. Credibility and archetype stay ND until Q3 FY27. Verdict unchanged."
