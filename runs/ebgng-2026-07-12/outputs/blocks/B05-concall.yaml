credibility_basis: "Management beat both original (20-25%/75bps) and revised (28-30%/150-200bps) FY26 guidance (delivered 34% revenue growth, 166-209bps margin expansion), but missed two specific quantified promises (H2 FY26 interest cost savings of Rs10-12cr, and debtor days holding at 30-35 days), explaining both transparently with exact figures rather than concealing them; FY27 guidance reset conservatively (25% revenue/50bps margin) after a strong beat year, consistent with a deliberate lowball-guidance pattern."
