rbled Q1 FY27 results filing digits beyond the insulator, conductor and foil segment cells (those matched the OCR text: insulator (145.61), conductor 42.53 on 1,712.04, foil 365.17); the scanned FY26 and Q3 FY26 results PDFs (not used by the stages); most peer-transcript figures beyond a sample of 25; the remaining detail rows of 02-notes-pass1/pass2 not listed in the sample. Struck as non-findings (rule 5b): the A1 median 12.85% (consistent with its displayed 12.8% and 12.9%, exact 12.835), the deck's printed 'CAGR 29%' revenue FY22-FY26 copied by 09-tam (a faithfully transcribed anomaly; screener gives 16.4%), 03's Annex C net worth 28,368.82 L (the AR itself transposes digits against S equity 28,386.82), 05's H1 EBITDA 265 vs 266 Mn rounding, 07's gap multiple 3.0x-3.2x vs 2.9x-3.2x rounding, 09's 'others about 2.5 Cr' vs 2.62 Cr. Source fidelity: every row marked source_fidelity true stands until the PDF itself disproves it. Rows marked false are derived-arithmetic or provenance points, not number-existence points."
