analyst_note: "Score is 8.3 because Kannur is capacity, not yet a moat. The only large item is the 220 kV qualification, credited once under A1 at the CLAIM multiplier; R1 is 0 to avoid double credit. Two new derived points: Q1 FY27 revenue rose only Rs 13.16 Cr, so a revenue-basis Kannur reading is near 10% if Unit 1 was flat; and 71.6% of Q1 wins fall due after Mar-2027, so the Rs 377 Cr FY27 delivery claim leans on the older book. The 330 kV orders sit above the commissioned class. Peer data was not in inputs, so the rarity of 220 kV makers is NOT FOUND, not assumed. Moderate B2 is an access ticket in a tender market, not lock-in."
