analyst_note: "Two load-bearing priors did not survive contact with the primary source: the Other Expenses reclassification (no such reclassification exists; gross margin resolves to ~78% once inventory movement is netted correctly) and the FY24 wine-segment figure (Rs 212.88cr per Note 37, not Rs 215.6cr, a small unexplained variance). The revenue-basis fact is confirmed but nuanced: FY25 is NOT wine-only (59% wine), only FY26 is. The receivables and RPT/guarantee facts are both confirmed and material. Recommend Pass 2 focus on: reconciling the Rs 250.77 lakh ECL write-back against the Rs 733.86 lakh gross bad-debt write-off in the same year; the source of Board's Report FY25 comparative loss figures (Rs 1,759.79 lakh/Rs 1,283.82 lakh) that do not tie to the audited consolidated P&L (Rs 2,269.40 lakh/Rs 1,706.26 lakh); and the promoter warrant lapse (39.5% of Aug-2024 warrants forfeited rather than converted)."
