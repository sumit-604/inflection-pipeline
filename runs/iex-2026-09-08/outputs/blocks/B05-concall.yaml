  - {question: "Do MCX, BSE, and CDSL show a similar pattern of fee realization trailing volume/activity growth, and how do they explain it?", why: "tests whether IEX's unreconciled realization decline is sector-wide or IEX-specific", check_peers: ["MCX", "BSE", "CDSL"]}
  - {question: "Does MCX's electricity derivatives commentary corroborate IEX's claim that power exchanges collectively grew 18% in FY26 against 1% demand growth?", why: "cross-checks a headline sectoral growth-rate claim against an independent source", check_peers: ["MCX"]}
  - {question: "Do BSE, CDSL, or MCX make comparably long-dated TAM claims for their own core segments, and how have prior such claims held up?", why: "tests whether IEX's ~25%-of-generation long-horizon claim is sector-standard framing or specific overreach", check_peers: ["BSE", "CDSL", "MCX"]}
  - {question: "Has MCX, which has also filed for a coal-market play, sized the same coal-exchange opportunity consistently?", why: "an unreconciled ~50% market-size revision in IEX's own disclosures needs an independent sizing check", check_peers: ["MCX"]}
  - {question: "Do BSE, CDSL, or MCX disclose customer/counterparty concentration more proactively, and how does their concentration compare?", why: "calibrates whether IEX's 50-60%/40% concentration and its reactive-only disclosure pattern are unusual for the sector", check_peers: ["BSE", "CDSL", "MCX"]}
  - {question: "Does BSE's own concall record address its market-share trajectory versus NSE, the comparator IEX repeatedly invokes to argue coupling will not erode its position?", why: "the NSE/BSE analogy is asserted without supporting data in this corpus", check_peers: ["BSE"]}
red_flags:
  - "HIGH: Fee realization compression (4.16 paise/unit Q1FY27 vs 4.33 paise/unit Q1FY26, computed from filed standalone revenue and volume) unreconciled across three quarters of direct questioning"
  - "HIGH: RTM growth guidance (25-30%, Q1FY27 p.29) falsified within weeks by the company's own July (+10.2%) and August (+10.6%) Power Market Updates"
  - "MEDIUM: Coal exchange opportunity size revised ~50% upward (80mn to 120mn tonnes) within six months with no bridge, internally inconsistent within the same Q1FY27 session"
  - "MEDIUM: CFO's ROE claim (42-44%) does not reconcile with computed ROE on FY26 reported numbers: 35.2% consolidated (PAT Rs492.9cr / stated net worth Rs1,400cr), 36.3% standalone (PAT Rs473.7cr / filed equity Rs1,306.7cr); EPS Rs5.33 quoted is standalone, cited beside consolidated PAT, consolidated EPS computes to approximately Rs5.53"
  - "MEDIUM: Customer concentration (50-60% buyer, ~40% top-10 seller) disclosed only at the final question of a two-hour analyst meet, paired with a stability claim asserted then partly withdrawn in the same answer, and a seasonal-churn admission that cuts against the customer-loyalty defense used elsewhere"
  - "MEDIUM: DAM coupling worst-case impact (20-40% of DAM share) volunteered once in opening remarks, not repeated or effectively denied ('I don't see any loss') when asked directly later in the same session; appears in no audited filing"
  - "LOW-MEDIUM: REC 'confusion will clear' excuse recycled across two quarters against a worsening trend (-81.4% Q1FY27, -86.6% Aug-2026); adjacent I-REC product also turned negative YoY in Q1FY27 (-4.5%) despite '200% growth' marketing"
  - "LOW: Non-operating share of consolidated PBT rose from 23.4% (FY26) to 29.8% (Q1FY27), computed from filed results, never raised by management or any analyst"
  - "LOW: Three 2023 product launches (HP-DAM, HP-TAM, Ancillary Market) are management-admitted failures for want of liquidity, never connected by management to the credibility of three further pending product launches"
dropped_triggers:
  - "REC market as a forward growth trigger: framed positively through Q2FY26-Q4FY26 (even cited as a size comparable to the future carbon-credit market); by Q1FY27, with volume down 81.4% YoY, framing shifts to 'too early to make any comments' and the trigger disappears from the growth narrative rather than being explained"
timeline_slippages:
  - "Term Ahead Market extension to 11 months: pending 'more than two years' as of Q1FY27 with no new timeline given (Q1FY27 p.40)"
  - "Green RTM / Peak DAM / Peak RTM petitions: identical 'order reserved' language repeated across all four transcripts with no resolution"
  - "Market coupling implementation: ordered 'by January 2026', still in draft-regulation/stakeholder-comment stage as of Q1FY27, with Grid India itself raising fresh operational objections in both the April and July 2026 sessions"
  - "Carbon exchange trading start: '1-1.5 years' (Q2FY26) moved to 'FY27 or FY28' (Q3FY26) moved to 'within this calendar year, BEE wants 1-Oct-2026' (Q1FY27)"
  - "Buyback: 'definitely considering it' (Q4FY26) restated as 'will consider it in future' (Q1FY27) with no new information across two quarters"
analyst_note: >
  Two computed figures in this report (paisa/unit realization, non-operating
  PBT share) were independently reproduced from the filed standalone and
  consolidated results rather than taken on the verifier's word, and both
  matched closely. The APTEL order itself is characterized in this report
  only through Rohit Bajaj's own gloss ("went to the extent of saying that
  all those things in the order is arbitrary", Q1FY27 p.20-21); the order
  dismissed IEX for want of standing and did not rule on the merits, so this
  characterization should be treated as management's framing, not as an
  independent finding, pending collection of the order text itself
  (input_gaps: regulatory_order_text, HIGH).
