analyst_note: "The single highest-value new finding from reading both ARs side by side rather than one AR alone: DSCR for the identical FY25 year is disclosed as 1.67x in AR FY2025-26 and as 0.15x in the AR FY2024-25 Note 35, using an identically worded formula. Gate 0 and stage 2 both cite the 1.67x-to-0.62x DSCR fall as evidence of a sudden covenant-coverage collapse; that specific comparator is not reliable. The underlying facts it was standing in for, negative CFO in two of three years and sub-1x DSCR this year on either report's own numbers, are independently sound and should carry forward instead of the 1.67x figure specifically."
