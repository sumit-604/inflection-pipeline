analyst_note: "Classification AVERAGE on a flat Core 40-59 band, moat MODERATE. The scorecard's headline weakness is not growth (16.6% revenue CAGR, 1 down year in 8) but a FY26 run-rate that softened across every dimension at once: ROCE 9.62% vs an 8-year median of 25%+ that is itself an artefact of pre-scale years, CFO down 28% YoY, PAT down 36% YoY, WC days up 15.8, and interest cover down to 3.51x on the newly consolidated (Saarathi-inclusive) balance sheet. No single number is a deal-breaker, but the direction of travel in the latest audited year is uniformly negative, and Block D sits one band above two separate deal-breaker thresholds (ND/EBITDA 2.83x vs >3x, IC 3.51x vs <3x). Downstream stages should treat FY26, not the multi-year average, as the base case starting point."
