verdict_basis: "No SEBI, pledge, selling, fraud or deal-breaker found; a safety FIR with Factories Act charges after seven deaths, an executive promoter on the Audit Committee, the unexplained two-independent exit and thin RPT disclosure hold it at CAUTION."
analyst_note: "Search is partial. The decisive open item is the Umred case. A named General Manager aged 56 was booked in April 2025; AR26 shows WTD Tenneti Narasimham Murthy, 57, joined 2019. Name and age match, but the link is inference. Two readings: (a) the WTD is an accused in a Factories Act case and the AR is silent, a disclosure and key-person problem; (b) a namesake, or the role differed in 2025. One observation separates them: the FIR text or the company's Reg 30 reply. Search found no arrest, no court outcome, no promoter named. The AR calls the incident the Board's 'major event' but gives no FIR or DISH disclosure. Livelaw anticipatory-bail hit was SBL Energy, not MMP. The Bapna and Khanna exit looks like term end (second term to 53rd AGM); the 33-day gap is the only oddity. CRISIL INC start date NOT FOUND."
