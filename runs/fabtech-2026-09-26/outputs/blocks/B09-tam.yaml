analyst_note: "Two independent methods (top-down MEA capex, bottom-up project-unit count) converge within 6% on a Rs 14,700-16,900 Cr/yr MEA SAM, which is the load-bearing number here, not the large low-precision global TAM. The resulting SOM CAGR (13.6-15.4%) sits below both FY27 guidance (20-25%) and the strategy's 25% hurdle -- a formal finding for Stage 11, not a quality verdict. Reconciliation requires either disclosed SAM-expansion (West, Saudi civil/MEP, animal health scale) or an aggressive share-gain rate the flat 11-month order book does not yet support."
