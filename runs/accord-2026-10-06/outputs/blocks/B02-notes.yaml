analyst_note: "Numbers mostly reconcile; the weakness is disclosure and provisioning. The pivotal open item is the Q4 cluster: vendor advance 624.41, stock in transit 619.50, payables +1,297, cash credit +454, all after listing. Two readings: advance pre-buying for the FY27 order book, or year-end positioning. The separating observation is the Q1/H1 FY27 unwind of advances and cash credit plus the vendor ledger. Cash of Rs 22.3 Cr is 91.4% IPO money. FY25 trend metrics (D/E, two-year CFO) sit on mixed bases; stage 10 must pick one. Q4 figures are derived from a restated 9M stub, not filed."
