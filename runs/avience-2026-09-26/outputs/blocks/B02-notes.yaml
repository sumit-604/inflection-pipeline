analyst_note: "The single most consequential outcome of this pass is resolving the Note 40 profit-split question the task brief prioritised: for FY26, three independent sources (the parent's own standalone audited PAT, the subsidiary's own AOC-1 PAT, and an RHP restated KPI cross-check spanning FY24-10M FY26) converge on the same conclusion - the Note 40 labels are swapped, and the listed Holding company, not the subsidiary, generated the large majority (~76-77%) of FY26 consolidated profit. This retires Pass 1's lead red flag as originally framed. FY25 is directionally consistent with the same swap but not numerically closed (the residual gap of ~Rs.140-240 lakh depending on comparator is most plausibly a first-full-year consolidation adjustment); DR Meditech's own FY25 standalone P&L would close it and is not in this corpus. The net-asset side of Note 40 is NOT part of this swap (Pass 2 already showed it does not reconcile cleanly either way, expected given pre/post-elimination basis differences), so the subsidiary's shrinking net-asset share (28% to 21%) stands as reported. Net effect on the run's structural read: less alarming than Pass 1 first suggested, but the labelling error itself is a genuine disclosure-quality flag that materially affects the accounting quality score."
