  - "Phase 2: a human reviewer would pause to demand management reconciliation of the Note 98(c)/Note 75 ~180x gap and disaggregated core-lending-profitability-ex-DA/ARC-gain before relying on any single reported PAT figure without adjustment, but this is an evidence-quality flag, not a mechanical failure."
  - "Phase 3: a human reviewer would not stop on balance-sheet or liquidity grounds (CRAR, ALM, D/E all sound post-IPO); would want core lending profitability ex-DA/ARC-gain disaggregated before treating FY24-FY26 PAT growth as fully organic."
