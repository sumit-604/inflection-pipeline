analyst_note: "FY26 base is Rs 18,844.62 lakh. Accounting is clean on receivables and statutory disclosure, and moderate on governance. The 2.19x CFO/PAT figure carries a likely 77.84 lien-deposit build inside operating cash flow and 99.86 other borrowing cost deducted there; use FCF after capex 174.61 and net debt 6,790.30 on free cash. The 4 MW solar plant is the key unknown: depreciation steps up 131.83 to 247.18 a year and the commissioning date is not filed. HUF rent now sits below EBITDA under Ind AS 116 (about 24.00). Promoter-family cash take is 29.1% of pre-exceptional PBT and pay rose about 47% against median employee +7%. Facts 1, 2, 3: H1 FY27 parts and the Rs 100 Cr capex are not in the AR."
