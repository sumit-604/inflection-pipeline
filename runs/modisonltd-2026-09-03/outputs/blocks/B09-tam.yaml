analyst_note: "Two findings stage 11 should not rediscover from scratch. First, the SOM-implied revenue CAGR (9.2-9.5%) is roughly half management's implied CAGR (~17.6%) to hit Rs 1,360 Cr by FY30 - the gap is not explained by any disclosed capacity plan (FY26 capex Rs 15.10 Cr, non-capacity-led per B07), so treat the Rs 1,360 Cr target as needing either faster-than-normal share gains, price/mix tailwind from silver, or undisclosed capex, not as a market-size-validated number. Second, TAM/SAM figures here rest heavily on low-quality tertiary market-report vendors with internally inconsistent same-year global estimates spanning 1.7x; the peer-aggregation floor (Rs 2,060-2,100 Cr) is the most defensible number and happens to cross-check against management's own claimed 30-35% LV share, which is the main reason it anchors the conservative case."
