analyst_note: >
  This stage ran in a hybrid mode: one real transcript (Q1 FY27) plus a
  written pre/post-listing document set standing in for the missing
  cross-quarter chronology. The most load-bearing new finding is the Q1
  FY27 finished-goods inventory-build credit (Rs 932.66 Lakh against
  Rs 1,137.34 Lakh operating profit): it is the same mechanism B02 flagged
  at FY26 annual level, now visible one quarter into the post-listing
  record, and it is the best available answer to LBF1's "what produced the
  12%" question. The HT/MVCC 15%-vs-50% inconsistency is LBF4's most
  direct test point; downstream stages should treat ~50% as management's
  stated target (per the task brief) while carrying the ~15% figure as an
  open credibility flag. Capex and working-capital IPO-proceeds utilisation
  (Monitoring Agency Report) gave the cleanest, most independently-sourced
  delivery evidence available this quarter; it is real but early, and nowhere
  near sufficient by itself to lift the grade above the NO-CONCALL C default.
