analyst_note: "GOOD rests on a strong balance sheet (20/20) and solid median returns, but three depressors need attention. First, C1/C2/C4 anchor to FY2017 (PAT Rs3.81cr, thin post-demerger capital base), inflating long-run PAT CAGR to 35% and the C4 spread to 26pp; the FY2022-2026 window shows revenue CAGR ~11% and PAT CAGR ~15-16%, a more decision-relevant picture. Second, TTL received BOTH the air-charter business and TAAL Tech India (engineering) in the Oct-2014 demerger from Taneja Aerospace; no pre-FY2022 annual report in this corpus confirms when charter revenue dropped out of the consolidated series, so FY2017-2021 rows carry an unresolved comparability flag. Third, cash conversion is deteriorating, not just cumulatively adequate: CFO/PAT fell 0.84x to 0.33x in one year on a receivables and other-current-asset build, coinciding with the Q4FY26/Q1FY27 revenue acceleration (Rs45.79cr to Rs57.04cr to Rs64.81cr across three quarters) that filings do not explain. Growth is real and two-quarter-deep, not a single blip, but it is not yet cash-backed."
