analyst_note: "Loop 1 narrowed the positive claims without changing the verdict. Earnings are real in absolute terms (core PBT +313% YoY), but the margin held only before funding cost: after finance cost it fell 155 bps, and core PBT margin fell 70 bps. EPS clears Notion Bull only if H2 PAT margin stays above about 8.5% on the Rs 4,000 Cr path. Cash failed (H1 CFO -2.88x PAT). Inventory is the main drag, but the customer leg also absorbed Rs 286.20 Cr and credit charges rose 14.9x. I kept INDETERMINATE-WITH-DIRECTION because receivable days improved on both methods and the deciding evidence (31-Mar-2027 inventory, FY27 CFO) is unfiled; the adverse direction is firmer. The QIP bridge closes from the deck (767 + 403 + 30 = 1,200). The Rs 5.22 Cr H1 regroup likely reflects the Rs 5.64 Cr unrealised FX gain. The promoter no-sale test rests on Notion-memory 66.98%. The decisive input remains the operator's ruling on whether H1 fires thesis-broken #1."
