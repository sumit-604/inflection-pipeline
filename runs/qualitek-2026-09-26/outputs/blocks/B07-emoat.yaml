analyst_note: "The five genuinely evidenced emerging categories (A1 USFDA lab, B2 accreditations, C1 government order book, E1 geographic first-mover, H2 international network) describe a real but narrow accreditation-and-government-relationship moat forming inside a company whose execution record (F2) and cash conversion (G1/G2) actively work against it in the same period. This is not force-fit inflation: the completionist recount confirms 17 documented items concentrated in only 5 of 23 categories, matching the 3-6 category base rate. The operator should read this stage alongside B05's credibility grade C and B01's cash-deterioration flag before crediting the accreditation story: the moat and the balance-sheet strain are simultaneous facts about the same company, not competing hypotheses to average away."
