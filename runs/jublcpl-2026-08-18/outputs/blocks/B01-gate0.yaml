analyst_note: "Two things a downstream stage cannot see from the numeric fields alone. First, Block C's weakness is not noise: the FY24 trough (revenue -14.6%, PAT reconstructed at roughly half FY22-23 levels) is real and coincides with the JIL-JACPL merger scheme window, not just a restatement quirk - treat the 'strong recent growth' narrative in the two most recent years with that context attached. Second, E3 (pledge) is a genuine data gap, not a confirmed zero - no security disclosure anywhere in the reviewed notes points to promoter shares being pledged, which is reassuring circumstantially, but the pipeline rule against estimating means it scores 0 rather than 5, understating alignment if pledge is in fact nil. Classification GOOD+ is earned mechanically (Core 71, Moat STRONG, no deal-breakers) but rests on a genuinely high-ROCE, low-leverage business whose growth path is choppier than either the 2-year or the headline 5-year CAGR alone would suggest."
