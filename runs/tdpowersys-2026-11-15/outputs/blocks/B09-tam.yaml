analyst_note: "Market size does not bind this name; capacity and four OEM order books do. Only one sourced size fits the product scope: AR gas generator USD 5.9 bn 2026 (Rs 56,198 Cr), against FY26 revenue Rs 1,856.2 Cr (3.3%). SAM is NOT FOUND, so SOM is capacity-bound: Rs 3,200 Cr FY29, Rs 4,000 Cr FY31. The yr3 19.9% CAGR is mostly delivered by the FY27 guide (Rs 2,900-3,000 Cr); from the guide midpoint to Rs 3,200 Cr is 4.1% a year, so stage 11 should treat years 2 and 3 as capacity-limited unless a capex plan appears (Q2 FY27 transcript, about 19 Nov 2026, is the separating observation). INR22 billion capacity reading is refuted by the Rs 2,600 Cr guide on the same call. No B07 exists; capex came from B01/B03 and filings."
