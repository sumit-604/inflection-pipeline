analyst_note: "CAUTION could read CONCERN. The separating observations are a reconciled Darpan ledger (booking line of the Rs 97.60 lakh fee, board approval, market benchmark) and the NSE filing on the s.115BAB rectification order. The restatement deal-breaker is a depreciation recompute, not a revenue change. Sept 2025 sales at Rs 101 were not timed to a peak. Named tripwires for Role 2 Pillar 3: Darpan ledger reconciliation; s.115BAB order; CMD Rs 21.68 Cr loan terms and approvals; reasons for the 19 Jun 2025 independent exits and the CS exit; Darpan financials and case 4161/2015; Ayush Rebar Coating scope; any promoter sale or pledge after lock-in. Success catalogue pending (Rule I). Conservatism belongs in position size."
