  - {metric: "Standalone current borrowings", healthy: "stable, season-linked", red_flag: "continued double-digit YoY growth alongside core losses"}
unit_economics:
  unit: "1 Quintal (100kg) of bagged sugar"
  revenue_per_unit: "~Rs.3,868/Quintal (FY25, Note 40, AR p.114)"
  margin_per_unit: "negative before by-product credits — cane cost alone ~Rs.4,592/Quintal of sugar produced exceeds realisation (FY25, Note 41 and AR p.36; directional, not exact due to sold-vs-produced volume mismatch)"
  key_lever: "By-product credit stack (power, alcohol, bio-fertiliser, bagasse sales) plus sugar recovery % and cane cost per MT; currently insufficient to offset negative core Sugar unit economics"
