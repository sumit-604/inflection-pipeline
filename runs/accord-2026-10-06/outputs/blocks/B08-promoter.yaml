verdict_basis: "Clean legal record and zero pledge, offset by a recorded auditor resignation inside 3 years (successor at same address and email) and repeated disclosure looseness within 7 months of listing; no filed fact shows minority harm."
analyst_note: "The Tipco file is Accord's own board outcome with a wrong Subject line, corrected the same day; B00 and the step 1 brief call it a third-party document, which overstates it. Tipco shares no BRLM or registrar with Accord (Smart Horizon and Maashitla vs GYR and Kfin). Auditor and compliance consultant not found. SRIGEE (Srigee DLM) shares BRLM GYR with Accord, so a reused presentation template is the likely cause [INFERENCE]. Three tripwires can lift CAUTION to CONCERN: ADT-3 and ICAI records for the auditor switch; bank trail for the Rs 10.67 Cr land payment against the IPO utilisation statement; first ESOP grant price. Watch 2-Mar-2027 for the end of the one-year lock-in on free promoter shares (reading of ICDR, not verified). MD's DIN 2016-21 disqualification overlaps his stated 2019 start; MCA DIN history separates the two readings."
