analyst_note: "India Glycols scores AVERAGE on a consolidated group mid-dissolution. Two things drive the grade more than business quality: a 2-year-only balance-sheet window (source gap) capping A1/A2/A4/D-block precision, and total absence of promoter/pledge data zeroing three of four Block E tests by default. Underlying signal once gaps are stripped out: low-teens ROCE (11.85-12.08%) improving marginally, strong 10-year cash conversion (CFO/PAT 2.06x) but two years of heavy capex-driven negative FCF tied to a Bio-MEG/EO buildout, and a sub-1x current ratio worth watching independent of the demerger. Revenue growth is unremarkable (5.97% CAGR, 3 of 9 years down); PAT growth (26.6%) is flattered by a depressed FY17 base and a FY22 other-income outlier. Zero moats scored >=3, mostly for lack of peer data, not demonstrated absence. Controlling fact for every later stage: this history ends 1 Sep 2026, and three separately listed entities inherit pieces of it on different earnings bases."
