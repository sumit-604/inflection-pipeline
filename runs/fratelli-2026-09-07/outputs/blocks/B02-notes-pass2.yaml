analyst_note: "Four priorities resolved. (1) Directors' Report FY25 comparator is provably wrong on three independent checks; the headline '1.59% growth' claim is not like-for-like, true consolidated revenue fell 40.0% YoY. (2) Bad-debt reconciliation: Rs 250.77 lakh absorbed existing provision, Rs 483.09 lakh was a fresh un-provisioned charge. (3) Warrant forfeiture is 65.1%, not 39.5% as injected; named related parties converted in full, unnamed allottees lapsed. (4) Going-concern notes omit the Rs 114.50 cr guarantee entirely against near-zero cash at both standalone and consolidated levels. New: a Rs 663.03 lakh Section 270 misreporting penalty (not previously named) and a bearer-plants pre-op cost note Pass 1 missed."
