industry_cross_read:
  demand: "All three peers describe FY26 NHAI/MoRTH awarding as muted/subdued (3,100km FY26, -22% YoY, below 7,500km target; still only 107km Q1 FY27), attributed to land acquisition/cabinet-approval delay, not demand weakness. HGINFRA itself missed its own FY26 order-inflow guide by 87% (guided ~Rs10,000cr, secured ~Rs1,300cr, disclosed unprompted, HGINFRA-Concall_May_2026_Transcript.txt p.6) in the same year Ceigall beat its own guide 2.3x (Rs11,332cr vs Rs5,000cr guided, per B05) - not proof of a problem at Ceigall, but it raises the bar for what that beat needs to explain (state/non-NHAI wins, T&D/renewables LOAs, or genuine share gain)."
  pricing_inputs: "All three peers explicitly name West Asia geopolitical conflict as driver of elevated crude/bitumen/logistics costs FY26-Q1FY27; KNRCON notes MoRTH shortened the price-adjustment pass-through cycle 3mo to 1mo in response; this likely resolves Ceigall's unnamed 'war situation' reference. However, all three peers describe the resulting MoRTH relief mechanism as partial and temporary (3-month window, 'some relief... to certain extent'), directly contradicting Ceigall's May-2026 claim of full compensation."
  capex_cycle: "Industry-wide capacity/diversification race, not a lone-expander situation: all three peers (HGINFRA, KNRCON, PNCINFRA) are simultaneously entering solar/BESS/transmission/metro/mining/water in the same period, consistent with Ceigall's renewables/T&D push. PNCINFRA separately warns diversification will structurally pressure roads-segment margin, a caution Ceigall's own calls do not offer about its own ramp."
