one_line_verdict: "A thin-margin, working-capital-heavy tender reseller on a real policy tailwind, whose profit growth came from cost dilution that is nearly spent while gross margin fell 10 points and buyers behind 82.7% of growth stay unnamed."
analyst_note: "Three things a later stage cannot rebuild from the fields. One: the margin physics. Opex fell from 19.5% to 9.1% of revenue while gross margin fell 37.3% to 27.1%, so EBITDA margin sat flat at 18.0%. Any forward margin that assumes more opex dilution has little room; key the Section 1B margin bridge to gross margin. Two readings for the fall: mix shift to resale cyber and DNA, or price cutting for volume. Separator: segment or dealer-route gross margin. Three: deck PBT 1,921.45 is a deck error; its own P&L totals 1,821.44, matching the prospectus. Sector cap: supports Cybersecurity / VAD 25x, not Defence 38x. Rental 925.41 equals one customer (Government of Bihar), and Bihar total is 953.22, so Bihar is almost entirely rental [INFERENCE]. Cyber revenue 3,522.83 vs Top Supplier 1 purchases 3,268.40 is a pass-through hypothesis, unconfirmed."
