industry_cross_read:
  demand: "Consensus strong: Solar defence revenue +94% FY26 and order book Rs 20,178 Cr (Nov 2026); Astra order book Rs 4,300 Cr after a Rs 2,205 Cr HAL order; both say order backlog is not the constraint, execution is. Split on pace: Solar +69% YoY Q2 FY27, Astra guides only 15-20%."
  pricing_inputs: "Solar confirms commodity and ammonium nitrate price rises in FY27 but holds 28-29% EBITDA through rise-and-fall clauses (about 60% of rise) and inventory; Astra holds 45-55% gross margin on build-to-spec. Premier's 9-10% core margin does not match either peer's margin outcome."
  capex_cycle: "Capacity race among scaled peers, not a lone expander: Solar Rs 2,050 Cr FY27 capex (Rs 2,700 Cr over two years) and a new 155 mm and medium-calibre line; Astra Rs 40-50 Cr a year plus a new building. Premier's Rs 60 Cr Katepally is small beside Solar's and slipped on the same build-to-qualification gap Solar shows on 155 mm."
