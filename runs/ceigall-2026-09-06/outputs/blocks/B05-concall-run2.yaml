flags:
  - {type: FLAG-CONCALL-SILENCE, reason: "Total silence across all four calls on the Rs89.65m procurement fraud, the qualified IFC opinion (both levels), the NHAI SPV termination, the sister-SPV auditor resignation, the leadership churn, and the 83.7%-of-net-worth contingent liability growth; no analyst asked any of these across four consecutive quarters."}
  - {type: FLAG-DISCLOSURE-DECAY, reason: "Consolidated debt disclosure (full breakdown -> aggregate only -> ratio only -> none) and consolidated EBITDA/PAT disclosure (given -> given -> given -> dropped) both progressively degraded across the four calls, reaching zero disclosure of either in the most recent (Aug-2026) call, the same call the company discloses 100% IPO-proceeds utilisation and royalty cessation as an aside and continues to assert cash flow is not a constraint."}
  - {type: FLAG-CASHFLOW-NARRATIVE, reason: "Management repeatedly asserts 'cash flow will not be a challenge' / 'equity is not a problem' (May-2026 call) while B03's audited figures show consolidated CFO negative in both FY25 (Rs-515.6cr) and FY26 (Rs-91.3cr); never reconciled by management or raised by any analyst. Cash/FDR was also separately overstated by ~71% via a written erratum, and liquidity is disclosed on 3 non-comparable bases across 3 consecutive quarters."}
  - {type: FLAG-RECONCILIATION, reason: "Cross-call numeric reconciliation pass found: order-book roll-forward does not close in any of 3 testable quarters on a consolidated basis (avg +Rs433cr/quarter) AND independently on a standalone-revenue basis (+Rs264cr/+Rs539cr/+Rs315cr); renewable order inflow vs closing renewable order book gap ~Rs443cr given near-zero renewable execution; Aug-2026 per-project HAM equity list sums to Rs567cr vs stated Rs550cr total; same call states both 10 and 11 HAM projects; FY27 order-inflow guidance restated three times (~Rs5,800cr/Rs5,500cr/Rs6,000cr) unacknowledged; a Nov-2025 bid-pipeline total does not sum to its own components; a Nov-2025 Ramban-Banihal exchange does not cohere internally."}
  - {type: FLAG-REPEATED-EVASION, reason: "NEW this run. Mahesh Patil (ICICI Securities) asked in two consecutive quarterly calls (May-2026, Aug-2026) whether the margin beat was a one-off; both times answered with an unrelated list of newly started projects, never a yes or a no. Valuation-relevant: bears directly on whether the FY26/Q1 FY27 margin can be treated as a sustainable base."}
  - {type: FLAG-FUNDING-CAPACITY, reason: "NEW this run. Management discloses, as an aside inside an other-income answer (Aug-2026 call), that IPO proceeds are 100% utilised and royalty income has ceased, one quarter before committing to an Rs859cr FY27 equity plan, at the same call consolidated debt/cash-flow disclosure went dark."}
  - {type: FLAG-MISSTATEMENT, reason: "NEW this run. Feb-2026 call claim 'we were always guiding 10% to 15%, our growth is much more than that' is a clean, quantifiable false statement against the SAME call's own 9M FY26 growth figures (7.6% standalone, 8.7% consolidated), both below the low end of the claimed range."}
