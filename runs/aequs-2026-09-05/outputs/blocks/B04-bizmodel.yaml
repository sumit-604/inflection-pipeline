one_line_verdict: "Profitable aerospace engine funding an unproven, capital-heavy consumer bet."
analyst_note: "Two AR tables (p.46 Financial Overview/Key Financial Ratios and p.292-294 Note 36 segment note) double-verify the prior-stage FY26 segment PBT figures (Aerospace Rs 173.98 cr, Consumer -Rs 217.92 cr) to the rupee. But three company-memory load-bearing facts could not be confirmed in this run's corpus: the specific FY27 aerospace guidance framing (+25-30% revenue, >20% margin, ~20% manufacturing ROCE - only the FY31 Vision target and two breakeven milestones exist in the documents), the ~Rs 500/660 cr FY27 capex split, and the 15-year/FY28-delivery Safran wheel terms. Treat all three as unverified until a concall transcript or Reg 30 filing is added to the corpus. The AR p.14 Key Financial Highlights chart's FY24 figures are also not reliably extractable this run due to PDF text-order corruption and the absence of an image-render tool in this session; FY25/FY26 figures were instead sourced from the clean p.46 tables, which do not carry FY24 data."
