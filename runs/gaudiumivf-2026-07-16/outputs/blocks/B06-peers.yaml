industry_cross_read:
  demand: "HCG reports structurally rising oncology demand (13-14% category growth); Rainbow reports 3 consecutive soft pediatric-seasonal quarters (framed as temporary); Kaya's growth trails its own cited industry rate for years. No peer operates IVF at comparable scale to directly read through to Gaudium's demand narrative."
  pricing_inputs: "All three peers actively manage payor-mix and input-cost pressure (HCG oncology-mix dilution, Rainbow insurer renegotiation, Kaya consumable-cost inflation); general sector theme, not direct evidence on Gaudium's own margin story."
  capex_cycle: "Industry-wide capacity-expansion picture, not a lone-expander situation: HCG (~1,000 beds through FY30), Rainbow (900-bed pipeline, highest-ever annual bed addition in FY26), Kaya (resuming clinic openings after a multi-year pause). Gaudium's claimed acceleration RATE remains an outlier vs any single peer's disclosed pace, and peers that do accelerate (Rainbow) disclose 9-12 month execution delays as routine."
