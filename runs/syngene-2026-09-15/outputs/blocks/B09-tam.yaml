analyst_note: "FX conversions use Rs96/USD (spot ~Sep-2026), an analyst assumption applied consistently, not a sourced historical rate for every underlying report's publication date -- ratios (SAM/TAM %, headroom, CAGRs) are FX-invariant and more reliable than the absolute Rs-cr figures. The SOM funnel and the capacity check (3C) both independently point the same direction: the 18% SOM-implied CAGR requires the CDMO-refill proof gate to fire (named non-Zoetis customer, per B07's optionality register) and requires capex beyond what B07's 34.5% figure captures. Absent that proof, the more evidenced path is management's own guided trajectory (FY27 decline, then recovery), not the SOM ceiling computed here. This is the formal handoff Stage 11 should treat as a ceiling, not a base case, pending Halt 1 resolution of the proof gate."
