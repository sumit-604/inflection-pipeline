credibility_basis: "Real, verifiable delivery on FY26 revenue guidance (hit exactly), capacity commissioning (Rs150 Cr capex and casting debottleneck both on schedule), and volume guidance raised mid-year on genuine outperformance; set against a materially missed central promise (inventory/net-debt normalisation via BIS Korea/Japan deals, the most repeated theme across all three calls, quietly reset rather than owned as a miss), an EBITDA margin band undershot twice, PAT guidance withheld on two direct requests, and an unreconciled 33%-to-25% tax-rate reversal."
