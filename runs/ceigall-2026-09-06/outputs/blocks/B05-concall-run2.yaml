supersedes: "B05-concall run 2 (2026-09-06). Run 2 raised red-flag coverage from 48% to 70% and its findings stand. A second independent audit named specific residual gaps plus one arithmetic error; run 3 is a targeted patch closing those, not a rebuild. Fixed: (1) the cash/FDR overstatement is corrected back to ~71% (Rs171cr/Rs241cr=70.95%); run 2's 41.5% answered a different question (restatement-down % against the pre-correction figure) and its 'conflates an absolute rupee change with a percentage' diagnosis was itself wrong. (2) A missed critical repeated evasion added: Mahesh Patil asked twice (May-26, Aug-26) whether the margin beat was a one-off; both times deflected with an unrelated project list. (3) Missed guidance items added and tested: FY27 renewables at 20-25% of revenue (zero delivered one quarter in) and Q1 FY27 standalone growth of 10.2% against a reaffirmed 'minimum 15%' guide. (4) Missed disclosures added: 100% IPO-proceeds utilisation + royalty cessation disclosed as an aside; cash disclosed on 3 non-comparable bases across 3 quarters (Rs320cr FD figure was absent from run 2); an unexplained dilution comment and an uncorrected 'post-QIP' analyst premise; a demonstrably false 'growing much more than 10-15%' claim against the same call's own 9M growth prints. (5) Two items re-weighed: Northern Ayodhya's deny-then-concede answer (was 'plausible and seasonal, not disputed'); the escalation-cost 'fully compensated' claim, now contradicted by peer transcript evidence and Stage 6 (B06-peers.yaml). (6) Minor items added: a bid-pipeline total that does not sum to its own components; a 10x typo left uncorrected; an incoherent Ramban-Banihal exchange; an uncorrected analyst order-book figure; an unrevisited schedule claim next to a stalled project. (7) ~30 further carried-forward page citations corrected to the PDF's own [PAGE N] marker (run 2 had mixed marker and printed-header conventions, which run one page apart in all four files); substance unchanged in every case, only the page number moves."
