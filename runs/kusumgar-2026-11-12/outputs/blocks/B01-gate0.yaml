analyst_note: "Block B scores 0 on every line, and it carries the call. FY24 CFO of 200.96 Cr was fed by a 1,265.54 INR m rise in other liabilities; FY25 reversed it (other financial liabilities -1,260.89 INR m, other liabilities -1,211.02 INR m, prospectus p.78). So FY24 ROCE of 55.87% and its CFO are the odd year, and the A4 zero (ROCE down 31pp) compares FY26 against that odd year. FY26 receivables rose 1,616.28 INR m on a revenue fall of 11%, so FY26 CFO of 282.58 INR m is after a receivable build, not a weak operating profit (operating profit before working capital 2,077.50 INR m). H1 FY27 CFO 340.73 INR m with receivables down 194.29 INR m (Q2 FY27 results p.6) is the first evidence of collection. The AVOID label stacks a LIMITED-history downgrade on an AVERAGE; the pre-downgrade AVERAGE is the cleaner reading. Capacity utilisation is 42-50% after capacity doubled, the operating-leverage observation for later stages."
