  - "What is driving the +92.2% YoY growth in the fertilizer subsidy receivable, what is the government's expected release timeline, and why has the >6-month-overdue ageing bucket nearly tripled?"
  - "What specifically caused 'Discounts, claims to customers and other selling expenses' to more than triple YoY (+216.5%)?"
