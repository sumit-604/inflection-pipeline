  - {metric: "Consolidated CFO/PAT ratio", threshold: "below 0.7 for a second consecutive year would upgrade this from a one-year inflection to a chronic pattern", where: "FY27 Annual Report consolidated Cash Flow Statement; screener Data_Sheet.csv update", why: "FY26 (61.0%) is the first sub-100% reading in four years; one more weak year changes the interpretation materially"}
  - {metric: "Menon Alkop Ltd Reserves & Surplus (AOC-1)", threshold: "continued or widening negative reserves against the parent's unimpaired Rs2,823.50L carrying cost strengthens the case for an Ind AS 36 impairment test/write-down", where: "FY27 Annual Report AOC-1 (Board's Report Annexure I)", why: "tests whether the newly-separated subsidiary is on a path to standalone solvency or needs continued parent guarantee/equity support"}
  - {metric: "Whether a formal Contingent Liabilities table is added covering the Rs29cr Menon Alkop guarantee", threshold: "presence of a dedicated Ind AS 37 table in the FY27 Notes would resolve the single clearest disclosure-format gap in this AR", where: "FY27 Annual Report Notes (standalone and consolidated)", why: "tests whether management responds to a disclosure gap once it is directly questioned (per B02's management-questions list)"}
  - {metric: "Terms of the Menon Brakes advance (Rs457.22L, +44.9% YoY)", threshold: "any disclosed interest rate/tenor, or continued balance growth without disclosed terms", where: "FY27 Annual Report Note 8/16", why: "currently an undisclosed-terms, growing intercompany funding item flagged by both B02 and this stage"}
  - {metric: "CRISIL surveillance action referencing final FY26 audited financials", threshold: "any rating action or explicit confirmation CRISIL has reviewed the audited Note 31 print", where: "CRISIL website / next rating rationale", why: "the 23 April 2026 reaffirmation predates board adoption (14 May 2026) by ~3 weeks and rests on FY25/estimated data (Phase 2, Finding #7)"}
  - {metric: "MD/CFO/Company Secretary continuity (no further KMP turnover)", threshold: "any additional KMP change within 12 months of the 4 March 2026 transition would compound the continuity-risk flag", where: "stock exchange filings; FY27 Annual Report Board's Report", why: "reporting continuity through a close is a real, if low-probability, risk after a simultaneous MD+CFO change"}
strengths_top3:
  - "Clean, unqualified standalone and consolidated audit opinions with no fraud, no going-concern trigger, and no borrowing default even one day (Independent Auditor's Reports, AR pp.90-92,128-130; CARO Annexure A, AR pp.94-96)"
  - "Operationally/margin-driven, non-leveraged earnings improvement: consolidated Revenue +22.8% to Rs293.81cr, PAT +53.4% to Rs38.25cr, D/E flat-to-down at 0.25x, DuPont-confirmed ROE ~20-22% (screener Data_Sheet.csv; Board's Report Item 13, AR p.60)"
  - "Conservative, non-extractive capital allocation through a leadership transition: flat Rs2/share dividend despite 53-64% PAT growth, fully-spent CSR (Nil unspent), aggregate managerial remuneration down 15.22% YoY, stable unchanged promoter holding of 68.44% with no detected selling (Board's Report Annexures II/V, AR pp.42-43,49-50; Note 9, AR p.115)"
red_flags_top3:
  - "Standalone receivables +72.1% vs revenue +28.5%, >6-month ageing 6.8%->22.2%, DSO 85->114 days, standalone cash conversion 35.3%, standalone cash down 69.7%, with a static ECL allowance and consolidated CFO/PAT falling to 61.0% (first sub-100% reading in four years) (Note 6/31, AR pp.114,126-127; Standalone Cash Flow Statement, AR pp.98-99; screener Data_Sheet.csv)"
  - "Rs29cr corporate guarantee to Menon Alkop Ltd (4.7x that subsidiary's own negative-reserves-implied net worth of Rs6.18cr) sits entirely outside any Contingent Liabilities table in standalone or consolidated Notes (CARO Annexure A, AR pp.94-95; AOC-1, AR pp.39-40)"
  - "Zero company-specific risk factors disclosed anywhere in 167 pages of boilerplate risk sections, while the Chairman's letter omits every material negative item this report found and contains an unreconciled EBITDA-margin claim (25.31% stated vs 22.19% computed) (MD&A section 8, AR p.58; Board's Report, AR p.28; Chairman's letter, AR p.3)"
best_fit_strategy: "Capex-Led Growth (primary fit, PASS); GARP secondary (WATCHLIST, capped by accounting-quality and disclosure gaps)"
one_line_verdict: "Capacity driven growth is real and margin accretive; standalone cash conversion and guarantee disclosure gaps need direct answers before this qualifies as clean GARP."
