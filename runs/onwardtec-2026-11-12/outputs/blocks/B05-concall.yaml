analyst_note: "Three things a downstream stage cannot rebuild from the fields. (1) Q2 margin: 15.6% reported, 13.9% ex the Rs 2.93 Cr credit (R2 note, PRES p.9), against 14.3% in Q2 FY26. Sequential gain ex-credit is real (12.3% to 13.9%, employee cost ratio 73.2% to 71.1%). Year-on-year gain is the credit. Offshore share fell to 69% from 72%, so the offshore explanation is unsupported. (2) Guidance basis is unstated. Revenue guide implies H2 flat to 4% below H1; margin guide needs H2 at 13.5-14.6% if the credit counts, 14.5-15.5% if not. Separator: Q3 FY27 note and Jigar's answer. (3) Cash: H1 CFO 1,844.79 vs 3,502.46 lakhs, DSO 80, unbilled up, and neither call raised CFO. B grade rests on headline delivery; misses are operating timelines."
