analyst_note: "Grade C reflects promise-delivery, not results quality: PAT and margins beat, operational promises and guidance did not. The H1 FY27 CFO turn of +351.24 Cr is mostly payables (+281.90) and other current liabilities (+192.83); management itself called 45 NWC days unsustainable (normal 52-55). Untested hypothesis for forensic stages: the OCL jump and the 154.85 Cr fall in current borrowings may reflect advances or reclassification of the 171 Cr vendor finance. BSNL funding is the largest unasked question. Stage 6: CPPLUS tests brand margins, STQC and project terms; REDINGTON/RPTECH test component costs, working-capital stretch, festive timing."
