credibility_grade: "D"
credibility_basis: "REGRADED from C to D on this rework run (item 11). NO-CONCALL MODE permits grading below the C default on evidence. Five independently-sourced, repeated instances of unacknowledged inconsistency, confirmed this run: (1) the revenue-from-operations mislabel recurs in the FY26 Board's Report itself, not merely a deck typo later fixed; (2) FY25 CFO is presented on two incompatible bases across three decks with no note, the difference being the undisclosed working-capital-facilities addback already flagged at the AR level by B02/B03; (3) interim figures do not reconcile (9M PBT gap, near-zero Q4 D&A) and the consolidation basis is described two different ways across two consecutive results filings, underpinning a consolidated margin-expansion claim that runs opposite to the standalone-basis result over the same period; (4) Claim Income (19.9%-38.4% of PBT) is never named against a headline 'PBT doubled' claim; (5) the registration-pipeline narrative and the 'stable product mix' claim are each directly contradicted by the company's own data, repeated without correction across the AR and multiple decks. Against this: one genuine, unprompted candour instance (subsidiary utilisation 'modest', AR p17) and clean refiling arithmetic (no substantive figure changed, though BSE flagged the same defect twice). These two positives do not offset the five items above inside a single twelve-month window of investor communication from the same management."
