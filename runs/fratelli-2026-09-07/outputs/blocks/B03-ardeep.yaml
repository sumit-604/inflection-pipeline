strengths_top3:
  - "Verified 78.1% gross margin and a specific, checkable early-traction story for the Shotgun RTD platform (~Rs 18cr revenue, ~9,000 outlets in its debut year)."
  - "No promoter selling, no promoter pledge; the MD is a net lender to the Company at a market-adjacent ~10% rate, genuine skin in the game."
  - "The audited notes themselves are internally consistent (contingent liabilities, DTA components, share capital roll-forward, Note 30 cost structure all tie out), distinct from the unreliable narrative wrapped around them."
red_flags_top3:
  - "The AR's own narrative/summary layers fail to reconcile to its own audited figures in at least five places (Directors' Report revenue, cash, auditor fees, KMP remuneration; MD&A EBITDA ratio table)."
  - "Negative EBITDA and negative interest coverage in a second consecutive loss year, funded by a Rs 114.50cr related-party guarantee from a near-zero-cash shell parent, against a going-concern note that never names or stress-tests that guarantee."
  - "Cash-conversion quality is poor: FY26's positive CFO was manufactured from a near-doubling of rebate/payables accruals, not profitability, and Rs 483.09 lakh of bad debt was written off with zero prior ECL provisioning."
best_fit_strategy: "Turnaround (WATCHLIST) -- proof gate not yet fired on FY26 evidence"
one_line_verdict: "Turnaround-shaped brand story sits on an Annual Report whose own numbers contradict its own narrative in five separate places."
analyst_note: "The single highest-value finding this stage adds beyond Stage 2 is structural, not incremental: the AR's disclosure LAYER (Directors' Report, MD&A ratio table, Chairman's letter) systematically fails to reconcile to its own audited notes, and every failure direction makes the year look better than the audited numbers show (stale FY25 figures relabelled as FY26; a positive EBITDA ratio where the audited P&L computes negative; a zero remuneration figure where the RPT note shows real payments). The underlying audited notes remain sound. Downstream stages (FTTCP, Role 1) should treat every AR narrative or summary-table number as unverified until traced to its primary note, and should use this stage's recomputed EBITDA (-2.5% margin FY26, not the AR's claimed +0.57%) rather than the AR's own ratio table."
