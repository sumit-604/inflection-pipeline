verdict_basis: "Danya structure (BB-/A4+ firm, 10% held by MD and WTD, SPEL guarantee Rs 14.70 Cr, Rs 125 Cr FY27 authority, no external price test, retrospective s.185 ask) plus an audit chair who guarantees company debt; offset by nil pledge, flat pay, promoter guarantees and no regulator action. STRUCTURE concern, not INTEGRITY."
analyst_note: "Rule G ledger: BUILT (9,000 MVA / 220 kV Kannur plant, order book Rs 588.17 Cr), RAISED (IPO Rs 46.67 Cr, warrants Rs 21.07 Cr, MD Rs 7.60 Cr of it) and DEPLOYED (capex Rs 57.5 Cr) are evidenced; DELIVERED is partial (guidance missed twice). OR-14 reading: STRUCTURE concern, no AVOID, so ledger can feed sizing with tripwires: Danya guarantee above 14.70, Danya trade above 50.2, deed and price benchmark not given, s.185 date, audit-chair guarantee, MD loan terms, pledge or sale before Feb-2027 warrants, second director exit. Two readings: A convenience channel for state tenders; B value-shifting vehicle. Separator: Danya deed plus third-party price benchmark. Danya profit slice to promoters is only about Rs 0.235 Cr (1.2% of SPEL PAT), so the main exposure is the guarantee and loop, not the slice."
