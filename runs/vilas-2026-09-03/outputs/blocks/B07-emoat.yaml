analyst_note: "em_score of 11 reflects a strict application of the evidence-quality discount: almost every forward claim in this name is 🎙️ concall guidance, and that guidance has a demonstrated 2-9 month slippage pattern across PGCIL, radiator, and copper timelines within a single year of calls. The two 📄-documented facts that do hold up (Unit 3 commissioned on schedule 25-Jul-2025; FY25 above-nameplate production) support F2 but do not by themselves establish a moat under this scan's definitions, since capacity build is growth, not moat. G1/G2 show active deterioration (cash down, ST debt up, WC days up, ICRA outlook cut Positive->Stable) coincident with the ramp, cross-referenced to B01 and not double-counted here. I1/I2 both score 0 on clean tests: no competitor-pay-scale argument exists for I1, and TRIL's own backward integration into CRGO lamination while remaining a VILAS customer directly answers I2's 'what must be destroyed' question with 'nothing.'"
