analyst_note: "FLAG-PROMOTER-PRELIM from B03 is resolved. The 28,85,267 net share sale is 31,67,702 sold on 2025-06-06 (exact match of 3,83,30,255 less 3,51,62,553 filed at 30-Jun-2025) less 2,82,435 added later (mode NOT FOUND). The pledge question is closed: nil at Sep 2026; June 2025 showed only an NDU on the son's 2,97,300 shares, which moved to Jyoti Chopdar. B03 listed the aero engines head as an exit; the AR says he died on 2026-02-14. Memory's SEBI PIT matter was not evidenced anywhere; I read the Whalesbook penalty snippet as the March 2026 GST order. Promoter lock-in of 1,18,27,600 shares ends about Dec 2026: the sale test that matters comes after that date. Verdict CAUTION is a texture call on soft items, with no integrity evidence."
