analyst_note: "Two compressed findings: (1) FY26 EBITDA-margin improvement (11.09%->12.50%) traces mostly to a smaller WIP-inventory-change P&L swing (Note 21: Rs 33.26 Cr FY25 vs Rs 6.04 Cr FY26), not a cost/pricing advantage; gross margin fell. Treat the margin story as unproven until the WIP base effect laps. (2) AGM approves RPT ceilings for Nexus (26%) and UVT (49%) totalling Rs 550 Cr vs Rs 514 Cr revenue - not in FY26 actuals (Note 33 lists neither) but a structural watch on how much forward growth is third-party. The two Substack PDFs in the presentation folder were excluded from all anchors; worth a targeted claude.ai check at Halt 1."
