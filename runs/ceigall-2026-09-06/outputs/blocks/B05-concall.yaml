orchestrator_note: "Run 2 corrected a figure the VERIFIER supplied. Verifier B (run 1) described the May-2026 filed-transcript erratum as a ~71% overstatement of unencumbered cash and FDR; run 1 of this stage had reported the same. Stage 5 run 2 recomputed it independently at ~41.5% combined and states the 71% appears to conflate an absolute rupee change with a percentage. The stage nonetheless RAISED the severity from MEDIUM to HIGH on magnitude and context. The corrected figure governs downstream."
