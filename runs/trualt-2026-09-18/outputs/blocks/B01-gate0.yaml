analyst_note: "Growth (Block C, 16/20) and shareholder alignment ex-pledge (Block E, 13/20: 70.55% promoter holding,
  zero contingent liabilities) are real and filed. Peer verification (this correction) confirms the moat read is
  real too: TRUALT runs the highest EBITDA margin and the highest gross-margin proxy of the four-company set,
  moving moat class from THIN to MODERATE (3 of 12 tests, grand total 61/160). None of this changes the binding
  constraint. Block D still forces the floor: net debt ran to 5.20x a FY26 EBITDA that itself fell (EBITDA base
  shrank because revenue fell 9.4% FY25 to FY26 while inventory absorbed cash), and interest coverage at 1.81x
  leaves little room before covenant stress. This coincides exactly with SPEAR fact 2 (FY26 CFO -Rs296cr in the
  year of the fresh issue) and fact 3 (36.85% pledge) already flagged at Stage 0. Treat the AVOID classification
  as the framework's numeric read of FY26 leverage against a genuinely strong margin business, not a verdict on
  the multi-feed transition thesis itself, which stages 2+ still need to test to depth."
