one_line_verdict: "State-linked energetics maker with a 4x defence order book it has not yet converted, thin operating margin, and a segment result that is not filed."
analyst_note: "Sector-cap evidence for stage 0: revenue and order book both lean Defence (81% to 86% revenue, 95% to 96% book), but the separating observation, segment result, is NOT FOUND in the AR, Q2 results filing or presentation (single Ind AS 108 segment). Do not infer segment margin from mix. Commercial Explosives book cover is about 0.45x revenue (derived from rounded percentages), so it is book-and-ship; Defence cover about 4.7x. The O&M services line (9.3% of FY26 revenue) sits inside Defence & Space, so 'Defence' includes a fee business. The 72% defence-products figure is 81% minus 9.3% rounded, derived. Q2 FY27 profit recovered on revenue but material cost rose to 65.1% of revenue, which needs the concall."
