analyst_note: "The three passes together show one connected story, not three separate flags: the consolidated flat-to-growing headline (PBT about flat, PAT +7.65%) is built entirely from (a) a US-subsidiary mix shift (Note 35) and (b) three unlabelled non-recurring P&L items (Altek FV gain, inventory-build credit, ESOP reversal) that together exceed the entire YoY PBT change. Strip all three out and the India core business is shrinking on revenue (-29.9%), profit (-26.6%) and cash conversion (Gate 0 -Rs25.07cr cumulative CFO), with working capital financing part of the gap. Stage 11 should not treat consolidated PAT or PBT growth as evidence of an operating transition; any re-rating case must rest on standalone and India-core metrics, and any consolidated-growth narrative from management or sell-side should be discounted to the extent it leans on these three items or on Altek, which the notes show is itself underperforming its own acquisition case."
