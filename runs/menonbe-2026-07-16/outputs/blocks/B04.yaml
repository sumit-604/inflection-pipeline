moats_present:
  - {moat: "Switching costs (OEM approval cycles, sole/major-supplier status)", durability: "medium-high"}
  - {moat: "Cost advantage (in-house tooling/machine-building, alloy powder/strip manufacturing)", durability: "medium-high"}
  - {moat: "Regulatory compliance capability (lead-free alloys, BS-VI readiness)", durability: "medium"}
