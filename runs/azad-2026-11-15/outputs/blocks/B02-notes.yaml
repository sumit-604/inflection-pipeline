analyst_note: "The notes are silent exactly where the cash question lives: no working-capital-day definition, no composition of the 1,102.51 government balance, no ECL rates, no factoring or recourse wording, no hedge detail, no covenant terms. Silence is not evidence of factoring and not evidence of its absence. The negative OCF is a parent figure (standalone (1,232.63)); subsidiaries add about 43. A possible 155 to 178 of QIP issue costs may sit in OCF [INFERENCE]; adding them back leaves OCF negative. Top-1 at 18.6% is under the 20% tripwire but rose 4.4 points. All figures INR million as printed; nothing converted."
