  demand: "No peer reports a demand boom: parent says US/Europe coatings subdued and plastics hand to mouth, MOL says reasonably healthy but pigment utilisation 39-51%, ASAHISONG says demand not back; recovery is destocking end, restock and price, industry growth 3-4%."
  pricing_inputs: "All three cite a war-driven jump in petrochemical, energy, sulphur and freight costs from Mar 2026; pigment makers passed it through (ASAHISONG Blue +about 20%, MOL pigment margin 3.3% to 12.1%/10%), so peer gross margins held or rose while SUDARCOLOR's fell."
  capex_cycle: "Capacity hold, not a race: parent needs no volume capex, MOL runs pigment at 39-51% with no capex, ASAHISONG plans Rs 10-15 Cr Azo capex only above 75-85% utilisation; SUDARCOLOR is not a lone expander (capex 25.34 vs depreciation 16.51 in FY26 per B05)."
