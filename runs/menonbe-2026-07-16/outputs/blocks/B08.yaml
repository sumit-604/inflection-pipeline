verdict_basis: "CXO/board transition risk is decisive: simultaneous MD (fresh 70-year-old appointee, 5-year term) and CFO change four weeks pre-year-end, with the new CFO's career rooted entirely in the Chairman's own private RPT counterparty (Mani Auto Components) rather than an external professional hire, combined with an unresolved pledge-disclosure gap and an undisclosed 1.74pp promoter-holding step-down (Sep-2024) -- against a clean SEBI/criminal record, conservative capital allocation, and one genuinely credentialed new independent director (Borgalkar), holds the verdict at CAUTION: real governance-quality watch items, but no confirmed deal-breaker or proven extraction."
