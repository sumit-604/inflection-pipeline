analyst_note: "Correction to load-bearing fact 4: the warrant issue is the FY24 issue (2,17,18,023 at Rs 114, Rs 247.59 Cr), fully converted by 24 May 2025. Nothing is live. Promoter count is unchanged at 2,14,30,945 in FY25 and FY26. Rs 31.59 Cr was a loan swap; the lender is unnamed. [INFERENCE] If the lender is a group-influenced entity classed as public (Janta Travels, the trusts), group economic stake is understated. Check the Nov 2023 Annexure I. BCMA matter: SEBI AO order exists (22 Dec 2015). SAT on 28 May 2018 (Appeals 128 and 130 of 2016, WIL itself an appellant) quashed the impugned decisions on a legal reading; the SAT text I read does not name BCMA, so the tie rests on the SEBI page links. AR says Supreme Court pending; no case record found. Weight: low."
