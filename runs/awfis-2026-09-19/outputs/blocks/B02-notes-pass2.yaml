receivables_trend_update: >
  Pass 1's read stands (broadly stable to modestly improving on ageing mix, structurally distorted by
  the Design & Build carve-out) but is now incomplete without two new facts: top-10 customer
  concentration rose from 42.74% to 61.66% of total receivables (finding 3), and the previously
  zero-risk unbilled/current-not-due bucket now carries a 17.32% ECL rate versus 0.00% prior year
  (finding 4). Fuller read: the receivables book is smaller, its ageing mix looks better, but it is
  more concentrated in fewer customer relationships and carries a new pocket of expected loss that
  did not exist a year ago.
analyst_note: >
  Two items matter most from this pass. First, the flat total diluted EPS (Rs9.34 both years) is an
  optics trap that a surface read of the P&L would get wrong: it is entirely explained by the FY25
  one-off exceptional gain lapsing, and continuing-operations PAT actually grew 20.5%. Downstream
  stages building growth narratives should use the continuing-operations figures, not the flat
  headline. Second, the auditor's named exception on database-level audit-trail assurance (Note 45 /
  Rule 11(g)) is common industry-wide for third-party-hosted accounting software and should not be
  over-weighted as unique to AWFIS, but it belongs in the record because Pass 1 did not read the
  Rule 11(g) paragraph of the Auditor's Report at all. Everything else in this pass (receivables
  concentration, ECL-rate volatility, the GST SCN disclosure-delay filing, the Note 29 cost-line
  growth, and the two provision lines that do not obviously reconcile to Note 36) is second-tier but
  genuinely new, and none of it contradicts Pass 1's top findings - it adds texture around them.
