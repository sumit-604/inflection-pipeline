verdict_basis: "No legal, regulatory, pledge or deal-breaker record on four co-founder promoters, but the listed record is 8 months old and carries six caution items: family fees Rs 0.78 Cr with scope unknown, promoter pay at 24.7% of PAT, independents at 47% attendance, 7-month CS tenure, undocumented education for one promoter, and unexplained JVS/Venson origins."
analyst_note: "Task brief named two promoters. The RHP, AR Note 2(xi), Reg 31(4) and SHP name four: Panish, Dambal, Vinod Kumar and Sreenath, each about 18% (73.64% combined). Promoter group holds 22 shares each in four spouses (88 shares in all). OFS of 7,94,000 shares at Rs 59 raised Rs 4.68 Cr for the promoters (about 4.5% of their stake). Ledger inputs for Role 2 3G: built (revenue Rs 28.41 Cr FY23 to Rs 83.86 Cr FY26, debt Rs 5.69 Cr to Rs 0.76 Cr, self-funded, no outside equity before IPO), raised (IPO Rs 35.22 Cr), deployed (IPO capex Rs 2.76 Cr of Rs 11.55 Cr plan; WC Rs 1.23 Cr of Rs 8.60 Cr), delivered (revenue +36.4%, PAT +38.4%, first export Rs 0.46 Cr; KIADB unit unbuilt). No pledge, no litigation, no SEBI action found. Verdict is CAUTION, not TRUSTWORTHY, on listed-conduct ledger depth and the unexplained JVS/Venson link; both resolve with one filing each."
