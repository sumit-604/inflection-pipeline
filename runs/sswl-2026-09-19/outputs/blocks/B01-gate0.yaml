analyst_note: >
  GOOD classification, no deal-breakers. Cash quality (18/20) and
  shareholder alignment (18/20) are the strongest blocks; growth (6/20) is
  the weakest, dragged by a sub-10% revenue CAGR and a negative PAT CAGR.
  Block A's ROCE trend (A4=1, -4.76pp over 5 years) and the moat block's
  M1/M2/M9 zeros triangulate on the same story as company memory LBF2:
  margin compression is real and shows up across independent tests, not
  just one ratio. The FY24 AMW/AACL gain (LBF4) is a genuine one-off that
  inflates FY24 ROE and the equity base beneath FY25-26 ROE/ROCE; it does
  not inflate ROCE itself since EBIT excludes Other Income. Treat FY22-24
  Block A figures as a soft floor (proxy Capital Employed); FY25-26 are
  exact. The single biggest fresh risk this stage surfaces beyond company
  memory: FY26 cash conversion (CFO/EBITDA 65.0%) is a sharp one-year drop
  from FY25 (106.7%), worth a tripwire even though B1's 5-year cumulative
  ratio (1.23x) still scores well.
