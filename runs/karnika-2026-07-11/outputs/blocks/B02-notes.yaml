questions_for_mgmt:
  - "Who is/are the counterparty(ies) behind the Rs.885.36L outstanding (Rs.18.88Cr gross disbursed) unsecured inter-corporate loans in Note 19, and what is the commercial rationale, interest rate, and repayment schedule?"
  - "What is the arm's-length pricing basis for the Rs.222.72L rent paid to the three promoter-directors personally and the Rs.2,288.34L of related-party sales, particularly the Rs.2,026.48L to Shree Garments?"
  - "Given the stated policy of adequate doubtful-debt provisioning (Note 2(q)), why has the provision been NIL in both years despite Rs.445.10L of receivables over six months old?"
  - "What is the Board's risk-management framework and rationale for deploying treasury cash into equities, mutual funds and derivatives/speculation (Note 12/Note 22), and will this activity continue?"
  - "Who was the lender behind the unsecured loan that generated Rs.94.79L of FY24 interest expense and was fully repaid by FY25 (Note 27), given Note 33's KMP loan/advance figures are too small to be the source?"
  - "Why does the Note 37(xvii) Ratio Analysis annexure carry a signature date (27 May 2024) and UDIN that predate the FY25 audit engagement, when every other statement page is signed 27.05.2025?"
