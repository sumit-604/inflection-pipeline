red_flags:
  - "Segment reporting structurally cannot separate proprietary trading from
    client-driven broking revenue/profit (Note 45 consol, p.289) -- the
    central LBF1 question is unanswerable from the notes alone."
  - "Group profit concentration in the parent rose from 75.28% to 92.03% of
    consolidated profit YoY (Note 62 consol, pp.327-330), the opposite of a
    subsidiary-diversification transition."
  - "Two subsidiaries reversed sharply: Algoplus PAT -64.7% YoY, Share India
    Securities (IFSC) swung profit to loss (Note 61/62 consol, pp.325-330),
    with no narrative given in the notes."
  - "NCD end-use change failed to get holder approval; Board pivoted to
    proposing early redemption of Rs 99.90 Cr of NCDs (Note 17e standalone
    p.171; Note 18e consol p.271-272), the likely root cause of the Aug-Sep
    2026 adjourned NCD holders' meeting; a separate subsidiary NCD (Rs 30.85
    Cr) matures 1-Oct-2026 (Note 18c consol, p.271)."
  - "Debt-service and interest-service coverage ratios weakened materially in
    FY26 on the company's own disclosed figures, before any Sep-2026 rating
    action (Note 58a standalone p.218; Note 63a consol p.328)."
questions_for_mgmt:
  - "The segment note reports 'Share broking/trading business' as one
    segment (Rs 1,387.84 Cr revenue, Note 45 p.289). Please provide the
    quarterly split between proprietary trading income and client-driven
    brokerage/fee income within this segment, FY24-FY26 and Q1 FY27."
  - "Share India Algoplus Private Limited's PAT fell 64.7% YoY (Rs 67.61 Cr
    to Rs 23.83 Cr, Note 62 p.330) and Share India Securities (IFSC) swung to
    a loss. What drove these reversals, and are they linked to the SEBI F&O
    curbs or the Mar-2026 SEBI algo-platform settlement?"
  - "The Rs 99.90 Cr NCD First Issue needed an end-use change that NCD
    holders/Trustee did not approve, leading to a proposed early redemption
    (Note 17e p.171). What is the current status of that redemption, and is
    it the same matter behind the Aug-Sep 2026 adjourned NCD holders'
    meeting? Separately, what is the status of the Rs 30.85 Cr subsidiary NCD
    maturing 1-Oct-2026 (Note 18c consol p.271)?"
  - "Trade receivables from related parties and director-linked firms jumped
    from near-zero to Rs 8.26 Cr and Rs 7.89 Cr respectively (Note 7 p.156).
    What is the nature of this receivable and its expected collection
    timeline?"
  - "Debt service coverage fell from 4.79x to 3.25x (standalone) and 4.62x to
    2.74x (consolidated), and the guarantee corpus grew 48.3% YoY to
    Rs 3,232.72 Cr. Given the Sep-2026 Infomerics downgrade, what is
    management's plan to restore coverage and cooperate with the rater?"
receivables_trend: "Trade receivables ageing itself is CLEAN and stable
  (98.7-98.8% under 6 months both years, Note 7 standalone p.156 / consol
  p.256); ECL provision flat (Rs 39.50 lakhs). The deterioration signal is
  NOT in receivables ageing but in working-capital FUNDING: the Rs 402.61 Cr
  MTF book (+69.8% YoY, Note 9 p.157) is funded by rising external debt (new
  NCDs + borrowings, Note 57 p.213) while debt-service coverage fell
  (4.79x->3.25x standalone, Note 58a p.218). Classified DETERIORATING on
  funding quality despite clean ageing (feeds FLAG-CASH)."
