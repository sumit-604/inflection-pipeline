verdict_basis: "Qualified IFC opinion with a whistle-blower complaint and special audit missing from the governance report, an open SEBI insider trading inquiry, and three fatal accidents in 2025; offset by nil pledge, low RPT and a full strategic sale with a completed open offer."
analyst_note: "The verdict scores the outgoing promoter. Control passes to Apollo only when the 41.33% SPA closes; as of 5 Nov 2026 it has not, and Apollo already holds 26% from the open offer (media). Two reads of the IFC qualification: design lapse in a fast-growth year (A) versus an area where something went wrong, given the Rs 3,417.80 L supplier discount and the 11,654.90 L to 4,151.63 L payables swing (B). The separator is the FY27 IFC opinion and the special audit findings. The 2017 SEBI order against Amarnath Gupta is listed but its text was unreadable; stage 0 should treat the pair as order text NOT READ. PESO suspension and restoration, named in the brief, was not confirmed by any source."
