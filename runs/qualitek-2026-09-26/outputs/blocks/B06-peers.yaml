risks_peers_raise:
  - "Manpower attrition named as explicit industry-wide risk (VIMTALABS: 'attrition is quite high across the industry... going to be the norm') -- not named anywhere in Qualitek's own disclosure despite being a skilled-labour-dependent testing business."
  - "Key-person/leadership departures addressed directly on-call with continuity framing (KRSNAA: CFO and CBO departures) -- Qualitek's CS cessations are not discussed with comparable openness."
  - "Geopolitical/tariff disruption to input costs and logistics named and quantified in direction (VIMTALABS: 'war' impact on food-testing import/export, consumables lead time) -- absent from Qualitek's disclosure."
  - "Government payment-system transition risk named as the specific mechanical cause of receivable delays (KRSNAA: RBI-link account rollout, SNA-SPARSH) -- Qualitek's own debtor-day disclosure does not name any comparable mechanism, leaving its receivables story less evidenced than Krsnaa's."
  - "Regulatory/pricing-benchmark risk from CGHS rate resets flowing into competitor tender pricing (METROPOLIS, KRSNAA) -- illustrates a level of forward-risk specificity in peer disclosure not matched by Qualitek, though not directly applicable to Qualitek's segment."
net_narrative_effect: "complicates"
analyst_note: "On operating mechanics (new-lab loss curves, capacity-race context, input-cost stability, PPP-adjacent debtor-day norms) the peer set is broadly consistent with Qualitek's own disclosed figures. On governance and disclosure BEHAVIOR (related-party acquisition transparency; open acknowledgment of guidance misses) peers set a visibly higher bar Qualitek does not clear -- this is a comparative finding, not an absence-of-evidence inference, since two of three peers directly missed targets in the same period and directly acknowledged it when asked. Cross-peer hypothesis (Part 5): sector margins may be structurally understated in FY26-27 because all three peers are simultaneously mid-capex; this is testable against FY28-29 margin trajectories and should inform whether Qualitek's own new-lab drag is read as temporary or permanent."
