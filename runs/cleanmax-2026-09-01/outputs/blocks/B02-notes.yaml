  - "Scale of intra-group RPT authorisation (~Rs 14,800+ Cr) and cash pooling (~Rs 3,011 Cr) visible only in the AGM Notice, outside the Notes to Financial Statements"
questions_for_mgmt:
  - "Which specific SPV facility triggered the FY26 covenant breach (Note 37.1), what covenant, and was the rectification a formal waiver or a cure by repayment/refinance?"
  - "What would FY26 reported PBT look like if capitalised interest/LC-BG/lease interest (~Rs 312-329 Cr) reverted to the FY25 capitalisation ratio, and depreciation at the pre-change 25-year useful life?"
  - "What is the nature, timing, and rationale of the Rs 216.25 Cr RPT ceiling with Clean Max Patagonia, given its auditor's Clause (xix) doubt, and does any of it function as liquidity support?"
  - "What is the cumulative NCI put-option liability (not just the annual incremental transfer), and when does management expect the SPV cohort's aggregate NCI profit share to turn positive?"
  - "What is the FY27 hedging roadmap given only ~12% of floating debt and ~8% of USD exposure is hedged, and does the 74% parent-equity pledge seen on one sampled facility apply broadly across the SPV portfolio?"
receivables_trend: "stable to improving: >6-months share of aged gross receivables ~11.8% FY26 (Note 13/53, AR p.416-417, 486-487) vs a proportionally worse-quality FY25 mix on a smaller base; consistent with company memory's DSO trend (55->54->42 days). Does not by itself warrant FLAG-CASH; FLAG-CASH set instead on broader working-capital/cash-conversion evidence (see flags)."
restatements_found:
