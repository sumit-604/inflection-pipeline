strengths_top3:
  - "Clean audit record across the board: unmodified opinions (standalone and consolidated), zero fraud/default/wilful-defaulter findings, zero SEBI/exchange actions in three years, zero non-audit fees to the statutory auditor"
  - "Revenue growth is real and structurally broad-based (+11.7%, with a genuine domestic/export mix shift under tariff pressure), and receivables ageing/turnover actually improved this year even as other working-capital lines deteriorated"
  - "No debt maturity cliff, well-laddered borrowings, immaterial and arm's-length related-party transaction quantum (0.56% of revenue), sole subsidiary loan fully repaid"
red_flags_top3:
  - "Chairman's Letter's headline EBITDA figure (Rs.4,981.53 lakh) appears to embed the one-time exceptional insurance gain (Rs.420.25 lakh), overstating true audited EBITDA (Rs.4,561.29 lakh) by 9.2% in the most-read section of the Annual Report"
  - "Operating cash generation effectively collapsed: CFO -78.3% YoY, CFO/EBITDA from 82.4% to 24.8%, FCF turned negative, driven by a 5.5x increase in net working-capital cash consumption traceable directly in the Cash Flow Statement"
  - "MD&A's own Return on Net Worth table directly contradicts the audited Note 43 Ratio Analysis within the same document (claimed +0.78pp increase to 12.28% vs audited -42.5% decline to 6.61%), alongside the 71% two-customer concentration being entirely absent from the Company's own risk disclosure"
best_fit_strategy: "GARP/Turnaround, both Watchlist pending confirmed margin-trough reversal"
one_line_verdict: "Real revenue growth masking a margin and cash-flow collapse the Chairman's Letter's own EBITDA figure appears to overstate."
