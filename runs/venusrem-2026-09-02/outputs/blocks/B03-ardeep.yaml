analyst_note: "Two nuances downstream cannot reconstruct: (1) The Rs30Cr IPR purchase and Rs21.55Cr advance both date to FY25, not FY26 - FY26's own RPT table shows nil for both, so this is a disclosure-quality/governance-history flag on the comparative year, not an FY26 earnings adjustment. (2) FY26 itself carries a separate, fresh, undisclosed-as-related RPT pattern newly identified this stage: Rs4.36 Cr IT Services + Rs1.26 Cr Brand Promotion to significant-influence entities (Sunev is a Promoter Body Corporate per the shareholding table, sharpening the Board's 'no RPTs with Promoters' language). Stage 11/13 should treat the CMD=CFO=Audit-Committee-member structure and the Risk Management Committee self-contradiction as the two highest-value items to raise via claude.ai live verification before Halt 1."
