analyst_note: "Fact 1 verdict: the 85-90% is Ghai's, on Q4 FY26 call (12 May 2026), against 'the order in hand' at 31 Mar 2026; no figure was named. Total order in hand is INR 1,628 cr on the call and 1,631 on the deck chart; Rs 1,218 cr is the deck's 'Services backlog' and includes FGD O&M, so it is not core-only. The 11% is the FY26 base on an entity basis including Durgapur drag; for FY27 he said only 'at par if not more'. Filed: Q1 FY27 14.5%, Q2 FY27 9.8%, H1 12.2% on continuing ops ex other income (INR M). Q2 FY27 other income INR M 312.8 is 59.0% of PBT before exceptional (calc), not the brief's 48%. Q2 FY26 ex-other-income margin looked 10.0% but contained a INR M 235 ECL reversal inside other expenses, so FY27 Q2 is the cleaner base. Single separating observation: Q3 FY27 ex-other-income margin above or below 11%."
