going_concern_language: "NONE. Both the standalone and consolidated basis-of-preparation notes and both Auditor's Reports (AR p.149-159 standalone, p.219-226 consolidated) use only standard going-concern boilerplate (financial statements prepared on a going-concern basis; standard auditor-responsibility language on evaluating management's use of the going-concern basis). No material uncertainty related to going concern is disclosed or flagged by either auditor anywhere in the document."
analyst_note: "Two corrections to the prior passes, both verified against source text. First, Pass 2's CARO page anchor should read AR p.224 for the Annexure A adverse-remarks table itself; p.222 is only where the auditor's report announces Annexure A and states the qualified opinion, p.223 has the audit-trail detail. Second, Pass 1's Note 30 contingent-liability arithmetic was wrong: the correct FY26 total is Rs 14.96 Cr (~1.01% of net worth), not the Rs 8.65 Cr (~0.05%) Pass 1 stated; the substantive conclusion (immaterial, no item over 10% of net worth) still holds for FY26, but FY25's equivalent was ~12.98% of FY25's smaller net-worth base, reversed only by the in-year Karnataka High Court order. New this pass: the Note 15(C)/Note 29 net-debt gap is not cosmetic. Note 29 divides its own unreconciled, smaller figure into equity to report a net debt/equity ratio of 0.17; using Note 15(C)'s figure instead gives approximately 0.23. Stage 11 should treat 0.17 as unverified and use Note 15(C)'s reconciliation, which ties exactly to its own cash-flow rollforward, as the more defensible basis."
