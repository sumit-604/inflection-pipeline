analyst_note: "Three things a later stage cannot rebuild. (1) FY27 guidance is a midpoint game: Rs 1,350 Cr +/-25 on a Rs 1,155.67 Cr base is +16.8% (calc); H1 standalone is Rs 437 Cr (press release p.2), so H2 needs about Rs 913 Cr against Rs 745 Cr in H2 FY26 (calc, +22%). Q4 FY26 alone was Rs 487.2 Cr (48,721.75 Rs Lakhs). (2) Cash: the Q4 FY26 CFO strength (37,595.92 Rs Lakhs) came with a March spike; management itself said March balances are always high and Q3/Q4 carry the pressure, so H1 -146 Cr is not yet proof of reversal, but it contradicts the 'Q1/Q2 looks better' line. Observation that separates the readings: year-end FY27 CFO and inventory. (3) Uttam: Rs 1,878.8 Cr ex-tax booked in Q2; mgmt order book figures use Rs 2,205 Cr tax-inclusive. Grade B rests on hard-number delivery; a C reading is live if H2 revenue misses or CFO stays negative."
