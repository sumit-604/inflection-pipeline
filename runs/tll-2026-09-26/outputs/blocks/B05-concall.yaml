flags:
  - type: FLAG-DISCLOSURE
    severity: MODERATE
    reason: "Total Income mislabelled as 'Revenue from Operations' recurs in three decks (Nov-2025 p29, Jan-2026 p29, May-2026 p28) AND in the FY26 Board's Report itself ('revenue from operations of Rs 10607.05 Lacs', AR lines 1609-1614), filed four months after the first deck instance. Upgraded from run-1's MINOR-to-MODERATE: the statutory-filing repeat is the material change; this was not silently corrected."
  - type: FLAG-CASHFLOW
    severity: MAJOR
    reason: "FY25 standalone CFO presented on two incompatible bases across three decks with no note: -349.31 (Nov-2025, Jan-2026 decks, excluding the working-capital-facilities addback) vs +197.07 (May-2026 deck, including it). The addback (545.38 FY25 / 920.49 FY26) is disclosed only inside the FY26 results cash-flow statement, never in a deck note. This is a Pillar 2 cash-conversion input, not a cosmetic deck issue."
  - type: FLAG-RECONCILIATION
    severity: MINOR-MODERATE
    reason: "Jan-2026 deck 9M FY26 PBT (1,667.60) does not equal H1 FY26 PBT (1,110.46) + Q3 FY26 PBT (592.39) = 1,702.85, a gap of Rs 35.25 lakh. Q4 FY26 standalone D&A (4.15) is near zero against Q3 FY26 (71.23) and Q1 FY27 (69.81), unnoted anywhere."
  - type: FLAG-CONSOLIDATION
    severity: MAJOR
    reason: "FY26 results note 8 calls the proportionate-to-equity-method consolidation change immaterial; the Q1 FY27 results' own language still describes proportionate consolidation, and the Q1 FY27 review report cites Ind AS 34 on an Indian-GAAP filer. The consolidated EBITDA margin story (+470bps) runs opposite to the standalone margin (-187bps) over the same period. Unresolved; flagged for Stage 11/FTTCP, not settled here."
  - type: FLAG-DISCLOSURE
    severity: MODERATE
    reason: "Consolidated Claim Income (Rs 5.41 Cr FY26, 19.9% of PBT; Rs 5.22 Cr FY25, 38.4% of PBT) is never named anywhere the AR's 'PBT doubled to Rs 27.2 crore' claim is made."
  - type: FLAG-NARRATIVE
    severity: MODERATE
    reason: "Registration-pipeline regional concentration (Africa 64%) does not match FY26's actual revenue drivers: export revenue is Asia-led (57%) and the growth driver was domestic mix (30% to 49%), which needs no export registration at all."
  - type: FLAG-NARRATIVE
    severity: MODERATE
    reason: "'Fairly stable'/'broadly stable' product-mix language, repeated across two decks and the AR MD&A, contradicts the company's own segment chart showing Capsules +350% and the toothpaste/ointment/other bucket -38% over the same window."
  - type: FLAG-GOVERNANCE
    severity: MODERATE
    reason: "'Triple our consolidated business over the next three years' and named subsidiary peak-revenue figures appear for the first time in the Aug-2026 deck, after the FY26 audited subsidiary shortfalls (AOC-1) were already known internally. Neither claim was carried into the FY26 AR's own, materially more measured Outlook, filed under the same management about a month later."
  - type: FLAG-PROCESS
    severity: MINOR
    reason: "Aug-2026 investor presentation, filed with BSE under Reg 30, carries unremoved 'Lorem ipsum' placeholder text on the Trident Mediquip (p12) and TLL Wellness (p14) subsidiary pages. BSE also flagged the same trade-payable bifurcation defect in both the H1 FY25 and H1 FY26 refilings, a repeat run 1 did not name when scoring refiling integrity cleanly Positive."
