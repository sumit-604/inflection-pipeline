industry_cross_read:
  demand: "Split. Arvind AMD reports record quarter and holds 18-20% growth with chunky defence and composite orders (ARVIND Jan page 5); Mayur domestic is flat to weak and US auto OEM demand softened in H1 FY27 (MAYURUNIQ Nov page 5). No peer mentions an industry-wide defence boom."
  pricing_inputs: "Peers raw materials are petroleum-linked and rose from March 2026; pass-through lags 1-2 months and is selective (MAYURUNIQ May page 11; Aug pages 8-9, 11; ARVIND May page 15). Peers absorbed tariff and freight shocks rather than passing them on (ARVIND Jan page 8; MAYURUNIQ Aug page 9). Matches Kusumgar's lag statement, not its margin stability."
  capex_cycle: "Not an industry capacity race. Both peers add small step capacity inside existing sites (Mayur 50 crore line, Arvind USD 5m per line) and hold bigger capex pending a location decision (Mayur 250-300 crore). Kusumgar is a lone post-expansion digester at 55-60% utilisation, not a lone expander."
