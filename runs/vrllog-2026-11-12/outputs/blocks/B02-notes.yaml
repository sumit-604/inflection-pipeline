  - "Note 29(k) CPC demand of 5,186 lakhs: has the section 154 rectification order been passed, and why is it outside the contingent table when the note sits within the contingent liabilities disclosure?"
  - "Note 35 shows RP travelling cost 535 (113) and rent cost 76 (13). Who are the counterparties, and does VRL lease any property from a promoter entity under Ind AS 116? Why were parties no longer named?"
  - "Which leases were terminated (ROU disposals 9,907 gross, gain 725) and which land parcels were bought (land additions 12,910 and 24,290)? Who sold the property taken over in FY25 'without additional consideration'?"
  - "Why was the gratuity fund not topped up in FY26 or FY25, with the 1,230 contribution expected, and when is the 754 FY27 contribution due? What is behind the vehicle retirement at about 85% depreciation against a 15 year life?"
