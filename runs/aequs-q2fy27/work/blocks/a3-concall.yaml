analyst_note: "Three items carry the quarter. First, the falsification line appears met: Q2 consumer loss Rs 40.1 cr (S184) against the 36.1 cr bar, with utilisation 17% (S393). The 17% is analyst-spoken and management gave no Q2 figure, so confirm it in the filed deck before the operator treats the line as fired. Second, the 14% QoQ EBITDA rise is forex other income. Ex-OI EBITDA fell from about 148m to 139m (A3 arithmetic, S199-201). Segments sum to 382m against 245m reported, so about 137m sits unexplained. Third, funding outruns stated capex. FY27 capex is cut to about 320 cr, yet 650 cr warrants, over 800 cr term loans and a possible FY28 raise are lined up. That points to unguided post-FY27 Hosur spend. Tax leakage (135m current tax on aero profit while the group loses) lasts until the amalgamation clears, and no route is named. All numbers are ASR and management-tier. Derived Q1 figures are H1 minus Q2. Receivable days '268' reconciles to about 68 by arithmetic (inference, not a fill). Silence counts are 1+ because no prior transcript was supplied."
