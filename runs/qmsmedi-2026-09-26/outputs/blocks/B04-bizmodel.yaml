moats_present:
  - {moat: "CDSCO import/distribution licence (regulatory)", durability: "moderate"}
  - {moat: "30-year exclusive brand tie-ups (3M, Heine, Rossmax)", durability: "moderate, supplier-dependent"}
  - {moat: "PSP/CRM multi-month contract stickiness", durability: "moderate"}
