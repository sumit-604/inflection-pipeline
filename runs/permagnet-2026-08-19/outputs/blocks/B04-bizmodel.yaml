must_track_metrics_note: "FY26 breached the cash-conversion metric (OCF fell while PBT rose 38%)"
one_line_verdict: "Trusted niche component maker funding two unproven growth bets with rising leverage and a receivables build."
analyst_note: "Two anchored discrepancies matter downstream. (1) Company KPI-page ROCE (rising, p.12) conflicts with statutory ROCE (falling, p.19/p.156); statutory figure feeds valuation/monitoring. (2) Standalone OCF fell in FY26 even as PBT rose 38%, driven by a 39% receivables build against 13% revenue growth - a genuine cash-conversion flag not in the headline growth story. Consolidated leverage rose sharply (D/E 0.17x to 0.56x) via an unhedged ECB at Quantum Magnetics funding a venture that booked zero revenue in FY26. Weigh against genuine core operating leverage (EBITDA margin 14% to 17%). SECTOR for stage 11: electrical / auto-ancillary components multi-segment industrial (manifest 'Agri processing' is a collect_to_repo defect, do not use)."
