    reason: "SOM(yr3) = Rs 2,754 Cr sits inside management's own stated capacity ceiling only if the Rs 290 Cr castings/machining capex commissions on the EARLIER of its two conflicting stated dates (Q1FY29); the AR and all three concalls instead state Q1 2029-30."
