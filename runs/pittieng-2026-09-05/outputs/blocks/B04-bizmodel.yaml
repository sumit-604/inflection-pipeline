  - "Rupee/percentage revenue split by product type (laminations vs castings vs machined components vs assemblies) NOT FOUND in either document; only physical volume (tonnes) is disclosed, and only for Q1FY27 at full product granularity"
  - "Named domestic or international competitors NOT FOUND in either document"
  - "Third-party market-share data corroborating the self-declared 'India's largest manufacturer' claim NOT FOUND"
