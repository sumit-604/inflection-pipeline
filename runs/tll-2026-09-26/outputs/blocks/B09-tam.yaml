flags:
  - {type: FLAG-TAM-METHOD-DIVERGENCE, reason: "Method 1 macro top-down TAM (~Rs 6.68 lakh Cr, whole Indian pharma industry + relevant exports) diverges sharply from Method 3 peer-niche TAM (Rs 6,541-8,325 Cr, registration-led semi-regulated-exporter comparables). Expected and explained, not averaged: Method 3 used as the operationally relevant headline because Method 1's scope is far broader than TLL's actual competitive set."}
  - {type: FLAG-CAPACITY-GAP-5YR, reason: "5-year SOM (Rs 406 Cr) exceeds the ~Rs 322.5 Cr ceiling implied by 100% utilisation of currently installed capacity (40% utilisation, deck p.8) by ~Rs 84 Cr. Closing that gap requires TLL Parenterals to reach ~42% of its own stated Rs 200 Cr peak revenue within 5 years, faster than any existing TLL subsidiary has achieved (Mediquip ~39% of its peak after ~1.5 years; TNS Pharma only ~14% of its peak years after commercial operation began in 2024). The SOM, not the capacity plan, is the optimistic side of this cross-check."}
  - {type: FLAG-MGMT-GROWTH-CLAIM-VS-TRACK-RECORD, reason: "Management's 'triple our consolidated business over the next three years' (Aug-2026 deck p.5) implies FY29 revenue of ~Rs 387 Cr (~44.2% CAGR), a 1.31x ratio against this stage's conservative 3-year SOM of Rs 295 Cr (~31.8% CAGR). Within the 1.5x 'reasonable' band, but the composition of the gap leans on faster subsidiary ramp-up (esp. TLL Parenterals) than the company's own five-subsidiary delivery history has ever shown (LBF3)."}
