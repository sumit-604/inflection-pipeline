analyst_note: "The MOTISONS-mislabeled-as-RBZ corpus defect means the intended Rajasthan/Jaipur catchment test (Motisons vs DPABHUSHAN's home market) was never performed; this is a genuine open item for a future run, not something this triangulation can retroactively fix. Three of the seven B05 questions (Q1 volume, Q6 duty/PM demand, Q7 guidance discipline) all independently come back contradicted, and all three share a common shape: DPABHUSHAN frames a company-specific weakness as an industry-wide or macro-driven phenomenon, and better-capitalised, better-disciplined peers in the same weeks show materially different results. This pattern, not any single question, is the main synthesis-relevant finding from this stage."
