credibility_grade: "C"
credibility_basis: "One specific, testable call guidance item (Q4FY26 margin improvement) was delivered per audited results, and the RHP's Unit 4 capex/date and working-capital objects were fully delivered per an independent IPO monitoring agency. Against that: the hybrid power project slipped four documented times over seven months; the Unit 4B 160-loom commitment was never confirmed complete and was silently redefined; the one live margin explanation was dropped from the audited Annual Report; and material governance events go unaddressed in every investor communication. Mixed record keeps the grade at the NO-CONCALL default; it does not clear the bar to rise to B."
