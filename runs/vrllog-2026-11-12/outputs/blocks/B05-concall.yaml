analyst_note: "Grade B follows A26.4: mixed history, four quarters of delivery. Operating guidance (tonnage, margin, realisation) has been met or beaten since May 2026, but the May guide was set low after the Feb 10-11% was dropped without a reason. Capex and the buyback funding story do not reconcile on the numbers. The 23.3% margin includes other income; only the 21-22% band is repeated four times. Promoter stake, director resignation and ton-km are the questions the calls never answer. Q2 FY27 results face and presentation were not re-read here."
