analyst_note: "Sparse scan, correctly: nine categories carry a score, none Strong or Moderate. The 11.7 total sits 0.3 under the 12 line, so treat NONE as the floor of a thin MODEST, not a gap. Most evidenced path: the reset is cost-led (net price effect about +84 lakh of 1,540 lakh PBT rise, B03). Two readings: structural (PJG know-how, UF plant, solar) or cyclical (bone and gelatine price deflation). Separating observation: Q2 FY27 materials ratio at or under 52% while IGCL does not rebound. Solar and UF power saving is credited once, in A3. Exports 4.5x (47.99 to 214.93 lakh) are credited once, in E2; PJG appears in H2 only for the consultancy line. 2C: gross-block formula gives 69% (33 Cr x 4.51x on average gross block); the block carries 22%, the capacity-weighted figure, because the formula counts upgrade capex that adds cost savings, not volume."
