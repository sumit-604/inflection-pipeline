analyst_note: "Score reflects a post-IPO scale-up, not weak earnings: revenue grew 3.7x and PAT stayed positive every year. The AVOID label comes from three mechanical effects. First, only 4 years of data, so a one-tier downgrade. Second, ROCE earliest year (58.5%) rests on Rs 9.58 Cr capital employed, so A4 scores 0 on a base effect while FY26 ROCE is 11.96%. Third, negative cumulative CFO from working-capital build (inventory 2.7x in FY26, receivables 3.5x FY23 to FY26). Net cash, 8.3x interest cover and 0.17 D/E are sound. The AR versus results-filing gap in FY26 receivables (2,463.00 Rs Lakhs) decides which debtor-day figure is true; later stages should resolve it before using the 20.2 days claim."
