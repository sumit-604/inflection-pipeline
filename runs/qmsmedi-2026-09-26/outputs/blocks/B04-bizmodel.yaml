  - {name: "Products - Point of Care", type: "distribution/trading (consumables, contract-tied)", pct_of_revenue: 11.0, predictability: "M"}
  - {name: "Products - E-commerce (QMSMEDS/Q-Devices online)", type: "D2C retail e-commerce", pct_of_revenue: 0.6, predictability: "L"}
  - {name: "Services - B2B Health Camps", type: "fee-for-service / project-based", pct_of_revenue: 12.3, predictability: "M"}
  - {name: "Services - Patient Support Programs (incl. Saarathi)", type: "recurring programme / retainer services", pct_of_revenue: 17.3, predictability: "M-H"}
asset_intensity: "medium"
wc_intensity: "high"
pricing_power: "weak"
