  - {question: "Have MCX, BSE, or CDSL cited customer stickiness, API integration, or long relationship history as the reason a regulatory or competitive change would not erode market share, and how did that specific claim hold up against subsequent market-share data (e.g., BSE cash-segment share versus NSE after past equalization moves)?", why: "Tests the credibility of Goel's own NSE-vs-BSE analogy and general customer-loyalty defence against the real-world precedent he himself invoked", check_peers: ["BSE", "MCX", "CDSL"]}
