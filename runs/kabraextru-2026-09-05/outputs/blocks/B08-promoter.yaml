verdict_basis: "Old, minor, consent-settled SEBI PIT order against the sitting Vice-Chairperson & MD (2021) plus a concentrated ~6-month cluster of five KMP/senior exits (CFO x2, COO-Geon, Head-Strategy, Company Secretary) coincident with two CRISIL downgrades and a swing to consolidated loss, against zero pledge, clean RPTs/audit, a credible independent board, transparent multi-year succession, and fresh marquee-investor capital (Kela/Mittersain/Sheth) backing the Geon pivot."
analyst_note: "The FY26 consolidated loss context the run brief asked about: AR26 and AR25 both show the Geon/Battrixx division's largest customer, Hero Electric Vehicle Pvt Ltd, entered NCLT insolvency (CIRP admitted 20-Dec-2024) with Rs 30.39 cr trade receivables outstanding; KET booked an ECL provision against this in FY25-26. This is an external customer-credit event, not a promoter-conduct issue, but it materially explains the Geon-division loss the company memory flagged. Also note: the AR26 director remuneration table is headed FY2024-25 but its own footnotes describe FY26 events, an apparent labelling carry-over error worth a footnote in synthesis, not a governance finding."
