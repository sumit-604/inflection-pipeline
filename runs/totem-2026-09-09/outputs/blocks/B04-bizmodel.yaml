  - {risk: "Margin — import-dependent input costs outrunning pass-through", first_signal: "Raw-material-cost-to-sales ratio above 37% for a second year"}
  - {risk: "Balance sheet — working capital stretch", first_signal: "Cash conversion cycle extending further past ~157 days"}
  - {risk: "Execution — FY26 capacity additions not yet converting to volume/margin", first_signal: "Operating margin staying below 17-19% band for 2+ more quarters"}
