analyst_note: "22.5% of SCL: the only identification is an undated X thread (c.2023) saying CNL 69.5%, Mohit Anand 22.5%, Sapri Trading 8%. Check: Sapri swapped 2,267 SCL shares into CNL stock in Aug-2023 (25% to 8%, so about 13,335 total shares) and 1,066 in 2024 (8%, about 13,325 total); 69.5%+8%=77.5%, exactly the AR's 77.50%. NCI profit 842.15 lakh is 23.4% of HK PAT 3,594.54 lakh. So the holder is almost certainly Mohit Anand, SCL's CEO and Honeywell-licence operator, but this is derived, not filed. Ask management who holds the Honeywell licence and whether Anand has put/call or profit-share terms. Onyx: no promoter link found; the 100% vs 82.44% mismatch needs an answer before the 28-Nov-2026 EGM. Click Retail: ask for ageing of Rs 47.74 Cr and its shareholders."
