analyst_note: "Profit ramp is real; Q2 carries no assignment gain, so core PBT rose 41.7% QoQ against a 21.8% headline. Loop 1 qualifies that headline: at Q1's computed credit-cost ratio core growth is about 31%, and the deck fee split (cross-sell 118 cr, servicing 91 cr) supplied 53% of the QoQ PBT rise. The insurance-commission risk sits on the 118 cr cross-sell line, 23.5% of Q2 PBT, insurance share ND. GNPA GREEN is conditional: 161.60 cr of stressed principal went to ARCs in Q2, classification at transfer undisclosed; if Stage 3, pre-transfer GNPA was 1.42%, though like-for-like with Q1's transfers the ratio still falls from 1.55%. The ratio-set RoA check is an identity, not evidence. Two readings fit credit cost: losses flat in rupees while pricing holds (bull), or a denominator effect that reverses when growth slows on a young book (bear). Rupee credit cost and write-offs in Q3-Q4 FY27 separate them. Capital is the second clock: D/E 3.82x to 4.30x in one quarter at ~11% RoE. Cash conversion INDETERMINATE-WITH-DIRECTION. Verdict unchanged. Pre-thesis: no position framing."
