industry_cross_read:
  demand: >
    No peer describes an ibuprofen-specific boom (none discloses the product); recoveries
    elsewhere (Granules paracetamol, Aarti exports) are incremental and mix-driven, not
    framed as a structural multi-year cycle turn the way IOL frames ibuprofen.
  pricing_inputs: >
    All three peers corroborate the same March-2026 West Asia/US-Iran shock to input costs
    and freight; they diverge sharply on price realisation -- Granules explicitly got no
    paracetamol price increase despite the cost shock, contradicting IOL's claim for the
    same product and quarter.
  capex_cycle: >
    Industry-wide capacity race, not a lone-expander situation: all three peers are
    simultaneously greenfield/brownfield expanding (Aarti: Sayakha, salicylic, new USFDA
    line; Granules: ~Rs600 Cr FY27 capex, new API plant, US distribution centre; Laxmi:
    Dahej Phase 2, world-scale ethyl acetate, Vayu/Hitachi JV) alongside IOL's own Rs495 Cr
    + Rs1,200-1,400 Cr programme.
