analyst_note: "No transcripts exist, so this grade rests on the AR claims checked against audited notes and results. The company made no testable forward promise; the clean delivery items are CARE's expectations, which the company never adopted in a filing. Grade C is a default, not a finding of weakness. The AR contradictions (materials direction, EBITDA 40.88 vs 42.08 Cr, other expenses 8.94% vs 7.64%) are reporting slips, not missed promises, and are held as red flags. Swing item: the Jan-2027 commissioning. A Reg 30 notice by Jan-2027 or H1 FY27 CWIP and loan draw rising would be the first company-side delivery evidence. Q2 FY27 results (12-Nov-2026) test margin persistence."
