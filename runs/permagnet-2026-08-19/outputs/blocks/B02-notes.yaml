analyst_note: "The two most important facts sit in different notes and only connect when standalone and consolidated notes are read side by side: the subsidiary's core revenue line effectively disappeared (Cast Magnets ~85.5% down) in the exact year it drew Rs.47.81 Cr new unsecured debt and built Rs.15.5 Cr unconverted capex. Neither the clean-looking standalone accounts nor any single consolidated note states this outright. Downstream stages should treat standalone-only profitability as materially incomplete and weight the consolidated numbers as the operative reality for risk. Cash Flow PBT tie-out failure corroborates a broader note-preparation quality concern."
