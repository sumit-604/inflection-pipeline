analyst_note: "TAM/SAM built almost entirely from category-level (not company-level) sourced data because the AR's own product-mix pages are graphics-only. SAM applies an external organic/inorganic excipient split (conservative 24.66%, lower of two conflicting sourced figures) to the India pharma-excipients segment only; lab-chemicals and food/nutraceutical slices are named upside, excluded from the base case for lack of a sourced split. The single most important handoff to Stage 11: SOM-implied CAGR (13.6%/14.3%) beats Kronox's own flat 3yr history but sits far below the 25% hurdle, and even that modest path is not visibly supported by the 3.05% capex-embedded growth rate or the stalled Dahej unit - treat the SOM as aspirational until capacity/utilisation data is verified live."
