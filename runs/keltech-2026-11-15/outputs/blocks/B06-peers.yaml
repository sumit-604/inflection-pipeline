analyst_note: "Q7 is marked CONTRADICTED as a base-rate claim only; no peer speaks about Keltech and the verdict should not be read as a Keltech fact. Two readings of the TNT date: payment is back-ended and April 2027 holds, or it slips; the separating observation is CWIP plus advances at Dec 2026 and Mar 2027 against the 114.5 Cr remainder. Peers cannot settle TNT price or offtake, so those stay NOT FOUND for stage 8/11. Solar domestic and international values are derived from rounded basket percentages. Apollo and Premier are defence-led, so their commercial-explosives data weigh less than Solar's. The H1 FY27 price-led growth may fade as higher prices enter the base (Solar Q2FY27 p.11), which matters for Keltech's FY28 comparison."
cross_peer_hypothesis: "Capital in this peer set is migrating out of commercial bulk explosives into defence-grade energetics, and bulk licences and silos are valued as an entry ticket. Solar domestic explosives share fell 35% to 32% in H1 FY27 while domestic value grew about 55% (derived); Premier left Coal India bulk on price and holds bulk near 6% of order book; Apollo bought loss-making IDL for TNT/RDX licences and silos. Implication: the scarcity premium a TNT plant relies on has a limited window. Testable by Q4 FY27 peer calls: at least two of Apollo, Premier, Solar report new commissioned TNT/RDX/HMX capacity or an approved defence-grade DPR, and stated energetics prices soften."
