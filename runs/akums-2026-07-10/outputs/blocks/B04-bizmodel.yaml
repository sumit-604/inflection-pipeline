valuation_methods:
  primary: {method: "EV/EBITDA", why: "Standard for capital-intensive CDMO/manufacturing peer comparison, aligns with segment EBITDA disclosure quality and avoids P/E's exceptional-item distortion"}
  secondary: {method: "Sum-of-the-Parts (SOTP)", why: "Five segments with very different margin/growth profiles (CDMO 13.4% margin vs branded 20-25%+ vs API/Trade Generics loss-making) warrant differentiated multiples"}
  tertiary: {method: "DCF", why: "Cross-check for multi-year optionality from EU CDMO contract (FY28+) and Zambia JV (FY29), but constrained today by weak OCF/EBITDA conversion and lumpy capex"}
  not_applicable: ["standalone P/E (PAT distorted by exceptional items and one-time deferred tax)", "P/B (asset-heavy but book value not the value driver)", "Dividend Discount Model (no dividend data found; capital redeployed into capex/debt repayment)"]
irrelevant_ratios:
  - {ratio: "Reported P/E (standalone)", why: "PAT distorted by exceptional items and FY25 one-time Rs 106 Cr deferred-tax impact"}
  - {ratio: "Net profit margin", why: "Distorted by finance cost up 172% YoY from capex financing, not core operations"}
  - {ratio: "Consolidated revenue growth alone", why: "Masks divergent segment trends - CDMO +8.6% vs API -15.9% vs Trade Generics -13.2% FY26"}
  - {ratio: "Reported ROE", why: "Distorted by fair value changes and exceptional items; use Adj ROE instead"}
must_track_metrics:
