  - {question: "Is a ~23-25% EBITDA margin achievable and durable in greige/grey-fabric weaving, given the FY26 progression Borana reports (22.89% 9M, 24.32% Q3, ~25.43% Q4), or is it dependent on a temporary raw-material cost advantage?", why: "This margin range is the core of Borana's re-rating case", check_peers: ["FILATEX", "SANATHAN", "SANGAMIND"]}
  - {question: "What did POY prices and polyester-chain spreads (PTA-MEG-POY) do, quarter by quarter, across FY25 and FY26?", why: "Tests management's own claim that cheaper Chinese POY drove the Q3-to-Q4 FY26 margin jump", check_peers: ["FILATEX", "SANATHAN"]}
  - {question: "What did the December 2025 removal of the BIS-certification import restriction on Chinese polyester textured/partially-oriented yarn do to imported yarn availability and price for Indian converters?", why: "This is the exact driver Borana's CFO cited on the one available call, and one that then vanished from the FY2026 Annual Report", check_peers: ["FILATEX", "SANATHAN"]}
  - {question: "What changes has the anti-dumping duty regime on imported polyester textured yarn/PTY undergone in FY26, and how does that reconcile with a simultaneous BIS-restriction removal Borana describes as making Chinese imports cheaper?", why: "Borana's own call contains two statements on ADD/import policy that read as being in tension", check_peers: ["FILATEX", "SANATHAN", "SANGAMIND"]}
  - {question: "What is a realistic revenue-per-rupee-of-capex ratio for new water-jet-loom or texturising capacity, and does it match Borana's own stated 2x-3x figure?", why: "Tests the plausibility of the capex-to-revenue assumptions behind the Rs350-400cr doubling plan and the 192-loom Unit 4 Expansion", check_peers: ["SANGAMIND", "SANATHAN"]}
