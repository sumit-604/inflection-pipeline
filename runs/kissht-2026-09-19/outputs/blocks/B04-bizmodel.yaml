  secondary: {method: "PE cross-check", why: "Two years of clean, restated profitability (FY25-FY26) allow an earnings-multiple cross-check against AUM/PAT growth and RoAAUM trajectory"}
  tertiary: {method: "Residual income / excess-return model (RoE vs cost of equity)", why: "Makes explicit whether 23.97% RoAE durably clears cost of equity, disciplining any P/B premium"}
  not_applicable:
    - "DCF -- short, lumpy Ind-AS-7 loan-growth-classified cash flow history makes multi-year FCF forecasting unreliable"
    - "EV/EBITDA -- not a meaningful metric for a financial firm whose core input cost (finance cost) sits above the EBITDA line"
    - "SOTP/NAV -- single core lending business; LAP still nascent (7.3-7.7% of AUM), not a separable segment"
irrelevant_ratios:
  - {ratio: "Trade receivable/payable days, inventory turnover", why: "No inventory or trade-receivables cycle; the loan book is the asset"}
  - {ratio: "Gross margin % (COGS-based)", why: "No cost-of-goods-sold concept; finance cost is the analogous input, already isolated"}
  - {ratio: "CFO/PAT cash-conversion, read as a manufacturer would", why: "Deeply negative cumulative CFO (B01, -2.46x cumulative PAT) is a loan-disbursal-as-operating-outflow artefact under Ind AS 7, not evidence of earnings-quality failure on its own"}
  - {ratio: "ROCE with finance cost added back to EBIT", why: "Structurally inflated for a lender per B01's own note; finance cost is core cost of funds, not overhead"}
  - {ratio: "Fixed-asset turnover / capex-to-sales", why: "Asset-light, opex-driven cost structure; PP&E is trivial"}
  - {ratio: "D/E vs a manufacturer's safe threshold (e.g. under 1x)", why: "Lenders run leveraged balance sheets by design; must be read against CRAR and the guarantee structure, not a manufacturer comfort band"}
