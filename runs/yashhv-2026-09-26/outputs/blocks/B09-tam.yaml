analyst_note: "The core TAM/SAM triangulation is unusually well-anchored for a small-cap: the RHP embeds a full Ken Research TAM/SAM/SOM study (Dec-2024) that is corroborated independently by a bottom-up percent-of-transformer-value check (Method 2) and repeated consistently across the H1FY26 investor presentation and three of four concalls. The one real gap is the AR FY26's unreconciled switch to a materially smaller Allied Market Research figure, and the fact that the 5-year SOM outruns disclosed capacity (Section 3C) by a wide margin unless price/mix does real work. Stage 11 should treat the 3-year SOM CAGR (35.5%) as the better-anchored cross-check against management's 38-42% guide; the 5-year figure (33.5%) carries the capacity-gap caveat."
