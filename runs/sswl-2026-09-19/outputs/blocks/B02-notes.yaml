red_flags:
  - "Two consecutive years of large, unexplained equity-to-equity reserve reclassifications (Rs 674.68 Cr FY25, Rs 364.52 Cr FY26) make consolidated retained earnings look like accumulated losses (-Rs 826.70 Cr) when the company was profitable both years; the AR's own Note 2.04(C) policy could explain the mechanism but is never stated to apply."
  - "Consolidation-only Capital Revaluation Reserve (Rs 34.84 Cr) coexists with an explicit 'no revaluation' declaration elsewhere in the same AR."
  - "Debt-like financing (reverse factoring, Rs 676.50 Cr, 67.6% of payables) kept off the borrowings note and routed through operating cash flow, flattering liquidity and leverage ratios."
  - "Deferred tax asset (Rs 59.31 Cr) recognised and grown against a subsidiary that has never turned a profit under SSWL ownership, with no disclosed forecast support."
  - "Put & Call Options FX position (not a plain forward hedge) generating a Rs 32.42 Cr mark-to-market loss with no prior-year comparative and no clear P&L trail."
  - "Zero Key Audit Matters in either auditor's report despite the above."
questions_for_mgmt:
  - "What is the accounting basis and full journal-level explanation for the Rs 674.68 Cr FY25 transfer to General Reserve and the Rs 364.52 Cr FY26 transfer to Capital Reserve in consolidated Other Equity (Note 19), and is either connected to the AMW/NCLT transaction accounting?"
  - "Was AMW's acquisition accounted for as a common-control combination (pooling of interest, per Note 2.04(C)) or under the stated default acquisition method -- and if pooling, why does no note explain the resulting Capital Revaluation Reserve (Rs 34.84 Cr) or connect it to the reserve transfers above?"
  - "What is the basis for recognising and growing a Rs 59.31 Cr deferred tax asset against AMW's carried-forward tax losses when AMW has posted losses every year since acquisition, and what is the expected utilisation timeline?"
  - "What does the Rs 69.85 Cr 'Interest Others' line within finance costs comprise (supplier-finance/reverse-factoring charges, FX derivative costs, or other), and can a breakdown be provided?"
  - "What is the status of registering AACL's land (transferred via the AMWL demerger scheme) in AACL's own name, and does the unregistered status affect any charge or security currently in place?"
receivables_trend: "Deteriorating in growth-rate terms (gross receivables +25.2% YoY vs revenue +11-17%, receivable days 30.89->32.80), mix-shifted toward current/not-due rather than concentrated in overdue ageing. Combined with stretching payable days (69.29->75.64, a confirmed two-year accelerating trend per Note 48e: +25.4% then +33.2%) and inventory +28.2%, the working-capital picture as a whole is deteriorating across two years, not one (Notes 11, 25, 10, 48e, 52 standalone)."
