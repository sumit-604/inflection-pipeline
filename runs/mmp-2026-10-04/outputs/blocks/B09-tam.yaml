analyst_note: "Headline SAM is 91% conductors and insulators [corrected by orchestrator 2026-10-05 from 96%: (16,045 + 1,865) / 19,762, per stage 9 hand-back] by value, so it flatters runway. Core powder plus foil SAM is Rs 1,852 Cr against Rs 719 Cr FY26 revenue (2.6x), and the powder domestic share is already about 42% (Rs 466 Cr domestic over Rs 1,117 Cr, export FOB Rs 38.4 Cr from AR26 Board report). Two readings of growth: (A) SOM 9.6% CAGR, bound by share rules and capacity; (B) guide 15-18%, which needs faster share gain, price inflation or new verticals (LT cable has no revenue guide, NOT FOUND). Separator: Q2 and Q3 FY27 powder and foil revenue against the 13-15% segment guides, and insulator quarterly revenue near Rs 6 Cr. SOM holds SAM at 2025-26 prices, so metal inflation is excluded. FY26 base includes a fire loss of Rs 40-50 Cr (deck p.27), which would lower the CAGR if normalised. Powder volume is NOT FOUND, so share is value-based and overstated for exports."
