analyst_note: "Peers confirm the macro backdrop (gold surge, duty hike, PM appeal, wedding demand, FOCO capacity race) is genuinely sector-wide; DPABHUSHAN is not fabricating its environment. But peers undercut DPABHUSHAN's two HIGH-severity Stage 5 flags directly: every peer discloses a numeric hedge ratio and quantified guidance-reconciliation every quarter, which DPABHUSHAN does not, making its hedging silence and guidance whipsaw genuine, peer-benchmarked management-quality gaps rather than pipeline artefacts. Volume-decline magnitude is the weakest DPABHUSHAN claim tested: PNGJL's explicit +25-27% gold volume growth directly counters an 'industry-wide ~20-29% decline' framing, even though PNGJL's own CEO concedes like-for-like industry degrowth exists once new-store contribution is stripped out. No peer transcript discusses DPABHUSHAN or Madhya Pradesh comparative economics."
