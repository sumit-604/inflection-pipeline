withdrawn_from_run_1:
  - "The finding that materials cost to revenue rose 32.0% to 37.2%, implying incomplete pass-through, is WITHDRAWN. It was a gross-versus-net basis error that ignored the change-in-inventory line. On a consumption-matched basis the ratio moved 34.3% to 32.2%, so gross margin IMPROVED about 212 basis points. The FY26 EBITDA drag was employee costs (+14.6%) and other expenses (+15.9%), both outpacing 7.9% revenue growth. Do not carry the 32.0-to-37.2 figure into valuation as a margin-pressure input."
analyst_note: "Two corrections matter most downstream. First, run 1's materials-cost pass-through finding is withdrawn: on a consumption-matched basis gross margin improved about 212bp FY25 to FY26, and the real EBITDA driver was employee cost and other expenses outpacing revenue. Second, LBF-2 is only HALF resolved: the raw-material component, 51% of the increase, has an external price-driven explanation matching a 60.2% rise in CIF raw-material imports; the finished-goods plus WIP component, 49% of the increase and growing about 5.5x faster than revenue, does not. Treat LBF-2 as open, not closed, pending FY27 evidence."
