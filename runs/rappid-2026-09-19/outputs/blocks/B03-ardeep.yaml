analyst_note: "Two findings not in B02's Top 15 deserve Halt-1 weight. First, the IPO-proceeds redirection mechanism is described two different ways across five citations (EGM per MD&A/Note 32 vs Postal Ballot per Board's Report x2 and the Secretarial Audit Report) - the Secretarial Auditor's own report sides with Postal Ballot, suggesting MD&A/Note 32 carry stale draft language, the same rolled-forward-text defect B02 found elsewhere. Second, Note 36's own printed ratios for Trade Receivables Turnover, Inventory Turnover and ROCE do not reconcile to the base-value table in the same note (verified by direct recomputation), and the MD&A states a third, different value again for the first two - meaning downstream Section 1B/FTTCP inputs drawn from Note 36 as printed should be treated as unreliable and recomputed from the face financial statements instead, which this report has done for FY26. Both findings reinforce rather than contradict B02's core cash-conversion and disclosure-quality flags."
