net_narrative_effect: "complicates"
analyst_note: "The headline test is the 9% realisation rise. On VRL's own Rs 2 = 1% rule a Rs 8-9 pump rise explains 4-4.5% (DERIVED), so about half of the rise is not fuel, and peers report smaller realised hikes. VRL margin far above peers is verified as a level but is not like for like because VRL owns its fleet and hired-fleet peers do not. TCIEXP's 2021-22 note (300 bp on diesel repricing) is the one peer precedent for a fuel-linked margin jump. Delhivery Q1 FY27 and Q2 FY27 were read by keyword windows, not end to end, and have no page anchors. Delhivery PTL margins for FY27 quarters were not found. TCI is the only peer that names VRL, and it says VRL is taking express volume on lower price."
