analyst_note: "Loop 1 applied A5 grafts F1, M1, M2 and style notes. GOCL earns its profit from interest on a Rs 3,071 Cr loan book; operating segments lose money and the core loss widened to Rs 15.35 Cr. Interest arrives in cash, but 70-80% of it was re-lent to the same book in H1, so net cash recovered was Rs 22 Cr (group). CFO is positive only via a one-off receivable release with an unnamed payer, so cash conversion stays indeterminate with a negative direction. The position is a momentum HOLD under 8A; the Chandelier level is not on file, so the only exit rule is untested. Ruling 42 matters more than this print: the HNPCL purchase multiple cannot be computed from the filing; the swap ratio and HNPCL financials sit in the Explanatory Statement this run did not receive. The Rs 1,096 Cr HNPCL guarantee would become GOCL debt on sanction (inference). EMS capex evidence is Rs 0.76 Cr capitalised; capacity is not stated. Steps 6.5 and 7 deferred; no fair value touched."
