  - "Two Section 197 director-remuneration breaches in the same year (one pending shareholder ratification), a ~7-month Nomination & Remuneration Committee understaffing, and Rs 500L+ guarantees plus 12.2%-of-revenue RPT sales routed through two non-consolidated, director-interest LLPs."
  - "A 10.6x unexplained goodwill jump, zero doubtful-debt provisioning on a tripling receivables book, and a negative-net-worth subsidiary (TNS Pharma) that received fresh capital in the same year its losses widened, with no impairment disclosed."
best_fit_strategy: "GARP (WATCHLIST)"
one_line_verdict: "A real, audited growth story whose reported cash conversion is an accounting artifact, best read as a GARP watchlist name pending a cash-flow and subsidiary-delivery resolution."
analyst_note: "The single highest-value finding this stage added beyond B02 is arithmetic, not interpretive: re-summing the consolidated cash flow statement's own printed lines without the undisclosed 'Changes in Working Capital Facilities' addback flips CFO from positive to negative in BOTH FY25 and FY26, and the FY25 recomputed figure matches the FY25 AR's own audited number exactly. This should be treated as effectively confirmed, not merely alleged. Two corrections to carry forward: (1) B02's finding 10 (Shareholders Funds mismatch) is downgraded to NO ISSUE, the gap is Minority Interest correctly grouped under Shareholders' Funds on the balance sheet face; (2) a new defect was found, the AR's FY25-comparative promoter shareholding table duplicates the FY26 numbers verbatim, which is mathematically inconsistent with FY25's own share count, meaning the AR resolves the B00/B01 promoter-percentage gap (62.85% at 31-Mar-2026, filed) but introduces a fresh comparative-table defect that should be checked against the next filing."
