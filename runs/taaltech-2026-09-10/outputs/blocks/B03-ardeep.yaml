analyst_note: "The Note 41 error and the CARO 3(iii)(a)/(d) contradiction both sit inside audited/signed documents, not voluntary MD&A - they are more decision-relevant than any single economic number because they undermine trust in the filing's self-checking mechanism generally. The Karbhase/Vishkul directorship overlap (new this stage, sourced from the AGM notice's director-profile annexure rather than the RPT note) converts B02's 'unbenchmarked loan' finding into an independence question: the Audit Committee member whose profile discloses the most related directorships also sits on the loan counterparty's board. Growth is genuine and three-quarters deep (Q3FY26 through Q1FY27), but this AR itself only covers through Q4FY26; Q1FY27 postdates the filing and its absence from the narrative is a timing artifact, not an omission. The Q4-within-FY26 sequential jump, however, was addressable by this AR and was not addressed - that silence is a choice."
