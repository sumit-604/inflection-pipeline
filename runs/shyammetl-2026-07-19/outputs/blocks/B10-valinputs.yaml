rating_wc_quote: "Working capital management has been prudent. The group sells mainly on advance/letter of credit basis, leading to low receivables of 15-30 days. Inventory, at 70-90 days, mainly comprises raw materials. While the group does not have captive iron ore mines, its proximity to raw material sources and setting up of railway siding gives it access to iron ore at competitive rates because of lower logistics cost, thereby supporting profitability. (CRISIL Rating Rationale dated November 05, 2025, p.2, Key Rating Drivers Strengths section)"
