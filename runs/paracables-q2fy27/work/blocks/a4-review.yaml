analyst_note: "Two readings of this print. Bull: the tariff damage has gone; margin is back to 7.3% from 1.3% with no other-income help; receivable days fell from 79 to ~66; the cash outflow came from a chosen payables paydown funded by equity, so it reverses. Bear: the whole margin gain is an unexplained other-expense reversal while gross margin fell; operating cash was negative for a second half-year; issue money read as plant funding paid suppliers; the plant shows ~Rs 33 Cr of Rs 300 Cr with loans not arranged. The observation that separates them is FY27 full-year operating CFO (May-2027), with CWIP plus advances at 31-Mar-2027. Loop 1: US commitment 5 rescored PARTIAL (exports up QoQ, far short of a strong pull), so credibility is 66.7%, Grade B, provisional on n = 3 and 33-75% on rescoring; the US-only export split settles it. ROCE 13.7% is a pre-build reading (~10.1% with the plant capital). Warrant conversion at Rs 42 vs ~Rs 56 is arbitrage; non-conversion is the signal. The data-centre inconsistency was withdrawn. No status change proposed."
