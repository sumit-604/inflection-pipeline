flags:
  - "Cement roofing (53% of revenue) is built on chrysotile asbestos fibre, a structural long-run regulatory and reputational risk not resolved by current compliance"
  - "ATUM Solar Roof revenue is undisclosed; its two related subsidiaries (Visaka Green, Atum Life) are loss-making, and Atum Life's net worth (Rs0.32cr) already sits below its Rs7.795cr cost of investment"
  - "FY26 PBT and PAT include a one-off Rs59.70cr exceptional land-sale gain; underlying PBT before exceptional items was Rs50.55cr, not the headline Rs110.25cr"
  - "Dealer count and dealer-channel revenue share both declined in FY26 (5,246 to 4,974; 62.91% to 59.91%) with no management explanation found in the AR"
  - "CARE rating outlook stayed Negative in FY26 despite improved leverage metrics, unresolved credit overhang"
  - "The manifest's single 'Building materials' sector cap does not fit the blended entity: synthetic yarn (15% of revenue) is a textiles-sector cyclical converter, not a building-materials line, and needs separate Section 1B treatment"
