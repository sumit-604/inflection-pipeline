rating_wc_quote: "Entero group's cash flow from operations has been negative since the first full year of its operations in FY19 due to the intense working capital requirement and modest yield nature of its business. The net cash flow from operations remained negative at INR769 million in FY25 (FY24: negative INR366 million) due to the increase in working capital requirement with growth in the scale of operations. The management expects the cash flow from operations to be positive by the end of FY26. The group's net working capital cycle on sales basis marginally elongated to 78 days in FY25 (FY24: 75 days) but remained in line with the peers in the pharmaceutical distribution segment. The cash flow from operations and free cash flow are likely to remain negative, in the agency's view, in the near term. However, the reduction in the goods and services tax rates to 5% in September 2025 from 12%, and management's cost-efficient strategies may turn the operating cashflows positive by end-FY26. (India Ratings, ratings.pdf page 3, Liquidity section, 2025-12-03)"
