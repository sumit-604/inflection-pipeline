industry_cross_read:
  demand: "All three peers report a strongly positive demand backdrop (record revenue/profit quarters) across the same window IEX ran below its own volume guidance in June and July 2026, making IEX's misses read as more company/segment-specific than macro-driven."
  pricing_inputs: "BSE explicitly documents premium/margin compression from volatility swings; all three peers show volatile, weather-like treasury/other-income lines -- a structurally common mechanism across the peer group, not an IEX quirk, though no peer discloses the PBT-share trend to compare directly against IEX's own."
  capex_cycle: "Industry-wide capacity race, not a lone expander: BSE ~Rs300cr+ capex in six months plus rising tech spend, CDSL tech cost 4x in three years now exceeding employee cost, MCX continuous product/risk-system investment across all four calls."
