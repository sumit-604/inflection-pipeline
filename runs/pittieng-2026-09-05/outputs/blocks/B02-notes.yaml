receivables_trend: "improving -- consolidated net trade receivables Rs 206.25 Cr FY26 vs Rs 254.55 Cr FY25 (-19.0%) against revenue +12.2%; implied DSO ~39.4 days FY26 vs ~54.5 days FY25; ageing 'not due' mix 81.2% FY26 vs 80.2% FY25 of gross; >6-month overdue 0.48% FY26 vs 0.31% FY25 of gross (both immaterial); Trade Receivables Turnover Ratio 6.90x->7.87x (Note 6B, PDF p.105-106; Note 25.21, PDF p.90 standalone). Receivables themselves improved; the FLAG-CASH driver is the broader working-capital reversal (inventory +20.0%, trade payables -25.7% including Rs 83.85 Cr TReDS-financed, Note 25.7B) and consolidated net debt +26.3%, not receivables quality."
restatements_found: ["None in the financial notes. PP&E useful-life/residual-value change (Note 25.12) and first-year hedge accounting adoption (Note 25.7B) are both explicitly NOT restated, applied prospectively per Ind AS 8 / Ind AS 109. Prior-year figures were 'regrouped/rearranged... to conform with current period's classification' (Note 25.19 standalone / 25.17 consolidated) -- a presentation reclassification, not a restatement, per the company's own wording. (Unrelated: the BRSR sustainability section separately restates FY2024-25 fuel-consumption figures; outside the Notes to Financial Statements scope.)"]
going_concern_language: "NONE -- only standard audit-report and Directors' Responsibility Statement boilerplate ('prepared on a going concern basis'); one affirmative Directors' Report statement that no significant/material regulatory or court orders impact going concern status; standalone CARO clause (xix) confirms no material uncertainty on 12-month liability coverage; no emphasis-of-matter or qualification in either audit opinion."
analyst_note: "The three most decision-relevant absences (goodwill impairment assumptions, customer identity/end-market split, cumulative capex-programme total) sit in a document that is otherwise unusually granular (gratuity actuarial sensitivities, ESOP fair-value model inputs, hedge ineffectiveness to the lakh). That contrast, not any single absence alone, is the Pass 3 pattern worth carrying forward: the notes are thorough everywhere except on the three questions the transition thesis most needs answered. Separately, the FY26 PAT decline (LBF-2) is fully explained by a tax-rate/DTL-reversal mechanism with no exceptional items -- treat it as a timing item, not an operating red flag, but confirm the multi-year unwind path before assuming it self-corrects. The TReDS finding (Note 25.7B) should feed FTTCP's cash-conversion analysis directly: reported payables-turnover improvement is partly a financing-structure effect, not pure deleveraging."
