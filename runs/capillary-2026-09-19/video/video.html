const root = document.getElementById('root');

allPages.sort((x, y) => x.a - y.a);

function sceneAt(t) { for (const sc of TL.scenes) if (t >= sc.t0 - .3 && t < sc.t1 + .3) { } return null; }
function setFrame(f) {

  TL.scenes.forEach((sc, i) => {
    const g = scenesG[sc.id]; const fin = i === 0 ? 1 : P(t, sc.t0 - .3, sc.t0 + .3); const fout = 1 - P(t, sc.t1 - .3, sc.t1 + .3);
    const a = Math.min(fin, fout); if (a <= 0) { g.style.display = 'none'; return; }
    if (!updaters[sc.id]) { g.style.display = ''; updaters[sc.id] = SCENES[sc.id](g, sc); }
    g.style.display = ''; const eaIn = ease(fin); g.setAttribute('opacity', Math.min(eaIn, ease(fout)));

  if (show) { const n = page.lines.length; page.lines.forEach((l, i) => { capT[i].textContent = l; capT[i].setAttribute('y', n === 1 ? 1030 : 1006 + i * 54); capT[i].setAttribute('fill', page.spk === 'Meera' ? C.lilac : page.spk === 'Ramesh' ? '#FFD98A' : C.text); });
    if (page.spk !== 'Narrator') { op(pill, 1); pillT.textContent = page.spk.toUpperCase(); pillR.setAttribute('fill', page.spk === 'Meera' ? C.lilac : C.gold); } else op(pill, 0); } else op(pill, 0);
