analyst_note: "The margin contradiction (Quest Flow Controls at 23-25% EBITDA in the same nonferrous defence/marine niche) is the single highest-value peer finding this run: it reframes Rappid's 12% margin point as a testable company-specific outcome rather than an industry floor, which matters directly for the FY27 margin-recovery trigger (B05 priority 5) and for how much credit the NAB-price-shock excuse should get in Role 3. The demand-side corroboration is real but does not extend to sizing the naval/marine pocket specifically - even KSB, with a live marine push and full analyst coverage, cannot quantify that opportunity in rupees, which should lower (not raise) confidence in any bottom-up marine TAM estimate produced later in this pipeline."
