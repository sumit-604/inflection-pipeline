valuation_methods:
  primary: {method: "Relative valuation (EV/EBITDA on normalised earnings against AVALON, KAYNES, SYRMA)", why: "Standard cross-sectional approach for an EMS contract manufacturer. Reported EPS is earn-out inflated this year, so normalised earnings must anchor the multiple."}
  secondary: {method: "DCF with explicit working-capital-drag modelling", why: "Positive but volatile FCF. The four-year NWC deterioration behind the Gate 0 AVOID must be modelled as a cash-conversion haircut, not assumed away."}
  tertiary: {method: "Sum-of-the-parts (India standalone against US Cyient DLM Inc and Altek)", why: "The two entities are moving in opposite directions (standalone PAT -26.6% against consolidated +7.65%); a blended multiple hides this."}
  not_applicable: ["Asset-based or replacement cost (PP&E is only about 10-11% of total assets)", "Dividend discount model (no dividend policy evidence; post-IPO reinvestment phase)"]
irrelevant_ratios:
  - {ratio: "Consolidated revenue growth taken alone", why: "Nets off two entities moving in opposite directions; must be split standalone against consolidated"}
  - {ratio: "Reported net profit margin FY26", why: "Inflated by a one-off Rs195.75mn earn-out reversal; normalised PAT fell 24% YoY, the opposite signal"}
  - {ratio: "Single-year ROCE snapshot", why: "The company attributes the multi-year decline to WC and capex investment largely completed, an unproven forward claim not yet evidenced by the FY26 11.4%"}
  - {ratio: "DSO in isolation", why: "The working-capital blowout is inventory-driven (DIO); receivables actually fell YoY, so DSO alone would miss the real story"}
  - {ratio: "Gross or operating margin trend without a cost-structure split", why: "The direct material cost ratio dropped sharply from FY25 to FY26 mechanically, because Altek's different cost structure entered the consolidation mix, not because of India efficiency gains"}
must_track_metrics:
  - {metric: "Standalone (India parent) revenue and PAT, reported separately", healthy: "Growing YoY, narrowing the gap to the consolidated trend", red_flag: "Continued double-digit decline while consolidated is reported flat or up"}
  - {metric: "Net working capital days (consolidated)", healthy: "Falling toward the peer range of 60-125 days", red_flag: "Any further rise beyond the 161 days of Q1 FY27 without matching inventory-turnover improvement"}
  - {metric: "B2S revenue as a percentage of total", healthy: "Moving from about 6% (FY26) toward double digits (FY27 target)", red_flag: "Flat or declining despite management's stated target"}
  - {metric: "Normalised EBITDA margin", healthy: "Trending toward the company's stated mid-teens long-term target", red_flag: "Sustained decline below 9%"}
  - {metric: "Top-customer concentration (consolidated and standalone)", healthy: "Continuing to fall from 55.71% and 70.54%", red_flag: "Re-widening"}
