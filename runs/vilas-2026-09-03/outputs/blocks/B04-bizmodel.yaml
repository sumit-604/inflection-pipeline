valuation_methods:
  primary: {method: "EV/EBITDA on normalised spread and utilisation", why: "Strips out the FY26 CRGO price trough and Unit-3 ramp fixed-cost drag; aligns with the converter destination-multiple framework Section 1B governs"}
  secondary: {method: "Segment/SOTP cross-check pricing CRGO core separately from nano/radiator/copper/bushings optionality", why: "The new lines carry different proof status; blending them into one multiple hides unresolved optionality (Amendment 18)"}
