analyst_note: >
  Three passes converge on the same shortlist: the promoter/RPT cluster (Vasudeva Commercials
  disappearance, NM Merchantiles purchase and stake growth together, the customs surety) and the
  capex-funding cluster (zero term debt, FY26 PP&E/CWIP activity actually falling YoY despite
  rising commitments) are the two threads that matter most for LBF2 and LBF3 respectively. Neither
  is an accounting-quality problem on the notes' own terms; both are business/governance questions
  the AR raises but cannot answer, and both are named explicitly for the live-web verification
  stage. The Note 35 AA/DFIA table-footnote gap found in the pattern pass is genuine but low
  stakes; it is carried as a question, not a red flag. The Vasudeva Commercials finding is the one
  item rated RED FLAG because the AR gives no path to an answer at all, unlike the RPT/capex items
  which at least have partial visibility.
