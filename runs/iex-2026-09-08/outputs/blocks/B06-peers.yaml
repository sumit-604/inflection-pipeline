industry_cross_read:
  demand: "All three peers report a strongly positive demand backdrop (record revenue/profit quarters) across the same window IEX ran below its own volume guidance in June and July 2026, making IEX's misses read as more company/segment-specific than macro-driven."
  pricing_inputs: "BSE explicitly documents premium/margin compression from volatility swings; all three peers show volatile, weather-like treasury/other-income lines -- a structurally common mechanism across the peer group, not an IEX quirk. On fee realisation specifically, peers split into three distinct response types (quantify-and-decompose: MCX; name-one-cause-unquantified: BSE; refuse-to-discuss: CDSL), none of which matches IEX's own three-different-unreconciled-answers pattern."
  capex_cycle: "Industry-wide capacity race, not a lone expander: BSE ~Rs300cr+ capex in six months plus rising tech spend, CDSL tech cost 4x in three years now exceeding employee cost, MCX continuous product/risk-system investment across all four calls, including its newly-incorporated coal exchange subsidiary."
