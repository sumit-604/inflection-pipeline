verdict_basis: "Established listed Indian promoter group with a clean SEBI/court record in available search, no pledge disclosed and a corrective Note 50 recovery, offset by rising related-party purchases (32.0%) priced on assertion, zero dividend with 212.39 Cr net cash, repeated late filings, heavy parent cross-board overlap and CFO/board churn; no CONCERN-level evidence"
analyst_note: "Verdict is CAUTION, not CONCERN, because nothing found is adverse about the Rathi group itself; the adverse items are structural (captive group trade, cross-board control) and inherited (Note 50 under Clariant/Heubach). The decisive minority test is the transfer price on group goods: 159.15 Cr purchases and 191.40 Cr sales with no margin by party. Watch the H1 FY27 Note 40 share and any change to HLD1 purchases. Rs 411 inter-se price vs Rs 602.03 offer price harms no existing minority holder directly, but signals the group does not mark its own stake at the offer price. Merger or delisting text: none found anywhere (AR Note 44(vi), Secretarial Audit p.30; web). Public float 29.74%, headroom 4.74 points over the 25% floor; a future creeping rise or delisting is the tail risk. CMP conflict (386 vs 455.25) unresolved."
