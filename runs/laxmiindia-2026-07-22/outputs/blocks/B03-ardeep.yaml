flags:
  - type: FLAG-CASH
    reason: "Carried forward from B02 and reframed at Phase 3: CFO is structurally negative (a normal Ind AS 7 artifact of a growing NBFC lender, not itself the cash-quality concern), but DA/ARC upfront gain-on-sale drove 76.1% of PAT (FY23), 67.6% (FY24), moderating to 26.8% (FY25) (Note 52.2/98(a)); the underlying ARC-transfer volume accelerated >36x FY24-FY25 including SMA/pre-NPA accounts for the first time (Note 98(c)); FY26 ARC Security Receipt investments grew 5.4x vs ~31% loan-book growth, now 8.74% of total assets ([FY26RESULTS] Balance Sheet); and the Note 98(c) NPA-transferred-to-ARC figure (Rs109.54cr FY25) remains unreconciled against the Note 75 Stage-3 Sold-to-ARC line (Rs0.61cr FY25), a ~180x gap independently verified at this stage. Cash conversion quality remains INDETERMINATE pending management reconciliation; caps at PROCEED WITH CAVEATS per Master v3.3."
  - type: FLAG-PROMOTER-PRELIM
    reason: "Two individual promoters (Prem Devi Baid, Aneesha Baid) diluted materially via the Offer for Sale component of the IPO itself (3.38%->0.96% and 5.41%->1.91% respectively); combined promoter-family board control is 43% of seats (MD + 2 WTDs, one family); combined promoter-family remuneration is ~16.3% of FY25 PAT; a two-year-plus unresolved property-title item involves the MD personally alongside a Rs30mm related-party property purchase agreement (FY23) not yet fully executed by FY25. Mitigants: no promoter shares pledged, no wilful-defaulter/fraudulent-borrower status, no post-listing insider selling evidenced in documents reviewed (listing is under 12 months old at run date). Full promoter verdict reserved for B08."
