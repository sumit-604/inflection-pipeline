analyst_note: "GOOD+ at core 79 sits one point under EXCELLENT. Block D (19/20, net cash, 3.66 current ratio) and Block C (16/20) carry the score. PAT CAGR 30.3% is a low-base effect off 4.10 Cr, so C2 and C4 flatter growth. Block B is 18/20 only because the 3-year FCF window (FY24 to FY26) is the sole one with capex on file; FY24 CFO/PAT was 1.84x and FY25 1.16x, so conversion is lumpy. Block A (13/20) rests on 3 years of ROCE: 19.84% and 14.97% and 20.06%. Three inputs decide the class and are not held: pre-FY24 balance sheets and cash flows, and the Sep 2023 shareholding pattern. E2 alone (score 0 now, 5 on the Mar 2024 proxy) moves the class from GOOD+ to EXCELLENT. Several band edges sit within 0.2pp (A1 19.84 vs 20, A2 14.97 vs 15, M3 20.06 vs 20). Moat count is 5 with M9 and M3 both on mechanical edges."
