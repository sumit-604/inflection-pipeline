red_flags:
  - "HIGH: REC decline explanation names the wrong side of the market: buyer-side 'confusion' story (Q3FY26 p.8, Q1FY27 p.41) directly contradicts the company's own filed Power Market Update three weeks earlier ('Sell bids declined by 86.1% YoY, leading to a rise in clearing prices,' Q1FY27/Jun'26 filing p.3)"
  - "HIGH: Market-share disclosure precision degrades every quarter as the coupling threat rises: 84% full product split (Q2FY26 p.17) to 83% with an unexplained TAM restatement 35% to 45-50% (Q3FY26 p.16) to no figure (Q4FY26) to a bare 80-85% range (Q1FY27 p.6)"
  - "HIGH: Day-ahead volume, the segment market coupling directly threatens, in outright YoY decline in two of the three most recent months (June -6.6%, July -7.7%), growing at less than half the company average even in the quarter that did grow"
  - "HIGH: Fee-competition/price-war question evaded twice across two quarters: 'Let us talk about peace' (Q2FY26 p.18) with no substantive answer; the pricing half of the identical question left unaddressed entirely (Q1FY27 p.34-35)"
  - "HIGH: 'Things will definitely go in our favour' (Q3FY26 p.7) falsified 14 days later when APTEL dismissed IEX's appeal for want of standing and CERC then issued draft coupling regulations naming Grid India as MCO; the record before this run credited only the timing half of the same answer"
  - "HIGH: Fee realization compression (4.16 paise/unit Q1FY27 vs 4.33 paise/unit Q1FY26, computed from filed standalone revenue and volume) unreconciled across three quarters of direct questioning; mechanical driver (TAM's faster growth at a lower per-unit fee) quantified this run but never named by management"
  - "HIGH: RTM growth guidance (25-30%, Q1FY27 p.29) falsified within weeks by the company's own July (+10.2%) and August (+10.6%) Power Market Updates"
  - "MEDIUM: Coal exchange opportunity size revised ~50% upward (80mn to 120mn tonnes) within six months with no bridge, internally inconsistent within the same Q1FY27 session, and the incumbent-exclusion rule rests only on management's characterization of a text not in this corpus"
  - "MEDIUM: CFO's ROE claim (42-44%) does not fully reconcile even on average standalone equity: 39.4% (PAT Rs473.71cr / avg of Rs1,098cr and Rs1,307cr) vs 36.3% on closing equity; EPS Rs5.33 quoted is standalone, cited beside consolidated PAT figures"
  - "MEDIUM: Two different revenue figures for the same FY26 and Q1FY27 periods inside one presentation: CMD cites Rs747cr/Rs202.8cr (matching filed consolidated total income of Rs746.95cr/Rs202.81cr); CFO and the investor presentation slide cite Rs745cr/'almost around Rs201cr' for the same two periods"
  - "MEDIUM: Customer concentration (50-60% buyer, ~40% top-10 seller) disclosed only at the final question of a two-hour analyst meet, paired with a stability claim asserted then partly withdrawn in the same answer"
  - "MEDIUM: DAM coupling worst-case impact (20-40% of DAM share) volunteered once in opening remarks, not repeated or effectively denied ('I don't see any loss') when asked directly later in the same session; appears in no audited filing"
  - "MEDIUM: Green market growth decelerated from +23% (FY26) to +6.3% (Q1FY27) to -1.2% (June, filed three weeks before the call), and the 24-Jul-2026 call describes green as 'again become substantial' without naming the deceleration visible in the company's own most recent filing"
  - "LOW: Non-operating share of consolidated PBT rose from 23.4% (FY26) to 29.8% (Q1FY27), computed from filed results, never raised by management or any analyst"
  - "LOW: Admitted-but-unquantified fee incentives on TAM and REC contracts sit beside 'asset light high-margin platform business' framing in the same call, without reconciliation"
  - "LOW: Three 2023 product launches (HP-DAM, HP-TAM, Ancillary Market) are management-admitted failures for want of liquidity, never connected by management to the credibility of three further pending product launches"
dropped_triggers:
  - "REC market as a forward growth trigger: framed positively through Q2FY26-Q4FY26; by Q1FY27, with volume down 81.4% YoY and the company's own filings showing a seller-side collapse, framing shifts to a buyer-side 'confusion' story that contradicts that filed evidence, and the trigger disappears from the growth narrative rather than being explained"
  - "Carbon-market materiality caveat dropped: Q2FY26 named the caveat that actually sizes the opportunity ('If everybody is complying, then there's no trading,' p.19); this caveat is not repeated in Q3FY26, Q4FY26, or Q1FY27 even as the stated start date is pulled forward by roughly a year (FY27/28 to 1-Oct-2026)"
timeline_slippages:
  - "Term Ahead Market extension to 11 months: pending 'more than two years' as of Q1FY27 with no new timeline given (Q1FY27 p.41)"
  - "Green RTM / Peak DAM / Peak RTM petitions: identical 'order reserved' language repeated across all four transcripts with no resolution"
  - "Market coupling implementation: ordered 'by January 2026' by CERC (an external regulatory timeline, not a management promise), still in draft-regulation/stakeholder-comment stage as of Q1FY27, with Grid India itself raising fresh operational objections in both the April and July 2026 sessions"
  - "Buyback: 'definitely considering it' (Q4FY26 p.11) restated as 'will consider it in future' (Q1FY27 p.30) with no new information across two quarters"
analyst_note: >
  Carbon timeline moved the opposite direction from every other slippage
  tracked in this report: it ACCELERATED (Q2FY26 '1-1.5 years' -> Q3FY26
  'FY27 or FY28' -> Q1FY27 'within this calendar year... BEE wants
  1-Oct-2026'), while the one caveat that actually sizes the opportunity
  ('if everybody is complying, then there's no trading') was dropped after
  Q2FY26. An accelerating timeline with a shrinking caveat is itself worth
  flagging to Stage 6/11, not just the more familiar slipping-timeline
  pattern. Separately, this run downgrades two claims from "regulatory fact"
  to "management characterization" (the APTEL gloss, carried over from run 2,
  and newly the Coal Rules exclusion mechanism) because neither underlying
  text is in the corpus (input_gaps: regulatory_order_text, HIGH). Both
  should be pulled before valuation weight rests on either the coupling
  outcome or the coal-exchange opportunity size.
