analyst_note: "Two separate markets sized (India-licensed Trust Services, Market A; global PKI-adjacent Enterprise Solutions, Market B) and combined, per instruction. Conservative TAM took the lower of divergent methods each time (Rule 6): Market A bottom-up over top-down (8-9x gap, likely scope mismatch between licensed DSC issuance and broader 'digital signature' reports); Market B peer aggregation over top-down (7x gap, likely embedded/OEM PKI spend inflating generic reports). Growth RATE triangulates far better than absolute SIZE across both markets. SAM's geography (40%) and capability (70%) filters on Market B do the heavy lifting toward MODERATE runway, reflecting real execution-capacity gaps against DigiCert/Entrust/Microsoft/Okta rather than weak underlying demand. The single most important number for Stage 11: SOM-implied CAGR (24.5-25.1%) is an M&A-inclusive ceiling, not an organic base case, and sits above the 15-18% organic guide."
