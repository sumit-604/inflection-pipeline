analyst_note: "Scored sparsely on purpose. The central forward story (brand mix 14.11% FY26 to 19.03% Q2 FY27, segment result about 33% vs 3-6% for market entry) is largely the existing Honeywell moat, so it sits in H2 at 2.0 and not as new emerging evidence. WOZOYO traction, BSNL, Infinova, STQC readiness and the 40-42% brand gross margin are claims (0.7x or register). Brand segment result in the filing is 32.7-34.2%, not 40-42%. I1 and I2 score 0 (no talent-economics leg; no named competitor sacrifice). Capex-embedded growth is NOT FOUND (fabless, own capex Rs 3.30 Cr FY26); the management-claim cross-check of FY28 BSNL+Infinova+WOZOYO is 29-35% of FY26 revenue and is not capex-derived."
