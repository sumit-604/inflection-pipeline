analyst_note: >
  The VIDYAWIRES winding-wire margin contradiction (Q6) is the single most
  load-bearing finding: two quarters, one directly comparable peer, a 5-6x
  gap against Susan's disclosed 24.39% figure. Flag for resolution before any
  Section 1B margin-bridge or destination-mix input keys off that number as
  sector-typical. The capex lead-time evidence (DYCL, DIACABS) independently
  reinforces the existing B05 kill-signal on the Feb-2027 capacity trigger;
  treat that trigger's conviction as no higher than M absent new evidence.
  The HT/MVCC margin question is genuinely mixed, not clean either way:
  DIACABS' own numbers put Susan's ~20% claim closer to an extra-high-voltage
  band than a true medium-voltage band, a magnitude concern to carry forward
  rather than a confirmation or contradiction. No peer mentions Susan by
  name in any transcript.
