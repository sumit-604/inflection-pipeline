verdict_basis: "Clean legal/criminal/auditor record on both erstwhile promoters and acquirer, but a coherent extraction pattern (100% OFS IPO cash-out, remuneration doubled to 14.3% of PAT in the same cycle the control sale was negotiated, flat dividend, 2.13% institutional check) plus an unresolved 2024 SEBI/exchange fine claim keeps this at CAUTION rather than TRUSTWORTHY; minority treatment at the exit was favourable (open offer priced above promoters' own sale price), so not CONCERN/AVOID."
analyst_note: "Two populations matter for downstream stages. The erstwhile promoters' FY26 numbers (remuneration, RPT, shareholding) are what feeds valuation and are CAUTION-rated per above. The incoming Indo Borax/Zenrock/EAAA structure has real credibility inputs (Edelweiss-backed capital, a genuine outside professional CEO, a 45-year-old operating acquirer) but is an unproven, <18-month-old fast roll-up platform with no track record of how it runs an acquired company - synthesis should treat the ownership change as a live, not yet resolved, variable rather than a settled positive. The Rs103.22 vs Rs157.27 price gap is a SEBI Reg 8 mechanical outcome, not evidence of minority harm; do not read it as a red flag."
