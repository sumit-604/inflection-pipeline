analyst_note: "Pass 1 covered every standalone note (1-40, pp.125-177) and
  every consolidated note (1-44, pp.189-259) plus the consolidated
  Auditor's Report and its four Key Audit Matters (capitalised
  intangibles, revenue recognition, goodwill impairment, Kognitiv business
  combination). The dominant theme is a young, IPO-fresh (21-Nov-2025)
  group whose standalone entity is structurally a related-party
  transfer-pricing vehicle, whose consolidated earnings this year are
  flattered by a large one-time indemnity gain and concentrated in one US
  subsidiary, and whose balance sheet just absorbed one acquisition
  (Kognitiv) with a second (SessionM) closing five days after sign-off.
  None of this is hidden - disclosure architecture is generally strong -
  but a normalized, ex-exceptional, ex-one-subsidiary-concentration view of
  earnings is materially different from the reported INR 523.88mn
  consolidated profit."
