  - "TReDS/supplier-finance balance embedded in trade payables nearly doubled YoY (Rs 44.36 Cr -> Rs 83.85 Cr); the reported payables decline partly reflects financier-intermediated credit, not only genuine deleveraging."
  - "Goodwill (13.8% of consolidated net worth) has no CGU-level impairment disclosure anywhere in the notes."
  - "Rs 4.91 Cr GST dispute (FY2018-2023) appears only in the consolidated notes, invisible to a standalone-only reader."
  - "No customer names, no end-market segmentation, and no cumulative capex-programme total anywhere in the notes, despite these being the items most load-bearing for the transition thesis."
