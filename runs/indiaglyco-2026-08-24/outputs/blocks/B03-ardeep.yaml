analyst_note: "Phases 1, 4, 6 converge: the auditor's KAM determination, management's MD&A, and the Corporate Governance Report all independently under-disclose or misstate FX risk, in a document that otherwise reconciles exactly everywhere checked. With B02's Red Flag, this argues the FX gap is a document-wide blind spot, not an isolated notes lapse. Separately, every backward growth/quality metric describes a consolidated entity that stops existing on 1 Sep 2026; valuation must rebuild the earnings base from BSPC alone, not extrapolate consolidated trends."
