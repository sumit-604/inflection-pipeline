analyst_note: "Three findings this stage were not visible to the Notes-only Stage-2 triple-pass and should carry forward: (1) two subsidiary-level CARO clause (xvii) cash-loss remarks, sourced from the Auditor's Report not the Notes, showing Visaka Green's FIRST cash-loss year; (2) a working-capital-driven component (~25%) of the FY26 operating-cash-flow improvement, computed directly from the cash-flow statement's line items, that may not repeat in FY27; (3) a reproducible, three-times-repeated overstatement of the AR's own disclosed 'interest coverage' ratio relative to its own stated EBITDA methodology (true ex-exceptional coverage ~4.51x vs the disclosed 6.32x). All Stage-2 Top-15 findings were independently re-verified against the primary source with zero further discrepancies; one additional page-anchor correction was found (Note 8(a)/(b) consolidated receivables ageing sits on p.245-246, not p.242-243). The Phase-6 Quiet Abandonment finding (ATUM narrative vs Atum Life subsidiary reality) is the single most thesis-relevant finding in this stage for a transition-alpha read, because it is exactly the kind of front-matter overclaim the framework's Quality Ladder and Recognition Gap logic is designed to catch before Halt 1."
