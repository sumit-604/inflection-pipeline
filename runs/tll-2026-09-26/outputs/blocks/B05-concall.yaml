analyst_note: "The most useful finding this stage adds beyond B02/B03 is a timing one: the 'triple in three years' and the specific subsidiary peak-revenue figures (Rs 40/70/200/10/20 Cr) all appear for the first time in the Aug-2026 deck, filed after FY26's weak audited subsidiary numbers (AOC-1) were already locked in, and neither claim was carried into the FY26 AR's own Outlook section filed under the same management about four weeks later. Read together with the standalone-revenue mislabelling found in the H2/FY26 deck and the 'Lorem ipsum' placeholder text on the very pages naming the subsidiary targets, the pattern across the four decks is one of promotional material running ahead of, and less carefully checked than, the statutory filings from the same management in the same window. This does not itself say the targets are false; it says the AR, not the deck, is the more reliable register of this management's true near-term expectation, and the deck's numbers should be treated as upper-bound aspiration pending a milestone path."
