analyst_note: "Restatement is nil (Annexure VI Part A p.296) but that is not comfort on cash. Two points a later stage cannot rebuild from the fields. First, three-year operating cash flow is 25.2% of profit only because the 1,118.53 ECFPL consideration to the promoters sits in FY25 operating activities; reclassified it is 63.2% (derived). Show the range, not one figure. Second, the 123.0 INR per USD on the largest receivable class may hide an intra-group FZ LLC balance of 377.27 (a near fit of 10.4, not proof). Mar 2024 ageing and FY24 cash flows are special-purpose combined figures and should not anchor trend claims. The CARO 657.27 remark is FY2025 per Prospectus p.32 (outside the notes window); p.297 alone does not fix the year. FY26 revenue fall matching the two FY25 customers is inference only."
