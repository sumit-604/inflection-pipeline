analyst_note: "The dominant pattern across all three passes is one story, not four: core Cash Management revenue and profit are contracting, its receivables are aging into the 1-2yr overdue bucket at 8-16x prior levels, and the SA loss allowance closest to that deterioration was released, not built. The Group-level LBF-1 cash-conversion headline (CFO > PAT) is arithmetically clean but should not be read as an earnings-quality signal on its own; it coexists with, not despite, the provisioning and receivables pattern. A second, lower-priority pattern is capital-allocation sequencing: dividend up 39.2%, a buyback now underwater, and two acquisitions (Securens closed, FSS in progress) funded while cash roughly halved and one forward obligation (FSS Rs550m) is absent from the commitments note. Neither pattern implicates revenue-recognition or related-party mechanics, which read clean throughout."
