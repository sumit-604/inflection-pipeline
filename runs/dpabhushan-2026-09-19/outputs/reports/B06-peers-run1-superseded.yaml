industry_cross_read:
  demand: "Peer set is broadly strong-with-short-lived-dips (SENCO under-guides and beats every quarter; PNGJL beats and raises); short dips (Sep-2025, late-May-2026, Adhik Maas) are consistently days-to-weeks, not quarter-defining, and followed by quantified strong recoveries. This complicates DPABHUSHAN's framing of a sustained industry-wide volume/demand problem."
  pricing_inputs: "Customs-duty hike (6% to 15%) treated sector-wide primarily as an inventory-valuation tailwind realised over Q1-Q2 FY27, not a demand shock; SENCO flags the symmetric downside (a future duty cut reverses the gain, as happened in FY25 for an INR57cr hit) which DPABHUSHAN's own calls do not address per B05. Old-gold exchange is the dominant sourcing channel sector-wide (SENCO ~44-50% of revenue by Q4 FY26), at a scale DPABHUSHAN's own disclosures do not give a directly comparable percentage for."
  capex_cycle: "Industry-wide capacity race, not a lone expander: SENCO 18-20 stores/year, PNGJL 25 stores/year toward 150 by FY28, RBZ two large-format flagship stores funded by debt. DPABHUSHAN's 51-by-FY30 ambition (per B05) sits inside this same land grab; its 3-6 stores/year pace is slower than better-capitalised peers even before B05's own store-pace-reconciliation flag is applied."
