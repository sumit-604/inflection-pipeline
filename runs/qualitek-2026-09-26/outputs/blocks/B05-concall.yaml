analyst_note: "Two corrections from the cycle-1 verifier changed the shape of this report without changing its conclusion. First, the FY25 revenue miss was overstated by roughly 4x (22% vs the corrected ~5.6%) because the projection and the actual were built on different consolidation bases; the company's own FY25 deck contains the like-for-like figure that resolves this, and it was missed at cycle 1. Second, the '30% EBITDA margin diluted to 25-27%' framing was wrong on mechanism: the 30% target was stated once, lapsed silently, was re-dated to a longer horizon, then dropped -- a different and arguably more concerning pattern than a simple downward revision, because it means a long-term commitment is repeatedly restated with a longer runway rather than being met or explicitly abandoned. Two new MAJOR findings emerged from documents in scope but not read closely enough at cycle 1: the FY26 AR quietly drops three FY31/FY32 targets set four months earlier, and the Sep-2026 capital raise funds 'unidentified acquisitions' (including a new Cybersecurity vertical) without naming the one, twice-promised, now-overdue acquisition (Hyderabad). Net effect on the credibility grade: unchanged at C, because the corrected-down revenue miss is offset by more, not fewer, unacknowledged target changes than cycle 1 found."
