analyst_note: "Every Block A/B/C metric sits at the scoring floor, but the window that matters (FY24-26) is only 3 points long and the FY24 anchor itself is a pooling-restated blend of wine and the exited agri-trading book. Deal-breaker 6 (ND/EBITDA + IC) independently confirms AVOID on FY26 alone: EBITDA is negative for the second year running against Rs 119.66 cr of net debt, meaning operations cannot service the debt at all, not merely slowly. Receivable days near-doubling to 212 (matches the load-bearing fact) is the cleanest single number in this run, since it is least contaminated by the revenue-basis break. The mechanical AVOID is correct as computed; whether it should be overridden for a documented legacy-cleanup transition is a Halt 1 judgment call, not a Gate 0 one."
