  - "Why is the Working Capital Loan movement classified as an operating working-capital adjustment in the Cash Flow Statement rather than a financing activity, and what would net operating cash flow look like on a financing-consistent basis for each of the four periods shown?"
  - "What are the commercial terms (interest rate, tenor, repayment schedule) of the Rs 585.62M Amit Midha loan that appeared for the first time at H1FY25, and what is the business rationale for its timing immediately ahead of this DRHP?"
  - "Why does Kay Kay Overseas Corporation carry a nil outstanding payable balance at every balance sheet date despite purchases exceeding Rs 450-730M per period, and is the Rs 411.23M advance-to-vendors balance (substantially a prepayment to Amiable Electronics Private Limited) linked to a similar settlement pattern?"
  - "What corrective action has been or will be taken on the Note 45 Ind AS 101 equity reconciliation error and the Note 36 lease-liability roll-forward arithmetic error, and what internal controls will prevent recurrence in the first full post-listing statutory annual report?"
