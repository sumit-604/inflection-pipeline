  - "What is driving the Axis Bank quarterly stock-statement gap on trade receivables widening every quarter of FY26 (Rs 29.95 Cr to Rs 59.01 Cr), and why is the pool of intercompany or over-120-day receivables excluded from the bank's collateral base growing every quarter?"
  - "Given the Consumer segment's pretax loss widened to Rs 217.92 Cr with finance costs now nearly equal to Aerospace's, and ACPPL alone lost more than the Group's entire consolidated net loss, what is the capital-allocation plan for Consumer relative to Aerospace?"
