strengths_top3:
  - "Genuine deleveraging and margin expansion: D/E 0.17->0.06, interest coverage 8.93x->23.91x, PBT margin +178bps, gross margin +200bps YoY; DuPont confirms ROE improvement is margin/turnover-driven, not leverage-driven (Financial Highlights p.7; standalone P&L pp.97-98)"
  - "Capital allocation discipline ahead of the demerger: 92.8% of FY26 capex to the retained PP&C segment (Note 39, per B02); demerger scheme review delegated to an all-independent Restructuring Committee and Committee of Independent Directors (Corp Gov Report pp.68-69)"
  - "Clean audit and compliance record: unmodified opinions standalone and consolidated, zero CARO adverse remarks, no fraud under Sec 143(12), no loan defaults, no whistleblower complaints, full CSR compliance (pp.84-94, 166-172; Board's Report p.46)"
red_flags_top3:
  - "Chairman's letter quiet abandonment (Phase 6E): letter praises diversification and Agri Business performance with zero mention of the Board-approved demerger of the entire Agri Division, the exact segment that drove all FY26 profit growth (Chairman's Message pp.11-12 vs Board's Report p.41, Note 39)"
  - "Cash-conversion/FCF deterioration: standalone OCF/PAT 148.2%->59.0%, FCF down 62.9% YoY (Rs96.10 Cr->Rs35.68 Cr), driven by subsidy receivable buildup and near-doubled cash taxes (Statement of Cash Flows pp.101-102)"
  - "Governance/disclosure gaps: audit fee split not disclosed (blended ~Rs3.19 Mn total, p.62); Finance Committee (Rs1,250 Cr borrowing authority) has zero independent-director representation (p.67); direct MSME contradiction between Note 48(vi) and Note 19.1 (per B02)"
best_fit_strategy: "GARP (Watchlist) - genuine core-business margin/leverage improvement, but FY26 headline growth is concentrated in the segment being demerged out; not cleanly analyzable as GARP until post-demerger, retained-entity-only financials are available"
one_line_verdict: "Deleveraging and margins are genuinely improving, but nearly all of FY26's reported growth sits in the segment being demerged out, and the Chairman's letter never mentions it."
analyst_note: "The single highest-value finding this stage adds beyond B02 is Phase 6E: the Chairman's letter (dated 26-May-2026, same date as the Board's Report) frames diversification as the company's core advantage and praises the Agri Business's strong performance, with zero mention that the same Board, which he chairs, approved demerging that entire division four months earlier (04-Nov-2025). This is a silent drop with an implicit-retraction element, high materiality, and should weigh heavily on any synthesis narrative. Independently confirmed from primary statements (not just B02): standalone OCF/PAT collapse (148.2%->59.0%), FCF down 62.9%, contingent liabilities at ~37.1% of PAT (crosses the >25% flag, not previously stated in this ratio), and a Finance Committee with zero independent directors despite Rs1,250 Cr delegated borrowing authority. Two genuine NOT FOUND gaps that a downstream valuation stage should not silently fill: share-pledge status, and audit fee split (audit vs non-audit)."
