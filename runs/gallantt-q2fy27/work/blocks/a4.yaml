analyst_note: "Pre-thesis read. With no Notion page, Steps 6A-6D are ND by construction and 8A-W yields no entry zone. Verdict is FLAGS, not CAVEATS: cash conversion alone caps at CAVEATS, but five governance data points need a human call. Loop 1 grafted three A5 counters: traded purchases matched 70.4% of the YoY revenue rise (own-made proxy +3.9% YoY, -7.9% QoQ, inference); the loan book was built in FY26 from nil and joins Rs 326.09 Cr of other current financial assets in a Rs 591.88 Cr undisclosed pool (17.0% of equity); FY26 CFO/PAT is 1.00x without a Rs 118.59 Cr non-trade release. The seasonality claim is withdrawn. Loop 2 made the interest view symmetric: with interest received added and interest paid deducted, CFO/PAT is 0.56x H1 FY27 and 1.25x FY26, so H1 sits below the 0.65x Pillar 2 floor on every consistent basis. The gross-margin line (-Rs 51.02 Cr) exceeds the PAT fall (-Rs 28.42 Cr), so Q3 gross margin stays the single test. Bank-balance lien status is unknown."
