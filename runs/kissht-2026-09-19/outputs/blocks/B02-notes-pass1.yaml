analyst_note: "The two note sets tell different parts of the same story: standalone shows a thinly capitalised fee-collecting holding company whose guarantee to the subsidiary already exceeds its own net worth; consolidated shows the NBFC subsidiary carrying the loan book, the borrowings, and virtually all disclosed credit risk, while a large share of Group profit still lands at the parent via sourcing/guarantee fees. The ECL rollforward (Note 41) is unusually granular for a first-year filer and is exactly what exposes the write-off-driven GNPA optics (finding 2) -- disclosure quality here is a strength even though what it discloses is a concern. Pass 2 should re-check every note for the 150-DPD figure, any RBI/NBFC-specific asset-classification note that might sit outside the two note sets read here (e.g., in a separate Si Creva-only filing not part of this AR), and whether the Note 47 profit-split pattern recurs in the RHP's restated FY23-25 figures."
