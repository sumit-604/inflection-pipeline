analyst_note: "Correction loop 1 amends in place; verdict unchanged. Pre-thesis read: like-for-like growth is standalone only (Q2 revenue +17.4%, core PBT +7.4%, half the PBT gain from other income). Kidcity price is not filed; two routes (investment elimination; goodwill plus NCI) tie at Rs 3.67 Cr for 75%, about 0.70x Kidcity TTM PAT and 1.04x book. The low multiple fits a small pre-deal base plus a post-deal margin doubling on goods Karnika makes, so transfer prices set Kidcity's margin and 25% leaks to an unnamed holder; Karnika's sales to Kidcity separate synergy from allocation. The CFO's 'no debtors at Kidcity' is contradicted by at least Rs 35.40 Cr of Kidcity receivables. The Mar-26 consolidated balance sheet omits the FY26 FVOCI loss on three lines, tied to the lakh. Pass-through and the consolidated CCC gain fail on a matched basis. Cash class INDETERMINATE-WITH-DIRECTION; flags take the verdict to PROCEED WITH FLAGS. Question that moves the name most: related-party status of the Rs 31.41 Cr loans."
