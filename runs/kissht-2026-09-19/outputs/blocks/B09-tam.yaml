analyst_note: >
  Market size is not the risk here. TAM Rs 26-27L Cr growing ~20-22%,
  SAM growing ~47% off a 2.3%-of-TAM base, Kissht outgrowing both for
  three years running. Independent research (4 aggregators) corroborates
  the PL-only leg within 2-13% of the issuer-commissioned 1Lattice
  figure, de-risking the "is this TAM inflated" question on that leg
  specifically. LAP sizing and the granular mass-market/digital-lender
  funnel remain 1Lattice-only, unverified independently. mgmt_claim_ratio
  (0.061, "conservative") is an artefact of comparing management's
  SAM-scoped claim against a TAM-scoped denominator: management does NOT
  conflate TAM with SAM here, a rare instance of disciplined messaging
  this framework normally warns against. The SOM capacity math (Section
  3C) is sufficient on paper but conditional on two unresolved items
  stage 5 already flagged: the Rs 832 Cr preferential clearing its
  14-Oct-2026 EGM, and Cost-to-Income reversing rather than continuing
  its FY24-26 deterioration. Stage 11 should treat 51-61% SOM-implied
  CAGR as a believable middle case, bounded below by management's own
  >40% FY27 guidance floor and above by Kissht's own delivered 73-79%
  pace, not as either extreme.
