  demand: "Strong/record demand at KRISHANA and APCOTEXIND through FY26 into Q1 FY27; NOCIL softness attributed to Chinese competition and a domestic cooking-gas shortage, not demand destruction; BALAMINES shows the softest language ('moderated demand in select pharma/agrichem segments') but is a loosely comparable chemicals-intermediate business"
  pricing_inputs: "Consistent across all four peers: sulphur, sulphuric acid, ammonia, methanol and monoethanolamine all spiked sharply Apr-Jul 2026, uniformly attributed to the West Asia conflict/Strait of Hormuz disruption; KRISHANA shows sulphur rising from ~Rs27,500/tonne (Apr-2025) to ~Rs1,00,000/tonne (Jun-Jul 2026)"
  capex_cycle: "Sector-wide capacity up-cycle: APCOTEXIND, BALAMINES and KRISHANA all mid-expansion at scale larger than JACPL's project in the same window; NOCIL silent on new capex. This is an industry-wide capacity race, not a lone-expander situation — JACPL's Rs50cr project is a small participant, not an outlier"
