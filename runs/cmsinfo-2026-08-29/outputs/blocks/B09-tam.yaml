analyst_note: "Spear's ~2x-share small-pond read applies most to ATM Management Solutions (already 58-61% of the AR's own 120,000-unit outsourced base per MD&A p.94, stronger than spear's 47%). It materially understates Retail/Currency Logistics and especially Technology & Payment Solutions, where management's own TAM claims (Rs9,000 Cr and Rs8,000 Cr) are 3-8x spear's back-solved figures because spear's method excludes the conversion opportunity (self-managed ATMs, passive-CCTV sites) that is the actual growth thesis. SOM-implied CAGR (11.7-12.2%) sits close to but below management's FY30 guidance (13-14%), i.e. reasonable, not inflated."
