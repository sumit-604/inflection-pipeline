analyst_note_pass2: >
  The single highest-value Pass 2 finding is the CFO reconciliation: the
  gap between the two ARs is not a typo or a corpus artefact but a specific,
  undisclosed presentation change (an operating-vs-financing reclassification
  of working-capital-facility movement) introduced between the H1 FY26
  filing and the FY26 annual audit, applied retroactively to FY25 with zero
  note. This flatters both years' reported operating cash generation and
  should be pressed with management/auditor directly: what is "Changes in
  Working Capital Facilities," why was it introduced only at the annual
  stage, and why does no note disclose the change per AS-5 prior-period-item
  and comparability norms. The Claim Income and segment-receivable findings
  are downgraded/refined in severity but not closed; Pass 3 should run the
  pattern check (numbers not matching across notes) across the "Shareholders
  Funds" denominator mismatch newly found here, which follows the same
  family as the segment-note/balance-sheet receivables gap already flagged.
