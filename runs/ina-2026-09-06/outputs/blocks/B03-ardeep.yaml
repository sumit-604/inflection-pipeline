monitorables:
  - {metric: "Consolidated CFO (operating cash flow) and CFO/PAT, CFO/EBITDA ratios", threshold: "Return to positive CFO, or CFO/PAT and CFO/EBITDA back above the 0.7 convention, or a stated credible management explanation if it stays negative", where: "Quarterly results and next annual Consolidated Statement of Cash Flows", why: "Settles whether FY26 was a one-year capacity-driven working-capital ramp (benign) or an ongoing revenue-quality problem (not benign); this is the single largest open question from Phases 2-3"}
  - {metric: "Receivables aged beyond 6 months, as % of consolidated trade receivables", threshold: "Continued rise past the FY26 level of 39.5% (Rs111.35cr) signals worsening; a fall back toward the FY25 level of 12.1% signals the ramp reading was correct", where: "Trade receivables ageing note in the next quarterly/annual accounts", why: "The hardest, most direct number behind the cash-conversion question; also tests whether the zero-ECL-provision pattern becomes harder to justify as the aged bucket grows"}
  - {metric: "Unbilled revenue as % of the consolidated receivables book", threshold: "A fall from the FY26 level of 48% (Rs135.98cr of Rs281.59cr), or management finally naming the billing-cycle mechanics behind it", where: "Trade receivables note, next annual report", why: "Sits inside a stated 100% point-in-time revenue-recognition policy with no over-time component disclosed; a persistently high unbilled share without an explanation keeps the revenue-quality question open"}
  - {metric: "Corporate guarantee outstanding (Note 42(i) equivalent) and IREDA facility drawdown", threshold: "Guarantee growth beyond Rs1,654.01cr, or secured non-current borrowings drawing materially beyond the current Rs468.89cr against the Rs1,134cr IREDA sanction", where: "Contingent liabilities note and borrowings note, next quarterly/annual filing", why: "Leverage and the parent's contingent exposure (already 205% of net worth, 825% of PAT) will rise mechanically as the sanctioned facility draws down before its first repayment (due Dec-2027)"}
  - {metric: "Solarworld Energy Solutions Ltd receivable, ageing and collection status", threshold: "Any disclosed ageing-by-customer breakdown, or a change in this customer's % of revenue from the FY26 level of 12.4%", where: "Related-party/customer-concentration note, next annual report; investor Q&A if raised", why: "Newly material single-customer exposure (NIL in FY25) with no ageing visibility disclosed; directly relevant to the 'reduced customer concentration' claim this stage found contradicted"}
  - {metric: "Narmadapuram solar cell facility (4.5 GW) commissioning date", threshold: "Actual COD vs the stated Q4 FY27 target", where: "Manufacturing facilities section and capex/capital-commitments notes, next annual report; company announcements", why: "Tests delivery credibility on the one genuinely strong, evidenced strength this stage found (the Sawarda module facility already delivered on schedule)"}
  - {metric: "Narmadapuram aluminium frame facility (18,000 MTA) commissioning date", threshold: "Actual COD vs the stated Q3 FY27 target", where: "Manufacturing facilities section and capex/capital-commitments notes, next annual report; company announcements", why: "Same delivery-credibility test as the cell facility, on the second half of the backward-integration programme"}
  - {metric: "Capital commitments (Note 42(b) equivalent) as a multiple of net worth", threshold: "A ratio that stays flat or falls from the FY26 level of ~1.1x (Rs901.43cr commitments vs ~Rs807cr net worth) as commitments are executed and converted to PP&E; a further rise without matching equity growth would signal funding strain", where: "Capital commitments note, next quarterly/annual filing", why: "Tests whether the still-unexecuted capacity build-out is being funded in a way that keeps pace with the equity base, or is compounding the leverage story already visible in the D/E and guarantee trends"}
  - {metric: "ARS & Company's first Key Audit Matters (FY27 audit)", threshold: "Any KAM raised, especially on revenue recognition, receivables/ECL, or the guarantee/related-party structure", where: "FY27 Annual Report, Auditor's Report", why: "First independent test of whether the zero-KAM pattern under the outgoing auditor was auditor-specific or genuinely reflects low judgment-area risk in this business"}
  - {metric: "Resolution of the land title conflict (Note 4 vs Note 18A vs CARO clause i(c))", threshold: "Any disclosed transfer of title to the Company's own name, or continued silence/an unresolved conflict repeating in the FY27 notes and CARO", where: "FY27 Notes to accounts and CARO annexure", why: "Tests whether management treats a three-way factual conflict on its own core manufacturing asset as something to resolve or something to let stand"}
strengths_top3:
  - "Manufacturing capacity build-out is real, funded, and partially delivered: Sawarda 4.5GW module facility commissioned within the reporting period, capex (Rs448.05cr) tracks capital commitments (Rs901.43cr) cleanly, corroborated independently across P&L, cash flow, and notes."
  - "No fraud, no going-concern qualification, no fabricated primary number found across two independent audit opinions and multiple independent review passes (B02's three passes plus this stage's direct reads)."
  - "CARO compliance clean on every individually tested clause (statutory dues, borrowing defaults, deposits, CSR spend, IPO/rights-issue proceeds independently monitored by CARE Ratings)."
red_flags_top3:
  - "Cash conversion has inverted (CFO +Rs34.68cr to -Rs73.13cr) with CFO/PAT and CFO/EBITDA both deeply negative, and no narrative section in the entire Annual Report addresses why."
  - "The listed parent's guarantee exposure (Rs1,654.01cr = 205% of net worth = 825% of PAT = 3.0x parent's own standalone assets, including a reverse guarantee leg) sits on a parent whose own standalone revenue fell 13.3% and whose headcount (42) is 9.4x smaller than the group's (394); board control (4 of 10 seats, both executive seats) mirrors the same concentration."
  - "Disclosure quality lags group complexity: zero KAM in a 5x-scale-up year, a three-way conflict on factory land title (Note 4 vs Note 18A vs the auditor's own CARO opinion), AOC-2 says RPTs are 'not applicable' beside a note that lists real ones, and the MD&A's own 'Challenges' box is verbatim textile-industry boilerplate."
best_fit_strategy: "GARP (WATCHLIST) - real, evidenced growth and a funded capacity build-out, but leverage-driven ROE, negative and unexplained cash conversion, and a guarantee structure at 825% of PAT mean the earnings base cannot yet be taken at face value for entry pricing; Turnaround FAILS as a distinct thesis (no distress being exited, this is a growth-capex story, not a recovery story)."
one_line_verdict: "Real capacity growth funded by guarantee-heavy debt, cash inversion unexplained."
analyst_note: "Three findings this stage adds beyond B02 that materially reinforce (not merely repeat) Lead 1: (1) Note 58's Schedule III segment table shows the parent's own consolidation-adjusted profit share was NEGATIVE in both FY25 and FY26 even though standalone PAT was small-positive both years - the parent contributes a loss to the group's true economics, not just declining revenue. (2) Standalone headcount (42) vs group headcount (394), a 9.4x gap, independently confirms the thin-parent/thick-subsidiary structure from a headcount angle. (3) The MD&A 'Challenges' box is verbatim textile-industry boilerplate (PM MITRA, MMF, cotton, Bangladesh/Vietnam garment competition) - direct physical evidence the narrative section was not written with company-specific care, which should discount confidence in every other unverified MD&A claim. None of these three appear in B02 since they required the narrative/segment sections only Stage 3 reads."
