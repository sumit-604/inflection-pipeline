analyst_note: "This deep dive independently re-verified 13 of B02's 15 Top findings against primary source (2 more on consistency), finding zero true discrepancies and two precision sharpenings: the Cash Management 'flat' segment revenue is propped up by a 76.7% jump in intra-group billing while external revenue fell 6.6%; and CON loss allowance rose 7.7% even as SA fell 14.1%, meaning the release is SA-specific, not Group-wide. New this stage: ROCE collapsed ~25%->16.6% (CON, post-tax), sourced from MD&A's own audited-adjacent ratio table, confirmed by the SA Schedule III ratio table, and never mentioned in the CEO letter - the single most consequential number this deep dive surfaced, and the clearest test of whether FY26 is a one-year air pocket or a structural re-rating-down. CFO quality checks confirm the >1.2x LBF-1 ratio is not payable-stretch-assisted, a genuine positive. CARO also independently confirms the ADT-4 fraud filing and names the Note 48 loan counterparty (Transaction Solutions International) precisely."
