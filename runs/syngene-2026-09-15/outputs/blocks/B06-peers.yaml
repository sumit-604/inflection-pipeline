analyst_note: "Correction run. Nine audit items resolved: (1) SAILIFE 4-5% modality-revenue figure re-tiered from a management disclosure to an analyst-asserted, management-unconfirmed number; (2) the backward-integration/China-intermediate margin story re-anchored entirely to ANTHEM-Feb-2026 (pp.4-5, 7), removing a spurious Nov-2025 anchor that transcript does not support; (3) roughly half of spot-checked anchors were off by 1-3 pages because the original citations used the transcript's printed footer page instead of the PDF extraction marker -- all anchors in this report now cite the marker; (4) the Q1FY27 -16% YoY figure is restated as TOTAL company revenue, not research-services-specific, which downgrades the item-2 CONTRADICTED verdict from a magnitude-matched contradiction to a direction-only one (Syngene discloses no research-services growth rate to compare against peer figures); (5) the Labour Code disclosure gap is removed -- Syngene discloses a comparable Rs58cr/Rs20cr pair of exceptional items under the same codes; (6) Bayview's 'no date' framing is corrected -- a 'by end of this year' target exists as of Q1FY27; (7) the tariff/Biosecure test is reframed as a secondary check per the corrected B05 question, removing a false contradiction test against a claim Syngene itself downplays; (8) peer coverage map usage labels were checked and required no change. Net effect on the peer-triangulation picture: still undercuts the main narrative on the two claims that matter most (item 2 commoditization, item 4 funding recovery), but item 2 is now correctly scoped as a direction-only finding rather than an overstated magnitude comparison."
