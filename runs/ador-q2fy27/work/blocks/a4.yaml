analyst_note: "Pre-thesis read; Step 6 and the 2x2 archetype are ND. Revenue grew 22.6% in rupees, but FY26 grew 1.5% and the MD says part is price. The H1 ex-onerous +30% sits in Q1; Q2 profit grew 7.7%. Gross margin fell four times from a Q1 FY26 high and is now below FY25's 35.4%; Q3 against non-overlapping bands (36.0 / 35.4 / 34.2) decides reversion versus slide. The 12-13% EBITDA target is an expansion over FY26, and the 24-25% cost ratio it needs was already reached in H1, so gross margin is the binding lever unless the incentive accrual lags. Cash: CFO turned negative, payables fell 34 days from March 2026, and fund-based debt appeared beside Rs 119.53 Cr of treasury while a dividend was paid. March 2026 was a stretched year-end (payable and receivable days near 63 at March 2025), so three readings remain: supplier squeeze, early-pay choice, or unwind; 18-month CFO/PAT is 0.79x. FY27 audited cash flow separates them. The LC/BG explanation does not match the filing. Flares is ambiguous, not contradicted. All call numbers are ASR-tier."
