analyst_note: "No formal contradiction, but the peer set is thin where Anawil is most exposed. Four of twelve questions are UNVERIFIABLE because no peer discusses tubular tower prices, vendor supply, plant approval or Envision and Sany. The two tower-specific peer facts both point to more tower capacity near Anawil: Inox's South India tower plant and KP Green's tubular tower entry. Page anchors are the [page N] markers in the .txt files. Peer H2 shares run 60-75%, so Anawil's 70-80% sits at the top, but guidance needs only 66-69%. Retention comparison (Rs 6.4 Cr is 4.2% of H1 revenue) is derived. Cross-peer hypothesis (inference): sites, not fabrication, are the scarce resource, so tower supply is loose and buyer-priced. It fails if Anawil's Q4 FY27 and H1 FY28 new tower orders price above H1 FY27 realisation per tonne. Rerun KP/Inox/Suzlon checks once Anawil's 2026-11-09 transcript is filed."
cross_peer_hypothesis: "[INFERENCE] The binding constraint in FY27-FY28 is cleared sites, not fabrication capacity (industry OEM capacity above 20 GW vs about 6 GW installed, Suzlon Q2 FY27 p3; 3,900 MW delivered not installed, Q2 FY27 p16; Inox off-take postponed, Q3 FY26 p3; KP at 30-34% utilisation, H2 FY26 p21), so tower fabrication is loose-supply and buyer-priced, against Anawil's 'limited qualified suppliers'. Fails if Anawil's Q4 FY27 and H1 FY28 new tower orders price above H1 FY27 realisation per tonne."
