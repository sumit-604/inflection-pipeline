verdict_basis: >
  Every current director and KMP has a clean regulatory, criminal, civil-
  litigation, RPT and pledge record; the company carries zero debt and zero
  promoter pledge because it has zero promoter holding. The verdict is held at
  TRUSTWORTHY rather than EXEMPLARY solely because of one internally
  inconsistent, unresolved governance disclosure (the whistleblower complaint's
  status conflict between Notes 46/49/CARO and the Board's Report/BRSR within
  the same filed Annual Report) plus two unreadable SAST filings, both open
  evidentiary gaps rather than adverse conduct findings.
analyst_note: >
  The SEBI Rs173cr insider-trading order and the CERC market-coupling
  litigation dominate IEX's recent news flow but belong to the business/
  regulatory-risk analysis (stage 1/11/13), not to this conduct check: no IEX
  person is implicated in the SEBI order, and IEX is the appellant, not the
  respondent, in the coupling litigation. Keep these two threads out of the
  promoter/governance flag line downstream; only the whistleblower-status
  inconsistency and the unreadable SAST filings belong there. The 2014 FTIL
  forced-divestment history is offered as context for why no promoter exists
  today, not as a live risk; no current officer has any connection to it.
