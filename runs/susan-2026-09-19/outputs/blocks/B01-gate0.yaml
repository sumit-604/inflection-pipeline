analyst_note: >
  Core score 52 (AVERAGE) sits on a split profile: Block C's 20/20 is a
  small-base artifact (FY21 PAT of Rs8 Lakhs), not evidence of durable
  operating leverage, and should not be read as confirming the growth
  story on its own. Block B's 0/20 is the real signal: three straight
  restated years of CFO below PAT, FCF negative in three of four years,
  and borrowings near-tripling to fund a working-capital cycle CRISIL
  itself names as a weakness. Block F (moat, STRONG) rests on only 5 of
  12 tests scoring "present," two of those five are minimum-threshold
  judgment calls (M4, M10) on a rubric-fit ambiguity, and a third (M11)
  applies a platform-business construct to a cable manufacturer. Three
  tests (M2, M5, M9) are unscored for missing peer data (DIACABS is a
  post-CIRP outlier, not a usable comparator; DYCL and VIDYAWIRES
  screener sheets did not download). LBF1's segment-margin reconciliation
  and LBF3's government-revenue-share glide path are both named but not
  resolvable from documents read at this stage; carry both forward
  unresolved, not as closed items.
