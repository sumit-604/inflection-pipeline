    reason: "FY26 AR (filed 07-Aug-2026, p.48) cites Indian specialty chemicals market USD 27.1bn (2024, Custom Market Insights); Q1FY27 Investor Presentation (filed 12-Aug-2026, p.25) cites USD 67.0bn (2025, blended Frost&Sullivan/Imarc/CareEdge/Precedence/GVR). Same company, same reporting cycle, five days apart, >2x spread on the same claimed market."
  - type: FLAG-MGMT-TAM-BROAD
    reason: "Management's Industry Overview slides (AR + all 3 IPs) show global/India API and specialty-chemical headline sizes with no bridge to IOLCP's ~11-molecule product basket. Ratio of the headline claim (global API, $256.4bn) to the conservative company-specific estimate is ~153x -- squarely 'inflated' per the standard >2x read, not a borderline call."
  - type: FLAG-CDMO-SCALE
    reason: "IOLCP's planned CDMO line (1,500mn tablets/yr) is under 0.3% of just two established European solid-dose CDMOs' combined output (Delpharm + Fareva, >500bn tablets/yr, towardshealthcare.com). Frame as a small customer-led niche entry, not a scale TAM driver."
market_definition: "Bulk generic small-molecule APIs (11 named molecules, led by Ibuprofen) plus acetyl-chain specialty chemicals (Ethyl Acetate, Acetic Anhydride, MCA, Acetyl Chloride, Triacetin), sold B2B globally to formulators and industrial buyers, plus emerging CDMO tablet contract manufacturing from Q3 FY27."
