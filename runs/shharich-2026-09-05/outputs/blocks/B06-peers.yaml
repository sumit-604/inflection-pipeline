analyst_note: "The two peer sets are temporally complementary rather than overlapping: BODALCHEM covers the volume-led recovery phase through Q1 FY26 (Apr-Jun 2025), SHREEPUSHK alone covers the price-led cost-shock phase from Q3 FY26 through Q1 FY27 that matters most for SHHARICH's own inflection. Treat Q9's verdict as the most decision-relevant finding in this stage: it does not prove SHHARICH's Q1 FY27 print was spread-driven, but it is the strongest available contemporaneous evidence pointing that way, and it should weigh directly on whether stage 11/FTTCP treats SHHARICH's spot-year margin as converter-cyclical (v3.7 Amendment 17) rather than as evidence of a durable volume-led transition."
