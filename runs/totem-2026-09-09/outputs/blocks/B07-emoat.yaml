analyst_note: "Scan intentionally lands sparse: 5 of 23 rows have any evidence, 3 clear Strong/Moderate. The two Strong rows (A3 process tech, B2 qualification lock-in) are genuinely documented across 2-3 consecutive ARs, not force-fit claims. But both are catch-up moves (matching what Kennametal and other global majors already hold), and the headline Q1 FY27 margin proof most people would cite for A3 is, per the already-verified B01 LBF-1 bridge, an opex-compression-on-volume story, not a yield/quality story. F2 is split deliberately: capex completes on time, but the surrounding growth claims (B05, Grade C) do not have a comparable record. Recommend the operator treat this as a single-plant reinvestment cycle worth monitoring via the FY27 AR, not yet a re-rating case."
