flags:
  - "BASIS: rupee TAM is stated on the order-book blended billing basis (Rs 1.236 Cr per tower = Rs 395.58 Cr / 320 towers). Full-tower-value basis (Model 3 price, about Rs 1.09 Cr per MW) is 3.0x higher; conversion-only basis (Rs 58.7 lakh per tower) is 0.47x. Towers per year is the unit that avoids the distortion."
  - "MGMT_CLAIM: '42.56 GW incremental, ~12,500+ future tower market' (listing deck p.3) = 100 GW minus the 57.44 GW of June 2026. On a GW test it is 1.88x the flat-6.05-GW floor and 1.13x the MNRE/IWTMA roadmap. The tower count rides on 3.4 MW per tower (42,560 / 12,500), which is the claim's own implied rating, not a measured fleet average."
  - "ROADMAP_MISSES_100GW: the FY27 to FY31 roadmap (8, 9, 10, 12, 13.2 GW) reaches 95.1 GW at March 2030, 4.9 GW short of the 100 GW 2030 target the company cites."
  - "UNDER_IMPLEMENTATION: company says 28 GW (April 2026). Independent Oct 2026 sources say over 40 GW (Suzlon call p.3) and 43 GW (IWTMA). JMK counts 17.36 GW (auctions completed, Mar 2026). Definitions differ; the company figure is neither the widest nor the narrowest."
  - "GUIDANCE_VS_SOM: FY27 guidance midpoint Rs 475 Cr is 49.5% of the FY27 SAM (Rs 960 Cr) against 35.8% FY26 tower share. Share rules allow about Rs 477 Cr only by FY29. Guidance runs about two years ahead of the share-rule SOM unless the SAM is wider than the Chinese-OEM channel."
  - "CAGR_IS_HALF_MIX: yr3 49.3% = tower volume 22.5% x price and mix 21.9%. Yr5 35.1% = volume 20.0% x mix 12.6%. Model 3 carries 14 to 16% margin, so profit CAGR will trail revenue CAGR."
  - "CAPACITY: SOM FY31 Rs 646 Cr needs 522 towers: 85% of 612 nameplate (best half so far 148 towers, 48% of a 306-tower half), and above the 437-tower tonnage limit if every tower is 474 t. Gap Rs 106 Cr on the heavy-tower reading."
  - "SUPPLY_SIDE_ADDITIONS: KP Green is entering onshore tubular towers (May 2026 call), Inox Wind is building a South India tower plant (Nov 2025 call), DEE Fabricom holds 32,400 tpa and Rs 55 to 90 Cr tower orders. The prospectus claim of a 'limited number of qualified suppliers' (p.114) is not independently supported."
  - "SUBSTITUTION: Suzlon uses hybrid lattice-tubular towers (MNRE approved-models list) and a 140 m hybrid concrete tower; hybrid share NOT FOUND."
  - "STALE_COMPANY_DATA: state-wise installed table is 31 Dec 2024 in the Prospectus and listing deck (23 months old, superseded by Sep 2026 MNRE data); 18 GW manufacturing capacity (Prospectus p.100, p.104) superseded by 24 GW (IWTMA Oct 2026)."
  - "RUNWAY_MATRIX: the repo defines no numeric thresholds for MASSIVE/STRONG/GOOD/MODERATE/LIMITED (Master v3.6 line 993 lists the labels only); class assigned on stated reasoning."
