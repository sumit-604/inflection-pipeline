  - "Permanent closure of the Lakshmipuram sugar unit; Rs 78.58mn of plant assets reclassified to held-for-sale with no disclosed Ind AS 105 impairment test (Notes 15,43, pp.99,106)."
  - "Over Rs 11.7cr deployed into an unrelated engineering business via an NCLT insolvency e-auction with no disclosed strategic rationale, budget, or return expectations, alongside a shareholder resolution raising the borrowing ceiling to Rs 300cr explicitly for further diversification (Note 55 p.115; AGM Notice Item 4, p.5,13)."
  - "Eimco-K.C.P.'s reported PAT was inflated by more than a quarter through an unexplained Rs 10.32mn partnership-firm profit swing from a Rs 1.33mn prior-year loss (Eimco Note 25 p.159; Note 5 p.155; Cash Flow p.141)."
