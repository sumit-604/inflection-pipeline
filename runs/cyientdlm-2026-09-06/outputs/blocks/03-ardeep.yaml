phase_verdicts:
  p1: "Watch - clean unmodified opinions both years, no qualification, going-concern or fraud, but three consecutive years of the same three Key Audit Matters unresolved, a first-time-disclosed GST dispute not cross-referenced in contingent liabilities, and no independent local audit on the material US subsidiary driving all consolidated profit growth"
  p2: "Red Flag - concurs with the stage 2 accounting quality score of 4 of 10; extends it with a new finding that DSCR (1.67x to 0.62x) is not comparable across the two ARs for the identical FY25 year, plus a cross-border parent corporate guarantee (Rs1,188.60mn) backing the US subsidiary Citibank loan"
  p3: "Red Flag - primary financial statements independently confirm the Gate 0 cash-conversion deal-breaker with exact figures; other income exceeds 20% of PBT in both years; the apparent gross-margin expansion is mechanically an inventory-accounting artefact; the ROE decline is operating-driven, not a leverage optical effect"
  p4: "Watch, tilting Red - the MD&A is unusually well sourced and largely internally consistent with the primary financials, but omits NWC, cash conversion and DSCR from its own named risk table despite disclosing the deterioration of both metrics elsewhere in the same report; two of three trackable prior-year guidance items (NWC improvement, ROCE improvement) were missed"
  p5: "Watch - clean on pledge, selling, fraud, SEBI and auditor-fee grounds; set against a promoter-family board and Audit Committee overlap reviewing a new RPT flow to that promoter, one director at 50% attendance, full CEO, CFO and two independent director turnover within one year, and no independent audit on the material subsidiary"
  p6: "Red Flag on narrative against reality specifically - the MD and CEO letter cites the worst NWC figure in the company's own four-year series as evidence of balance-sheet strength; the MD&A Shareholder Value Creation section claims meaningful value creation in the same paragraph that discloses a 34.8% YoY share price decline; the CEO and CFO transitions are not mentioned in either letter. Genuine tone-honesty (6D) and real SET-framework execution evidence are the offsetting positives."
  p7_best_fit: "Turnaround - WATCHLIST (genuine deleveraging, margin improvement and order momentum, but the two metrics a turnaround must show improving, NWC days and cash conversion, are moving the wrong way, and the India core business is still shrinking on revenue and profit)"
