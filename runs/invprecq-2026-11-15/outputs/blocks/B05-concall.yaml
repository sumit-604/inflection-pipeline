analyst_note: "No transcripts exist, so the grade rests on soft statements, not guided numbers. Stage 11 should treat the A&D 11% as a company slide until the FY27 AR industry split. Capacity basis is 3,060 t; 1,500 t is output (Q4 FY26 deck p.6), so utilisation is about 51% FY26 and about 60% H1 FY27. H1 FY27 EBITDA 24.12 Cr includes an 863.65 lakh inventory credit; stripping it gives about 13.9%, a floor that assumes zero absorption, not a forecast. Do not project 21.6%. Wind credit netting from FY27 shifts the FY26 revenue base by 265.55 lakh; use the AR base."
