analyst_note: "Comparatives tie to the prior-year AR (other/ p.115, p.46), so no restatement. Read the 54% CFO/PAT as a ceiling: the capex line is accrual-based, the receivables line is 1,683.40 lakh off the balance sheet movement, and customer advances rose 6,044.58 lakh (C), 96.9% of the S rise from subsidiaries. Excluding that rise, C CFO/PAT is about 28.7%. Advances are real cash, so this is a dependence test, not a restatement. Separating observation: advance days (23.9, 33.2, 36.6) and receivable days (115.1, 139.7, 150.7) rise together; if advances stop rising while receivable days keep rising, CFO falls. The S 'Customer B' 24.08% equals subsidiary sales exactly (inference). AR is pre-QIP and pre-preferential allotment; per-share and cash bases are 31 Mar 2026, Rs 2 face value."
