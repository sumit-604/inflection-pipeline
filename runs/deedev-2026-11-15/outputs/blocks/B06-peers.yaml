industry_cross_read:
  demand: "Split by segment: thermal power, nuclear, and oil and gas export are strong for ANUP and Ratnamani; water and domestic carbon steel line pipe are weak (Ratnamani). ISGEC says demand is robust across product lines. Directionally consistent with DEEDEV's power-led order guide, but no peer gives BHEL timing."
  pricing_inputs: "All three peers sell fixed price with no escalation and cover steel through back-to-back supplier offers placed after order. Freight and Hormuz-linked costs are the squeeze (Ratnamani cannot pass them on; ANUP sells FOB). Steel, copper, nickel moved up to 10% then eased (ISGEC Q2 FY27). Stainless seamless pricing is loosening as pierced capacity enters (Ratnamani)."
  capex_cycle: "Not a lone expander. ISGEC is spending Rs 502 cr including tube and piping shops; Ratnamani has Spiral Mill-3, a Middle East plant and an RFSS expansion; ANUP finished Kheda and says no major organic capex is needed. A selective multi-peer capex phase, not an industry-wide capacity race in process piping."
