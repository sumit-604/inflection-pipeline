cross_peer_hypothesis: "The 2026 aluminium price and freight shock splits downstream demand by contract type, not by product. Contract-bound domestic project demand is deferred and then recovers (APARINDS Jul-26 p.3, p.14: penalties force delivery and clearances resumed once metal eased). Discretionary export demand is lost, not deferred (MAANALU Feb-26 p.7, p.11: US orders cancelled and moved to local producers). Test: if MMP's conductor fall is deferral, Q2 FY27 conductor revenue returns above 200 Mn; MMP's export growth guide of +40-50% is the exposed number."
analyst_note: "Peer set supports MMP's direction on metal-price deferral and slow approvals but not its magnitude, and no peer confirms the payment-delay story. APARINDS domestic conductor revenue grew 19.3% in Q1 FY27 while MMP conductors fell 42%, so MMP's weakness looks partly company-specific (conventional bare conductor sits in the deferred bucket; APARINDS pushes conventional product to exports and keeps premium at home). Both peers hedge metal back to back and report no metal inventory gain, so MMP's 2-2.5 Cr gain points to open exposure; this feeds margin quality. Both peers hold working capital at 45-60 days against MMP 102.5. Powder and foil are not covered by any peer; those claims remain on MMP's own word. Weights: MAANALU evidence is adjacent (extrusion, not powder); APARINDS is large-cap conductors and cables."
