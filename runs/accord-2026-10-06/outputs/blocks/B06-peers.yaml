cross_peer_hypothesis: "Cost pass-through in this segment is relational, not contractual, and its capture rate is about half. Danish had a PV clause on about 30% of its book and called the rest bounded by firm prices (D-M26 p9, p14). Shilchar recovered 50-60% of the oil and metal rise on fixed-price orders by asking customers under force majeure (S-M26 p16; S-A26 p5). Together they show fixed-price books recover roughly half of a shock after one to two quarters, and only with repeat customers. Test for Accord: if its book is PV-covered above 3 months, its gross margin (FY26 24.1%) should not have fallen in H1 FY27 while Shilchar's ex other income margin fell from 33.0% to 16.4% in the same quarter; a fall means the 100% claim is a negotiated outcome, not a clause."
analyst_note: "Peer tests close on direction, not size. Demand and the oil shock are corroborated by two peers. The build timeline is contradicted. The plant ceiling, PVC share and 44% deferral are outliers against peers. LBF-1 arithmetic: peer H1 shares (38.1-50.6%) applied to H1 FY27 52.68 give Rs 104-138 Cr; Rs 120 Cr needs 43.9%, Rs 180 Cr needs 29.3%, below every peer. Accord's order cover (1.36x-2.57x of the H2 need) beats both peers' cover at similar dates (71-75%), so conversion and unfiled orders, not cover, are the weak point. Basis note: margins are ex other income from PBT bridge on screener data (calc). Shilchar's Q1 FY27 headline EBITDA 29.23 includes other income 7.18. Accord inventory days use a sales basis here (127) and differ from B04's cost basis (146). Separating observations for later stages: H1 FY27 MVA made and mix, PVC share of the Rs 173 Cr book, H1 gross margin vs 24.1%, H1 receivables."
