going_concern_language: "NONE in Notes 1 to 62. Outside the notes: CARO clause (xix), PDF p.63, 'nothing has come to our attention, which causes us to believe that any material uncertainty exists ... as on the date of the audit report', with the standard 'not an assurance' disclaimer; Note 43 states no covenant breach. Note 62 regroups prior-year figures with no amount (no quantified restatement)."
analyst_note: "Three corrections from Pass 2 govern downstream use. First, the 2,446 operating profit includes other income 2,107, so interest cover is 0.09x on EBIT before other income (339), not 0.64x; Heavy Engineering segment margin of 10.9% is therefore not an operating margin. Second, the 9.7-point fall in the material cost ratio (61.6% to 51.9%, derived) is not like-for-like: Foundry shutdown changed the mix, and 1,545 of TNEB provision usage may have bypassed cost lines (up to 5.6 points). Stage 11 should not read it as a margin step-up until management answers. Third, the 1,050 trust loans in Note 50 have no stated home in Note 21 or 24; treat reported borrowings 21,891 as possibly understated by up to 1,050 until placed. Pass 3 found no new items: its value is the pattern that thin disclosure sits on cash-risk items. All figures INR Lakhs; stage 10 converts once. Receivable days are two points only (FY24 absent)."
