going_concern_language: "NONE. Both standalone and consolidated basis-of-preparation notes state 'on a going concern basis' as the accounting convention only (boilerplate, not a doubt-flagging statement). No emphasis-of-matter or material-uncertainty-related-to-going-concern paragraph in either auditor's report."
accounting_quality_preliminary_read: "Disclosure is thorough and largely transparent on mechanical items (borrowings security/terms, RPT tables, actuarial detail, MSME ageing, financial ratios with self-explained variances) but materially thin on the two items that matter most this year: (1) no independent valuation basis disclosed for the related-party share swap that funded 70% of the ITCPL buyout, and (2) no quantified goodwill impairment-test assumptions despite goodwill more than doubling to 54% of consolidated net worth. Final accounting_quality score to be set at Pass 3 consolidation after patterns/contradictions pass."
analyst_note: "The standalone-only Note 34 ratio table (ROE, ROCE, Debt-Equity, Net Capital Turnover) is the single most load-bearing block in this AR for the LBF1/LBF2 growth-quality question: it is company-disclosed and company-explained, not an analyst construct, and it says plainly that standalone capital productivity fell in FY26 even as consolidated headline numbers grew fast. Pass 2/3 should test whether this standalone deterioration is temporary (acquisition integration lag) or a durable signal that the group's capital allocation (swap-funded ITCPL buyout, new borrowings) is currently outrunning its earnings power at the parent level."
