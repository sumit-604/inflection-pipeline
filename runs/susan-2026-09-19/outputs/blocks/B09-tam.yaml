analyst_note: >
  TAM/SAM/SOM here excludes the aluminium-rod trading line by design (38.38%
  of FY26 revenue) -- it is commodity resale, not a served market, sized
  separately in the report body. India winding-wire TAM (Rs 4,835 Cr) is
  benchmark-derived, not disclosed; flag its low confidence if reused.
  SOM_3yr/5yr are set at management's own capacity-linked reference
  (Rs 700-800 Cr) rather than the mechanical share-gain math, because
  Section 3C shows capacity, not market size, is the binding constraint:
  SAM is ~179x current manufacturing revenue, so demand scarcity is not the
  risk here. The 63%/36% SOM CAGR handoff should be read against two
  credibility gaps this stage could not resolve: the internally inconsistent
  HT/MVCC FY27 target (15% vs 50%, same call) and the Q1 FY27 margin's
  ~82% dependence on an undisclosed inventory-build credit (B05). Stage 11's
  valuation-implication read (PEG ~0.42 at ~26.3x trailing P/E) should be
  treated as fragile support, not robust support, for the current price.
