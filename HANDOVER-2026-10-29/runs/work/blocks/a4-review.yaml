analyst_note: "The quarter and the half disagree. H1 continuing PAT doubled only because Q1 FY26 had a core loss of 1.04 Cr (derived). Q2 alone shows core PBT -57.2%. Q1 FY27 material consumed was flat YoY (L225), yet material cost charged to Q1 P&L fell 21.1% on flat revenue while the stock build rose 13.4%. Under the nature-of-expense format the inventory-change line absorbs conversion cost, so the margin is not clean until the March 2027 unwind. Correction loop 1 added the buy-back economics: at an inferred Rs 200 the buy-back was 22x continuing EPS and 1.16x book, and about EPS-neutral net of forgone treasury income. The Q3 other-expense test now anchors to the Q3 FY26 column, because H2 FY26 ran 12.4%. The verdict stays PROCEED WITH FLAGS and cash stays INDETERMINATE-WITH-DIRECTION. Nineteen questions exceed the protocol's 5-8 because every A3 forward-signal and ambiguous finding needs one."
