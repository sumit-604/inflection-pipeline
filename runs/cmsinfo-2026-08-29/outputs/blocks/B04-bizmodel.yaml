model: claude-sonnet-5
status: complete
input_gaps:
  - "Investor presentation is image-heavy; pre-extracted text was thin but sufficient for text/table content read directly from the deck. No chart-only data was estimated."
  - "BLA/transaction-linked revenue as % of total revenue NOT FOUND in AR or Investor Presentation; company memory's ~12% figure is an unanchored spear-pass estimate."
  - "Prospectus absent from corpus (carried forward from B00)."
  - "No explicit RBI/state cash-in-transit licensing or regulatory-barrier text found in this AR."
flags:
  - "HAWKAI revenue stated as Rs200 million (AR p.32, Directors' Report) vs Rs200 Cr (AR pp.4-5/52, Chairman's Letter and MD&A; Inv. Pres. slide 20) -- a 100x internal AR discrepancy. Rs200 Cr used as reconciled figure (2 of 3 sources agree); Directors' Report line unresolved."
  - "Contract tenure inconsistent within corpus: SBI cited as both nine years (MD&A p.51) and 10-year (Directors' Report); HDFC cited as both three years (MD&A p.51) and 5 years (Inv. Pres. slide 7, post-AR)."
  - "Three non-comparable segment-reporting bases coexist in the same AR (statutory Ind AS 108, BRSR business-activity, MD&A alternative view); AR explicitly states they are not directly comparable."
  - "Post-tax ROCE fell from 25.2% (FY25) to 16.6% (FY26), standalone (MD&A p.52) -- material deterioration not emphasised in company memory's spear pass."
  - "DSO rose 116 -> 116 -> 126 days FY24-FY26 (standalone) alongside OCF/EBITDA conversion falling 76.2% -> 65.9%; corroborates Stage 2's receivables-ageing concern (G-1)."
business_type: "hybrid"
