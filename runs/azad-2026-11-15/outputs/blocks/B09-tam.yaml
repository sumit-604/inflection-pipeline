  - {type: FLAG-WALLET-SHARE-INCONSISTENT, reason: "'Under 2%' (Q2C [page 16]) vs 'single digit' (Q2C [page 17]) vs 'historically low single-digit' (AR26 [page 17]). SAM implied by 2% is a floor, not a measurement."}
