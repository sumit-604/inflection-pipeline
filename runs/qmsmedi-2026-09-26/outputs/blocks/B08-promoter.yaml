verdict_basis: "Clean legal/regulatory record (no SEBI, criminal, or civil action found against promoter or company; rights-issue LOF's own Nil litigation table) combined with two filing-confirmed deal-breaker-adjacent items (undisclosed-reason statutory auditor resignation FY24-25, and a family remuneration increase running against a 36% standalone PAT decline in FY26), plus a company-disclosed unresolved competing-entity conflict -- net CAUTION, not TRUSTWORTHY and not CONCERN."
analyst_note: "The Saarathi price-ladder markdown (LBF3) is now fully reconciled from company filings: Tranche 1 Jul-2024 implies ~Rs 88 Cr for 100%, Tranches 2-3 imply ~Rs 56-59 Cr, a ~35-37% cut within 15 months. Web search independently confirms Tranche-1 seller was Saarathi's founder-CEO Ranjeeta Vinil, not a promoter-linked party, closing part of LBF3's related-party question, but this stage could not confirm or rule out whether 'Mayukh Healthcare Services LLP' (one of Mahesh Makhija's other directorships per the rights-issue LOF, and separately named in B02's related-party map) ever held a Saarathi stake -- flagged for Halt 1 follow-up. The 25-Sep-2026 scheme of arrangement is the single largest open structural question this stage surfaced: it makes the promoter personally a counterparty to investor rights in a to-be-listed sibling entity, with lock-in and exclusivity terms, while the company states no impact on QMSMEDI's own management or control. Stage 11/13 should treat this scheme as unresolved and pending NCLT/shareholder approval, not as a completed fact."
