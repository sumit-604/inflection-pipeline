      Standalone Note 12+13 cash+other bank balances at FY26 close = Rs 151.25
      lakh + Rs 500.89 lakh = Rs 652.14 lakh (Rs 6.52 Cr), matching the ~Rs 6.5
      Cr load-bearing fact. The factoring mechanism is a payables-side Supplier
