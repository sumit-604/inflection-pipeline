  demand: "Peers broadly describe a resilient-to-strong demand environment (EV segment growth 45-65% YoY per SONACOMS; general PV/CV recovery cited across peers), which sits in tension with Divgi's flatter, more cautious industry framing."
  pricing_inputs: "Commodity inflation (aluminum, steel, copper) with pass-through lag is a shared theme across all four peers; none report the kind of demand softness Divgi cites as an excuse for margin pressure."
