one_line_verdict: "Clean numbers, unexplained margin history, undisclosed board conflict with a SEBI-searched related party"
analyst_note: "The single highest-value finding of this deep dive is structural, not numeric: every RPT approval Borana Weaves has ever made with R&B Denims Limited was voted on by directors -- including all three independents -- who are simultaneously R&B Denims's own fiduciaries. This sits underneath, and partly explains, why B02 found no price-basis methodology anywhere for any related-party transaction: the approval mechanism itself was never independent in the ordinary sense. Combined with a second SEBI matter tied to the same entity and family (2017, settled) preceding the 2026 search, and a margin story the AR itself declines to explain despite management explaining it live two months earlier, the picture is of a company whose NUMBERS are clean but whose DISCLOSURE and GOVERNANCE architecture has not yet caught up with being listed. Section 1B/FTTCP should treat the Converter classification as settled (Amendment 17 binds) and should weight the board-independence finding heavily at Halt 1, alongside B02's RPT-pricing gap, since the two findings compound rather than stand apart."
