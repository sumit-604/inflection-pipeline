verdict_basis: "Two full annual reporting cycles show nil SEBI, regulatory or court action against the company, its directors, its KMP or its promoter. Zero pledge with stable 52.1-52.2% holding. Unchanged clean-opinion EY-network auditor. All board and CFO mid-term exits independently verified as promotions or credible personal-capacity reasons, each replaced by a stronger externally credentialed hire."
analyst_note: "The promoter is a listed corporate (Cyient Limited, 52.12%), not a family, so this check ran two tracks: Cyient DLM's own board and KMP, and the Bodanapu and Mohan Reddy family that controls the parent. The one family relationship, Krishna Bodanapu being B.V.R. Mohan Reddy's son, is company-disclosed, not hidden. The verdict rests on AR primary sources plus corroborated web search. The SEBI primary order database and the DRHP/RHP, the two strongest sources for promoter-group litigation history, were unreachable this run because of an egress block, not by choice. Severe stock and order-book weakness (down about 35-40% year on year, a ninth straight quarter of order-book decline) is a business-quality matter for other stages and is not scored here as a promoter-integrity flag."
