analyst_note: "Two items compound each other and deserve a single management question
  rather than two separate ones: the DSCR shortfall (0.99x) and the RPT-payable-funded
  negative working capital that flipped positive only via IPO cash. Together they suggest
  the pre-IPO balance sheet was thinner than the standalone P&L implied, propped up
  by promoter-group trade credit rather than by operating cash generation, and that
  prop is now being withdrawn at the same time debt service coverage has gone under
  1x. The RPT purchase-figure/total-purchase-figure mismatch recurring across the
  prospectus and the AR for the identical FY25 number suggests a real classification
  practice, not a typo, and should be raised directly with the CFO rather than assumed
  benign."
