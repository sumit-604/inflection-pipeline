analyst_note: "Pre-thesis baseline, not a thesis check. The YoY quarter is real at the core (SA core PBT +29.17%, CO +39.01%; other income immaterial), but rides a soft Q2 FY26 base: SA H1 revenue grew 23.04%, below the 25% Vision pace. The QoQ quarter is the story: margin fell 290 to 321 bps on flat revenue, from staff and other expenses, not raw material. Q3 SA employee cost separates a timing step from a new base. The H1 material-cost gain is a Q1 FY26 base effect, not a trading-mix effect. The filing reproduces the release's H1 percentages, 0.32x net D/E and 9.91x ICR, but not its 9% debt decline (7.63% filed). The WC release paid for the whole debt fall; ex-WC the half was Rs 9.32 Cr short, so cash stays INDETERMINATE-WITH-DIRECTION. Use standalone as the clean read. Panipat is the open risk: about 40% of the land was never released and the plant parcel is not named. Verdict PROCEED WITH FLAGS sits below the CAVEATS cap."
