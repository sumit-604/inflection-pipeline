one_line_verdict: "A clean, cheap (8-9x trailing) margin reset whose cause the company does not explain; the largest line looks industry-wide, the fuel line looks company-specific, and capex, IGCL and related-party pricing are untested."
analyst_note: "Most evidenced path: the reset is cost-led, not price-led. Net price effect is about +84 lakh of the 1,540 lakh PBT rise (DCP +918, gelatine -834, computed from MD&A rates). Two readings: (A) structural, from group know-how, solar and yield; (B) cyclical, from bone and global gelatine price deflation. Evidence splits by line: materials ratio fell 511 bp at NGL and 727 bp at IGCL (favours B for that line); power and fuel fell 217 bp at NGL while IGCL rose 87 bp (favours A for that line). One separating observation: Q2 FY27 materials-plus-inventory ratio at or under 52% while IGCL's does not rebound. Labour Code one-off is only 82.56 lakh (Q3 FY26 results); the employee-cost rise is run-rate. Stage 5 should note the AR gives no outlook; MD&A is PDF pp.11-12, Annexure III (solar 8.89 Cr, SAP) is PDF p.19."
