- {metric: "Grain (maize/rice) feedstock price, Rs/kg", healthy: "reverting below Rs20-22/kg", red_flag: "sustained
    above Rs25/kg (already printed Jul-2026)"}
- {metric: "Cash flow from operations", healthy: "positive for a full quarter", red_flag: "a second consecutive
    negative annual print (FY26 standalone was -Rs29,615.04 lakh)"}
- {metric: "DSCR (Schedule III ratio)", healthy: "above 1.0x", red_flag: "at or below 1.0x (FY26 printed 0.99x)"}
- {metric: "Related-party feedstock purchases as % of total purchases", healthy: "falling below FY26's 72.6% and
    reconciled between notes", red_flag: "still unreconciled between the total-purchases and RPT notes"}
