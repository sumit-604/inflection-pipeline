  revenue_per_unit: "3.38 Lakh per year-end head (21,416.18 / 6,338, derived)"
  margin_per_unit: "13.29% EBITDA on revenue (AR p.14); 26.32% after direct people and services cost (derived, LP slide 24)"
  key_lever: "Utilisation of field heads and collection days; wage inflation is the main cost lever"
first_deterioration_signals:
  - {risk: "Top customer loss or insourcing", first_signal: "top-10 revenue share and receivables from that customer"}
  - {risk: "Acquired revenue fades", first_signal: "Alltrak and Healthcare revenue per half"}
  - {risk: "Wage inflation", first_signal: "employee expense ratio above 39.5%"}
  - {risk: "Client price cuts", first_signal: "EBITDA margin below 13%"}
  - {risk: "Receivable build without provision", first_signal: "CFO/PAT and 1-2 year ageing bucket"}
  - {risk: "Costly debt funds the float", first_signal: "finance cost and flat debt after IPO"}
