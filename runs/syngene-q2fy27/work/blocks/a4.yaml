analyst_note: "Revenue (Rs 832.7 Cr) beat the base path. Everything beneath it weakened. Core PBT fell 63%. H1 other income exceeded H1 pre-exceptional PBT. Capitalised Bayview pre-op (Rs 66.1 Cr) exceeded H1 PBT. The FX hedge loss is recurring. T3 fires literally, but H1 FY26 CFO was also negative, so the binding cash test is full-year FY27 at Q4. Verdict is PROCEED WITH FLAGS, not CAVEATS, because two tripwires log as fired and four Executive Committee changes landed in one filing, with tenure language that differs between the PR and the Reg 30. T4 is ruled FIRED only on conservative bias. If management says the facility is ready and capitalised by Mar-2027, reading A holds and T4 should be re-marked NOT FIRED. A3P-08 and A3P-11 are resolved as deck labelling, not hidden charges. The thesis's deciding variable (research revenue) is absent from every filing. Read the transcript first."
