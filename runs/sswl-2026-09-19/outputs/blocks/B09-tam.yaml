analyst_note: >
  The single most consequential number in this stage is the SOM-implied
  sustained revenue CAGR of 12.4-12.7%, roughly half management's FY27
  guidance of 25% and the strategy's 25% CAGR target. Both readings are
  evidenced, not shaded: FY27 guidance is a low-base, capacity-ramp
  catch-up year (GST 2.0 recovery, Bhuj/knuckle ramp); SOM reflects
  realistic 3-5yr share-gain economics against an ~8.5% p.a. growing
  market. The 5yr SOM (Rs 9,280 Cr) also exceeds what SSWL's currently
  committed capex can physically produce (Rs 6,893 Cr ceiling per B07's
  33% embedded-growth figure) by ~35%, meaning the 5yr SOM assumes a
  second, unannounced capex cycle. LBF1 (export-exceeds-domestic within
  a decade) could not be tested against a sized export TAM -- no
  independent source exists -- so Section 5D substitutes a near-term
  quarterly delivery test (FY27 Rs 600cr export guide vs Q1 actual
  Rs 127cr) for Stage 11/FTTCP to track instead.
