net_narrative_effect: "complicates"
analyst_note: "The receivables finding (Q4) is the load-bearing result of this stage: Varroc's direct denial of any receivable-days change in the same quarter INEL's overdue bucket spiked 152.4% is the closest thing this pipeline has to cross-examined evidence on INEL's single most decision-relevant number. It does not prove INEL's build is company-specific -- Varroc's customer mix (Bajaj-heavy) differs from INEL's (TVS/Hero/Bajaj) -- but it removes the industry-wide-effect explanation as the default benign reading. Combine this with the disclosure-gap pattern (Q2, Q3, Q9 all verified peers-quantify/INEL-doesn't) and Part 5's content-share-gap hypothesis: the picture that emerges is not that INEL is lying about anything peers can check, but that INEL's disclosure practice is thin enough, on exactly the topics that matter most for a transition thesis (content wins, capex detail, receivables), that this pipeline cannot independently corroborate the bull case the decks imply."
