verdict_basis: "No legal or pledge issue, filed fair primary issue to a PE investor, promoters buying and abstaining from their own buyback; cautions are an unexplained FY24 promoter sell-down of about 15 lakh shares, Audit Chair exit and independence items"
analyst_note: "Fact 4: of the 23.6 point fall (61.71 to 38.12), about 16.9 points is dilution, filed (EGM 2021: 11 lakh shares plus 43 lakh warrants to Infinity Direct at Rs 130, Investment Agreement 2021-05-27, new Articles). About 6.7 points is a promoter share-count cut of about 15 lakh shares between Jun 2023 and Mar 2024 (derived from aggregator and AR25 p.147); buyer NOT FOUND. Denominators reconcile only if all 54 lakh instruments were issued, so Infinity Direct (39 lakh at Mar 2024) also trimmed about 15 lakh, or part went to another holder. Separating observation: Reg 29 and bulk-deal data for that window. Hold the doubt in position size. Verdict sits at the TRUSTWORTHY lower bound and moves to CAUTION if the sale was off-market to a related party or the Audit Committee has no independent chair into FY27."
