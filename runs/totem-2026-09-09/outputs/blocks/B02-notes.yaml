  - "Company's own ratio-table commentary marks 16-24% YoY swings (inventory turnover -19.35%, payables turnover +16.15%) as 'No Major Change' (Note 33.2)"
  - "FX risk-management policy claims active prudent hedging while zero derivative instruments are outstanding at either year-end (Note 33.8-33.9)"
  - "PPE comparative roll-forward mislabels the FY25 opening balance as NIL (Note 3), a presentation artifact not affecting closing balances but signalling note-preparation QC gaps"
  - "Promoter pledge disclosure absent from the Notes entirely; a structural completeness gap, not a Notes-stage defect, that downstream stages must close via the SHP filings"
questions_for_mgmt:
