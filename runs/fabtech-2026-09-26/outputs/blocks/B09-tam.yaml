  - {type: FLAG-SOM-BELOW-HURDLE, reason: "Normal-band, evidence-consistent SOM growth (13.6% 5yr / 15.4% 3yr CAGR) sits below both FY27 guidance (20-25%) and the strategy's 25% CAGR hurdle. Reaching guidance requires either an aggressive 3-5pp share-gain rate (unevidenced given the flat order book, B07 FLAG-ORDER-BOOK-PLATEAU) or unmodelled SAM-expansion levers (Section 5D) converting to disclosed revenue."}
  - {type: FLAG-METHOD3-GAP, reason: "Peer revenue aggregation (Method 3) not usable: 9 of 10 CRISIL-named competitors are private with no disclosed financials; the one data point found (Exyte GmbH, ~EUR 7.4bn) is 150x+ Fabtech's scale and spans a broader semiconductor/data-centre mandate, illustrating the competitive tier spread rather than sizing the TAM."}
