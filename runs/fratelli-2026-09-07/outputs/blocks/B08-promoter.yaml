verdict_basis: "No SEBI/criminal/tax-fraud finding, zero pledge, zero promoter selling, and promoter-side warrants fully converted argue against CONCERN; but the unexplained Aug-2026 consolidation of 20.79% into a non-board patriarch, the Rs 663.03 lakh Section 270 misreporting penalty, the KMP remuneration disclosure defect, and an oversized, partly unbenchmarked promoter-group entity map together exceed a routine small-cap governance profile, landing at CAUTION."
analyst_note: "The single highest-value finding this stage adds is the family map itself: Bhupinder Kumar Sekhri is Gaurav Sekhri's father and the late Kapil Sekhri's father (Kapil, Fratelli's founding MD, died in 2020); Puja Sekhri is inferred to be Kapil's widow. None of this is stated in the AR and required web reconstruction, which is why it is media-tier, not filing-tier. This reframes the Aug-2026 20.79% gift transfer from an opaque red flag into a plausible, but still unexplained and unmonitored, intra-family succession/estate move: shares flow from the operating generation up to the non-operating patriarch, not sideways or out of the family. Separately, correct the injected brief: Gaurav Sekhri's AR profile does not mention Bunge; the Bunge/Louis Dreyfus credential belongs to independent director Adhiraj Amar Sarin. Downstream stages should carry the corrected attribution and should treat the Mayank Singhal/TP Buildtech/Fratelli Wines board-seat finding as an open disclosure question for Halt 1, not a resolved fact either way."
