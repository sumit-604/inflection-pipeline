analyst_note: "Filed numbers govern; the concall adds little that is verifiable. The cleanest cash test is the prior-year H1 comparative: inventory built Rs 4.79 Cr in H1 FY26 against Rs 70.65 Cr in H1 FY27 (RES L480), under the same stated seasonality (CC L387). On matched windows inventory days rose 14.4 (TTM) to 16.6 (6M) and the cash cycle lengthened 5.2 to 8.9 days. Q3 revenue separates pre-build from slow offtake because Q3 has no balance sheet. Bull Rs 392.5 Cr is the H2 FY26 quarterly average +20%, a FY27 +25.0% pace. The FY27 20% guide needs only Rs 362.54 Cr a quarter, on the bear line, so a bear print still meets the guide and fails the step-up. Receivable days 70.3 on net revenue reconcile to the company's ~59 on gross sales at 18% GST. Verdict is FLAGS not CAVEATS because cash, margin and funding moved adversely in the same half and the call contradicted the filing on two items. Governance fine weighted low, but the prior-year Reg 31 record is ND, so a pattern is not ruled out. Loop 1 moved no verdict-card number."
