  - "Why does the order book roll-forward not close (Rs 222.6 Cr FY26; Rs 268.7 Cr H1 FY27)?"
  - "What is the Rs 240 Cr rise in other current liabilities made of, and how do advances map to delivery dates?"
  - "What minimum volume or price mechanism sits in the Siemens Energy, INNIO and Alstom agreements?"
