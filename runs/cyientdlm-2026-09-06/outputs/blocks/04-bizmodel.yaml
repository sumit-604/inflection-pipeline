  - {risk: "Loss of a large programme (a recurred pattern, per the FY25 defence order completion)", first_signal: "Order book and order intake growth rate (AR FY2025-26 p.27)"}
  - {risk: "Import-dependent material cost spike outruns pass-through clauses", first_signal: "Direct material cost as a percentage of revenue rising without a mix explanation (MD&A p.54)"}
