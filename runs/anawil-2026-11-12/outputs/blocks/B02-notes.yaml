analyst_note: "Pass 3 changes two earlier readings. First, the vendor advances are 98% capital-goods advances (AFS Note 18), booked as current assets. That puts a rising capex outflow inside operating cash flow, so the earlier adjusted CFO of Rs 6.3 to 10.1 Cr is superseded. Capex-neutral CFO is Rs 28.1 to 31.1 Cr, 78% to 85% of PAT. Conversion is still unproven: Rs 30.0 Cr sits with unnamed vendors, and inventory and receivables were loaded in Feb to Mar 2026 (bank returns). Second, 93% of FY26 PBT fell in H2 at a 50.1% EBITDA margin against 24.5% in H1 FY26 and 23.4% in H1 FY27. Two readings: model-mix shift or year-end timing. The separator is revenue by model per half-year plus customer-wise ageing. The 115BAB tax demand (Rs 3.67 Cr, 17 Jul 2026) and the 97.60 lakh Darpan fee sit outside every audited note. Positives: unmodified opinions, clean ageing, no default, no going-concern language. Position size, not input shading, should carry the conservatism."
