going_concern_language: "NONE (standard affirmative statement only):
  'financial statements have been prepared on going concern basis... no
  material uncertainty exists that may cast significant doubt on the going
  concern assumption' (accounting policy 2.1(c), standalone p.140-141 /
  consol identical). No qualifying or risk-flagging going-concern language
  found anywhere in the notes."
analyst_note: "The notes read consistently point one direction: FY26 looks
  fine or improving at the parent (standalone PAT +20.7%, cleaner realised
  trading gains, falling exchange charges on a smaller derivatives book) but
  WORSE at the group level (consol EPS -5.1%, Algoplus PAT -64.7%, IFSC
  subsidiary to a loss, profit concentration in the parent rising to 92%).
  If the transition thesis rests on subsidiaries carrying the annuity/fee
  story, FY26's Schedule III numbers argue against it happening yet. The NCD
  end-use/early-redemption item (Note 17e/18e) is the single most load-bearing
  new fact in this pass: it is dated 19-May-2026, months before the Aug-Sep
  2026 stress events in company memory, and plausibly explains them
  mechanically rather than coincidentally."
