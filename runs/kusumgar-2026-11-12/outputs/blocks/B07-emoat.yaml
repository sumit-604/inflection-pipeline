analyst_note: "Facts checked first. (1) Cash: B01/B03 numbers carried (FY26 CFO 15.0% of EBITDA); G1 and G2 score 0 because the balance sheet moved the wrong way. (2) Segment mix: single segment after listing, so C2 and E2 lean on FY24-FY26 prospectus tables only. (3) Utilisation 49.50% FY26 (Prospectus p.204) and 55-60% per management (Concall p.11); capex_embedded_growth_pct is 5.0 because only CWIP 101.04 INR mn (Q2 results p.11) is under execution; with the 58.33 INR mn commitment it would be 7.83%. Growth must come from filling idle capacity. (4) Concentration improved (top customer 28.90% to 11.13%) but the 100% offer for sale and the loss of the FY25 single orders drive part of it. To avoid crediting one improvement twice, Decathlon and export ramp sit in E2, certifications and approvals in B2, and A&D Solutions licence revenue in H2 only."
