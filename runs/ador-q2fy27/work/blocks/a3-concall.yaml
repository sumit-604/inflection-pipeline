analyst_note: "Gross margin is the call's centre. Four of ten analysts pressed it, and no Q3 number came back. It is also the binding lever for the 12-13% EBITDA target. Operating costs already fell to 24.0% of revenue in H1 FY27 and 23.2% in Q2, from 26.3% in FY25 and FY26. That is the ratio the target needs. So the target mainly needs GM back at 36-38%, and three things work against that: steel is not softening, part of the dip is a chosen growth cost kept into H2, and the higher-margin M&R line grows at half the company rate. If the cost ratio reverts toward 26%, the target needs GM above the FY26 peak. The working-capital answers are the weakest part of the call. Payables fell Rs 48 Cr, H1 operating cash flow was negative, and Rs 27.7 Cr of fund-based debt appeared beside about Rs 119 Cr of liquidity. Flares is most likely an exited division with one provided legacy project. The test is whether a further charge appears at completion. All call numbers are ASR-tier."
