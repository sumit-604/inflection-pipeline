status: complete
input_gaps:
  - "Investor presentation is stale (Q1 FY24, filed Aug-2023); used only for context, AR FY26 governs all current figures"
  - "No named competitor for any of the four product lines in either the AR or the presentation; competitive map built from Visaka's own claimed rank/share only"
  - "ATUM Solar Roof has no separately disclosed revenue line; folded into the combined Building products segment with roofing and boards"
  - "Roofing and boards profitability are not split from each other; only the combined Building products segment profit is disclosed (AR FY26 Note 37, p.199)"
