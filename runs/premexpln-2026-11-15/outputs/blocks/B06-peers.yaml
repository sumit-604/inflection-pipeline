risks_peers_raise:
  - "Procurement shift away from L1 lowest-price toward technical parameters and owned IPR (ASTRAMICRO Q3 FY26 p3): hurts price-won suppliers; Premier lost Coal India bulk and Jagdalpur on price (B05)."
  - "CIL and Singareni buy on L1 basis rather than value (SOLARINDS Q2 FY26 p14): matches Premier's bulk explosives loss."
  - "New private competitor entering explosives, Kalyani Group (SOLARINDS Q4 FY26 p6-7)."
  - "Commodity price spike can cut demand for a few months; ammonium nitrate (SOLARINDS Q4 FY26 p11)."
  - "Supply chains stretched as countries restock defence inventory (ASTRAMICRO Q1 FY27 p5)."
  - "Foreign content and FX on defence orders forces early inventory build and obsolescence risk (ASTRAMICRO Q3 FY26 p7); JV FX provision about USD 2 million (Q4 FY26 p17)."
  - "DRDO and user approval delays in development contracts push revenue across periods (ASTRAMICRO Q3 FY26 p9-10)."
  - "Working capital intensity: PSUs pass little financing down, production orders carry no advance (ASTRAMICRO Q3 FY26 p6, p11)."
  - "Geopolitics-driven inventory build lifted Solar's FY26 working capital by about Rs 1,600 Cr (SOLARINDS Q4 FY26 p9-10)."
  - "Defence export orders depend on a Government of India banned-country list (SOLARINDS Q2 FY27 p9)."
net_narrative_effect: "complicates"
analyst_note: "The peer set supports the sector backdrop Premier cites (strong defence demand, inspection and approval delays, working capital drag, input price rises) but not the size of Premier's miss. Both peers earned 28-33% EBITDA and met or beat guidance. Solar names escalation clauses and inventory as its margin shield; Astra exited low value-add build-to-print at single-digit margin. Premier's pattern (bulk explosives at low single digit, lost on price) sits on the side the peers left. No peer has chaff, flare or mine evidence, so the moat claim stays untested. Zero contradictions, but the 6 partials rest on one peer each and the 3 unverifiables are the licence, moat and integration items that matter most to the thesis. BDL, the only PSU peer and the buyer-side view, is missing."
