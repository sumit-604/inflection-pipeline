analyst_note: "Three independent cross-checks confirmed on this pass, all unresolved in the source: (1) Note 36 vs CARO Annexure A, a 12.8x contingent-liability understatement; (2) DSCR 0.39/0.40 (Note 49(f)) independently corroborates the cash flow statement's FY26 negative OCF swing, same conclusion from two audited sources; (3) two separate unreconciled gratuity-note figure gaps within one annual report. None of these override the merger (Note 50) as the dominant fact, but together they lower disclosure-transparency confidence below what the clean audit opinion alone would suggest. The unqualified opinion and absence of going-concern language should be read as auditors accepting DSCR/OCF weakness as not yet threatening viability, not as a rebuttal of the liquidity concern itself."
