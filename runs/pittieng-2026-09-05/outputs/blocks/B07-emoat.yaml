analyst_note: "The single most load-bearing finding in this scan is the R&D-Nil vs. R&D-marketed contradiction: the AR's own statutory Technology Absorption disclosure states R&D expenditure and effort are Nil, while the investor presentation markets 'R&D and Tooling Expertise' as a strength. This directly caps A2, A4, and F1, and is why I1 fails leg (a) cleanly rather than marginally. Six categories cross into Moderate-or-better (B2, C1, C2, E2, F2, R1), all clustered around the same underlying transition story (mix shift, widening customer roster, China+1 export tailwind) rather than being independent, diversified sources of forming advantage — a concentration risk in the emerging-moat read itself, worth naming for synthesis."
