industry_cross_read:
  demand: "Peers agree on growth but not pace: TCIEXP surface +9%, Delhivery PTL +14% to +18%, TCI freight +11.5-12% mostly price; October called strong by TCIEXP and Delhivery with no number, TCI reports softer pre-festival stocking"
  pricing_inputs: "All three pass diesel on with a lag of days to a month; realised price moves are 1.5-3% (TCIEXP, TCI) and mostly non-fuel at Delhivery PTL; wage costs rising everywhere; VRL's 9% rise is outside the peer range"
  capex_cycle: "Broad but uneven expansion, not a capacity race: TCIEXP Rs 100 Cr a year on owned centres, TCI Rs 500-600 Cr FY27 on ships, trucks and warehouses, Delhivery capital intensity under 5% of revenue; no peer cuts; VRL is not a lone expander but is the only fleet-plus-property LTL expander"
peer_mentions_of_company:
  - "TCI Q2 FY27 p.14 (Vineet Agarwal): 'we don't compete with delivery, and I think VRL perhaps is competing a little bit more on the delivery side as well as with the express business. I think they are also taking away some of that little bit of the express side because of the high, because perhaps a little lower pricing that they are offering other than the express companies, which I have been seeing for some time.'"
