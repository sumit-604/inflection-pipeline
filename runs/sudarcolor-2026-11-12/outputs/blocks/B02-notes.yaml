going_concern_language: "NONE adverse. Note 2.2 (p.76): statements prepared 'on the basis that it will continue to operate as a going concern'; no material-uncertainty text in the notes. Note 48 (p.97) records insolvency of former Heubach German entities (previous year), not of the company"
analyst_note: "The notes show a debt-free, cash-rich company, so the risk is not solvency. The risk is who the customer and supplier are. A quarter of sales and a third of purchases are with the promoter group, and the group side of the working capital moved against the company. Overdue payables of 62.32 and group payables of 43.87 may be the same money. If so, the cash-flow fall (OCF 34.24 vs 110.59) is partly group-financed timing. If not, the company is stretching third parties while holding 235.37 of cash. One observation separates the two readings: the ageing of group payables. FY25 OCF was itself lifted by a 34.50 working capital release, and FY26 by a 24.76 government-balance release. Judge neither as a run rate. Note 50 and Note 40 disagree on whether CIPL is a related party."
