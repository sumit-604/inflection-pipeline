  - {metric: "Trade receivables / revenue (closing)", healthy: "falling from 93.22%", red_flag: "flat or rising"}
  - {metric: "Operating cash flow", healthy: "turning positive", red_flag: "staying negative beyond 1-2 more quarters"}
  - {metric: "EBITDA margin", healthy: "at/above 36.71%, closing gap to peer 41-42%", red_flag: "compression below ~30%"}
