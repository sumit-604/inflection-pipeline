flags:
  - "FLAG 1 (material): the AR discloses two conflicting B2S revenue shares for FY26 in the same document. BRSR Section 16 states 25% of turnover (AR FY2025-26, p.62-63); the SET-framework infographic states 6% of FY26 revenue with an explicit FY27 double-digit target (AR p.7). The 6% figure is independently corroborated twice: by the $133.1M B2P against $8.8M B2S dollar split (AR p.61) and by the standalone Ind-AS services-transferred-over-time line at 10.3% of standalone revenue (AR p.144, Note 20). Treat 25% as unreliable."
  - "FLAG 2 (minor): vertical mix stated two ways in the same AR. The p.6 infographic gives Aerospace 43%, Defence 9%, Industrial 27%, Medical 19%, Automotive 2% for FY26; MD&A prose (p.51) separately states Industrial approximately 30% and MedTech approximately 15%. Non-load-bearing but unresolved."
  - "Consolidated FY26 headline numbers (revenue -16.99%, PAT +7.65%) mask a standalone India-parent collapse (revenue -29.9%, PAT -26.6%, India-geography revenue -84.4%) entirely offset by the US subsidiary Cyient DLM Inc swinging from a Rs84.69mn loss to a Rs246.69mn profit, partly a one-off Rs195.75mn earn-out reversal (AR p.171 Note 35; p.54)."
  - "Reported FY26 PAT growth (+7.65%) is earn-out-reversal inflated; normalised PAT fell 24% YoY (AR p.27). Do not use reported PAT for trend extrapolation."
  - "NWC days (consolidated) 63/48/79/127/145 across FY22-FY26, rising to 161 by Q1 FY27, driven by DIO not DSO (receivables fell YoY). Company-specific deterioration, not industry-wide: named peers AVALON and SYRMA improved working capital while growing faster, per stage 6."
contradicts_upstream:
  - claim: "B2S is 25% of turnover"
    asserted_in: ["B07-emoat (analyst_note and monitorable on B2S share)"]
    finding: "The 25% figure comes from BRSR Section 16 (AR FY2025-26, p.62-63). The same AR states 6% on p.7, and 6% is corroborated twice independently: the $133.1M B2P against $8.8M B2S split (p.61) and the standalone services-transferred-over-time line at 10.3% of standalone revenue (p.144, Note 20)."
    disposition: "Treat 6% as the working number. Do NOT average or split the difference between 6% and 25%. Raise the discrepancy as a named management question. This materially changes how fast the margin-accretive B2S transition is actually running, which is the central re-rating thesis for the name."
    routed_to: ["verifier-a-numerical", "stage-13-synthesis"]
