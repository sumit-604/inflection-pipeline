analyst_note: "No peer is an investment caster, so verdicts are weak. Strongest transferable finding is pace: three peers show 6-18 months of slip from first stated date, all customer-side. Second is margin quality: Azad's CFO ties lower consumption to WIP process content, the same mechanism behind I&PCL's 863.65 lakh inventory credit. Third is funding: only Steelcast funds internally from cash. Peers did not contradict any I&PCL claim; they supply base rates, not corroboration. Stage 11 should read Azad A&D growth (24.7-34%) as capacity-limited company growth, not market growth. Cross-peer hypothesis is in the report (Part 5)."
