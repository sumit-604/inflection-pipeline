analyst_note: "The peer set does two things at once: it lends real credibility to the existence of a 2026 geopolitical input-cost shock (Middle East/Hormuz), but it strips that shock of its explanatory power for Kronox's flat revenue, since every peer facing the same shock still grew double digits. It also nuances rather than resolves the Dahej capex red flag: Kronox's vagueness matches the two peers (DMCC, Indo Borax) who are not currently raising external capital for expansion, and falls well short of the two peers (Neogen, TANFACIND) who are. The cross-peer hypothesis (Part 5) suggests disclosure discipline may be market-imposed via capital raises rather than a pure governance choice, giving stage 8/11 a concrete confirm/kill signal: watch whether any future Kronox capex announcement is paired with a QIP/preferential raise, and whether disclosure specificity jumps accordingly."
