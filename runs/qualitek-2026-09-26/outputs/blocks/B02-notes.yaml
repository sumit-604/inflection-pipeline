going_concern_language: "NONE. Confirmed absent across the notes, both standalone and consolidated auditor's reports, and the secretarial audit report on all three passes. Only boilerplate 'on a going concern basis' appears as the accounting convention, no emphasis-of-matter or material-uncertainty paragraph."
analyst_note: "The single sharpest evidence-tier finding across three passes is the disclosure-depth asymmetry: the same filer gives an instrument-by-instrument borrowings table (lender-facing) but zero valuation methodology for the ITCPL share swap (promoter-facing), Note 5 vs Note 3/26/27. This shows the RPT valuation gap is a choice, not a format limitation, and should weigh on the promoter-governance line at stage 11/Role 2 more than the raw goodwill or ROE numbers alone would suggest. Standalone ROE/ROCE decline (finding 1) and the CWIP tripling (finding 12) are mechanically linked: the same capital-deployment-ahead-of-earnings pattern explains both."
