  - field: peer_download
    detail: >
      CDSL returned zero files on the collector pass (screener login hit
      net::ERR_INSUFFICIENT_RESOURCES). Re-run manually with screener_collect.py;
      4 concalls and 6 CSVs recovered. Peer corpus is complete.
  - field: rating
    detail: >
      inputs/rating/ is EMPTY and this is not a gap. IEX carries borrowings of
      Rs11.16cr (FY26) and told BSE on 13-Apr-2026 that it does not qualify as a
      Large Corporate, i.e. it has no listed debt. No CRISIL, ICRA or CARE rating
