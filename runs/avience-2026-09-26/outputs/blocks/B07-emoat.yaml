combined_assessment: "GOOD"
combined_reasoning: "Backward GOOD (Gate 0, deal-breaker-capped by FCF negative three straight years) plus forward NO MEANINGFUL EMERGING MOAT (em_score 11, below the 12-24 MODEST band) does not fit the transition-alpha setup; the combined read is GOOD, unchanged from Gate 0, because the forward scan finds mostly pipeline/claim-tier evidence rather than documented moat expansion large enough to offset the backward cap."
top_moat_risks:
  - "Entire forward narrative concentrated in one unverified order (Uttarakhand/PSU, no Reg 30 filing) and one capex project on a fixed October-2026 deadline that has already shown a 3-month intermediate slip."
  - "Cash-conversion metrics (WC days, receivables ageing, provisioning coverage) are moving in the wrong direction even as the growth story is being told, and FCF has been negative for three straight years, leaving no internal war chest to fund any delay."
  - "FY27 export guidance is framed against a base that collapsed 89.9% YoY, unacknowledged on the only call held to date."
  - "The two Moderate-scoring categories (B1 RM-sourcing shift, R1 regulatory tailwind) are narrow and partly shared with named competitors (other medical device parks), not durable Avience-specific edges."
analyst_note: "The reagent-rental/closed-loop mechanic (B2) is already ~74% of FY26 revenue and sits inside Gate 0's existing moat_score; only its incremental new-plant-driven scale-up is treated as emerging here, to avoid double-crediting one moat mechanic across two pipeline stages. em_score of 11 is a genuine borderline case, one point below the MODEST MOAT DEVELOPMENT band (12-24); if placement counts and per-instrument reagent revenue are disclosed once the YEIDA plant is commercial and independently support a documented-tier B2 incremental score, this could move into MODEST. Today the evidence does not support that tier. Both I1 and I2 (Family I) scored 0 by design; no threshold crossing via I1/I2 occurred on this run."
