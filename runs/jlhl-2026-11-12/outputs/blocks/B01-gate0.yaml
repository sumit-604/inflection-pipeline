analyst_note: "Core 71 with STRONG moat gives GOOD+ on the matrix; the Block B deal-breaker caps it at GOOD. The Block B shortfall is expansion capex, not weak operating cash: cumulative CFO/PAT is 1.62 and CFO is flat at about 267 Cr, but FCF turned negative in FY25 and FY26 as borrowings (incl. leases) went from 0 to 584 Cr, and Sep-26 is 668.6 Cr. Block C is flattered by the small FY20 PAT base; PAT is flat across FY25-FY26 while revenue grew 15%, which is the operating-leverage question for later stages. ROCE fell from 20.49% (FY23) to 13.77% (FY26) as capital employed rose faster than EBIT. Moat score is arithmetic on a hospital operator; M5 and M7 need peer data."
