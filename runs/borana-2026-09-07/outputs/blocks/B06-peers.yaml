analyst_note: "The single highest-value finding is that the BIS/QCO mechanism is real and industry-wide but Borana's own account of it (December, conflated with anti-dumping duty) does not match how two independent peers and a third-party analyst describe the same event (November, two separate policy tracks). This is a credibility ding on the explanation, not evidence the margin gain itself is fake - the direction and rough magnitude of the underlying price move are corroborated. The capex-efficiency contradiction (Q5) is the more consequential one for forward valuation since it bears directly on the doubling plan's revenue assumptions, though the machine-class mismatch (spindles vs. looms) means it is suggestive rather than dispositive."
