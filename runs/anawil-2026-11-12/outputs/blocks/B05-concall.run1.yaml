analyst_note: "No transcript. Grade C is the mode default; B was not earned on one half-year of evidence. The load-bearing derivation is not margin but towers: Rs 296-346 Cr in H2 needs 206-280 towers (1.4x-1.9x the record 148) against a Koppal half-year nameplate of 210, so guidance quietly depends on Kutch approval, which management never links to the target. Seasonality alone does not make guidance a stretch (H2 needs 66-69% of the year vs 70.5-80.2% history). The Rs 32.82 lakh EBITDA per tower does not reproduce on 107 or 108 towers (Rs 33.7 or 33.4 lakh). Rerun 2E and tone ratings once the 2026-11-09 transcript is filed."
