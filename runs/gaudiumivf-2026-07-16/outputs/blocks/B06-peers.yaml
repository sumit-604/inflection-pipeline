risks_peers_raise:
  - "Execution-delay risk on aggressive builds (Rainbow: Gurugram halted by pollution order, Coimbatore delayed 6 months, 9-12 month delays acknowledged as recent-cycle norm; HCG: zoning administrative delays) - not proactively flagged on Gaudium's own call"
  - "Multi-quarter demand seasonality/softness (Rainbow: 3 consecutive soft quarters Q1-Q3 FY26) - risk category untested on Gaudium's single maiden call"
  - "Payor/scheme concentration risk (HCG: Odisha scheme withdrawal cost ~INR4.5cr/quarter; CGHS and GST policy swings) - lower relevance given Gaudium's cash/EMI-financed base, but institutional-payor risk generally undiscussed"
  - "Competitive entry from well-funded multi-specialty/corporate chains building fertility verticals (both HCG and Rainbow flag this pressure in their own categories) - not addressed on Gaudium's call"
