strengths_top3:
  - "Post-IPO balance sheet genuinely repaired: CRAR 20.80%->26.12%, D/E 4.42x->2.87-2.88x, fully positive ALM gap ladder, IPO proceeds deployed to their single stated purpose"
  - "Unusually candid compliance-history disclosure (CARO, BSE, RoC) for an IPO document, providing the evidentiary base for this report's own findings"
  - "Improving core unit economics independent of the DA/ARC gain question: NIM 9.27%->9.73%, spread 9.10%->9.90%, operating-expense ratio 6.60%->6.19% FY23-FY25"
red_flags_top3:
  - "DA/ARC gain-on-sale dominated PAT in two of three restated years (76.1% FY23, 67.6% FY24, 26.8% FY25) while the underlying ARC-transfer volume accelerated >36x FY24-FY25, including SMA/pre-NPA accounts for the first time"
  - "Unreconciled ~180x gap between Note 98(c) NPA-transferred-to-ARC (Rs109.54cr FY25) and Note 75 Stage-3 Sold-to-ARC (Rs0.61cr FY25), compounded by FY26's 5.4x jump in ARC Security Receipt investments to 8.74% of total assets"
  - "Four-domain 'correction only under external scrutiny' pattern: four restated GAAP errors, a two-year audit-trail qualification narrowing but not fully closed, BSE penalties plus a platform debarment, and five years (FY2015-FY2019) of RoC filing discrepancies self-disclosed only in December 2024"
best_fit_strategy: "GARP (WATCHLIST) -- growth is real and priced reasonably at IPO, but the 'E' in the P/E has not yet been demonstrated to be a clean, recurring earnings stream given the DA/ARC gain dependency"
one_line_verdict: "Repaired balance sheet, unresolved earnings-composition and disclosure-reconciliation questions."
