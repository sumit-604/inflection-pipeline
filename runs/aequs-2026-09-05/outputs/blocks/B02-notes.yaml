receivables_trend: "DETERIORATING: net trade receivables Rs 264.61 Cr FY26 vs Rs 156.60 Cr FY25 (+69.0%) against revenue growth of only 33.1%; DSO rose from 61.8 days FY25 to 78.5 days FY26; ECL coverage on gross receivables fell from 1.91% FY25 to 0.73% FY26 with zero fresh charge booked (only a reversal); ageing itself stayed low-overdue (over-6-months share ~3.2% of gross, stable both years). Independently corroborated by the Note 15(B) Axis Bank quarterly stock-statement reconciliation, where the books-vs-reported gap on trade receivables widens every quarter of FY26: Rs 29.95 Cr (Jun-25), Rs 36.21 Cr (Sep-25), Rs 54.71 Cr (Dec-25), Rs 59.01 Cr (Mar-26) (Note 9(i) AR p.250; Note 28(A)(ii) AR p.279; Note 15(B) AR p.267)."
