analyst_note: "The single most decision-relevant fact this stage surfaces is that the two accounting threads company memory already flagged as load-bearing (MNC advances, subsidiary receivables/consolidation profit) both check out as genuinely unresolved in the audited AR, not resolved by a closer read. The MNC gap is a magnitude mismatch (3x), not a rounding difference, and the note the auditor singled out for the most judgment is the least quantified note in the file. The subsidiary-receivables and consolidation-adjustment findings are the same phenomenon from two notes that never cross-reference each other; downstream stages should treat them as one risk, not two, when sizing FLAG-CASH severity."
