questions_for_mgmt:
  - "AWS Technology Agreement commits Rs.24,176.20mn over six years (May 2025-Apr 2031), only Rs.5,500.64mn IPO-funded: what is the annual minimum-spend cadence and take-or-pay penalty structure for the remainder, and how does planned revenue growth cover the balance?"
  - "What is the pricing basis and independent fairness assessment for Vinculum Advisors LLP's acquisition of a 10.19-10.60% stake at Rs.25/share in July 2025, versus institutional cost bases of Rs.21.45-172.16/share disclosed elsewhere in the Prospectus?"
  - "Given the India Holding Company has not reported a profit in any period of the five-period track record, what is management's timeline for India-entity standalone profitability, and how does this square with the arm's-length position taken in the transfer-pricing dispute?"
  - "What is the specific remediation timeline for the audit-trail and India-server-backup deficiencies flagged in all three of FY23, FY24 and FY25 -- will FY26 be the first clean Rule 11(g) report?"
  - "Is the falling unearned-revenue/contract-liability balance (Rs.1,124.50mn to Rs.767.95mn, FY23 to Sep-25) despite +70.8% revenue growth a genuine shift to usage-based billing, or does it reflect softening forward bookings? What is the RPO/backlog trend the company has elected not to disclose?"
