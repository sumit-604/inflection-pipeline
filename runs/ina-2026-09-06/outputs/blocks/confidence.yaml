carry_to_lessons_archive:
  - "Citation-basis defect, systemic: stages 5 and 6 cited each transcript's
     printed 'Page X of Y' footer instead of the extraction '===== PAGE N ====='
     marker. An unnumbered SEBI cover letter offsets the two by exactly one page
     on every transcript, so anchors drift. Found independently by verifier D
     (2 MAJOR) and verifier B (1 MINOR). Fix: name the extraction marker as the
     sole anchor authority in the stage task message and bar the printed footer."
  - "Concall stages verify peer PRICES and DATES well and peer OPERATING NORMS
     poorly. B06 verified realisations and regulatory dates cleanly but did not
     test utilisation, ramp duration or capex per GW against peers, which is
     where verifier B found 3 of its 7 CRITICALs. Candidate for a named
     sub-checklist in prompts/06."
  - "B05 promise-delivery tracker completeness: three missed promises absent from
     the tracker (FY26 volume 2,000-2,100MW, FY26 EPC revenue Rs 400cr, Units 1-2
     TOPCon conversion). Accuracy was fine, six of six spot-checks confirmed;
     completeness was not. Candidate for an explicit sweep instruction."
