one_line_verdict: "A build-to-spec generator maker riding a gas and data-centre upswing with 20% margins and net cash, but cash comes in slowly, sales sit with a few OEMs, and the 2,900-3,000 Cr guide still leans on customer advances staying in place."
analyst_note: "Sector cap row Cables / Industrial products (25x) is supported: one segment, AC generators and motors (AR p.170, p.238); no better row exists (Recycling / Manufacturing is also 25x; energy transition equipment 28x does not fit gas and data-centre generators). New this stage: (1) H1 FY27 CFO is 100.8% of PAT only because other payables and liabilities added Rs 297.6 Cr; without it CFO is negative (Res. p.9). (2) Order-book roll-forward gap repeats: Rs 222.6 Cr FY26, Rs 268.7 Cr H1 FY27. (3) Q1 call: no fresh rail orders. (4) Siemens Energy framework has no volume floor. (5) Implied H2 revenue under the new guide is below the Q2 run-rate. Revenue per unit is a blended average, not a price. Product mix and capacity are NOT FOUND."
