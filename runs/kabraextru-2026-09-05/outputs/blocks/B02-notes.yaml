going_concern_language: "NONE -- confirmed by direct search of both standalone and consolidated Independent Auditor's Reports and Note 1 basis-of-preparation policy; only standard boilerplate on the going-concern basis of accounting and the auditor's own responsibility to conclude on it appears anywhere in the document; no material uncertainty paragraph exists."
analyst_note: "The single most useful cross-pass finding is that the five audited-statement numeric/label errors this year (Note 16 consolidated, Note 42 consolidated, Note 30 standalone, Note 29/31, Note 15 dividend label) span standalone-only, consolidated-only, and both-statement instances. That rules out 'consolidated notes copied from standalone without updating' as the sole mechanism Pass 1 proposed; the defect is closer to a general failure to re-check roll-forward totals and template labels against source numbers before sign-off, recurring across the whole close process. Downstream stages should treat this as evidence about the RELIABILITY of every other number in these notes (a mild haircut to confidence on any single unverified figure), not as evidence of intentional earnings management, for which nothing was found. Separately, the receivables ageing deterioration is real and note-anchored even though the turnover-ratio days figure moves the other way; FLAG-CASH should be read against the ageing schedule, not the turnover ratio."
