verdict_basis: "No SEBI, court, pledge or auditor event found in any searched source; the open offer was priced at Rs 303 vs the Rs 229 SPA and the 75% float rule was met. CAUTION rests on one discretionary act, Rs 41.15 Cr of NGL cash placed in a promoter-controlled IGCL on the day the promoters signed for control, plus unbenchmarked Pioneer Jellice purchases and thin board independence."
analyst_note: "Two readings of the IGCL stake. A: strategic consolidation, NGL gains an associate in its own industry and a later merger or sourcing link. B: NGL minority cash funded promoter control at 1.2% yield with no exit path. Separating observation: any NGL-IGCL transaction, scheme or loan in H1 FY27 RPT filings, and IGCL price vs 408.86. Alfamont took the Rs 100 special dividend (about Rs 45.4 Cr on its 75%, computed) before the sale; new owners did not. Correct upstream: promoter bodies plus NGL hold 61.12% of IGCL post offer, not 53% (53.56% is SPA plus NGL before the open offer); NGL is a promoter-controlled listco, not a Pioneer Jellice subsidiary as some media say. Jellice Japan fell from 25.00% to 21.74% of Pioneer Jellice while Ashok Matches rose from 8.33% to 19.49% (Mar-2023 to Dec-2024): the Sivakasi families funded the IGCL step. Size for this, do not shade: carry IGCL and Pioneer Jellice as named tripwires."
