analyst_note: "One call, so the grade rests on filed intent versus filed results plus six checkable claims on the call. The tally (2 delivered, 5 partial, 0 missed) counts dated promises only; claims the filings contradict are red flags, not misses. Concentration: FY26 15.76% top customer is filed twice; the call may refer to H1 FY27. Separator: H1 top-1 share, NOT FOUND. Organic: the base FY26 consolidated 214.16 Cr contains acquired revenue, so a 45% CAGR on it is not organic by the AR's own words. Cash: RHP planned 95 debtor days; the call says under 45. IPO: 21.65 Cr is correct and includes 6.00 debt repayment and 10.34 issue costs; only 5.31 went to working capital. Kartavya: two readings, financial loan or live talks on the call date; separator is the agreement date and the H2 utilisation report. Call numbers were read from page images; OCR misreads noted in the report."
