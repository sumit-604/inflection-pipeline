analyst_note: "WebSearch failed 20/20 this run; most guessed industry-report URLs also failed. TAM (Rs23,678-23,875cr) and SAM (Rs1,100cr) are both explicit floors from peer aggregation and a two-peer analog proxy, not top-down industry data; true numbers are almost certainly larger. The load-bearing figure, the SOM-implied CAGR (13.9-16.6%), is built bottom-up off TAAL Tech's own filed headcount (521) and revenue-per-engineer (Rs36.5 lakh), anchored to Q1 FY27's fresh run-rate per Amendment 26, and cross-checked against Onward Technologies' achieved 18% five-year CAGR. The SAM-share-gain math looks aggressive only because the SAM denominator is thin; treat that as a measurement flag, not a SOM red flag."
