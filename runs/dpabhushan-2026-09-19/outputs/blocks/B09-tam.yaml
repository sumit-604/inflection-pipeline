analyst_note: >
  The single most load-bearing finding is the Rs 15,000 Cr-by-FY30 target test (Section 3B):
  it is plausible on pure SAM/TAM grounds (1.45x the base-case SOM) but requires a SAM-share
  gain (+7.4pp in 4 years) beyond even the aggressive band, is not in any filed document, and
  contradicts management's own Rs 4,800/5,500 Cr FY27/FY28 figures from the same call. The
  second finding is that the binding constraint on any of these growth paths is not market size
  (13.1x SAM headroom, STRONG runway) but working-capital funding: an estimated Rs 1,150-1,750
  Cr gap against a postponed QIP and Rs 290 Cr of current borrowings. Third, on LBF1's
  value-vs-volume question, this stage's per-capita finding (India now exceeds China in gold
  jewellery tonnage for comparable populations, CY2024 WGC data) independently supports B04's
  own reading that FY26's growth is more a price/formalisation story than a fresh-demand story
  for the category as a whole, not just for DPAL specifically.
