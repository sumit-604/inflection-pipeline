one_line_thesis: "AURUM at Rs 240 is a proptech-SaaS turnaround whose FY26 Rs 1.90 Cr reported PAT is entirely a Rs 17.72 Cr one-time building-sale gain (continuing-ops PAT -Rs 14.96 Cr); driven by Distribution scaling profitably (Rs 254 Cr revenue, Rs 32.3 Cr segment profit) plus Rental breakeven, SOTP fair value is Rs 85 today / Rs 173 Year-3 base at a 13.0x four-pillar destination PE (ROCE 3.32%, cash 0.80x INDETERMINATE, EM 25.2, sector cap 45x) = -10.9% expected CAGR, so AVOID on valuation, WATCHLIST at Rs 71-89 once an operating profit prints ex one-times. Key risk: one-time-aided earnings plus a +327% YoY jump in >1yr receivables. Cash quality: INDETERMINATE (conservative 0.80x)."
