  - "Cash conversion: FY26 CFO -Rs98.75cr, FCF deeply negative both computable years; balance-sheet strength is IPO-funded, not organic, and management already flags a further ~USD150mn raise may be needed."
  - "Hosur and Karnataka MoUs and the 5-year USD350-400mn capex plan are multi-year, execution-dependent commitments (Hosur revenue only FY29+) from a company that just lost one customer relationship (Hasbro) with no disclosed root cause."
  - "No Reg 30 announcements, no prospectus, no rating rationale in this corpus; PLI quantum, state-incentive detail, and aerospace-only fixed asset turnover are all NOT FOUND, widening this scan's own error bars."
analyst_note: >
  The two categories most contradicted by the company's own disclosed numbers
  (G1 war chest, G2 working capital) are both Financial & Structural rows.
  Read together with Gate 0's own deal-breakers (cumulative CFO/PAT 0.25x,
  negative FCF both computable years), the emerging-moat story here is almost
  entirely an OPERATING one (Aerospace qualification lock-in, new customer
  wins, Hosur, ESG, a regulatory approval) with essentially no supporting
  FINANCIAL emerging moat. That split is itself a finding: the thesis has to
  clear on operating execution and capital discipline simultaneously, with
  no cash cushion doing any of the work.
