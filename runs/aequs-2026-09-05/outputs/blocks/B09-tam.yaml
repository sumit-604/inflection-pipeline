analyst_note: "The two biggest judgment calls in this build are the Aerospace SAM capability filter (75%, reflecting Engine/Landing-Gear as still-maturing categories) and the Consumer unorganised/private-player multiplier (15-20% listed-to-total assumption) — both are ANALYST JUDGMENT, not sourced, and Stage 11 should treat SAM/SOM as a band, not a point figure, given this. The AR's own $3.06Bn aerospace TAM being smaller than independent third-party figures is unusual (management understating rather than inflating) and is worth a direct operator question at Halt 1: does Aequs's own commissioned Industry Report exclude defence/MRO, and if so, does that make Ajna's UAV entry a bigger latent SAM-expansion lever than 5D currently credits it."
