cross_peer_hypothesis: "[INFERENCE] Private defence electronics peers are splitting on who pre-funds qualification, test and production capacity ahead of orders: DP and Apollo do and carry 350-365 day working capital cycles; Astra plans Rs 40-50 Cr a year and funds growth from the order and banks. Testable: Astra customer-side slippage repeats in Q3 and Q4 FY27 unless capex rises above the Rs 40-50 Cr guide. Confounders: DP FY26 growth includes a one-off Rs 180 Cr project; Apollo consolidated growth includes acquisitions; two peers only."
analyst_note: "Three points a later stage cannot rebuild. (1) P1 is UNVERIFIABLE on the PSU subcontract term, but DP says advances sit in all its contracts and Apollo's MIGM carries 20%; a reader who wants a CONTRADICTED call on Astra's no-advance claim should note the channels differ (direct MoD/DRDO/Navy versus HAL/BEL subcontract), so I did not upgrade. (2) P6 CONTRADICTED is weighted: peers describe their own scale-up. Treat it as a reconcile item against AR26 Rs 75 Cr, not proof of error. (3) Several numbers are analyst statements on peer calls (Apollo standalone +36%, Apollo gross 40-odd, Astra Uttam order); they carry less weight. Apollo R&D share was stated 4%, 18%, then 9.5% on one call; unused. PARAS has no coverage, so the peer set is two."
