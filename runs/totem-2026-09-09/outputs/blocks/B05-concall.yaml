withdrawn_from_earlier_runs:
  - "The materials-cost pass-through finding (32.0% to 37.2% of revenue, implying incomplete pass-through) is WITHDRAWN. It was a gross-versus-net basis error ignoring the change-in-inventory line. On a consumption-matched basis the ratio moved 34.3% to 32.2% and gross margin IMPROVED about 212 basis points. Do not carry the 32.0-to-37.2 figure into valuation as margin pressure."
  - "The external support for the raw-material half of LBF-2 is WITHDRAWN. The +60.2% CIF import figure is a rebound off a depressed FY25; on the three-year series FY26 is only 1.2% above FY24 (Rs 2,885.65 lakh FY24, Rs 1,823.74 lakh FY25, Rs 2,921.18 lakh FY26). LBF-2 is MORE open, not less."
analyst_note: "The single most consequential finding this run is negative confirmation: the external support run 2 gave the FY26 raw-material explanation does not hold on a three-year CIF series (FY26 only +1.2% against FY24, not the +60.2% year-on-year headline off a depressed FY25). This REOPENS LBF-2 rather than closing it. The pledge and the maiden dividend are one chain, not two flags; the exact transfer date of the SP-and-Co block to Forbes Campbell is undisclosed, so the rupee amount reaching the pledged parent is a range (Rs 1.8-1.9 cr), not a point estimate. The dividend-to-free-cash-flow multiple could not be verified from the garbled cash-flow extraction; the payout ratio of 89.7% of PAT was verified independently instead."
