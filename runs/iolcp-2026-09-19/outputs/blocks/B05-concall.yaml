credibility_basis: "Beat or met every explicit quarterly guide found in this corpus (Q4 FY26 revenue Rs600->619 Cr, margin ~11%->15.2%; FY26 margin met its own twice-revised 11-12% target at 12.4%); Sep-2026 Rs495 Cr capex breakdown matches the Reg 30 filing exactly; minoxidil launched ahead of its own target quarter. Capped below A by the live guidance walk-down inside the Q3 FY26 call itself, the greenfield project's un-firmed timeline across four consecutive touchpoints, and zero engagement across all four calls, by either management or analysts, with the AR-flagged promoter-shareholding, related-party, and receivables threads (B02/B03)."
