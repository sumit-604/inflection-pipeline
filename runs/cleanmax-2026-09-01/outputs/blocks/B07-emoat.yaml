combined_assessment: "TURNAROUND"
combined_reasoning: "Gate 0 AVOID is leverage/timing-driven (B01: capacity build-out, not eroding unit economics) while the Emerging Moat scan finds genuine, mostly-documented STRENGTHENING (29) built on evacuation-capacity and equity-SPV lock-ins plus a real execution record, with 12 of 22 categories honestly scored zero including three adverse findings."
top_moat_risks:
  - "B1 evacuation-capacity lock-in depends on PGCIL/CTU grid infrastructure CleanMax does not control; Bikaner curtailment (30%->70% in one quarter, resolution slipping three calls running) shows securing capacity years ahead does not guarantee usable capacity on schedule"
  - "C2 concentration risk: Data & AI segment rose from 14% to 42% of contracted capacity in two years, the opposite of diversification, inside a customer base where no top-5/top-10 metric is disclosed"
  - "H1 competitive intensity rising, not falling: Adani, Reliance and NTPC named by management as active new C&I entrants against CleanMax's own 14% market share in a fragmented market"
  - "B2 equity-SPV lock-in scales complexity (~100 SPVs) alongside stickiness; related-party/governance friction at any one SPV is a plausible failure mode"
  - "Promoter pledge finding (B01 FLAG-PLEDGE, 20.02% of promoter holding re-established after RHP reported it released) is a governance risk independent of, and not resolved by, this moat scan"
analyst_note: "The single strongest documented moat in this scan (B1, evacuation capacity secured years ahead of demand) and the single largest named risk (Bikaner curtailment) are the same underlying resource: grid access CleanMax does not control. Whether curtailment is a one-off transmission-upgrade timing issue or a structural feature of scaling CTU connectivity is the load-bearing open question for the TURNAROUND read in 6D, and this stage's evidence does not resolve it. Pricing power is genuinely weak (new-PPA tariffs fell Rs4.12->Rs3.57/kWh, FY24-FY26) even as the moats scored here strengthened; the transition thesis, if any, rests on volume/relationship lock-in and execution compounding into margin, not on price."
