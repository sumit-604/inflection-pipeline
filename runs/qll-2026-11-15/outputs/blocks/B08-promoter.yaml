verdict_basis: "No integrity, legal or regulatory finding against any promoter and no pledge; but three CS exits in 16 months, a 342-day late AR, insider-priced related-party terms without benchmarks and repeated narrative-vs-note conflicts make this a structure CAUTION."
analyst_note: "Promoter list: the run brief omitted Antaryami Nayak, the Chairman and MD (31.87% of TIC in the prospectus); promoters hold QLL through TIC (65,78,375 shares, 56.46%). Warrant facts match B03: 5,20,000 at Rs 518.55, TIC only, Rs 26.96 Cr, 25% upfront; passed 16 Oct 2026 with the promoter label 'not interested'; not yet allotted at run date. The 5 Dec 2026 EGM is only an objects-clause change, unrelated to the warrants. Competing readings: market-floor co-investment vs a free 18-month option with Rs 6.74 Cr at risk; separator is exercise of the Rs 20.22 Cr balance and the source of TIC's money. Verdict is CAUTION, not CONCERN, because nothing shows deceit. A second independent exit, an unfunded warrant lapse, or any pledge moves it to CONCERN. Alok Agarwal is a registered insolvency professional; his IBBI matters are professional roles, no misconduct found."
