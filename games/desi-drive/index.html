<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Desi Drive · RishSchoolDays</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1324; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; }
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .chip { background: rgba(10, 16, 30, .72); border-radius: 12px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
  #top-left { left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  #top-right { right: 10px; top: 10px; display: flex; gap: 6px; pointer-events: auto; }
  .ib { width: 44px; height: 44px; border: none; border-radius: 12px; background: rgba(255,255,255,.92); font-size: 20px; cursor: pointer; }
  #dash { right: 12px; bottom: 20px; width: 210px; background: rgba(10,16,30,.78); border-radius: 18px; padding: 10px 14px; }
  #spd { font-size: 46px; font-weight: 900; line-height: 1; }
  #spd small { font-size: 14px; font-weight: 600; opacity: .7; }
  .bar { height: 8px; background: rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; margin: 3px 0 5px; }
  .bar > div { height: 100%; width: 0; border-radius: 4px; }
  .lbl { font-size: 11px; opacity: .8; display: flex; justify-content: space-between; }
  #map { left: 10px; bottom: 10px; width: 180px; height: 180px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); background: #2d5a27; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #mission-bar { left: 50%; top: 10px; transform: translateX(-50%); text-align: center; max-width: min(560px, 70vw); font-size: 15px; display: none; }
  #center-msg { left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; text-shadow: 0 4px 18px rgba(0,0,0,.6); display: none; }
  #pops { left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pop { font-weight: 800; font-size: 20px; text-shadow: 0 2px 8px rgba(0,0,0,.7); animation: rise 1.6s ease-out forwards; }
  @keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
  #toast { left: 50%; bottom: 90px; transform: translateX(-50%); max-width: min(560px, 90vw); text-align: center; font-size: 15px; display: none; }
  #race-board { right: 12px; top: 64px; font-size: 13px; display: none; min-width: 150px; }
  .screen { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(6, 10, 22, .55); }
  .screen[hidden] { display: none; }
  .card { background: #fffdf7; color: #222; border-radius: 20px; padding: 18px 20px; width: min(560px, 94vw); max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .card h2 { margin: 0 0 8px; font-size: 22px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .btn { border: none; border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 15px; cursor: pointer; background: #ffb703; color: #222; }
  .btn.alt { background: #e9ecef; }
  .btn.go { background: #2a9d8f; color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big .btn { padding: 16px 10px; font-size: 17px; }
  .title { font-size: 44px; font-weight: 900; letter-spacing: 1px; margin: 0; background: linear-gradient(90deg,#ff9933,#ffd166,#138808); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #555; margin: 2px 0 12px; }
  .carrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: #f1f3f5; margin: 6px 0; }
  .carrow.sel { outline: 3px solid #2a9d8f; }
  .lvl { display: inline-flex; gap: 3px; } .lvl i { width: 14px; height: 8px; border-radius: 2px; background: #ddd; display: inline-block; } .lvl i.on { background: #2a9d8f; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #aaa; cursor: pointer; }
  #touch { position: fixed; inset: auto 0 0 0; height: 0; z-index: 12; display: none; }
  .tb { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; position: fixed; bottom: 18px; width: 70px; height: 70px; border-radius: 50%; border: none; background: rgba(255,255,255,.28); color: #fff; font-size: 26px; font-weight: 900; }
  small.mut { color: #777; }
  table.res { width: 100%; border-collapse: collapse; } table.res td { padding: 5px; border-bottom: 1px solid #eee; }
  /* Phones and tablets: the touch buttons own the bottom, so the dash and map move up. */
  body.touch #dash { top: 62px; bottom: auto; right: 8px; width: 150px; padding: 6px 10px; }
  body.touch #spd { font-size: 30px; }
  body.touch #map { top: 86px; bottom: auto; left: 8px; width: 110px; height: 110px; }
  body.touch #mission-bar { top: auto; bottom: 170px; max-width: 92vw; font-size: 13px; }
  body.touch #toast { bottom: 228px; font-size: 13px; }
  body.touch #race-board { top: 236px; right: 8px; font-size: 12px; min-width: 0; }
  @media (orientation: landscape) { body.touch #race-board { top: 86px; right: auto; left: 128px; } }
  @media (max-width: 480px) { body.touch .ib { width: 36px; height: 36px; font-size: 17px; } body.touch #dash { top: 54px; } }
  @media (max-width: 640px) { #map { width: 120px; height: 120px; } #dash { width: 160px; } #spd { font-size: 34px; } .title { font-size: 34px; } }
</style>
</head>

<canvas id="view"></canvas>

<div class="hud" id="top-left">

</div>

  <button class="ib" id="b-cam" title="Camera (C)">🎥</button>
  <button class="ib" id="b-light" title="Night (L)">🌙</button>
  <button class="ib" id="b-rain" title="Rain (R)">🌧️</button>
  <button class="ib" id="b-horn" title="Horn (H)">📯</button>
  <button class="ib" id="b-menu" title="Menu (Esc)">☰</button>
</div>
<div class="hud chip" id="mission-bar"></div>
<div class="hud chip" id="race-board"></div>
<div class="hud" id="center-msg"></div>

<div class="hud chip" id="toast"></div>

<canvas class="hud" id="map" width="360" height="360"></canvas>
<div class="hud" id="dash">
  <div id="spd">0 <small>km/h</small></div>
  <div class="lbl"><span>⚙️ <b id="gear">N</b></span><span id="rpm-t">RPM</span></div><div class="bar"><div id="rpm" style="background:linear-gradient(90deg,#2a9d8f,#ffb703,#e63946)"></div></div>
  <div class="lbl"><span>⛽ Fuel</span><span id="fuel-t">100%</span></div><div class="bar"><div id="fuel" style="background:#ffb703"></div></div>
  <div class="lbl"><span>🛠️ Damage</span><span id="dmg-t">0%</span></div><div class="bar"><div id="dmg" style="background:#e63946"></div></div>
  <div class="lbl"><span>🔥 Nitro (N)</span><span id="nit-t"></span></div><div class="bar"><div id="nitro" style="background:#3a86ff"></div></div>
</div>
<div id="touch">
  <button class="tb" id="t-left" style="left:16px">◀</button>
  <button class="tb" id="t-right" style="left:96px">▶</button>
  <button class="tb" id="t-brake" style="right:96px">⏬</button>
  <button class="tb" id="t-gas" style="right:16px;background:rgba(42,157,143,.6)">⏫</button>
  <button class="tb" id="t-hand" style="right:96px;bottom:96px;width:60px;height:60px;font-size:18px">🅿️</button>
  <button class="tb" id="t-nitro" style="right:16px;bottom:96px;width:60px;height:60px;font-size:20px">🔥</button>
</div>

<div class="screen" id="scr"><div class="card" id="card"></div></div>

    C.querySelector("#c-new").onclick = () => this.startTimeTrial(null); const s = C.querySelector("#c-send"); if (s) s.onclick = () => this.shareLap({ t: S.best.track, code: S.ghost }); const r = C.querySelector("#c-race"); if (r) r.onclick = () => this.startGhostRace(this.friendGhost); C.querySelector("#c-back").onclick = () => this.openMenu();
  }
  // ----- Help and About -----
  howTo() {
    const C = this.show(`<h2>🕹️ How to play</h2><table class="res"><tr><td>⬆️ W / Up arrow</td><td>Accelerate</td></tr><tr><td>⬇️ S / Down arrow</td><td>Brake, then reverse</td></tr><tr><td>⬅️➡️ A D / arrows</td><td>Steer</td></tr><tr><td>Space</td><td>Handbrake: drift around corners!</td></tr><tr><td>N</td><td>🔥 Nitro boost</td></tr><tr><td>C</td><td>🎥 Change the camera (4 views)</td></tr><tr><td>H</td><td>📯 Horn</td></tr><tr><td>L · R</td><td>🌙 Night · 🌧️ Rain</td></tr><tr><td>Q · E</td><td>Left · right indicator</td></tr><tr><td>Esc</td><td>☰ Menu</td></tr></table>
      <p><b>Points:</b> drive, drift, collect ⭐ stars, pass traffic closely, finish missions and races. A red light or a speed camera (60 km/h in the city) costs points.</p><p><b>Garage:</b> spend points on new cars and on engine, tyres, brakes, nitro and body upgrades. Repair at the 🔧 garage, fill fuel at the ⛽ petrol pump: drive there and stop.</p><p><b>Phone:</b> use the round buttons on the screen.</p><div class="row"><button class="btn alt" id="h-back">◀ Back</button></div>`);
    C.querySelector("#h-back").onclick = () => this.openMenu();
  }
  about() {
    const C = this.show(`<div style="text-align:center"><img id="about-photo" src="${ABOUT_PHOTO}" alt="Rishabh Sharma" style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.25)"><h2 style="margin:8px 0 0">Rishabh Sharma</h2><div style="color:#666">Creator of the RishSchoolDays series · 9 years old</div></div>
      <div style="background:linear-gradient(90deg,#ff9933,#ffffff,#138808);height:4px;border-radius:2px;margin:10px 0"></div>
      <table class="res"><tr><td>🏎️ Game</td><td><b>Desi Drive</b></td></tr><tr><td>📚 Series</td><td>RishSchoolDays · Game 2 (Game 1: School Days)</td></tr><tr><td>👦 Created by</td><td>Rishabh Sharma, age 9</td></tr><tr><td>💡 Ideas and testing</td><td>Rishabh Sharma</td></tr><tr><td>✨ Slogan</td><td><b>Just live it!</b></td></tr><tr><td>🇮🇳 Made in</td><td>India, for children everywhere</td></tr><tr><td>🔢 Version</td><td>${VERSION}</td></tr></table>
      <p><b>The game:</b> drive through a 3D Indian city. Take taxi rides, deliver parcels, pass your licence test, race on the circuit and the highway, and challenge friends with ghost races. Earn points, buy 7 vehicles and upgrade every part.</p>
      <p style="text-align:center;font-size:12px;color:#888">© 2026 Rishabh Sharma · RishSchoolDays. All rights reserved.</p><div class="row" style="justify-content:center"><button class="btn alt" id="a-back">◀ Back</button></div>`);
    C.querySelector("#a-back").onclick = () => this.openMenu();
  }
}

const game = new Game(); $("#ver").textContent = `Desi Drive ${VERSION}`; window.__dd = { game, S, CARS, eff, level, save };
game.friendGhost = game.readChallenge();
game.openMenu();
if (game.friendGhost) game.toast(`👻 ${game.friendGhost.name} sent you a challenge: ${fmtT(game.friendGhost.t)}. Race the ghost!`, 5000);
</script>
