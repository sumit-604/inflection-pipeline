  - {moat: "Distribution reach (7,000+ dealers/stockists, 13 marketing offices)", durability: "moderate-high"}
  - {moat: "Boards certifications and process technology (GreenPro, TUV, ISI, Hatschek/autoclave)", durability: "moderate"}
