analyst_note: "The load-bearing finding for Role 5 weighting is the asymmetry between operational delivery (multi-feed capex, CBG unit economics: broadly on plan) and commercial delivery (volume, revenue, and commissioning-date guidance: missed in 6 of 10 scored promises), combined with a capacity-utilisation metric that changes its own denominator every quarter in the direction that flatters the current print. Equally load-bearing: across four calls and roughly 20 analyst questions, management never once raises CFO, DSCR, or related-party concentration, the three items B02 and B03 independently rate as the audited financials' most severe problems; the analyst base on these calls is retail/volume-focused and never pressed on them either. One clear unprompted accountability admission (the GST-restatement PAT understatement) keeps the grade at C rather than D. Treat every FY27 volume, CBG-commissioning, and retail-rollout figure from this management as the top of a range, not a base case, until the 15cr litre court order and the CBG COD dates actually resolve."
