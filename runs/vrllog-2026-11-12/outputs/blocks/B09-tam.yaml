analyst_note: "TAM spans 13.5x between vendor (Rs 3,11,610 Cr, all sub-truckload freight) and peer-implied (Rs 23,150 Cr). I carry the peer-implied number for SAM because it rests on filings; the vendor number is a ceiling with an unknown definition. The 30% organised claim is management's, unsourced, and drives the conservative TAM, so the chain is circular. Separating observation: a filed or rated organised-LTL revenue pool covering Safexpress, Gati and V-Trans. If that pool is large, SAM rises and runway moves from MODERATE toward STRONG. SOM CAGR 11.1% runs off FY26 and excludes the FY27 price step (+9% realisation), so year one is understated."
