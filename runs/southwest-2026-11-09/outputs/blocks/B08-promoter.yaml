analyst_note: "Coal block (load-bearing fact 3): no related-party element found. The block is held by the listed company and was won in the 2021 Ministry of Coal auction at a 24.25% revenue share. Funding is the open item (Rs 200 cr Phase I per call; CRISIL Rs 200-220 cr; a press headline says Rs 450 cr, unverified). Disposal figures: shares are exact from Reg 29(2) Annexure-A and reconcile to the AR holdings; prices come from Trendlyne and tie to share counts, but exchange-level price proof was not opened. FLAG-PROMOTER is not raised because the grade is CAUTION, yet stage 13 should carry the selling and the unnamed loan in the verdict line. Two readings: diversification versus extraction. Separators: H1 FY27 Reg 23 RPT filing naming the borrower; Dec 2026 shareholding pattern (further sales, any pledge, Anantnath Skycon stake); Q3 FY27 CFO/PAT. Anantnath Skycon (10 Sep buyer of 7,00,000 sh) is an unverified lead, surname overlap only."
