completionist_recount: "1 documented item across 1 category carries genuine forward-moat weight without qualification (B1: cell-line construction progress plus IREDA loan drawdown). A second category (R1) rests on documented government policy but undocumented, non-differentiating capture. Every other 'evidence' row in this scan is either a documented negative finding (R&D=0%, exports=NIL, dealer share declining, WC deteriorating, leverage rising, Grade D execution) or an unsupported management claim. Far below the 3-6 category base rate; the shortfall itself is the finding."
