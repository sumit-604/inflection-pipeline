irrelevant_ratios:
  - "Rupee revenue growth YoY - conflates CRGO price movement with real volume growth"
  - "Rupee working-capital growth - Amendment 17: mixes real volume ramp with CRGO price swings"
  - "Gross/EBITDA margin YoY read without CRGO-price and ramp-fixed-cost context - misreads a price/ramp effect as a loss of pricing power VTL never had"
  - "Spot-year ROCE/ROE - Amendment 17 forbids feeding spot-year figures into Section 1B/FTTCP for a converter; FY26 sits at a cyclical trough on both price and utilisation"
  - "'Net debt free' headline claim alone - hides the Rs 114 Mn to Rs 390 Mn rise in short-term borrowings used to fund the working-capital ramp"
must_track_metrics:
  - {metric: "Production/sales volume (MT) by product line", healthy: "tracking or exceeding FY27 guidance of +45-50% CRGO volume growth", red_flag: "volume growth stalling below guidance for two consecutive quarters"}
  - {metric: "Spread per kg (realised price minus landed CRGO/copper cost)", healthy: "stable to widening as utilisation rises", red_flag: "narrowing spread while volume rises"}
  - {metric: "Unit-3 utilisation %", healthy: "progressing toward the ~100% utilisation the old base achieved", red_flag: "utilisation stuck materially below capacity two+ quarters after commercial-production claims"}
  - {metric: "Gross margin %", healthy: "recovering toward the 20%+ band seen pre-ramp", red_flag: "further sequential decline below FY26's 17.82%"}
  - {metric: "Short-term borrowings / revenue", healthy: "growing in line with, not faster than, revenue", red_flag: "STB growth outpacing revenue growth for two+ quarters"}
unit_economics:
  unit: "1 metric tonne of processed material (CRGO-weighted, FY26 blended)"
  revenue_per_unit: "~Rs 2,32,050/MT (~Rs 232/kg), derived from Rs 4,607 Mn revenue / 19,856 MT FY26 production"
  margin_per_unit: "~Rs 35,700/MT (~Rs 36/kg) gross margin, derived"
  key_lever: "Spread per kg (selling price minus landed input cost) multiplied by volume, gated by Unit-3 utilisation absorbing the new fixed-cost base"
first_deterioration_signals:
  - {risk: "Customer/related-party concentration", first_signal: "revenue growth decoupling from disclosed volume growth without a price explanation, or a step-change in the Atlas Transformers related-party transaction line"}
  - {risk: "CRGO price volatility and new-unit fixed-cost drag", first_signal: "sequential decline in gross margin % below FY26's 17.82%"}
  - {risk: "Working capital funded by rising short-term debt", first_signal: "short-term borrowings growing faster than revenue for two or more consecutive quarters"}
  - {risk: "Delayed ramp of nano/radiator/copper/bushings lines", first_signal: "new-line capacity utilisation staying near zero more than two quarters after a commercial-production announcement"}
  - {risk: "100% import dependence for CRGO steel", first_signal: "import cost/duty rising while realised CRGO selling price stays flat or falls"}
mgmt_questions:
  - "What is the realised blended spread per kg in the latest quarter versus the Rs 180-185/kg FY26 trough?"
  - "What is Unit 3's actual utilisation rate today versus the ~100% utilisation the old 12,000 MTPA base achieved?"
  - "What is the realistic FY27 quarterly run-rate and gross margin for nanocrystalline cores beyond the Rs 3.48 Cr H2 FY26 base?"
  - "What is the single largest customer's share of FY26 revenue, and how has concentration changed as capacity tripled?"
  - "What is the timeline and VTL's total economic exposure for the HV bushings associate entity beyond the 25% equity stake?"
  - "What is the expected PGCIL approval date and the addressable order value it unlocks?"
  - "How will FY27's guided 45-50% volume growth be funded without further leverage or dilution, given short-term borrowings already rose to Rs 390 Mn in FY26?"
one_line_verdict: "Commodity CRGO converter tripling capacity into unproven higher-value optionality"
analyst_note: "Two data-quality issues cap confidence in FY26 figures: FY26 volume growth is reported as ~65% (Chairman), ~50% (Business Updates) and computes to 64.6% from the disclosed MT table, all in the same presentation; and FY26 presentation figures are Ind AS-restated while the statutory FY25 AR uses Indian GAAP/AS, producing a ~1% PAT gap for the overlapping FY25 year. Neither is resolved in this corpus. Separately, the only quantified customer-concentration data point is a promoter-related counterparty (Atlas Transformers, ~12.5% of FY25 revenue combined) trading on both the sales and purchase side of VTL - a governance detail worth carrying into stage 13's understanding narrative, not just a risk-register line. No FY26 AR exists yet, so all FY26 claims about the new product lines are management-asserted via the investor presentation, not independently audited-disclosure-anchored."
