  - {rank: 6, finding: "Goodwill of Rs 136.09 Cr (13.79% of consolidated net worth) carries zero CGU-level impairment disclosure anywhere in the notes: no discount rate, growth rate, or headroom, only the generic policy paragraph.", note_ref: "Consolidated Balance Sheet + Note 25.11 (PDF p.96, 109)", rating: "red flag", why: "A material balance-sheet asset with no visible impairment-test rigor; cannot assess cushion or write-down risk from this document."}
