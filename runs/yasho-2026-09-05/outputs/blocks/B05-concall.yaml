analyst_note: "The single largest open question: Q1 FY27's 24.2% EBITDA margin rests on ONE quarter of print against a 17-19% multi-year guided band. Management's mechanism explanation (utilisation 50%->65%, offtake, mix, 10-12% margin premium on new products) is plausible and was given under skeptical direct questioning, which lends some credibility. But the FY28 target has risen every quarter in lockstep with rising margin confidence, and the Q3 FY26 call's own numbers (1,500cr 'at 40% utilisation of available space' vs. Jay's separately quoted 750-850cr Pakhajan-only figure) were never reconciled across any of the three calls. Treat >20% margin and >INR1,600cr FY28 as unproven-but-not-yet-contradicted; stage 6 peer verification and one more quarter of print are the tests, not this stage."
