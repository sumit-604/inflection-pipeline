findings:
  - {severity: "MAJOR", id: "F-G01", location: "B01 report, data-availability declaration and Classification section", description: "The declared 4-year scoring window is outcome-determining and unratified. At 4 years the LIMITED confidence tier fires a one-tier downgrade that turns AVERAGE into AVOID. The company's own ROCE series reaches FY2022, and on a 5-year declaration the tier carries no downgrade, leaving AVERAGE even with A4 falling to 0 (core 40, still inside the 40-59 band). The report discloses the A4 sensitivity but never runs the confidence-tier consequence. The 4-year reading is defensible under rule 6 taken as full financial history. It needs an OPERATOR RULING before AVOID travels downstream."}
  - {severity: "MAJOR", id: "F-G02", location: "B01 report, Block F, test M4", description: "M4 scored 1 where no prompt band is satisfied. One revenue-decline year, unrecovered, fails the 3-band condition 'fully recovered', and the 1-band's stated condition is '2 decline years'. The score was awarded by analogy, while M10 two tests later applies the strict else-0 reading on the identical receivable-days leg. Recomputed Block F is 3/60 and the grand total 46/160. Moats confirmed, moat class THIN and classification AVOID are all unchanged."}
  - {severity: "MAJOR", id: "F-E01", location: "B07 Section 5 scorecard, row B2", description: "B2 qualification lock-in is scored HH=4 at 1.0x, the largest single row, while the report itself states in 6D and 6E that the advantage predates FY26 and is not emerging. The stage scores moats currently forming. The genuinely new increment (IATF16949, NADCAP cable-harness re-scope) is already scored at R1=3.0, and the report's own recount concedes B2 and R1 share the certification evidence base. That credits one quality improvement through two mechanisms. Recomputed em_score is 20.0 rescoring B2 on the increment, or 17.0 removing it, against 21.0 reported. The MODEST band and the EM 25 UA miss hold in every case."}
  - {severity: "MINOR", id: "F-G03", location: "B01 report, B4 and M12", description: "The prompt's fixed working-capital-days formula (receivable plus inventory minus payable) was replaced by the company-disclosed NWC-days KPI, against the instruction not to substitute alternatives. The substitution is disclosed with cause and is score-invariant: the MD&A DSO/DIO/DPO route and the prompt's own N/A-to-zero route both land in the same bands."}
  - {severity: "MINOR", id: "F-G04", location: "B01 report, M4 line", description: "The M4 line says judgment flagged, see analyst_note. The analyst_note does not mention M4. A dangling cross-reference on the one line item that most needed the explanation."}
  - {severity: "MINOR", id: "F-E02", location: "B07 Section 3", description: "The prompt asks for an evidence table or NO EVIDENCE FOUND per category. Categories are presented as anchored prose instead. The 23-row summary table supplies the required structure, so the loss is presentational."}
  - {severity: "MINOR", id: "F-E03", location: "B07 report body and block evidence_mix", description: "The analyst-inference tier is never applied anywhere and evidence_mix reports inference 0, although the report makes and labels inferences in prose (the C2 consolidation-artifact reading, the 2C utilisation-not-capex conclusion, the 6E base-rate argument). The taxonomy is meant to cover every piece of evidence. No score effect."}
  - {severity: "MINOR", id: "F-E04", location: "B07 Section 3, completionist recount line", description: "The mandated recount line states 13 documented items across 6 categories, then names seven (B1, B2, C2, F1, G2, H3, R1), and the block says seven. The stated count contradicts its own list and the block."}
  - {severity: "MINOR", id: "F-E05", location: "B07 categories H2 and G1", description: "A few evidence items carry no page anchor, for example 'related-party term loan structure, AR consolidated notes'. The prompt requires an anchor on every evidence item. Whether the referenced content exists at any page is verifier A's call, not mine."}
  - {severity: "MINOR", id: "F-E06", location: "B07 Section 3, category I2", description: "The prompt requires the cannibalisation test to be answered for each moat claimed anywhere in the scan. It is answered for B2 only; C1, C2 and R1 are covered by a generalising sentence rather than individually. The score would remain 0 in each case."}
