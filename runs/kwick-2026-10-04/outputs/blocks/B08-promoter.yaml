verdict_basis: "No regulator action, no pledge and no promoter litigation, but board and disclosure record is weak and promoter-group vendors are captive; LBF-1 buyer names not disclosed."
analyst_note: "LBF-1: Annexure VIII shows no related-party sale or receivable FY24-26, so no link is shown. A link is not ruled out. Dealer and buyer names are absent, and the MD holds four directorships (Mokka Kefi and Cabana, Esource Lighting LLP, Brrain Source, Archos Techno) plus eleven promoter-group entities with no stated business. One observation separates the readings: a dealer or non-government buyer whose partner or director matches that list (MCA lookup, PENDING LIVE VERIFICATION). LBF-3: promoter pay plus rent, interest and group purchases = 314.55 lakh FY26 = 23.3% of PAT (54.5% FY24), falling; group purchases are 1.13% of purchases; the issue is shape, not size. Upgrade trigger: Gostocks parent owned by the MD without arm's-length proof moves this to CONCERN. Report 08-promoter.md has two cosmetic slips: a garbled page cite in the verdict card (pledge row; correct cite is p.84 and pp.79-81) and a stray phrase in 5A."
