analyst_note: "The two most consequential Pass 3 reconciliations both narrow rather than widen Pass 1's framing, but the narrowed version is still a red flag, not a clearance. The Office Premises RPT sale is a large profit over book (3.01x), which argues against a cheap insider sale, but no independent valuation of that specific property is disclosed. The Note 41 fair-value-hierarchy error and the ROE-ratio-equals-EPS error are two independent real disclosure defects reflecting preparer quality, scored into accounting_quality on their own terms. The Radius Estates ICD remains the single highest-severity item: an unprovided exposure to an insolvent counterparty, invisible in the note purpose-built to disclose exactly that risk."
