analyst_note: "Numbers on the call match the filing; the story does not. Operating EBITDA rose 0.6% on 16% revenue growth. PAT growth rests on other income, lower finance cost (Hyderabad Metro perimeter at most 16.8% of the PBT gain; standalone debt 5.4%, reversible) and a tax credit. Management confirmed that segment EBITDA carries allocated other income, so PPM 7.0% and the 7.8% target are not clean; the filed operating margin (8.69%, -132 bps) is the metric to track. Cash is weaker than it looks: ex-FS cash before working capital fell 3.6% in H1, and advances plus disposal proceeds built about 77% of the net-cash rise. Cash conversion stays INDETERMINATE-WITH-DIRECTION because the advance balance is not disclosed. Indicative FY27E owners PAT is 20,009 cr (Reading A, 26.1x at Rs 3,801) or 21,210 cr (Reading B, 24.7x); FY28E 21,748 / 24,257 cr (24.0x / 21.6x). Reading A is the more evidenced path. Correction loop 1 fixed A5 F1-F7 without changing the verdict, the cash class or any Section E number."
