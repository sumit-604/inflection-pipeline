cross_peer_hypothesis: "In the 2026 rupee window (about 85 to 92-94 per dollar), export-linked peers' margin step-ups are part currency and mix, not only structural, and the supplier carries the cost shocks (tariff, freight, raw material) while customers do not. Test: if Kusumgar's 27-31% band (deck basis incl. other income) is largely currency and mix, it should fall by a margin proportional to export share times the currency reversal when the rupee strengthens, and its other income and export mix should show it."
analyst_note: "No peer discloses a comparable cash conversion or defence receivable profile, so Kusumgar's weakest metric (H1 CFO 16.8% of EBITDA) has no peer anchor. The closest margin anchor is Mayur at 25-30% on an export OEM mix, which makes a 27-31% band plausible for coated fabric but sourced to FX help. Arvind AMD at 14-15% is a different mix (project, composites, filtration) and is not a margin ceiling comparison. No peer mentions Kusumgar or parachute contracts. Mayur's own Q4 to Q1 margin drop shows how one-off the exit margin can be: the same pattern is a test for Kusumgar's Q1 31.1% to Q2 28.4%."
