flags:
  - type: FLAG-CASH
    reason: "Operating cash flow was negative at both standalone (₹-581.08 lakh) and consolidated (₹-1,852.78 lakh) levels in FY25 despite the profit turnaround (standalone PBT ₹762.18 lakh, consolidated PBT ₹1,800.55 lakh); working-capital consumption of ₹6,037.80 lakh (consolidated) outran operating profit improvement, and growth was funded by ₹3,240.40 lakh of fresh borrowings rather than internally generated cash. Trade receivable ageing is clean on its face but single-counterparty concentration exceeds 80% of standalone receivables (two of three names related parties), and quarterly bank drawing-power reconciliation gaps (up to ₹1,874.61 lakh at the subsidiary in March-25) indicate a material slice of receivables is excluded from bank collateral as non-allowable, largely related-party balances (Cash Flow Statement standalone p.79 / consolidated p.122; Note 10/11 receivables p.98-99/153; CARO Annexure A p.68-69; Note 19/33 consolidated p.156-157)."
  - type: FLAG-RPT
    reason: "Related-party concentration is structural, not incidental: 46.6% of standalone / 37.5% of consolidated revenue, 62.6%/70.4% of COGS, and up to 49.2% of consolidated receivables run through related parties, with the dominant counterparty (Plastene India Limited, 34.7%/32.96% of revenue) also a disclosed 4.68% promoter-group shareholder. A new ₹3,320.29 lakh, 0%-interest loan from that same counterparty to the subsidiary, originated this year, directly contradicts the filing's own arm's-length RPT assertion. Cross-guarantees between parent, subsidiary and a third related entity (Cornucopia Tradelink) exceed 2x consolidated net worth (Note 35 standalone p.112-114; Note 37/40.2(c) consolidated p.171-172/175; Note 33(C)(2) consolidated p.170; Note 14(d) standalone p.101; Note 34 standalone p.111 / Note 36/17.1 consolidated p.155/169)."
