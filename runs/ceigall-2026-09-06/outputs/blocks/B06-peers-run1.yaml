analyst_note: "Run 2 fixes 9 audit-flagged citation errors plus 9 more found on independent re-check (full log in the report), and re-rules Q5 from UNVERIFIABLE to CONTRADICTED: 2 peers proactively disclose adverse governance/financial events unprompted (CBI search, loan recall, 87% guidance miss, NHAI show-cause+suspension against subsidiary and parent), a 3rd confirms candidly when asked, none of which matches Ceigall's total 3-call silence on comparable items. 2 new tests added: escalation cost pass-through is CONTRADICTED (all 3 peers show partial, time-boxed relief, not full compensation); segment-margin disclosure is PARTIALLY VERIFIED (1 peer gives a clean quantified split, proving it is achievable). A 10th test (disclosure-granularity on unbilled/retention/mobilisation/debtor rupee figures) is the only clean VERIFIED finding: all 3 peers give this routinely, Ceigall does not. Run 1's cross-peer hypothesis (HGINFRA as uniformly lower-granularity) is retired: HGINFRA turns out to set the high-water mark on WC granularity, segment-margin disclosure, and adverse-event candour. Revised hypothesis: peer reticence tracks forecast uncertainty (a future number they cannot control), not fact severity; Ceigall's silence tracks fact severity (flattering vs damaging) instead, which is the opposite organizing principle."
