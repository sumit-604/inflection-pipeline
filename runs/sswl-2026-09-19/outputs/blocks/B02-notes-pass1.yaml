    label: "AMW NCLT write-back gain, subsidiary status, carrying value"
    result: CONFIRMED_SUBSIDIARY_STATUS_GAIN_TRAIL_PARTIAL
    detail: >
      AMW confirmed 100% wholly owned (Note 52C consol, AOC-1). FY24 exceptional
      gain itself falls outside this AR's two-year comparative window (FY25/
      FY26 only) so cannot be directly re-verified from this document. A large,
      wholly unexplained Rs 364.52 Cr "Transfer to Capital Reserves" appears in
      consolidated Other Equity (Note 19) in FY26 with no note connecting it to
      AMW; AMW's standalone carrying value is Rs 5.00 Cr (cost), AMW posted a
      third consecutive year of losses (FY26 standalone loss Rs 16.82 Cr per
      AOC-1), and a growing Rs 59.31 Cr DTA on AMW's carried-forward tax losses
      is recognised despite continuing losses (DTA realism flag).
