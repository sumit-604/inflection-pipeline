verdict_basis: "No promoter-level SEBI order, conviction or deal-breaker, long builder record, but pledge 11.1% of group holding, an unresolved kickback allegation at a promoter-close executive, an unexplained Rs 190 M Chairman fee, 561x pay and an audit chair exit leave five of ten dimensions at caution."
analyst_note: "CAUTION, not CONCERN. B03 prelim flag resolves down: one borrower, pledge falling, 3.0% of shares (2.2% after release). Two points a later stage cannot rebuild. The XBRL 27.02% promoter figure is a denominator artefact; SAST shows 27.60% on 96,130,997 shares after buyback. The kickback matter is the main open item. Readings: (a) no wrongdoing, ex-CEO left for personal reasons; (b) a developer-payment problem existed and is unscoped. Separating observation: a named, scoped review report or audit committee statement. Tripwires: pledge above 2,944,444; any invocation; action on the Arora matter reaching a director; CCI order naming executives; a second independent exit within 12 months. Size carries the conservatism."
