analyst_note: "The filing gives no Adjusted EBITDA. Filing-derived reported EBITDA is 9.75% (Q1 9.16%), Rs 2.95 Cr short of 10%. Trigger 1 therefore turns on the presentation's add-backs. A4 must source and itemise them, and check whether the new H1 provisions (ECL 4.97, other receivables 4.90) are added back. The QoQ EBITDA gain is all from the parent; the rest of the group lost Rs 15.70 Cr and 136 bps, and the overseas result fell 25%. About half of the Q2 PAT gain is tax: ETR fell 685 bps although profit mix moved toward higher-tax India. Cash conversion is the sharpest signal. H1 CFO/PAT is 0.22x, driven by a Rs 160.73 Cr rise in other current assets, mostly outside the parent. That is the asset class behind the FY26 Rs 135.87 Cr write-offs. Annexure 1 Sr.33 is a numbering misprint; all 33 Q1 names match. The filing is silent on Proximus related-party flows, client concentration, promoter holding, delisting and open offer. The MOA expansion into digital identity and AI, and the Brussels signing place, are the only parent-integration signs."
