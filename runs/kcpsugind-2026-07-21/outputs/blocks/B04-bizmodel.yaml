  - {risk: "Rising short-term borrowings funding working capital amid core losses", first_signal: "Standalone current borrowings (Note 22) growth rate, already +47% YoY in FY26"}
  - {risk: "Cane sourcing shortfall / shrinking crushing season", first_signal: "Cane crushed (MT) and crushing days YoY"}
