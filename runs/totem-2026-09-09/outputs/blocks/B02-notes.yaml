  - "Is the Rs 4.71cr FY26 rebate/discount liability offset against receivables (Note 36, up 41.6% YoY) a change in customer terms, and how much of the receivable-days improvement does it explain?"
  - "What is the current status of any pledge over promoter shareholding, and can future Annual Reports cross-reference the SHP disclosure from within the Notes?"
  - "What asset was reclassified as 'held for sale' (Rs 11.65 lakh net, Note 3) during FY26, and what is the expected sale timeline and gain/loss?"
  - "What explains the 14.8% fall in gratuity-scheme active members alongside an ~81% rise in average monthly salary (Note 31, Section I) — workforce-mix shift or a scope/definitional change tied to the Labour Codes recompute?"
receivables_trend: "improving, modestly, on the company's own average-balance basis (Note 33.2: turnover 7.45x to 7.94x, ~49 to ~46 days FY25 to FY26); the point-in-time calc (52 to 44 days) overstates it; net receivables are already netted against a rebate/discount offset that grew 41.6% (Note 36), so part of the improvement is a bigger customer-rebate accrual, not purely faster collection"
restatements_found:
