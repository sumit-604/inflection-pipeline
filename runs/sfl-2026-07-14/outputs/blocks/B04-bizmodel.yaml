  secondary: {method: "EV/EBITDA (Core EBITDA basis)", why: "captures post-merger leverage change and international subsidiary margin mix; aligns with company's own non-GAAP Core EBITDA framing"}
  tertiary: {method: "Sum-of-the-parts", why: "distinct economic units (domestic B2C mattress, domestic B2B technical foam, Australia+Spain foam, Staqo IT) with different growth/margin/currency profiles that a single blended multiple may mask"}
