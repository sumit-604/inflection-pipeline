analyst_note: "The AR is mechanically clean (unmodified opinion, no fraud, no going-concern doubt) but substantively concerning on three converging axes that independently confirm each other: earnings quality (govt-scheme income dominates PBT), cash conversion (CFO inverted, DSCR sub-1x), and disclosure consistency (the guarantee/Note-57 contradiction, verified this stage with exact quotes from three separate primary sources, not merely inherited from B02). The front matter (Phase 6) is silent on all three. None of this is concealment in the strict sense - every number is in the audited notes - but a reader relying on the Chairman's/MD's/CFO's letters alone would materially overestimate FY26 balance-sheet strength. The prospectus backward read adds one load-bearing new fact this AR itself omits: two personal criminal proceedings against the MD, disclosed at IPO but absent from the AR's director profiles. Treat FY26 as a transition-year trough, not a clean base year, pending Halt 1 live verification of the utilisation and RPT reconciliation questions named in Phase 2."
