  - "Risk #2 first signals lit: net debt Rs 916 Cr (> 900) and gross D/E 0.752 (> 0.75); H1 pace +Rs 129 Cr/qtr crosses Rs 1,000 Cr in Q3 before inflows [INFERENCE]."
