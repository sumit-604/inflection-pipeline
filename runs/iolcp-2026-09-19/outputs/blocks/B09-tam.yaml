analyst_note: >
  SAM sits at 81.3% of realistic TAM because the realistic TAM (Method 3, peer-aggregation)
  is itself a narrow, IOLCP-comparable base, not the broad industry headline from Section
  1B; this is a scoping consequence, not an error. Current SAM share (15.3%) is unusually
  high for this kind of exercise because IOLCP is one of only 4 organized listed
  comparables in this specific niche -- flagged explicitly in Section 3B rather than
  smoothed into the share-gain math. SOM-implied CAGR (11.2-11.6%) sits meaningfully below
  management's 15-20% FY27 guidance and its 25-30% incremental capex-payoff claim; the two
  are not the same kind of number (market-share-disciplined SOM vs asset-turn-based peak
  revenue at full utilisation of specific new lines) and Stage 11 should not treat them as
  interchangeable. The Rs1,200-1,400 Cr greenfield (B07's largest, least-evidenced capex
  line) is excluded from every SOM/capacity number in this stage; if it gains a firm date,
  both SAM-expansion (5D) and the Year-5 capacity margin (3C, currently thin) should be
  re-run.
