industry_cross_read:
  demand: "No peer describes a broad macro discretionary-spending slowdown; every disruption named across all three peers is state-excise/policy-specific (Maharashtra MML ~20% IMFL degrowth per TI, Karnataka and Madhya Pradesh per SDBL, Telangana/Karnataka per Sula), corroborating the state-specific half of Fratelli's excuse pattern but not a general macro framing; Sula separately states the wine category itself grew only 'low single-digit' over the last two years, contradicting Fratelli's own 15-20% multi-year industry growth guidance to its own investors."
  pricing_inputs: "Sula discloses a 'more than doubling' table-grape price spike in Maharashtra during Harvest 2026 with a ~350-400bps FY26 gross-margin hit; Fratelli's commentary on the identical harvest names only yield/quality with zero cost reference, and its later Q4FY26 call has zero grape/harvest mentions at all, an unexplained divergence."
  capex_cycle: "Not a uniform capacity race: TI and SDBL are actively expanding CORE capacity (Imperial Blue integration; Rs570cr UP greenfield brewery), while Sula, the direct wine comparable, is REDUCING core wine capex (Rs50-60cr historical run-rate to ~Rs25cr FY26) and reallocating capital to Wine Tourism/hospitality (Chandon acquisition, resort expansion), the same reallocation direction, though not scale, as Fratelli's own deferred hospitality programme; Fratelli is not a lone expander against a cautious peer set, nor part of a uniform capacity race."
