analyst_note: "Peers corroborate every factual, checkable, industry-level claim tested (ADTO/commodity recovery, RBI intraday curb plus bank-guarantee mitigation, MTF pricing pressure) and contradict none. This should raise confidence in Share India's operational/regulatory disclosures specifically. But peers are silent, not supportive, on LBF1 (prop-vs-client mix): no peer discloses a comparable metric, so the AR/BRSR contradiction (B03/B05) remains governing, unmoved by this stage. Two new moderate-weight findings for Role 2/6 and FTTCP: SMC Global's low-leverage 'treasury' framing of its own prop book sharpens concern about Share India's own prop-book scale/risk; and the Choice International branch-scale mismatch (800 vs 30) means Share India's Tier-3 branch thesis, while industry-validated in direction, is a much smaller bet than the peer running the same playbook hardest. Neither moves the B05 credibility grade (C)."
