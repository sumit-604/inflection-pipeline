analyst_note: "Structural finding for Stage 11: Products TAM/SOM converge brand-by-brand under the exclusive-tie-up model (HEINE the one disclosed anchor), so Products growth is a new-brand-signing story, not open-market share gain. Services SOM (base case, non-aggressive share-gain) implies 25-26% CAGR at 3yr and 5yr, close to the strategy's 25% hurdle but well below management's implied ~43% 3yr CAGR from the Rs 500 Cr/FY29 target; treat FY29 target as upper-bound ambition. HCAH-scheme completion could justify a faster path per the framework's own >5pp-on-acquisition rule, but its completion date is unstated, so this stays a qualitative upside, not part of the base-case SOM handoff."
