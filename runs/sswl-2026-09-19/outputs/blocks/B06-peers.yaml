analyst_note: >
  Peer evidence supports SSWL's demand (GST 2.0, broad-based, matching timing)
  and RM-pass-through/cost-trajectory narratives (same West Asia shock, same
  window, ALICON's underlying-margin-flat result the cleanest single
  confirmation available). It complicates the LBF2 mix-shift-margin thesis at
  the segment level: WHEELS states its own alloy wheel business is currently
  its LOWEST-ROI segment pending a ~60k-wheel/month scale threshold, the
  opposite direction from "alloy ~2x steel," while UNOMINDA supports the
  general direction without a magnitude. Three questions (Vietnam/Thailand
  tariff advantage, 2-player alloy market structure, SSWL's specific
  EV-scooter/ICE-2W share) are genuinely unverifiable -- no peer transcript
  touches them, this is a real evidence gap, not a soft negative. The
  cross-peer hypothesis (alloy/aluminium margins may systematically lag
  entry-level-driven volume surges by 1-2 quarters) is worth carrying into
  Stage 11 as a lens for reading SSWL's own EBITDA/wheel quarter-to-quarter
  volatility.
