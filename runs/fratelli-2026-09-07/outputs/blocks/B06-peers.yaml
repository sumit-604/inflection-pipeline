analyst_note: "The two peer questions with the clearest, highest-stakes resolutions (market share/duopoly; EBITDA margin benchmark) were both settled by arithmetic on numbers already filed by Fratelli and its own cited sources, cross-checked against numbers the peer discloses about itself, not by any peer saying the claim was wrong. Sula's own WIPS-to-PBT ratio (136%) is the single most consequential new number this stage adds: it was not asked for by any of stage 5's six questions, surfaced only by reading Sula's routine quarterly disclosure against Sula's own P&L, and it converts a Fratelli-specific red flag into a sector-wide structural finding. The RTD/canned-wine growth verdict (CONTRADICTED) carries a genuine format-mapping caveat (canned still wine vs RTD cocktail) that should not be discarded when this feeds synthesis; it is directional evidence, not a magnitude match."
