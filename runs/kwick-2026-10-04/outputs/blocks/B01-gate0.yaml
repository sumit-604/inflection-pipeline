analyst_note: "Core 69 with STRONG moat is GOOD+ on the matrix. DB4 caps it at AVERAGE. Growth (18/20) and balance sheet (20/20) are strong; Block B (8/20, exactly at the deal-breaker line) is the depressor. Rs 31.42 Cr of IPO money funds working capital, so FY26 cash conversion of 0.56x is the baseline the new capital must beat. LBF-2: the 83/89/74 debtor days are average-receivables days; year-end days are 144/111/79, absolute receivables rose every year (Rs 11.94, 19.79, 22.88 Cr). LBF-1: government share confirmed 86.98/78.91/55.22%; B2C is only 10.48% of FY26 revenue, so at least 34pp of the 44.78% non-government share is B2B, and top customers are unnamed (identity is a stage 8/4 question). Moat points are fragile: M1 5 and M10 0 flip on window choice; M11 3 is mechanical. Peer-dependent tests scored 0 for lack of data. The 85 is a mechanical screen on thin history, not a quality verdict."
