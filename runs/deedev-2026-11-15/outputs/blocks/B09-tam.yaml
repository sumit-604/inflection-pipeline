analyst_note: "Two readings of market size, not averaged. A (carried): D&B Rs 25,400 cr FY23 covers all process piping spend; DEE is 2% of it, so Rs 19,113 cr SAM leaves 35x headroom and the market does not bind. B: Grand View puts India near Rs 2,100-2,700 cr in 2022 (illustrative INR 70-90 per USD); DEE would hold 15-20% of its FY26 market and FY30 Rs 2,500 cr (about 60% India) would need a 35-45% share; SOM yr3 CAGR falls to about 6-7%. D&B calls the industry concentrated yet puts DEE, the largest by capacity, at 2%: that fits neither reading cleanly. The observation that separates them is piping-only revenue of named peers, NOT FOUND. Put the conservatism in size. Capacity, not market, is the binding test: guide Rs 2,500 cr needs asset turns 3.5x vs 1.83x with maintenance-only capex."
