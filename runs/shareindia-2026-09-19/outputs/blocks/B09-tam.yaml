analyst_note: "This name required splitting TAM into a CLIENT POOL (fees, MTF/NBFC interest, wealth, insurance, merchant banking, algo subscriptions - 30.1% of FY26 revenue) and a PROP POOL (58.3%+ of FY26 revenue, no clean unit economics per B04) per the injected instruction. All formal TAM/SAM/SOM/YAML figures cover the client pool only; the prop pool is discussed narratively in the report with sourced anchors (options turnover, RBI curb capital estimate, active-trader decline) but deliberately not converted into a Rs Cr market size, since no bid-ask/arbitrage margin-capture rate exists in any source found. The conservative TAM (Rs 21,600 Cr) is a known floor from six named peers (Zerodha, Angel One, Groww, SMC Global, Share India, Choice International); a full organized-industry total was searched for but not found. The SOM math assumes 1.4-2.9pp of share gain despite the one clean filed trend (fee income) currently running the other way - flagged prominently so Stage 11 treats the SOM as plan-dependent upside, not trend extrapolation."
