one_line_verdict: "Profitable single-segment fine-chemicals maker with expanding margins but a stalled capacity expansion and a data-thin annual report."
analyst_note: "AR is unusually thin: capacity, utilisation, customer concentration, and product-mix are all NOT FOUND, not merely under-anchored, because the relevant AR pages carry no extractable text. Unit IV, Dahej is the load-bearing structural fact: land leased and clearances obtained years ago, but CWIP is only Rs 87.6 lakh and the Chairman's Letter admits construction 'could not be started' for unstated reasons. ROCE and Fixed Asset Turnover are both declining even as EBITDA margin expands, meaning capital base growth is outpacing capital efficiency gains, a tension worth separating in downstream stages. Director remuneration more than doubled against ~8.6% PAT growth, a governance flag for verification, not resolved here."
