analyst_note: "Reading the FY2024-25 AR resolved the Rs 21.55 Cr line (confirmed as a refund of a pre-existing advance, not new FY25 spend) but did NOT resolve the core question: which specific entity (Sunev/Spine/Tark AI) sold the IP, and on what valuation basis. Both annual reports independently apply the identical 'arm's length, not materially significant' characterization to this category without supporting workings, across two consecutive years, to a purchase pattern that DOUBLED (Rs 15 Cr to Rs 30 Cr). This is now a structural feature of how the company sources technology, not a one-off. Priority for claude.ai live verification: (1) obtain the individual counterparty name via exchange filing, RoC search, or direct company query; (2) obtain the valuation/fairness basis; (3) check whether a third tranche appears in FY26-27; (4) seek proxy-advisory commentary on the 8.37% AGM dissent against the new Articles of Association."
