  - {risk: "Foil margin stays at 2%", first_signal: "Foil segment margin in the Q2 and Q3 FY27 segment notes"}
  - {risk: "Conductor payment cycles and tender slowdown", first_signal: "Conductor revenue (Q1 FY27 17.1 Cr, -42% YoY) and trade receivable days"}
  - {risk: "Insulator approvals slip", first_signal: "Insulator quarterly revenue below about 5 Cr by Q3 FY27 and segment loss not narrowing"}
  - {risk: "Subsidiary capex outruns funding", first_signal: "Short-term borrowings (141.3 Cr) and payable days (24.8) rising while CFO net of both stays near 17 Cr"}
