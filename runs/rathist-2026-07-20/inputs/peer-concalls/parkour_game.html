<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rooftop Rush</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#140a28;font-family:system-ui,'Segoe UI',sans-serif;}
  #cv{display:block;width:100vw;height:100vh;touch-action:none;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;padding:20px;text-align:center;}
  .card{background:rgba(20,10,40,0.94);border:2px solid #f472b6;border-radius:22px;padding:30px 24px;max-width:440px;width:100%;box-shadow:0 12px 50px rgba(244,114,182,0.25);}
  h1{color:#f472b6;font-size:clamp(28px,7vw,46px);letter-spacing:2px;text-shadow:0 4px 24px rgba(244,114,182,0.6);}
  .sub{color:#c4b5fd;font-size:14px;margin:8px 0 22px;}
  input{background:rgba(0,0,0,0.4);border:2px solid rgba(244,114,182,0.4);color:#fce7f3;padding:13px 16px;border-radius:13px;font-size:15px;font-family:inherit;text-align:center;width:100%;outline:none;margin-bottom:14px;}
  button.big{background:linear-gradient(135deg,#f472b6,#db2777);color:#2a0a1a;border:none;padding:16px 34px;border-radius:14px;cursor:pointer;font-size:18px;font-weight:900;font-family:inherit;width:100%;box-shadow:0 6px 24px rgba(244,114,182,0.45);}
  #hud{position:fixed;top:14px;left:0;right:0;z-index:8;display:flex;justify-content:space-between;padding:0 18px;color:#fce7f3;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none;font-size:16px;}
  #tapHint{position:fixed;bottom:26px;left:0;right:0;text-align:center;color:rgba(252,231,243,0.65);z-index:8;pointer-events:none;font-size:13px;font-weight:700;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div>🏃 <span id="dist">0</span>m</div><div>⭐ <span id="coins">0</span></div><div>🏆 <span id="best">0</span>m</div></div>
<div id="tapHint">TAP / SPACE to jump • again in air = double jump</div>
<div class="overlay" id="menu">
  <div class="card">
    <h1>🏙️ ROOFTOP RUSH</h1>
    <div class="sub">Sprint the neon skyline • leap the gaps • collect stars</div>
    <input id="pname" type="text" placeholder="✏️ Type YOUR runner name..." maxlength="16">
    <button class="big" id="startBtn">▶ START RUN</button>
    <div class="sub" style="margin-top:16px">TAP screen or press SPACE / ▲ to jump.<br>Jump again in mid-air for a <b>double jump</b>!</div>
  </div>
</div>
<script>
(function(){
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let started=false,best=0;
try{best=parseInt(localStorage.getItem('rooftop:best')||'0');}catch(e){}
document.getElementById('best').textContent=best;

const G=0.62,JUMP=-12.2,DEPTH=26;   // DEPTH = fake-3D block thickness offset
let player,roofs,coins,camX,dist,coinCount,speed,playerName='',particles,trail;

function reset(){
  player={x:170,y:300,vy:0,w:30,h:46,onGround:true,jumps:0,run:0};
  roofs=[];coins=[];particles=[];trail=[];
  camX=0;dist=0;coinCount=0;speed=4.6;
  let rx=0;for(let i=0;i<9;i++){rx=addRoof(rx,i===0?640:null);}
  document.getElementById('dist').textContent=0;document.getElementById('coins').textContent=0;
}
function addRoof(prevRight,forceW){
  const gap=prevRight===0?0:66+Math.random()*96;
  const w=forceW||(150+Math.random()*170);
  const topY=300+(Math.random()*150-75);
  const x=prevRight+gap;
  const hue=['#5b3a7e','#4a3268','#6b3a6e','#3f3a72'][roofs.length%4];
  const r={x,y:Math.max(210,Math.min(450,topY)),w,c:hue};
  roofs.push(r);
  if(Math.random()<0.82){const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)coins.push({x:x+w*0.25+i*30,y:r.y-46-Math.sin(i/n*Math.PI)*34,got:false});}
  return x+w;
}
function jump(){if(!started)return;if(player.onGround){player.vy=JUMP;player.onGround=false;player.jumps=1;}else if(player.jumps<2){player.vy=JUMP*0.92;player.jumps=2;puff(player.x+player.w/2,player.y+player.h);}}
function puff(x,y){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-0.5)*5,vy:Math.random()*-3,life:24,c:'#f9a8d4'});}
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump();}});
cv.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
cv.addEventListener('mousedown',()=>{if(started)jump();});
document.getElementById('startBtn').onclick=()=>{playerName=document.getElementById('pname').value.trim()||'Runner';document.getElementById('menu').style.display='none';reset();started=true;};

function update(){
  if(!started)return;
  speed+=0.0018;camX+=speed;player.run+=speed;
  dist=Math.floor(camX/12);document.getElementById('dist').textContent=dist;
  player.vy+=G;player.y+=player.vy;
  let on=false;const px=player.x+camX;
  for(const r of roofs){if(px+player.w*0.5>r.x&&px-player.w*0.5<r.x+r.w){if(player.vy>=0&&player.y+player.h>=r.y&&player.y+player.h<=r.y+46){player.y=r.y-player.h;player.vy=0;on=true;}}}
  player.onGround=on;if(on)player.jumps=0;
  // speed trail when airborne
  if(!on){trail.push({x:player.x+player.w/2,y:player.y+player.h/2,life:12});}
  trail.forEach(t=>t.life--);trail=trail.filter(t=>t.life>0);
  if(player.y>H+90)gameOver();
  const lastR=roofs[roofs.length-1];if(lastR.x-camX<W+420)addRoof(lastR.x+lastR.w);
  while(roofs.length&&roofs[0].x+roofs[0].w-camX<-DEPTH-200)roofs.shift();
  for(const c of coins){if(!c.got){const cx=c.x-camX;if(Math.abs(player.x-cx)<24&&Math.abs(player.y+player.h*0.4-c.y)<30){c.got=true;coinCount++;document.getElementById('coins').textContent=coinCount;puff(cx,c.y);}}}
  while(coins.length&&coins[0].x-camX<-120)coins.shift();
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;});particles=particles.filter(p=>p.life>0);
}
function gameOver(){started=false;if(dist>best){best=dist;try{localStorage.setItem('rooftop:best',String(best));}catch(e){}}
  const m=document.getElementById('menu');m.style.display='flex';
  m.querySelector('.card').innerHTML='<h1>💥 SPLAT!</h1><div class="sub">Great run, '+playerName+'!</div><div style="color:#fce7f3;font-size:18px;margin:10px 0">🏃 <b>'+dist+'m</b> &nbsp; ⭐ <b>'+coinCount+'</b></div><div class="sub">Best: '+best+'m</div><button class="big" id="again">🔄 Run Again</button>';
  document.getElementById('again').onclick=()=>{reset();started=true;document.getElementById('menu').style.display='none';};}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  // neon dusk sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241548');g.addColorStop(0.45,'#5b2a68');g.addColorStop(0.8,'#b8506a');g.addColorStop(1,'#e0844a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // glowing sun
  const sg=ctx.createRadialGradient(W*0.72,H*0.32,10,W*0.72,H*0.32,120);
  sg.addColorStop(0,'rgba(253,224,71,0.95)');sg.addColorStop(1,'rgba(253,224,71,0)');ctx.fillStyle=sg;ctx.fillRect(W*0.72-120,H*0.32-120,240,240);
  ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(W*0.72,H*0.32,42,0,Math.PI*2);ctx.fill();
  // far skyline (3 parallax layers)
  ctx.fillStyle='rgba(40,25,70,0.5)';for(let i=0;i<16;i++){const bx=((i*140-camX*0.15)%(W+220)+W+220)%(W+220)-110;const bh=90+((i*47)%130);ctx.fillRect(bx,H-bh-40,92,bh);}
  ctx.fillStyle='rgba(30,18,54,0.7)';for(let i=0;i<12;i++){const bx=((i*180-camX*0.3)%(W+260)+W+260)%(W+260)-130;const bh=130+((i*71)%170);
    ctx.fillRect(bx,H-bh-10,128,bh);ctx.fillStyle='rgba(253,224,71,0.15)';for(let wy=H-bh+10;wy<H-20;wy+=22){for(let wx=bx+10;wx<bx+118;wx+=20)ctx.fillRect(wx,wy,7,10);}ctx.fillStyle='rgba(30,18,54,0.7)';}
  if(!roofs)return;
  // ROOFS as stylish 3D blocks (top face + lit front + shaded right side)
  for(const r of roofs){
    const x=r.x-camX,top=r.y;
    // right side (depth)
    ctx.fillStyle=shade(r.c,-38);ctx.beginPath();ctx.moveTo(x+r.w,top);ctx.lineTo(x+r.w+DEPTH,top-DEPTH*0.5);ctx.lineTo(x+r.w+DEPTH,H-DEPTH*0.5);ctx.lineTo(x+r.w,H);ctx.closePath();ctx.fill();
    // top face
    ctx.fillStyle=shade(r.c,28);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+r.w,top);ctx.lineTo(x+r.w+DEPTH,top-DEPTH*0.5);ctx.lineTo(x+DEPTH,top-DEPTH*0.5);ctx.closePath();ctx.fill();
    // neon roof edge
    ctx.fillStyle='#f472b6';ctx.fillRect(x,top-3,r.w,4);
    // front face
    ctx.fillStyle=r.c;ctx.fillRect(x,top,r.w,H-top);
    // windows grid with glow
    for(let wy=top+18;wy<H-14;wy+=32){for(let wx=x+14;wx<x+r.w-14;wx+=28){const lit=(Math.floor((wx+wy)*0.05)%3);ctx.fillStyle=lit?'rgba(253,224,71,0.55)':'rgba(20,12,40,0.6)';ctx.fillRect(wx,wy,16,20);if(lit){ctx.fillStyle='rgba(253,224,71,0.15)';ctx.fillRect(wx-2,wy-2,20,24);}}}
    // rooftop AC boxes / details
    ctx.fillStyle=shade(r.c,45);ctx.fillRect(x+r.w*0.3,top-10,18,10);ctx.fillRect(x+r.w*0.6,top-8,14,8);
  }
  // coins (glowing)
  for(const c of coins){if(c.got)continue;const cx=c.x-camX;const gg=ctx.createRadialGradient(cx,c.y,2,cx,c.y,16);gg.addColorStop(0,'rgba(253,224,71,0.9)');gg.addColorStop(1,'rgba(253,224,71,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cx,c.y,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(cx,c.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(cx-3,c.y-3,3.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b45309';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,c.y,10,0,Math.PI*2);ctx.stroke();}
  // speed trail
  for(const t of trail){ctx.fillStyle='rgba(244,114,182,'+(t.life/12*0.4)+')';ctx.beginPath();ctx.arc(t.x,t.y,player.w*0.4,0,Math.PI*2);ctx.fill();}
  // PLAYER — stylish side-view runner
  const px=player.x,py=player.y;
  ctx.save();ctx.translate(px,py);
  // ground shadow
  const r0=roofs.find(r=>{const rx=r.x-camX;return px+player.w*0.5>rx&&px<rx+r.w;});
  if(r0){const sy=r0.y-py;ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(player.w/2,sy,player.w*0.5,6,0,0,Math.PI*2);ctx.fill();}
  const ph=Math.sin(player.run*0.32);
  // back leg
  ctx.strokeStyle='#be185d';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(player.w*0.5,player.h-10);ctx.lineTo(player.w*0.5-(player.onGround?ph*11:9),player.h+(player.onGround?6:-2));ctx.stroke();
  // body (jacket) with gradient
  const bg=ctx.createLinearGradient(0,8,0,player.h-12);bg.addColorStop(0,'#f9a8d4');bg.addColorStop(1,'#db2777');ctx.fillStyle=bg;
  roundRect(5,10,player.w-10,player.h-20,7);ctx.fill();
  // scarf flowing
  ctx.strokeStyle='#f472b6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.w*0.55,16);ctx.quadraticCurveTo(player.w*0.55-16-ph*6,20,player.w*0.55-26,14-ph*4);ctx.stroke();
  // front leg
  ctx.strokeStyle='#db2777';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(player.w*0.5,player.h-10);ctx.lineTo(player.w*0.5+(player.onGround?ph*11:11),player.h+(player.onGround?6:2));ctx.stroke();
  // head
  ctx.fillStyle='#fcd9b8';ctx.beginPath();ctx.arc(player.w/2+2,6,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a2418';ctx.beginPath();ctx.arc(player.w/2+2,2,9,Math.PI,0);ctx.fill();
  // eye
  ctx.fillStyle='#1e293b';ctx.beginPath();ctx.arc(player.w/2+6,6,1.6,0,Math.PI*2);ctx.fill();
  // front arm swinging
  ctx.strokeStyle='#f9a8d4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.w/2,18);ctx.lineTo(player.w/2+ph*9,26);ctx.stroke();
  ctx.restore();
  // name
  ctx.fillStyle='#fce7f3';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(playerName,px+player.w/2,py-16);
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return'rgb('+r+','+g+','+b+')';}
function loop(){update();render();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
