analyst_note: "Treat Rs 4,000 Cr as a management SAM-type claim, not a TAM. Central SAM is Rs 2,500 Cr because it alone carries a definition (Q3 FY26 call: own about Rs 500 Cr plus non-GEPIL, yearly average, ex nuclear). The two readings: 2,500 (defined target fleet) vs 3,500-4,000 (undefined, possibly adds Chinese-make and other fleets). The observation that separates them: a fleet MW or unit list behind the denominator on the next call. SOM is anchored to intake share, so it moves little between the two (883 vs about 918 Cr at 3 years, calc); the readings differ on headroom, not on near-term growth. SOM CAGR 6% is below the 25-32% core intake growth of FY22-26 because share is already about 29% on the defined base; faster growth needs the larger market to be real. Per no-shading, that is a path to size, not an input to cut. SOM CAGR is a core-order-intake rate, not company revenue."
