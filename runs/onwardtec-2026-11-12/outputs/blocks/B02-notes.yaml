analyst_note: "Receivables look clean at group level, but the split matters: parent days improved because the parent pulled cash from its own subsidiaries (93.5% of the standalone fall is intra-group); subsidiary collections slowed, partly currency. Pass 1 forward cover and FX sensitivity readings were wrong in basis (Pass 2 C2, C4); use Pass 2. Reported ROCE 23.48% is standalone and includes other income; rebuild. The audit trail carve-out sits in the auditor's report, not the notes, and repeats FY25. Q2 FY27 R&D credit of Rs 2.9 Cr is outside this AR; FY26 UK credit is 135.94 lakhs."
