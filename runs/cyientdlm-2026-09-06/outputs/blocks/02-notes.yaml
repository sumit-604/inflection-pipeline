    corrected_form: "Debt Service Coverage Ratio is sub-1.0x in FY26 at 0.62x (AR FY2025-26, Note 35, p.136). The DIRECTION and MAGNITUDE of the one-year move are NOT established, because the FY25 comparator is disclosed two different ways across the two ARs."
    downstream_rule: "Do NOT carry the 1.67x-to-0.62x fall as evidence of a sudden covenant-coverage collapse. DO carry the sub-1.0x FY26 fact and the negative CFO trend; both are solid on either report's numbers. Independently found by stage 3 (B03 contradicts_upstream) and confirmed by verifier A."
