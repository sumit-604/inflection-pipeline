net_narrative_effect: "complicates"
analyst_note: "Peer set has no generator maker and none names TD, so no verdict is a direct read. Strongest finding: margin capture in this upcycle depends on contract indexation, not on demand. CG (price variation clauses) expands margin, Azad (plus-minus 5% band) holds 36-38%, Triveni (fixed price) fell to 18.0% EBITDA. Cross-peer hypothesis, testable: in this cycle sold-out demand does not separate winners; the price-adjustment clause and bought-out content do. If TD's OEM contracts lack price variation, gross margin falls below 32% (B05 kill signal) when copper moves; the observation that separates the readings is the share of TD order book carrying price variation, which no document in this stage shows. Second: Triveni missed its own double-digit FY26 guide (9%), so B05's 'guidance is a floor' reading is not a sector law. Data-centre generator volume rests on OEM demand (Azad, Triveni) not yet on steam or generator orders (Triveni Q1 FY27 p.11). Tariff verdict depends on product type: capital-equipment peers saw deferral, critical-part peers did not."
