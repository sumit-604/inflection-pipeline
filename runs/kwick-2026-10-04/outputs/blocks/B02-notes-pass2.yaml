analyst_note: "Pass 2 withdraws one Pass 1 claim: the 188.28 unpaid-tax effect on CFO. Risk Factor 5 shows advance tax shortfalls of only 18.37 for FY26, and the 453.05 asset labelled advance tax matches 451.65 paid. CFO is net of full cash tax. CFO/PAT 56.4% stands as printed; about 65% tax-neutral is an inference. The cash weakness is working-capital intensity (21.3% of incremental revenue), not tax. Two lines supply 99.97% of FY26 growth, and LBF-1 stays open. Margin quality watch items: gross margin down 10 points in two years, lease cost down 105 while owned scanners arrived late, software capitalised share 82.6%. Control gaps are real but small in rupees. Score held at 5."
