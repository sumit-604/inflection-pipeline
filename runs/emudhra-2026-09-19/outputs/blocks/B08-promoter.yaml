verdict_basis: "Clean SEBI/criminal-conviction/tax/pledge record on every hard regulatory check run, offset by seven converging soft-governance items (family board concentration, unexplained CFO pay jump, rising promoter-linked RPT balances, first-instance Chairman/Taarav funding of subsidiaries, the omitted 3i Infotech risk-section line) with no AR-stated rationale for any of them; the one serious legal allegation (3i Infotech) is EOW-closed as civil, not a confirmed adverse finding."
analyst_note: "The 3i Infotech dispute is this run's load-bearing legal item; this pass could only read eMudhra's own filings and on-record investor-call transcript (Srinivasan's detailed, checkable rebuttal: Deloitte valuation range vs actual sale price, staged and 3i-Infotech-acknowledged preference-share redemption). 3i Infotech's own complaint text and 10-Feb-2026 response letter were unreadable (encoded PDF). Treat the EOW's civil-not-criminal closure as independently verified; treat the underlying valuation/redemption dispute as one-sided evidence in this corpus and a standing tripwire (any SEBI complaint or civil suit filing). Separately, the promoter-family board expansion, unexplained CFO pay jump, and Chairman/Taarav loans to subsidiaries all landed in the same FY26 year as the 3i Infotech complaint; no causal link was found or implied, but the concentration of watch items in one year is itself worth downstream note."
