analyst_note: "Three things a later stage cannot rebuild. (1) The A&D leg of management's TAM is customer revenue, so the 4.15x ratio is driven by a definitional error, not by a close call; the energy leg is within 1.1x of the third-party figure. (2) SAM of Rs 26,741 Cr = energy filtered from third-party lines (Rs 21,664 Cr, 75% gas-OEM proxy) plus A&D implied by the 2% wallet-share claim (Rs 5,078 Cr, circular). The unfiltered reading is Rs 76,047 Cr (share 0.79%); the gap sits wholly in A&D. SOM does not depend on SAM, it is capacity-bound: Rs 1,300 Cr yr3 (ARR, order book spread 1,083-1,300 a year, share rule top all agree) and Rs 1,490 Cr yr5 (six plants at Rs 150-180 Cr plus Rs 500 Cr existing). Upper reading yr5 Rs 1,850 Cr (25.1%) equals 25% a year for five years and needs the analyst Rs 1,800-1,900 Cr capacity sum or Phase 2. (3) Load-bearing fact 2: the market does not bind the Rs 1,300 Cr run-rate claim (share 4.4% of SAM at FY29); conversion and capacity do. FY27 guidance of 25% needs H2 only 2.2% above two flat Q2 quarters; the run-rate claim needs 9.3% sequential, which Q1 (+8.3%) and Q2 (+10.1%) matched."
