going_concern_language: "NONE at group/parent level (auditor's opinion unmodified on going concern). Subsidiary-level only: step-down subsidiary Ceigall Ludhiana Rupnagar Greenfield Highway Pvt Ltd's own auditor issued an Emphasis of Matter following NHAI's project termination: 'these financial statements have been prepared on a going concern basis and therefore, all assets have been valued at their fair realizable value and all known liabilities have been fully provided for' (Note 35, cited in group auditor's report, sheet 103/74)."
analyst_note: "The two items the run brief specifically owed were both advanced: the held-for-sale entity is now named (Ceigall Malout Abohar Sadhawali Highways Pvt Ltd) with an exact numeric tie-out via AOC-1, and the bank-guarantee inconsistency was confirmed genuine and unreconciled after searching the full document, not just re-rendered. The DGGI GST search action (Section 2 of the pass 3 report) is new and material but sits in the Secretarial Audit Report rather than the Notes proper; it is included because it directly compounds the fraud finding and was encountered during the authorised targeted search, not manufactured. Accounting quality score of 3/10 reflects the volume and mutual corroboration of red flags (nil provisioning on a ballooning non-cash asset base, contingent-liability spike, two governance failures, SPV-level auditor resignation) rather than any single decisive item; none of these individually would justify going below 5, but their concentration in one 18-month-post-IPO year does."
