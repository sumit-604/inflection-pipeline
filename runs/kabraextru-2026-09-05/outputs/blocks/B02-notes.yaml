red_flags:
  - "Five independent, anchored numeric/label inconsistencies inside one year's audited statements (Note 16 consolidated, Note 42 consolidated, Note 30 standalone, Note 29/31 auditor fee, Note 15 dividend label) -- a recurring review-control weakness, not a single copy error"
  - "Rs 16.68 Cr unexplained Other income (Note 23) with zero composition disclosure, material to a loss-making year"
  - "HEVPL Rs 30.39 Cr NCLT receivable disclosure frozen at FY25 wording, with zero update anywhere in the entire 170-page annual report"
  - "Battery Division segment loss widening 69.8% YoY while tying up more net capital than the profitable Extrusion segment (Note 38)"
  - "Unhedged FX exposure up 6.8x with hedge cover cut to zero in a loss year (Note 34.3(c))"
  - "Thin standalone cash (Rs 1.97 Cr) against Rs 140.92 Cr on-demand secured borrowings, with liquid buffers and bank margin money both drawn down sharply (Notes 8/10/10A/17)"
questions_for_mgmt:
  - "What is the composition of the Rs 16.68 Cr Other income in Note 23 (FY26), and why did it grow roughly 73x from Rs 0.23 Cr in FY25 with no note disclosing its nature?"
  - "What is the current (post 31-March-2026) status of the Rs 30.39 Cr HEVPL receivable and its NCLT/CIRP proceedings -- has any further provision, write-off, or recovery occurred, and why has the disclosure not been updated from the FY25 wording?"
  - "What does the Rs 31.77 Cr capital commitment (Note 41(b), up from Rs 1.43 Cr) fund, by segment, and is it directed at further Battery Division capacity given the division's widening losses; what is its expected payback?"
  - "Why was the entire incremental FY26 borrowing need met through secured facilities, and does this relate to the CRISIL rating actions (pre-Apr-2025 and 13-May-2026), which are not referenced anywhere in the Notes to Financial Statements?"
  - "Given a pre-tax loss in both standalone and consolidated FY26 results, does the company have unrecognised deferred tax assets or carry-forward tax losses, and if so, why is neither recognised nor discussed in Note 42?"
receivables_trend: "deteriorating -- gross trade receivables fell 8.5% (Rs 98.9376 Cr FY25 to Rs 90.5243 Cr FY26, Note 9) but the ageing mix worsened sharply: greater-than-3-year bucket Rs 9.5268 Cr to Rs 19.3536 Cr (+103.2%); 2-3yr bucket Rs 11.4622 Cr to Rs 20.2156 Cr (+76.4%); the greater-than-6-months-overdue share of gross receivables rose from 42.4% (Rs 42.00 Cr) to 50.2% (Rs 45.44 Cr); ECL provision as % of gross rose from 8.1% to 11.6%. Note 43's turnover-ratio-based days show a mild improvement (receivable days approx. 73 to 70) purely because the book shrank, which understates the true deterioration visible in the ageing schedule itself; inventory days lengthened 204 to 235 and payable days lengthened 82 to 92 over the same period (Note 43), with net working-capital relief coming from stretched payables, not faster collections."
