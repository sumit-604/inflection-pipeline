analyst_note: "Core PPOP ex-treasury grew 4.2% YoY (Rs81.86 Cr to Rs85.33 Cr CON) while AUM grew 33%. The provision swing explains 64% of the YoY PAT gain. Deck PPOP of 979 then 872 Rs Mn sits below the H2 FY26 average of 992.5. Opex is flattered by capitalised deferred expenses (A3-15). The pre-committed gate fails on both legs on filed Q2 numbers, so AVOID is flagged; trigger (d) is at strike one. GNPA 0.66% sits on an unseasoned book: absolute GNPA proxy rose 8.6% YoY and the lagged ratio is 0.88%; Q3/Q4 cohort delinquency separates the readings. H1 cash cover of 0.95x includes Rs35.38 Cr unpaid current tax; tax-normalised 0.67x matches H1 FY26, so the growth-induced class holds on FY26 full-year data. Credibility 90% rests on one concall and five funding commitments. Concall is ASR with unresolved speakers. Steps 6.5/7 and 8D deferred under OR-30. Verdict unchanged after A5 loop."
