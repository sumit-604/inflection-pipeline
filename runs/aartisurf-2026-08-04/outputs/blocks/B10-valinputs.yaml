rating_wc_quote: "ASL's raw materials include lauryl alcohol (LA), fatty acids (HCFA), and alpha olefin (AO) that form a major portion of its costs. These raw material prices are linked to palm prices and are volatile in nature. Any raw material price volatility in the absence of increase in the product prices can have an impact on ASL's profitability. Such raw material price volatility have severely impacted the profitability of the company as witnessed in FY25 and H1FY26, as profitability contracted on the back of sharp increase in raw material prices, coupled with limited ability to pass on the price changes. | CARE Ratings Ltd. Press Release, 19-Dec-2025, p.2-3 | Liquidity: Adequate (term debt repayments Rs 21 Cr FY26, Rs 28 Cr FY27 incl. preference-share redemption; cash accruals tightly matched to obligations; fund-based utilization ~56%)"
