flags:
  - "Client concentration high and disclosed in Inv. Pres. (top-3 38-42%, top-10 65-72% of consolidated revenue every year FY23-FY26), contrary to upstream note of no disclosure; the H1FY26 46-48% top-3 figure from the spear brief (Nov-2025 deck, not in this corpus) is higher than this June-2026 deck's full-year FY26 top-3 figure of 42%, suggesting concentration eased in H2FY26 or the two decks measure different periods"
  - "Related-party sales were 42.1% of standalone revenue in FY24, not just 32.2% in FY25 (AR Note 21.8B, p.90); the ratio is falling but was higher than the upstream note flagged"
  - "Standalone trade receivable turnover fell from 7.81x to 4.90x FY24 to FY25 (DSO ~47 to ~74 days), with a large single related-party receivable (Systango Inc, USA, Rs.353.46 lakh) at FY25-end"
  - "~55% of net IPO proceeds (Rs.1,704.75 lakh of Rs.3,083.53 lakh) remained unutilised through FY25-end, two years post-listing, generating treasury income that inflates reported PBT"
  - "Revenue-by-vertical percentages (Inv. Pres. 'Revenue by Verticals' chart) were read off a stacked bar chart, not a data table; treat as directional, not exact"
