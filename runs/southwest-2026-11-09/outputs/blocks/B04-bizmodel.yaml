analyst_note: "Stream split is a deck chart (Deck_20260505 p.5), sums to 100.00, label pairing to confirm on PDF. Core drilling revenue +80.1% is partly an artifact: INR 4,533.92 L of coal trading ended (AR p.192). Two readings on margin: Q2 FY27 14.38% is a monsoon/maintenance dip (management, Deck p.33) or FY26 23.99% was a utilisation peak. Separator: Q3 FY27 EBITDA margin and revenue vs Q2 577 Mn, plus a rig utilisation figure from the 11 Nov 2026 call. Pricing power left at weak because the AR itself names tender pricing pressure (AR p.63). Cyclicality set cyclical on project lumpiness; the policy tailwind is stated, not yet visible in cash. Peer table is scale only, services not like-for-like. Order book basis differs between AR (7,613 Mn) and Nov deck (5,812 Mn at FY26). Erratum to report row 4D-4: standalone revenue growth is 6,373.63 L (24,292.95 - 17,919.32), not 6,263."
