  - "Corporate guarantee exposure of Rs 1,654.01cr, 3.0x the parent's own total assets, with no covenant disclosure (Note 42(i), p.137)."
  - "Internal contradiction on core-asset title between Note 4 and Note 18A, unresolved (p.120 vs p.126/169)."
  - "Rs 32.5-34.5cr deployed into LLPs 90%-owned by the two promoter-director families, no arm's-length pricing statement, no stated rationale (Note 8, p.121)."
  - "Zero Key Audit Matters from an auditor being replaced the same AGM, in the year inventory grew 4.9x, receivables 2.56x, and guarantees 16.6x (p.114/166; AGM Notice Item 4)."
  - "Note 53 parenthetical-sign anomaly isolated to the two improving ratios (DSCR, ROE), understating the gap between accrual DSCR of 9.35x and Rs (73.13)cr operating cash outflow (Note 53, p.150-151)."
  - "~70 of ~76 step-down SPVs consolidated with no Note 59 business-combination disclosure; NCI immaterial despite 49%-voting-interest holdings, mechanism undisclosed (Note 57-59 p.150-153; Note 17 p.124)."
questions_for_mgmt:
  - "What is the legal or contractual basis for consolidating ~70+ step-down SPVs with near-100% economic interest despite several being held at only 49% voting interest and NCI remaining immaterial (Note 59, Note 17, p.124)?"
  - "Note 4 states title deeds are held in the Company's name; Note 18A shows the factory land mortgaged in the promoter-directors' personal names. Which reflects actual legal title, and is transfer to the Company planned (Note 4 p.120 vs Note 18A p.126/169)?"
  - "What is the business rationale, expected return, and exit plan for the ~Rs 32.5-34.5cr investment in two LLPs 90%-owned by the promoter-director families (Note 8, p.121)?"
  - "What ECL methodology supports a Rs NIL provision against a book now 39.5% aged beyond 6 months, and what is the ageing status of the new Rs 265.19cr Solarworld Energy Solutions receivable (Note 13 p.122-123; Note 46 p.144)?"
  - "Why are Basic and Diluted EPS identical in both years despite a deeply in-the-money outstanding ESOP pool, and has any tranche vested (Note 44/43, p.141-143)?"
receivables_trend: "deteriorating - consolidated receivables aged beyond 6 months rose from 5.7% (Rs 5.92cr of Rs 103.92cr, 1-Apr-2024) to 12.1% (Rs 13.36cr of Rs 110.09cr, FY25) to 39.5% (Rs 111.35cr of Rs 281.59cr, FY26); entirely a subsidiary phenomenon, parent standalone book stayed at ~6% aged beyond 6 months (Note 13 p.122-123; Note 12 standalone p.166)"
