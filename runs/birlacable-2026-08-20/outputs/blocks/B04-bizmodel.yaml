valuation_methods:
  primary: {method: "EV/EBITDA (normalized/through-cycle)", why: "EBITDA swung +41% on one segment's customer-driven surge while OFC is trough-to-recovery; through-cycle multiple avoids anchoring on a peak year for the dominant segment"}
  secondary: {method: "P/E (normalized)", why: "EPS jumped 1.68 to 5.62 on the same mix shift; useful cross-check only if normalized for the single-customer LAN cable cycle"}
  tertiary: {method: "Asset-based (P/B)", why: "Only relevant as a net-asset cross-check if the pending amalgamation swap-ratio economics need validation against Vindhya Telelinks"}
  not_applicable: ["DCF - no multi-year volume/capacity roadmap disclosed, entity itself pending dissolution", "Dividend yield/DDM - first-ever dividend this year after a nil prior year, no track record", "Sum-of-parts - single Ind AS 108 segment (Cables), no separable units"]
irrelevant_ratios:
  - {ratio: "Gross margin vs branded/consumer-company peers", why: "raw material is 82.3% of revenue; structurally low-gross-margin conversion business, not comparable to asset-light or branded peers"}
  - {ratio: "Net profit margin trend without segment split", why: "FY26 jump to 2.30% from 0.80% net margin driven almost entirely by one segment/one customer, not a company-wide structural improvement"}
  - {ratio: "ROE/ROCE without noting OCI-driven equity swings", why: "total comprehensive income exceeds net profit mainly due to a Rs1,210.60 lakh fair-value OCI gain on equity investments, inflating net worth growth"}
  - {ratio: "Institutional-ownership-based quality screens", why: "not a valid signal per pipeline convention, not used"}
must_track_metrics:
  - {metric: "Single-customer revenue concentration", healthy: "<30% from any one customer", red_flag: ">45% (already breached in FY26)"}
  - {metric: "Raw material cost as % of revenue", healthy: "stable or falling", red_flag: "rising QoQ without matching price hikes (FY26 baseline 82.3%)"}
  - {metric: "Debt Service Coverage Ratio (DSCR)", healthy: ">1.0x", red_flag: "already 0.39x; persistent sub-1x is a structural funding risk"}
  - {metric: "Cash conversion cycle (days)", healthy: "<90 days", red_flag: ">120 days or widening trend"}
  - {metric: "Current borrowings growth vs revenue growth", healthy: "borrowings growth <= revenue growth", red_flag: "borrowings growth exceeds revenue growth (already true: +35.6% vs +16.5% FY26)"}
unit_economics:
  unit: "kilometre of cable (F-km for OFC, cable-km for copper/LAN) - natural unit per AR's own industry disclosures, but company-level volumes NOT FOUND in AR"
  revenue_per_unit: "NOT FOUND - no company-level volume disclosed"
  margin_per_unit: "NOT FOUND - no company-level volume disclosed"
  key_lever: "raw material cost pass-through (copper, glass preform, polymer/helium feedstock, 82.3% of revenue) and capacity utilisation/operating leverage from the single Rewa plant"
first_deterioration_signals:
  - {risk: "Loss/slowdown of the single customer (45% of revenue)", first_signal: "Revenue from Operations (quarterly) and that customer's Trade Receivables ageing/DSO"}
  - {risk: "Raw material cost inflation not passed through amid stated cut-throat competition", first_signal: "Cost of Raw Materials Consumed as % of Revenue (P&L)"}
  - {risk: "Working capital increasingly funded by short-term borrowing", first_signal: "Current Borrowings (Balance Sheet) and DSCR"}
  - {risk: "Single-plant (Rewa) execution/capacity constraint", first_signal: "Capex line vs revenue growth rate - capex not scaling with LAN cable surge"}
  - {risk: "Amalgamation into Vindhya Telelinks dissolves standalone entity", first_signal: "Exchange filings on NCLT hearing dates, shareholder/creditor meeting outcomes, or any change to the 10:115 swap ratio"}
mgmt_questions:
  - "What is actual capacity utilisation at Rewa, and is the FY26 LAN cable surge near full capacity?"
  - "Who is the customer at 45% of revenue, and what is order-book visibility beyond FY27?"
  - "What is the expected NCLT/exchange approval timeline for the Vindhya Telelinks amalgamation, and is the 10:115 swap ratio final?"
  - "How much of the FY26 raw material cost increase was passed through in pricing versus absorbed in margin?"
  - "Given DSCR of 0.39x, what is the plan for near-term debt service - refinancing or equity support?"
  - "Is the OFC demand recovery referenced from late March 2026 translating into actual order intake for Birla Cable specifically?"
  - "What happens to the standalone entity's shareholders, employees and the Rewa plant post-amalgamation?"
one_line_verdict: "Thin-margin cable converter, single customer at 45% of revenue, pending dissolution into Vindhya Telelinks."
analyst_note: "The dominant fact for downstream stages is the pending amalgamation into Vindhya Telelinks (swap ratio 10:115, not yet NCLT/exchange approved as of Q1 FY27). Standard standalone valuation of BIRLACABLE may become moot if the scheme completes; Stage 11 should treat this as a live structural override, not a normal risk factor. Separately, FY26's margin and EPS jump is a single-customer, single-segment event (LAN cable +28.7% YoY, one buyer at 45% of revenue) layered on an OFC segment still emerging from a global trough - normalize before applying any multiple. DSCR of 0.39x and current-borrowings growth outpacing revenue growth are live balance sheet flags, not resolved."
