analyst_note: "Saarathi Tranche 2 consideration is fully reconciled at Rs 14.54 Cr actual vs the Sep-2025 Letter of Offer's Rs 14.00 Cr planned total (Rs 10 Cr rights-funded + Rs 4 Cr internal accruals); company memory's '~Rs 10 Cr' described only the funding source, not the full consideration -- update companies/QMSMEDI.md LBF3 at /finalize, no residual discrepancy. The accounting-quality picture is disclosure-completeness driven, not fabrication-driven: no exceptional-item smoothing, no EPS dilution, clean contingent liabilities, unqualified audit both years. The five NOT-FOUND clusters (policies note, segment result, financial-instruments/risk note, goodwill impairment test, standalone Note 37 ageing) compound each other and should be raised as a single governance question at Halt 1, not five separate ones, since a single remediation (a fuller FY27 AR) would close all five."
