v3_3_vs_v3_6_delta: "Decision held at WATCHLIST/CONDITIONAL but more marginal on every metric. Amdt 14 fade cut base 3yr CAGR 13->10.5%, base FY30 EPS 114->112 (-6.7%), base Hurdle 1.87->1.75, polymer entry 2,043->2,007, combined CMP-vs-entry gap ~6%->~9.8%. Amdt 13 dense-RPT ON (+0.5 r both) - absorbed by 35x cap for A, live for B. Amdt 12 removed A's -0.5 durability credit and added B cyclical +0.75 (capped) -> B RRM track 13.2->10.6x. Amdt 11 formalized 30x Pillar-1 (no output change). Amdt 15 relative PE 1.71x, re-rating MODERATE-to-NONE, exit at low end. Debt Capacity COMFORTABLE (no FV change); Market-Implied FAIRLY PRICED (the ~29% premium is a spent re-rating bet). Business A destination unchanged at 35x because the sector cap absorbs Amendments 11/12/13; the bite is on the projection path, the hurdle, and the entry gap, not the exit multiple."
one_line_thesis: "WATCHLIST JACPL at Rs 2,342 on the full v3.6 recompute: SOTP fair value ~Rs 4,566 Cr still ~29% above the Rs 3,549 Cr market cap with ~88% in the 35x-capped polymer business, but Amendment 14 fade cuts base 3yr CAGR to 10.5% and base Hurdle to 1.75 (CONDITIONAL), Market-Implied reads FAIRLY PRICED with the +58% re-rating banked, and CMP now sits ~9.8% above the 25% entry - same WATCHLIST as v3.3, weaker on every margin, still wanting a ~10-15% dip or the first standalone polymer accounts."
