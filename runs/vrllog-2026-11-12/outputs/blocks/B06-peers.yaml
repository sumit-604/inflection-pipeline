  - "Labour availability and election-linked disruption (TCIEXP Q4 FY26 p.3; TCI Q4 FY26 p.7)"
  - "Express operators moving into LTL on price (TCI Q3 FY26 p.12)"
  - "Demand softness from inflation and auto pullback (TCI Q4 FY26 p.2; TCI Q2 FY27 p.3)"
