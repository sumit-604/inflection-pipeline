analyst_note: "The CMD raised the FY27 guide orally to 300-350 Cr (l.150). The filed deck and release carry no number, and FY26 and Q1 both missed. The call's own figures do not tie: an H2 guide of 200-250 implies 335-385, and the CMD drifted to 350 (l.305). The 300 floor needs about 165 Cr in H2, roughly the implied Q2 run-rate held (87 Cr [INFERENCE]). 350 needs about 107 Cr a quarter. Customers want 353 Cr before March, but management guides 200-250 and cites customer timelines. Reading 1: conservatism, with the slippage on the customer side. Reading 2: a capacity, type-test or working-capital limit, with Kannur at 20-30% and cash at 0.25 Cr. The PAT-margin floor is now 9% (the analyst recalled 10%). The CMD says mix gains are absorbed by overheads, against the deck's margin-expansion pillar. Danya, warrants, debt and payables went unmentioned, while a much bigger expansion is planned for next year. Separating observation: Q3 FY27 revenue of 82 Cr or more, with positive operating cash flow and inventory moving toward 60-70 Cr. All call numbers are ASR; verify against an official transcript."
