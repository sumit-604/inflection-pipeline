analyst_note: "Two findings dominate this stage. First, management's own cited boards TAM (USD4.8bn) is ~27x the figure independently triangulated from Visaka's own share arithmetic and a named competitor's (BirlaNu) on-record Aug-2026 statement (Rs1,500-2,000cr) -- treat the AR's industry-narrative paragraphs as decorative, not load-bearing. Second, the blended SOM-implied revenue CAGR (7.3-7.8%) is far below the 25% CAGR hurdle; roofing (53% of revenue) is capacity-sufficient but management-capped at near-zero growth by its own stated strategy, boards (30%) can grow at 15%+ but is capacity-constrained beyond a narrative, uncommitted capex plan, and yarn (15%) has no reliable market size at all. ATUM (0% disclosed revenue after 8 years) is the one lever that could change this picture and is entirely unpriced here by design. Stage 11 should treat this stage's growth numbers as a hard ceiling check against any DCF/multiple-based revenue assumption exceeding ~10% for roofing+boards+yarn combined, absent a specific, evidenced reason (e.g., a confirmed boards capex commitment or a first ATUM revenue disclosure)."
