risks_peers_raise:
  - "SEBI restructuring its own internal commodity-derivatives oversight (independent MRD teams), uncertain effect on open regulatory items -- MCX Concall Aug 2026 Transcript, p.19. No IEX-side equivalent disclosed."
  - "RBI regulation on bank-guarantee funding of clearing-corporation margin money, acknowledged as not-yet-fully-realised -- BSE Concall Aug 2026 Transcript, p.16-17; MCX Concall May 2026 Transcript, p.18. No IEX-side equivalent disclosed."
  - "Fintech-onboarding-friction competitive erosion, quantified in real time (420bps incremental share loss) -- CDSL Concall Aug 2026 Transcript, p.6. IEX discloses no equivalent numbered monthly competitor-share metric."
  - "Settlement Guarantee Fund core-contribution policy as a source of quarterly earnings volatility, addressed via a new 5%-of-revenue smoothing policy -- BSE Concall Nov 2025 Transcript, p.13. No IEX-side equivalent capital-buffer mechanic described in this corpus."
net_narrative_effect: "complicates"
analyst_note: >
  This run answers all six current B05 peer_questions and carries forward
  run 1's three non-overlapping findings (non-operating income verified,
  fee-compression precedent partially verified, IGX OFS unverifiable) as
  Part 1B. Old Claim 4 (customer loyalty) is not listed separately; it is
  superseded by and folded into the current Q6 verdict, which subsumes and
  strengthens it with two additional quarters of evidence (CDSL's Nov-2025
  93-to-82% first leg, BSE's Feb-2026 SOR explanation, and BSE's Aug-2026
  share-recovery update). The nine listed claims across
  verified/partially_verified/contradicted/unverifiable therefore total: 1
  verified, 2 partially verified, 2 contradicted, 4 unverifiable. Two
  findings are genuinely counterintuitive and should carry weight in
  synthesis: (1) peers are LESS forthcoming than IEX on concentration
  disclosure, not more, which reframes IEX's late, reactive disclosure
  practice as comparatively transparent rather than comparatively opaque;
  (2) MCX, IEX's own coal-market rival, discloses no size figure at all
  for the opportunity IEX has revised ~50% unbridged, so the coal-sizing
  question has no independent peer anchor to check IEX's figures against
  in either direction.
