analyst_note: >
  Assembly complete with all values anchored or marked UNRESOLVED with recovery paths. CFO/PAT negative
  cumulative ratio is Ind AS 7 effect (loan disbursals through operating cash), not cash-quality failure;
  classified GROWTH INDUCED per operator. Write-off-assisted GNPA is material: ~15.7% annual write-off
  rate (+10.7% YoY) sustains 2.12% headline against 28.9% YoY new Stage-3 inflow; 150-DPD trigger
  undisclosed despite company-context naming (B00 LBF-1); Q1 GNPA rose sequentially to 2.25% into
  'further strengthen' guidance (B03 FLAG-GUIDANCE-DIVERGENCE). Ugliness classification (negative CFO/cost-to-income
  optics are artifacts) is operator's verbatim assessment; operator has not named which is structural vs which is
  temporary. Parent guarantee 228% of net worth (rising 4 years) is a candidate but not the named structural feature.
  Rs 832 Cr raise (17-Sep-2026) at 40.2% CRAR postdates both concalls, has zero disclosed numeric rationale,
  unprecedented vs peer precedent (B06 FLAG-CAPITAL-RAISE-NO-PEER-PRECEDENT). EM 18.5/MODEST + Core 51/AVERAGE
  does not qualify transition; strongest moat (D1) is execution lead per I2, not structural barrier. Proof gate
  NOT FIRED; H2 FY27 all-in loss test needed (FY26 all-in loss 10.97% of avg AUM). Entry zone Rs 350 PROVISIONAL
  pending Amendment 19 FV CAGR per CLAUDE.md. SOTP slices (own P/B, partner P/E) are method outputs, not
