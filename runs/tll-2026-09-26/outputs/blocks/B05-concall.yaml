analyst_note: "This rework run accepts all eight items assigned to stage 5 (gate-recommendation items 2,3,5,6,7,8,9,11), verifying each against the primary source rather than the auditor's word. Two run-1 findings were not just incomplete but wrong in direction: the FY25 CFO restatement was called 'not a deck matter' (it is, and it is undisclosed); the revenue-from-operations mislabel was called 'silently corrected' (it recurs in the FY26 Board's Report itself). The credibility grade moves from C to D because the accumulated pattern is not isolated deck imprecision but a repeated one across the statutory filing and multiple decks, on cash flow, revenue labelling, PBT composition, and two separate narrative claims (registration-drives-revenue, stable product mix) that fail direct tests against the company's own data. peer_questions[] is unchanged from run 1; none of the eight items generates a new peer-verifiable claim."
