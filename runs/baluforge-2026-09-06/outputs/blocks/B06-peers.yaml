analyst_note: "The single most consequential finding: the Middle East event Balu Forge cites is real (two peers independently name it, unprompted, in the identical quarter) but every peer that names it describes a cost-side hit only, while posting its own strongest revenue growth of the year in that exact window. This is stronger than a simple 'peers saw normal demand' finding: it shows the one channel by which the event demonstrably hit the sector (energy/freight costs) is undiscussed in Balu Forge's own materials, while the channel Balu Forge claims (revenue/logistics) is the one channel peers do NOT show. Recommend Stage 11/13 treat this as reinforcing, not softening, the MAJOR guidance-miss flag."
