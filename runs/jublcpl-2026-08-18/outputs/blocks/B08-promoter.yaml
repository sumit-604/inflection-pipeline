verdict_basis: "No red-flag/deal-breaker dimension found, but four caution-level findings cluster on the same governance-concentration theme: a dated (2018, SAT-adjusted 2019) SEBI PIT-regulation fine on the two founding promoters at a different group entity; a Finance Committee with Rs 1,250cr borrowing authority and zero independent directors; KMP pay +63.6% YoY against 9.8% average and a 99.91x CEO:median ratio; and CSR spend 100% routed through the promoter family's own foundation — offset by genuine 2024-2026 transition evidence (external professional CEO, independent-director demerger fairness review, clean auditor relationship, no ID exits)."
analyst_note: "The 2018 SEBI matter is the single item most likely to be over- or under-weighted downstream: it is real (SAT-adjusted, not dismissed) and names the two individuals who remain the Jubilant Bhartia Group's ultimate authority, but it attaches to a different listed entity's 2013-14 conduct, not to JACPL, its current board, or its post-2024 corporate form. Treat as promoter-level (not JACPL-level) history. The Finance Committee independence gap and the KMP pay spike are the two items with live, current-year relevance and are where a synthesis stage should focus if capping the verdict."
