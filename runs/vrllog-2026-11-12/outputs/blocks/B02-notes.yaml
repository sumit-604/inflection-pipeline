analyst_note: "All figures INR lakhs, filed unit. EBITDA is my derived line (PBT + finance cost + D&A - other income) after Ind AS 116; the company EBITDA of 67,389 equals mine plus other income 2,367. The per-tonne reading uses MD&A tonnage -7% and fuel price from outside the notes, so verify at stage 5 and the concalls. The single observation that separates a lasting margin from a one-off is quarterly revenue per tonne against tonnage as volumes recover. Rate the margin step-up WATCH, not clean: realisation did the work and 37% of revenue growth was lower credit notes."
