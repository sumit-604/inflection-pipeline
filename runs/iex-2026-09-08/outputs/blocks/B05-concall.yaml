credibility_grade: "C"
credibility_basis: >
  Volume guidance and dividend policy delivered consistently, and one miss
  (other income) was explained candidly; but the single most financially
  material recurring question (fee realization trailing volume) drew three
  unreconciled answers across three quarters, a specific RTM growth
  statement was falsified by the company's own data within weeks, the
  CFO's stated 42-44% ROE does not reconcile with the company's own
  reported net worth and PAT (computed 35.2% consolidated / 36.3%
  standalone), a coal opportunity figure moved ~50% unexplained, and
  customer concentration surfaced only at the last question of a two-hour
  meet with a stability claim asserted then partly withdrawn.
