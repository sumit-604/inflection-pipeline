analyst_note: "Three arithmetic breaks, all derived from filed numbers, outweigh any single line. (1) The Audited Mar-26 consolidated BS carries Other Equity 3,635.61 vs 3,442.02 in the results table. The H1 roll ties only from 3,442.02. The 193.59 gap equals FY26 OCI, and investments (+251.03) and DTA (-57.43) carry the same pre-tax and tax amounts, so the group comparative reads as if the FY26 FVOCI loss was never booked. (2) Q1 NCI 14.98 equals 25% of Kidcity's Q1 tax (59.92), not its PAT; Q2 NCI is the H1 plug. (3) Prior EPS uses 205-285 lakh shares while paid-up shows 619.975 lakh; H1 FY26 had no share proceeds, so the increase looks non-cash and unrestated. The business pattern matters as much: CFO (487.90) against PAT 1,816.87, receivables +63%, and 1,593 of new corporate loans plus two Elementa-named non-textile stakes, funded by term debt and warrant money, in a company that declares one textile segment. Kidcity's 1% staff cost and 168-day receivables do not read as retail. Lean bear on each until management explains."
