analyst_note: "Core 66 with 4 of 12 moats gives GOOD+, but three scores rest on mechanics. Block A median ROCE 17.8% is pulled down by FY20-FY22 (7-18%) before the FY24 step-up to 30-46%; FY26 ROCE fell to 27.8% as IPO cash (27.83 Cr) lifted capital employed. Block B is the weak point: CFO/PAT 0.58 and FCF/PAT 0.17 because inventory (+7.72 Cr) and capex (7.50 Cr) absorbed FY26 cash. M10 and M11 are formula artefacts, M2/M5/M9 are zero for missing peers, so true moat strength is not measured. FY20-FY22 payables and capex missing, which shortens B2/B3/B4 windows."
