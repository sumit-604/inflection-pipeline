analyst_note: "The single most consequential number in this stage is the ~10% SOM-implied revenue CAGR, which sits below management's own 15% FY27 guidance and well below the 25% strategy hurdle, even after crediting Ceigall with real share gains (15.2% FY24-26 CAGR vs ~5% TAM growth). Three explanations are non-exclusive: the TAM/SAM used is a conservative national-highway-only floor excluding unquantified state-highway/metro spend; FY26's order-inflow beat (2.3x guidance) already exceeded the 'normal' share-gain band used here and may repeat; or growth increasingly depends on renewables/T&D, which is correctly excluded from this TAM as pre-revenue but which management itself credits with ~35% of FY26 inflow. Stage 11 should treat the 10% figure as a floor cross-check on revenue assumptions, not a ceiling, given the excluded segments."
