analyst_note: "Score reflects a ten-year record of losses and a legacy balance sheet, not the FY27 run-rate. Revenue stepped up to 80.95 Cr in Q3 FY26 and 93.53 Cr in Q2 FY27 from 49-52 Cr in the first half of FY26, and operating profit turned positive (Q2 FY27 8.80 Cr). None of this is in the ten-year scores. FY26 ND/EBITDA 9.75x and interest cover 0.63x drive deal-breaker 6 on a trough-year EBITDA of 14.75 Cr. Trailing four quarters to Sep 2026 EBITDA ex other income is 4.15+15.30+7.34+8.80 = 35.59 Cr (Data_Sheet Operating Profit, Quarters block); that is a live fact for later stages, not a Gate 0 input. Pledge 49.5% of promoter holding and the 57.6% contingent-liability ratio are the governance weights."
