analyst_note: "No B05 claim is contradicted, but two checks cut against the headline. Computed from Data_Sheets (INR Cr), RKFL's Sep-2026 quarter sales of 1,405.42 are +54.9% on a base 13.9% below Sep-2024; two-year growth is 33.4% against peers at 32.0 to 38.7%. A 2.4x full-capacity net block turn compares with FY26 closing-block turns of 1.13x (RKFL), 1.40x (Happy), 1.44x (MMFL) and 2.05x (BF consolidated); MMFL management gives a ceiling of 1.2x on gross block. Receivable days of 68.5 for RKFL rise to 83.4 with the Rs 173 Cr discounted bills added back (B05 figure, derived from call numbers). Peers do not describe bill discounting at all. Data_Sheet gross margin overstates call-stated gross margin by 2 to 4 points for Happy and MMFL; use call figures for any gross margin comparison. The cross-peer hypothesis is unproven and meant as a test for Q3 and Q4 FY27 prints."
