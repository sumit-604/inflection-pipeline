one_line_verdict: "QMS MAS: FY26 profit growth intact on paper, but operating cash generation and disclosure candor both need a straight answer before this qualifies as GARP."
analyst_note: "The single highest-value finding this stage adds beyond B02's triple-pass is the cash flow statement's own construction: short-term borrowings movements sit inside operating activities in both the standalone and consolidated cash flow statements, with no policy note anywhere explaining the classification. This means the reported CFO figures B00/B01 pulled from the screener (Rs 18.77 Cr standalone, Rs 19.44 Cr consolidated FY26) substantially reflect new borrowing, not operating cash generation; normalized CFO/PAT is 0.2-0.3x, far below the 0.7x flag threshold, in BOTH FY25 and FY26, and deteriorating. Combined with the MD&A/Note DSCR self-contradiction (1.99x vs 0.79x, same document, same year), this stage's central recommendation is that Stage 8/11 treat the reported cash and coverage ratios in this AR as unreliable without independent recomputation from the primary statements, which this stage has already done and anchored above."
