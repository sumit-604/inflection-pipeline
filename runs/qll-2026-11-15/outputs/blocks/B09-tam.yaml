analyst_note: "No management TAM exists, so the ratio field is a share (Rs 500 Cr over conservative TAM), not an inflation test. TAM here is three verticals only, so it is below the all-vertical top-down outsourced testing figure (Rs 28,046 to 48,390 Cr). Two readings of growth: market-led (TAM 8.9%, or 6.5% on Mordor) or capacity-led (QLL 28%). QLL share is under 1% of SAM, so the market is not the limit. Separating observation: H2 FY27 revenue of at least Rs 95.83 Cr (B04) with growth from existing labs. SOM is a judgement at +0.5pp share in 3 years, half the normal-rule floor; the rule-normal reading is Rs 365 Cr (43% CAGR)."
