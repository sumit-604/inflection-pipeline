verdict_basis: "No proven misconduct or enforcement action against the promoters personally; CAUTION rests on the breadth of unresolved or under-disclosed items across six of ten dimensions -- two live personal tax disputes (~Rs 24.98 Cr), an ED summons open 3+ years with no closure confirmation, an undisclosed 228% guarantee-to-net-worth concentration, a 5-month independent Audit Committee Chairman exit, a board with zero nominee directors, and both founders holding all four top executive/finance seats with no succession plan -- not on any single severe finding."
analyst_note: >
  Two things do not fit neatly into the scorecard cells and deserve explicit note.
  First, the promoters have not sold a single share and carry zero pledge through
  the IPO and the Jun-2026 snapshot -- a genuinely clean "skin in the game" signal
  that sits alongside, not against, the caution items above; it argues the caution
  here is about disclosure and structure, not about promoters positioning to exit.
  Second, the Rs 832 Cr preferential issue closing with zero promoter participation
  and marquee long-only names is real transition evidence, but it lands at the same
  moment the board loses its last nominee director -- new institutional money is
  arriving with less board representation than the departing VC investor had, not
  more. That juxtaposition, not any single adverse item, is why CAUTION rather than
  TRUSTWORTHY is the right classification pending the operator's own read of the ED
  and tax items.
