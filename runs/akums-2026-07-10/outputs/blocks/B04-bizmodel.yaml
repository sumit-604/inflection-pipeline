  - {risk: "New facility ramp-up stalls", first_signal: "Capacity utilization % stagnant below 44%"}
  - {risk: "API and Trade Generics structurally loss-making", first_signal: "Segment EBITDA for API and Trade Generics widening losses"}
mgmt_questions:
