receivables_trend: "stable-to-improving on receivables alone: net trade receivables +30.0% YoY (Rs 1,454.67 Mn to Rs 1,892.13 Mn, Note 10) vs 35.1% revenue growth; >6-month ageing bucket improved 13.5% to 12.3% of gross (Note 42). But unbilled revenue (Note 8) +40.6% YoY and trade payables (Note 18) +91% YoY both outrun revenue growth; combined receivables-plus-unbilled growth is 33.6% (Note 48), close to revenue growth, so overall cash conversion still deteriorates on the payables/unbilled side even though receivables in isolation look clean. See FLAG-CASH and Pattern A."
