top_findings_preliminary:
  - {rank: 1, finding: "Contingent liabilities note (Note 33) discloses zero quantified amounts in both standalone and consolidated FS, while the standalone auditor's CARO Annexure (PDF p.86) discloses ~Rs1,101.50mn (~INR110.15 Cr) of disputed statutory dues under appeal (Income Tax Rs1,083.38mn incl. Rs757.93mn at Delhi High Court = 13.9% of net worth; GST Rs18.12mn), none of which appear in the Ind AS 37 note itself", note_ref: "Note 33, standalone PDF p.112-113 and consolidated PDF p.155-156; CARO Annexure PDF p.86", rating: "RED", why: "Direct disclosure-consistency gap within the same Annual Report; the statutory Ind AS 37 note that is supposed to carry this exact information carries nothing"}
  - {rank: 2, finding: "Two GST Show Cause Notices (~Rs6.53 Cr FY23-24, received/disclosed 20/21-May-2026; ~Rs7.10 Cr FY22-23, dated 23-May received 25-May-2026) are entirely absent from the Notes to Financial Statements; the first predates the 25-May-2026 board approval of the FY26 accounts and no subsequent-events note exists to capture it", note_ref: "Cross-checked against announcements 20260521-*, 20260602-*, 20260604-*; NOT FOUND in Note 33 or elsewhere in the AR notes", rating: "RED", why: "A known, dated, quantified tax demand that existed before the financial statements were approved is missing from the notes specifically designed to capture it"}
  - {rank: 3, finding: "Design & Build business transfer to Awfis Transform Pvt Ltd (100% subsidiary): slump sale Rs265.91mn, timeline extended to 31-Dec-2026 pending revised valuation; the transferring segment's revenue fell 7.8% and PBT fell 31.9% YoY in the same year of the carve-out", note_ref: "Note 40, PDF p.122-123", rating: "YELLOW", why: "Directly answers LBF3; the asset being transferred is shrinking, and the stated consideration will be re-based on a later valuation, so Rs265.91mn is not final"}
  - {rank: 4, finding: "Effective tax rate is 0% in both FY26 and FY25 (current tax Nil, deferred tax Nil); mechanism is a large DTL (ROU/PPE Rs2,616.93mn + finance lease receivables Rs901.90mn, new this year) exactly netting a large DTA (lease liabilities Rs3,650.04mn + carryforwards), with management explicitly choosing not to recognise DTA in excess of DTL", note_ref: "Note 39, PDF p.121-122", rating: "YELLOW", why: "Explains the priority-flagged 'unusually low effective tax rate'; structural feature of the Ind AS 116 lease book, not an aggressive tax position - if anything conservative, and ~Rs150-250mn of unrecognised carryforward benefit is a future one-time non-cash-credit watch item"}
  - {rank: 5, finding: "Lease cash outflow grew 67.4% YoY (Rs2,462.21mn to Rs4,121.64mn: principal Rs1,169.45mn to Rs2,505.11mn +114.2%, interest Rs1,292.76mn to Rs1,616.53mn +25.0%) while continuing-ops revenue grew 32.9%", note_ref: "Note 38, PDF p.120-121", rating: "YELLOW", why: "The single most direct notes-based number bearing on LBF1's reported-to-cash EBITDA bridge; lease cash commitment is growing materially faster than revenue"}
