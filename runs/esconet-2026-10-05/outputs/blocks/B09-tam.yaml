analyst_note: "SAM is hardware ex-hyperscale only (Rs 21,139 Cr = realistic server TAM x 51.65%); cyber (Rs 27,121 Cr services TAM) and government cloud (Rs 15,272 Cr) sit as 5D levers because Fluidech is 1.52% of revenue and ZeaCloud has no empanelment. Rule-band SOM (31.2% yr3, 26.9% yr5) is the framework mechanic, not a forecast: a 1pp gain from a 1.42% base means a 70% rise in share. Reading A: market absorbs it (market growth 9.81% plus share gain, FY23-26 CAGR 55%). Reading B: FY27 guidance Rs 370-400 Cr (+4.4% to +12.9%) and working-capital limits bind. Separating observation: Q2 FY27 consolidated revenue ex-Singapore and any HexaData line disclosure. At constant FY26 margin, earnings growth equals revenue growth. Trailing P/E 52.9x (market cap 325.68 Cr over FY26 PAT 6.16 Cr, screener). Section 1B governs the exit multiple."
