net_narrative_effect: "complicates"
analyst_note: >
  The Q4 paracetamol-pricing contradiction is the single highest-value finding: it is the exact
  contradiction IOL's own spokesperson flagged by referencing a Granules transcript, and the
  actual Granules transcript confirms rather than resolves it, in the same fiscal quarter, in
  management's own words. The Q6 DCDA/China verification is the strongest positive finding,
  with Granules' own unprompted "only DCDA manufacturer outside China" framing stronger evidence
  than anything IOL states on its own calls. Three of six questions are UNVERIFIABLE, not because
  peer transcripts were missing but because Aarti Drugs never names ibuprofen (it only discloses
  an aggregated anti-inflammatory bucket), no peer engages the named competitor-distress claims,
  and Granules' actual CDMO business (peptides) is a product mismatch for IOL's planned tablet
  CDMO line. The cross-peer hypothesis (pricing-mechanism/buyer-concentration bifurcation) gives
  a sharper, testable frame for the Q4 contradiction worth a direct customer-mix question in live
  verification.
