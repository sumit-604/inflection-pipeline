materiality_read: >
  No, the residual gap would not change an investment decision. Three of my 26
  items are absent from the pipeline and two of those three are texture rather
  than thesis; the third sits inside a coupling risk the pipeline already
  flags at its highest severity across seven separate rows. Zero pipeline
  flags are unsupported, every load-bearing monthly-filing number I re-derived
  matched exactly, and all five promise-delivery directions I tested held, so
  the residual is overwhelmingly the residue of an adversarial reader
  out-listing a single-pass stage after two rounds of remediation already
  stripped the easy findings. The two things I would still hand stage 11
  explicitly are calibration inputs, not new red flags: that July 2026 was the
  first month IEX volume grew slower than national demand while August's
  cleared volume was sell-side capped (which tests how much growth to
  underwrite), and that management's own admitted failure of all three 2023
  product launches is the right base rate to discount the pending-product
  optionality; and I would fix the anchor drift in Part 5 before this record is
  cited downstream, because B05 claims a grep verification it did not complete
  and two quotes are attributed to the wrong call.
