analyst_note: "Nine questions: none verified, five partial, two contradicted, two unverifiable. The peers neither confirm the TAM chain (20% of revenue on pre-analytics) nor name Credent, so the central demand claim stays on management word alone. The sharpest peer evidence is cash: the manpower peer that grew 46% sat at 118 receivable days and the cleaner logistics peer at 58 to 60, so under 45 days has no precedent. Margin: Krystal 6 to 7.5% and TCIEXP 11 to 13% with 15% as a two to three year goal. Q7 is a benchmark only; TCIEXP top 25 under 15% does not test Credent's own filed 15.76% top-1. Peer roles differ (TCIEXP owns hubs and outsources fleet; Thyrocare is a customer, not a competitor), so weight is moderate. Cross-peer hypothesis in report Part 5: payment timing, not growth, separates high-margin from low-margin outsourced services in this set."
