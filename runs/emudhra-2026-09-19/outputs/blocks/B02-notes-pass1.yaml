analyst_note: "Two items compound: the Cryptas earn-out (finding 1) and the goodwill build with no disclosed
  impairment assumptions (finding 2) are both about the same acquisition and sit on top of each other - if Cryptas
  underperforms, the earn-out liability shrinks (favourable) but goodwill impairment risk rises (unfavourable) on
  the same underlying facts. Stage 11 valuation should treat these as linked, not independent, risks. Standalone
  parent PAT grew 61% vs consolidated 26%, explained by intercompany royalty/licensing fees the parent charges
  subsidiaries (Rs 169.9mn FY26 vs Rs 79.8mn FY25, standalone Note 46.3) - normal group-IP structure, fully
  disclosed as RPT, but means standalone trends should never be read as a group-economics proxy."
