  capex_cycle: "Industry-wide capacity race, not a lone expander: all three peers run their heaviest-ever capex programmes simultaneously (Varroc Rs450-550cr FY27, Pricol Rs680-700cr FY26 plus more FY27-28, Minda Rs400-450cr FY27), funded mostly by internal accruals with net debt/EBITDA held below 0.6x; INEL's Rs42.15cr FY26 capex is a fraction of peer absolute spend with no comparable content-expansion narrative."
