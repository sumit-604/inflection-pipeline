strengths_top3:
  - "Guidance delivered almost exactly on all three FY26 priorities (revenue growth, 4% EBITDA margin, positive OCF)"
  - "Clean unmodified audit opinion both standalone and consolidated, no going-concern, no fraud; contingent liabilities low; MSME payables clean"
  - "IPO proceeds fully and precisely deployed as per prospectus, independently monitored by ICRA"
red_flags_top3:
