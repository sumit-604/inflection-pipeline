analyst_note: "The quarter splits cleanly. Operations: consolidated core PBT ex-OI +26.4%, op margin 37.1%, rolling CFO/PAT 1.43x. But the margin gain is cost-led and management ties it to sales under-investment with a 33% guide, so it is not run-rate. Volume: enquiries -14%, active buyers at 40M, suppliers down a fourth straight quarter, and management throttles gross adds until silver churn improves. Condition #6 fires on every base reading (Q2 -14%; Q1 -11%, -16% or -7%). The only open question is the operator's liveness ruling, not the arithmetic. Management's login-gating explanation is new and undated, so I did not let it soften the test. Credibility scored with protocol categories (UNCLEAR excluded) gives 41.7%. A3's on-track count gives 0.56. Both map to Grade C. #4 is not called strike one because the print equals the threshold, not below it; the conservative reading is flagged. The SA headline +36% EBITDA leans on a filed 16 Cr impairment in the base; like-for-like +19.4%."
