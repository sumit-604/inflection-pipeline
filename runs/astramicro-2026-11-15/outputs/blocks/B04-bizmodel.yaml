one_line_verdict: "Government-customer defence electronics maker, 72.5% defence, mix-driven margins, high working capital, with a single HAL order now 47.7% of the book; fits the Defence / strategic cap row."
analyst_note: "Sector cap row fits: Defence 72.5%, Space 9.5%, Met 4.0%, Exports incl. deemed 14.0% of Rs 1,15,567 Lakhs (AR p.191); strategic buyers 96.0%. Three non-reconciling bases to carry: (1) deck IMD 18.0% and exports 11.9% (IP p.8) vs AR Hydro-Met 4.0% and exports 14.0%; (2) press release 'orders received Rs 2,036 Cr' vs deck waterfall 2,036 opening + 2,156 received - 256 executed = 3,937 (INFERENCE: PR figure is the opening book); (3) HAL Rs 1,878.8 Cr (deck) vs Rs 2,205.23 Cr incl. taxes (AR). Ex-HAL book Rs 2,058 Cr is below Rs 2,141 Cr (March), calc. FY27 Rs 1,350 Cr guide not in the documents; deck states 15-20% growth. H2 FY27 needs about Rs 913 Cr vs about Rs 746 Cr in H2 FY26 (calc). Concall (13 Nov) is the key missing source."
conflicts_settled:
  - "Q2 FY27 order inflow: SETTLED AT SOURCE by the orchestrator (FLAG-DISAGREEMENT rule). The Q1 FY27 results filing states the order book was Rs 2,156.44 crores as at June 30, 2026 (inputs/results/2026-08-10_Q1FY27_results_c4386b87.pdf, notes, text line 247). So Rs 2,156 Cr is the OPENING book of Q2 FY27 and Rs 2,036 Cr is orders received in Q2, as the press release prints (inputs/presentation/2026-11-12_Q2FY27_press_release_4b8f4126.pdf, 'Orders received during the quarter stood at Rs. 2,036 crores'). Stage 4's INFERENCE that the press release figure is the opening book is withdrawn; there is no conflict between the deck and the press release."
