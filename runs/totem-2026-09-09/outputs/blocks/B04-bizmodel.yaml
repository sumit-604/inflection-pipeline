mgmt_questions:
  - "What share of FY26 revenue came from automotive/auto-components versus other end markets, and how has that mix moved over three years?"
  - "What is current capacity utilisation by product line after the FY26 furnace and CNC additions?"
  - "What share of revenue is replacement reorder from existing qualified accounts versus new-customer/new-machine demand?"
  - "Why did operating margin fall from 18% to 16.39% despite stated price pass-through actions, and how many quarters is the lag?"
  - "Why did inventory rise 76.7% and CFO nearly halve in FY26: deliberate buffer or demand-forecasting miss?"
  - "What is the current TOTEM trademark registration status, and are there any disputes since the 2023 demerger?"
  - "Is the Promoters' pledge on their Forbes & Company Limited shares still in place, and what would trigger enforcement?"
one_line_verdict: "A legacy brand in a fragmented, import-cost-exposed niche, mid-squeeze on margin and working capital, with early Q1 FY27 recovery signs."
analyst_note: "No concall/presentation exists, so this decode leans heavily on the AR and the 2024 Information Memorandum. The IM's distributor count, sales-office count, engineer count and product-line market shares are 2024 management estimates, not re-confirmed in the FY26 AR; treat as directional, not current. Single-segment reporting means auto-sector revenue exposure, the single biggest named risk (EV transition), cannot be sized from filings at all. FY26's margin and working-capital deterioration both trace to the same root cause: a large, unhedged, partly-imported commodity input-cost spike that revenue growth and price action had not fully caught up with by year end; Q1 FY27's wider margin band (16.1-22.9%, established upstream) is the first sign of catch-up and is the single most important number to watch next."
