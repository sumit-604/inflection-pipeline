mgmt_questions:
  - "What specific DPD threshold triggers a loan write-off, and why does no numeric trigger appear in the AR despite qualitative write-off language?"
  - "What ceiling, if any, governs the parent's corporate guarantee to Si Creva's lenders as a % of the parent's own net worth, now at 228% and rising every year since FY24?"
  - "Why did Cost-to-Income worsen from 45.54% to 56.64% (FY24-26) even as AUM grew 73%, when the CEO letter states opex/AUM should fall with scale?"
  - "What is the company's actual lending yield and cost-of-funds split (an explicit NIM), given neither is disclosed as a standalone percentage anywhere in this container?"
  - "Why did repeat-customer AUM share fall from 73% (FY25) to 49% (FY26) in one year -- a strategic shift, or a retention weakness?"
  - "Which LAP ticket size and tenure is correct -- the AR's Rs 30 lakh/15yr, the Q1 FY27 deck's Rs 15 lakh/10yr, or CRISIL's Rs 20 lakh/10yr?"
  - "What is the FY27 credit-cost/GNPA glide path, given Q1 FY27 GNPA already rose sequentially against the 'further strengthen asset quality' guidance?"
one_line_verdict: "Fast-growing digital lender priced on AUM momentum; earnings quality still turns on an undisclosed write-off trigger and an over-stretched parent guarantee, not on a durable competitive moat."
analyst_note: >
  The listed parent (OnEMI) does not lend directly at all: on-book interest income
  sits entirely inside subsidiary Si Creva, and the parent's own income (sourcing
  fees plus an intercompany guarantee fee that eliminates on consolidation) is
  fee-based. This structural fact is the clearest lens on the B02/B03 guarantee
  flag: the listed entity's balance sheet exposure to Si Creva is a guarantee
  obligation (228% of parent net worth), not a loan book, so equity holders are
  geared to a contingent liability larger than the parent's own net worth. Moat
  is thin and concentrated in the underwriting-data stack; brand, switching cost,
  cost advantage and scale are each absent or actively weakening (repeat-customer
  AUM share fell 73% to 49% in one year). No standalone NIM/yield/cost-of-funds
  percentage is disclosed anywhere in this container -- downstream valuation
  stages should treat the DuPont-style Total-income/avg-AUM proxy as a mix-blended
  substitute, not a true lending spread.
