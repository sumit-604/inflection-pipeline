one_line_verdict: "Unbranded H-Acid spread converter; FY26 growth masks trading dilution, unhedged FX and promoter extraction."
analyst_note: "The single most load-bearing gap in this AR for the pipeline's own thesis question is the total absence of production volume or capacity utilisation disclosure against the stated 270-tonne capacity; every unit-economics field in Section 3D is NOT FOUND for this reason. This AR independently corroborates two of B02/B03's four load-bearing facts from the run brief: (1) Note 35.2 mislabels FY26 trading revenue as manufactured H-Acid, isolating organic manufactured growth at c.4.8% versus a 30.7% headline; (2) export revenue's jump from 0% to 46.4% of FY26 revenue directly contradicts Note 35.13's verbatim, twice-repeated claim of no major FX exposure and no hedging. A third AR-sourced finding not previously surfaced at this granularity: FY26 revenue grew 30.7% while EBITDA fell (Rs 1,147.66 lakh to Rs 980.64 lakh, MD&A p.77), meaning the incremental revenue carried negative incremental margin at the blended level, direct evidence against reading FY26 volume growth as value-accretive without first separating spread from trading-line dilution. These findings should anchor Section 1B/FTTCP's Amendment 17 converter treatment; FY26 must not be treated as a representative spot year for margin or ROCE."
