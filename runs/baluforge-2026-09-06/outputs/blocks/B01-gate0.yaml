analyst_note: "The classification tension is real, not a scoring artifact. Growth (20/20) and moat count (7, FORTRESS) are exceptional, but cash has not followed profit: cumulative CFO is 21% of cumulative PAT over 6 years, and FCF was negative in 4 of 6 years against a large capex program. The deal-breaker rule (cumulative CFO/PAT<0.50) correctly overrides the matrix-implied GOOD+ to AVERAGE. The freshest data point (FY2026, screener-only, no AR) shows this gap widening, not closing: cash conversion collapsed from 72.7% to 12.2% in the one year this pipeline cannot independently verify against an annual report. Downstream stages should treat FY2026 cash figures as provisional and re-check against the FY2026 AR once filed. Promoter holding decline is dilution from growth-capital raises, not an exit signal, though it scores 0 per rule."
