industry_cross_read:
  demand: "Split: Thyrocare pathology +20 to 27% and Krystal H1 FY27 +27.8% (lumpy, FY26 only +5.3%), but TCIEXP revenue +6 to 9% after two to three flat years and market growth cited at 10-11%; nobody shows 45% organic growth."
  pricing_inputs: "Weak pricing power in B2B diagnostics (Thyrocare revenue per test about INR 36, down about 2% YoY) and tender-priced manpower (Krystal EBITDA 6.25-7.5%); TCIEXP passes fuel through (85-90%) and nets 1.5-3% price, but labour cost took about 100 bps."
  capex_cycle: "Peers are expanding, not cautious: TCIEXP INR 100 Cr plus per year, Thyrocare INR 30 Cr in H1 FY27 with similar H2, Krystal INR 100 Cr planned for Citelum; Credent is the lone no-capex grower in an expanding peer set."
