analyst_note: >
  This stage's core discipline is refusing to size IEX off the rupee value
  of electricity traded. Revenue (Rs Cr) = Volume (BU) x Fee (paise/kWh)
  held exactly against FY26 actuals, which is the check that matters most.
  Two findings should travel to Stage 11 undiluted. First, the CERC
  transaction-fee review is a genuinely new, corpus-absent risk found only
  by web search: it threatens the FEE side of the equation independent of
  coupling's threat to the VOLUME side, and nothing in this run's corpus
  mentions it. Second, the honest fee-pool math produces a LIMITED runway
  on the core electricity business alone (2.9%-9.5% implied CAGR against a
  25% strategy hurdle and a 27.5x operating P/E); the bull case, if one
  exists, has to be built on the gas/coal/carbon option pools sized
  separately here, not on the core business re-accelerating past its own
  addressable pool's growth rate.
