analyst_note: "Three things a later stage cannot rebuild. One: the prospectus days ratios (debtor 83/89/74, inventory 62/44/43, creditor 48/51/44) reproduce on average balances (FY26 debtor 73.7, inventory 42.6, creditor 43.7; FY25 89.0, 44.2, 50.9). Applied on average balances, the FY27 inputs imply revenue Rs 130.4 Cr (debtors), Rs 124.8 Cr (inventory), Rs 126.8 Cr (creditors) and Rs 127.1 Cr (other current assets at 30 days): +18% to +23%. That is the only forward revenue evidence in the filings. It is derived, not stated; no revenue guidance exists. Two: LBF-4. The 26-Sep letter denies any impending announcement; the 27-Sep note promotes a third-party event, not a Kwick event. Reading A: harmless positioning. Reading B: narrative issued to cover a price move. Separator: a later Reg 30 filing that ties NFSU or MHA to a named Kwick order. Three: customers 128/124/95 with revenue 3.5x says the buyer base shrinks in count while it grows in size."
