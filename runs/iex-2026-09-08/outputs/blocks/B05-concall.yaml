    severity: NOT_A_GAP
    detail: >
      inputs/rating/ empty. IEX carries borrowings of Rs11.16cr (FY26 Data_Sheet)
      and told BSE on 13-Apr-2026 that it does not qualify as a Large Corporate,
      meaning it has no listed debt. No CRISIL, ICRA or CARE rating for IEX was
      found at intake. Unrateable by absence of rated debt, not by missed
      collection.
  - type: research
    severity: LOW
    detail: "inputs/research/ empty. Broker notes are NON-ANCHORED, leads only. No effect on anchored evidence."
  - type: regulatory_order_text
    severity: HIGH
    detail: >
      The CERC market coupling order, the APTEL judgment of 13-Feb-2026 and the
      two Supreme Court orders (11-May-2026 admission, 27-Jul-2026 stay refusal)
      are referenced throughout the concalls but their texts are absent from the
      corpus. This run additionally found the Coal Rules text (Ministry of Coal
      notification barring e-auction platforms from operating six months after
      the coal exchange launches) is ALSO absent from the corpus; management's
      repeated characterization of both the APTEL outcome and the Coal Rules
      is downgraded accordingly in this report. Both order/rule texts should be
      pulled before valuation weight is placed on either outcome.
  - type: screening_csv
    severity: MEDIUM
    detail: >
      screener-Profit_Loss.csv, screener-Balance_Sheet.csv, screener-Cash_Flow.csv
      and screener-Quarters.csv hold row labels and no values, for IEX and for all
      three peers. Only the Data_Sheet CSVs are populated.
  - type: sector_cap_row
    severity: MEDIUM
    detail: >
      The Section 1B cap table has NO Market Infrastructure or Exchange row.
      Manifest carries "Platform / SaaS / IT services" at 45x, FLAGGED. Live peer
      multiples 08-Sep-2026: MCX 55.3x, CDSL 62.1x, BSE 48.9x. Operator ruling
      wanted before stage 11.
  - type: prospectus_own
    severity: NOT_A_GAP
    detail: >
      IEX listed in 2017, outside the three-year window. inputs/prospectus/
      holds the IGX draft abridged prospectus instead.
  - type: image_only_pdfs
    severity: LOW
    detail: >
      inputs/announcements/SAST_Reg29_2_Disclosure_2026-04-21.pdf and
      inputs/announcements/SAST_Reg29_2_Disclosure_2026-06-10.pdf yield no
      extractable text. Scanned filings. OCR needed if a stage must read them.
