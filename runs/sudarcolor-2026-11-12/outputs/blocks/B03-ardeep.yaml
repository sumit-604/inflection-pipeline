one_line_verdict: "A debt-free, cash-rich captive of the promoter group whose FY26 profit fell on lower group offtake while cash conversion, payables and governance disclosure all weakened; watch for the group-payable ageing and a permanent CFO before treating it as a transition story."
analyst_note: "Third-party revenue was 589.23 vs 590.15, so the group fully explains the 44.43 revenue fall (43.51 from group sales). That separates two readings of FY26. Reading one: group offtake was a transfer decision and will reverse as USA SLO restocks. Reading two: ONE Sudarshan is moving volume to its own plants (Germany Horizons, Gujarat MFG, Langelsheim purchases rose) and the Indian entity becomes a lower-volume node. The observation that separates them is H1 FY27 group sales by entity and the group payable ageing. The FY25 audit qualification on Note 50 was dropped in FY26 with no number given. Pledge, capacity, utilisation and segment margin are NOT FOUND."
