analyst_note: "The call changes the quality of the H1 margin, not the filed numbers. Management says 11 Cr of US tariff refunds sit in profit to date, through cost of goods at a subsidiary, with 16 Cr more in Q3. Stripped, the two-year margin gain is +228 bps for H1 and about +139 bps for Q2, not about +300. The Q3 test now runs Q3 to Q3, because Q3 is the seasonal low: margin incl OI before the refund against Q3 FY26 18.95%; bull 22.7% (the H1 refund-stripped YoY gain carried), bear 18.95% (no gain). Q3 FY26 ex-OI was at most 18.95% and most likely under the 18% tripwire line, so Q3 FY27 is a live test. The 26.6 PAT-level consolidation deduction stays unexplained, no lean. TPU had not started commissioning and the duty was not imposed. The top three customers run about 50-60% on the call's 30% and about 57-68% on the filed 34%. Pricing is typically 80-85% of the leader, not parity. Only the sales director spoke. Every concall number is ASR."
