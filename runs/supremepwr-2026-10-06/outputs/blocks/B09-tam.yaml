analyst_note: "Three reads a later stage cannot rebuild. (1) SOM yr3 sits at +3.0pp share (low end of the aggressive tier), not the normal +1.5pp (SOM 332, CAGR 22.3%). Separator: Q2 FY27 call stating Kannur utilisation with basis at 30% or more, plus the CPRI 220 kV certificate. Stage 11 should treat 33.7% as the upper cross-check and 22.3% as the no-proof reading, and put the gap in position size. (2) SAM is a floor on filters, not a ceiling: Maharashtra and the 100-200 MVA slice are not sized. (3) SOM yr5 of Rs 588 Cr needs about 92% of Kannur potential; beyond that needs new land, which management has not bought. Management peak Rs 550-650 Cr is the capacity ceiling, not a market limit. Rs 6.1 lakh/MVA at peak vs Rs 10.9 lakh/MVA in FY26 (B04) means MVA multiples overstate revenue multiples."
