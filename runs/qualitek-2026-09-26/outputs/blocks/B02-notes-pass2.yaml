analyst_note: "The single most useful Pass 2 result is Note 33(d)(i)'s direct revenue-contribution figure for ITCPL (Rs 5,651.73 Lakh, 45.4% of consolidated revenue), which Pass 1 had only from the profit side (Note 34, 48.71% of consolidated net profit). Together with the annualised-stub inference (~19% ITCPL like-for-like growth) and the CWIP near-tripling, Pass 2 builds a coherent, notes-anchored growth-quality picture: FY26's headline consolidated growth is a mix of a real but modest organic ITCPL growth rate, a full consolidation-scope effect (partial FY25 year vs full FY26 year), and heavy ongoing capital deployment (CWIP) that has not yet earned a return, consistent with Pass 1's standalone ROE/ROCE decline. None of this overturns Pass 1's red flags; it sharpens the growth-quality dimension specifically."
