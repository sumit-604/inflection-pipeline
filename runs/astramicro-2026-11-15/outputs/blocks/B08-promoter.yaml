verdict_basis: "No SEBI order, ban, pledge, fraud finding or auditor exit against the company or its promoters; CAUTION because control is diffuse (promoters 6.54%), an interested non-independent director sits on the Audit Committee that clears the ARC related-party limit (35.7% institutional dissent), an open SEBI inquiry on FY24 results has no outcome, the MD exits with cash compensation, and insiders took 71% of a discounted warrant issue"
analyst_note: "Management-run company; read 'promoter' as three groups. (1) Chitrakar family 6.54%, passive, no pledge. (2) Ratnabali/Somani bloc 6.30% plus 40.2% of the warrants, with a board seat and Audit Committee seat. (3) Kabra, executive director, 3.12% equity plus 28.7% of the warrants. Biggest decisions for the operator: identity check of the Somani SEBI 2010 order (DIN or PAN), outcome of the SEBI FY24 results inquiry, and whether the 29 Dec 2026 warrant balance of Rs 130.50 Cr arrives. Warrants are 97% in the money at CMP Rs 1,704 (manifest), so lapse is unlikely. April 2026 Reg 30 said the outgoing MD stays as Executive Director; the AR says he leaves the Board. Resolve from the successor-MD filing."
