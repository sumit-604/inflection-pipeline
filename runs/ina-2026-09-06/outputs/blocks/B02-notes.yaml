going_concern_language: "NONE"
analyst_note: "The single largest finding is structural, not a line item: the listed parent (Rs 544cr total assets) guarantees Rs 1,654cr of subsidiary debt, 3.0x its own balance sheet, while nearly all growth, capex, and receivables risk sit in the subsidiary. Section 1B/valuation stages should price the CONSOLIDATED entity's earnings quality, not the parent's clean standalone book, since the guarantee structure makes the parent liable for subsidiary outcomes regardless of which entity books the revenue. The cash-inversion question (Lead 2) is genuinely unresolved from the notes alone; treat as an open item requiring the missing Notes 1-3 policy text and customer-level ageing, not a settled read either way."
