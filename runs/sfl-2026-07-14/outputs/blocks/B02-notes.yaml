  - "Unexplained prior-year reclassification of ~INR 73-100cr between Other Financial Liabilities and Trade Payables with no narrative"
  - "Unexplained INR 11.08cr goodwill reduction with no narrative"
  - "PPE useful lives extended well beyond Schedule II combined with WDV method, corroborated by D&A growth (0.4-10.9pct) far lagging revenue/capex growth (22-25pct)"
  - "Off-balance-sheet guarantees to subsidiaries (INR 293.01cr, 24.2pct of standalone net worth) growing 63.5pct YoY, entirely outside the Contingent Liabilities note"
questions_for_mgmt:
  - "What discount rate and long-term growth rate assumptions were used in the FY22 impairment testing of Goodwill (INR 251.99cr) and of the investment in Divya Software Solutions (INR 76.02cr against negative net assets of INR 11.31cr), and why was no impairment recognised?"
  - "What specifically was reclassified between Other Financial Liabilities and Trade Payables for the FY21 comparatives (~INR 73-100cr), and why does the note carry no narrative beyond 'Reclassification items'?"
  - "What drove the ~68pct collapse in aggregate subsidiary-level profit contribution in FY22 (IFT Spain -39.5pct, Joyce Foam Australia -24.4pct, Staqo World swinging to a loss), and has this pattern continued in subsequent years?"
  - "What incremental borrowing rate was used to discount Ind AS 116 lease liabilities, and what drove the near-doubling of the warranty charge and the 35-41pct YoY growth in advertisement expense?"
  - "Given guarantees for subsidiary borrowings (INR 293.01cr, 24.2pct of standalone net worth) sit entirely outside the Contingent Liabilities note, what is the Board's own assessment of aggregate off-balance-sheet exposure as Group borrowings continue to rise (+64.3pct YoY)?"
