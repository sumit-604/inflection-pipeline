analyst_note: "FY21 is an outlier base (tiny pre-IPO capital, 982,100 shares) that mechanically drives A4 to 0; treat the ROCE trend read with that caveat rather than as a genuine capital-efficiency deterioration signal alone. Block B is the dominant, evidenced depressor: CFO has been negative in 5 of 6 years through a HAM-asset build-out phase funded by debt and equity raises (large financing inflows FY22-FY25), while reported PAT rose steadily; this is a real cash-conversion gap, not a data artifact. Block E's 0/20 is purely an evidence gap (no shareholding corpus), and should be re-scored once that data lands rather than read as a governance flag. Five of twelve moat tests scored 0 solely for missing peer data; the MODERATE moat read is unconfirmed, not negative. Classification AVOID rests on Core <40, which is driven almost entirely by Blocks B and E; Blocks A and C independently show a strong growth and returns profile."
