analyst_note: >
  The three red flags (guarantee-to-net-worth, write-off-masked asset quality, FLDG cost escalation) are
  not independent: the guarantee funds the subsidiary's borrowing that funds the loan book whose true
  asset quality the write-off rate obscures, and FLDG cost is the price of the off-book share of that same
  book. Pass 3's test shows guarantee growth is steady while ECL swings independently of it -- so the
  provisioning volatility is not simply "faster growth needs bigger provisions then releases them back";
  it looks like a separate, undisclosed judgment layer. Two structural findings (guarantee-to-net-worth,
  profit-allocation skew) read as normal holding-company-over-NBFC economics on their own; what tips
  them from benign to concerning is the guarantee's size relative to the parent's actual capacity to honour
  it, not the existence of the structure itself. Symmetric bull/bear readings for both are in the full report
  section "A SYMMETRIC READING OF THE TWO STRUCTURAL FINDINGS."
