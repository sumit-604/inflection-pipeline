industry_cross_read:
  demand: "Broadly soft FY26 across peers (Sula, SDBL), each citing rotating state-level regulatory/weather disruption similar to Fratelli's own pattern; Sula confirms the wine category itself grew low-single-digit or less over the last 2 years; TI's strong growth is M&A-driven, not category tailwind."
  pricing_inputs: "Convergent, sector-wide input cost inflation late in the period (packaging/glass/barley, tied to geopolitical/West Asia conflict) reported independently by all three peers, complicating any 'stable cost environment' framing; grape costs specifically spiked hard for Sula on the same belt Fratelli sources from."
  capex_cycle: "Mixed, mapped to sub-segment maturity, not industry-wide: wine (Sula) and branded IMFL (TI) are past-peak-organic-capex/redirecting-to-adjacency; beer (SDBL) is a genuine multi-year capacity race (~Rs570cr UP brewery, 3-4 years to peak utilisation, explicitly benchmarked against a competing UBL project). Fratelli's 'behind us' claim sits closest to the Sula/TI pattern, with the caveat that Sula's own version of that claim coincides with a large new hospitality capex commitment."
