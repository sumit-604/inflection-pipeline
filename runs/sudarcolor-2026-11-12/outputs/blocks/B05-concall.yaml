analyst_note: "No transcripts, so Section 2E, analyst Q&A and tone are NOT FOUND. The AR gives direction, never a number; the grade rests on 11 guidance-vs-results rows. The one live promise, return to growth, is met at H1 FY27 (+25.0%), with Q2 FY27 +47.3%. Two readings: (1) real demand recovery and group restocking; (2) group re-routing volume or channel build. Q2 FY27 materials consumed rose 113% against revenue +47% while stock-in-trade purchases fell 16%, which fits a shift from traded goods to own manufacture [INFERENCE]. The observation that separates them: H1 FY27 group vs third-party sales in the Reg 23 filing, and whether inventory 255.22 and receivables 244.95 unwind in H2. Rs 411 internal transfer is a promoter-to-promoter move, no minority signal."
