analyst_note: "No RED item. The notes are a thin but mostly consistent set; errors cluster in ratios (Note 48), consolidated presentation and numbering, not in core policies. Three items matter for the thesis. (1) The margin move cannot be decomposed from the notes; the IGCL margin moved the same way, which supports an industry effect. (2) The IGCL stake is carried at a 1,378 lakh premium to its share of net worth with no test. (3) Pioneer Jellice flows are 7% of revenue with no pricing evidence. The Note 39B 'TCI' decode and the 45.27 receivables-gap lead are inferences, not facts. Score 7 reflects clean policies against weak disclosure and token ECL."
