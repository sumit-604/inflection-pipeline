    - "Residual income / EVA (return ratios still low and only recently improving, Note 49)"
irrelevant_ratios:
  - {ratio: "Blended company ROCE/ROE as a single number", why: "Blends a ~12% margin Pharma segment with a ~2-3% margin Chemicals converter segment (Note 39); segment-level capital employed not disclosed"}
  - {ratio: "Trailing 3-5yr revenue CAGR taken alone", why: "FY22-FY25 stall then FY26 break; a straight CAGR masks the inflection and violates the basis-hierarchy rule against anchoring to audited history alone"}
  - {ratio: "Standalone net profit margin vs peers, unnormalised", why: "Structurally driven by segment mix (chemicals-heavy peers print far lower margin than formulations-forward peers)"}
  - {ratio: "Debt-to-equity (0.08x) as a funding-risk comfort signal", why: "Reads safe but zero term debt sits against a Rs 495 Cr+ Rs 1,200-1,400 Cr capex programme called internally funded on FY26 FCF of only Rs 43 Cr"}
  - {ratio: "Current ratio alone", why: "Can be inflated by receivables growth rather than cash; must be read against the rising debtor-days trend"}
must_track_metrics:
