verdict_basis: "No deal-breaker fires (clean SEBI/criminal/pledge/auditor record at the company level), but related-party structure runs deep and this stage adds two confirmed new facts: a Promoter-directed entity (G7 Universal LLC) earns a commission stream from the listed company, and the previously unnamed buyer of the 51% FABL stake is confirmed as a promoter-group company (FTIPL) — both sharpen, not resolve, B02/B03's LBF3 related-party concern."
analyst_note: "Two structural findings for downstream stages to weigh together: (1) the company's largest single economic owner, Aasif Ahsan Khan, holds no board seat at FABTECH and chairs the related-party trading counterparty (Cleanrooms Ltd) instead — an unusual separation of economic control from fiduciary duty at this specific listed entity; (2) the promoter group's related-party web (G7 Universal LLC commission, FTIPL as FABL buyer, cross-collateralised guarantees, narrowing-but-persistent cross-board seats) is now confirmed rather than merely suspected. Neither rises to a deal-breaker, but both belong in the synthesis verdict line alongside B02/B03's LBF3 finding, not as a separate footnote. Transition evidence (credentialed ID rotation, first dividend, stable CEO/CFO, narrowing board overlap) is genuine and should let synthesis distinguish this CAUTION from a static one."
