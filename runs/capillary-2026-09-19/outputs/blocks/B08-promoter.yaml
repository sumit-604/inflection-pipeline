verdict_basis: "Legal/regulatory record for both promoters is genuinely clean (nil SEBI/criminal/tax across the board) and direct promoter-entity RPT shows no extraction pattern; verdict held at CAUTION rather than TRUSTWORTHY because five independent caution-tier items surfaced inside the company's first listed fiscal year (institutional ESOP-vote revolt, disclosed CTIPL PE overhang, finance-SMP turnover coinciding with the fraud/forensic-audit window, unresolved chairperson committee-count question, and an unrelated-sector promoter-group entity under a separate liquor-policy probe), none individually rising to CONCERN but the accumulation and timing warranting active tracking."
analyst_note: "The two most decision-relevant items for FTTCP/Role-1 stages are not the promoter's personal record (clean) but structural: (1) CTIPL's >30% remaining PE ownership is a disclosed, pre-announced future float/control event that sits outside standard promoter-pledge monitoring and should be tracked at the CTIPL cap-table level, not just the company's own shareholding pattern; (2) the finance-SMP turnover timing versus the cyber-fraud/forensic-audit window has no established causal link in any source found, but is exactly the kind of coincidence that should be a direct management query at the next review rather than either dismissed or assumed adverse."
