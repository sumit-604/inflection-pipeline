analyst_note: >
  The single most decision-relevant fact this stage could not pin down with a primary
  source is whether the ~Rs208 Cr DoIT arbitration claim against Amit Ramani personally
  is actually closed. A search-engine synthesis of a casemine.com judgment says it was
  withdrawn by the claimant, but the primary document returned HTTP 403 on direct fetch,
  and Awfis itself has never disclosed the withdrawal (or the claim's continuation) in
  any filing since the Prospectus. This is a strong candidate for a live-web verification
  request to claude.ai at Halt 1: confirm the current status of (a) the DoIT arbitration,
  (b) the Enhance Lifestyle criminal complaint, and (c) the two PMLA Section 8(2)
  applications. Separately, Awfis Transform now operates the identical design-and-build
  business line that sat inside Ncube -- a thematic echo worth naming to the operator
  even though no direct entity linkage between Ncube and ATPL is evidenced.
