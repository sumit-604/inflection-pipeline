analyst_note: "Two things a downstream stage cannot reconstruct from the fields alone. First, the corrected FX-adjusted TAM (Rs 5,040-6,660 Cr) is roughly 10x the size a naive first-pass currency conversion would suggest, and two independent methods (top-down sum-of-parts and peer aggregation) landed in the same order of magnitude, which is the main reason confidence is Medium rather than Low despite noisy peptone/ox-bile source data. Second, the SOM-implied 18.9-19.7% CAGR is a mechanical output of conservative-per-line assumptions (blended 9.0% market growth plus only the 'normal' 1-2pp share-gain case); it is NOT an endorsement that Titan will achieve it, given EM NONE, falling capex, and peer-wide demand deceleration. Stage 11 should treat this handoff number and the Amendment 14 fade-guard conflict as linked open items for the same operator ruling."
