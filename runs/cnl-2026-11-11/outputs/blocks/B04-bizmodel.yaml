one_line_verdict: "Hybrid distributor (85.9% of sales at 3.76% gross margin) shifting to a licensed brand (14.1% of sales at 33.16%) with weak pricing power, a narrow licence-and-channel moat, no visible operating leverage, receivable-funded growth and half of profit offshore at nil tax; value on cash-checked P/E with EV/EBITDA as the check."
analyst_note: "Corrections to memory: segment note shows brand gross margin 33.16%, not 40-42%; brand 14.11% of FY26 and 19.03% of Q2 FY27 revenue. New this stage (derived): (1) no operating leverage: FY26 unallocated cost +44.5% vs gross profit +43.7%; H1 FY27 opex +57.6% vs gross +56.7%, so the EBITDA margin gain is gross margin; mix explains about 1.8 of the 3.4-point Q2 gain at FY26 segment margins. (2) H1 FY27 standalone-to-consolidated PAT gap 17.81 of 39.47 Cr (45.1%), tax identical 7.35 Cr. (3) TReDS borrowings of Rs 171.19 Cr (Q4 deck slide 14) explain part of the debt rise, softening the leverage read but not the working-capital build. (4) BSNL order components sum to Rs 2,900 Cr vs 3,194.83 Cr headline; the deck's FY26 CFO is 271.88 on slide 7 and 273.10 on slide 8. (5) Deck slide numbers differ from memory's citations."
