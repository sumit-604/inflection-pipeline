analyst_note: "The quarter's strength is orders and cash, not operating profit. Ex-FS operating profit fell 2.4% YoY on 16% revenue growth. PBT growth came 72% from other income (incl an unquantified one-time SWC gain) and 22% from lower finance cost tied to the Hyderabad Metro perimeter change. The record 1.7% NWC and 57.3% PP&M RoFE most likely rest on customer advances from Middle East mega orders (ME = 51% of Q2 inflow, 40% of order book). Advances unwind as jobs execute, so Q3-Q4 NWC is the observation that separates a structural gain from timing. Segment EBITDA is not on the P&L basis: its gap to reported EBITDA nearly doubled YoY, so PP&M 7.0% is not a clean core margin until management states what is allocated. P-19 is probably an A1 transcription swap: the EC/EG domestic-international split reproduces the deck's own 58% international revenue share only when swapped. Re-render PDF pages 17-18 before any downstream use. No FY27 guidance appears anywhere in the deck; check the concall before scoring that as silence."
