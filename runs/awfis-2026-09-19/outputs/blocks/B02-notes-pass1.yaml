receivables_trend_preliminary: >
  Comparability is broken by the Design & Build carve-out (Rs937.14mn receivables + Rs733.42mn contract
  assets moved to held-for-sale in FY26, Note 40), so the headline fall in gross trade receivables
  (Rs1,277.20mn to Rs510.99mn) is not a like-for-like collections signal. Within the continuing-ops
  book, the ageing mix improved: receivables overdue >6 months fell from ~27.1% of gross (Rs345.91mn /
  Rs1,277.20mn FY25) to ~21.1% (Rs107.56mn / Rs510.99mn FY26), but this partly reflects the smaller,
  post-carve-out base rather than pure collections improvement. ECL allowance fell from Rs69.24mn to
  Rs60.08mn (roll-forward: provision made Rs57.44mn, reclassified to held-for-sale Rs(66.60)mn). Zero
  disputed receivables either year. Trade receivables turnover 12.26x FY25 to 11.45x FY26 (-6.6%,
  company's own Note 41 ratio, below the 25% explanation threshold). Related-party (Awliv) receivable
  grew 259.9% (Rs3.49mn to Rs12.56mn) on a small base. Net read: broadly stable to modestly improving
  on ageing mix, with the YoY comparison structurally distorted by discontinued operations.
going_concern_language: >
  PRESENT in both standalone (Note 2, PDF p.92) and consolidated (Note 2, PDF p.133-134) Basis of
  Preparation notes - management's own paragraph, not an auditor qualification. Cites net current
  liability position: standalone Rs3,388.14mn at 31-Mar-2026 (Rs2,140.98mn FY25, +58.3%); consolidated
  Rs3,127.70mn (Rs2,110.86mn FY25, +48.2%). Current ratio 0.68x (Note 41), down from 0.71x. Management
  concludes going-concern basis is appropriate citing planned fund-raising, operating cash generation,
  and working-capital optimisation. The Independent Auditor's Report carries NO Material Uncertainty
  Related to Going Concern paragraph and NO Emphasis of Matter paragraph in either the standalone or
  consolidated opinion - both are unmodified/unqualified.
restatements_found_preliminary:
  - "Note 48 (standalone) and its consolidated equivalent: standard 'previous year figures regrouped/reclassified... not material' boilerplate, no items named"
