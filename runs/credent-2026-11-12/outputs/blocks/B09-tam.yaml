analyst_note: "Central SAM rests on one unevidenced filter: the 10% serviceable share, taken from management's own gap between 10,000 Cr (20% x 50,000) and 1,000 Cr. Two readings: outsourced vendors win about 10% of chain pre-analytics spend (SAM 434 Cr, Credent already 46% share), or 20% (SAM 869 Cr, share 23%, CAGR 18.7%). The observation that separates them: the share of a chain's collection and logistics cost that is bought from third-party vendors, in a chain annual report note or a Credent customer disclosure. The 14.5% cost ratio comes from Dr Lal collection-centre fees (402 vs revenue 2,763 Cr FY26), which are franchise fees and unverified. Management's 1,000 Cr is a target labelled TAM, so the 0.36 ratio reads conservative by the standard scale but not as honest. Stage 11 should treat 15% (to 19% on the 20% filter) as the SOM cross-check against the 45% guide; the 45% needs SAM to reach about 950 Cr by FY30."
