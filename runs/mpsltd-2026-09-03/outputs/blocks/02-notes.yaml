analyst_note: "The single most important refinement this run makes is downgrading the Liberate Group write-back from an 'unreconcilable' red flag (Pass 2) to a reconciled-but-imprecisely-labeled one (Pass 3): 1,324.79 + 247.89 = 1,572.68 exactly. The residual issue is drafting quality (a mislabeled combined figure and a wrong cross-reference), not a numerical break, and downstream stages should weigh it as a disclosure-quality flag rather than treating it as unverifiable. Separately, Ranks 2, 3 and 5 compound into one structural story: the ADI BPO Group's aggregate M&A financing and integration this year (Unbound Medicine, AJE, Liberate) simultaneously inflated standalone revenue optics, weakened liquidity ratios, and stressed subsidiary-level credit provisioning. FTTCP and Role 1 valuation should treat consolidated, not standalone, figures as the primary earnings basis given the recharge distortion documented at Rank 2."
