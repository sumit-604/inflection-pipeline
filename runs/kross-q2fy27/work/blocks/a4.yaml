analyst_note: "Loop 1 rewrite closes A5-F1 to F7; loop 2 splits the 30-May-2027 forward-map row into separate tests (C1). Pre-thesis read; Decision Status NOT SET, so 8A-W. Growth is real YoY (revenue +79.6%, core PBT +129.9%), but the base is a trough: half-on-half, revenue is +4.1% and core PBT -12.1% vs H2 FY26. Margin gain is cost absorption while gross margin fell 232 bps; about 81% of the QoQ rise came from the trailer half and from the top 5. H1 CFO/PAT 14.3%; capex debt-funded and +7.0% once other non-current assets are included. Trigger 1 does not fire on either margin basis; like-for-like receivable days are flat at about 90. 6A carries two readings: reported PAT and EPS at Base; ex the 1.44 Cr unexplained OI, PAT falls between Bear and Base. The Q4 answer separates them. 8C gross-margin thresholds are read against FY22-FY26 (40.7-46.1%). HPML line identity (PPT-FN-18) is unresolved; Q13 asks. Dilution: share count +4.65%, EPS -4.44%. Concall pending Role 5 addendum."
