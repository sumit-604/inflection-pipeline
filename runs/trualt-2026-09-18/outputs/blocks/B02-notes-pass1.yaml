receivables_trend: "deteriorating in near-term composition: 'not due' share of trade
  receivables fell from 69.1% (FY25) to 34.7% (FY26) of the book while '<6 months
  overdue' rose from 20.2% to 57.6%; however the long tail (>6 months) IMPROVED slightly
  (10.6% -> 7.7% of total) and receivables turnover fell 21% (5.68x -> 4.51x). Customer
  base is predominantly public-sector OMCs with historically low credit risk. Net:
  a genuine but moderate deterioration in payment-cycle timing, not yet a severe
  ageing problem. (standalone Note 12, Note 52)"
