verdict_basis: "A repeated, internally-contradicted GDAL ownership misstatement plus three years of undisclosed minority investors and a newly surfacing promoter-family private vehicle (Goodluck Green Energy) being injected into the listco outweigh a clean legal/auditor/pledge record and genuine pay-cut/capital-infusion transition evidence, yielding CONCERN with strong transition evidence rather than a static CONCERN."
analyst_note: "Status is complete, not partial: no searches were skipped, only two sub-items (employee reviews, proxy-advisory coverage) came back inconclusive after genuine attempts. The single highest-priority live monitorable for Halt 1 and beyond is Goodluck Green Energy Ltd's amalgamation terms, since that entity is confirmed promoter-family-founded (Rishabh Garg, Rajat Garg) and undisclosed in any AR to date. The GDAL non-promoter investor identity (LBF2) remains genuinely unresolved after an exhausted search; downstream stages should not assume it is a passive financial investor versus a promoter-linked party, since the FY26 AR's own SOCE shows the Aug-2026 raise fell after the balance-sheet date and so was never tested against AR disclosure. The 29-Jun-2026 sale's family-concentration pattern (COO-led, non-Chairman) is a genuine [INFERENCE]-tier timing observation, not a proven pre-announcement trade; no evidence of price manipulation or insider dealing was found."
