credibility_grade: "C"
credibility_basis: "Three quarters (Q3 FY26 to Q1 FY27): 4 delivered, 4 partial, 3 missed. Revenue guides land at or under the floor (FY26 181.64 vs 180-200, Q4 70.72 vs 70-80, Q1 FY27 48.23 vs 50-60); the Q4 new-plant sub-guide missed by 10-15 Cr; the FY27 guide was cut twice; the PAT band held. Upgrade to B needs Q2 FY27 inside guidance and Kannur utilisation disclosed with basis at or above 30%."
