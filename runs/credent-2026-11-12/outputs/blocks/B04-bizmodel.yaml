  secondary: {method: "EV/EBITDA with CFO/EBITDA test", why: "Cross-check; EBITDA ignores the float cost that is this model's main drain"}
  tertiary: {method: "SOTP by line", why: "Lines have different economics but segment margins are NOT FOUND"}
