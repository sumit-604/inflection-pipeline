red_flags:
  - "Working Capital Loan draws classified as operating cash flow rather than financing activity, structurally inflating reported CFO in high-growth periods (Cash Flow Statement p.244/raw 249)"
  - "No ECL allowance quantified despite stated always-recognise-lifetime-ECL policy, alongside a deteriorating receivable-days trend (Note 10, Note 2.14)"
  - "No warranty provision carried despite warranty being a stated core value proposition (Note 2.12)"
  - "Undisclosed customer representing 17.28% of FY24 revenue, identity not stated anywhere (Note 38/39, Pass 2 correction)"
  - "Related-party entanglement spanning trading, lending, prepayment and lender-security roles across Kay Kay Overseas Corporation, Amiable Electronics Private Limited, Amit Midha, and Electronics Bazar Inc (USA), with no arm's-length pricing evidence (Note 38, Note 19.1, Note 13, Note 16.2)"
  - "Two independent note-drafting arithmetic errors: Note 45 static equity reconciliation and Note 36 negative lease-liability closing balance"
  - "Majority of group PAT (~78% FY24) generated by a subsidiary not audited by the principal Indian statutory auditor (Note 48, Auditor's Examination Report)"
  - "Description-only FX hedging policy with zero quantified hedge disclosure against the largest disclosed risk category (Note 43)"
questions_for_mgmt:
