one_line_thesis: "Buying Indegene at Rs 545 because large outcome-based pharma deals plus a contractual amortization step-down carry EPS from Rs 20.22 (FY27) to Rs 36.62 (FY30), giving a Rs 1,154 base target at a 31.5x forward destination PE = 28.4% base CAGR (27.4% probability-weighted); key risk is that the margin recovery is the single load-bearing forward call with no documented action; thesis breaks if organic growth prints at/below 12% for two consecutive quarters or margin fails to expand sequentially from Q2 FY27."
