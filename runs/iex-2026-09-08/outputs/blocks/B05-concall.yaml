credibility_grade: "D"
credibility_basis: >
  Revised down from run 2's C. Volume guidance and dividend policy delivered
  consistently, and the CFO's other-income recovery promise is independently
  verified delivered this run. Against that, the segment-by-segment
  differencing procedure surfaced a materially worse qualitative pattern than
  run 2 found: the REC decline explanation names the wrong side of the
  market, directly contradicted by the company's own filed seller-side data
  (sell bids -86.1% YoY, clearing prices rising) available three weeks before
  the excuse was repeated; market-share disclosure precision degrades every
  quarter in lockstep with the coupling threat becoming more concrete, with
  no acknowledgment; day-ahead volume, the exact segment coupling threatens,
  was in outright decline for two of the three most recent months and was
  never named as its own risk; the price-war/fee-competition question has
  been evaded twice across two quarters, the second time by simply not
  answering the pricing half of the question; a confident prediction
  ("things will definitely go in our favour" on APTEL) was falsified within
  fourteen days, credited only on its timing half in the record before this
  run; and two different revenue figures for the same two periods appear
  side by side inside one presentation. This is not fraud and the raw
  promise/delivery ratio (4/2/4) is not dramatically worse than run 2's
  (3/2/5), but the pattern of disclosure precision falling exactly where
  risk is rising, an excuse that inverts supply and demand on the company's
  own numbers, and a repeated refusal to answer the one pricing question
  central to the thesis is a POOR record on the promise-delivery evidence.
