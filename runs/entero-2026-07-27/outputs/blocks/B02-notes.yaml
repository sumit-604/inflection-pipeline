analyst_note: "The pattern pass's key addition: Note 54 shows ~15 of ~65 subsidiaries with negative net worth or a loss, but the Consolidated Auditor's Report CARO Annexure (outside Notes scope, cross-checked for corroboration) lists 40 subsidiaries carrying an adverse or qualified CARO clause, overwhelmingly Clause xvii (cash losses) and Clause ii(b) (bank stock-statement discrepancies). Subsidiary-level distress is roughly 2.5x what the Notes alone show. Audit opinion unmodified, no going-concern. FTTCP must isolate organic same-store distributor economics from acquired-entity drag before pricing entry; consolidated PAT growth of 21.3% is generated despite, not because of, a minority of the acquired base still running cash losses years after purchase."
