analyst_note: "The single largest correction this pass makes to Pass 1 is on capex trajectory: Pass 1 read the capex programme as substantially complete from the standalone Note 56 collapse (-96.4%); the consolidated Note 56 figure, read together with Note 59's Sumitomo JV mechanics (5-site CBG buildout, 3 sites under construction), shows a large new capital programme ramping up inside TGPL that the standalone-only figures hide entirely. Second, the net-debt and gearing-ratio finding (Note 53) converts Pass 1's CFO-burn observation into a harder claim: this was not just a year of heavy working-capital consumption, it was a year in which absolute indebtedness grew despite a fresh equity raise, an outcome an equity-story built on 'IPO delevers the balance sheet' would not predict. Third, the government-scheme dependency finding (Note 27/28) is arguably the most consequential single number in this pass: on a standalone basis, without interest subvention and PLI, FY26 pre-tax profit would fall by roughly three-quarters, from a policy-contingent, time-bound source. All three should be treated as at least as load-bearing as Pass 1's DSCR and RPT findings for stage 11 valuation inputs."
