analyst_note: "The margin finding under Q3 is the priority item for stage 13: two direct listed peers post materially higher blended margins than Aequs' 20-27% band, which cuts against management's own 'scale is our differentiator' answer to the same analyst pushback (stage 5, 3C), even though true segment-isolated comparability is imperfect. DYNAMATECH's single stale, narrative-only transcript limits Q9 and Q4 confidence; treat its anchors as directional colour, not quantified confirmation. The Part 5 qualification-cycle-timing hypothesis suggests utilization/certification-completion tracking is a better near-term earnings predictor for this whole peer cohort, including Aequs, than order-book growth alone — worth carrying into stage 11/13 as a monitoring framework rather than a valuation input."
