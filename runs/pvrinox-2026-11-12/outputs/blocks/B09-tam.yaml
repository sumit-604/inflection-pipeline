analyst_note: "Central SOM holds PVR share flat at 38.4% of SAM, so SOM growth equals SAM growth: FY27 10.2% (H1 +22% actual, H2 held flat to FY26, arithmetic not forecast) then 4.9% a year. Reading B: 8.0% (CY22-25 rebound base) lifts yr3/yr5 to 8.7/8.4 at flat share. Share-gain reading (+3pp yr3, +5pp yr5, needs the 150-175 screens a year) gives 9.3/8.6 at 4.9% and 11.5/11.1 at 8.0%. Separating observation: PVR Q3 FY27 ticket growth vs industry, and FY27 gross openings at or above 90. H1 FY27 shows share slip of about 1.8pp (derived), so flat share is not shaded down. SOM is four-stream revenue (95.1% of company revenue). EBITDA-level growth at margin 14.4% to 17.5%: 13.8% central, 16.7% share-gain reading; PAT growth and P/E NOT FOUND."
