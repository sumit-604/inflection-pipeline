analyst_note: >
  Three structural facts shape every downstream stage. First, the company holds
  no earnings calls and publishes no investor presentation, so management intent
  is only visible in the Board's Report and the MD&A: NO-CONCALL MODE is the
  run's normal state, not a one-off degradation. Second, the operating history is
  three years long because the demerger took effect 01-Mar-2024; the Information
  Memorandum restated statements are the only route to a longer backward
  baseline. Third, the single most decision-relevant filing in the corpus, the
  Q1 FY27 result carrying the margin bridge, is a scanned image readable only
  from the rendered PNGs.
