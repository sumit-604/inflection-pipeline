verdict_basis: "Two unresolved red items -- an unexplained ~0.78-1.20 lakh share reduction
  in the sole promoter's holding with no matching sale/gift/pledge disclosure anywhere
  searched, and a related-party network carrying a DRHP-disclosed competing-business risk
  plus a new receivable-heavy RPT counterparty with a possible unconfirmed link to a new
  promoter-group shareholder -- outweigh an otherwise clean legal record and clean audit,
  yielding CONCERN."
analyst_note: "The FY25 AR is internally strong on process (clean audit, no ID exits, RPTs
  routed through Audit Committee) but two items sit outside what the AR itself can resolve:
  the share-count gap and the Tushar Patel/Tushar Transequipment name overlap. Both need a
  primary-source pass (BSE/NSE SHP and SAST filings, MCA director-history search) that this
  session's egress-blocked tools could not complete. Treat scorecard items 3 and 4 as
  provisional pending that pass, not as settled findings. The Atlas Transformers PAT
  exceeding turnover figure in the AR's own RPT explanatory statement (Rs 177.11 Cr PAT on
  Rs 138.48 Cr turnover) is almost certainly a drafting error but was not correctable from
  available sources."
