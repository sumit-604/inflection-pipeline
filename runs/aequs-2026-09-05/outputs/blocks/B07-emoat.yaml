combined_reasoning: >
  Gate 0 AVOID (34/140, driven by cash conversion and returns, not the
  aerospace story) paired with Emerging Moat STRENGTHENING (35/92) is one
  notch below the operation's ideal AVERAGE-backward/EXPANSION-forward setup
  on both axes, but the same transition shape: a real, already-profitable
  Aerospace franchise sitting alongside a still-loss-making Consumer segment
  and a negative-CFO balance sheet that IPO proceeds, not operations, currently
  fund.
top_moat_risks:
