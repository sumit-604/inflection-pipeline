flags:
  - type: FLAG-BIZMODEL-ARCHETYPE-SPLIT
    reason: "Pitti is not a single archetype. Loose laminations and raw castings behave as a COMMODITY CONVERTER (Section 1B v3.7 Amendment 17 must bind this slice); value-added assemblies and machined components behave as BUILD-TO-SPEC. No document discloses the rupee split between the two; the physical-volume mix is shifting toward the build-to-spec tier (value-added volumes +21.8% to +37.1% vs loose-lamination volume growth materially slower), but stage 11/FTTCP must not apply Amendment 17 treatment to the whole company."
  - type: FLAG-CAPEX-DATE-CONFLICT
    reason: "The Rs 290 Cr castings/machined-components capex programme's commissioning date differs by roughly one year between the two primary sources this run reads: Q1FY29 (Inv. Pres. Q1FY27, slide 11) vs Q1 2029-30 / Q1FY30 (AR FY26, PDF p.14). Neither document reconciles this; carry as a direct management question (4D #1)."
  - type: FLAG-LBF3-DISCONFIRMED
    reason: "Company memory load-bearing fact #3 ('railway/traction ~40% of revenue via Wabtec and Alstom') is not supported by either primary source. AR states Traction Motor and Railway Components = 33% of FY26 revenue (PDF p.8); Alstom is never named in either document; Wabtec appears only as a 2017 Rs 500 Cr deal reference (Inv. Pres. slide 11) and 2019/2022 supplier awards (AR PDF p.19), never tied to a current revenue percentage. Consistent with Gate 0 and B03's independent findings."
