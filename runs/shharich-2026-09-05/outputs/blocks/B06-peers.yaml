industry_cross_read:
  demand: "Two-phase: organic, volume-led demand recovery through roughly mid-2025, followed by a geopolitical raw-material cost shock (West Asia conflict) from Feb-Mar 2026 that suppresses volume and pushes prices, not demand-pull growth"
  pricing_inputs: "H-Acid/Vinyl Sulphone/K-Acid prices rose ~40-45% Feb-Aug 2026 on a 2x-4x sulphur/ammonia cost spike, with a documented lag between input-cost rise and finished-good price catch-up; matches the shape of SHHARICH's margin-pressure narrative but not necessarily its full-year timing"
  capex_cycle: "Not an industry-wide capacity race; a company-specific split. SHREEPUSHK is the aggressive, self-funded, promoter-backed expander (three capex rounds, near-zero net debt); BODALCHEM is deleveraging and explicitly ruling out major capex for 4-6 quarters after its own leveraged benzene-derivatives project underdelivered. SHHARICH's promoter-warrant-funded, low-leverage structure sits closer to the SHREEPUSHK pattern."
