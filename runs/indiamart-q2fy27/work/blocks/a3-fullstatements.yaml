analyst_note: "Three points change A4's read. (1) Treasury now carries equity beta. Equity factor index funds rose from 3,317 to 4,681 (15.6% of the 30,087 book) while arbitrage funds fell from 2,995 to 891. The Q2 treasury loss of 110.71 fits that [INFERENCE]. The note still puts realised, MTM and coupon in one line, so checklist #9 cannot separate them. (2) The 822 deployment is two Q2 payments: Fleetx 649.88 (stake 22.25% to 25.80%) and a 172.47 secondary purchase of Agillos shares, paid by a subsidiary. Simply Vyapar and Fleetx carry 69.5% of H1 associate losses, so the larger Fleetx stake adds drag. (3) MonotaRO was not sold. The stake was re-measured to 586.33 (49.7% of cost), and the 71.49/200 loss sits in Q1 other income. Level 3 investees (4,029) are not re-marked at interims, so negative marks can surface only at Q4. The full-statement report says all eight associates are unaudited (F14-03 resolved) but calls them not material at 16.9% of Q2 PAT. IndiaMart Finance holds 120.50 of equity, has a stated working-capital-finance purpose, and has no registration date. Incidental: a 242.99 Busy tax demand moved to recovery in September 2026."
loop_1_note: "Loop 1 settles that the listed company did not pay Agillos: Agillos is not a standalone associate, and the standalone strategic book moves exactly by cash 1,020.35 + deemed 7.71 - MonotaRO 200.00. The paying subsidiary is unnamed (Tradezeal inferred). Livekeeping got 59.97 in Q1 at an unchanged price while carrying a 52.61 standalone impairment; goodwill 420.38 is unimpaired. Whether thesis-broken #11 has fired turns on its wording, which is absent from the A3 checklist input (L1-08). A full Livekeeping goodwill write-off cannot reach the #9 Rs 100 Cr line."
