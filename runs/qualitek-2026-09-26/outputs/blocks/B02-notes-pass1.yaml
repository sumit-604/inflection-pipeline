receivables_trend: "MIXED: consolidated total trade receivables +46.0% YoY (Rs 2,885.75 Lakh to Rs 4,214.04 Lakh) vs +77% consolidated revenue growth (receivables growing slower than revenue in aggregate). But the 1-2yr bucket grew +120.7% and the 2-3yr bucket +142.7% YoY, both far outpacing revenue growth, while the aggregate >6-months-overdue proportion of total receivables held flat at ~22.3% both years (FY26: Rs 938.02 Lakh / Rs 4,214.04 Lakh; FY25: Rs 641.53 Lakh / Rs 2,885.75 Lakh). Standalone >2yr ageing is small and stable (Rs 14.68 Lakh); the ageing concentration sits almost entirely at the ITCPL subsidiary level, consistent with LBF2's 124-150 day debtor-days finding. Note 15 consolidated p.121, Note 16 standalone p.170-171."
