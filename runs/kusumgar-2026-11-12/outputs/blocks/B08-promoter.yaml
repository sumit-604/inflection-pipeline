verdict_basis: "No regulator, court or auditor finding against the promoters and no pledge, but a 100% offer for sale (about 10,290.53 INR mn derived to the family), the ECFPL purchase, an unresolved CRISIL non-cooperation dispute, a CFO change 27 days after listing and an institutional vote against the ESOP form a pattern of friction the corpus cannot settle"
analyst_note: "FLAG-PROMOTER-PRELIM from B03 is resolved to CAUTION, not escalated. Two decisive unknowns: why CFO Kinnar Mehta left (not in corpus) and which lender sits behind the Rs 10 crore CRISIL lines. Derived 10,290.53 = OFS 6,500 + secondary 2,672.00 (2,292.00 + 80.00 + 299.9998) + ECFPL 1,118.53; the WhiteOak SPA line uses 80.00 because the printed 120.00 for 82,192 shares at 365 does not compute (Prospectus p.238). Prospectus pledge statement p.110; the Screener print has no pledge line. Rule G ledger has four of four heads evidenced; OR-14 does not bind because the verdict is CAUTION. Claude web should verify the five items listed in the report."
