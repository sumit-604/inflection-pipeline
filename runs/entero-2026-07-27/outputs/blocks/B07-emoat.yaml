analyst_note: "Emerging Moat and Gate 0 independently converge near the same zone (EM 19 vs Gate0 moat_score 18) despite fully separate methodologies. The scan's single most important finding is internal to Entero's own disclosure: the metric management itself calls its core moat (network reach) is the one that contracted sharply and unreconciled in the latest quarter, in the same quarter warehouse count rose and margins hit records. That combination (reach down, capacity up, margins up) is not explained by the cited low-margin-exit rationale alone and is the top Halt 1 verification item this stage can hand off."
