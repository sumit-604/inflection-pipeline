  - "Phase 3: would pause before underwriting a growth thesis at face value -- FY25 operating cash generation was effectively zero on an interest-inclusive comparable basis; this is a flag/monitorable per pipeline rules, not a halt."
  - "Phase 4: would not halt -- the MD&A/Note-43 numerical contradiction is a disclosure-quality and credibility issue (the correct, worse figure IS disclosed elsewhere in the same document), not a fraud or misstatement finding, but materially lowers confidence in the MD&A's forward-looking claims."
  - "Phase 5: would not halt -- attendance (40%, one director) and cross-board (independent Chairman) items are named-and-monitor items with no evidence of consequence in this AR."
  - "Phase 6: would flag prominently for the human reviewer -- the Chairman's Letter's headline EBITDA figure and 'improved margins'/'financial recovery' framing are directly, numerically contradicted by the audited primary statements and by Note 43's own admission elsewhere in the same document; not a halt under pipeline rules, but the single strongest 'read the primary statements yourself, do not rely on the narrative' signal in this stage."
