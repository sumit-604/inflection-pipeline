receivables_trend: "deteriorating (mild, mixed with a positive): total receivables grew 21.3% (Rs 1,881.63 lakh -> Rs 2,282.86 lakh net), slower than revenue's 31.8%, a genuine positive; but ageing quality within the book worsened at the margin, >6-months-past-due share rising 7.6% -> 8.4% of gross receivables (Rs 142.81 lakh/Rs 1,881.63 lakh FY25 -> Rs 194.44 lakh/Rs 2,319.12 lakh FY26), and the company recognised its first-ever ECL/credit-impaired provision of Rs 36.26 lakh in FY26 (Nil in FY25 and FY24)"
restatements_found:
  - "Rs 243.87 lakh reclassified from Other Financial Liabilities (Expenses Payable + Creditors for exp.) into Trade Payables plus a new Employee Payables line, for the identical FY25 year, between AR_FY2025 (Note 20, p.124) and AR_FY2026 (Note 21, p.135); balance-sheet grand total unaffected; not disclosed as a reclassification anywhere in either AR"
  - "FY25 ROE and ROCE restated across AR_FY2025 (Note 44, p.146) and AR_FY2026 (Note 45, p.150 standalone / p.196 consolidated) on both standalone and consolidated bases, despite identical FY25 PAT, Total Equity, and Total Debt in both documents; mechanism (Average Shareholder's Equity / Capital Employed build-up) not disclosed in either AR"
going_concern_language: "NONE -- standard Ind AS basis-of-preparation and Directors' Responsibility Statement boilerplate only; both auditors' reports (standalone and consolidated) conclude no material uncertainty exists; Directors' Report Item 21 confirms no significant/material order impacting going concern was passed in FY26"
analyst_note: "The single most useful pattern from this run: two mechanically distinct, undisclosed changes to the identical FY25 year's ratios sit inside the same Note 45 that then narrates FY26's own trend against that shifted base. Neither the trade-payables reclassification nor the ROE/ROCE restatement is individually large enough to call fraud, and both may have innocent causes (a genuine presentation improvement, a ratio-methodology refinement), but the AR discloses neither cause nor the fact of change in either document. Combined with the freight gross-up and the MD&A/cash-flow gap, the load-bearing lesson for Role 2/6 is structural: do not trust any FY26-AR-stated trend, ratio, or growth rate against its own FY25 comparator without an independent tie-out to the FY25 AR's original figures. The RPT concentration (Rank 1) is the separate, higher-severity question for live verification: it is a real dependency, not a disclosure artifact."
