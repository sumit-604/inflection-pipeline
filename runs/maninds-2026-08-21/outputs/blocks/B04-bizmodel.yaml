  - {name: "Steel line pipe (LSAW/HSAW/ERW) manufacturing & trading", type: "manufacture-to-order, point-in-time sale", pct_of_revenue: 89.5, predictability: "M"}
  - {name: "Real estate monetisation (Merino Shelters JDA)", type: "one-off non-core land monetisation", pct_of_revenue: 10.5, predictability: "L"}
