analyst_note: "Top new finding: BRSR Annexure 7 (p.84) discloses 73.47% of turnover from Trading in Securities vs 15.19% from broking services, a filed numeric answer to LBF1 sitting outside the segment note B02 found unable to answer it. Read with the FY26 fee-income decline and the MD&A's 'reducing dependence on proprietary trading' claim, the filing contradicts itself on the run's central question. Second finding: a repeat, independent instance of B02's Note 62/66 disclosure-placement pattern, this time in Board's Report Item 25, which omits both the 19-May-2026 NCD early-redemption resolution and the 24-Jul-2026 Enshrine acquisition approval from its 'no material changes and commitments' statement. Neither is accounting fraud; both are business-model and disclosure-design findings for Role 1/2/6."
