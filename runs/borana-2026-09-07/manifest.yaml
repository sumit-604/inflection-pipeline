peers:
  - ticker: FILATEX
    name: Filatex India Ltd
    why: Polyester yarn maker (POY/FDY/PTY). This is Borana's input. Its
         concalls carry polyester-chain spreads and the Chinese import-duty
         story, so it is the direct test of whether Borana's margin is a
         yarn-price windfall. Four fresh transcripts to Aug-2026.
  - ticker: SANGAMIND
    name: Sangam (India) Ltd
    why: The only listed integrated synthetic yarn plus FABRIC weaver of
         comparable structure. Benchmarks what a synthetic fabric maker
         actually earns on looms.
  - ticker: SANATHAN
    name: Sanathan Textiles Ltd
    why: Polyester yarn including texturising (POY to PTY), the same step
         Borana runs in-house for its 8% yarn revenue. Recently listed
         (Dec-2024), so disclosure vintage matches. Four fresh transcripts.
peer_selection_note: >
  Borana's own DRHP states it has no comparable listed peer. The street's
  ad-hoc basket (Vardhman, Arvind, R&B Denims, Filatex) is a generic textile
  list; Vardhman and Arvind are cotton-integrated and R&B Denims is denim, so
  neither mirrors the engine. Peers were picked on the economic engine per
  /step1 step C. AYM Syntex was considered and REJECTED: it has published no
  concall since 2021, so it cannot serve stage-06 peer verification.
peer_margin_context: >
  EBITDA margin across the last three reported years, computed from
  inputs/screening/<TICKER>-Data_Sheet.csv: FILATEX 6.0-8.7%, SANGAMIND
  6.4-13.7%, SANATHAN 3.4-9.3%. Borana FY26 is 23.6%. Year alignment must be
  verified against the filings before this comparison is used in any output.
