going_concern_language: "NONE (basis-of-preparation line, Note 2.1 p.63, and standard auditor wording only; CARO xix p.59-60 reports no material uncertainty). AGM Item 6 (p.33) says Danya 'has sound financial standing' while its rating is BB-/A4+; this is outside the Notes."
analyst_note: "The Notes show no misstatement, but the whole equity story runs through Danya. Three Danya facts need to be read together: (1) 61.3% of its turnover is SPEL and 95.6% of its growth is SPEL; (2) consolidated profit equals standalone profit to the lakh, so no unrealised profit was eliminated on inventory Danya holds (1,653.47); (3) it is rated BB- with a 1,470.00 SPEL guarantee behind it, wider than disclosed (SBI rows). Capex and debt are the second chain. Pass 2 found the ICICI table and CWIP ageing do not reconcile, and DSCR 2.44x is a forward maturity ratio. FLAG-CASH rests on advances and payables funding CFO, not on a receivables collapse. All findings rate YELLOW because most are disclosure gaps; no RED rating was earned, but stage 11 should treat Danya terms and ICICI schedule as unresolved."
