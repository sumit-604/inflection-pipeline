  - {risk: "Negative operating cash flow", first_signal: "second consecutive year of negative CFO, or CFO/PAT staying below 0.7x"}
  - {risk: "Capacity ramp / job-work-to-export transition execution", first_signal: "capacity utilisation stalling below 31%, or operating cycle elongating past 96 days"}
  - {risk: "CIRP-legacy governance overhang (KMP turnover, RPT-timing non-compliance, cross-guarantees)", first_signal: "any further KMP resignation within 12 months of Jan-2026 CS resignation, or guarantee invocation/covenant breach"}
mgmt_questions:
  - "Given negative operating cash flow in FY25 despite the profit turnaround, what is the specific plan and timeline to convert reported profit into cash?"
  - "What is the basis for asserting all related-party transactions are on arm's-length terms, given the new 0%-interest loan from the dominant related customer?"
  - "What is the exact ownership percentage in K.P. Woven Private Limited, and can the negative net book value in Plant & Machinery - Continuous Process be reconciled?"
