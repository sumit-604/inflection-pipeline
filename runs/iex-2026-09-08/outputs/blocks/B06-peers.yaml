flags:
  - "Q6 (BSE market-share trajectory vs NSE, current B05 question, subsumes and strengthens run 1's customer-loyalty finding) is CONTRADICTED: CDSL's own loyalty claim (May-2026) now sits in the MIDDLE of a four-quarter documented erosion arc (93% incremental share peak Q3FY25, down to 82% by Nov-2025, downplayed Feb-2026, loyalty claimed May-2026, further 420bps loss disclosed Aug-2026); BSE's own cash-segment stagnation (7-8%) is explained by BSE itself as a structural smart-order-routing bottleneck, not loyalty, repeated identically in Feb-2026 and May-2026, with the segment now 'creeping up' toward a double-digit aspiration by early 2027 (Aug-2026); an MCX investor cites the options segment of the same NSE-vs-BSE rivalry for the opposite lesson (dramatic share reallocation). Priority item for synthesis."
  - "Q5 (customer/counterparty concentration disclosure, current B05 question) is CONTRADICTED against its implicit premise: CDSL and MCX both refuse outright when asked comparably direct concentration questions ('we don't give any client-specific information'; 'I cannot name any specific member by name'), across four separate instances in this corpus; BSE is never asked and discloses nothing. IEX, despite late and reactive disclosure, is the only one of the four names to have produced an actual quantified concentration figure on the record."
  - "Q1 (fee realisation trailing volume, current B05 question, most important of the six) is PARTIALLY VERIFIED: the topic is sector-wide (all three peers face direct realisation/margin-compression questions), but IEX's specific failure mode -- three different, unreconciled, unquantified internal explanations across three quarters -- is not matched by any peer. MCX gives the most rigorous single answer in the corpus (a quantified, named external cause with alternatives explicitly tested and ruled out); BSE names one consistent external cause without quantifying it; CDSL flatly refuses to discuss net realisation after client discounts, the closest peer analogue to IEX's own unresolved question."
  - "Q2, Q3, Q4 (current B05 questions) are all UNVERIFIABLE for want of comparable peer data: MCX's electricity-derivatives business cannot corroborate the 18%/1% power-exchange-vs-demand growth claim (structurally different product; only an adjacent baseline-penetration figure of 8-10% partially corroborates IEX's separate 'current 8-9%' figure); no peer makes a comparably specific long-dated, quantified TAM claim for its own core segment; MCX discloses no coal-exchange size figure at all across four transcripts, so its coal sizing cannot be checked for consistency."
  - "Independent, unprompted third-party corroboration of coupling risk severity carried forward: two separate MCX-side investors (Feb-2026 and May-2026 calls), discussing a different company, name IEX directly and describe the market coupling issue as having 'derailed the situation' -- external confirmation the risk is taken seriously outside IEX's own investor base."
