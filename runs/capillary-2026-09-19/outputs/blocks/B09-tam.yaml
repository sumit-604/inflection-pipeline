  - "Three estimation methods diverge by more than 10x (software-only $1.0-1.8B vs broad loyalty-management market $12.9-15.2B vs fragmented agency-led M&A-target segment $5.6B) because each answers a different question; deliberately not averaged."
  - "FY27 guided total revenue growth (36-43%, LBF1) runs well above the SOM-implied medium-term CAGR (21-23%) because FY27 includes a one-off full-year step-up from the SessionM acquisition (closed 01-May-2026, zero months in the FY26 base, ~$32M ARR alone explains +37.2%); the SOM math cannot underwrite continued M&A execution, only the organic-plus-steady-state-M&A trajectory."
  - "India-specific TAM is not separately disclosed by Capillary (revenue geography split is US/UK/Others only); independent India loyalty-market estimates ($0.7-4.3B depending on definition breadth) suggest India is immaterial to the current SAM/SOM."
