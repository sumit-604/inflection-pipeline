analyst_note: "Pass 2 governs over Pass 1 for two Note 40 ratio citations: true Inventory Turnover is 6.26x/7.23x (down, resolving Pass 1's self-flagged contradiction against the inventory build) and true Trade Payables Turnover is 36.49x/21.00x (up sharply). Pass 1's 6.42x/3.96x was actually Interest Coverage; its 5.58x/9.63x was actually Net Capital Turnover. All figures in this report and the YAML use the corrected values. The IPO monitoring-agency report (read in full for Pass 3) shows 100% of net proceeds utilised by Dec-2025 with no deviation, which reframes the ~Rs 10.7 cr third-party loan book and GCP/Renewable Hybrid Project spend as a capital-discipline question about non-IPO-tracked cash, not a proceeds-monitoring violation. The related-party envelope, traced FY22-FY26, rotates in form each year rather than shrinking; FY26's near-nil purchase-side RPT does not extend to the jobwork line, which is the fastest-growing and least-priced related-party cost in the cost stack that produces the headline margin."
