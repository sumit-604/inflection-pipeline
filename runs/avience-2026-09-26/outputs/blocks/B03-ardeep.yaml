one_line_verdict: "Real growth, weak cash conversion, first-year listed-company disclosure discipline not yet caught up."
analyst_note: "This AR carries no separate Chairman's Letter; Phase 6 substitutes the Board's Report and MD&A opening. The single most consequential finding beyond B02's Notes pass is the cross-reference contradiction the Notes pass could not see: Board's Report §26a claims the Auditor's Report carries 'no qualification, reservation, adverse remark or disclaimer,' but the Auditor's own Annexure 1 CARO summary table (p.115-116) formally lists clause (ii)(b) against the Holding Company as exactly that. Paired with the independently reconfirmed Note 40 transposition, this is a first-time-listed company whose disclosure discipline has not caught up with its listing obligations, though nothing found rises to fraud or going-concern. CFO/PAT and FCF trend into FY27 is the single number this run should watch hardest; it is the direct arbiter of whether FY26's real revenue/profit growth is translating to cash or is currently just financing a working-capital and capex build."
