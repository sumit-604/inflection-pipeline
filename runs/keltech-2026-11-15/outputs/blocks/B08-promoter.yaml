verdict_basis: "Inter-se transfer of 40.99% to Vijay V Chowgule leaves the promoter total at 54.33% with no SEBI order, no pledge found and no dilution, but an open ED FEMA enquiry on the incoming controller, a group-tied independent board and internal-control exceptions keep it at CAUTION; STRUCTURE concern, three of four Rule G ledger heads evidenced."
analyst_note: "The transfer moves Keltech from Group A's flagship (CCPL) to Group B's lead. Every FY26 related party is Group B, so the supplier book does not change at completion. Three items the AR does not carry sit in web sources: the ED FEMA summonses (Chowgule Steamships), the Rs 15 Cr Dolphin loan agreement of Apr 2025 (direction contested in media; BSE filing not retrieved), and ICRA's Feb 2026 non-cooperation then Jul 2026 withdrawal. Each could move the verdict if confirmed adverse. One observation settles most: the post-completion SAST disclosures plus the Dec 2026 filed shareholding pattern, which also gives the first filed pledge figure. Vijay is 79 with no named successor."
