verdict_basis: "Live, unresolved SEBI show-cause notice alleging Rs 1.91 Cr abnormal profit inside the company's core proprietary-trading book (co-location matter), undisclosed anywhere in the audited FY26 Annual Report, combined with a promoter pledge above 40% of holding in every available quarter (57.80% latest) and a new Rs 50.04 Cr company borrowing secured on promoter/relative shares with interest paid to family for the encumbrance."
analyst_note: "Three of the four Section 2A regulatory items (NSE SAT appeal, the live SEBI abnormal-profits SCN, the MCX position-aggregation appeal) were found only because the company's own Aug-2026 NCLT scheme-of-amalgamation filing carries a mandatory pending-litigation annexure; none appear in the FY26 Annual Report's Board's Report or BRSR legal-proceedings table, which report 'no significant and material orders' and 'NIL' respectively. This is the same disclosure-placement pattern B02/B03 found for the NCD early-redemption and Enshrine-acquisition items, now confirmed a third time on a different document type and a different subject (contested regulatory conduct in the prop-trading book, not a balance-sheet event). The MCX finding is the most load-bearing single item for the transition thesis: a regulator aggregated a promoter-adjacent entity's derivatives positions with the company's own book in the exact activity (proprietary trading) the thesis needs to shrink as a share of profit. Two capital-allocation items (Aug-2026 warrant allottee, Silverleaf Capital Services pre-merger ownership) could not be verified in this run and are named as first-priority live-verification items, not treated as findings."
