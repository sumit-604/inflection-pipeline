analyst_note: "Central TAM is Mordor India gelatine USD 287.13 mn (2025) plus MRF India DCP USD 95.7 mn (2024), both converted at 95.25 INR/USD. The DCP leg rests on one secondary source; treat its 6.9% share as low confidence. Two readings of share gain: FY26 volume +16.17% vs market about 6% means about +0.7pp share a year (supports +2pp in 3 years), or the volume was stock-built and price-cut (ASP -5.20%, finished goods down 276 lakh per B04). Separating observation: FY27 gelatine volume growth with ASP flat or up after the Jan-2027 capacity. SOM is not a forecast; stage 11 should cap revenue at capacity-embedded Rs 263 Cr until utilisation is known."
