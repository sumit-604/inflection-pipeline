analyst_note: "All figures Rs Lakhs unless Rs Cr. Three readings a later stage cannot rebuild. (1) Growth: FY26 revenue +10.67% (11,144 lakhs); Space and Met, both being demerged, supplied 6,274 (56.3%); Defence sales fell 0.5% (MD&A p.191). Listed remainder grew about 5.1% (calc). (2) Exports: foreign-customer revenue is only 215.93 (Note 33a p.251); the 16,228 exports-incl-deemed line sits within 2.16 of ARC sales plus that figure (INFERENCE: ARC is the deemed-export customer). (3) Margin: headline EBITDA 29.7% includes other income, the FY25 comparator 25.47% excludes it; like for like gain is about 2.5 points. Cash separator: ARC receivable and over-2-year bucket at 30 Sep 2026. B02 corrections: warrant window ends 29 Dec 2026; Janyu remaining lot 49,351; Scheme approved 10 Jun 2026; brief's three negative CFO years shows two in this AR; ARC 51 percent is AMPL 50 plus about 0.8 held by directors (INFERENCE)."
