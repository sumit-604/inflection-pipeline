analyst_note: "SOM central is Reading B: Solar's Rs 4,500 Cr FY27 defence guide sets the SAM, Premier share starts at its FY27 run-rate 9.15%, then +1.5pp (3-yr) and +2.5pp (5-yr). Reading A (budget-linked 15.2% SAM growth, FY26 share 10.7%) gives 17.0% and 17.3%. The observation that separates them is Solar's delivered FY27 defence revenue against Rs 4,500 Cr (May 2027). Both exceed committed capacity of Rs 518 Cr after FY27. Premier lost about 9pp of pool share in FY26; the share-gain rules were applied at the normal band for that reason. Commercial held flat at Rs 72.9 Cr with SAM NOT FOUND."
