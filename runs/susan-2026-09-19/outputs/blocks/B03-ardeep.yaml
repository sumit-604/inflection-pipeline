analyst_note: >
  This stage read the Auditor's Report, CARO, Board's Report and Chairman's
  letter directly (not covered by Stage 2's Notes-scoped passes) and found
  two new AR-internal contradictions: CARO clause (vii)(c) 'no disputed
  statutory dues' and the Auditor's Report's 'no pending litigations'
  statement both conflict with Note 32's own disputed income-tax and GST
  items; and CARO clause (xx) 'Section 135 not applicable' conflicts with
  Note 25.2 and Board's Report Annexure II, which both confirm Section 135
  applies and CSR was over-delivered. Note 33.12's FY26 column is also
  mislabelled '9MFY26' though the underlying numbers tie to the full year.
  The AR contains no MD&A and no Risk Factors section at all -- a
  structural gap, not a disclosure-thinness issue, for a company that
  listed 24 days after signing this report. All 15 of Stage 2's triple-pass
  findings verified cleanly against the AR text with zero discrepancies.
  Governance note: the Chairman & MD sits on all four board committees,
  including Audit and Nomination & Remuneration.
