  demand: "Firm at both peers (order books Rs 450-500 Cr and above), yet both missed or cut revenue guides on external causes (monsoon, West Asia shipping, late commissioning)."
  pricing_inputs: "Oil about +100% and other inputs +10-25% since Feb 2026; peers carry fixed-price exposure and passed through 50-60% on older orders; SPEL's 80-85% PVC is the outlier."
  capex_cycle: "Industry-wide capacity race, not a lone expander: Shilchar 7,500 to 14,000 MVA by Apr 2027, Danish about 11,000 MVA live with 80-100% more planned, Waaree entering by acquisition; SPEL's Kannur is a small add inside the race."
