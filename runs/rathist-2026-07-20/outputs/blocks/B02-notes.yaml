  - "Solvency Ratio note describes deteriorating turnover/coverage metrics using improvement language, opposite of what the numbers show (Notes on Accounts item 17)"
  - "Promoter-group preference/equity holders (Char Investment, Lenzing Poly Packs, PCR Holdings, DBG Leasing) confirmed in Note 11 but omitted from the RPT note despite a clean CARO RPT-compliance attestation (Note 11; Notes on Accounts item 12; Auditor Annexure-A item 13)"
  - "CARO surety disclosure for director-interested 'other Companies' under Sections 185/186 contradicts the Corporate Governance Report's blanket denial of guarantees to director-interested entities (Auditor Annexure-A item 4; Corp Gov Report p.62)"
  - "MSME status of creditors unknown to the company 'even after adequate efforts' (Notes on Accounts item 8)"
  - "Rs 63.23 Cr unexplained FY24 financing cash outflow far exceeding all disclosed debt-waiver amounts combined (Cash Flow Statement p.85)"
  - "Key Audit Matters section of the audit report is empty despite a year of material accounting complexity (Independent Auditors' Report p.67-68)"
  - "Finance-cost classification flips almost entirely between 'Interest on Loans' and 'Bank Charges' across the two years with no cross-reference (Note 25 p.83)"
