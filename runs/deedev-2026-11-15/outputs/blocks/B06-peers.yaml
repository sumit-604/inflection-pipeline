cross_peer_hypothesis: "Across the three peers, cash cycle length follows the advance share of new orders and the customer mix, not execution speed. ANUP's working capital rose to 2.2-3x turns only after order intake fell and advances dried up; ISGEC cut working capital by dropping long-duration PSU milestone work; Ratnamani's cycle lengthened when water orders and deferred shipments piled up. None of them says this. Test on DEEDEV: if the order book rose from Rs 1,303 cr to Rs 2,531 cr (B05) but H1 FY27 operating cash flow was Rs -6.79 cr, customer advances (contract liabilities) should show little or no build. If they do build and cash is still negative, the leak is inventory or debtors, not advance terms."
analyst_note: "Peers support direction only. None gives a BHEL award pace, HRSG, P91/P92, material-supplied margin or mill credit-term evidence, so four of seven questions stay UNVERIFIABLE and the verdicts must not be read as support. The 263-day Q1 FY27 working capital sits above every peer figure; ANUP 2.3 turns equals ~159 days by my division of 365 by 2.3, not a peer statement. Ratnamani is both a mill and an exporter, so its credit terms say nothing about what it asks of fabricators."
