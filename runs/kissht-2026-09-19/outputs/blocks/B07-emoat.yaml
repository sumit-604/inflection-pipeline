analyst_note: >
  The AI/data underwriting stack (D1) is the only category clearing Strong, and it
  is genuinely well documented across the AR, both investor decks and both
  concalls with dated model versions. But the scan's own Family I test (I1=0,
  I2=0) forces the conclusion that this advantage is an execution lead a
  well-capitalised competitor (Bajaj, Chola, a bank-led digital lender) could
  replicate without sacrificing anything in its own business. Two categories score
  0 on direct contra-evidence rather than absence of evidence (C2 off-book
  concentration worsening; G2 Cost-to-Income worsening), and the scan's
  highest-scoring customer category (C1) sits beside a same-document
  contradiction (repeat-customer share falling) that the AR's own narrative does
  not acknowledge. The completionist guard triggered one correction (A4
  downgraded from a considered Weak to NO EVIDENCE FOUND) and no others; 18.5/92
  is an honest sparse-to-modest result, not an inflated one, and it does not clear
  the EM>=25 threshold needed to lift the backward AVERAGE classification.
