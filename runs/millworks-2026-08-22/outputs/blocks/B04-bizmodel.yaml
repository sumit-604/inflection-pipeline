one_line_verdict: "A fast-growing, sub-scale precision-engineering job shop whose headline growth and margin expansion sit on top of one customer relationship that is simultaneously its biggest revenue source, its worst receivables problem, and a related equity investment."
analyst_note: "Quick Pay Private Limited is not just a receivables/investment overlap (B01 flag) but the largest customer outright at 47.02% of FY26 revenue, RHP Risk Factor 3 'Customer 1' (p.28). With Big Bang Boom Solutions execution dependency (p.130), the entire Defence line (69.43%) is substantially one counterparty dressed as a four-sector business. Moat scoring, pricing power, valuation method selection all assume this concentration persists; FTTCP/Role 1 must treat Quick Pay diversification (or absence) as the single highest-priority verification item, ahead of the cash-conversion failure."
