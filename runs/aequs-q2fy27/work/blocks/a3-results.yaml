analyst_note: "Three threads matter. First, losses sit outside the parent and are widening: subsidiaries plus eliminations were Rs (559.9) Mn in Q2 vs (228.6) Mn a year earlier. Parent profit is intra-group, non-cash interest and guarantee income (192.2 vs 66.8 Mn H1 PBT), and parent CFO is negative. Second, the amalgamation rejection bites through tax, not operations. The group booked Rs 246 Mn of current tax in H1 on an Rs 807 Mn loss, and the note's no-impact wording covers business operations only. Third, the consumer segment result of Rs (40.1) cr meets the Rs 36.1 cr falsification threshold on the EBITDA half. Utilisation is not in this filing, so A4 must source it before calling the line. EBITDA quality: Rs 124 Mn of H1 non-cash gains, led by an 83.7 Mn inventory-provision reversal, equal 27% of H1 EBITDA. Net debt rose Rs 3,144 Mn in six months; the Rs 6,500 Mn promoter warrant is the visible equity cure. Only A3-08 touches the non-tying consolidated 6M FY26 column (its 92.21 comparative)."
