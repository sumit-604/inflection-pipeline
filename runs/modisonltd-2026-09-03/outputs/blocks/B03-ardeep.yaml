one_line_verdict: "Modison Ltd: real margin recovery, unproven cash conversion, narrative outrunning its own numbers - Turnaround, WATCHLIST pending FY27 cash confirmation"
analyst_note: "The single most decision-relevant finding beyond B02: CFO was POSITIVE in FY24 (+Rs1.24cr, FY25 AR p.120) before turning negative in FY25 and worsening sharply in FY26 - a two-year, accelerating deterioration on the filed-AR basis, not a long-standing pattern (screener shows FY24 -3.89cr, a basis discrepancy flagged for Verifier A). Leverage (Debt-Equity 0.16x->0.34x->0.64x) IS a genuine two-year trend, a different and longer clock than the CFO inflection - FTTCP should not conflate the two. No EBITDA margin guidance number exists anywhere in this AR; the Spear '10-12%' figure is a verbal Jul-2026 AGM statement, to be anchored at stage 5, not treated as AR-anchored. The MD&A's 'robust operational cash flows' claim beside its own -Rs64.18cr OCF disclosure (p.75) is the report's clearest credibility flag and should discount confidence in other unverified forward MD&A claims."
