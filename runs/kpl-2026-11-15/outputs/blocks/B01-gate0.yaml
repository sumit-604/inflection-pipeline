analyst_note: "Block B is the whole story. Earnings and returns climbed (ROCE proxy 17.0% FY17 to 21.7% FY26; PAT CAGR 39.5%) but cash did not follow: cumulative FCF proxy is negative (Rs -2.52 Cr) over ten years and receivables rose from Rs 22.61 Cr to Rs 280.05 Cr (screener-data). GOOD is capped by deal-breaker 2, and core 61 is one point over AVERAGE. Moat score rests on margin expansion, fixed asset turnover and a mechanical M11; margin and gross margin sit below peer median. Cash conversion and receivable collection are the downstream priority."
