analyst_note: "AVOID is mechanical, not a verdict on the business. Two forces drive it: Block B (0/20) is a cash-conversion failure entirely concentrated in FY24-25 working-capital build that the company's own AR ties to large-deal execution and post-IPO capacity investment, with FY26 CFO already recovering; and Block A shows ROCE anchored near 11% for three years running against an 18% FY22 pre-IPO peak that sits outside the declared 4-year scoring window, understating the true peak-to-trough decline. Growth and balance sheet blocks are genuinely solid. Four gaps need Phase 3 closure before this AVOID is trusted: promoter pledge status, promoter holding history beyond one year, any peer comparator set for the four PEER-DATA-NEEDED moat tests, and FY2023 capex. The FY2026 PAT beat is partly a one-off earn-out reversal, not organic; treat C2/C4 growth scores as optimistic."
