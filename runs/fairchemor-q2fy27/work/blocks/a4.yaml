analyst_note: "Loop 1. Core-PBT gain (0.80 to 13.50 Cr YoY) is operating, but margin only returns to about the FY24 peak off a trough, price-led on low imports; H1 gross margin may also carry an inventory cost-lag gain (Q1 drawdown 15.98 Cr), so Q3 with no cushion is the clean test. The Q2 -5.2% QoQ dip now has two readings: demand-side vs feedstock-capped ('market entire quantity', stock drawn both quarters). Neither supports volume growth; the supply reading moves risk from demand to the 'secure supply' moat. Separator: Q2 intake and sales tonnage vs Q1 with price per MT. Cash: deleveraging was inventory-funded (ex-release FCF -2.78 Cr); land would undo 78% of it. Buyback at 47.4x FY25 EPS with debt undercuts the deck's 'Capital Efficiency' and 'low volatility' claims. Verdict unchanged: PROCEED WITH FLAGS, below the INDETERMINATE cap."
