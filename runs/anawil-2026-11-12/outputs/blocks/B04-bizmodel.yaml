  - "What keeps 70 to 80% of annual revenue in H2 FY27 when the book is targeted for Q1 FY28?"
  - "Who holds the Rs 30.6 Cr vendor advances, for what plate, and when do they convert?"
  - "Is the Customer C order Rs 58.3 Cr including GST, and what is the book ex-GST?"
  - "When does Kutch get customer approval, and what are its towers and margin?"
  - "Who owns and prices scrap in Model 1 (FY26 'Others' 5.51% of revenue)?"
one_line_verdict: "A three-year-old wind tower fabricator with real profit per tower, where the margin fall is mostly mix and season; the tests are H2 FY27 delivery and the Model 3 steel clause."
analyst_note: "Two decoding facts a later stage cannot rebuild from the fields. First, the margin fall is half season: H1 FY26 24.5%, H2 FY26 50.1%. EBITDA per tower H1 FY27 (33.7 lakh) sits level with H2 FY26 (34.5), so the reported +104.7% YoY is H1 against a weak H1. The reported 32.82 lakh is operating profit before working capital changes over 107 towers, not EBITDA. Second, order-book model shares tie exactly to customers: Model 3 = A plus C (51.29%), so the Model 3 slice is two customers, one of them GST-inclusive. Model 3 earns about 3.4% handling margin on its extra steel (company midpoints), so one steel clause decides whether it is a converter. The 48.17% FY26 utilisation uses a 436-tower base; 612 is not the right denominator for heavier 474 t towers. Sector cap row: the manifest now carries the 25x row, which fits the economics; 28x is the second reading and fits only the end-market."
