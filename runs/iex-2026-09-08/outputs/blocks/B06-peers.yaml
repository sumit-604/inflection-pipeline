  - "MCX Concall May 2026 Transcript, p.13, investor Bharat Shah: 'if you look at IEX, the energy Exchange, out of the blue, the market coupling issue has come. And that is very clearly derailed the situation... we are seeing how IEX is struggling with that issue.'"
