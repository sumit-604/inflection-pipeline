analyst_note: "Peer set is thin. UFO is an ad and digital-cinema vendor, Wonderla runs parks, and CINELINE (the only other listed exhibitor) has no transcripts, so nothing tests PVR share, admissions or screen build. Zero claims reach VERIFIED. Two matter most. UFO ad revenue +33% in Q1 FY27 against PVR about -2.1% (derived) means PVR's ad weakness is partly its own, though UFO's low base is NOT FOUND. Wonderla cut or held ticket price (ATP -3% Q2) and grew footfall 6%, the opposite of PVR (ATP +14%, admissions +4%). Wonderla non-ticket spend per guest (+11% Q2, +16% H1) does support the PVR SPH direction. Derived: UFO Q2 revenue ex equipment sales about +2.1%. Cross-peer hypothesis is testable on PVR Q3 FY27 admissions vs ATP. UFO calls were held 30 Jan, 22 May, 29 Jul and 4 Nov 2026, not Feb and Aug as filenames say."
cross_peer_hypothesis: "H1 FY27 growth across exhibition, ad and park businesses came from new capacity, per-visit spend and tentpole concentration, not more visits per existing asset; Wonderla trades ticket price for visits while PVR trades visits for price. Test: PVR Q3 FY27 admissions growth near +4% to +8% with ATP above +10% against industry above +20% means price-led share loss; admissions near +15% with falling ATP growth supports the content-mix reading."
