analyst_note: "The most consequential finding this stage adds is that the EBITDA/PBT/PAT reconciliation failure already established at the AR level (standing correction: -2.5% recomputed vs +0.57% claimed FY26 margin) is not an annual-report drafting artefact. The identical recomputation method, applied to the Q3 FY26 and Q4 FY26 concalls using the SAME-DAY filed unaudited/audited P&L, shows management stating positive EBITDA, PBT, and PAT figures live on calls when the filed numbers were already negative, meaning the miscommunication originates in how results are presented to the market in real time, months before any AR is drafted. Combined with the undisclosed WIPS-subsidy dependency (which exceeds the entire claimed FY26 EBITDA) and the total five-call silence on the guarantee and going-concern language, downstream stages should treat every EBITDA, PBT, or PAT figure quoted on a Fratelli earnings call as unverified until independently recomputed from the same-period filed P&L, and should not treat the 'breakeven'/'inflection point' narrative repeated since Q2 FY26 as evidence of an improving trend without that recomputation."
