verdict_basis: "No SEBI action, nil pledge, promoter bought in market and subscribed at Rs 502, but a founder-family pay vote lost to institutions, an unexplained Rs 762.90 lacs payable to a WTD with an open tax assessment, and a board report that denies the audit qualification."
analyst_note: "Load-bearing facts checked at the page. Promoter fall 70.17% to 65.13% is dilution (+3,98,406 promoter shares). The 762.90 line sits only in the consolidated note; standalone shows 26.76, so about 736 lacs sits in a subsidiary. Its footnote says salary payable and trade payable, no split. Group pay of five family members is 622.04 lacs (592.14 prior), +5.0% while group PAT rose 76.9% (B03): pay is not running ahead of profit. The failed vote, not the amount, is the signal: promoters could not carry it with the public. Tripwires: split of 762.90; Shikha tax appeal outcome; re-tabled pay resolution; Directors' report wording corrected; FY27 opinion on Malwa Power."
