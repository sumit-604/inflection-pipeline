net_narrative_effect: "complicates"
analyst_note: "No peer contradicts a SUDARCOLOR claim, but none confirms the size of the Q2 FY27 jump. The parent explains three parts: a low Q2 FY26 base (destocking trough), volume recovery from Q4 FY26, and Frankfurt-to-Roha transfers with some intercompany business. Group share is NOT FOUND, so the two readings stay open: (1) demand recovery plus base effect, (2) production re-routed from Europe into the Indian site. The separating observation is the H1 FY27 Reg 23 split of group vs third-party sales. Independent peers show 3-4% industry growth, low utilisation and price-led growth, which makes +47.3% hard to read as open-market demand. Derived: MOL pigment revenue rose 22.9% quarter on quarter in Q2 FY27 (161 vs 131), close to SUDARCOLOR's 21.3% sequential step (269.76 vs 222.39), so the sequential step is ordinary and the year-on-year size is mostly base. Gross margin is the open item: peers passed costs through, SUDARCOLOR did not [INFERENCE: group-routed sales at transfer prices]. Parent's Q2 FY27 call is missing; read it when filed."
cross_peer_hypothesis: "In the 2026 cycle, Indian pigment volume is splitting into open-market demand (industry 3-4%, plants at 39-51% utilisation, price-led margin recovery at MOL and ASAHISONG) and production re-allocated inside integrated groups from high-cost foreign sites to Indian plants (parent moves Frankfurt lines to the Indian Heubach site at Roha). No peer states this split. Test: the H1 FY27 Reg 23 filing should show SUDARCOLOR group sales rising faster than third-party sales while third-party sales stay near flat. [INFERENCE]"
