analyst_note: "The single most load-bearing finding this stage adds beyond upstream stages: the FY26 AR's 'relentless focus on receivables, inventories, strict cost control' sentence is not boilerplate management could not have known was wrong -- the identical sentence appeared in the FY25 AR describing a year inventory actually fell 17.0% (Rs 38.47cr to Rs 31.93cr, Note 8). Carried unchanged into FY26, the same sentence now sits beside a 76.7% build. That is a claim proven true once, then falsified once, by the company's own numbers, with no edit and no acknowledgement in between. Separately: Q1 FY27's operating margin swing (16.1% to 22.9%, own recomputation from the filed P&L, ties exactly to LBF-1) is real, but Q1 FY26 was itself the low point of the entire ten-quarter series (range otherwise 18-26%), so part of the 'jump' is base effect, not pure new structural improvement -- worth flagging to Stage 11 before it prices the Q1 FY27 number as a clean step-change."
