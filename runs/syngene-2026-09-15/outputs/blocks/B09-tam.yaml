flags:
  - type: FLAG-TAM-SAM-GAP
    reason: "Management's AR26 and investor decks present the global USD 213bn/330bn CRDMO TAM prominently and never narrow it to an India/company-specific SAM anywhere in the corpus read for this run; the only India-specific figure shown (Clinical CRO, $1.9-3.4bn) covers a minor part of Syngene's actual business. The TAM number itself is reasonably sourced (mgmt_claim_ratio 1.13x, reasonable) -- the risk is presentational TAM/SAM conflation, not an inflated headline number."
  - type: FLAG-CAPACITY-EXCEEDS-B07
    reason: "SOM-implied revenue (3yr Rs6,169cr, 5yr Rs8,786cr) exceeds the capacity ceiling implied by B07's 34.5% capex-embedded-growth figure (~Rs5,029cr) by ~Rs1,140cr (3yr) and ~Rs3,757cr (5yr). Bayview's total committed capex is NOT FOUND IN DOCUMENT, so the gap cannot be closed with evidence in this corpus; the SOM is the optimistic side of this comparison."
  - type: FLAG-BELOW-MARKET-GROWTH
    reason: "Syngene's own 2-year revenue CAGR (FY24 Rs3,489cr to FY26 Rs3,739cr) is ~3.5%, below both the 9% global TAM CAGR and the 15% India SAM CAGR used in the SOM funnel. The +1-2pp share-gain assumed for SOM requires the CDMO refill and research-services stabilisation to materialise; the recent trend runs the other way."
  - type: FLAG-SCOPE-MISMATCH-INDIA-CDMO
    reason: "A broad ~$17.5bn 'India CDMO market' figure (likely includes generic API/formulation contract manufacturing, date unclear) and BCG-IPSO's narrower ~$3-3.5bn NCE-innovator CRDMO figure (Feb-2025) diverge roughly 5x by scope. This report uses the narrower, better-matched figure for SAM; the discrepancy is named, not resolved."
  - type: FLAG-AR-BIOSECURE-CONTRADICTION-CARRIED
    reason: "Carried from B07: AR26 contains two internally contradictory statements on the BIOSECURE Act in different sections (outgoing CEO's letter says it 'eliminated any short-term China+1 tailwinds' vs the Industry Trends section saying 'China+1 is accelerating... reinforced by... BIOSECURE Act momentum'). Directly bears on the regulatory-tailwind growth driver in Section 4A; unresolved this pass."
