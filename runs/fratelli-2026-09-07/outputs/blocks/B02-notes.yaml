going_concern_language: "Standalone Note 39 (p.129-130) and consolidated Note 44 (p.198): 'the Company/Holding company has adequate surplus funds to meet its operational and financial obligations for the foreseeable future... the financial statements have been prepared on a going concern basis'; silent on the Rs 114.50cr corporate guarantee. Consolidated auditor's report carries an Emphasis of Matter on Note 44 (p.~130), opinion not modified, duplicated verbatim under Key Audit Matters with standalone-opinion language mistakenly carried into the consolidated text; standalone auditor's report (p.~112-113) states no key audit matters for the identical fact."
analyst_note: "Load-bearing fact 2 is SETTLED, not NOT RESOLVED: same entity, same audited consolidated P&L, same FY26 year in both Stage 1 and Stage 2's sources. The gap is a screener.in vendor sub-classification break (Power and Fuel/Other Mfr Exp/Selling and admin all go blank in the FY26 column only, with the residual dumped into 'Other Expenses' at Rs 114.14cr); an exact PBT-bridge reconciliation reproduces screener's own FY26 PBT to the rupee, proving 114.14cr is the vendor's internal balancing figure, not a company reclassification. The audited Note 30 (Rs 85.69cr FY26, stable 3 years) and the netted 78.1% gross margin are the figures of record for downstream valuation. Two other priors were also corrected on source: the warrant forfeiture rate (65.1% actual vs 39.5% injected) and the FY24 wine-segment figure (Rs 212.88cr per Note 37, not Rs 215.6cr). The most consequential NEW finding is Pass 2's: the Directors' Report's own headline growth claim (+1.59% consolidated revenue) is provably false against the audited P&L in the same document (true movement -40.0%), a disclosure-integrity issue distinct from, and more serious than, the business transition itself."
