net_narrative_effect: "complicates"
analyst_note: "Peers confirm the cost shock and pass-through, but not the quality of what CNL builds on it. Distributor margins are narrow-band (RPTECH 'normally fixed', REDINGTON EBITDA 2.2-2.4% ex Arena), so the 5.94-6.66% market-entry segment result needs a CNL-specific explanation (Make-in-India mix) that no peer can test. The 30,000 Cr surveillance market does not reconcile with CPPLUS's own share arithmetic (derived ~8,000 Cr) and basis may differ. CPPLUS is the best analogue for the brand side and shows creditor days falling and capex rising in a shortage, the opposite of CNL's asset-light and payables-led story. Peer set is adjacent, not like-for-like, for Q5 and Q6."
cross_peer_hypothesis: "Vendor credit in the component shortage is allocation-linked and splits peers by chain position: finished-goods distributors (RPTECH, REDINGTON) held or lowered working capital, while CPPLUS, the component-buying brand-owner, saw creditor days fall and CCC rise to 64 days. If CNL behaves like the brand-owner, its payables-driven NWC fall (75 to 45 days) is its least durable cash source. Testable: NWC reverts toward 52-55 days by FY27 year end; falsified if NWC stays at or below 50 days through FY27 with the shortage persisting."
