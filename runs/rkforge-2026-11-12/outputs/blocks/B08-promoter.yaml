verdict_basis: "Promoters paid Rs 404.67 Cr and did not sell, but FY24 PAT was restated -15.4% (deal-breaker recorded) and 16.2% of promoter shares were pledged from Aug 2025."
analyst_note: "Pledge settled at the source: stage 1 was right, stage 3 read only the AR, which is silent. XBRL 19 and 30 Sep 2026 shows 1,23,00,000 pledged (Riddhi 1,10,00,000; Naresh 13,00,000). Promoter fall from 43.39% (Jun) to 40.93% (Sep) is the Maa Chandi reclassification: 7,90,44,606 less 65,00,000 = 7,25,44,606 = 39.82% on the 19 Sep base, then +34,00,000 on 24 Sep = 7,59,44,606 = 40.93%. Family count rose; none sold. The 204.75 Cr figure is Riddhi only; with Chaitanya 199.92 Cr the total is 404.67 Cr. Pledge timing overlaps warrant payments, so purpose is an [INFERENCE], not a fact. The report's scorecard row 3 has a garbled cell; the note under the table gives the correct basis. Verdict is CAUTION, not CONCERN, because the weak points are controls, not minority treatment."
