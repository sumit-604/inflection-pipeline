analyst_note: "SOM built bottom-up from disclosed FY26 tonnage per segment (boric acid 15,900t, DOT 980t), held prices flat at FY26 realisation (Rs127.5/kg, Rs150/kg) to isolate volume/share growth from the ore-cost pass-through cycle, and capped boric acid volume at management's own stated debottlenecking range (+1,000-1,500t) since the segment is described as at peak utilisation with no anchored new capex. Boron Oxide and Kronox are named as upside levers but excluded from tam/sam/som fields because the former is unproven (zero CWIP) and the latter is an unclosed acquisition in a different product chemistry. DOT's 3-5yr share path (31%-49% of a flat 8,500t market) is the aggressive edge of the share-gain rules, justified only by explicit management guidance and a genuine low base; treat as the higher-variance leg of the SOM."
