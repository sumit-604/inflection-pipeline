analyst_note: "Core 60 with STRONG moats would map to GOOD+, but cumulative CFO/PAT of -0.36 caps the result at AVERAGE. That cap holds under every sensitivity run here, so AVERAGE is robust even though core sits on the 60 line. Several scores rest on loss-year FY21 endpoints: A4 (5), M1 (5), B4 (5). Moving the start to FY22 drops core to 55 and cuts M1 to 3. FY21 to FY23 growth came off a low base and the FY23 ROCE of 60.6% sits on 9.59 Rs Cr of capital employed. Cash conversion is the real depressor: FY24 receivables build, FY26 inventory build. Net cash, 8.3x interest cover and 0.17 debt to equity are sound. The FY26 AR versus results-filing gap (2,463.00 Rs Lakhs) moves only D4 and the debtor-day reading."
