flags:
- type: FLAG-CONVERTER-CLASSIFICATION
  reason: "TRUALT fits the Commodity converter archetype (CLAUDE.md ARCHETYPE LIBRARY): ethanol output price fixed
    by the Government of India per feedstock type per Ethanol Supply Year (prospectus p.233-234), margin is the
    spread against feedstock cost, not pricing power. This binds Section 1B v3.7 Amendment 17 for every downstream
    stage: spot-year ROCE and rupee-denominated working-capital trends must not feed Section 1B or FTTCP for this
    name."
- type: FLAG-MARGIN
  reason: "Grain-ethanol margin, the load-bearing economics of the multi-feed transition thesis, has already compressed
    from Rs15-16/litre (maize Rs17.50-22/kg, Oct-2025 to mid-Feb-2026) to Rs6-7/litre (maize Rs25.50/kg, as of
    Jul-2026) (concall Aug-2026 transcript p.8-9). Utilisation (60.57%, Inv. Pres. Q1FY27 p.6) is tracking toward
    the company's own target, but on the weaker margin leg of the thesis, not the stronger one company memory
    assumed as a live risk rather than an already-printed fact."
- type: FLAG-VALUATION-METHOD
  reason: "4B hands stage 11 a decisive PRIMARY/SECONDARY/TERTIARY method set (cycle-normalized P/E anchored to
    Section 1B destination PE / EV-EBITDA / SOTP for CBG-SAF-retail optionality). FY26 Debt/EBITDA 3.29x standalone
    (AR p.107) and the sector cap row (Sugar / agri-commodity, 18x, provisional per B00/B01) both carry into stage
    11, not decided here."
