  - "Operating cash flow diverged sharply from PAT in both FY25 (OCF -Rs.1,409.5 lakh vs PAT Rs.1,015.3 lakh) and FY26 (OCF Rs.29.0 lakh vs PAT Rs.2,075.8 lakh, Inv. Pres. slide 27/32)"
  - "ROCE/ROE figures internally inconsistent within the Investor Presentation: slide 5 headline states 47.4% ROCE / 38.0% ROE for FY26, while slide 29 chart shows 37.2% ROCE / 35.5% ROE for FY26"
  - "Short-term borrowings rose from Rs.275.6 lakh (FY25) to Rs.3,182.4 lakh (FY26), ~11.5x, funding inventory and receivables build (Inv. Pres. slide 26)"
