valuation_methods:
  primary: {method: "EV/EBITDA", why: "Neutralises capital-structure shift from debt-funded NPC acquisition and rising WC debt; PAT thin/volatile (4.3% margin) vs EBITDA (10.1%) FY25 consol"}
  secondary: {method: "SOTP (sum-of-the-parts)", why: "FY25 accounts blend steady-state steel-pipe segment (Rs211.91 Cr result) with one-off real-estate segment (Rs44.26 Cr result); blended multiple misprices the one-off land monetisation"}
  tertiary: {method: "EV/tonne of installed capacity (replacement-cost cross-check)", why: "Company's own NPC build-vs-buy framing (~Rs960 Cr for 430k MTPA vs ~Rs1,500-1,600 Cr greenfield) gives explicit capex-per-tonne reference"}
  not_applicable: ["DDM - growth-capex phase, low payout priority", "Trailing P/E on unadjusted blended PAT - distorted by one-off real estate segment profit", "Same-store/comparable-unit growth analysis - not meaningful for project/order-based revenue"]
irrelevant_ratios:
  - {ratio: "Headline gross margin % in isolation", why: "Swings with steel input price, not operational efficiency"}
  - {ratio: "Trailing P/E on reported blended PAT", why: "FY25 PAT includes Rs44.26 Cr one-off real estate segment profit alongside the core steel segment"}
  - {ratio: "Single-quarter YoY revenue growth", why: "Order-book shipment timing swings quarterly revenue (Rs774 Cr to Rs1,166 Cr across FY26 quarters) independent of demand"}
  - {ratio: "Dividend yield/payout as value signal", why: "Company is debt-funding a capacity-expansion phase (NPC, Jammu)"}
  - {ratio: "Stated receivable-days terms (0-60 days)", why: "Actual standalone receivables turnover fell to 3.17x, diverging sharply from stated policy"}
  - {ratio: "ROE/ROA unadjusted", why: "Distorted by a sizeable unrelated quoted-equity treasury portfolio"}
must_track_metrics:
  - {metric: "Order book (Rs Cr) and bid pipeline (Rs Cr)", healthy: "flat-to-rising sequentially; FY25 order book ~Rs2,500 Cr, bid pipeline ~Rs15,000 Cr (AR p.8)", red_flag: "order book falling two quarters running"}
  - {metric: "EBITDA margin (%)", healthy: "stable-to-rising; FY25 10.1% to FY26 13.0% consol (Inv. Pres. p.23)", red_flag: "sequential compression >200bps"}
  - {metric: "Inventory turnover / trade receivables turnover (x)", healthy: "stable or improving from FY25 standalone 4.37x / 3.17x", red_flag: "further deterioration for two consecutive years"}
  - {metric: "Debt-equity ratio", healthy: "stable near 0.25-0.28x (AR p.176/248)", red_flag: "rising materially without matching EBITDA increase"}
  - {metric: "FOB export earnings vs foreign exchange outgo", healthy: "gap narrowing or explained by capex-linked imports", red_flag: "persistent unexplained widening (FY25: Rs1,487 Cr earnings vs Rs2,166 Cr outgo, AR p.79-80)"}
unit_economics:
  unit: "1 metric tonne (MT) of finished, coated line pipe"
  revenue_per_unit: "NOT FOUND - no disclosed sales volume in tonnes or realisation per tonne"
  margin_per_unit: "NOT FOUND in absolute terms; raw material was 74.7% of standalone FY25 revenue (AR p.121), implying a manufacturing/coating spread of roughly the balance before other costs"
  key_lever: "Capacity utilisation against ~1.2Mn MTPA (1.6Mn+ post-NPC) - fixed costs (employee 2.3% of revenue) are small relative to variable material cost, so EBITDA margin expands as utilisation/mix improves"
first_deterioration_signals:
  - {risk: "Revenue model - order book fails to convert / bid pipeline win rate disappoints", first_signal: "Order inflow/order book falling sequentially without matching revenue recognition"}
  - {risk: "Margin - steel input price rises faster than order pricing absorbs", first_signal: "EBITDA margin sequential compression and cost-of-materials/revenue ratio rising"}
  - {risk: "Balance sheet - WC build outpaces revenue, funded by rising short-term debt", first_signal: "Inventory/receivables turnover falling further alongside rising short-term borrowings"}
  - {risk: "Execution - NPC/Jammu/Dammam integration or ramp slips vs March 2027 guidance", first_signal: "Capex-incurred-vs-plan or stated production-start date slipping in subsequent disclosures"}
  - {risk: "Structural - export-market disruption or loss of approved-vendor status", first_signal: "FOB export earnings falling YoY or export share of segment revenue dropping sharply"}
mgmt_questions:
  - "What is current capacity utilisation at Anjar and Pithampur individually, and what utilisation is assumed for NPC's 430,000 MTPA by FY27/28?"
  - "How is the price-cost spread on the order book protected if steel input prices move against a fixed-price order between booking and shipment?"
  - "Of the ~Rs15,000 Cr bid pipeline, what is the realistic historical win rate and conversion timeline into firm order book?"
  - "If the Merino Shelters JDA developer delays or defaults, what happens to the Rs368.60 Cr of FY25 Real Estate segment revenue already recognised against only Rs70 Cr cash received?"
  - "Standalone trade receivables turnover fell from 7.02x to 3.17x in one year - is this a structural shift to longer export/PSU credit terms, or a collection problem?"
  - "How much of NPC's US$120mn opening order book and Aramco-vendor status is contractually transferable, and is there key-relationship risk in the transition?"
  - "What is the funding plan for remaining Jammu capex and the Dammam coating plant, given consolidated debt-equity already rose to 0.28x in FY25 before NPC acquisition debt was added?"
one_line_verdict: "Order-book steel pipe manufacturer with thin, price-taking spread economics and a lumpy non-core real estate tail."
analyst_note: "Archetype is a hybrid: order-book business (revenue visibility from order book/bid pipeline, lumpy quarterly shipment-based recognition) layered on commodity-converter economics (74.7% raw material cost, spread capture not price setting). Revenue is recognised point-in-time on delivery, not percentage-of-completion, so this is closer to build-to-order manufacturing than classic EPC accounting. FY25 real estate segment profit (Rs44.26 Cr) materially aided consolidated PAT and must be stripped out for any recurring-earnings view. NPC (Saudi) is a post-AR structural event, not in the FY25 evidence base used here; downstream stages should treat NPC's contribution as unverified against audited financials until FY27 numbers exist."
