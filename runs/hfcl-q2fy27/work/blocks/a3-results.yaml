analyst_note: "Profit is moving out of the parent. Consolidated PAT exceeds standalone by 47.1% (Q1 37.1%). Four subsidiaries reviewed by one joint auditor earned Rs123.40 Cr, 31.3% of group PAT, double Q1. NCI can only come from HTL or Raddef. Parent gross margin fell 352 bps while group margin held, and parent payables exceed group payables, so intra-group trade is large (Rs1,544 Cr eliminated in Q2). Transfer pricing is the lead question. The 80% guide is soft on a consolidated basis (H2 can run 12% below Q2) and tight on standalone; the basis is unstated. Turnkey's Q2 loss equalled 90% of its revenue while its net capital rose, and its liabilities fell Rs185 Cr: unwinding or paydown is unresolved. Three balance-sheet items lack an explanation: a Rs261 Cr non-parent rise in other current assets, a standalone-only held-for-sale group (nil consolidated, so the buyer may be intra-group), and a Rs30.6 Cr other-equity debit that matches Re0.20 per share. Para 7 subsidiaries earned Rs186.19 Cr in H1, but their cash fell Rs0.29 Cr."
