top_moat_risks:
  - "D1's underwriting edge has not prevented a full asset-quality cycle: GNPA rose 3.2%->4.77% (Mar-24 to Mar-26) before improving; no peer data was available to test the relative-quality claim, and the 'hard to replicate' characterisation is sourced to a CRISIL report Aye itself commissioned and paid for."
  - "G1's 42%+ CRAR is largely a post-IPO capital-infusion artefact (vs 32.8-34.9% pre-IPO); guided 25-30% FY27 AUM growth will rebuild gearing over 2-3 years, and rating upgrades are conditional on asset quality staying below ICRA's own 5% 90+dpd and 4.5x gearing sensitivities."
  - "C1's repeat-loan stickiness rests on a single maiden concall's data with no multi-quarter record, and concentrates exposure in existing customer relationships."
  - "A3's opex gains partly reflect deferred cost recognition (1,300-1,400 new mortgage staff not yet fully monetised) rather than pure automation, and would partially reverse if mortgage AUM growth disappoints."
  - "R1 (PSL funding channel) is shared with every MSME-focused competitor and is explicitly disclosed as reversible if RBI PSL classification norms change, with no company-specific hedge."
