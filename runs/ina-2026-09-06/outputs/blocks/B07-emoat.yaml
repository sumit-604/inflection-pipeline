combined_assessment: "AVERAGE"
combined_reasoning: "Core AVERAGE (B01) plus Emerging Moat NONE (9/92, below the 12-point floor) is not the GOOD/AVERAGE-plus-EXPANSION transition setup this pipeline hunts, so the combined classification stays at the Gate 0 ceiling rather than elevating."
top_moat_risks:
  - "Cell-line COD has three inconsistent dates in the corpus (Q3 FY27, Q4 FY27, Dec-2026); a fourth slip or inconsistency is the single largest risk to the one real emerging-moat category (B1)."
  - "Aluminium frame capacity was cut ~67% (54,000 MT to 18,000 MTA) with no acknowledgement anywhere in the corpus, evidencing a pattern likely to recur on the larger cell and wafer programmes."
  - "Named large orders (NTPC/MEIL/L&T/RREC, Inv. Pres. slide 25) are sourced only from the company's own presentation; the order book has already been reported on three non-comparable bases across three calls (B05)."
  - "The ALMM/ALCM regulatory tailwind (R1) is shared equally with Waaree, Premier Energies and Websol by management's own account, and the presentation's own slide discloses an ALMM-II exemption extension that loosens, not tightens, near-term enforcement."
  - "Every forward category in this scan is funded by, and dependent on, a leverage-up/cash-flow-negative balance sheet (FY26 CFO -Rs73.13cr) built by a management team B05 grades D on promise delivery."
analyst_note: "The presentation and concalls describe a company mid-transition up the solar value chain. The primary documents support only one leg of that story with real capital: the cell line under construction. Every other forward claim (wafer, BESS, exports, MP subsidies, large-customer partnerships) is unbacked by a financial-statement line, and several headline claims (R&D focus, export diversification, dealer-network depth) are directly contradicted by the company's own BRSR disclosures in the same annual report. Given B05's Grade D finding and this scan's independent discovery of an unacknowledged 67% capacity cut, the cell line's own guided dates and margin uplift should be treated as unverified until at least one quarter of actual segment results exists."
