analyst_note: "Score 7.8 uses a strict rule: a row scores only when a dated, anchored item shows a company-specific advantage forming and no same-corpus evidence offsets it. That kept E2, G1, G2, C2, C1, F1, H2 at zero and in the register. Crediting all of them at the 0.7 minimum gives 12.7, so the NONE call is a rule choice, not a wide gap. The separating observation is filed A&D rupees or an order value. Treat the A&D 11% as a company slide until the FY27 AR industry split. The 49.1% embedded-growth figure is a ceiling for the unfunded approval; only 1.9% sits in CWIP. FY26 turnover is not causal because FY26 capex was mostly solar."
