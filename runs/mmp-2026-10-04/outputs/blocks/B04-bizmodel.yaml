  - {risk: "Associate profit not backed by cash", first_signal: "Associate share of PBT above 20% with Star dividend near 9.98 L"}
  - {risk: "Supplier dependence for foil stock", first_signal: "Foil volume and foil gross margin in a quarter where stock prices jump (AR25 named Hindalco; AR26 does not)"}
mgmt_questions:
  - "What are the powder tonnage sold in FY26 and the split between commodity grades and value-added or export grades? Reassures: tonnage and EBITDA per MT disclosed and tied to the 37,000 to 42,000 guide. Worries: no volumes, only 'better realisations'"
  - "How fast does an aluminium ingot price move reach customer prices, by segment? Reassures: a stated lag of weeks and a price formula. Worries: 'mostly yes, some resistance' with no formula (Call p.18)"
  - "Who supplies foil stock and ingots today, on what contract, and what share of foil cost is stock? Reassures: two or more suppliers and a formula. Worries: one supplier as in AR25"
  - "What is the FY27 funding plan for about Rs 63-70 Cr of near-term capex and the Rs 85-90 Cr LT cable programme, and what is the debt ceiling? Reassures: named split of internal accrual, term debt and equity within net debt to equity of 1.0. Worries: more working-capital lines"
  - "What insulator order, approval and revenue milestones will be met by Q3 FY27 against the May guide of Rs 18-20 Cr for FY27, when Q1 FY27 was Rs 0.5 Cr? Reassures: dated approvals and first utility orders. Worries: guide cut or slippage to FY28"
  - "Why did the foil segment earn 2.00% while foil revenue grew 39%, and what price-per-MT premium do printed and lidding foil earn? Reassures: product margin per MT disclosed. Worries: foil stays a volume business"
  - "What will Star Circlips supply to MMP Electricals once its forging plant runs, at what pricing method, and what dividend will Star pay? Reassures: arm's length benchmark and rising dividend. Worries: closed related-party loop with no price test"
one_line_verdict: "An aluminium converter with a 61% powder core earning about 12% segment margin, a 26% foil arm earning 2%, and three start-ups that must prove themselves before the transition thesis exists."
analyst_note: "Two readings of the FY26 margin fall. Reading A: fire plus start-up drag, so margin recovers. Reading B: structural dilution, because foil (2.00% segment margin) supplied 46% of revenue growth and conductors fell from 8.27% to 4.86%. Segment arithmetic gives mix -0.36 pts and within-segment rate -1.05 pts of the -1.41 pt fall, so B explains more than the fire alone, but the rate effect includes the 329 L insulator start-up loss and the conductor drop. Separator: Q2 and Q3 FY27 segment margins for powders (back to 12.4%?) and foils (above 2%?). Powders are not a pure converter: the specialty share is NOT FOUND, so Stage 11 must not assume either archetype for the whole segment. B00 mix label is wrong (62/26/12 is FY26, Q1 FY27 is 66/26/7). The May 2026 call carries per-MT EBITDA guidance that no filing lets us check, since volumes are not disclosed."
