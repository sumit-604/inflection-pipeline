analyst_note: "The deck sells a mix shift that its own numbers do not yet show. EBITDA margin fell in every period shown (20.54% FY24 to 17.42% H1 FY27), FY26 incremental ROCE was 5.2%, and 75.9% of H1 inflow is 20 MVA units the old plant can make. The 200 MVA / 220 kV claim on eight slides is qualified only on slides 30-31 ('Factory capacity alone does not establish eligibility'), and two H1 orders read 330 kV, above the stated ceiling. Working capital held flat only because payables days went from 103 to 168; the deck shows the improving receivables ratio and omits the half-year balance sheet and cash flow, where CFO was negative and cash near zero. Danya: consolidated raw material sits below standalone in all three years and Danya payroll is about Rs 0.2 Cr a year, so the 'execution backbone' reads as a labour-light conduit [INFERENCE] with promoters holding the other 10%. Reading 1: approvals land, Kannur fills with large units, payables normalise from operating cash. Reading 2: growth stays in 20 MVA units, margins keep slipping, and the warrant call funds the gap. Separating observation: H2 FY27 EBITDA margin and large-unit revenue share."
