analyst_note: "Vendor market numbers do not isolate Avana's niche, so the SAM is a labelled proxy and the 25% / 22% SOM CAGR rests on a share-gain path, not a measured market. The two readings: (a) share gain of 2 to 3 points on a 7.7% market, which gives 25% then 22%; (b) grid unit growth, where CEA targets imply +40% in FY27, which would let Avana grow faster than the SOM without any share gain. The one observation that separates them: CEA FY27 transformation additions against the 158,339 MVA target, plus Avana H1 FY27 order book and product split. Per rule, no conservatism was shaded into the SOM; size carries it. Stage 11 should use 25.4% (yr3) as the forward cross-check, and treat capacity above ~170-177 Cr as needing outsourcing or extra capex."
