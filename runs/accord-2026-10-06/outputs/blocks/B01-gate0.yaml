block_b_trend: "improving in latest year (FY26 CFO +8.70 vs FY25 -8.18; WC days 145.4 to 108.3) but cumulative CFO/PAT FY23-FY26 is -0.18 and the FY26 CFO is a receivable release, so not yet shown durable"
analyst_note: "Core 65 would read GOOD; the AVERAGE label comes only from deal-breaker 4. Cash conversion is the one weak block (B 2 of 20) and it is a working-capital timing story: FY24 and FY25 consumed Rs 13.0 Cr of CFO as receivables rose from Rs 6.8 Cr to Rs 28.5 Cr, then FY26 gave back Rs 13.5 Cr. Whether that is repeatable depends on whether the H1 FY27 revenue jump (Rs 52.68 Cr) rebuilds receivables. FY26 ROCE 13.3% is depressed by Rs 22.3 Cr of IPO cash (ex-cash about 24%), not scored. The Rs 8.26 Cr rise in loans and advances is mostly vendor advances (Rs 5.93 Cr rise) with no named counterparty; it absorbed Rs 9.09 Cr of CFO. Margin FY26 10.0% (EBITDA, screener) is down 1.6pp from FY25 on lower revenue."
