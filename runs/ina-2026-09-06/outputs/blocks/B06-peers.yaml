analyst_note: "Q7 is the load-bearing finding: the LC-receivables mechanism is real and sector-standard (Websol), but the peer using it converted 84% of PAT to cash while INA converted none. This reframes INA's cash flow problem from a financing-terms story to a company-specific collections/concentration story, and should be weighted accordingly at synthesis. Q5's post-corpus ALMM deferral (June to December 2026) is new information no INA stage could have surfaced and should be carried forward as a fresh timeline risk to the cell-integration margin bridge."
