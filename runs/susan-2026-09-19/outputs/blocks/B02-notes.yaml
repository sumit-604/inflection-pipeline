analyst_note: >
  Pass 3 pattern re-read (contradictions, face-statement tie-outs, thin
  disclosure, restatements, subsequent events, going concern) found no
  material new findings beyond Pass 1 and Pass 2; it sharpened existing
  findings using targeted full-text checks (going concern, restatement/
  reclassification keywords, remuneration-ratio boundary check) rather than
  surfacing new items. Accounting quality scored 4/10, driven down mainly
  by disclosure transparency (3/10) and consistency with prior years
  (3/10) once the RHP's own restatement work is read against the AR: the
  company's FY24/FY25 as-filed audited accounts required correction for
  statutory gratuity, bonus and MSME-creditor interest, and Note 3's FY26
  prior-period reserves charge is shown to be a mis-dated FY25 item. No
  auditor qualification or going-concern uncertainty exists anywhere in
  the corpus, and revenue-recognition policy, depreciation useful lives
  and related-party loan pricing are genuinely clean. Two items remain
  unresolved even after the RHP cross-read: the counterparty behind the
  FY26 Aluminium Rod trading volume, and the FY25 customer that alone was
  35.53% of that year's revenue (both anonymised in RHP tables) -- these
  are downstream verification targets, not gaps in this stage's reading.
