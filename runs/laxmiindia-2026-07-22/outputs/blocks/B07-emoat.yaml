flags:
  - type: FLAG-F2-GUIDANCE-MISS
    reason: "Q1 FY26 call (Aug 2025) guided to 35-40% AUM growth, ~50% PAT growth, 40-45% more branches, 100-125bps cost-of-borrowing cut, and at least a two-notch rating upgrade for FY26. Actual FY26 delivery: 27.35% AUM growth, 38.34% PAT growth, 11.4% branch growth (+18, vs 158 base), 68bps cost-of-borrowing cut, one-notch rating move (A- Positive to A Stable). Every headline metric under-delivered in the maiden post-IPO year; treat all forward guidance in this name with a discount until a second year of guidance is judged."
  - type: FLAG-DIGITAL-NARRATIVE
    reason: "Digital-channel share of disbursement (by value) declined from 1.70% (FY24) to 0.94% (FY25) even as investor materials market a 'digital-first operations' identity (Inv. Pres. slide 19). Branch/DSA sourcing remains >99% of volume. D2 scored WEAK despite the marketing framing."
  - type: FLAG-DA-COUNTERPARTY-RISK
    reason: "The same PSL/DA-assignment mechanism scored as a regulatory/funding tailwind (R1, B3) also transmitted the FY26 Up Money Ltd counterparty default onto LIFL's book (GNPA 2.13% including the pool vs 0.80% ex-pool, FY26). The lever cuts both ways; do not credit R1/B3 without this caveat."
  - type: FLAG-BTA-STATUS-UNKNOWN
    reason: "Business transfer agreement (₹533.34mn book acquisition, DRHP p.195, signed pre-IPO) — closing/completion status NOT FOUND in any of the four post-IPO concalls or the investor presentation read in this stage. Confirm status before crediting H1 further at synthesis."
