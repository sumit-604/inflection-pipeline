analyst_note: "No company TAM claim exists in the corpus (management cites third-party reports for context but never sizes its own market). mgmt_claim_cr/ratio/read above are therefore repurposed from the framework's default (claim vs conservative TAM) to test the one number management does claim, the 'triple in three years' growth target, against this stage's conservative 3-year SOM, per this run's LBF3 instruction. Headline TAM uses Method 3 (peer aggregation) over Method 1 (macro top-down) because Method 1's scope is too broad to be the operationally relevant market TLL competes in; Method 1 is retained as context. Stage 11 should re-run the 3C capacity cross-check once B07's capex-embedded-growth figure is available, as this stage substituted AR CWIP and deck utilisation data in its place."
