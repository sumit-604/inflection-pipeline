verdict_basis: "CMD compensation ceiling raised twice in ~12 months (Rs72L->Rs84L) plus a new Rs48L FY26 payment to the promoter's spouse as Non-Executive Director (18.4x median employee pay), both against +2.1% revenue growth and negative CFO in both years, evidence a promoter-family compensation-extraction pattern that outweighs an otherwise clean legal, auditor, and pledge record."
analyst_note: "No deal-breaker fires: clean SEBI/criminal/civil record, same statutory auditor throughout with unmodified opinions, zero pledge, and the promoter is a net personal financer of the company (loans in, not out) even through the cash-stressed FY26 year. The CONCERN verdict rests on one well-evidenced, quantifiable dimension (family compensation rising against weak delivery) plus a cluster of CAUTION items (CS turnover, filing-quality corrections, EGM/Postal-Ballot mechanism confusion) that echo B02/B03's independently-found drafting-control weakness. Treat this as a CONCERN with modest offsetting transition evidence (creeping promoter buying, zero pledge), not a static one: the promoter is not draining the company, but is extracting more of its profit through family pay as growth stalls. Synthesis should weigh this alongside FLAG-CASH; both flags trace to the same FY26 (weak growth, negative CFO)."
