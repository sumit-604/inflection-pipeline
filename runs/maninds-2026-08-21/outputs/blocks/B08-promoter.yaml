analyst_note: "The ~5pp promoter-holding drop into Sep 2025 flagged in the leads is NOT a sale or pledge invocation: it is dilution from a Rs255cr preferential issue to credible non-promoter investors (Kacholia, Carnelian, Ovata Capital) funding Jammu/Saudi capex. Pledge share count (65,00,000) is unchanged since FY25; its falling percentage is a denominator effect, not a release. Two separate AR facts happen to share the figure Rs97.68cr (Limitless Contracting loan payable vs a subsidiary's CARO short-term-fund-use qualification) — verified as distinct, not conflated. Primary-source SEBI/Business Standard/Trendlyne pages were blocked by network egress; all adverse findings were still corroborated across 2+ independent secondary sources before being recorded."
