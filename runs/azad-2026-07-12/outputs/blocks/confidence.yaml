# Full four-component confidence delta (phase 1 + phase 3), orchestrator-computed from B12a-d
confidence_delta:
  numerical_acceptance: 96       # B12a: 0 CRITICAL, 0 MAJOR, 1 MINOR
  redflag_coverage: 92           # B12b: 12 of 13 independent flags caught upstream; concurs grade B
  framework_adherence: 100       # B12c COMPLETE: gate0 47 + emoat 36 + valuation 50 = 133 rules, 0 fails
  peer_utilisation: 100          # B12d: 10 of 10 peers substantive, all citations resolve
  overall: 92                    # min of the four
  band: "high (>=90)"
  rework_triggered: false        # no B12a CRITICAL, no verifier acceptance <60
