analyst_note: "Gate 0 score (68, AVERAGE) is pulled down by four loss years FY21-FY24 sitting inside the 6-year P&L window. The last two years show a real inflection: PBT and CFO turned positive, EBITDA margin reached 12.6%, and the AR's own ROCE reached 8.82% FY26. But three deal-breakers still bind, all rooted in the FY21-FY24 losses: median ROCE below 10%, cumulative CFO/PAT distorted by those losses, and PAT was negative in FY24, one of the last three years. Working capital is deteriorating, not improving: WC days rose from 24 to 53 even as absolute CFO improved, mostly on payable-days compression rather than receivable discipline. Block D's clean 20/20 reflects one-time IPO cash and near-zero post-listing debt, not operating deleveraging. Moat score (STRONG, 4/12) rests on demonstrated margin expansion and zero revenue-decline years; against real peer data Capillary's FY26 EBITDA margin (12.6%) sits below all three named comparators (17.3-25.8%) and its market cap is mid-pack, 3rd of 4. The brand test (M9) stays unscored, not for missing peers but because none of the four companies report a cost-of-revenue line that supports the rubric's gross-margin proxy. Promoter-holding 3-year trend is not computable; only 3 quarters of BSE data exist since the Nov-2025 listing."
