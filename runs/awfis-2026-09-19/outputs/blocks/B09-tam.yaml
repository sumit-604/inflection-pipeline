analyst_note: >
  Two things a downstream stage cannot reconstruct from the fields alone.
  First, the conservative/realistic TAM divergence (Rs16,200 Cr vs
  Rs52,200 Cr, co-working) is not a genuine range of opinion about market
  size; it is the gap between a data-availability floor (only 6 of 500+
  national operators individually priced) and a figure cross-validated
  twice by the same research house family two years apart. Treat the
  conservative number as lower because fewer competitors could be named,
  not because the market is smaller. Second, the capacity-vs-SOM gap in
  3C (Rs180-190 Cr) inverts depending on track: conservative says Awfis
  is over-building; realistic says the capex plan is right-sized. Given
  Awfis's credibility grade C (B05) and its occupancy plateau contradicted
  by all three peers (B06), this stage recommends Stage 11 weight the
  realistic-track SOM CAGR (~14-16% combined) as the primary cross-check
  on revenue growth, while still naming the execution risk that capex may
  be sized for a market larger than Awfis is currently proving it can
  fill.
