model: claude-sonnet-5
status: complete
input_gaps:
  - "Direct named competitors NOT FOUND in AR/RHP/either investor presentation; both describe competition generically ('domestic and international engineering companies')."
  - "FY26 Related-Entity vs third-party procurement cost split NOT updated in the AR (RHP table covers only FY23-FY25); check concall or post-listing filing."
  - "Post-listing order-booking / offer-submission / proposal-to-order conversion-ratio KPIs NOT disclosed in the FY26 AR (RHP-era table not repeated); check concalls."
  - "FY26 employee headcount NOT FOUND: 'The exact number of employees has not been disclosed in the audited financial statements provided' (AR p.45 txt)."
