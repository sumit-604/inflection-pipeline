going_concern_language: "NONE - no going-concern qualification, emphasis-of-matter, or material-uncertainty language found in the Independent Auditor's Report (p.41) or in the Notes; consistent with an unqualified opinion, PAT-positive results both years, and DSCR of 38.15x (Note 51 p.77)"
analyst_note: "The single most decision-relevant tension in these Notes is that FY25 looks excellent on the P&L (PAT +48%, revenue +14%) but fails on cash (OCF -Rs35.46 Cr) and on capital efficiency (ROCE -19.8% relative). Both failures trace to the same root: a large, largely-unexplained raw-material and receivables build funded by IPO cash, not operations. Layer onto this an RPT base at 15%+ of revenue concentrated in one promoter's group, with one transaction (SMT Packaging land advance) disclosed at a fraction of the depth given to the largest one (Atlas). Individually every item here is disclosed (nothing is concealed outright); collectively the pattern of tie-failures across the filing means downstream stages should treat any single unverified AR figure as provisional pending cross-check, not as self-evidently reliable."
