analyst_note: "Core 69 with 7 of 12 moats gives GOOD+ (FORTRESS moat, but Core is under 80). Four moat scores are formula artefacts: M1 and M2 ride the margin step from 5.9% to 19.5% and a 3-company peer set; M9 compares a 40.6% gross margin proxy to peers with different cost lines; M11 tests growth, not network effects. Block B is the weak point: CFO/PAT 0.58 and FCF/PAT 0.17 because inventory (+7.72 Cr) and capex (7.50 Cr) absorbed FY26 cash. Block A median ROCE 17.8% reflects FY20-FY22 at 7-18% before the FY24 step-up. FY20-FY22 payables and capex missing shorten the B2/B3/B4 windows. Margin fell to 18.1% in H2 FY26."
