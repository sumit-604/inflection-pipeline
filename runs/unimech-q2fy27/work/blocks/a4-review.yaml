analyst_note: "Operations beat every thesis line: core PBT +250.8% YoY, margin 39.84%. OI fell to 15.5% of PBT, but what is left is lower quality. H1 interest is Rs 3.69 Cr; market gains and one-offs carry the rest. The bear content is in disclosure and capital. The firm book shrank while the headline tripled on non-binding LTA and award value. The cash upgrade missed by 0.004x. Treasury is gone after Hobel, debt is rising, and dilution is pulled into early CY2027. Hobel cost Rs 450 Cr, about 5.6-7.0x EBITDA on non-filed inputs. The bear reading is a peak-year price on data-centre gensets with 93% concentration. Loop 1 withdrew the unanchored SAR 60M Saudi figure. The filed USD 30 Mn joint investment covers JV capex. Unimech's remaining 51% share, about Rs 108 Cr, exceeds its Rs 65 Cr net cash. The 65% utilisation includes qualification capacity, so the red line is untestable on a serial basis. The Honeywell LTA runs from 1-Apr-2026, 208 days before its intimation. The ASR 'Hobel 30% of H1' still decides the organic read. Credibility is C on one scored call."
