analyst_note: "Run 2 (rework). Corrected three of five audit items upward for TLL (EBIT basis, M4 tier, M5 score) and confirmed a genuine data find on the fourth (FY24 Purchase of Fixed Assets, Rs 16.45 Cr, from the FY25 AR's own comparative column -- the audit itself only cited FY25/FY26). None of the five corrections moves the classification: AVERAGE holds on the same two deal-breakers as run 1 (Block B <8; cumulative CFO/PAT <0.50), both untouched by any of the five items, because Block B's inputs (CFO, WC days) are not EBIT-, tier-, or net-worth-basis questions. Core rose 48->52, moat 10->15 (THIN->MODERATE), grand total 58->67. The cash-generation floor is the real finding this scorecard carries forward, and Stage 3's independent true-CFO re-derivation (-Rs 4.77 Cr FY26 vs +Rs 4.69 Cr printed) makes that floor look worse, not better, once the undisclosed addback is removed -- carried as a sensitivity, not scored, per Gate 0's mechanical mandate."
