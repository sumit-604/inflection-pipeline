verdict_basis: "No deal-breaker and no red-rated dimension; six of ten scorecard dimensions carry CAUTION, clustered on one theme -- disclosure quality around the AMW subsidiary (RPT loan/DTA, zero-KAM audit, low Audit Committee Chairman attendance) plus one undisclosed Customs SCN -- while the ownership/alignment axis shows genuine, quantified positive momentum (pledge to zero over five years, fresh Sep-2026 promoter buying, MD pay falling with performance)."
analyst_note: >
  The AMW subsidiary is the single thread connecting this stage's caution
  items: the Rs 133.15 Cr related-party loan and its DTA sit inside a
  zero-KAM audit opinion from a regional (non-Big-4) firm, overseen by an
  Audit Committee Chairman who missed 80% of FY26 Board meetings. None of
  this is evidenced wrongdoing; it is a concentration of "not explained
  clearly enough" sitting on top of B02/B03's independently-found AMW
  reserve/DTA/land cluster. Treat B02, B03 and B08 as three lenses on the
  same underlying entity, not three separate concerns, when sizing any
  AMW-linked contribution to equity, ROE or ROCE. Separately, the
  Customs SCN is financially immaterial (~Rs 1.84 Cr, already repaid) but
  its absence from a AR signed after the SCN was received is a real
  representation-accuracy point worth a direct management question at
  Halt 1, independent of the SCN's own resolution.
