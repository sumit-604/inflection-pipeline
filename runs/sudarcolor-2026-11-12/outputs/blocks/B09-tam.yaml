analyst_note: "Two readings of the SOM. Reading one: the Indian entity rides the market at 4.1% a year (share flat at 7.2%, third-party Rs 665 Cr at yr3). Reading two: it gains 1.5pp of share in 3 years (the normal 1-2pp band), giving 10.9%. The observation that separates them is third-party revenue growth in H1 FY27, which the filings do not split; third-party revenue was flat in FY26 (589.23 vs 590.15). SAM is a ceiling: product fit is the only filter evidenced, so customer and capability filters remain NOT FOUND. To reach 25% earnings CAGR on 10.9% revenue growth, operating margin must rise from 7.42% to 10.6% by yr3 (H1 FY27 was 12.2%)."
