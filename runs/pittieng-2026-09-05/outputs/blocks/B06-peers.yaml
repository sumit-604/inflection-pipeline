industry_cross_read:
  demand: "All three peers describe a strongly supportive FY26-27 domestic environment and recovering exports; the one clear tension with Pitti's own story is that RKFORGE's comparable railway business is accelerating while Pitti's railway revenue share is declining."
  pricing_inputs: "Steel/raw-material pass-through is common ground (RKFORGE, quarterly lag; Pitti, quarterly reset), but energy and shipping costs are a recurring, non-pass-through drag industry-wide, not a one-off Black Swan as Pitti's own framing suggests; VILAS's unhedged, opportunistic CRGO margin model is structurally more exposed than Pitti's claimed reset mechanism."
  capex_cycle: "Not a uniform capacity race. SANSERA is racing (confidently, self-funded) in ADS/aerospace-semicon; RKFORGE just finished a debt-funded multi-front wave and is now consolidating; VILAS is incremental and cash-funded. Pitti's debt-funded Rs 290 Cr commitment sits closer to RKFORGE's margin-compressing playbook than to SANSERA's or VILAS's discipline-preserving one."
