    reason: "Stage 6 peer evidence (TRIVENI, BALRAMCHIN concalls) confirms structural national ethanol
      overcapacity: installed capacity ~1,995-2,300 cr L vs national offtake only ~1,100-1,350 cr L. This caps
      realistic SOM utilisation below management's own 80-85% target and is the dominant TAM risk (Section 4B)."
