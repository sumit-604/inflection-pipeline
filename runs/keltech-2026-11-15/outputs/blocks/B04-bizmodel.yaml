one_line_verdict: "A thin-margin explosives converter with a licence-and-footprint moat; its worth hangs on an undocumented TNT plant; fits Cables / Industrial products (25x) today."
analyst_note: "TNT has two readings. A: defence or merchant energetics bet (brief). B [INFERENCE]: partly backward integration into own accessories (cast boosters, PETN; AR p.29, p.55 'Accessories Project'), supported by CRISIL's 'established clientele' wording (CRISIL p.2). Separator: a licence or offtake naming a defence buyer, or first booked revenue outside the explosives and perlite segments. Operating leverage forks too: reported incremental EBITDA margin 6.8% vs like-for-like 22.8% (FY25 884.72 lakh item); H1 FY27 leans to the weaker reading. Converter traits are present; Amendment 17 applicability is for stage 11. Sector cap row fits 96.5% of revenue today; a TNT slice on the Defence row needs a documented buyer first."
