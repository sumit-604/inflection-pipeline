analyst_note: "Four things a later stage cannot rebuild from the fields. (1) The Rs 187.8 Cr and Rs 358.3 Cr on the Q2 call are STANDALONE revenue from operations (R2 p.3); Rs 190.94 Cr and Rs 363.53 Cr are CONSOLIDATED (R2 p.9); conflicts.yaml row closes. (2) The July tripwire 344 is CARE's working-capital cycle at 31 Mar 2026 (rating rationale p.3: 262 + 163 - 80); management's 200 and 160-180 targets have no stated basis. (3) H1 FY27 OCF improved 307 Mn standalone from operating profit and lower tax; the working-capital line was 3 percent worse; no call states recourse for the bill discounting lines. (4) Grade C is the tracker count, not tone; two readings and the separating observation (Q3 FY27 OCF source, defined days, RR batch, second engine) are in 4C. Net debt on the Q2 call does not tie to the balance sheet."
