analyst_note: "Three points a later stage cannot rebuild. (1) SAM is management's Rs 27,500 Cr programme pool spread over FY27-FY31 with 10.5% annual growth (Rs 4,460 Cr in FY27); on a 4-year spread the SOM CAGRs rise about 2pp (yr3 17.9, yr5 15.8). The slip of QRSAM and Su-30 awards separates the two. (2) The SOM uses a 4pp share gain (mid of the 3-5pp aggressive tier) because capacity is a gap and execution is mixed (B05 grade B); 3pp gives 14.8% and 5pp 17.5% for yr3. (3) Current share is already 24.8% of the pool, so headroom comes from pool growth and award timing, not share capture. The guided FY28 Rs 1,600 Cr equals the FY29 SOM. The 6-7x claim exceeds the FY31 SAM."
