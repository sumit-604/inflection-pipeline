  demand: "All three peers report a consistent, strengthening 2W/3W/PV/CV growth trajectory across Q2FY26-Q1FY27 driven by GST 2.0, festive demand and EV adoption; corroborates INEL's framing though peer Q1FY27 pace (22-23%) runs ahead of INEL's own 20% comparator."
