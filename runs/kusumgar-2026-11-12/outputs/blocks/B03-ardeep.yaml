strengths_top3:
  - "Low leverage and no restatement: net debt to EBITDA 0.93, debt to equity 0.44, restatement adjustments nil in all three years (Prospectus p.346, p.335, p.296)."
  - "Revenue mix has moved away from two single-order dependencies: Industrial/Automotive +46.37% and Outdoor/Lifestyle +120.24% in FY26; A&D share fell from 76.87% to 54.64% (derived, p.340); H1 FY27 revenue +90.7% and PBT 1,106.69 vs 222.98 (Q2FY27 results p.10)."
  - "Capacity built ahead of demand: installed final-output capacity 46.86 to 127.80 million metres (p.204), from 2,543.67 INR mn of three-year capex (derived, p.283); debt to equity 0.44 after the 1,244.94 CCPS raise (p.283, p.335)."
red_flags_top3:
  - "Cash conversion: receivables 561.10 to 2,332.79 on revenue down 11.2%; 123 debtor days; FY26 CFO 282.58 = 15.0% of EBITDA; 3-year free cash flow -1,801.21 (Prospectus p.279, p.283, p.41)."
  - "Foreign-currency receivables 1,671.82 (226 days, derived) at an implied 123.0 INR per USD against 92.8 and 95.3 elsewhere in the same note; only 8.6% hedged; ECL allowance cut from 68.67 to 62.45 (p.344, p.324, p.302)."
  - "Promoter-linked flows and weak independent corroboration: 100% OFS of 6,500 INR mn, ECFPL bought from promoters at 10.1x net assets, CRISIL 'issuer not cooperating' BB- action and bank guarantee of 1,038.77 with no beneficiary (p.118, p.235, CRISIL p.1, p.378)."
best_fit_strategy: "GARP - WATCHLIST (Turnaround - WATCHLIST); no strategy passes outright until receivables convert to cash"
one_line_verdict: "H1 FY27 earnings rebound is real on paper (revenue +90.7%, PBT 5x) but the FY26 balance sheet, 15.0% cash conversion, 8.6% FX hedge cover and 100% promoter sell-down mean the thesis rests on unproved collections; WATCHLIST until receivable days fall below 90 and CFO/EBITDA clears 50%."
analyst_note: "Reasoning a later stage cannot rebuild. (1) Capacity: 94.33/42.32/49.50% is final-output factories only (KPI 12, p.124; table p.204); whole-company 87.02/56.36/52.24% is MD&A p.343. MD&A p.343 prints FY24 final output 48.86 but p.204 prints 46.86. (2) Customer 1 FY26 751.27 is 10.86% of revenue from operations, yet Note 45(c) shows 0.00%. (3) ECFPL valuer is named on p.235, which closes stage 2 open item. (4) FY26 CFO includes 320.36 loan and deposit release; CFO after interest paid is 40.27 (derived). (5) CARE: consolidated turnover 620 INR crore as on 2026-03-28 against 692.0 full year; standalone 9M FY26 331.00 implies Q4 about 344.7 (51% of year); basis unstated, treat as a cut-off question, not a finding. (6) Government-owned entities 1,018.16 (15.09%) is the nearest figure for the Indian government customer; its separate share NOT FOUND."
