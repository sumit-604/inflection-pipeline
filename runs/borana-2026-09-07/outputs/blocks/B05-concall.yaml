  - {question: "Has any peer observed Borana Weaves gaining share, or new greige/grey-fabric weaving capacity entering Surat at a pace comparable to Borana's stated doubling plan?", why: "Tests Borana's unquantified claim that peer fragmentation does not materially affect it", check_peers: ["SANGAMIND"]}
