  - {metric: "Chemical segment result margin (on total incl. inter-segment revenue)", healthy: "holding/improving above FY26's 2.6%", red_flag: "reverts toward FY25's 1.4% or lower"}
  - {metric: "Pharma segment result margin", healthy: "above 12%", red_flag: "falls below 10%"}
  - {metric: "Debtor days", healthy: "flat or falling from ~95", red_flag: "further rise past 95"}
  - {metric: "Free cash flow vs capex commitment pace", healthy: "FCF funds a rising share of the Rs 495 Cr specific-project set", red_flag: "FCF turns negative while commitments accelerate, or an undisclosed term loan appears"}
