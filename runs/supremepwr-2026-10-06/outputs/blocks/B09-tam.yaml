  - {type: FLAG-MGMT-HEADLINE-NOT-TAM, reason: "AR p.17-18 headline Rs 9.15 lakh Cr is a transmission INVESTMENT programme to 2032, not a transformer market. About 29x the conservative annual transformer market (915,000 / 31,200 = 29.3x). The transformer-specific claim in the AR is Mordor USD 3.25bn (reasonable)."}
  - {type: FLAG-SAM-FILTER-THIN, reason: "SAM rests on two filters with M/L evidence: rating share 40.78% (Mordor, 10-100 MVA; 100-200 MVA and sub-10 MVA slices NOT FOUND) and southern-region 36.2% share of substation capacity under construction (tndindia, undated). Maharashtra and distribution geography NOT FOUND."}
  - {type: FLAG-220KV-UNQUALIFIED, reason: "SAM carries SPEL's stated 220 kV capability. 220 kV type test is planned Dec-2026/Jan-2027 (B05). Until it passes, the qualified SAM is smaller; not sized (no EHV split found)."}
  - {type: FLAG-PEER-CAPACITY-RACE, reason: "Peers add 220 kV-class capacity in the same window: Voltamp +6,000 MVA EHV (Oct-2026), Shilchar +6,500 MVA (Apr-2027, may reach 220 kV), Danish +12,000-15,000 MVA up to 400 kV, TARIL +15,000 MVA (Q2 FY27) and +22,000 planned. Management line that 220 kV players are few (B05) is contradicted."}
  - {type: FLAG-MARGIN-INDUSTRY-GAP, reason: "CRISIL (Aug-2025) sees industry operating margin 8-10% sustainable medium term; SPEL guides EBITDA 18-20% (B05). Margin bridge is stage 11's; the TAM stage does not credit it."}
  - {type: FLAG-FX, reason: "Mordor USD figures converted at RBI reference about 96 (28-Sep to 01-Oct-2026, MSEI page; the 30-Sep value 61.16 on that page is an obvious data error and was dropped). Forward USD to INR at constant FX; INR depreciation would lift the Rs forecast."}
