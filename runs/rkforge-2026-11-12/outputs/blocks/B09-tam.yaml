analyst_note: "SAM is a floor built from three named peers (Bharat Forge forgings 13,928 incl. overseas, RKFL 4,238, Happy 1,546) because no sourced percentages exist for the five filters; do not read 21.5% share as precise. TAM central 63,220 uses AIFI 2.9 Mt x RKFL H1 FY27 realisation 2.18 lakh/t, an upper-side price basis. SOM CAGR 13.6% uses 8.8% SAM growth (USD forecast) and +3pp share; at 6.5% growth it is 11.2%. Capacity value uses 395,800 t x 2.18 lakh = 8,628 Cr and may double count ring rolling. EBITDA CAGR 20.5% assumes 18.1% margin held; PAT growth not derived. Trailing P/E 203x uses screener snapshot price 785.6 (date unstated) and FY26 consolidated PAT 72 Cr."
