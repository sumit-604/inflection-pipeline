flags:
  - type: FLAG-CASH
    reason: "Trade receivables grew 43.9% YoY (FY25→FY26) vs 29.5% revenue growth; ECL allowance swung from release to addition; H1 FY26 operating cash flow −Rs 2,005.95 Mn despite first-ever profitable PAT, driven by Rs 1,000.44 Mn ESOP settlement and Rs 1,039.01 Mn receivables increase. Cash conversion INDETERMINATE pending first clean quarter and rating agency WC commentary. Caps disposition no better than PROCEED WITH CAVEATS. No growth offset applied to cash multiplier in stage 11."
    authority: "(B02 Finding #12, B03 FLAG-CASH, fttcp-deliberation.md line 20, 62)"

  - type: FLAG-GATE0-AVERAGE
    reason: "Classification AVERAGE driven by deal-breakers: median ROCE −26.22% (FY21–FY26 inclusive of pre-IPO losses), cumulative CFO/PAT 0.19 (from cash-burn period FY23–FY24), PAT negative FY24–FY25. All attributable to FY22–FY25 non-cash ESOP/CCPS artifacts and pre-IPO window. FY26 (first post-IPO full year) shows clean balance sheet and return to profit; only one-year pattern exists. Forward ROCE RECOVERING per operator override."
    authority: "(B01 block analysis, classification AVERAGE line 27; fttcp-deliberation.md override 1)"

  - type: FLAG-CUSTOMER-CONCENTRATION
    reason: "Top-10 customer revenue share worsened 33.7% (FY24) → 40.2% (H1 FY26); largest customer 6.88% → 14.06%. Concentration trending up, not moat-positive. Top-5 customer renegotiation in FY26 carried margin cost, initially understated in Q3 FY26 call, revealed in Q4 FY26 call (B05 promise_delivery row 5). Concentration risk worsening beneath strongest moat category (C1 Customer Ecosystem)."
    authority: "(B04 risk line 11, B07 FLAG-C2-INVERTED line 14, B05 promise_delivery row 5)"

  - type: FLAG-CREDIBILITY-GRADE-B
    reason: "Single testable guidance figure (EBITDA ~10%) delivered accurately (FY26 10.4% actual). Cost-leverage trends (S&M, R&D, ESOP) tracked as described. Offset by two silently dropped investor commitments (headcount-by-function KPI, Labour Code run-rate clarity) without acknowledgment, and an understated-then-revealed margin cost from top-5 client renegotiation. Identical deflection on forward 3-year guidance (revenue/margin targets) across two consecutive quarters (Q3 & Q4 FY26) without fresh rationale; ceiling at Tier B credibility."
    authority: "(B05 credibility_grade B, credibility_basis lines 49, red_flags lines 57–62)"

  - type: FLAG-CASH-DEPLOYMENT-UNTESTED
    reason: "War chest (G1 moat, Strong balance-sheet score) = Rs 1,447 Cr net cash. Management declined twice to give M&A guardrails or deal-size discipline (B05 repeated_evasions). Capital-allocation track record on prior two acquisitions (Tellyo, Argoid) both ended in write-off or liquidation within 12–18 months (B02 Finding #6). Deployment strategy untested; deployment decision pending."
    authority: "(B07 FLAG-CASH-DEPLOYMENT-UNTESTED line 17, B05 repeated_evasions line 46, B02 Finding #6)"

  - type: PROCEEDING-WITH-CAVEATS-DISPOSITION
    reason: "Forward business FIRING (revenue RECOVERING, margin STARTING, ROCE RECOVERING on operating base) but cash conversion INDETERMINATE caps overall disposition. Stage 11 applies PROCEED WITH CAVEATS disposition pending (1) first clean quarter confirmation of OCF post-ESOP settlement, (2) rating agency working-capital commentary if available, (3) resolution of structural vs growth-induced cash deterioration."
    authority: "(fttcp-deliberation.md line 24, 49–56, deliberation summary: 'Composite +4 out of 8. DEEP WATCH leaning BUY-ON-DIPS')"

