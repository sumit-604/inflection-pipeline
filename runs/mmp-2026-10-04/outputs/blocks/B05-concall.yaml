analyst_note: "Core powder and foil delivered; new verticals and conductors did not. Grade stays C. The 20-25% FY27 revenue figure appeared only in a footnote added to the May transcript after a retail investor showed it did not add up; the Q1 FY27 PR then said 15-18%. Q1 FY27 revenue was 2,328 Mn, so Q2 to Q4 need +11.6% to +15.5% on Q2 to Q4 FY26 (derived), reachable if powder and foil hold. Two readings of margin: Q3 FY26 to Q1 FY27 EBITDA of 8.6-9.0% is the new base, or it carries inventory gains (2-2.5 Cr in Q4) while metal stays high. Separator: Q2 FY27 margin at a flat or falling aluminium price. Q1 FY27 results filing segment digits are OCR-garbled; trust them only against the press release."
