  - "RBI regulation on bank-guarantee funding of clearing-corporation margin money, acknowledged as not-yet-fully-realised -- BSE Concall Aug 2026 Transcript, p.16-17; MCX Concall May 2026 Transcript, p.18. No IEX-side equivalent disclosed."
  - "Fintech-onboarding-friction competitive erosion, quantified in real time (420bps incremental share loss) -- CDSL Concall Aug 2026 Transcript, p.6. IEX discloses no equivalent numbered monthly competitor-share metric."
  - "Settlement Guarantee Fund core-contribution policy as a source of quarterly earnings volatility, addressed via a new 5%-of-revenue smoothing policy -- BSE Concall Nov 2025 Transcript, p.10-11. No IEX-side equivalent capital-buffer mechanic described in this corpus."
net_narrative_effect: "complicates"
analyst_note: "The peer set does not cleanly support or undercut IEX. It VERIFIES the non-operating-income silence as a sector-wide analyst blind spot, not an IEX failure. It CONTRADICTS the customer-loyalty defence via CDSL's own claim failing one quarter later, plus BSE's structural (not loyalty) explanation for its own stuck cash-segment share, plus an MCX investor's counter-reading of the same NSE-vs-BSE precedent Goel invokes. The IGX-OFS silence question is genuinely untestable, no comparable peer event exists in this corpus. The one real peer precedent for a regulator-driven market redesign (BSE's expiry-day reallocation) was expansionary, not compressive, which complicates IEX's implicit worst case without being the same mechanism as coupling, so it should not be read as reassurance. Two independent MCX-side investors naming IEX unprompted, calling coupling a 'derailed' risk, is real external corroboration of Stage 5's top flag."
