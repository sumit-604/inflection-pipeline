industry_cross_read:
  demand: "All three peers describe improving CY2025/FY26 demand (pharma 9% vs 6.4% CY2024 per INDGN; IPM back to 10-12% per ENTERO; Indian private-hospital growth 20-25%+ per POLYMED), but none attributes it primarily to a GLP-1-driven patient-support boom the way QMS's guidance implies; the tailwind is real but broader and less concentrated than QMS's framing."
  pricing_inputs: "Heterogeneous across peers: POLYMED faces a genuine ~20% crude-linked raw-material cost shock (manufacturer); ENTERO's margin gain is mix-driven (MedTech commercial-role premium, 10%+ EBITDA vs pure distribution's 4-5%); INDGN's margin moves are wage-cycle and discretionary-investment driven. ENTERO's distribution-vs-commercial-role margin split corroborates QMS's own SOTP logic (services earn structurally higher margin than distribution) even though QMS has not yet delivered the mix-shift margin uplift."
  capex_cycle: "Industry-wide capacity/investment race, not a lone expander: INDGN (GTM/GenAI/M&A), ENTERO (~Rs 1,000 Cr FY26 MedTech M&A then a deliberate FY27 pause), and POLYMED (Rs 200-296 Cr/year capex plus cross-border M&A under a 2030 doubling plan) are all investing simultaneously, funded by recent IPO/QIP or accumulated cash. QMS's own front-loaded investment sits inside this broader pattern, though at two to three orders of magnitude smaller scale."
