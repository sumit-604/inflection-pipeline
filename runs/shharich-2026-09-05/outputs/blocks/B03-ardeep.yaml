strengths_top3:
  - "No channel-stuffing, no restatement, immaterial contingent liabilities (3.03% of net worth), clean CARO on substance"
  - "Capital discipline in deployment: CCD proceeds raised in FY26 were deployed into capex/investments, not hoarded; cash balance fell across both years despite capital raises"
  - "Clean auditor-fee and continuity profile: zero non-audit fee, stable fee, no resignation, no Section 143(12) fraud reporting, no SEBI/MCA action in 3 years"
red_flags_top3:
  - "Promoter-family cash extraction at 112.7% of FY26 PBT, with every dilutive capital-raising instrument (CCDs, pending warrants) allotted exclusively to promoter-family members, three of whom are also paid Senior Management Personnel; promoter holding on a path from 54.21% to a prospective 73.75%"
  - "Headline 30.7% revenue growth conceals a 17.6% PAT decline, margin compression (EBITDA margin 8.13% to 5.31%), and a profit base 57.7% dependent on Other Income, over half of it an unexplained FX gain tied to an unexplained 46.4%-of-revenue export emergence the Company's own risk note denies"
  - "A Rs 100 crore combined RPT ceiling sought against a Rs 156 crore market cap, including a newly-disclosed related party with Rs 1,163 crore net worth and zero turnover, alongside numeric errors in audited disclosures and a four-instance drafting/QC pattern spanning CARO, the Notes, and the Board's own MD&A"
best_fit_strategy: "GARP-transition and Turnaround both WATCHLIST - growth and cash generation not yet proven structural; capex bet unproven"
one_line_verdict: "A cyclical converter's 31% revenue headline hides a 18% profit fall, extraction exceeding profit, and an unproven capex bet - WATCHLIST, GARP unproven."
analyst_note: "The two findings most load-bearing beyond B02's own scope are: (1) the AGM Notice's Item 11 material-RPT authorisation, which surfaces a brand-new related party (Shubhlaxmi Dyetex Private Limited, not a subsidiary - do not confuse with Shakambhari Dyechem Private Limited, the actual subsidiary) with an unusual Rs 1,163 crore net worth / zero turnover profile and a proposed Rs 50 crore ceiling; and (2) the discovery that the same wrong-direction ratio-explanation defect B02 found in Note 35.22 recurs twice more in the Board's own MD&A (Interest Coverage Ratio and Return on Net Worth commentary, p.77) - meaning the drafting-quality problem is a Board-level, not only an auditor-Notes-level, pattern. Also load-bearing: the CG Report (p.91) fully quantifies the related-party loan B02 could only find partially disclosed (Rs 1,88,28,133 to Shakambhari Dyechem Private Limited, since repaid), and Other Income at 57.7% of PBT is a new, AR-anchored earnings-quality finding that should inform Section 1B/FTTCP's treatment of FY26 as a non-representative spot year for this converter."
