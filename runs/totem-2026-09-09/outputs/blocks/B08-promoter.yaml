analyst_note: "The pledge is a group-financing fact (Catalyst Trusteeship Limited, same trustee used for SP Group's Afcons Infrastructure pledges), not evidence of TOTEM-level misconduct - TOTEM sends zero loans/guarantees to the group. But it is the single largest overhang on the 73.85% controlling block, and the group crisis (CareEdge B+, slipping June-2026 deadlines) is live, not historical. The MD pay reconciliation gap is independently real: Note 30 lists the MD as a KMP, so Annexure II's '7.5% average, no exceptional circumstances' language sits awkwardly next to his own 74.7% rise. Treat both as position-size inputs, not kill triggers."
