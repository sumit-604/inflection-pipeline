one_line_verdict: "Real broad-based growth on a clean IPO balance sheet, undercut by two years of failed cash conversion and a first-year post-listing disclosure-quality cluster the front-matter narrative does not acknowledge."
analyst_note: "The most load-bearing addition beyond B02: the cash-flow statement itself (not just the balance sheet) now confirms two straight years of near-zero-to-negative CFO/PAT, and the FY26 figure is propped up by a mechanical, company-disclosed deconsolidation effect on inventory — meaning the true organic cash drag from ageing receivables is worse than the headline CFO suggests. Six internal numeric inconsistencies (up from B02's two) place a hard ceiling on how much confidence any single number in this AR deserves without independent cross-check. The cross-board governance finding (three of six directors also on the RPT counterparty's board) is new and should feed directly into the B08 promoter-verdict stage. Three Saudi-named entities in different structural roles (subsidiary, related party, pending acquisition) is a group-clarity concern Role 5.5 should resolve on claude.ai before FTTCP."
