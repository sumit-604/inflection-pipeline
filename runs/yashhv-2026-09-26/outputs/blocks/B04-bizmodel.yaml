one_line_verdict: "Real, approval-barrier-protected growth engine whose cash conversion and disclosure discipline lag its capex-driven scale-up."
analyst_note: "Archetype is build-to-spec component maker with licence/scarcity-business features layered on top (8-10yr utility/OEM qualification is the real moat, not a government licence). Sector cap row: 'Cables / Industrial products' (25x) is the better fit versus 'EV charging / energy transition equipment' (28x); Yash sells an engineered T&D/generation component, not charging or storage equipment, so the industrial-products row is more defensible even though grid-capex and renewables are demand drivers. Three of the eight standard moat types (cost advantage, brand, and by extension network/technology comparators) cannot be scored against peers because peer screener sheets came out empty (B01); this stage treats them as emerging/unconfirmed rather than guessing a score. WC intensity and cash conversion are the dominant near-term watch items and are already the subject of five RED/YELLOW flags in B01-B03; this stage treats them as first-order monitorables (Section 4C items 2, 5, 6, 8) rather than re-litigating the accounting-quality finding, which belongs to those stages."
