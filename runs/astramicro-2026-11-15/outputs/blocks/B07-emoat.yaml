analyst_note: "Three points a later stage cannot rebuild. (1) Uttam is credited once, in B2 only; A1, C1 and C2 do not repeat it. The gross margin step (28.7% to 49.1%) is credited once, in B1, at 0.5 weight because management credits the build-to-print exit while B04 calls the material cost fall unexplained. (2) The scale arithmetic: net PPE stays near Rs 256 Cr when capex of Rs 40-50 Cr equals depreciation of Rs 43 Cr, so the 3x to 7x turnover claim needs 13.5x to 31.6x fixed asset turnover against 4.5x-5.5x history. Revenue must be pass-through or outsourced, or a claim is wrong. (3) The band is fragile on the downside: if B2 and H2 both fail the score is 10.5 (below 12). It is nowhere near 25 on the upside. The separating observation for Uttam is its disclosed margin and advance, then FY27 CFO sign."
