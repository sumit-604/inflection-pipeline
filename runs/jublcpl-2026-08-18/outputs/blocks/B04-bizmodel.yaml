one_line_verdict: "A niche global polymer/adhesives franchise sits obscured inside a subsidy-exposed fertiliser business until the pending demerger clarifies both."
analyst_note: "Three separate documents (AR narrative text, AR segment note table, and the company's own Investor Presentation) give three different PP&C segment revenue figures for FY25/FY26, with growth rates ranging from 10% to ~28% depending on source. This is not resolved here by design (never estimate) and should be treated as a numeric-verification priority before any valuation work proceeds, since PP&C is the entity that survives the demerger. Separately, the demerger scheme is not yet legally effective as of the run date - all RETAINED/DEMERGING framing describes the intended, not current, structure. Unit-level volume data (MT/kg) is absent from every provided document, which materially limits Section 3D physics-of-the-business analysis to qualitative statements only."
