analyst_note: "BirlaNu corroborates Visaka's industry-wide cost-pressure and debt-funded-capex framings (Claims 1, 7), supporting that Visaka's FY24-FY25 margin weakness and debt run-up were not unique. It undercuts the framing that Visaka's slow multi-year Midnapore ramp is normal pacing (Claim 5), though the comparator is AAC blocks, not boards. It cannot address BIPV, board exports, or the ~32% market-share claim at all (Claims 3, 6, 8) since BirlaNu is silent or non-participating on each. New, synthesis-relevant findings not in the original questions: an emerging industry-wide boards capacity race funded debt-first by at least two players, a structural 2-3% long-run roofing growth ceiling BirlaNu names outright, and a total silence, on both companies' sides, on chrysotile-asbestos regulatory/health risk despite it underpinning 53% of Visaka's revenue. Single-peer coverage (BirlaNu only; Everest and Ramco have no transcripts) caps every finding at PARTIALLY VERIFIED at best."
