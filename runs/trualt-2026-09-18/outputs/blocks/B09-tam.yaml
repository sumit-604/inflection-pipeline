    reason: "Prospectus CBG SATAT procurement price table (undated IOCL Notice, cited in the Oct-2025 prospectus,
      p.253, top slab Rs78.01/kg incl. GST) is contradicted by TRUALT's own Aug-2026 concall, which cites CBG
