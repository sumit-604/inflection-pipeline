going_concern_language: "Consolidated (Note 58, AR p.688): 'the Group's current liabilities exceeded its current assets by Rs 17,240.95 Million [Rs 1,724.10 Cr]...the Board...does not anticipate any material uncertainty related to going concern.' Standalone (Note 53, AR p.856, and liquidity-risk note AR p.794-796): same language, Rs 6,231.31 Million [Rs 623.13 Cr] shortfall. Principal auditor's report does not itself flag a material uncertainty at either level; the only going-concern-adjacent auditor flag in the document is the component auditor's CARO Clause (xix) call-out on Clean Max Patagonia Pvt Ltd (Annexure A, AR p.365-370), which the consolidated Note 58 paragraph does not cross-reference."
analyst_note: "The load-bearing pattern across all three passes is not any single note but the cluster: useful-life extension, a favourable impairment discount-rate change, and a jump in interest capitalisation all land in the same year the thesis needs an operating-profit crossover to be real. Each is individually Ind-AS-compliant and disclosed; downstream stages should treat the FY26 crossover as unproven until Stage 11 rebuilds PBT with capitalised interest and the useful-life change reversed. Separately, the 103-entity CARO finding and negative aggregate NCI profit share are evidence the SPV portfolio is younger and less proven than headline consolidated growth suggests, independent of the accounting-choice cluster."
