analyst_note: "Conservative TAM (Rs2,60,300 Cr) and realistic TAM (Rs4,86,115 Cr) diverge 1.87x on category-boundary definition, not data quality - both sides web-corroborated. The capacity gap is the single most decision-relevant finding: the 5yr SOM implies growth the currently-funded capex plan cannot physically deliver, so Stage 11 should treat the 5yr SOM CAGR (31.2%) as capacity-constrained upside contingent on VIP or further capex, not a base case, while the 3yr SOM CAGR (25.1%) sits close enough to the disclosed capacity ceiling to be a genuine base case."
