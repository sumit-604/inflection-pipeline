analyst_note: "Two findings a downstream stage cannot reconstruct from the fields above: (1) MD total remuneration rose 74.7% (Rs265.52 lakh to Rs464.00 lakh, Note 30) against the Board's Report's own stated 'average 7.5%' KMP increase (Annexure II) - unreconciled, not resolved here. (2) The Board's Report MD&A ratio table states Return on Net Worth flat at 17% both years, while Note 33.2 states 17% FY26 vs 19% FY25 (-9.12%); my own DuPont recompute (17.19% FY26) matches Note 33.2, not the MD&A table - a genuine internal inconsistency, not a P&L integrity issue. Both are disclosure-QC gaps, not confirmed misstatements. The Q1 FY27 margin figures cited in LBF-1 (16.1% to 22.9%) were independently corroborated from screener-Data_Sheet.csv quarterly rows (Sales/Operating Profit, Jun-2025 vs Jun-2026), a text-readable source alongside the scanned PDF."
