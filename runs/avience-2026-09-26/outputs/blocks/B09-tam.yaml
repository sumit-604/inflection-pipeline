flags:
  - {type: FLAG-TAM-DIVERGENCE, reason: "RHP Industry Overview chapter cites two internally inconsistent Indian medical-devices market figures in the same chapter (USD 15.35bn to USD 20.51bn by 2029 at RHP p148, vs USD 14bn to USD 30bn by 2030 at RHP p149); a third-party search also found India IVD 2030 estimated at USD 6.2bn vs the RHP-cited Mordor figure of USD 2.66bn by 2031, a ~2.3x divergence. Conservative (lower, Mordor/RHP) figure used per pipeline methodology."}
  - {type: FLAG-SAM-JUDGMENT, reason: "SAM derivation applies a 50% channel/capability discount that is an analyst judgment, not a sourced percentage; no filing or report gives a channel-penetration rate for Avience's Mindray-partner/government-tender footprint. Named explicitly in the report, not presented as evidence."}
  - {type: FLAG-GUIDANCE-VS-SOM, reason: "Management's FY26-FY28 guided revenue CAGR (75.9%, to Rs 160-165 Cr) runs materially ahead of the aggressive-case, evidence-based SOM3yr CAGR (43.4%) over a longer window. Most likely explanation: the ~Rs 47 Cr Uttarakhand order is a lumpy, largely one-off government contract with a hardware-heavy component (call p7), not a repeatable market-share gain. Stage 11 should treat FY27/28 guidance as order-driven, not share-driven, pending a second comparable order."}
  - {type: FLAG-CAPACITY-MIX, reason: "The Rs 250-265 Cr peak-revenue capacity management cites is a MANUFACTURING-only ceiling; it does not constrain the traded/Mindray-distribution engine (72% of FY26 revenue), which is capacity-free from Avience's own balance sheet. Capacity is sufficient for the SOM figures; the binding constraint is mix-shift execution and unfunded working capital (Rs 35-40 Cr gap at Rs 100 Cr revenue, call p6), not physical capacity."}
