analyst_note: "TAM/SAM rest on Method 3 (peer aggregation) because 4 of 6 verticals (51% of revenue) have no independent third-party sizing after genuine search. A tonnage-share approach using AIFI installed-capacity data was tried and abandoned: BALUFORGE's high-value-add mix (crankshafts, machined defence parts) makes MTPA share a poor proxy for revenue share, understating it. SOM figures do not depend on B07's 50%/78% capacity proxy; only the 3C feasibility check does, and that check assumes full utilisation, which is unverified in either stage. The 15% SOM-implied CAGR is a deliberately disciplined, share-gain-rule output, not a fit to the one good (19.9%) or one bad (guided 40-45%) year on record."
