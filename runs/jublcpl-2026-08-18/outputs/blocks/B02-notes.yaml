analyst_note: "The single most decision-critical fact is structural, not a pure earnings-quality flag: FY26's entire segment-profit growth came from P&K Fertilizers, the exact division being demerged (Note 32). Capex allocation confirms management is not reinvesting behind it (92.8% of FY26 capex went to the retained Performance Polymers & Chemicals segment). Any valuation of the post-demerger entity should not extrapolate FY26 consolidated growth; the retained core grew profit only 0.5%. Separately, the operating cash conversion collapse is not a profitability problem: pre-working-capital OCF grew +34% YoY; the drag is subsidy-receivable buildup and a doubling of cash taxes paid, both plausibly normalising. The MSME disclosure contradiction (Note 48(vi) vs Note 19.1) is small in rupee terms but signals a documentation-discipline gap worth testing directly with management or at FTTCP."
