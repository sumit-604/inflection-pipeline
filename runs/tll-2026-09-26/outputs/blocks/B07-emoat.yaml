    subject: "Section 2C capex-embedded growth not computed though consolidated CWIP is on the balance sheet"
    disposition: "accepted"
    anchor: "Annual_Report_2026.txt line 10021, Capital Work-In-Progress Rs 1,749.91 lakh = Rs 17.50 Cr (FY26), confirmed on read; screener-Data_Sheet.csv CWIP row 17.5. Run-1's stated blocker (Purchase-of-Fixed-Assets not separable from acquisition outflows) is false per the Gate-0 rework (B01 rework_resolution item 15: the AR's own consolidated cash flow statement carries Purchase of Fixed Assets, Rs 3,647.24 lakh FY26, on a line separate from Purchase of Equity Shares) and in any case does not bear on CWIP, a balance-sheet figure. Computed: CWIP Rs 17.50 Cr x FAT FY26 2.12x (129.02/60.73, B01 M3 basis) = implied incremental revenue Rs 37.2 Cr = 28.8% above FY26 revenue (Rs 129.02 Cr). Emitted as capex_embedded_growth_pct: 28.8, not 0, with the FAT-distortion caveat carried beside it in Section 2 of the report (three of five subsidiaries are pre-revenue against gross block already capitalised, which can overstate what the historical FAT ratio implies for near-term conversion)."
  - item: 18
    subject: "Multiplier rounding, one evidence tier for E1, active_categories schema, C1/A4 missing from optionality register"
    disposition: "accepted"
    anchor: "Rounding: 07-emoat.md Section 5 recomputed with unrounded per-row products (A4 1x0.5=0.5; C1 1x0.7=0.7; E1 3x1.0=3.0 corrected tier below; C2 2x1.0=2.0; H2 1x1.0=1.0; H3 1x1.0=1.0); total 8.2, not the run-1 reported 8 (which used inconsistent per-row rounding, some up some down). E1 tier: run-1 counted E1 as documented in the completionist recount (line 281 of the superseded report) but scored it at the claim multiplier 0.7x -- an inconsistency. Corrected to one tier throughout: documented (the capitalised registration intangible, Rs 13.54 Cr gross block, and the country/registration counts are AR-filed facts; only the deck's forward valuation gloss on top of that asset is a claim, and that gloss is not what is being scored at 3/4 likelihood-x-impact). E1 = 3 (HM) x 1.0 = 3.0. em_score corrected 8 -> 8.2 (band unchanged, NONE, <12). active_categories restricted to Strong/Moderate rows per schema: Section 3's own summary states the Strong/Moderate count is 1 (E1); the five Weak/Weak-Moderate rows (C2, H2, H3, C1, A4) are removed from active_categories and, where scored 0 or resting only on claim/inference evidence, added to or left in the optionality register instead. C1 (claim-only cross-sell) and A4 (inference-only platform breadth) added to optionality_register, both previously omitted."
