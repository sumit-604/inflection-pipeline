one_line_verdict: "Revenue is growing, but FY26 profit rests on other income and a lapsed provision charge, debt is mostly due within a year, and cash flow stays negative: a turnaround to watch, not yet one to underwrite."
analyst_note: "Four points a later stage cannot rebuild. First, MD&A EBITDA 3,549 includes the 390 FX gain and 2,107 of other income; EBITDA excluding other income is 1,442 and EBIT excluding it is 339. The 7,110 headline swing is 3,138 like-for-like (FY25 base adds back the 5,431 TNEB charge and removes other income). Second, Q4 FY26 PBT 226 rests on derived other income of 1,020; ex-other-income Q4 was (794). Third, orders on hand 871.77 Cr (AR) vs unexecuted 374.56 Cr (Acuite) is unreconciled, and the AR dropped the DNA share (39% in FY25) and order composition (52% strategic). Fourth, FY26 growth was export and product led (India revenue -13.5%, exports 973 to 5,936). One triple-pass slip: ESOP outstanding is 4,98,388, not 3,98,388. Units INR Lakhs; stage 10 converts once."
