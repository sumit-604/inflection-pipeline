    reason: "The genuinely documented emerging-moat evidence (Chennai MMLP commissioning, SECL contract, Chennai CFS scale) sits on the same FY26 balance sheet whose reported profit turnaround is substantially a one-time Rs55.59cr land-sale gain (pre-exceptional consolidated PBT only Rs1.50cr; standalone pre-exceptional loss Rs16.03cr) — see B01 Gate0 flag. The emerging-moat scan and the Gate0 profit-quality caveat describe overlapping, not independent, facts about the same FY26 year; see Section 6C/6D."
