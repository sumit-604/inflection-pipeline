credibility_grade: "C"
credibility_basis: >
  Single-quarter, written-document promise-delivery test (one transcript
  only): capacity and working-capital IPO objects show real but early
  utilisation with no Monitoring Agency deviation flagged (mild positive);
  set against an internally inconsistent headline HT/MVCC target (~15% vs
  ~50% inside the same call), a Q1 operating-profit figure ~82% dependent
  on an undisclosed finished-goods inventory-build credit, a segment-margin
  arithmetic that does not cleanly reconcile to the reported blended
  margin, zero mention of a two-year negative-CFO history the call never
  addressed, and one AR-level promotional claim directly contradicted by
  the same document's own factual disclosure. Per the NO-CONCALL degraded
  rule this evidence set does not clear the bar for B; grade stays at the
  C default.
