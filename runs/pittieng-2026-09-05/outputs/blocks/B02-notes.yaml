  - {rank: 2, finding: "Net debt ROSE in FY26, not fell: consolidated Rs 554.56 Cr (+26.3% from Rs 439.02 Cr), standalone Rs 600.01 Cr (also up); net-debt/equity worsened both bases; driven by inventory +20.0% and trade payables -25.7% (consolidated).", note_ref: "Note 25.3 Capital Management, Note 5, Note 13C (PDF p.105,109,112)", rating: "red flag", why: "Answers LBF-2 net-debt path: FY26 base matches memory's Rs 525+ Cr reference point but was still climbing through the year; the glide path to Rs 300 Cr is an unconfirmed forward claim."}
  - {rank: 3, finding: "A TReDS supplier-finance arrangement embedded in trade payables nearly doubled YoY to Rs 83.85 Cr (of Rs 94.03 Cr total under the arrangement, from Rs 44.36 Cr opening); the headline payables decline (-25.7%) partly coexists with growing financier-intermediated credit closer to short-term bank debt than ordinary vendor terms.", note_ref: "Note 25.7(B) (PDF p.84-85 standalone / p.115-116 consol)", rating: "red flag", why: "Reinterprets Finding 2: true leverage/working-capital improvement is smaller than the headline payables figure implies."}
  - {rank: 4, finding: "Note 25.21's variance-disclosure formula is applied inconsistently: ratio rows use relative % change, but ROE/Net Profit Ratio/ROCE use percentage-point difference instead. On the same relative basis as every other row, ROE fell -32.5% (15.75%->10.63%), past the company's own 25% explanation threshold, yet no reason is given because the point-difference figure (-5.12pp) reads as sub-threshold.", note_ref: "Note 25.21 (PDF p.90 standalone)", rating: "red flag", why: "Disclosure-integrity finding: a formula inconsistency, applied only to percentage rows, is why the year's steepest profitability decline carries no management explanation."}
