verdict_basis: "No SEBI/criminal record and zero pledge, but a real filed +4.80pp promoter-holding increase via demerger-then-amalgamation of two previously-public vehicles (media-mischaracterized as unchanged), RPT growth co-timed with a promoter entity's own stake rise, and an unexplained 91% institutional vote against a director's reappointment keep this at CAUTION rather than TRUSTWORTHY."
analyst_note: >
  The Vasudeva Commercials / LBF2 puzzle is now resolved with a six-document evidence
  chain, not a residual gap: Vasudeva was always non-promoter; it demerged into Synthorix
  Trading Ltd (Oct-2025, NCLT Chandigarh order), both non-promoter; both were then
  amalgamated into promoter entity NM Merchantiles (Jun-2026, RD order) alongside
  previously-public G Consultants and Fabricators Pvt Ltd. The BSE XBRL shareholding
  pattern for 31-Mar-2026 independently names Synthorix Trading at 3.81% under the public
  "Bodies Corporate" category -- direct proof the pre-merger classification was genuinely
  public. This means the +4.80pp promoter-holding rise in Jun-2026 is real and filed, and
  secondary media describing it as "no change" is incorrect. Downstream stages should cite
  this stage's evidence chain rather than re-deriving it. The one item this stage could not
  close is who beneficially controlled Vasudeva Commercials and G Consultants before their
  respective corporate actions; the shared registered address with NCVI Enterprises is
  circumstantial only. None of the eight caution-rated dimensions individually would cap
  position size under the deal-breaker rules; downstream (FTTCP, Role 2/Role 6, /finalize
  tripwires) should carry the RPT-growth trend, the AGM institutional-dissent pattern, and
  the unfilled CEO seat as named monitorables.
