analyst_note: "The single biggest finding here is scope, not size: management's MD&A backdrop (Rs 85,091 cr implied) mixes markets Diffusion serves with markets it does not (full construction-equipment OEM manufacture). The niche-scoped TAM (Rs 2,200-2,600 cr) is roughly 30-38x smaller. SOM-implied 5yr CAGR (10.1%) sits close to, but below, the reverse-engineered CAGR from management's Rs 650 cr+ aspiration (9.8% over 5yr from FY26 base) -- a useful independent consistency check, not proof. Capacity (doubling) is not the constraint; the capex plan is sized more optimistically than this report's conservative SOM."

