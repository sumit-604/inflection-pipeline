analyst_note: "Strongest independent read: MTAR was at WC 260-282 days and OCF -Rs 22 Cr in Q3 FY26, then reported 59 and 50 days with OCF +Rs 350 Cr in H1 FY27. It credits customer credit terms and advances, not discounting. That is a precedent for Azad's cash falsifier, but MTAR's basis is unstated, its largest customer is supply-constrained, and its numbers are management claims (analyst notes inventory Rs 680 Cr, about 5 months of guided revenue). Peers do not mention Azad. Gas turbine is untested. [INFERENCE] separating observation for Azad: customer terms or advances stated by customer and percent, plus WC on a defined basis in Q3 FY27."
cross_peer_hypothesis: "Both active peers moved from sample to volume in 15 to 24 months, and both now say the binding constraint is capacity and qualification time, not orders. Their reported working capital falls when a single dominant OEM grants advances or short credit terms to secure capacity (MTAR 260 to 50 days), and rises when the customer base shifts to long-cycle first-article programs (Unimech 110 to 150-160 days). So the working-capital outcome tracks customer bargaining position and program stage, not management discipline. Testable: Azad's days should fall only if its dedicated-plant OEMs (GE Vernova 3 of 6 plants) pay advances or shorten terms, and should rise during delta qualification."
