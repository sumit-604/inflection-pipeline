analyst_note: "Score 10.8 sits 1.2 below the MODEST band, so the first Kutch evidence (approval, plant-wise towers) decides the class: E1 moving from 0.7 to 2.0 reaches 12.1. G1 credits the post-IPO balance sheet, which Gate 0 scored only as a sensitivity (Block D 8 at FY26, 15 at Sep-26), so there is no double credit. G1 still rests on a CFO that prints Rs 12.47 or Rs 18.44 Cr for FY26. Tower count 107 vs 108 is two growth rates (72.6% and 74.2%), each internally consistent; EBITDA per tower Rs 32.82 lakh excludes about Rs 1 Cr of non-tower EBITDA (inference). Order roll-forward ties within Rs 0.3 Cr only if the Rs 58.3 Cr order is taken ex-GST at 5%. The low EM score does not falsify the utilisation-and-mix thesis; it says no barrier sits behind it."
