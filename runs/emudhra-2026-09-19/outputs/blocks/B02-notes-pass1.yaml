receivables_trend_pass1: "Improving to stable: gross trade receivables >6-months-overdue bucket was approx 13.5% of
  gross (FY25) vs approx 12.3% of gross (FY26, Note 42, AR p.268), even as absolute receivables grew 30% YoY on 35%
  revenue growth and the Cryptas/AI Cyberforge consolidation. Related-party receivables grew 13.9x (Rs 4.91mn to
  Rs 68.18mn) concentrated in Bluesky Infotech, a promoter-influenced partnership (Note 10/44.2)."
going_concern_language_pass1: "NONE. CARO clause (xix), standalone AR p.305-306: auditor states nothing has come to
  attention indicating inability to meet liabilities as they fall due within 12 months of balance sheet date. No
  emphasis-of-matter paragraph in either audit report."
notes_not_yet_stress_tested_for_pass2: "Segment note 49 (consol) and its standalone equivalent have partially
