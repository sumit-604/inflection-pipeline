one_line_verdict: "Fast-growing, debt-free generator maker with order cover and a record of beating its own guidance, but profit turns into cash slowly, customers and the subsidiary channel are concentrated, and promoters are selling."
analyst_note: "Read the 54% CFO/PAT as a ceiling: three-year cumulative C conversion is 47.7% and FCF is 2.1% of S PAT. New AR-only findings: BRSR p.90 prints related-party sales at 24% (PY 28.23%), matching S Customer B, which upgrades the stage 2 inference; MD pay is 509.66, 1,167.00 or 1,299.09 lakh depending on the table; the CG report says FX hedging is Nil while Note 40C shows EUR forwards and a 674.82 lakh MTM loss; a workers' union strike injunction (announcement 20 Nov 2025) is absent from the AR. The AR gives the order book (Rs 1,972.9 cr) that stage 2 could not, but a 22,262.38 lakh gap between book execution and C revenue is unexplained. Capacity is NOT FOUND, so FY28 Rs 3,200 cr cannot be tested. AR is pre-QIP; per-share and cash bases are 31 Mar 2026, Rs 2 face value."
