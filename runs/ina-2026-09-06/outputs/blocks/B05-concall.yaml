credibility_basis: "Of 11 tracked promises with an evaluable outcome, 5 were missed and 5 partial against only 1 delivered; every miss was attributed to external factors with no self-attributed error found, and the single most consequential claim (FY26 cash accruals ~Rs220cr) was directly contradicted by an actual negative Rs73.13cr operating cash flow that management never addressed on any call, alongside proactive non-disclosure of corporate guarantees, the SPV structure, and a 12.4%-of-revenue customer."
