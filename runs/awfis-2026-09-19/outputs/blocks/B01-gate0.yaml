block_b_trend: "improving -- FCF turned from Rs19.4 Cr (FY21) to Rs405.8 Cr (FY26); WC days deepened from -24.9 (FY21) to -41.3 (FY26). The B1/B3 zero scores are a denominator artifact, not a trend reversal."
analyst_note: >
  AVOID is mechanically correct but two effects the fixed formulas cannot
  see through drive nearly all of it. First, Ind AS 116: screener
  "Borrowings" (Rs1,501 Cr) is 97% lease liability; the AR's own ex-lease
  net debt is negative both FY25 and FY26, yet Block D scored 1/20 on the
  reported basis. Second, only FY25-FY26 carry a full balance-sheet
  breakdown in this corpus, so Blocks A and E ride a two-year window on a
  company 2.3 years post-IPO. Growth (38.3% CAGR) and cash generation
  (100% FCF-positive years, WC days -24.9 to -41.3) are genuinely strong
  and undercut the AVOID's implication of business decay. The company's
  own "60%+ RoCE" claim (AR p.9) against this scorecard's 13.47% is an
  unreconciled capital-employed definition gap Section 1B must resolve.
  The one clean peer read that survives (EBITDA margin 23.9pp below
  median despite largest scale) is the more genuine yellow flag here and
  deserves stage 2-3 attention over the mechanical debt ratios.
