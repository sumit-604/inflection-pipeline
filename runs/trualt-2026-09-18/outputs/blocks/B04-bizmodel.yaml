one_line_verdict: "A scale ethanol converter whose year-round-running thesis is real but whose grain-margin economics
  just printed their worst case, on a balance sheet not yet generating cash."
analyst_note: "Company memory frames grain-margin compression as a risk to watch; this stage's filings read finds
  it already realised: Rs15-16/litre to Rs6-7/litre within one Ethanol Supply Year (concall Aug-2026 p.8-9). Utilisation
  (60.57%) is tracking the thesis; margin is not, as filed. The Commodity converter archetype classification is
  load-bearing for every downstream stage via Section 1B Amendment 17 (spot-year ROCE and rupee WC trends barred
  from Section 1B/FTTCP). Moat class reads thin-to-moderate, concentrated in scale and demonstrated execution rather
  than pricing power, consistent with Gate 0's independent MODERATE score (B01)."
