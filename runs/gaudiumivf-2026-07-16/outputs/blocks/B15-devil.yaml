  - "Cash drag is arguably structural, not INDETERMINATE: 187 receivable days and receivables at 51.2% of revenue reflect revenue booked at embryo transfer plus EMI/financing collection, a payment-model feature peers do not share (HCG 105-115 days, Kaya prepaid). Framework structural test → 0.65x not 0.80x; it does not clear on stopping growth."
