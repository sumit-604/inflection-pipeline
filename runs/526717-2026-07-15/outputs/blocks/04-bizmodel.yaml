  - "With capacity utilisation at only 31% in FY25 against a newly expanded 24,300 MTPA base, what demand pipeline supports the 'no major capex' projection?"
  - "Why does the Directors' Report dividend section reference 'loss during the year under review' when FY25 was profitable, and what is the actual forward dividend policy?"
  - "What is driving the elongating operating cycle (88 to 96 days FY24 to FY25), and what specific levers will reverse it?"
