model: claude-sonnet-5-5
status: complete
input_gaps:
  - "H1 FY27 operating cash flow, order book, rejection rates, customer-level shares, power-sale tariff and buyer, borrowing rates and covenants: NOT FOUND in documents read"
  - "A&D 11% share, HAL and MKU programmes and monthly-supply ramp are company-stated only (Inv. Pres. p.6-9), no order values"
