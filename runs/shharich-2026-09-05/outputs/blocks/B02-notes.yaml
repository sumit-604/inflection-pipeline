analyst_note: "Two findings are unusually load-bearing for the pipeline's own thesis question (company memory: 'Q1 FY27 may be spread, not volume'): organic manufactured H-Acid grew only c.4.8% while headline revenue grew 30.7% on a new near-zero-margin trading line, and export revenue went from zero to 46% of sales with no explanation, contradicting the forex risk note. Both predate Q1 FY27 and should anchor Section 1B/FTTCP method selection (Amendment 17 converter treatment), not be treated as new information. Separately, the subsidiary evidence (findings 8, 9, 13) shows SDPL's capex is older and less complete than a standalone-only view suggests, funded substantially by promoter-linked CCD and warrant capital, and currently loss-making with idle cash. The numeric errors in Notes 35.15 and 35.11(E) (findings 4, 5) are the two most load-bearing for the accounting-quality score: they are wrong numbers in audited disclosures, not wording or cross-reference slips, and they recur identically across both standalone and consolidated statements."
