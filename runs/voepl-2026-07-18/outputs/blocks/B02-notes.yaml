red_flags:
  - "Depreciation method change (WDV to SLM) removed Rs806.83 lakhs of expense in the same year as a large capital raise, explaining ~75% of PBT growth (Note II(d), Note 12, Note 7)."
  - "100% of R&D spend capitalised, none expensed through P&L (Note II(d), Note 12)."
  - "Related-party-like guarantor/mortgagor/land-seller entities (Filaments & Filaments, Reprolite Papers, likely Luma Lamp) sit outside or only partially inside the disclosed related-party universe (Note 32A/B, Note 6/9, Note 14)."
  - "Rs14.38 Cr GST contingent liability omitted from the Company's own contingent-liability note, visible only via CARO annexure (Note 30 vs CARO Annexure A vii(b))."
  - "Unmodified audit opinion and clean IFC certification issued alongside self-disclosed test-check vouching, no physical verification of the largest asset class, and no balance confirmation across the bulk of working capital (Note 38(b), 38(d), 37)."
  - "At least six standalone-vs-consolidated contradictions on solvency/capex-relevant facts, plus two additional internal single-document inconsistencies (Note 3 Authorised Capital table, Note 34 ESOP cancellation sentence)."
questions_for_mgmt:
  - "Are Filaments & Filaments, Luma Lamp/Lumalamp Limited, and Reprolite Papers (India) Pvt Ltd promoter- or relative-controlled entities? Why do they not appear, or appear only inconsistently, in the Note 32 related-party universe given Filaments & Filaments sold the Company Rs2,418 lakhs of its own plant land this year while guaranteeing/mortgaging property for Company debt?"
  - "What is the business rationale for changing the depreciation method from WDV to SLM in FY25, and what is the quantified go-forward P&L impact, given the timing alongside a large capital raise?"
  - "Given the auditor's disclosures of test-check vouching, no physical verification of cash/closing stock, and no independent balance confirmation for most of working capital, what additional procedures support the unmodified opinion and the adequate/effective internal financial controls certification?"
  - "What accounts for the standalone-vs-consolidated inconsistencies in guarantor count, new-plant location/count, and the FY24 gratuity discount rate -- were the two note sets cross-checked before filing, and will FY26 reconcile them?"
  - "What is the nature of the new Service Income line (Rs13.13L to Rs627.82L, ~48x increase), the first-time Rs39.99 lakh GST Assessment Payment, and the status of the unresolved GST input tax credit reconciliation in Note 38(a)?"
