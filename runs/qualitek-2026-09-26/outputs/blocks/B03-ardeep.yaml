strengths_top3:
  - "Clean, unqualified audit opinions on both bases with zero restatements, zero going-concern language, and fully cross-footed notes-to-statements reconciliation across all items independently checked."
  - "Genuinely candid Board's Report ratio-table explanation of the ROE/ROCE decline and an unusually self-aware Chairman's-letter framing about scaling not yet being proven 'responsible, profitable, sustainable'."
  - "Specific, numeric FY27 guidance (35-40% revenue, 25-27% EBITDA margin) that is partly already running at the H2 FY26 exit rate, giving it a concrete and testable basis."
red_flags_top3:
  - "ITCPL share-swap RPT valuation gap: 70% of a majority subsidiary buyout consummated with the promoter entity at a 6.56:1 exchange ratio, 65% above the prior arm's-length cash round, with zero independent valuation disclosed."
  - "Cash conversion deteriorating against debt-funded capex: consolidated CFO/EBITDA 0.46, FCF approx Rs -32.5 Cr consolidated / Rs -31 Cr standalone, financing running almost entirely on new debt, standalone ROE/ROCE down 23%/31%."
  - "Two of three subsidiaries (QTIPL, LabOps Global) carry a newly-surfaced CARO clause (xix) near-term-liquidity qualification on top of being loss-making, while front matter narrates both as strategic growth engines without naming their near-zero current scale."
best_fit_strategy: "GARP (WATCHLIST)"
one_line_verdict: "Clean-mechanics, thin-disclosure GARP candidate; growth quality and cash conversion both need proof."
analyst_note: "The single most consequential finding this stage adds beyond B02 is the CARO clause (xix) qualification at QTIPL and LabOps Global (Phase 1D) - a near-term liquidity/solvency doubt at exactly the two subsidiaries the front matter frames as growth engines (Phase 6E). Read together with the standalone ROE/ROCE decline and the negative FCF, the capital-deployment-ahead-of-cash-generation pattern is now evidenced at three levels: parent (ROE/ROCE), group (CFO/EBITDA), and subsidiary (CARO xix). None of it traces to manipulation - cross-footing is clean throughout - so this is a capital-allocation-timing question, not an accounting-quality one, and should be weighed as such at Stage 11/Role 2."
