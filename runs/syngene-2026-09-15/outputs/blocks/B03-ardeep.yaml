one_line_verdict: "PROCEED WITH CAVEATS: strong balance sheet, unresolved core-customer-loss narrative"
analyst_note: "Most decision-relevant addition beyond Stage 2: the opening letters describe the year's core problem as 'destocking' (temporary, external) while the CDMO operational section calls it 'ongoing product issues' (open-ended) for the same customer -- an unacknowledged internal inconsistency found only by reading front-to-back after the financials (Phase 6E). This bears directly on whether the CDMO refill genuinely replaces a temporary loss or is racing a still-live one, and should be the first question resolved via live verification before Halt 1. Secondary value-add: AOC-1 cross-reference resolved Stage 2's SSS-dividend puzzle (label error, not a real number) and reframed the Syngene USA Inc. loss discrepancy from a ~40% gap to a smaller, still-open ~21% AOC-1-vs-note PAT gap."
