flags: ["Real estate segment recognised Rs368.60 Cr FY25 revenue (AR p.247) against only Rs70 Cr cash received - revenue-vs-cash timing gap", "Raw material cost 74.7% of standalone FY25 revenue (AR p.121) with no disclosed price pass-through/escalation mechanism", "Standalone inventory turnover fell 12.12x to 4.37x and receivables turnover fell 7.02x to 3.17x in one year (AR p.176)", "Open SEBI forensic-audit settlement and MCA Section 206(5) notices to parent and Merino Shelters remain pending/sub-judice (AR p.248-249)"]
