verdict_basis: "Three independently sourced findings across separate registers converge: a live fatal-accident-linked criminal prosecution against the sitting MD, omitted from the FY26 Annual Report; an internally contradictory and still-scaling related-party dependency on the Nirani group; and a Company Secretary removal inside the company's first month as a listed entity. No deal-breaker triggers, and genuine transition evidence exists (non-family CFO/CS, credible new strategics Sumitomo and GAIL, insider buying, 0% MD/ED pay rise), but it has not yet reached the board-composition, pledge, or RPT-scale structural layers."
analyst_note: "The father's political history (former Karnataka Industries Minister, MRN Group founder) and the family's demonstrated industrial operating capability (Riga Sugar Mill revival, Bihar, Dec-2024) are real assets this verdict does not discount; political connection is weighed here as context, not as an automatic negative, per this stage's protocol. The single highest-value open item for claude.ai live verification before Halt 1 is the current status of the Factories Act prosecution (last confirmed data point: 06-Oct-2025 trial-court appearance), because it involves the sitting MD personally, traces to four worker deaths, and was materially under-described in the prospectus and entirely absent from the first Annual Report as a listed company."
