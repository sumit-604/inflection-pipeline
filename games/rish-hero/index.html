// Returns the index (0 based) of the one safe wire.
function safeWire(w, serial) {
  const n = w.length, first = (c) => w.indexOf(c), count = (c) => w.filter((x) => x === c).length;
  const lastDigit = +serial.replace(/\D/g, "").slice(-1);
  if (n === 3) { if (!w.includes("red")) return 1; if (w[0] === "blue") return 2; return first("red"); }
  if (n === 4) { if (count("yellow") >= 2) return first("yellow"); if (lastDigit % 2 === 0) return 2; if (w.includes("white")) return first("white"); return 0; }
  if (w[4] === "green") return 1; if (!w.includes("blue")) return 3; if (/X/.test(serial)) return 4; return first("blue");
}

function humanMat(color) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9 });
}

// Build a human. All options are colours except `hat` (null or a colour).
function makeHuman({
  skin = 0xe0a878,
  shirt = 0x2f7db0,
  trousers = 0x3b3f4a,
  hair = 0x2b1d14,
  shoes = 0x3a2a1c,
  hat = null,
  dress = false, // true = long dress instead of trousers (same colour as shirt)
} = {}) {
  const g = new THREE.Group();
  const skinMat = humanMat(skin);
  const shirtMat = humanMat(shirt);
  const trouserMat = humanMat(dress ? shirt : trousers);
  const hairMat = humanMat(hair);
  const shoeMat = humanMat(shoes);

  const parts = {};

  // ---- Legs (pivot at the hip so they can swing) ----
  const legLen = 0.72;
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.13, legLen, 0);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, legLen, 0.2), trouserMat);
    leg.position.y = -legLen / 2;
    leg.castShadow = true;
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.3), shoeMat);
    shoe.position.set(0, -legLen + 0.05, 0.04);
    pivot.add(leg, shoe);
    g.add(pivot);
    parts[side < 0 ? "legL" : "legR"] = pivot;
  }
  // A dress hangs as one piece over the legs.
  if (dress) {
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 0.7, 8), trouserMat);
    skirt.position.y = 0.42;
    skirt.castShadow = true;
    g.add(skirt);
  }

  // ---- Torso ----
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.62, 0.28), shirtMat);
  torso.position.y = legLen + 0.31;
  torso.castShadow = true;
  g.add(torso);
  parts.torso = torso;

  // ---- Arms (pivot at the shoulder) ----
  const armLen = 0.6;
  const shoulderY = legLen + 0.58;
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.33, shoulderY, 0);
    const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.15, armLen * 0.55, 0.15), shirtMat);
    sleeve.position.y = -armLen * 0.275;
    sleeve.castShadow = true;
    const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.13, armLen * 0.45, 0.13), skinMat);
    forearm.position.y = -armLen * 0.55 - armLen * 0.225;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 6), skinMat);
    hand.position.y = -armLen - 0.02;
    pivot.add(sleeve, forearm, hand);
    g.add(pivot);
    parts[side < 0 ? "armL" : "armR"] = pivot;
  }

  // ---- Neck + head ----
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.12, 8), skinMat);
  neck.position.y = legLen + 0.66;
  g.add(neck);

  const headY = legLen + 0.92;
  const head = new THREE.Group();
  head.position.y = headY;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.23, 14, 12), skinMat);
  skull.castShadow = true;
  head.add(skull);

  // Eyes: two little dark dots, slightly apart, on the front (+Z).
  // We keep them in `parts` so they can blink.
  // Big readable eyes: a white, a dark pupil that can look sideways, and a skin-coloured eyelid that blinks.
  const eyeMat = humanMat(0x22201c), whiteMat = humanMat(0xffffff);
  parts.pupils = []; parts.lids = [];
  for (const side of [-1, 1]) {
    const eye = new THREE.Group(); eye.position.set(side * 0.085, 0.045, 0.195);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), whiteMat); white.scale.set(1, 0.85, 0.6); eye.add(white);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 6), eyeMat); pupil.position.set(0, 0, 0.04); eye.add(pupil); parts.pupils.push(pupil);
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), skinMat); lid.scale.set(1.05, 1, 0.65); lid.position.y = 0.002; lid.rotation.x = -0.15; lid.scale.y = 0.05; eye.add(lid); parts.lids.push(lid);
    head.add(eye);
    parts[side < 0 ? "eyeL" : "eyeR"] = eye;
    // A thick eyebrow above each eye.
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.022, 0.014), hairMat);
    brow.position.set(side * 0.085, 0.115, 0.21);
    head.add(brow);
  }
  // A mouth with lips and a strip of teeth that shows in a smile or a laugh.
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.02), humanMat(0x9b4b3a));
  mouth.position.set(0, -0.08, 0.215);
  head.add(mouth);
  parts.mouth = mouth;
  const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.012, 0.01), whiteMat); teeth.position.set(0, 0.004, 0.011); teeth.visible = false; mouth.add(teeth); parts.teeth = teeth;
  const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 0.01), humanMat(0xe06070)); tongue.position.set(0, -0.006, 0.011); tongue.visible = false; mouth.add(tongue); parts.tongue = tongue;
  // A nose.
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.06, 6), skinMat); nose.rotation.x = Math.PI / 2; nose.position.set(0, -0.01, 0.235); head.add(nose);
  // Ears.
  for (const side of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), skinMat);
    ear.position.set(side * 0.22, 0, 0);
    head.add(ear);
  }
  // Hair: a cap over the top-back of the head.
  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(0.245, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.55),
    hairMat

function animateHuman(group, dt, walking, speed = 1, talking = false) {
  const p = group.userData.parts;

  const u = group.userData;

  // ---- Face: blink every few seconds ----

  if (u.blinkTimer <= 0) {
    u.blinkTimer = 2 + Math.random() * 3.5;
    u.blinkLeft = 0.14;
  }
  if (u.blinkLeft > 0) u.blinkLeft -= dt;

  if (p.teeth) p.teeth.visible = mood === "happy" || mood === "laugh"; if (p.tongue) p.tongue.visible = mood === "laugh";
  if (p.brows) for (const [i, b] of p.brows.entries()) { const side = i === 0 ? -1 : 1; const ty = mood === "surprised" ? 0.145 : mood === "happy" || mood === "laugh" ? 0.125 : mood === "thinking" ? (i === 1 ? 0.14 : 0.11) : (mood === "sad" || mood === "stern" || mood === "angry") ? 0.1 : 0.115; b.position.y += (ty - b.position.y) * Math.min(1, dt * 8); b.rotation.z += (((mood === "stern" ? -0.3 : mood === "angry" ? -0.55 : mood === "sad" ? 0.35 : 0) * side) - b.rotation.z) * Math.min(1, dt * 8); }

  const mouthPosY = mood === "happy" || mood === "laugh" ? -0.065 : mood === "sad" ? -0.1 : -0.08;
  if (p.head && mood === "laugh" && !talking) p.head.rotation.z = Math.sin(performance.now() / 120) * 0.08; else if (p.head && mood !== "laugh" && !talking) p.head.rotation.z *= 1 - Math.min(1, dt * 6);

  if (p.mouth) {
    const now = performance.now();
    p.mouth.position.y += (mouthPosY - p.mouth.position.y) * Math.min(1, dt * 8);
    if (talking) {
      const open = 1 + Math.abs(Math.sin(now / 55)) * 3.2;

    p.legL.rotation.x = s;
    p.legR.rotation.x = -s;
    p.armL.rotation.x = -s * 0.8;
    p.armR.rotation.x = s * 0.8;
  } else {
    // Ease limbs back to rest.
    for (const k of ["legL", "legR", "armL", "armR"]) {

    const breathe = Math.sin(performance.now() / 600) * 0.01;

}

// ---- Particles (sparks, glass, wood, dust, smoke) ----
const FX = { list: [], geo: null };
function fxInit(scene) { FX.geo = new THREE.BoxGeometry(0.12, 0.12, 0.12); FX.scene = scene; }
function burst(x, y, z, color, n = 12, speed = 4, life = 0.8, size = 1, grav = 9) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(FX.geo, mat(color)); m.position.set(x, y, z); m.scale.setScalar(size * rr(0.5, 1.3));
    FX.scene.add(m);
    FX.list.push({ m, vx: rr(-1, 1) * speed, vy: rr(0.3, 1.2) * speed, vz: rr(-1, 1) * speed, life, max: life, grav });
  }
}
function puff(x, y, z, color, r = 1, life = 1.2, opacity = 0.6) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  m.position.set(x, y, z); m.scale.setScalar(r * 0.3); FX.scene.add(m);
  FX.list.push({ m, puff: true, r, life, max: life, op: opacity });
}
function tracer(a, b, color = 0xffe066) {
  const g = new THREE.BufferGeometry().setFromPoints([a, b]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 }));
  FX.scene.add(l); FX.list.push({ m: l, line: true, life: 0.08, max: 0.08 });
}
function fxUpdate(dt) {
  for (let i = FX.list.length - 1; i >= 0; i--) {
    const f = FX.list[i]; f.life -= dt;
    if (f.puff) { const k = 1 - f.life / f.max; f.m.scale.setScalar(f.r * (0.3 + 0.7 * Math.min(1, k * 2.5))); f.m.material.opacity = f.op * Math.min(1, f.life / f.max * 1.5); }
    else if (!f.line) { f.vy -= f.grav * dt; f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt; if (f.m.position.y < 0.05 && f.grav > 0) { f.m.position.y = 0.05; f.vx *= 0.6; f.vz *= 0.6; f.vy = 0; } }
    if (f.life <= 0) { FX.scene.remove(f.m); if (f.puff || f.line) { f.m.geometry.dispose(); f.m.material.dispose(); } FX.list.splice(i, 1); }
  }
}
function fxClear() { for (const f of FX.list) FX.scene.remove(f.m); FX.list.length = 0; }

// Bullet hole on a wall: a small dark square that stays.
function bulletHole(L, p, n) {
  if (!L || L.holes > 80) return;
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.07, 6), new THREE.MeshBasicMaterial({ color: 0x1a1a1a }));
  m.position.set(p.x + n.x * 0.02, p.y, p.z + n.z * 0.02); m.lookAt(p.x + n.x, p.y, p.z + n.z);
  L.group.add(m); L.holes = (L.holes || 0) + 1;

// ---- Soft round shadows under every person: they make the 3D world feel solid ----
const SHADOWS = { pool: [], geo: null, mat: null, used: 0 };
function updateShadows() {
  if (!SHADOWS.geo) { SHADOWS.geo = new THREE.CircleGeometry(0.42, 18); SHADOWS.geo.rotateX(-Math.PI / 2); SHADOWS.mat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false }); }
  const list = [];
  if (G.L && G.mode !== "chase" && G.mode !== "menu" && G.mode !== "card") {
    const P = G.P; if (P && P.g.visible) { const fl = floorAt(P.x, P.z); if (fl > -5) list.push([P.x, P.z, fl, P.g.userData.s * Math.max(0.5, 1 - (P.y - fl) * 0.25)]); }
    for (const e of G.enemies) if (e.active && e.g.visible) list.push([e.x, e.z, Math.max(0, floorAt(e.x, e.z)), e.s * (e.st === "down" ? 1.5 : 1)]);
    for (const id in G.npcs) { const n = G.npcs[id]; if (n.g.visible && !n.bob) list.push([n.x, n.z, Math.max(0, floorAt(n.x, n.z)), (n.g.userData.s || 1) * (n.pose === "down" ? 1.5 : 1)]); }
  }
  let i = 0;
  for (const [x, z, y, s] of list) { let m = SHADOWS.pool[i]; if (!m) { m = new THREE.Mesh(SHADOWS.geo, SHADOWS.mat); m.renderOrder = 1; scene.add(m); SHADOWS.pool.push(m); } m.visible = true; m.position.set(x, y + 0.03, z); m.scale.setScalar(s); i++; }
  for (; i < SHADOWS.pool.length; i++) SHADOWS.pool[i].visible = false;
  SHADOWS.used = list.length;
}
// ---- Clouds drifting in the sky over outdoor places ----

// ---- Saved progress (optional: works without storage) ----
function saveKey() { return G.embed ? "rishhero.v2.sd." + G.embed.slot : "rishhero.v2"; }
function loadSave() { try { const s = JSON.parse(localStorage.getItem(saveKey()) || "{}"); if (typeof s.unlocked === "number") G.save.unlocked = s.unlocked; if (typeof s.diff === "number") G.save.diff = s.diff; for (const k of ["profile", "pages", "life", "storyDone", "stars", "best", "trophies", "tot", "suit", "music"]) if (s[k] != null) G.save[k] = s[k]; } catch (e) { /* no storage */ } G.diff = G.save.diff; }

// ---- Three.js scene ----
let renderer, scene, camera, hemi, sun;
function initGfx() {
  const cv = $("cv");
  try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" }); }
  catch (e) { $("nogl").hidden = false; throw e; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9ecbf0);
  scene.fog = new THREE.Fog(0x9ecbf0, 60, 170);
  camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 400);
  hemi = new THREE.HemisphereLight(0xffffff, 0x8d7b5a, 1.25); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff2d6, 1.5); sun.position.set(30, 60, 20); scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  fxInit(scene);

// ---- Boss brains ----
function bossBrain(e, dt, d, toP, face) {
  const P = G.P; let walk = 0, pose = null;
  if (e.st === "low") { pose = "stun"; return { walk, pose }; }
  if (e.st === "scripted") { face(toP, 4); return { walk, pose }; }
  if (e.kind === "kade") { // phase 1: gun fight from cover
    if (e.st === "alert" || e.st === "windup" || e.st === "attack") {
      e.st = "alert"; pose = "aim"; face(toP, 6);
      const see = los(e.x, e.z, P.x, P.z);
      let mx = 0, mz = 0; if (d < 7) { mx = -Math.sin(toP); mz = -Math.cos(toP); } else if (d > 13 || !see) { const fd = flowDir(e.x, e.z); mx = fd.x; mz = fd.z; } else { const s = Math.sin(e.t * 0.8) > 0 ? 1 : -1; mx = Math.cos(toP) * s; mz = -Math.sin(toP) * s; }
      walk = moveEnemy(e, mx, mz, 2.8 * dt);
      if (e.cd <= 0 && see && d < 24) enemyShoot(e, d);
    }
    return { walk, pose };
  }
  // Bull
  if (e.st === "alert") {
    face(toP, 6);
    if (d > 3.8 && e.cd <= 0) { e.st = "charge_w"; e.t = 0; pop(e, "CHARGE!"); sfx("alert"); }
    else if (d > 1.9) { const fd = flowDir(e.x, e.z); walk = moveEnemy(e, fd.x, fd.z, 2.3 * dt); }
    else if (e.cd <= 0) { e.st = "windup"; e.t = 0; e.wind = 0.8; }
  } else if (e.st === "windup") { pose = "windup"; face(toP, 8); if (e.t >= e.wind) { e.st = "attack"; e.t = 0; if (d < 2.5 && Math.abs(angDiff(e.yaw, toP)) < 1.2) hurtPlayer(e.dmg, e); } }
  else if (e.st === "attack") { pose = "punch"; if (e.t > 0.35) { e.st = "alert"; e.t = 0; e.cd = rr(0.6, 1.4); } }
  else if (e.st === "charge_w") { pose = "windup"; face(toP, 10); if (e.t > 0.8) { e.st = "charge"; e.t = 0; e.cdir = faceDir(e.yaw); } }
  else if (e.st === "charge") {
    walk = moveEnemy(e, e.cdir.x, e.cdir.z, 11 * dt);
    if (!walk) { e.st = "dazed"; e.t = 0; e.dur = 3.2; G.shake = 0.9; pop(e, "CRASH! Hit him now!"); sfx("thud"); burst(e.x + e.cdir.x, 1.5, e.z + e.cdir.z, 0xaaaaaa, 14, 3, 0.7); }
    else if (d < 1.25 && P.iv <= 0 && P.st !== "roll") { e.st = "grab"; e.t = 0; P.st = "stagger"; P.stT = 0; P.dur = 9;
      qte({ type: "mash", key: "punch", n: 10, time: 3.4, label: "Bull grabbed you! Smash J to break free!" }, (ok) => { P.st = "idle"; if (ok) { stunEnemy(e, 1.6); pop(e, "BROKE FREE!"); moveBody(P, -e.cdir.x * 2, -e.cdir.z * 2); } else { hurtPlayer(20, null, true); e.st = "alert"; e.t = 0; e.cd = 1.5; } }); }
    else if (e.t > 1.8) { e.st = "alert"; e.t = 0; e.cd = rr(1.4, 2.4); }
  }
  else if (e.st === "dazed") { pose = "stun"; if (e.t > e.dur) { e.st = "alert"; e.t = 0; e.cd = 1.2; } }
  else if (e.st === "grab") pose = "grab";
  return { walk, pose };
}

// Like RishSchoolDays: the years go by (school, college, one job). Every year there is an emergency in
// Suryanagar: accidents, fires, attacks. He has one normal job and he is also the saviour, like
// Shaktimaan, but with no secret: the whole world knows who he is.
const CITY_W = 48, CITY_H = 32;
const BLOCKS = [
  ["home", "Home", 1, 9, 1, 5, "bld", 5, 0xf4a261], ["school", "Sunrise Public School", 12, 23, 1, 5, "bld", 7, 0xfff1d6],
  ["hospital", "City Hospital", 26, 37, 1, 5, "bld", 12, 0xf8f9fa], ["fire", "Fire Station", 40, 46, 1, 5, "bld", 7, 0xe63946],
  ["police", "Police Station", 1, 9, 8, 15, "bld", 8, 0x3a86ff], ["market", "Market", 12, 23, 8, 15, "open", 0, 0],
  ["park", "City Park", 26, 37, 8, 15, "park", 0, 0], ["bank", "Bank", 40, 46, 8, 15, "bld", 10, 0xd4a373],
  ["office", "City Office", 1, 9, 18, 25, "bld", 16, 0x8ecae6], ["flats", "Apartments", 12, 23, 18, 25, "bld", 20, 0xcdb4db],
  ["mall", "Mall", 26, 37, 18, 25, "bld", 9, 0xffb703], ["college", "City College", 40, 46, 18, 25, "bld", 8, 0xa3b18a],
];
const PLACES = {}; const CITY_HGT = [], CITY_COL = [];
(function buildCity() {
  const g = []; for (let y = 0; y < CITY_H; y++) { g.push(Array(CITY_W).fill("_")); CITY_HGT.push(Array(CITY_W).fill(0)); CITY_COL.push(Array(CITY_W).fill(0)); }
  for (let y = 0; y < CITY_H; y++) for (let x = 0; x < CITY_W; x++) {
    if (y === 0 || y === CITY_H - 1 || x === 0 || x === CITY_W - 1) g[y][x] = "o";
    else if (y >= 27 && y <= 29) g[y][x] = x === 24 || x === 25 ? "=" : "w";
    else if (y === 6 || y === 7 || y === 16 || y === 17) g[y][x] = "=";
    else if ((x === 10 || x === 11 || x === 24 || x === 25 || x === 38 || x === 39) && y < 26) g[y][x] = "=";
  }
  for (const [id, name, x0, x1, y0, y1, kind, h, col] of BLOCKS) {
    const door = [Math.round((x0 + x1) / 2), y1];
    PLACES[id] = { id, name, x0, x1, y0, y1, kind, door };
    for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
      if (kind === "bld") { g[y][x] = "#"; CITY_HGT[y][x] = h; CITY_COL[y][x] = col; }
      else if (kind === "park") g[y][x] = ",";
    }
    if (kind === "park") { for (const [x, y] of [[x0 + 1, y0 + 1], [x1 - 1, y0 + 1], [x0 + 1, y1 - 1], [x1 - 1, y1 - 1], [x0 + 3, y0 + 1]]) g[y][x] = "o"; for (let y = y0 + 3; y <= y0 + 4; y++) for (let x = x0 + 4; x <= x0 + 6; x++) g[y][x] = "w"; PLACES[id].door = [x0 + 8, y1 - 1]; PLACES[id].tree = [x0 + 3, y0 + 1]; }

  $("m-play").onclick = () => startChapter(u); $("m-ch").onclick = chapters; $("m-how").onclick = howTo; $("m-set").onclick = settings; $("m-about").onclick = about; $("m-tro").onclick = () => trophies(menu); $("m-suit").onclick = () => suits(menu); $("m-diary").onclick = diary; $("m-who").onclick = () => login(menu); $("m-story").onclick = storyPage; if ($("m-life")) $("m-life").onclick = () => startLife(!G.save.life || G.save.life.done); if ($("m-med")) $("m-med").onclick = () => medals(menu); if ($("m-sd")) $("m-sd").onclick = () => sdBack(false);
}
function chapters() {
  showScr(`<h2>Chapters</h2><div class="chl">${CHAPTERS.map((c, i) => `<button class="btn ch" data-i="${i}" ${i > G.save.unlocked ? "disabled" : ""}><b>${c.name}</b> ${c.title} ${c.gun ? "🔫" : ""}${i > G.save.unlocked ? " 🔒" : ""}${G.save.stars && G.save.stars[i] ? " " + "⭐".repeat(G.save.stars[i]) : ""}${G.save.best && G.save.best[i] ? ` · ⏱ ${mmss(G.save.best[i])}` : ""}</button>`).join("")}</div><p class="mut">Stuck? Every chapter has a ⏭ Skip button.</p><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("card").querySelectorAll(".ch").forEach((b) => b.onclick = () => startChapter(+b.dataset.i)); $("b").onclick = menu;
}
function howTo() {
  showScr(`<h2>How to play</h2><div class="keys">
  <p><b>Move</b> W A S D, or ↑ ↓ to walk and ← → to turn. Drag the screen to look around and up or down (or Page Up / Page Down). <b>V</b> or 👁 View: first person (Rish\'s eyes) or third person.</p>
  <p><b>Shift</b> run · <b>Space</b> jump · <b>C</b> crouch (sneak), or slide when running</p>
  <p><b>J</b> punch (3 in a row = uppercut) · <b>K</b> kick (breaks guards) · <b>L</b> block (block just as they hit = COUNTER) · <b>Q</b> dodge roll</p>
  <p><b>E</b> takedown from behind, untie, pick up, use · <b>F</b> throw a book, duster or brick: at an enemy, or at a light or extinguisher near him</p>
  <p><b>Guns (chapter 6 only):</b> a pistol, and a machine gun if you find it. <b>F</b> or click to shoot (hold F for the machine gun), <b>R</b> reload, <b>X</b> switch guns. The red laser shows the target. A gold ring means the room can do the work: lights fall, extinguishers blind, barrels explode, steam burns, glass shatters, crates break.</p>
  <p><b>Stealth:</b> yellow cones are eyes. "?" = he heard you. "!" = he saw you.</p>
  <p><b>Bombs:</b> open the manual, count the wires, follow the rule. Wrong wire = BOOM.</p>
  <p><b>New moves:</b> <b>Shift + K</b> (or K in the air) flying kick · <b>B</b> spin kick (hits everyone around you) · <b>G</b> grab a man and throw him (he knocks others over) · men knocked into a wall get a WALL SLAM.</p>
  <p><b>⚡ Hero Power:</b> every hit fills the ⚡ bar. When it is full, press <b>Z</b> for the HERO SMASH: Rish jumps and smashes the ground, and every man around him flies. Knock out 3 or more men at once for slow motion and the hero theme music.</p>
  <p><b>⏭ Skip</b> skips a talk, a hard fight, a puzzle or the chase. Tap it twice.</p></div><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("b").onclick = menu;
}
function settings() {
  showScr(`<h2>Settings</h2><p>Difficulty</p><div class="row">${DIFF.map((d, i) => `<button class="btn ${G.diff === i ? "go" : ""}" data-d="${i}">${d.name}</button>`).join("")}</div>
  <p>Hero theme music (plays when you knock out 3 or more men at once)</p><div class="row"><button class="btn ${G.save.music === false ? "" : "go"}" id="mus">${G.save.music === false ? "🎵 Off" : "🎵 On"}</button></div>
  <p>Sound</p><div class="row"><button class="btn ${G.mute ? "" : "go"}" id="snd">${G.mute ? "🔇 Off" : "🔊 On"}</button></div><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("card").querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { G.diff = G.save.diff = +b.dataset.d; writeSave(); settings(); });
  $("snd").onclick = () => { G.mute = !G.mute; settings(); }; $("mus").onclick = () => { G.save.music = G.save.music === false; writeSave(); if (G.save.music) { const tm = G.test; G.test = false; G.musicEnd = 0; heroTheme(); G.test = tm; } settings(); }; $("b").onclick = menu;
}

 alt="Rishabh Sharma"><h2 style="text-align:center">About Rish Hero</h2>

  <p>Rish joins Sunrise Public School in Suryanagar, the same school, classmates and teachers as RishSchoolDays. For one year nobody likes him. Kids push him, laugh at him and ignore him. Some teachers blame him. Then, on Annual Day, the Black Viper gang attacks the school. Rish frees his school, stops the bombs, beats Bull and Viktor Kade, and stops bombs in five cities around the world.</p>

function storyPage() {
  showScr(`<h2>📖 The Story</h2><div class="diary"><h3>Who</h3><p class="dp">${STORY.who}</p><h3>Why the attack</h3><p class="dp">${STORY.why}</p><h3>Kade's plan</h3><p class="dp">${STORY.plan}</p><h3>The heart of the story</h3><p class="dp">${STORY.heart}</p><h3>Timeline</h3>${STORY.timeline.map(([t, x]) => `<p class="dp"><b>${t}</b>: ${x}</p>`).join("")}</div><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("b").onclick = menu;
}
function diary() {
  const rows = Object.entries(PAGES).map(([id, list]) => { const c = CHAPTERS.find((q) => q.id === id); return `<h3>${c.name}: ${c.title}</h3>` + list.map((p, i) => (G.save.pages && G.save.pages[id + ":" + i]) ? `<p class="dp">📔 ${p[2]}</p>` : `<p class="dp mut">🔒 A page is still hidden in this chapter.</p>`).join(""); }).join("");
  showScr(`<h2>📔 Rish's Diary</h2><p class="mut">Rish wrote these pages during his lonely year. Find them hidden in the chapters.</p><div class="diary">${rows}</div><div class="row"><button class="btn alt" id="b">◀ Back</button></div>`);
  $("b").onclick = menu;
}

// ---- Phone controls ----
function initTouch() {
  const touch = matchMedia("(pointer: coarse)").matches || /touch=1/.test(location.search);
  document.body.classList.toggle("touch", touch);
  const stick = $("stick"), knob = $("knob"); let sid = null, cx = 0, cy = 0;
  stick.addEventListener("pointerdown", (e) => { sid = e.pointerId; const r = stick.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; try { stick.setPointerCapture(sid); } catch (er) { /* fine */ } mv(e); });
  const mv = (e) => { if (e.pointerId !== sid) return; let dx = (e.clientX - cx) / 50, dy = (e.clientY - cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } JOY.x = dx; JOY.y = dy; JOY.on = l > 0.15; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`; };
  stick.addEventListener("pointermove", mv);
  const up = (e) => { if (e.pointerId !== sid) return; sid = null; JOY.on = false; JOY.x = JOY.y = 0; knob.style.transform = ""; };
  stick.addEventListener("pointerup", up); stick.addEventListener("pointercancel", up);
  document.querySelectorAll("#pad [data-code]").forEach((b) => {
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); keyDown(b.dataset.code); b.classList.add("down"); });
    const rel = (e) => { keyUp(b.dataset.code); b.classList.remove("down"); }; b.addEventListener("pointerup", rel); b.addEventListener("pointercancel", rel); b.addEventListener("pointerleave", rel);
  });
  $("btnRun").onclick = () => { runToggle = !runToggle; $("btnRun").classList.toggle("on", runToggle); };
  $("pauseB").onclick = () => togglePause(); $("viewB").onclick = () => toggleView();
  $("skipB").onclick = () => { if (G.skipArm > 0) { G.skipArm = 0; $("skipB").textContent = "⏭ Skip"; skipNow(); } else { G.skipArm = 2.5; $("skipB").textContent = "⏭ Tap again to skip"; } };
  $("dlgSkip").onclick = (e) => { e.stopPropagation(); skipDialog(); };
  $("dlg").onclick = () => nextLine();
  $("failRetry").onclick = retryFail; $("failSkip").onclick = skipFail; $("failMenu").onclick = menu;
  $("puzSkip").onclick = () => skipPuzzle();
}
