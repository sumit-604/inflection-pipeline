analyst_note: >
  Two items dominate this pass and both sit on the disclosure-quality axis rather than the
  operating-performance axis: (1) the Note 33 contingent-liability blank next to a ~Rs110 Cr CARO
  disputed-dues table in the same document is the kind of gap a verifier should independently confirm
  by re-reading both sections, since it is easy to miss if only Note 33 is checked; (2) the GST SCN
  absence from the notes is timing-sensitive - the first notice (Rs6.53 Cr) existed before the
  25-May-2026 board approval date, which is the fact that elevates it from "routine post-year-end
  litigation" to a genuine notes-completeness question worth a direct management question at Halt 1.
  Separately, the lease cash-outflow growth (+67.4%) outpacing revenue growth (+32.9%) and the 9-to-30
  finance-lease reclassification are the two numbers most load-bearing for the FY27 cash-EBITDA
  thesis; downstream stages building the cash-EBITDA bridge should anchor to Note 38's Rs4,121.64mn
  FY26 lease cash outflow figure rather than re-deriving it from the cash flow statement alone.
