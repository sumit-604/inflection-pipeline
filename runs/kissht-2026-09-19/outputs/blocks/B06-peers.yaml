  demand: "Steady-to-strong overall across all three peers, each layering at least one specific caution pocket (SBICARD: Southern-India IT-salaried stress; UGROCAP: small-ticket MSME over-leverage) on top of growth commentary, broadly consistent in shape, not axis, with Kissht's own divergence narrative."
  pricing_inputs: "Cost of borrowing flat-to-rising across SBICARD and POONAWALLA in Q1 FY27, contradicting Kissht's cited system-wide easing tailwind; asset yields stable-to-slightly-up across peers, with no peer describing the FLDG/off-book-mix margin compression Kissht cites for itself."
