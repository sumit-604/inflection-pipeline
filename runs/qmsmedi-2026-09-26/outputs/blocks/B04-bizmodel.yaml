  - "Q-Devices standalone revenue and gross margin not separately disclosed anywhere; bundled inside the Rs 119 Cr FY26 Products total."
  - "Per-camp and per-PSP fee levels are derived (revenue divided by count), not company-stated; NOT FOUND as disclosed unit prices."
  - "No named public competitor exists in any filed document (AR, decks, Rights Issue LOF); competitive positioning map (2B) could not be built from primary sources."
  - "Top-client / customer revenue concentration percentage not disclosed anywhere in the corpus."
flags:
