  - {question: "Do peer distributors/OEM-channel commentators corroborate new-PC retail price inflation of the magnitude GNG cites (India entry laptop Rs25,500 to ~Rs40,000, +57% in 6 months; international $315 to $440, +40% in 6 months)?", why: "Validates or undermines the core refurbished-becomes-only-affordable-option narrative driving GNG's volume and ASP guidance", check_peers: ["Redington", "Rashi Peripherals (RPTECH)", "CNL"]}
