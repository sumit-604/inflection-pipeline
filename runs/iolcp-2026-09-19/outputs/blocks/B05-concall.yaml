analyst_note: >
  The single clearest credibility data point in this corpus is the FY26 EBITDA margin guidance
  walked down twice within one call (14-15% to 13% to 11-12%) before being met at 12.4% --
  management under-delivered against its own earlier promise, then met its own reduced promise,
  and both the promise-cut and the eventual beat are on the record in management's own words.
  That combination (a real cut, honestly narrated, then a beat of the cut number) is why this
  run grades B rather than A or C: it is neither clean over-delivery nor a pattern of hollow
  promises. The greenfield site's four-touchpoint timeline vagueness and the total silence on
  the AR's promoter/RPT/receivables threads are the two items most worth carrying into the
  Halt-1 dossier as verification priorities, since neither is a concall problem on its own terms
  (nobody asked) but both compound the B02/B03 findings from the same threads.
