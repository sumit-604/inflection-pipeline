analyst_note: "The order book has not moved off roughly Rs 900-926 Cr in eleven months despite continuously claimed new wins in Saudi, Africa and elsewhere; management's explanation (conservative FX rounding) is never shown with a reconciling number, which is the single most important unresolved fact for LBF1. FY27 growth guidance was cut three times across three consecutive calls without ever being framed as a cut. Two mitigating signals keep this from a D grade: FY26 revenue growth of 28.4% was real and delivered, and management does proactively surface bad news (UAE war drag, RMC inflation, receivable build-up) rather than only responding under analyst pressure. The stock-price and percentage-of-completion questions are the clearest repeated-evasion evidence, with identical non-committal answers recurring quarter after quarter."
