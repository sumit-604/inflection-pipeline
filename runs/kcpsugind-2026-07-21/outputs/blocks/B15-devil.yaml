top_counters:
  - "The 35% base holdco discount is too harsh: only ~Rs 65.59 Cr (~20-24%) of the book is lien-marked (not ~70% as the brief claimed), the securing WCTL was fully repaid, and CARE rates the group net-debt-negative; at a 20-25% discount the base SOTP flips above CMP, so 'the market already fully prices it' is an artifact of the chosen discount, not a fact."
  - "Eimco is undervalued at 8x: a 31.3%-PBIT-margin engineering franchise with a Rs 257 Cr order (3.3x segment revenue) against a 25x sector cap; 12x adds ~Rs 6.5/share and, if the order executes, the slice re-rates to Rs 250+ Cr, well above the base."
  - "The 'structural' sugar-loss label is overstated: sugar PBIT was +Rs 6.51 Cr in FY24 and collapsed on a 39-42% cane-crush drop (cyclical/weather), not a permanent condition; a cane + E20 recovery swings PBIT ~+Rs 20-25 Cr, the gap between base and bull."
  - "Single point of failure: the Rs 257 Cr Eimco order is unfiled (operator-relayed, released run-date morning, no Reg 30) yet carries the Revenue transition upgrade, the Eimco valuation, and the entire reason-to-monitor at once; if it slips or shrinks, three things fail together and the case reverts to Hard AVOID."
  - "Structural value trap: the discount is permanent (no demerger/buyback/dividend catalyst, FII ~3.31% fragmented) while family Schedule-V pay in a loss year, 26.9% related-party FDs, and a non-distributed Rs 332 Cr portfolio remove any incentive to close it, and a ~Rs 30 Cr/yr cash burn (CFO -30.89 Cr, DSCR 0.25x) erodes the very asset being bought."
