asset_intensity: "medium"
wc_intensity: "high"
pricing_power: "weak"
cyclicality: "secular-growth"
moats_present:
  - {name: "Distribution network (11,000+ dealers, 21 states, 9 years built)", durability: "medium-high"}
  - {name: "Regulatory/licensing (BIS, BIS-ER/STQC certification excluding non-certified foreign brands)", durability: "medium-high, policy-dependent"}
  - {name: "Cost advantage from backward integration (Gandhinagar SMT/assembly)", durability: "medium, unproven at scale"}
  - {name: "Brand (Prizor)", durability: "low-medium"}
valuation_methods:
  primary: {method: "EV/EBITDA", why: "Normalizes across the large FY24-FY25 leverage/equity swing and the trading-to-manufacturing cost-structure transition, without P/E financing-structure noise"}
  secondary: {method: "EV/Sales", why: "Cross-check for a still-scaling, still-transitioning hardware business where EBITDA margin mix is unsettled"}
  tertiary: {method: "P/E", why: "Sanity-check only; earnings base not comparable across the transition and only ~2 years of listed history"}
  not_applicable: ["DCF", "Asset-based/Book value", "Sum-of-the-parts", "Replacement cost"]
irrelevant_ratios:
  - {ratio: "Trailing P/E", why: "Only ~2 years of scaled listed history mid a business-model transition"}
  - {ratio: "Net profit margin trend alone", why: "Mechanically driven by the trading-vs-manufacture COGS mix, which flipped between FY25 and FY26"}
  - {ratio: "Return on Equity", why: "Distorted by the FY24 IPO equity-base jump"}
  - {ratio: "Debt/Equity point-in-time", why: "Fell on IPO equity infusion even as short-term WC borrowings rose ~11.5x the following year"}
  - {ratio: "Fixed-asset turnover pre-FY26", why: "Plant & machinery net block effectively nil at FY25; manufacturing asset base only appears from FY26"}
must_track_metrics:
  - {metric: "EBITDA margin", healthy: "20-24%", red_flag: "sustained drop below ~18%"}
  - {metric: "Materials-consumed % vs Stock-in-Trade purchase % of revenue", healthy: "materials-consumed ratio rising, margin held/improved", red_flag: "reversal toward trading-dominant mix without margin gain"}
  - {metric: "Short-term borrowings / trailing EBITDA", healthy: "below 1.5x", red_flag: "above 2x"}
  - {metric: "Inventory turnover", healthy: "3-4x", red_flag: "below 2.5x"}
  - {metric: "Working capital days", healthy: "declining trend (~90 days)", red_flag: "rising again as growth continues"}
unit_economics:
  unit: "one CCTV camera unit sold"
  revenue_per_unit: "NOT FOUND"
  margin_per_unit: "NOT FOUND"
  key_lever: "manufactured-vs-purchased mix (Gandhinagar SMT/assembly) and dealer-network volume growth"
mgmt_questions:
  - "What proportion of FY26 revenue was manufactured in-house at Gandhinagar versus purchased as stock-in-trade, and target mix for FY27?"
  - "Current utilization of the 16 lakh unit camera assembly capacity and 50 lakh unit SMT line?"
  - "Status of the IndieSemic SoC MoU and impact on ~20% import dependency?"
  - "Why did OCF diverge so sharply from PAT in FY26, and how is the WC gap funded?"
  - "What drove the FY24 Om Security Solutions related-party sale, why nil in FY25, other related entities in the dealer network?"
  - "Realistic AI-camera revenue contribution in FY27, and margin premium?"
  - "How dependent is the thesis on the BIS-ER exclusion of non-certified foreign brands staying in force?"
one_line_verdict: "Fast-growing, policy-tailwind-driven hardware assembler mid-transition to manufacturing, with margin and cash-conversion durability not yet proven."
