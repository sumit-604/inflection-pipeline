analyst_note: "Round 2 correction. The margin finding is real but was overstated in round 1: corrected to like-for-like EBITDA-vs-EBITDA and PAT-vs-PAT bases, Quest Flow Controls beats Rappid by 4.3-5.6 and 2.1-2.7 points respectively, not 'roughly double,' and the CMD never claimed 12% was a structural niche floor - he said the opposite. The gap still matters for the FY27 margin-recovery trigger (B05 priority 5), but it should carry proportionate, not maximal, weight in Role 3. Two upgrades this round (Claim 1's PVC corroboration, Claim 4's cost-share analog) came from peer material B06 round 1 had access to but did not use. The demand-side corroboration remains the strongest, unchanged finding: real across all eight transcripts, but the naval/marine TAM itself stays unsized by any peer, including KSB with full analyst coverage and an active marine push - this should still lower, not raise, confidence in any bottom-up marine TAM estimate produced later in this pipeline."
