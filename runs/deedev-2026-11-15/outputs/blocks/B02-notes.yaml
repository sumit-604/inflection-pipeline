going_concern_language: "NONE as doubt language. Note 2.1 p.164: 'prepared the financial statements on the basis that it will continue to operate as a going concern'. Auditor reports (both) carry no material-uncertainty-on-going-concern paragraph. Cons. Note 45(b) p.351: MPPL 'adversely impacted the operational viability of MPPL and created uncertainty over its future cash flows'; management 'unable to assess' carrying value of 4,761.67 lacs 'pending final outcome of the appeal before APTEL and evaluation of strategic alternatives'. Subsidiary level only."
analyst_note: "Units INR lacs, not converted. Quality is mixed: policies and covenants read normally and no default or waiver is disclosed, but the qualified group opinion, the unprovided Abohar item, factored receivables and an unreconciled consolidated layer lower reliance. The standalone and consolidated filings state Abohar and customer data differently; treat the standalone Note 46 as the fuller text. Reported gearing excludes trade credits; stage 10 and valuation should show both. Pass 1 'no exceptional items' was wrong (labour code 119.23 / 194.44 is exceptional). Thailand interest-income fall is the FY25 loan conversion, not a signal. Open NOT FOUND items: Abohar billing after 31 Mar 2025, Thailand cash interest, covenant headroom, 762.90 payable nature, 39.74 provision home."
