analyst_note: "Growth is real at core PBT (cons +89.7% YoY) but its location and funding are the open questions. The parent's margin fell 15 bps; the subsidiary layer took margin from 6.01% to 11.65% at a 15% tax rate, partly on other auditors' reviews. Cash turned positive only because suppliers funded Rs 345 Cr of working capital, and deposits of Rs 382 Cr may or may not be free. A Rs 1,800 Cr raise one day before the deck still frames cash as improving is the sharpest tension. Several A3 items close on the filed record: D-A3-01 (fraud), D-A3-02 (investments sold at Q1 fair value via OCI), D-A3-03 (Purvi post-quarter), P-A3-06 (CFO label), R-A3-19 (single EGM item); the deck's Op PAT 134.9 is right and the release's 138.56 is wrong. Verdict sits at FLAGS, not CAVEATS, because of the governance cluster in the new auditor's first quarter. The single most useful call answer is the nature and tenor of the non-MSME payables."
