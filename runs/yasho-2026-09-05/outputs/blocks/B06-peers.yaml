analyst_note: "The peer set corroborates Yasho's directional facts (geopolitical RM inflation is real; Chinese pricing pressure is real and ongoing through FY27) but complicates or contradicts the specific numbers built on those facts: FTA timeline over-stated in the Q3 FY26 call, RM inflation magnitude a fraction of comparable peers', implied brownfield asset-turn well below the stated 2.5-4x, and most importantly a margin-EXPANSION story running opposite to every commodity/converter peer's margin-COMPRESSION experience in the same input-cost environment. None of this proves Yasho wrong - superior mix, longer RM contracts, or genuine new-business pricing power could explain it - but the peer set offers no support for it, and stage 11 should treat the margin divergence as unresolved, not corroborated."
