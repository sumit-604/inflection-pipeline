analyst_note_pass1: >
  Pass 1 covered both standalone (Notes 1-32) and consolidated (Notes 1-33)
  note sets end to end. Two internal-consistency defects (segment-note
  receivables mismatch; unexplained goodwill jump) and one opaque income
  line (Claim Income, 58% of Other Income) are AR-quality findings, not
  corpus gaps, and should be pressed directly with management. The AOC-1
  subsidiary table is the strongest evidence yet for LBF3's deck-vs-delivery
  gap because it is audited data, not a deck claim. Pass 2 should re-check
  sub-notes/footnotes on borrowings (full maturity schedule tables were
  skimmed for repetition), MSME ageing at the consolidated level (not
  located as a separate reconciled table), and the bonus-share-to-P&L
  direct reserve adjustment (Rs 155.60L) tied to Trident Mediquip's stake
  restructuring.
