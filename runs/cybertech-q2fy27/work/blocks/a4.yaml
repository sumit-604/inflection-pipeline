analyst_note: "Pre-thesis merged read; no Decision Status. Core PBT ex-OI rose from 3.46 to 6.81 Cr YoY while PAT rose 0.3%, because Other Income fell 3.21 Cr. Company EBITDA includes OI, so its 240 bps headline fall hides a 318 bps operating rise. The bear reading is strong: the margin step is one quarter old, all QoQ gain sits in the subsidiaries (incremental margin 48.9%), and government work supplied about 72% of the QoQ revenue gain. Loop 1 adds currency: FCTR was +5.54 Cr in H2 FY26 and +7.47 Cr over the year, so neither step excludes a rupee lift; USD revenue (QfM 5) separates. Q3 separates lasting from one-quarter: core PBT at or above 6.81 Cr vs at or below 4.43 Cr. Concentration is the deck's biggest fact: top client 55%, top 3 68%, basis unstated. Who bills that client (parent or subsidiaries) is unresolved because perimeter revenue is net of intercompany (QfM 27). Parent net cash is restated to 60.15 Cr at March, a 34.39 Cr H1 fall. Cash stays INDETERMINATE-WITH-DIRECTION; the 12.15 Cr liability was kept out of CFO. FLAGS rest on the unnamed 41.13 Cr injection, the 12.15 Cr equity debit and concentration. Steps 6.5 and 7 deferred (OR-30)."
