one_line_verdict: "A growing, registration-led formulation exporter with real margin expansion in the filings, but the own-vs-partner mix that drives it and the cash conversion that proves it are not disclosed."
analyst_note: "LB4 NOT FOUND in every filed document. Only filed margin statement tied to registrations is the May 2026 call: 7-8 new EU registrations by CY2027 at about 40% EBITDA, about 10% of revenue (a forecast). Export 49.65% / domestic 50.34% of FY26 revenue (AR p.222, lakhs, derived) answers geography only; ICRA says domestic buyers re-export, so domestic is not 'partner-held'. Business is single-segment, so no audited stream data exists. Sector row Pharma / CDMO accepted as nearest despite only 10% CDMO. FY26 tax rate derived 24.7% (AR p.30 lines: 2,214.62 / 8,949.27); Q2 FY27 31.3% (Q2 Pres slide 7). Commission +131.5% and distribution-cost fall are [INFERENCE] readings, each with a named separating observation in the report."
