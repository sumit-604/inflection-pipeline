analyst_note: "Single-AR constraint means no true prior-year narrative-drift comparison was possible (Phase 6D) and no multi-year exceptional-items or restatement pattern could be tested beyond FY25/FY26. Three items in this report update B02: the FY25 comparative CFO figure (Rs112.40/112.26 Cr, not Rs113.81 Cr — direction and conclusion unchanged), a refinement on DMCC (net worth still marginally positive at Rs43.20 lakh; FY26 itself was a small profit year, only the accumulated position is impaired), and one wholly new finding not in B02: the post-year-end CARE rating downgrade to Rating Watch Developing, found only in the Corporate Governance Report, absent from the financial notes as a subsequent event. All valuation implications deferred to stage 11 per Section 1B; this stage found no exit-multiple input."
