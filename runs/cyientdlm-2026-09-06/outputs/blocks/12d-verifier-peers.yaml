root_cause_note: "All nine findings share one mechanical cause and none touches content. The KAYNES and SYRMA transcript PDFs carry a filing cover page, so the PRINTED footer page number runs one or more behind the RAW PDF page number. The pipeline's page-marked text extraction stamps the RAW PDF page, and stage 6 anchored to that. The content is correct in every case and sits within the same call, a page or two from the cited location. Zero fabrications, zero misattributions, zero content errors across 45-plus discrete citations checked."
orchestrator_note: "Recorded for LESSONS. The page-marked pre-extraction stamps the raw PDF page index. Where a source PDF carries a cover page, the printed footer page and the raw page diverge by a constant offset, and an anchor is ambiguous unless it says which convention it uses. This is a pipeline-wide anchoring convention issue, not a CYIENTDLM issue, and it costs verifier time on every run that uses pre-extracted text. Candidate for /compost to promote into the extraction step or the anchor rule."
analyst_note: "Verdict discipline held throughout. No VERIFIED claim rests on a single peer anchor, no verdict was upgraded from peer silence, and no question in the injected list was skipped. No missed peer evidence was found that would have changed or strengthened an answer."
