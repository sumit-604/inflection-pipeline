analyst_note: "Capacity is not TRUALT's TAM constraint; OMC allocation is. The already-built 2,000 KLPD multi-feed
  platform can physically produce the full 5-year SOM at only ~70% utilisation, with no further capex (3C). Stage
  6 peer evidence shows the national market clearing allocation at only ~50-57% of installed capacity, a
  structural, not TRUALT-specific, ceiling. Management's two headline market-opportunity claims diverge sharply
  in credibility: the ethanol claim (Rs50,000cr, prospectus) is reasonable and holds up against independent
  cross-checks; the CBG claim ('~USD 30 billion opportunity') is off by roughly three orders of magnitude against
  the one independent market-size estimate found and should be read as promotional framing at Stage 11/13, not a
  sizing input."
