    reason: "No promoter selling identified; promoter+group holding 69.30% appears stable. Pledge/encumbrance status NOT FOUND (not assumed NIL). R R Kabel 6.05% cross-holding plus shared independent director (Chandak) flagged for B08's full verdict."
