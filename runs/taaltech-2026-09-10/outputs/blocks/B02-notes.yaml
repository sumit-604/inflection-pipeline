analyst_note: "Score is driven roughly evenly by economic and presentation defects, but the presentation defects are more decision-relevant: Note 41's wrong 'consolidated' summary and the CARO 3(iii)(a)/(d) self-contradiction sit inside the audited financial statements and signed audit report themselves, not voluntary MD&A. A reader who trusts Note 41 in isolation would compute CFO/PAT near 51% instead of the true 33%, reversing this run's FLAG-CASH. The economic defects (cash conversion, MTM-driven margin, treasury credit concentration, customer concentration) are real but each is individually traceable; none is disguised. Genuine EBIT margin (Revenue less Total Expenses, Other Income excluded) is 27.8%, the figure to carry forward, not any Other-Income-inclusive reading."
