analyst_note: "The standout Pass 3 finding is the Directors' Report vs Note 32 contradiction: the Report's standard subsequent-events paragraph denies any material change in a window that Note 32 itself shows contained a shareholder-approved, 25%-of-proceeds capital redirection. Combined with three separate instances of unrefreshed FY25 boilerplate text (Note 3.5, Note 32's own dates, Note 35) and three cross-note number mismatches (Note 29, Note 21, EPS face), this filing shows a first-full-post-IPO-year drafting-control weakness distinct from and additive to the evidenced cash-conversion deterioration. Neither pattern moves reported PAT; both bear on how much confidence to place in supporting schedules feeding Section 1B and FTTCP inputs downstream."
