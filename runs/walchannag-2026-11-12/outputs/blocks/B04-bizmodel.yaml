  - "Where are the 1,050 Lakhs of trust loans in the balance sheet, and is Rs 600 Cr FY27 revenue a company target?"
one_line_verdict: "A heavy-engineering order book business whose revenue is 69% legacy and about 31% defence, nuclear and aerospace; operating leverage is real but the mix shift, order refill and balance sheet are unproven."
analyst_note: "Sector row: revenue and the audited self-description fit industrial heavy engineering (DNAM about 31% FY26, falling from 39%), while the March 2025 order book (52% strategic) and stated direction fit defence. No multiple chosen. The DNAM share is an Acuite figure; the AR dropped it. H1 FY27 operating leverage (EBITDA before other income -503 to 1,614 Lakhs on +8,314 Lakhs revenue) is partly a base effect from the FY26 Foundry lockout. Rating p.3 gives FY26 revenue 278.11 Cr against the AR 275.19 Cr; percentages were applied to the AR base for scale only. Orders on hand and unexecuted order book are different, undefined measures. Note 1 PDF page was not marked in the extract."
