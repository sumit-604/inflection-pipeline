analyst_note: "A4's tables are clean. Every Step 1 cell, derived metric, both PAT bridges, the cash table and the pillar flags re-derive within rounding. The two arithmetic fails sit in narrative formulas whose stated results are right. Coverage is complete: 446 of 446 IDs, and fresh counts match A2 in every category. The one missing unit, the L69 signature time, is an annotation patch with no A3 or A4 effect, so the loop goes to A4, not the full chain. The substantive gap is the buy-back. A4 shows a 16.0% mechanical EPS uplift but never prices the purchase. At the inferred Rs 200 it is 22x FY26 continuing EPS and 1.16x book, at the 52-week high. It was paid from a treasury that produced 38.5% of TTM PBT. Net of forgone treasury income it is about EPS-neutral. On headline FY26 EPS it looks like 6.3x; that reading is the trap, because 71.3% of that EPS is discontinued. The receivables GREEN passed its bear test: the fall ties to cash exactly. The H1 margin bear is already carried."
