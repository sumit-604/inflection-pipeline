flags:
  - {type: FLAG-CASH-CARRYFORWARD, reason: "3A/3B name reported CFO as MISLEADING: the undisclosed FY26 AR 'Changes in Working Capital Facilities' addback (Rs 9.46 Cr FY26 / Rs 6.26 Cr FY25) flatters printed CFO in both years; true recomputed CFO is negative both years (B02 rank-1, B03). This caps how DCF can be used (4B: not applicable as primary)."}
  - {type: FLAG-SUBSIDIARY-GAP, reason: "AOC-1 confirms the deck-vs-delivery gap by subsidiary: Trident Mediquip Rs 27.32 Cr FY26 vs Rs 70 Cr deck peak (~39%, delivering); TNS Pharma Rs 5.77 Cr vs Rs 40 Cr deck peak (~14%, loss-making, negative net worth); TLL Parenterals Rs 0 vs Rs 200 Cr deck peak; TLL Wellness Rs 0.12 Cr vs Rs 10 Cr deck peak; TLL Elements Rs 0.02 Cr vs Rs 20 Cr deck peak, loss-making, negative net worth. Three of five subsidiaries are pre-revenue or near-zero-revenue against materially larger deck-claimed peaks."}
  - {type: FLAG-MARGIN-SOURCE, reason: "FY26 EBITDA margin gain (+470bps to 21.8%) came entirely from overhead absorption (employee costs -11%, other expenses -5%) while gross margin fell 690bps to 40.7% (AR MD&A p.17); this margin-gain source is finite and not pricing-power-driven, relevant to any forward margin assumption downstream."}
