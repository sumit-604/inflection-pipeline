  - {name: "Non-Retail Operations (composition undisclosed)", type: "undisclosed, likely wholesale/bulk (inference, not filed fact)", pct_of_revenue: 12.3, predictability: "L"}
  - {name: "Other Operating Income (commission + MCX hedging gain)", type: "commodity hedging/financial income booked inside revenue", pct_of_revenue: 0.5, predictability: "L"}
