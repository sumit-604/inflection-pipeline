<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rish Board Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: a games room. One top bar, then a home shelf of four game boxes, or one game table: the board on the left, the score card on the right (stacked on phones). */
:root {
  --bg: #e9edf6; --surface: #ffffff; --surface2: #f3f5fb; --ink: #1b1f36; --muted: #5d6484; --line: #d3d8e8;
  --accent: #f2711c; --accent-ink: #ffffff; --teal: #138a7d; --good: #1d8a4e; --bad: #c62f3a;
  --felt: #20604f; --felt2: #174a3d;
  --sq-light: #f0d9b5; --sq-dark: #b07d52; --sq-sel: #f6e05e; --sq-last: rgba(255, 214, 10, 0.45); --sq-check: #e5484d;
  --lred: #e5383b; --lgreen: #2b9348; --lyellow: #f4b400; --lblue: #1e6fd9;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Mukta", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 6px 20px rgba(27, 31, 54, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121528; --surface: #1c2038; --surface2: #242946; --ink: #eef0fb; --muted: #a6acc9; --line: #343a5c;
    --accent: #ff8a3d; --accent-ink: #1b1206; --teal: #3cc2b1; --good: #4cc77f; --bad: #ff6b72;
    --felt: #164437; --felt2: #0f332a; --shadow: 0 6px 22px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121528; --surface: #1c2038; --surface2: #242946; --ink: #eef0fb; --muted: #a6acc9; --line: #343a5c;
  --accent: #ff8a3d; --accent-ink: #1b1206; --teal: #3cc2b1; --good: #4cc77f; --bad: #ff6b72;
  --felt: #164437; --felt2: #0f332a; --shadow: 0 6px 22px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.bar h1 { font-size: clamp(22px, 4vw, 30px); flex: 1; min-width: 0; }
.bar h1 small { display: block; font: 600 12px/1.2 var(--font-body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.ibtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-width: 44px; height: 44px; padding: 0 12px; cursor: pointer; font-weight: 700; box-shadow: var(--shadow); }
.ibtn:hover { border-color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.small { padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mut { color: var(--muted); }
/* Home shelf */
.hello { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 14px; }
.hello label { font-weight: 700; }
.hello input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 200px; max-width: 100%; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(230px, calc((100% - 28px) / 3)), 1fr)); gap: 14px; }
.box { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; cursor: pointer; display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; box-shadow: var(--shadow); transition: transform 0.15s; min-width: 0; }
.box:hover { transform: translateY(-3px); border-color: var(--accent); }
.box .art { height: 120px; border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.box h2 { font-size: 24px; }
.box p { margin: 0; color: var(--muted); font-size: 15px; }
.box .wins { font-size: 13px; font-weight: 700; color: var(--teal); }
.credit { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
/* Game table */
.table { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .table { grid-template-columns: minmax(0, 1fr); } }
.boardwrap { width: min(100%, 78vh); margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 20px; }
.status { font-weight: 700; font-size: 17px; min-height: 1.4em; }
.seat { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); }
.seat.on { border-color: var(--accent); background: var(--surface2); }
.dotc { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,0.25); }
.opts { display: grid; gap: 8px; }
.opts .row > span { min-width: 72px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.moves { max-height: 180px; overflow-y: auto; font: 14px/1.6 var(--font-body); font-variant-numeric: tabular-nums; background: var(--surface2); border-radius: 10px; padding: 6px 10px; }
.caps { font-size: 22px; line-height: 1; min-height: 24px; letter-spacing: 1px; word-break: break-all; }
/* Chess and checkers board */
.grid8 { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%; padding: 2.4%; border-radius: 14px; overflow: hidden; background: linear-gradient(145deg, #8a5a32, #4a2c15 60%, #6b4324); box-shadow: 0 14px 34px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.18); }
.sq { position: relative; border: 0; padding: 0; margin: 0; min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; cursor: pointer; font-size: min(9vw, 9.2vh, 64px); line-height: 1; user-select: none; }
.sq.l { background: linear-gradient(145deg, #f8ead0, #ead1a6); } .sq.d { background: linear-gradient(145deg, #bd8a5b, #976640); }
.grid8.green .sq.d { background: linear-gradient(145deg, #3c8d5c, #2a6b44); } .grid8.green .sq.l { background: linear-gradient(145deg, #3c8d5c, #2a6b44); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }
.sq.last::before { content: ""; position: absolute; inset: 0; background: var(--sq-last); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sq-sel); opacity: 0.8; }
.sq.hint::before { content: ""; position: absolute; inset: 0; background: rgba(46, 196, 182, 0.55); }
.sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--sq-check) 0%, rgba(229,72,77,0.4) 55%, transparent 75%); }
.sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20, 30, 20, 0.35); z-index: 2; }
.sq .ring { position: absolute; inset: 6%; border-radius: 50%; border: 5px solid rgba(20, 30, 20, 0.35); z-index: 2; }
.sq .pc { position: relative; z-index: 3; font-size: 1.12em; transition: transform 0.12s; } .sq:hover .pc { transform: translateY(-2px); }
.pw { color: #fffdf7; background: linear-gradient(180deg, #ffffff 30%, #e6d5b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 0.6px #1a1206) drop-shadow(0 0 0.6px #1a1206) drop-shadow(0 3px 2px rgba(0,0,0,0.5)); }
.pb { color: #1c1c22; background: linear-gradient(180deg, #5a5a66 10%, #101014 70%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 0.6px rgba(255,255,255,0.7)) drop-shadow(0 3px 2px rgba(0,0,0,0.55)); }
.coord { position: absolute; font: 700 11px/1 var(--font-body); opacity: 0.7; z-index: 1; }
.coord.f { right: 3px; bottom: 2px; } .coord.r { left: 3px; top: 2px; }
.sq.l .coord { color: var(--sq-dark); } .sq.d .coord { color: var(--sq-light); }
.disc { position: relative; z-index: 3; width: 74%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 0.5em; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 3px 6px rgba(0,0,0,0.45); }
.disc.r { background: radial-gradient(circle at 35% 30%, #ff7b7f, #c1121f 70%); color: #ffe066; }
.disc.b { background: radial-gradient(circle at 35% 30%, #6b6f80, #18191f 70%); color: #ffd60a; }
.promo { display: flex; gap: 6px; flex-wrap: wrap; }
.promo button { font-size: 40px; width: 64px; height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--sq-light); cursor: pointer; }
/* Ludo and Saanp Seedi */
svg.bd { width: 100%; height: auto; display: block; padding: 2.2%; border-radius: 18px; background: linear-gradient(145deg, #8a5a32, #4a2c15 60%, #6b4324); box-shadow: 0 14px 34px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.18); touch-action: manipulation; }
.tok { cursor: pointer; transition: transform 0.12s linear; }
.tok.can circle.halo { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
.dice { width: 84px; height: 84px; border-radius: 18px; border: 0; background: linear-gradient(145deg, #ffffff, #e4e8f2); box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12), inset 0 3px 0 rgba(255,255,255,0.9), 0 6px 14px rgba(0,0,0,0.25); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 12px; cursor: pointer; }
.dice i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #4a4f6a, #0d0f1c 70%); box-shadow: inset 0 1px 2px rgba(0,0,0,0.6); place-self: center; visibility: hidden; }
.dice i.on { visibility: visible; }
.dice.roll { animation: shake 0.35s linear; }
.dice:disabled { cursor: default; opacity: 0.7; }
@keyframes shake { 0% { transform: rotate(0); } 25% { transform: rotate(-18deg); } 50% { transform: rotate(14deg); } 75% { transform: rotate(-8deg); } 100% { transform: rotate(0); } }
.dicebox { display: flex; gap: 12px; align-items: center; }
/* Overlay */
.veil { position: fixed; inset: 0; background: rgba(10, 12, 25, 0.55); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 20px; width: min(440px, 100%); display: grid; gap: 12px; box-shadow: var(--shadow); text-align: center; }
.modal h2 { font-size: 30px; }
.modal img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin: 0 auto; border: 4px solid var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#ver { position: fixed; right: 8px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font: 600 11px/1 var(--font-body); color: var(--muted); z-index: 5; }
/* Kaata Zero */
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; aspect-ratio: 1; padding: 3%; border-radius: 18px; background: linear-gradient(145deg, #8a5a32, #4a2c15 60%, #6b4324); box-shadow: 0 14px 34px rgba(0,0,0,0.35); }
.tc { border: 0; border-radius: 14px; background: linear-gradient(145deg, #fffdf6, #efe4cf); box-shadow: inset 0 -5px 0 rgba(0,0,0,0.08); cursor: pointer; display: grid; place-items: center; padding: 12%; min-width: 0; }
.tc svg { width: 100%; height: 100%; } .tc svg path, .tc svg circle { stroke-dasharray: 40; animation: drawin 0.35s ease-out; } .tc.win { background: linear-gradient(145deg, #fff3b0, #ffd166); }
@keyframes drawin { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
/* Chaar Line */
.c4 { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 1.6%; padding: 2.4%; aspect-ratio: 7 / 6; border-radius: 18px; background: linear-gradient(160deg, #2f6fe0, #123c8f); box-shadow: 0 14px 34px rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.25); }
.c4c { position: relative; border: 0; padding: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #0b1f4d, #071636); box-shadow: inset 0 4px 6px rgba(0,0,0,0.6); cursor: pointer; min-width: 0; }
.c4d { position: absolute; inset: 7%; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), 0 2px 3px rgba(0,0,0,0.4); }
.c4d.r { background: radial-gradient(circle at 35% 30%, #ff8a8d, #d1121f 65%); } .c4d.y { background: radial-gradient(circle at 35% 30%, #fff1a6, #f2b705 65%); }
.c4d.drop { animation: c4drop 0.35s cubic-bezier(.5,0,1,1); } @keyframes c4drop { from { transform: translateY(calc(var(--row) * -112%)); } to { transform: none; } }
.c4d.win { box-shadow: 0 0 0 4px #fff, 0 0 18px #fff; animation: pulse 0.9s ease-in-out infinite; }
/* Reversi */
.rdisc { position: relative; z-index: 3; width: 80%; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 3px 5px rgba(0,0,0,0.45); }
.rdisc.b { background: radial-gradient(circle at 35% 30%, #6b6f80, #111216 70%); } .rdisc.w { background: radial-gradient(circle at 35% 30%, #ffffff, #d6d9e2 70%); }
.rdisc.mini { display: inline-block; width: 20px; vertical-align: middle; } .rdisc.flip { animation: flip 0.35s ease-out; } @keyframes flip { from { transform: rotateY(90deg); } to { transform: none; } }
/* Dots and boxes */
svg.dots .ln { cursor: pointer; } svg.dots .ln:hover line.free { stroke: #8a93b8; }
@media (prefers-reduced-motion: reduce) { .tok, .box { transition: none; } .dice.roll, .tok.can circle.halo { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="ver"></div>
<script>
"use strict";
// ===================== RISH BOARD GAMES: app shell =====================
const VERSION = "Rish Board Games v2";
const TEST = /test=1/.test(location.search);
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const wait = (ms) => new Promise((r) => setTimeout(r, TEST ? 0 : ms));
let RNG = Math.random; // tests may replace it with a seeded one
const rnd = (n) => Math.floor(RNG() * n);

// ---- Saved data (this device only) ----
const GAMES = ["ludo", "chess", "carrom", "snakes", "checkers", "c4", "rev", "ttt", "dots"];
const zero = () => Object.fromEntries(GAMES.map((g) => [g, 0]));
const SAVE = { name: "Rish", wins: zero(), played: zero(), sound: true };
try { const s = JSON.parse(localStorage.getItem("rish-boards.v1") || "{}"); Object.assign(SAVE, s); SAVE.wins = Object.assign(zero(), s.wins || {}); SAVE.played = Object.assign(zero(), s.played || {}); } catch (e) { /* no storage */ }
function save() { try { localStorage.setItem("rish-boards.v1", JSON.stringify(SAVE)); } catch (e) { /* no storage */ } }
function myName() { return (SAVE.name || "Rish").trim() || "Rish"; }

// ---- Sound: a tiny synth, only after the first tap ----
let AC = null;
function snd(kind) {
  if (!SAVE.sound || TEST) return;
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
    if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime;
    const tone = (f, d, type = "triangle", v = 0.12, at = 0, f2) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + at); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + at + d); g.gain.setValueAtTime(0.0001, t0 + at); g.gain.linearRampToValueAtTime(v, t0 + at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d); o.connect(g).connect(AC.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.02); };
    const noise = (d, v = 0.2, fq = 1500, at = 0) => { const b = AC.createBuffer(1, Math.floor(AC.sampleRate * d), AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length); const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = fq; const g = AC.createGain(); g.gain.value = v; s.connect(f).connect(g).connect(AC.destination); s.start(t0 + at); };
    ({
      dice: () => { for (let i = 0; i < 5; i++) noise(0.05, 0.25, 2500 + i * 300, i * 0.06); },
      step: () => tone(660, 0.06, "square", 0.05),
      move: () => { noise(0.06, 0.35, 900); tone(220, 0.08, "sine", 0.1); },
      cap: () => { noise(0.18, 0.5, 600); tone(160, 0.25, "sawtooth", 0.08, 0, 70); },
      six: () => { tone(784, 0.1, "triangle", 0.1); tone(1046, 0.16, "triangle", 0.1, 0.1); },
      up: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, "triangle", 0.1, i * 0.08)),
      down: () => tone(500, 0.6, "sawtooth", 0.07, 0, 120),
      check: () => { tone(880, 0.12, "square", 0.08); tone(880, 0.12, "square", 0.08, 0.16); },
      win: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.18, "triangle", 0.12, i * 0.13)),
      lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.25, "triangle", 0.1, i * 0.2)),
    }[kind] || (() => {}))();
  } catch (e) { /* no sound */ }
}

// ---- Toast and pop-up ----
let toastT = 0;
function toast(msg, ms = 2200) { let t = $("toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }
function modal(html, wire) { closeModal(); const v = document.createElement("div"); v.className = "veil"; v.id = "veil"; v.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(v); if (wire) wire(v); const b = v.querySelector("button"); if (b) b.focus(); return v; }
function closeModal() { const v = $("veil"); if (v) v.remove(); }

// ---- Screens ----
let SCREEN = "home", GAME = null;
function topBar(title, sub, back = true) {
  return `<div class="bar">${back ? `<button class="ibtn" id="b-home" aria-label="Back to all games">◀</button>` : ""}<h1>${title}<small>${sub}</small></h1><button class="ibtn" id="b-snd" aria-label="Sound on or off">${SAVE.sound ? "🔊" : "🔇"}</button>${back ? "" : `<button class="ibtn" id="b-about" aria-label="About">ℹ️</button>`}</div>`;
}
function wireBar() {
  if ($("b-home")) $("b-home").onclick = () => home();
  $("b-snd").onclick = () => { SAVE.sound = !SAVE.sound; save(); $("b-snd").textContent = SAVE.sound ? "🔊" : "🔇"; snd("move"); };
  if ($("b-about")) $("b-about").onclick = about;
}
const ART = {
  ludo: `<svg viewBox="0 0 15 15" width="120" height="120" aria-hidden="true"><rect width="15" height="15" rx="1" fill="#fff"/><rect width="6" height="6" fill="#e5383b"/><rect x="9" width="6" height="6" fill="#2b9348"/><rect x="9" y="9" width="6" height="6" fill="#f4b400"/><rect y="9" width="6" height="6" fill="#1e6fd9"/><polygon points="6,6 9,6 7.5,7.5" fill="#2b9348"/><polygon points="9,6 9,9 7.5,7.5" fill="#f4b400"/><polygon points="9,9 6,9 7.5,7.5" fill="#1e6fd9"/><polygon points="6,9 6,6 7.5,7.5" fill="#e5383b"/>${[[1.8, 1.8], [4.2, 1.8], [1.8, 4.2], [4.2, 4.2]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.75" fill="#fff"/>`).join("")}</svg>`,
  chess: `<div style="font-size:84px;line-height:1"><span class="pw">♞&#xFE0E;</span><span class="pb">♛&#xFE0E;</span></div>`,

function home() {
  SCREEN = "home"; GAME = null; closeModal();
  const g = [["ludo", "Ludo", "2 to 4 players. Roll a 6 to come out, cut the others, take all four home.", "#20604f"], ["chess", "Chess", "Play the computer (Easy, Medium, Hard) or a friend. Hints and undo.", "#5a3a22"], ["carrom", "Carrom", "Pull back the striker and flick. Pocket your 9 coins and cover the red queen.", "#8a4f1d"], ["snakes", "Saanp Seedi", "Snakes and ladders, 1 to 100. Ladders take you up, snakes bite you down.", "#118ab2"], ["checkers", "Checkers", "Jump over the other pieces. Reach the end to become a king.", "#7a1f2b"], ["c4", "Chaar Line", "Drop discs into the stand. Get 4 in a line before the other side.", "#123c8f"], ["rev", "Reversi", "Trap the other colour between yours to flip it. Most discs wins.", "#1f5a3a"], ["ttt", "Kaata Zero", "❌ and ⭕. Get 3 in a row. The hard computer never loses!", "#b8860b"], ["dots", "Dots and Boxes", "Draw lines, close boxes. Most boxes wins.", "#6a4c93"]];
  $("app").innerHTML = topBar("Rish Board Games", "RishSchoolDays · Game 4 · Just live it!", false) + `
  <div class="hello"><label for="pname">Your name</label><input id="pname" maxlength="16" autocomplete="off" value="${esc(SAVE.name)}"></div>
  <div class="shelf">${g.map(([id, name, info, c]) => `<button class="box" id="g-${id}"><div class="art" style="background:${c}">${ART[id]}</div><h2>${name}</h2><p>${info}</p><span class="wins">🏆 ${SAVE.wins[id] || 0} wins · ${SAVE.played[id] || 0} games</span></button>`).join("")}</div>
  <div class="credit"><span>Made by <b>Rishabh Sharma</b>, age 9. RishSchoolDays series.</span><button class="btn small" id="h-about">About</button></div>`;
  wireBar(); $("h-about").onclick = about;
  $("pname").oninput = (e) => { SAVE.name = e.target.value.replace(/[<>]/g, "").slice(0, 16); save(); };
  for (const [id] of g) $("g-" + id).onclick = () => GMAP()[id].setup();
}

// ===================== LUDO =====================
// Board: 15 x 15 cells. The track has 52 cells; each colour starts 13 cells after the one before it.
// A token's step r: -1 in the yard, 0..50 on the track, 51..55 in its home lane, 56 = home (finished).
const LD = (() => {
  const T = [];
  for (let x = 1; x <= 5; x++) T.push([x, 6]); for (let y = 5; y >= 0; y--) T.push([6, y]); T.push([7, 0]);
  for (let y = 0; y <= 5; y++) T.push([8, y]); for (let x = 9; x <= 14; x++) T.push([x, 6]); T.push([14, 7]);
  for (let x = 14; x >= 9; x--) T.push([x, 8]); for (let y = 9; y <= 14; y++) T.push([8, y]); T.push([7, 14]);
  for (let y = 14; y >= 9; y--) T.push([6, y]); for (let x = 5; x >= 0; x--) T.push([x, 8]); T.push([0, 7]); T.push([0, 6]);
  const COLORS = [
    { id: "red", name: "Red", c: "#e5383b", off: 0, lane: [1, 2, 3, 4, 5].map((x) => [x, 7]), yard: [0, 0] },
    { id: "green", name: "Green", c: "#2b9348", off: 13, lane: [1, 2, 3, 4, 5].map((y) => [7, y]), yard: [9, 0] },
    { id: "yellow", name: "Yellow", c: "#f4b400", off: 26, lane: [13, 12, 11, 10, 9].map((x) => [x, 7]), yard: [9, 9] },
    { id: "blue", name: "Blue", c: "#1e6fd9", off: 39, lane: [13, 12, 11, 10, 9].map((y) => [7, y]), yard: [0, 9] },
  ];
  const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]);
  const abs = (ci, r) => (r >= 0 && r <= 50 ? (COLORS[ci].off + r) % 52 : -1);
  return { T, COLORS, SAFE, abs };
})();

// Red ('r', king 'R') starts at the bottom and moves up. Black ('b', king 'B') starts at the top.
// Jumping is a must. A jump that can go on must go on. A man that reaches the far row becomes a king.
const CK = (() => {
  const side = (p) => (!p ? null : p.toLowerCase());
  const start = () => { const b = Array(64).fill(null); for (let i = 0; i < 64; i++) { const r = i >> 3, f = i & 7; if ((r + f) % 2) { if (r < 3) b[i] = "b"; else if (r > 4) b[i] = "r"; } } return b; };

  const lastRow = (p, r) => (p === "r" && r === 0) || (p === "b" && r === 7);
  // Every move is {path: [from, ..., to], caps: [captured squares]}.
  function moves(b, me) {
    const jumps = [], steps = [];
    for (let i = 0; i < 64; i++) {
      const p = b[i]; if (side(p) !== me) continue;
      const dfs = (sq, path, caps, piece) => {
        let more = false; const r = sq >> 3, f = sq & 7;
        for (const [dr, df] of dirs(piece)) {
          const mr = r + dr, mf = f + df, lr = r + 2 * dr, lf = f + 2 * df; if (lr < 0 || lr > 7 || lf < 0 || lf > 7) continue;
          const mid = mr * 8 + mf, land = lr * 8 + lf, o = b[mid];
          if (!o || side(o) === me || caps.includes(mid)) continue;
          if (b[land] && land !== i) continue;
          more = true; const np = [...path, land], nc = [...caps, mid];
          if (piece === piece.toLowerCase() && lastRow(piece, lr)) jumps.push({ path: np, caps: nc }); // a man that becomes a king stops
          else dfs(land, np, nc, piece);
        }
        if (!more && caps.length) jumps.push({ path, caps });
      };
      dfs(i, [i], [], p);
      if (!jumps.length) for (const [dr, df] of dirs(p)) { const r = (i >> 3) + dr, f = (i & 7) + df; if (r < 0 || r > 7 || f < 0 || f > 7) continue; const to = r * 8 + f; if (!b[to]) steps.push({ path: [i, to], caps: [] }); }
    }
    return jumps.length ? jumps : steps;
  }
  function apply(b, m) { const n = b.slice(); const from = m.path[0], to = m.path[m.path.length - 1]; let p = n[from]; n[from] = null; for (const c of m.caps) n[c] = null; if (lastRow(p, to >> 3)) p = p.toUpperCase(); n[to] = p; return n; }

  function search(b, me, d, a, beta) {
    const ms = moves(b, me); if (!ms.length) return -100000 - d; if (d === 0) return (me === "r" ? 1 : -1) * evalR(b);
    const op = me === "r" ? "b" : "r";
    for (const m of ms) { const v = -search(apply(b, m), op, d - 1, -beta, -a); if (v >= beta) return beta; if (v > a) a = v; }
    return a;
  }
  function best(b, me, depth, noise = 0) { let bm = null, bv = -Infinity; const op = me === "r" ? "b" : "r"; for (const m of moves(b, me)) { const v = -search(apply(b, m), op, depth - 1, -Infinity, Infinity) + (noise ? RNG() * noise : 0); if (v > bv) { bv = v; bm = m; } } return bm; }
  return { start, moves, apply, best, side };
})();

const TTT = {

  start() {

// The board is 1000 x 1000 units. Coins (r 19) and the striker (r 25) slide with friction, bounce off the

    const d = [{ id: "q", c: "q", x: 500, y: 500, vx: 0, vy: 0, r: RC, m: 1 }]; let n = 0;
    const put = (x, y, c) => d.push({ id: c + n++, c, x, y, vx: 0, vy: 0, r: RC, m: 1 });
    const g = 2 * RC + 1.2;
    for (let k = 0; k < 6; k++) { const a = (k * Math.PI) / 3; put(500 + Math.cos(a) * g, 500 + Math.sin(a) * g, k % 2 ? "b" : "w"); }
    for (let k = 0; k < 6; k++) { const a = (k * Math.PI) / 3; put(500 + Math.cos(a) * 2 * g, 500 + Math.sin(a) * 2 * g, k % 2 ? "w" : "b"); }
    for (let k = 0; k < 6; k++) { const a = (k * Math.PI) / 3 + Math.PI / 6; put(500 + Math.cos(a) * g * Math.sqrt(3), 500 + Math.sin(a) * g * Math.sqrt(3), k % 2 ? "w" : "b"); }

      }

        const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r; if (dist >= min || dist === 0) continue;
