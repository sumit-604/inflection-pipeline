analyst_note: "Three things a later stage cannot rebuild from the fields. First, the lender-statement explanation (one unit left out) can only make reported figures lower than books; the Jun 2025 and Mar 2026 receivable gaps run the other way, and the March gap (4,249.05) is within 1.1% of the 4,204.84 ECL booked after filing on provisional accounts [INFERENCE]. Second, the reported cash conversion improvement (16.9 days) is mostly financing channels; before them it is 5.0 days. Third, promoter holding fell to about 40.9% because Maa Chandi (65,00,000 shares) was reclassified, not because promoters sold; AR-only arithmetic gives 40.96% and the outside-AR NSE summary shows 40.93%. Warrant tranche 1 was priced at 2.95x floor, tranche 2 at floor (outside AR). Net debt growth depends on basis: +17.16% MD&A, +4.55% Note 42, +9.27% consol."
