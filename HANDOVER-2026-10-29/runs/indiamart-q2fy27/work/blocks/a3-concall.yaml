analyst_note: "Central admission couples margin and volume. SA margin 40% is elevated 'because we are not investing heavily on the sales side' (L431-432); comfort level is 33% (L426); gross adds stay throttled until silver churn improves (L385), churn guidance withdrawn (L666). One gives: volume restarts and margin falls toward 33%, or margin holds and volume stays flat. Neither supports the YoY margin gain as run-rate. Gold/platinum 'stagnant' (L607-609) means churn now starves the upgrade funnel, leaving top-account price as the only engine (8-10% revenue, L594). Enquiry loss is recast as partly deliberate login gating, a cause absent from the Q1 call; treat as unproven. About 11% of enquiries are bought with 20-40% cannibalisation, so organic demand is weaker than the -14% print [INFERENCE, ASR]. IndiaMart Finance: Q1 'not own balance sheet' not restated; FLDG/NBFC unanswered. Promise log C1-C15: 5 on track, 3 softened, 1 missed, 6 not addressed (ratio 0.56). Prepared-remarks numbers tie to filings except CFO 135 Cr (H1 only filed) and Busy deferred +40% (call-only). All numbers ASR-heard."
