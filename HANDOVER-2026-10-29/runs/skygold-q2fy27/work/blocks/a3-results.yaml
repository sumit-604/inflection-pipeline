analyst_note: "Three threads matter more than headline growth. (1) The consolidated step-up: Q2 cons PAT grew 93% YoY vs SA 56%. The subsidiary layer now carries an implied 11.7% EBITDA margin and about 15% ETR, against 6.0% and about 25% a year ago. 62.5% of the Q2 PAT gap rests on two unnamed subsidiaries reviewed only by other auditors. Outside-India revenue nearly tripled on Rs 2.5 Cr of foreign assets. Benign reading: a higher-margin UAE or export channel. Bear reading: intra-group pricing or profit location. Subsidiary-wise P&L with eliminations separates them. (2) Cash: H1 CFO turned positive only through a 3.8x jump in trade payables, mostly non-MSME. Borrowings funded about Rs 147 Cr of net deposit placements now in other financial assets. SA net debt is -6% or +57% depending on whether those deposits are free or lien-marked. (3) Capital: a Rs 1,800 Cr QIP (1.27x cons net worth) with no stated use, a post-quarter acquisition with no consideration disclosed, unclear FY26 warrant status, and a Rs 17.3 Cr unexplained equity-to-debt move in consolidation near the Shri Rishab conversion. No transcript exists; every FS and AMB item goes to A4 for the 31-Oct call."
