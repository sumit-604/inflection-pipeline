analyst_note: "Three points a later stage cannot rebuild. (1) Conservative TAM 94,100 Cr is the three end-use pools whole; the real filter is SAM, which drops the automobile product class (28,784 Cr) and adds the solutions proxy; mgmt claim is 1.56x SAM. Capability, channel and customer filters are NOT FOUND, so SAM is an upper bound. (2) Share-gain pp rules fail at 0.64% share: +1pp equals about 634 Cr, more than the 582 Cr of capacity headroom at FY26 mix. Capacity binds first, so SOM rides market growth (domestic 16.5% mix-weighted India CAGR, exports 8.39% global). (3) The central SOM sits below the H1 FY27 annualised run-rate; carry both paths and let Stage 11 pick on forward evidence, not on this block."
